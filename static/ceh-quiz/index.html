n. This type of attack falls into the same category of input validation flaws as cross-site scripting (XSS), cross-site request forgery (CSRF), and SQL injection. Which type of web server attack is Elena most likely demonstrating?","o":["Password Cracking Attack","HTTP Response Splitting Attack","Directory Traversal Attack","Web Cache Poisoning Attack"],"a":[1],"e":"正確答案是 HTTP 回應分拆攻擊。 CEH 網路伺服器安全材料解釋，HTTP 回應分拆是一個輸入驗證缺陷，其中使用攻擊者控制的輸入來將單個 HTTP 回應分解為多部分，通常透過將歸位字元和線上飼料分解器注入伺服器生成頭或相關輸出。問題指出，一個精心設計的請求是作為兩個單獨的請求處理的，並將這一弱點置於與 XSS、CSRF 和 SQL 注入相同的廣泛輸入-驗證家族中。 這種設定與回應分解很相匹配，這取決於使用者提供的資料在插入伺服器通訊結構之前的不當驗證。密碼破解與網路回應形成無關， 目錄 traversal 涉及檔案路徑濫用，而 Web 快取中毒則側重於向其他使用者提供的被損壞的快取回應。 CEH 材料將 HTTP 回應分拆作為經典的 web 伺服器攻擊，可導致惡意重定向，頭注入，快取操縱，或送出攻擊者控制。內容。由於所編譯的輸入導致伺服器將應該是一個單一的通訊分離成多個回應部分，所以最準確的分類是HTTP 回應分拆攻擊。","s":"term"},{"n":365,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester is assessing a web application that employs secure, HTTP-only cookies, regenerates session IDs upon login, and uses strict session timeout policies. To hijack a user ' s session without triggering the application ' s security defenses, which advanced technique should the tester utilize?","o":["Perform a session token prediction by analyzing session ID entropy and patterns","Conduct a network-level man-in-the-middle attack to intercept and reuse session tokens","Execute a Cross-Site Request Forgery (CSRF) attack to manipulate session states","Implement a session fixation strategy by pre-setting a session ID before user authentication"],"a":[0],"e":"當 HTTPS，HTTP-只使用旗等標准保護，和工作階段再生時，CEH 教導，可預見工作階段標識器成為工作階段劫持.工作階段權杖預測的少數剩餘途徑之一，涉及分析工作階段 ID 範圍內的 en，隨機，或生成模式，以數學推斷出未來或有效的符號。 如果應用程式使用微弱的隨機化演算法，不充分的 py 源，或可預測的序列，攻擊者可能會生成有效的工作階段ID MitM 擷取或 CSRF 操縱等技術不繞道強大的運輸層保護和 Cookie 限制。 工作階段固定失敗，因為應用程式在登入時重生了工作階段 ID，使預設的識別符號無效。 因此，劫持被保護的工作階段的先進和 CEH 對接方法透過側道或圖案分析來預測工作階段 ID。"},{"n":366,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"A penetration tester is assessing a company ' s executive team for vulnerability to sophisticated social engineering attacks by impersonating a trusted vendor and leveraging internal communications. What is the most effective social engineering technique to obtain sensitive executive credentials without being detected?","o":["Develop a fake social media profile to connect with executives and request private information","Conduct a phone call posing as the CEO to request immediate password changes","Create a targeted spear-phishing email that references recent internal projects and requests credential verification","Send a mass phishing email with a malicious link disguised as a company-wide update"],"a":[2],"e":"CEH 將魚叉式網路釣魚歸類為一種目標明確，由研究驅動的社交工程技術，將資訊切合於受害者的角色，責任和當前的組織活動。當攻擊者提及具體的內部專案，人員姓名，供應商關係，或操作細節時，資訊看起來真實並繞過正常的懷疑。 高管尤其脆弱，因為他們經常收到敏感的業務更新，並與供應商和合作伙伴密切合作，成為定製欺騙的首要目標。 CEH 強調，由於個性化增加了信任，魚叉式網路釣魚比一般的打字要有效得多。 社交媒體的嘗試和大規模打字缺乏針對性並引起懷疑。 在手機上冒用 CEO 更危險，更能被察覺，因為即時的人類互動。 一個有針對性的長矛釣魚電子郵件引用內部專案，最符合 CEH 描述的高階社交工程策略。"},{"n":367,"c":"密碼學","ce":"Cryptography","t":"long","q":"Michael, an ethical hacker at a New York-based e-commerce company, is evaluating the security of their online payment system after a recent incident where fraudulent transactions went undetected. His investigation reveals that the system uses an asymmetric encryption algorithm to ensure the authenticity of payment confirmations. He finds that the algorithm employs a public-key cryptosystem, where the sender signs the transaction with a private key, and the recipient verifies it using a corresponding public key located in a directory. During his test, Michael intercepts a signed message and notices that the algorithm supports modular exponentiation for generating digital signatures, a process critical to verifying the identity of the signatory. He aims to assess if the algorithm ' s configuration could be vulnerable to a meet-in-the-middle attack due to its key structure. Which asymmetric encryption algorithm should Michael identify as the one used by the payment system?","o":["Diffie-Hellman","DSA","RSA","ElGamal"],"a":[2],"e":"正確答案是 RSA。 CEH 密碼學覆蓋範圍將 RSA 識別為被廣泛用於加密和數位簽章的公開金鑰加密系統，並特別注意到RSA 依賴於模組演算法和情境說明傳送者用私密金鑰簽名，接收者用相應的公開金鑰認證，這與基於 RSA 的公用金鑰基礎設施中的標準數位簽章使用相匹配。 CEH 材料還將 RSA 描述為事實上的不對稱標準並強調其在認證，保密和不否定方面的作用。 Diffie-Hellman 主要是一種金鑰交換演算法，並不最適合這裡所描述的簽名工作流程。 DSA 是一個數位簽章演算法，但是模組化的解說線索與對加密的廣泛支援，簽名在 CEH 風格的考試框架中更直接地指向 RSA。 ElGamal 也支援 加密， 並使用 和簽名， 但 CEH 引用一致顯示 RSA 作為標準答案當問題結合了 public/私密金鑰簽名， 基於目錄的公開金鑰校驗， 並把數字簽字部署納入主流。 從 CEH 匯出視角， RSA 是支付系統不對稱演算法最準確的識別。","s":"term"},{"n":368,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"_____ is a set of extensions to DNS that provide the origin authentication of DNS data to DNS clients (resolvers) so as to reduce the threat of DNS poisoning, spoofing, and similar types of attacks.","o":["Resource transfer","Resource records","DNSSEC","Zone transfer"],"a":[2],"e":"正確答案為 C。 DNSSEC(網域名稱系統安全擴充套件)。 DNSSEC 是一款安全擴充套件的集合，旨在保護網域名稱系統(DNS)免受 DNS 快取中毒等攻擊，DNS 欺騙，並偽造出 DNS 回應。 傳統的 DNS 最初並沒有設計有強大的身分驗證機制，這使得它容易受到攻擊者的影響，他們可以透過操縱 DNS 記錄來將使用者轉向惡意網站。 DNSSEC 透過使用公開金鑰密碼學和數位簽章來驗證 DNS 資料的真實性和完整性來解決這一弱點。 DNS 解析器收到回覆後，可以驗證與 DNS 記錄相關的數位簽章，以確保資訊來自合法的 DNS 區，在傳輸過程中沒有被更改。選項 A(資源轉移)不是 DNS 安全機制。選項 B(資源記錄)是標準 DNS 資料庫條目，如 A，AAAA，MX，和 CNAME 記錄。 選項 D(Zone transfer)是 DNS 伺服器之間使用的 DNS 複製機制，不提供認證或防範欺騙。 CEH 應試提示:DNSSEC = DNS 認證 + 誠信驗證 + 防範 DNS 毒化和 欺騙 襲擊。","s":"term"},{"n":369,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"A regional healthcare provider in Portland, Oregon, recently migrated its patient scheduling portal to a new cloud platform. Within days, multiple patients reported that when searching online for the clinic's appointment system, they were directed to a website that looked identical to the official portal. The fraudulent page appeared prominently in search engine results and prompted users to log in using their patient credentials. The URL closely resembled the legitimate domain name, and no internal DNS servers had been altered within the organization's infrastructure. Security analysts later determined that the attacker had created a convincing replica of the portal and manipulated search visibility so that unsuspecting users would voluntarily navigate to the malicious site. Which type of social engineering technique best explains this attack?","o":["Whaling","Pharming","Spear Phishing","Spimming"],"a":[1],"e":"正確答案是 B。 Pharming。該情境描述使用者被引導到一個與合法入口網站緊密相近並隨後被促使提交認證資訊的欺詐網站。 在現有的選項中，這與緻密最為一致，因為關鍵行為是將使用者的網路流量重定向或誤向到一個為收割認證資訊而設計的假網站。 符合 CEH 社交工程 材料描述用 filshing 相關變體來改變使用者的網路流量， 並稱其為\"無誘餌地進行filshing\"。 同一參考文獻將 spimm 區分為針對高層高管的即時通訊和捕鯨。 CEH 網路攻擊材料也解釋攻擊者可能使用看起來合法的假網站從被害者那裡擷取登入細節。備選 A。 捕鯨是不正確的，因為捕鯨針對的是高階主管或高價值的個人。選項 C。 魚叉式網路釣魚是不正確的，因為魚叉式網路釣魚是傳送給某個特定個人或小群體的定向打字資訊，通常是透過電子郵件傳送的。選項 D。 spimming 是不正確的，因為 spimming 涉及透過即時訊息平台傳送的垃圾郵件。選項 B。 發火是最好的答案，因為攻擊會引導使用者到一個假的入口，其中認證資訊是收穫。因此，最好的答案是 B。 Pharming。","s":"term"},{"n":370,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"An Nmap SMTP enumeration script returns valid usernames. What misconfiguration is being exploited?","o":["SMTP VRFY/EXPN/RCPT commands exposed","SMTP authentication bypass","Misconfigured MX records","STARTTLS disabled"],"a":[0],"e":"這個方案展示了 CEHv13 網路列舉.SMTP 伺服器中描述的一種經典的列舉技術可以暴露出 VRFY，EXPN，和 RCPTTO等命令，這些命令可以被濫用來驗證使用者帳戶。當這些命令不加限制地被啟用時，攻擊者可以不認證地列出有效的使用者名稱。 所使用的 Nmap 指令碼明確利用了這些命令，確認了設定錯誤。選項 B 是不正確的，因為認證沒有被繞過。 選項 C 涉及 DNS 路由，而不是使用者列舉。 選項 D 涉及加密，而不是列舉能力。 CEH v13 強烈建議取消或限制 SMTP 使用者驗證命令。 因此， 選項 A 是正確的。","s":"term"},{"n":371,"c":"密碼學","ce":"Cryptography","t":"long","q":"Michael, an ethical hacker at a New York-based e-commerce company, is evaluating the security of their online payment system after a recent incident where fraudulent transactions went undetected. His investigation reveals that the system uses an asymmetric encryption algorithm to ensure the authenticity of payment confirmations. He finds that the algorithm employs a public-key cryptosystem, where the sender signs the transaction with a private key, and the recipient verifies it using a corresponding public key located in a directory. During his test, Michael intercepts a signed message and notices that the algorithm supports modular exponentiation for generating digital signatures, a process critical for verifying the identity of the signatory. He aims to assess if the algorithm's configuration could be vulnerable to a man-in-the-middle attack due to its key structure. Which asymmetric encryption algorithm should Michael identify as the one used by the payment system?","o":["Diffie-Hellman","RSA","ElGamal","DSA"],"a":[1],"e":"該演算法描述得最精確地匹配了 RSA。 CEH 密碼學覆蓋範圍，解釋出 RSA 是一個被廣泛使用的公用金鑰加密系統，既支援加密又支援數位簽章。 在典型的以 RSA 為主的簽名過程中，傳送者生成了訊息的雜湊並應用了他們的私密金鑰使用模組化的 expensation 來建立數位簽章。 接收者然後使用寄件者的公開金鑰驗證簽名，也透過涉及大質數和模數的模組化活化操作。 情境具體參考生成數位簽章的模組化活化活化，是 RSA 中定義數學活化操作。 Diffie-Hellman 主要是一種金鑰交換演算法，本身不提供數位簽章，它使雙方能夠就不安全的通道建立共同的秘密，但不會透過簽名直接認證訊息。ElGamal 確實支援加密並可以被修改用於簽名，但在標準 CEH 導向的上下文中， RSA 是支付系統中公用金鑰加密和數位簽章最常被引用的演算法。 DSA 嚴格來說是一種數位簽章演算法，不提供加密的功能；而提示則描述了一個更廣泛的公用金鑰加密系統，用於支付確認的真實性，它更直接地與 RSA 的雙重能力相配合。此外，RSA 對從目錄中儲存和取回的金鑰對的依賴符合企業支付基礎設施中公用金鑰校驗的描述，因此 RSA 是正確的識別。","s":"term"},{"n":372,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"The configuration allows a wired or wireless network interface controller to pass all traffic it receives to the Central Processing Unit (CPU), rather than passing only the frames that the controller is intended to receive. Which of the following is being described?","o":["Promiscuous mode","Port forwarding","WEM","Multi-cast mode"],"a":[0],"e":"正確答案是 A， 因為描述匹配了多發模式。 在正常操作中， 一個網路介面卡處理 訊框 被傳送到它自己的 MAC 位址， 廣播 訊框， 或相關的 多播 訊框， 而忽略了不是它想要的 訊框。 在多發模式中， NIC 的傳遞全部收到 訊框， 直至作業系統 或 封包擷取 檢查工具。 CEH 嗅探 概念形容這是封包嗅探器的關鍵要求 : NIC 被放入了混雜模式，這樣它就可以聽取其片斷上傳輸的所有資料，即使流量沒有被傳送到 NIC。 符合 CEH 的材料中也表示，嗅取器需要卡片以混雜模式執行，因此 NIC 抓取訊框而不論位址如何。 連接埠轉發在埠或主機之間重定向流量，WEM 不是所描述的網路相通行為， 和多播模式只處理多播流量。","s":"term"},{"n":373,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"At Liberty Mutual ' s cybersecurity operations center in Boston, network engineer Marcus is troubleshooting a critical issue during peak transaction hours. Multiple VLANs are experiencing intermittent access delays, and several endpoints including those on isolated VLANs are receiving network traffic not intended for them, raising concerns about data exposure. Marcus notices that the issue began after a newly imaged workstation used by an intern named Lisa was connected to a trunk port in the server room. Switch logs indicate abnormal traffic patterns overwhelming the network. Which sniffing technique is Lisa ' s workstation most likely using to cause this behavior?","o":["DNS Cache Poisoning","ARP Poisoning","MAC Flooding","Switch Port Stealing"],"a":[2],"e":"症狀強烈匹配 MAC 位址泛洪，這是 CEH 在基於交換器的網路攻擊下討論的經典第 2 個嗅探相關攻擊。 Ethernet 交換器保持了將 MAC 位址對映到物理交換器連接埠的 CAM 表。 本表允許交換器將訊框轉發到正確的目的連接埠，在 MAC 位址泛洪攻擊 中，攻擊者會產生非常多的訊框 和 偽造的，隨機來源 MAC 位址 的流量，目標是溢位交換器 CAM 表，從而無法再可靠地儲存合法的 MAC 到連接埠的對映。當 CAM 表是滿的或不穩定的時，許多交換器進入失效開放狀態被泛洪訊框從多個埠運出，其行為更像是為未知目的地運出集線器。這導致馬庫斯所觀察到的準確情況:在應該被隔離的段上安裝的裝置開始接收正常情況下不會看到的流量，整體效能會因為過度的廣播類轉發而退化。 提示還提及\"異常流量模式壓倒了網路\"，它與大量訊框注入毒藥或溢位 CAM 表所需的高容量注入一致。 ARP 欺騙主要透過操縱 IP-至 MAC 的 VLAN 內繪圖來引導透過攻擊器的流量，但一般不會造成廣泛泛洪和多起 VLAN 之間的普遍延遲。 DNS 快取中毒影響名稱解析而不是第 2 層轉發行為。 交換器連接埠偷盜目標為特定受害者 MAC 的入行，以重定向該主機的流量，但廣泛泛洪和。超載指標在 MAC 位址泛洪中更具特質。 因此，MAC 位址泛洪是這種情境中最有可能的技術。","s":"term"},{"n":374,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"You are a security analyst at Sentinel IT Services, monitoring the web application of GreenValley Credit Union in Portland, Oregon. During a log analysis, you identify an SQL injection attempt on the customer login portal, where the attacker inputs a malicious string to manipulate the query logic. The application mitigates this by replacing special characters with their escaped equivalents to prevent query manipulation before the query is executed, ensuring the SQL statement remains unchanged. Based on the observed defense mechanism, which SQL injection countermeasure is the application employing?","o":["Perform user input validation","Encoding the single quote","Restrict database access","Use parameterized queries or prepared statements"],"a":[1],"e":"描述的行為與 CEH 材料中通常被指為逃避或編碼特殊字元的對應措施相匹配，最顯著的是單引號字元。 SQL 注入經常依賴在 SQL 語句執行前， 當一個應用程式用逃出等值替換特殊字元時， 它試圖確保輸入被純作為資料處理， 而不是執行SQL 語法。一個經典的例子就是根據資料庫規則，將單個引文轉換成所逃出的形式，如\\ “ 或翻倍為”。透過這樣做，資料庫 解析器將引文解釋為字串值的一部分， 防止攻擊者終止字串並改變查詢邏輯。因此，選項 B 最合適，因為它精確地描述了編碼或逃避單引出，而單引出是 SQL 注入有效酬載中最常用的目標分出者。 選項 A，使用者輸入驗證，範圍更寬泛並通常指允許將接受的字元和格式列入清單，但問題具體強呼叫被忽略等同物替換，而不是拒絕無效輸入。 選項 D，參數化的查詢或已準備的語句，是 CEH 指導中推薦的最強的現代控制，因為它將程式碼與 API 級別的資料相分離，但與字元逃出不同，不依賴重寫輸入字元。 選項 C 限制損壞而並不妨礙注入。 被觀察到的機制顯然是單引號編碼。"},{"n":375,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at a technology startup in Austin, Texas, an ethical hacker is tasked with evaluating defenses against stealthy scanning techniques. She selects an approach that involves sending TCP packets with no flags, relying on the way target systems respond to infer whether ports are open or closed. This allows her to remain less visible to intrusion detection systems compared to a full handshake. Which scanning method is she using?","o":["TCP Connect Scan","FIN Scan","NULL Scan","ACK Scan"],"a":[2],"e":"所描述的方法- 傳送 TCP 封包 沒有旗標設定- 是一個 NULL 掃描。 在 TCP 頭名術語中，一個 NULL 封包已清除了所有控制旗( 無 SYN， ACK， FIN， RST， PSH， URG) 掃描器然後解釋目標的反應行為推斷出連接埠狀態。 傳統上， 用於許多 TCP/IP 堆疊， a 閉合的 連接埠 與 RST 反應， 開啟的 連接埠 可能未回覆( 靜默)。 因為 封包 與 TCP 狀態機器中的任何有效狀態不相適應。此行為可以因 OS 而變化 和過濾裝置， 但最明確的特徵是\"無旗\"探測器。畫面也突出隱形: 與TCP 連線掃描相比， 完成一個完整的三向交握 並且容易記錄， NULL 掃描可以不那麼明顯 因為它們避免了正常的連線設定。一些入侵探測系統將大量精力集中在重複的 SYN 握手上。 或已完成的連線； 不尋常的旗子掃描可能透過弱的偵測滑倒， 儘管現代的 IDS/IPS 仍然可以探測到他們。為什麼其他選項不正確 :TCP Connect Scan (A)使用作業系統的接通()呼叫來建立完整的 TCP 連線；它不是一個\"無旗\"技術，一般是噪聲。 FIN Scan (B) 以 FIN 旗集傳送 封包；是一種不同的\" stealth\" scan 型別，但不是\"沒有旗標\"。 ACK Scan (D) 以 ACK 旗集傳送封包，通常用於對映防火牆規則(被過濾 vs 未過濾)，不以同樣方式確定開啟的對已關閉的埠，同樣也不是\"沒有旗標\"。因此，掃描方法是 C.NULL 掃描。","s":"term"},{"n":376,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"During a penetration test at Sunshine Media ' s streaming platform in Miami, ethical hacker Sofia Alvarez examines whether the company ' s web server exposes sensitive resources through poor configuration. She finds that a crawler directive at the server ' s root allows unintended indexing of restricted areas. This oversight reveals internal paths that may expose hidden links, confidential files, or other sensitive information. Which technique is Sofia most likely using in this assessment?","o":["Vulnerability Scanning","Information Gathering from robots.txt File","Web Server Footprinting/Banner Grabbing","Directory Brute Forcing"],"a":[1],"e":"設想方案直接指向從機器人.txt 檔案中蒐集資訊。一個機器人.txt 檔案一般位於網站的根部(例如: https://example.com/robots.txt))，意在指示搜尋引擎爬行者，哪些路徑應該或不應該索引。 在網路偵察期間，測試者經常審查機器人。 txt，因為它可以無意中披露該組織希望仍然模糊的敏感目錄，行政面板，中轉路徑，備份位置或限制區域。劇情明確規定索菲亞在\"伺服器\"根部發現了\"一個爬行者指令\"，即\"允許對限制區進行意想不到的索引\"，而這個\"揭示出內部路徑\"，正是這種滲出可能來自錯設定或過度揭示爬行者指令。這被認為是一個早期的偵察/資訊採集技術，因為它不需要被開發，它利用了可公開取得的設定提示來對映應用程式的隱藏結構。即便機器人.txt 被正確使用，列出的被禁條目仍然可以作為有趣目標的行進圖；如果設定不正確(例如允許索引或曝光敏感路徑)，可以透過幫助這些路徑在搜尋結果中表面來增加曝光，或者被攻擊者更快地發現。為什麼其他選項不準確:弱點掃描(A)意味著使用掃描器來識別已知的缺陷；在此，測試者正在手動/戰略性地檢查一個爬行者指令，以取得已暴露的路徑。 Web 伺服器 Footprinting/Banner Grabbing (C) 專注於透過頭或回信來識別伺服器型別/version 和技術，而不是從爬行者指令中發現隱藏路徑。目錄 Brute Forcing (D) 使用單詞清單來猜取目錄；Sofia 的發現出自一個被披露的路徑清單，而不是野蠻-武力猜想。因此，這一技術是B.Information Guesting from robots.txt File。","s":"term"},{"n":377,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A payload causes a significant delay in response without visible output when testing an Oracle-backed application. What SQL injection technique is being used?","o":["Time-based SQL injection using WAITFOR DELAY","Heavy query-based SQL injection","Union-based SQL injection","Out-of-band SQL injection"],"a":[0],"e":"此情境精確匹配基於時間的 Blind SQL 注入，這是在 CEH v13 Web 應用程式入侵中詳述的一種技術。 當應用程式壓制出錯訊息並消毒輸出時，攻擊者依靠回應時間來推斷注入的 SQL 語句是否被執行。在基於時間的 SQL 注入中，攻擊者會注入出資料庫特有延遲函式(如 WAITFORDELAY，DBMS_LOCK.SLEEP，或 SLEEP())。 如果被注入的條件屬實，資料庫會暫停執行，導致明顯的延遲。所描述的關鍵指標--沒有可見的輸出，但增加了回應時間--是基於時間的 SQL 注入. CEHv13 的經典跡象，說明這種方法在下述情況下特別有用:錯誤被隱藏 UNION 查詢失敗產出未反映基於聯盟的和無帶子的 SQL 注入需要資料外洩通道或可見輸出，即:此處不在此列。 “ 基於重置查詢” 不是正式的 CEH 分類。因此，選項 A 是正確答案。","s":"term"},{"n":378,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"In Seattle, Washington, ethical hacker Mia Chen is tasked with testing the network defenses of Pacific Shipping Co., a major logistics firm. During her penetration test, Mia targets the company ' s external-facing web server, which handles customer tracking requests. She observes that the security system filtering traffic to this server analyzes incoming SSH and DNS requests to block unauthorized access attempts. Mia plans to craft specific payloads to bypass this system to expose vulnerabilities to the IT department. Which security system is Mia attempting to bypass during her penetration test of Pacific Shipping Co. ' s web server?","o":["Stateful Multilayer Inspection Firewall","Application-Level Firewall","Packet Filtering Firewall","Circuit-Level Gateway Firewall"],"a":[1],"e":"一個應用程式級防火牆，通稱應用程式級閘道器或代理防火牆，在應用層檢查流量並強制執行基於特定應用程式協定和命令的規則。在符合 CEH 的周邊防禦覆蓋中，這種防火牆型別因其能夠理解協定的行為和內容，用於 DNS 和 SSH 等服務而有所區別，而不僅僅依賴於 IP 位址，埠，和基本連線狀態。問題陳述了過濾系統\"分析收到的 SSH 和 DNS 請求阻止未經授權的存取嘗試\"，該措辭直接指向應用意識檢查:它正在評價協定-特定請求，而不僅僅是允許或拒絕基於連接埠號碼的流量。 封包過濾 防火牆一般使用網路和傳輸層資訊，如源和目的地 IP，協定，和連接埠，不解析 DNS 查詢或 SSH 談判細節來決定。 一個電路級閘道器防火牆專注於驗證工作階段的建立和連線屬性，一般不深入檢查工作階段內部的應用程式命令。 狀態多層的檢查防火牆可以追蹤連線狀態，有時可以包含更深的檢查，但 CEH 術語中最強和最明確的匹配\"分析SSH 和 DNS 請求\"是應用級的防火牆，它使用代理或協定引擎來剖析並過濾應用流量。從倫理測試的角度來說，試圖“設計出特定的有效酬載”往往涉及測試防火牆如何驗證協定欄位，處理錯誤的請求，或者執行應用指令的政策。 防禦人員透過嚴格的代理政策設定，強力的協定驗證，修補程式，伐木，以及將曝光服務限制在僅需要的範圍之內來減輕這些風險。","s":"term"},{"n":379,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"A mid-sized manufacturing firm in Des Moines, Iowa reported that several employee workstations were periodically communicating with an unfamiliar external server over an IRC channel. The affected systems showed no visible interface for remote control, yet investigators confirmed that the machines were receiving instructions and executing distributed traffic bursts at scheduled intervals. Further review revealed that the initial infection occurred after employees opened a phishing email attachment. Once executed, the infected systems silently connected outward and began awaiting commands from a centralized remote controller. Determine the Trojan classification that best matches this behavior.","o":["E-banking Trojan","Rootkit Trojan","Botnet Trojan","Backdoor Trojan"],"a":[2],"e":"正確答案是 C。 殭屍網路 木馬程式。劇情描述透過釣魚附著被感染的系統，靜默地連線到一個集中的指令與控制伺服器，等待指示，並執行分散式流量暴發。 這是殭屍網路的特徵。 符合 CEH 的材料解釋道，殭屍網路通常透過使用木馬程式馬在受害者系統上安裝一個 bot 來建立。 被執行後，受害者系統就會被感染並等待指揮控制處理器的指示。 處理器然後向被感染的系統，或 bots 發出指令來進行分散式阻斷服務活動等攻擊。 另一種提法還將殭屍網路特洛伊人定義為用來感染多套系統的特洛伊人，然後一起使用被破壞的系統來攻擊一個受害者系統，通常用於分散式阻斷服務攻擊。選項 A。 電子銀行木馬程式是不正確的，因為電子銀行特洛伊人專注於盜竊銀行認證資訊或操縱金融交易。選項 B。 Rootkit 木馬程式是不正確的，因為一個 Rootkit 木馬程式專注於隱藏惡意活動或者在低系統級別上保持隱形。選項 D。 後門 木馬程式是不正確的，因為一個後門 木馬程式提供未經授權的遠端存取，但跨多個被感染系統的協同指令與控制行為最能匹配一個殭屍網路 木馬程式。因此，最好的答案是 C。 殭屍網路 木馬程式。","s":"term"},{"n":380,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"As part of a passive reconnaissance engagement for a university research network, you are tasked with mapping potential administrative exposure points across .edu domains. Your objective is to identify web pages that might allow privileged backend access, such as misconfigured administrative interfaces, using only publicly indexed information. To ensure efficiency and compliance, you decide to use advanced Google search operators to refine your search results. Your goal is to locate URLs across educational domains that may contain restricted backend functionality. Which of the following search strings would most effectively support this goal?","o":["site:.edu filetype:pdf intitle: \" admin \"","intitle: \" admin login \" site:.edu","site:.edu inurl:admin","inanchor: \" backend access \" site:.edu"],"a":[2],"e":"問題集中於被動偵察使用 Google 高階搜尋操作器，這種在 CEH 材料中通常被稱作\"Google 駭客\"或\"Google Donrking\"的技術，這種方法在不直接與目標系統互動的情況下，利用公開索引的資料，使其成為非侵入性偵察的方法，在這裡的目標是在.edu 域內定位可能暴露的行政介面。選項 C， 站點:.edu inurl: admin， 是用於此目的的最有效查詢。 站點操作員將結果限制在.edu 頂級域上， 確保只搜尋教育機構。站點操作員過濾到 URL 本身中出現的“ admin” 一詞的頁面。 行政面板和後端管理介面經常包括直接在 URL 路徑中的管理員，管理員，或管理員等名詞。 因此，此搜尋字串增加了發現已曝光的登入出入口或後端目錄的可能性。選項 A 專注於標題中\"admin\"的 PDF 檔案，這不太可能顯示活動的行政介面。 選項B 搜尋標題中\"admin 登入\"的頁面，可能發現登入頁面，但比 URL 結構過濾更準確。 選項 D 搜尋錨地文字引用，不會直接識別實際的 admin 頁面。在 CEH 方法中，如 inurl:admin 等正確建構的 Google dorks 與站點特定過濾相結合，在保持被動偵察紀律的同時，有效識別了被曝光的資源。","s":"term"},{"n":381,"c":"雲端運算","ce":"Cloud Computing","t":"short","q":"A critical flaw exists in a cloud provider's API. What is the most likely threat?","o":["Physical security breaches","Unauthorized access to cloud resources","DDoS attacks","Compromise of encrypted data at rest"],"a":[1],"e":"在 CEH v13 雲端運算中，API 被確定為管理雲資源的主要控制平面。 雲 API 中的弱點可以讓攻擊者繞過認證，提升權限，並操縱資源。未經授權的存取可能導致:資料曝光資源濫用帳戶接管雲環境內平向運動人身安全(可選 A)和加密在休息(可選 D)與 API 缺陷無關。 DDoS 攻擊(可選 C)是可能的，但不是 API 弱點的主要風險。因此，選項 B 是正確的。","s":"term"},{"n":382,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"A cybersecurity team identifies suspicious outbound network traffic. Investigation reveals malware utilizing the Background Intelligent Transfer Service (BITS) to evade firewall detection. Why would attackers use this service to conceal malicious activities?","o":["Because BITS packets appear identical to normal Windows Update traffic.","Because BITS operates exclusively through HTTP tunneling.","Because BITS utilizes IP fragmentation to evade intrusion detection systems.","Because BITS traffic uses encrypted DNS packets."],"a":[0],"e":"認證道德駭客(CEH)惡意軟體威脅模組解釋攻擊者經常濫用合法的系統服務來將惡意流量與正常的系統行為相混合。 背景智慧傳輸服務(BITS)是一種 Windows 服務，旨在使用閒置的網路頻寬來傳輸背景中的檔案。攻擊者利用 BITS，因為其流量與合法的 Windows 更新流量相近，通常透過防火牆和代理伺服器允許。 CEH 檔案指出，BITS-基於惡意軟體可以下載有效酬載，上傳被竊取的資料，並保持持久性而不會觸發安全警報。選項 A 是正確的，因為 BITS 流量看起來合法並值得信賴，使得安全裝置難以區分惡意使用。選項 B 不正確 因為在 BITS 不完全透過 HTTP 隧道執行； 3。 它主要以合法的方式使用 HTTP/HTTPS。選項 C 是不正確的，因為 IP 分解不是 BITS 的核心特徵。選項 D 不正確，因為 BITS 不依賴加密的 DNS 流量。 CEH 強調，使用像 BITS 這樣的本機工具的地外活(LotL)技術，由於其隱蔽性和可靠性，越來越受到攻擊者的青睞。"},{"n":383,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"Which sophisticated DoS technique is hardest to detect and mitigate?","o":["Distributed SQL injection DoS","Coordinated UDP flood on DNS servers","Zero-day exploit causing service crash","Smurf attack using ICMP floods"],"a":[0],"e":"CEH v13 將應用程式層 DoS 攻擊歸類為最難發現並減輕。 分散式 SQL 注入 基於 DoS 利用 壓倒性後端系統進行資料庫查詢處理，並帶有惡意但戰術上有效的請求。與量子攻擊不同，這種方法會產生低頻寬，高影響流量，看起來是合法的。傳統的 DDoS 保護往往無法識別出這種流量，特別是當它瞄準線上銀行等經認證的服務時。 UDP 泛洪，藍精靈攻擊和以ICMP 為主的攻擊是眾所周知的，隨著速率限制和過濾而更容易被減輕。 零時差開發引起服務中斷，但主要不是 DoS 技術。 CEH v13 強調應用層 DoS 攻擊與正常流量模式無縫地相融合，使得它們異常具有挑戰性。 因此，選項 A 是正確的。","s":"term"},{"n":384,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"While assessing a web server, a tester sends malformed HTTP requests and compares responses to identify the server type and version. What technique is being employed?","o":["Fingerprinting server identity using banner-grabbing techniques","Sending phishing emails to extract web server login credentials","Conducting session fixation using malformed cookie headers","Injecting scripts into headers for persistent XSS attacks"],"a":[0],"e":"CEH v13 解釋指紋是用於識別軟體版本，伺服器型別，以及設定的一種核心偵察技術，方法是分析系統如何回應被精心設計或異常輸入。 當測試者傳送的 HTTP 動詞，異常頭，或非典型的 URI 結構時，伺服器的具體回應程式碼，橫幅，和錯誤資訊揭示出不同的行為模式。 這些模式允許 httprint，NmapNSE 指令碼等工具，以及自訂探針匹配已知的伺服器剖面圖的回應。 這一技術是活動偵察的一部分，使攻擊者能夠確定與特定版本相關的弱點。 Phishing(可選 B)與協定分析無關。工作階段固定(可選 C)操縱工作階段識別碼，而不是 HTTP 回應模式。 Pervious XSS(可選 D) 依賴於 Web 應用程式弱點，而不是伺服器指紋。因此，測試者正在進行 HTTP 基於伺服器指紋的偵測。"},{"n":385,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"What does DEP block?","o":["Encryption","Logging","Execution in data memory","Scanning"],"a":[2],"e":"正確答案是 C，因為 DEP，即\"資料執行預防\"，是一種記憶體保護控制，它阻止程式碼從只用於資料儲存的記憶體區域執行，例如堆放或 heap/data 記憶體。 在 CEH 系統開發和緩衝區溢位概念中，攻擊者可能試圖將惡意的外殼程式碼注入緩衝區，然後將程式執行重定向到被注入程式碼。 符合 CEH 材料解釋出緩衝區溢位攻擊可以覆蓋相鄰記憶體，允許不同的可執行程式碼執行；它也注意到 ASLR 和 DEP 是共同防禦這些記憶體管理攻擊。 EC-Constitution 材料還稱緩衝區溢位的開發依賴於一臺機器能夠在 data/stack 段執行程式碼，並列出可執行的堆疊執行作為防禦。 因此， DEP 不阻斷 加密，日誌， 或掃描。 它專門阻斷資料記憶體區域的執行。","s":"term"},{"n":386,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"A biotech research firm in Boston, Massachusetts, migrates its laboratory management platform to the cloud. The vendor provides an environment where developers can deploy and test custom applications without managing the underlying servers, operating systems, or storage. The firm controls the application logic but not the runtime infrastructure. Which cloud service model is the company using?","o":["Infrastructure as a Service (IaaS)","Platform as a Service (PaaS)","Software as a Service (SaaS)","Anything as a Service (XaaS)"],"a":[1],"e":"這種情境將平台描述為一種服務(PaaS)，因為供應商提供管理下的平台，開發人員可以在此平台上部署和執行自訂應用程式，而供應商則管理基本的基礎設施元件--伺服器，作業系統，儲存，以及往往中戰/runtime 元件。 客戶負責應用程式碼和邏輯(通常為資料和應用程式設定)，但不負責提供或維護基礎計算和 OS 層。關鍵措辭是:\"開發者可以部署並測試自訂應用程式，而不管理基礎伺服器，作業系統，或儲存\"，\"企業控制應用邏輯，而不能控制執行時間基礎設施\"，這就是 PaaS的標誌性責任分出:供應商處理基礎設施和平台操作，透過管理執行時間，建構/deploy 管線，實現快速開發和部署， 和可擴充套件的服務。為何其他模型不合適:IaaS(A)將要求客戶管理 OS 和許多平台元件(patching，runtime 設定，中件)，即使供應商提供虛擬化的基礎設施。 情境明確宣告他們不管理 OS 或伺服器。 SaaS(C)提供了客戶使用的完整完成的應用程式；客戶通常不能以描述的方式在它上部署自己的自訂應用程式邏輯。 XaaS(D)是一個廣義的傘形名詞，而不是被問到的具體 NIST-style 服務模式分類。因此，正確答案是 B.平台作為一個服務(PaaS)。","s":"term"},{"n":387,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"During a penetration test at Cascade Financial in Raleigh, ethical hacker Ethan Brooks evaluates the security of the company ' s authentication system. He observes that the application accepts a high volume of repeated credential submissions without introducing any additional challenge, allowing automated scripts to cycle rapidly through large password lists. Ethan advises the IT team to deploy a control that forces interaction steps designed to disrupt automation. Which countermeasure should the IT team adopt in this scenario?","o":["Use strong hashing algorithms","Implement 2FA/MFA","Use CAPTCHA challenges on login and registration pages","Force periodic password changes"],"a":[2],"e":"該情境描述一種認證端點允許大量重複登入嘗試而無額外摩擦，使自動化指令碼能夠快速嘗試大型的密碼清單。 這是典型的線上密碼猜測和認證資訊 supting/brute-force 風格自動化。 所請求的反措施明確是\"旨在破壞自動化的出力互動步驟\"，它最能匹配 CAPTCHA.CAPTCHA 機制，引入了旨在區分人類與自動化 bots 的挑戰-應答測試，從而降低了被指令碼，高分認證資訊嘗試的有效性。 CAPTCHA 通常部署在登入和註冊頁上(有時在密碼重置流量上)來減慢或阻止自動濫用。 當觸發時 - - 通常在嘗試失敗或行為可疑之後 - - 它迫使請求者完成一個互動步驟(影象選擇、謎題、帶有行為分析的核取方塊等)。 這打破了全自動攻擊迴路，並增加了攻擊者的成本，特別是當與帳戶鎖出閾值，IP 聲譽，裝置指紋，速率限制等額外控制結合時。為何其他選項與\"扭曲自動化\"要求不太一致:強大的雜湊演算法(A)在休息時保護所儲存的密碼(例如如果一個資料庫被損壞)，它們不會直接停止線上自動登入嘗試。 2FA/MFA(B)在減少帳戶接管影響方面是極好的，但從本質上說，它並不妨礙高容量的認證資訊提交；在提供了正確的認證資訊之後，它又增加了第二個因素。 此外，問題的措辭強烈地指出了一個 bot-disruption 互動步驟。強制週期性 密碼 更改( D) 不是停止自動登入的首選項， 並且可以引入可用性問題；它不會直接給重複提交的來文增加摩擦。因此，所描述的最適當的應對措施是 C。 在登入和註冊頁面上使用 CAPTCHA 挑戰。"},{"n":388,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and loT Hacking","t":"mid","q":"Noah Kim, an ethical hacker at Quantum Cyber Solutions in Austin, Texas, is assessing iPhones used for proprietary development. On one device, he demonstrates a technique that allows it to boot normally without a computer, but the elevated access is temporarily lost after restart until the user launches a special on-device app to reapply the modifications. Which jailbreaking method is this?","o":["Tethered Jailbreaking","Untethered Jailbreaking","Semi-untethered Jailbreaking","Semi-tethered Jailbreaking"],"a":[2],"e":"劇情描述的是一種越獄，通常不需要電腦，但在重開後，裝置會失去越獄狀態，直到使用者執行一個可重開越獄功能的線上軟體。這種行為與半不重開的越獄行為相匹配。在 iOS 破獄術語中，關鍵不同者是重啟後會發生什麼，以及電腦是否需要重新恢復破獄功能。 在半無紋的破獄的情況下，裝置可以自己重啟到正常的，可用的 iOS 狀態(因此它不是\"被打出\"或者被卡在後臺上)，而破獄特徵如提升特權，未簽名的程式碼執行，以及 tweaks 在重啟後並不立即活動。 為了重新應用\"破獄\"，使用者推出安裝在裝置上的\"破獄\"應用程式，再次觸發了被開發鏈並重新啟用被修改的狀態直至下一次重啟，這與\"重啟後暫時丟失，直到使用者推出專門的\"破解\"應用程式\"完全一致。為什麼其他的選擇不匹配:被綁住的破牢(A)要求裝置必須連線到電腦上才能啟動；沒有綁住，裝置就無法正常啟動或保持無法使用。 情境明確表明它可以\"正常地啟動沒有電腦\"，所以它不是被綁住的。未脫脫脫出入監獄(B)在反彈中持續；裝置在重啟後仍被打破，沒有額外的步驟。 這與在重啟後重新應用修改的必要性相矛盾。半串接式的破獄(D)類似，因為裝置可以沒有電腦就啟動，但一般情況下裝置靴子會進入非破獄模式，可能需要電腦或額外的步驟，以根據方法返回破獄狀態；該情境特別突出透過安裝裝置重新啟用。 app，這是最常與半無縫越獄相關的標誌。因此，所顯示的破獄方法就是 C。 半不相容的破獄。","s":"term"},{"n":389,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"During a red team assessment of an enterprise LAN environment, the tester discovers an access switch that connects multiple internal workstations. The switch has no port security measures in place. To silently intercept communication between different hosts without deploying ARP poisoning or modifying the routing table, the tester launches a MAC flooding attack using the macof utility from the dsniff suite. This command sends thousands of Ethernet frames per minute, each with random, spoofed source MAC addresses. Soon after the flooding begins, the tester puts their network interface into promiscuous mode and starts capturing packets. They observe unicast traffic between internal machines appearing in their packet sniffer--traffic that should have been isolated. What internal switch behavior is responsible for this sudden exposure of isolated traffic?","o":["The switch performed ARP spoofing to misroute packets.","The switch entered hub-like behavior due to a full CAM table.","The interface performed DHCP starvation to capture broadcasts.","The switch disabled MAC filtering due to duplicate address conflicts."],"a":[1],"e":"CEH 解釋說，MAC 位址泛洪將一個交換器的 CAM 表覆蓋，導致它被進入失效開放狀態。 當表格填充時，交換器廣播訊框將所有埠，行為類似集線器。 這讓單播的流量暴露在以混雜模式執行的攻擊者身上。"},{"n":390,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A healthcare analytics firm in Denver, Colorado hosts several internal applications on an IIS web server. During an authorized security assessment, a tester evaluates a lesser-used endpoint designed for administrative operations. By sending crafted HTTP requests directly to this endpoint, the tester is able to invoke server-side management functions without interacting with the standard login workflow presented by the primary user interface. Further review indicates that certain restricted operations can be executed when accessed through alternate request paths, suggesting inconsistent enforcement of access controls within the application. Which IIS vulnerability is most accurately demonstrated in this scenario?","o":["File and Directory Permissions Vulnerability","CRLF Cross-Site Scripting Vulnerability","Trust Boundary Violation Vulnerability","Authentication Bypass Vulnerability"],"a":[3],"e":"正確答案是 D。 驗證旁通的弱點。測試者可以直接將所製作的 HTTP 請求傳送到一個階段的 端點，而不透過正常的登入工作流程，從而引用限制性的 伺服器- side 行政功能。 這表明認證檢查執行不連貫，並且可以透過階段請求路徑被繞過。CEHIIS 材料將 IIS 列為頻繁目標，並識別出 IIS-相關攻擊類別，如特權命令執行，緩衝溢位，源出披露，以及目錄traversal web 應用材料等。 CEHWeb 應用程式材料還解釋，身分驗證機制可以被攻擊來繞過認證或偷取資訊，而網路攻擊可能使用 URL，POST 資料，查詢字串，cookie，， 參數，並使用 HTTP 頭來存取受限制的函式。選項 A。 檔案與目錄允許的易失性是不正確的，因為情境並不注重 NTFS 或網頁目錄允許。選項 B。 CRLF 跨網站指令碼攻擊 弱點是不正確的，因為沒有說明馬車-回放/line-feed 注入或指令碼執行。備選辦法 C。 違反信任邊界的弱點與不當跨越安全邊界有關，但最準確的直接問題是繞過認證以援引受限制的職能。備選辦法 D。 驗證旁通的弱點是正確的，因為測試者可進入行政業務不完成所需的認證工作流程。因此，最好的答案是 D。 認證旁通的弱點。","s":"term"},{"n":391,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"A penetration tester is tasked with assessing the security of an Android mobile application that stores sensitive user data. The tester finds that the application does not use proper encryption to secure data at rest. What is the most effective way to exploit this vulnerability?","o":["Access the local storage to retrieve sensitive data directly from the device","Use SQL injection to retrieve sensitive data from the backend server","Execute a Cross-Site Scripting (XSS) attack to steal session cookies","Perform a brute-force attack on the application ' s login credentials"],"a":[0],"e":"CEH 訓練強調移動應用程式經常會錯誤處理本機儲存，留下像權杖，密碼，API 金鑰等敏感資料，或個人資訊在 SQLite資料庫內未加密，共享首選，或平面檔案儲存。 當 加密 缺席或執行不當時，攻擊者可以透過檔案系統擷取，Android Devug Bridge (ADB) 存取，物理裝置存取，直接存取這些資料， CEH 將“不安全的資料儲存”確定為最關鍵的移動弱點之一，因為它完全繞過伺服器-側防禦。由於弱點具體涉及休息時的資料，所以最直接有效的利用方法是擷取當地儲存的未加密資料。資料。 SQL 注入(可選 B) 評估後端安全性，而不是裝置儲存。 XSS(可選 C) 是一種網路攻擊，與本機 加密無關。Brute-forcing 認證資訊(可選 D) 在敏感資訊已經不安全地儲存的情況下是不必要的，因此，存取本機儲存是正確的開發方法。"},{"n":392,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"Which payload is most effective for testing time-based blind SQL injection?","o":["AND 1=0 UNION ALL SELECT ' admin ' , ' admin","UNION SELECT NULL, NULL, NULL --","OR ' 1 ' = ' 1 ' ;","AND BENCHMARK(5000000,ENCODE( ' test ' , ' test ' ))"],"a":[3],"e":"在應用程式壓制出錯訊息而不顯示查詢結果時使用基於時間的 blind SQL 注入。 根據 CEH v13,攻擊者依賴回應時間延遲來推斷是否已注入了 SQL 語句被執行。 BENCHMARK () 函式強迫 資料庫 多次執行 CPU- 密集操作， 如果成功執行注入條件， 會造成明顯的延遲。 選項 D 明確引入這樣的延遲， 並且是一個基於教科書的基於時間的盲 SQL 注入酬載。選項A，B，和 C 用於基於工會或布林的 SQL 注入，並依賴可見輸出或內容變化，這些在盲景中無效。 CEH v13 明確規定了時間延遲函式，例如 SLEEP ()， WAITFOR DELAY， 和 BENCHMARK () 是基於時間的盲 SQL 注入測試的主要指標。因此， 選項 D 是正確的。"},{"n":393,"c":"系統入侵階段","ce":"System Hacking Phases","t":"long","q":"During a post-exploitation phase in a network compromise simulation, ethical hacker Devon Hughes gains a Meterpreter session on a manager ' s Windows 10 workstation. To maintain stealth, he avoids actions that generate obvious signs of tampering such as privilege escalation or file system changes. Instead, he wants to monitor the user ' s live activity over time without their knowledge, focusing specifically on input patterns and active sessions. Which Meterpreter command should he use to achieve this objective with minimal visibility?","o":["keyscan_start","hashdump","persistence","getsystem"],"a":[0],"e":"This phase is testing 識別開發後的目標，側重於隱蔽地觀察使用者活動，具體來說是\"輸入模式\"，直接與按鍵捕獲或按鍵部落格行為相配合。 在\"系統駭客\"和\"後滲透\"的 CEH 覆蓋中，已經具有互動存取功能的進攻者通常會轉向資訊蒐集動作，這些動作在不進行權限提升等吵鬧變化或將文物寫入磁碟的情況下，揭示出認證資訊和敏感的商業資料。 Keystroke 監控是一個經典的例子，因為它能夠捕捉使用者名稱，密碼，內部系統命令，聊天資訊， 以及使用者工作時的其他敏感投入，與改變系統設定的行動相比，其能見度往往更低。 剩下的選項對映到不同的開發後目標，也不太符合被提示者強調的隱形和\"沒有明顯的篡改跡象\"。 傾出密碼 hashdump(hashdump)被儲存認證資訊材料的目標，通常與更高的特權要求和由於進入敏感的安全資料庫而具有更高的偵測潛力有關。 持久性是維持跨越回波的長期准入，通常引進文物，如登錄更改，預定任務，或服務--確切地說，Devon 想要避免的可探測修改型別。 CEH 強呼叫強的端點監控和 EDR，最小優先控制，快速修補程式，應用程式允許上市，以及認證資訊保護，如 MFA 和硬化認證儲存等來緩解這一類活動。 團隊應當對可疑的輸入-抓取行為，異常過程活動，以及異常的遠端工作階段發出警示，以及早發現開發後採集嘗試。","s":"term"},{"n":394,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"During a recent security assessment, you discover the organization has one Domain Name Server (DNS) in a Demilitarized Zone (DMZ) and a second DNS server on the internal network. What is this type of DNS configuration commonly called?","o":["DNS Scheme","DNSSEC","DynDNS","Split DNS"],"a":[3],"e":"正確答案是 D， Split DNS。 Split DNS， 也叫 split-horison DNS， 使用單獨的 DNS 檢視或伺服器進行內部和外部的 名稱解析。在這個設定中， DMZ 中的 DNS 伺服器 為外部使用者提供公交記錄， 而內部的 DNS 伺服器 為內部主機和服務提供私人記錄。 這可以防止敏感的內部主機名稱， IP 位址，。 以及從公眾接觸到的基礎設施細節。 CEH 網路主題描述為 DNS 是將主機名稱翻譯為 IP 位址的系統，反之亦然，使得 DNS 記錄在足跡上值值值值和列舉。 CEH 周邊安全材料也解釋道:DMZ 是一個介於內部私人網路和外部公共網路之間的緩衝區域， 用於外部必須可達到的服務。 DNSSEC 用於保護 DNS 完整性加密， DynDNS 地圖將 IP 位址更改為名稱， “ DNS 方案” 不是標準術語。 因此， 這個設定是 Split DNS。","s":"term"},{"n":395,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"In a security assessment conducted in New York, Sarah, an ethical hacker, is evaluating a corporate network to enhance its protection against potential threats. She aims to gather essential data about available access points to guide her analysis. Which scanning technique should Sarah apply to meet this objective while adhering to the organization ' s ethical guidelines?","o":["Vulnerability Scanning","Port Scanning","Topology Mapping","Network Scanning"],"a":[1],"e":"連接埠掃描是用於識別可用無線基地台入系統而使用的符合 CEH 技術，其中\"無線基地台\"指開啟的 TCP 和 UDP 埠以及在其上收聽的服務。 在 CEH 方法所描述的偵察和掃描相中，測試者首先列出活主機，然後進行連接埠掃描以發現哪些網路服務可以被達到，例如:HTTP 在 80 或 443 上，SSH 在 22 上，RDP 在 3389 上，DNS 在 53 上等，還有許多其他。這些資訊直接指導下一步的分析，揭示出攻擊面:哪些服務被曝光，哪些系統正在執行，哪些埠可能允許遠端互動。弱點掃描之所以不同，是因為它試圖識別已知的弱點或錯位，而且通常需要服務偵測、版本化和簽名或設定檢查。 它通常在發現埠和服務後進行，而不是作為發現\"可用無線基地台\"的第一個方法。 Topology 對映側重於瞭解網路的結構，包括路由路徑，裝置關係，分塊邊界等。 網路掃描是一個更寬泛的術語，可以包括主機發現和其他探測器，但是它比連接埠掃描更精確地識別出攻擊者可以用來連線的特定切入點。根據道德準則，連接埠掃描工作有適當的授權、範圍目標、控制的時間以避免中斷，並明確報告開放的港口、發現的服務和所涉風險，這樣防禦人員就可以關閉不必要的港口並強化所需的服務，從而減少接觸。","s":"term"},{"n":396,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"During a simulated attack against a university ' s IT network in California, ethical hacker Sophia deploys custom malicious code onto one lab workstation. Without requiring further user interaction, she observes the malware automatically copying itself into shared folders and spreading through weak admin credentials. Within a short time, dozens of computers across multiple departments are infected with the same payload, even though only one machine was initially targeted. Which type of malware is Sophia most likely demonstrating?","o":["Logic Bomb","Worm","Backdoor","Fileless Malware"],"a":[1],"e":"正確答案是 B。 Worm，因為所描述的定義行為是自我複製和在多個系統之間自主傳播，而不需要在初始被感染後進行額外的使用者互動。 在符合 CEH 的惡意軟體分類中，一個蠕蟲是一個獨立的惡意軟體，可以透過複製自己到其他主機來自動地在網路上傳播。 蠕蟲通常會利用共享資源(如共享資料夾)，弱設定，並有認證資訊弱點(如薄弱的行政密碼或認證資訊再利用)來橫向移動並影響規模上的額外機器。劇情包括了多種經典的蠕蟲特徵:(1)最初只針對一個工作站，(2)惡意軟體然後\"自動複製自己被共享的資料夾\"，(3)它使用\"微弱的 admin 認證資訊\"進行傳播，導致\"幾十個電腦\"被迅速感染。 這種模式符合蠕蟲傳播機制，如利用行政股份，透過得到的認證資訊進行遠端執行， 並使用網路可存取路徑來滴出副本本身。關鍵區別在於自動化:在初始放置後，惡意軟體會處理其餘部分，掃描可存取的系統或共享並複製給它們，而不需要使用者再次點選附件或執行酬載。為什麼其他選項不正確:邏輯炸彈一般是休眠程式碼，在滿足特定條件或時間時觸發惡意行動；它不是透過自我傳播定義的。 A 後門為後期控制提供未經授權的存取，但是它本身並沒有在網路上覆制。 無檔案惡意軟體主要使用合法工具(如 PowerShell/WMI)和最小磁碟文物等)強調在記憶體中執行；雖然無檔案技術可用於橫向移動，但情節的重點是惡意軟體複製自己到共享資料夾並廣泛傳播，這是蠕蟲的標誌。因此，索菲亞最有可能表現出一頭蠕蟲。","s":"term"},{"n":397,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"Working as an Information Security Analyst, you are creating training material on session hijacking. Which scenario best describes a side jacking attack?","o":["An attacker uses social engineering to trick an employee into revealing their password.","An attacker intercepts network traffic, captures unencrypted session cookies, and uses these to impersonate the user.","An attacker exploits a firewall vulnerability to gain access to internal systems.","An attacker convinces an employee to visit a malicious site that injects a script into their browser."],"a":[1],"e":"CEH v13 Web 應用程式入侵中定義的側接夾克是一種工作階段劫持的形式，攻擊者會捕捉有效的工作階段識別碼--通常是由嗅探 網路流量獲得的 cookie。 當應用程式未能使用 HTTPS 加密工作階段 cookie 時，這種攻擊特別有效。在 CEH v13 中，側打通常與對無線網路實施的攻擊有關，攻擊者被動地使用封包嗅探來監控流量，如 Wireshark。 如果工作階段Cookie 在明文被傳送，攻擊者可以重放來假扮受害者而不需要登入認證資訊。選項 B 完全符合這個定義:捕獲未加密的工作階段 cookie 並重用以獲得未經授權的存取。其他選項描述不同的攻擊型別:A 是認證資訊透過社交工程收割。 C 是網路開發。 D 為跨網站指令碼攻擊(XSS)。 CEH v13 強調執行 HTTPS，安全與 HttpOncookie 旗，和工作階段再生作為防禦側夾。"},{"n":398,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A mid-sized insurance provider in Hartford, Connecticut authorizes a controlled red team engagement to evaluate its public-facing customer portal. Before progressing to active exploitation, the assessment team concentrates on understanding how the site is organized and how its content is interconnected. Using automated tooling, they systematically retrieve publicly accessible pages along with associated resources such as scripts, media files, and referenced directories. The collected material allows the team to analyze navigation paths, hidden references, and structural relationships without repeatedly interacting with the live production system. This preparatory effort is intended to build a detailed structural understanding of the application before later testing phases begin. Within the web server attack methodology, which stage is most accurately demonstrated in this scenario?","o":["Website Mirroring","Information Gathering","Web Server Footprinting","Vulnerability Scanning"],"a":[0],"e":"正確答案是 A。 Website Mirrawing。 網際網路檔案館的存檔，存檔日期 2013-12-21。劇情描述下載可公開存取的網頁，指令碼，媒體檔案，以及目錄參考文獻，以便團隊分析網站下線，這恰恰是網站的映象。 符合 CEH 材料解釋道:映象網站意味著將整個網站複製到本機系統。 已下載的副本允許測試者檢查目錄結構並識別離線環境中的弱點，減少與活網路伺服器的重複互動。 同一材料列出了 WinHTTRack， SurfOffline， BlackWidow， Teleport Pro， 離線探索器，和 Wget 等網站映象工具。選項 B。 資訊蒐集範圍更廣，可以包括許多蒐集方法，但所述的具體活動是當地複製網站內容。選項 C。Web 伺服器足跡更注重伺服器的細節，如橫幅，技術，作業系統，和架構等。備選辦法 D。 弱點掃描是不正確的，因為小組尚未積極測試已知的弱點。因此，最好的答案是 A.網站映象。","s":"term"},{"n":399,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"During a red team exercise for a global insurance provider in Chicago, ethical hacker Maria tests the effectiveness of the company ' s endpoint defenses. She launches an attack by injecting malicious PowerShell commands into a trusted process without dropping any executables to disk. The code executes entirely in memory, generating abnormal spikes in resource usage. After a reboot, Maria notes that the system returns to normal and traditional antivirus logs show no evidence of infection. Which type of malware technique did Maria most likely use in this test?","o":["Rootkit","Trojan","Fileless Malware","Ransomware"],"a":[2],"e":"瑪麗亞最有可能使用無檔案惡意軟體，因為該情境明確描述惡意活動，它不會將可執行的酬載寫入磁碟，而是完全在記憶體中使用 PowerShell 並處理注入來執行。 在 CEH-對齊的惡意軟體分類中，無檔案惡意軟體的特點是利用合法的系統工具(常被稱作\"生活於地外\"公用事業)，如 PowerShell，WMI，cmd.exe，或者指令碼引擎來執行攻擊者控制的程式碼而無需在檔案系統上建立傳統的惡意軟體檔案。 由於許多遺留的防毒解決方案嚴重依賴於基於簽名的磁碟上檔案掃描，純粹的記憶體-常住執行可以減少或消除典型的 AV 偵測，並留下標準 AV 日誌中最微小的文物。描述中還提及，系統重啟後會恢復正常，這有力地支援了無檔案行為:如果攻擊者沒有建立持久性(例如透過登錄執行金鑰，排程工作，服務，或 WMI 事件訂閱)，那麼當記憶體被重置時會清除記憶體程式碼和注入指令。 \"資源使用中異常的突起\"與在被信任的流程上下文中執行的惡意指令碼一致，攻擊者可能注入或反射地載入程式碼以混合到正常的操作活動中並逃避直接的監控。為什麼其他選項是不正確的:一款 Rootkit 主要透過深層系統層隱藏(通常為核心/driver-level)並通常與持續的隱藏相關，而不是\"沒有磁碟足跡\"PowerShell-只執行)來關注被隱蔽。 木馬程式通常是一個惡意的程式偽裝成合法的軟體，通常涉及交付的可執行性或應用程式。 勒索軟體透過加密資料和勒索付款來定義，這裡沒有描述。因此，最符合測試的技術是透過 PowerShell 執行的無檔案惡意軟體和記憶體--只有注入。","s":"term"},{"n":400,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"long","q":"Javier Ruiz from CyberFortress Solutions is tasked with auditing the mobile security practices of Apex Financial Services, a financial firm in Houston, Texas. During a covert penetration test, Javier targets employees ' personal smartphones used to access corporate financial systems. He exploits a vulnerability by installing a malicious app that bypasses access controls, granting him unauthorized entry to sensitive financial data because the devices lack a specific security measure to restrict app access. Based on this vulnerability, which BYOD security guideline is most likely missing in Apex Financial Services ' policy?","o":["Review permissions requested by apps before installing them","Set passwords for apps to restrict others from accessing them","Enforce automatic device locking or implement biometric authentication","Use encryption mechanisms to store data"],"a":[0],"e":"最可能缺失的 BYOD 指南是在安裝前審查應用程式權限。 在 CEH 行動裝置安全引導中，BYOD 環境中的一個主要風險是引入了不信任或惡意的應用程式，這些應用程式濫用移動許可模式存取公司資料，擷取認證信使，讀取儲存，透過無障礙服務捕獲鍵盤，或對外通訊。當使用者在不仔細檢查請求權限的情況下安裝應用程式時，他們可能不知不覺地給予過多的權限，使得資料被竊取或存取控制繞行成為可能，特別是當該應用程式利用 OS 弱點或設定錯誤時。劇情說明 Javier\"安裝了繞過存取控制的惡意應用程式\"並獲得了敏感財務資料的存取權，因為裝置\"缺少限制應用存取的特定安全措施\"，這直接對映到控制與驗證應用及其許可請求的政策弱點。 CEH 強調各組織應該透過限制應用權限來減少攻擊面， 避免從不可信來源進行側載，並透過使用者意識和企業控制，如 MDM 應用程式，執行最小特權允許列名和許可治理。 審查權限是使用者-造型指南，它阻止員工給予危險的存取權(例如:SMS，儲存，聯絡人，可存取性，裝置管理員，或 VPN 設定權限)，可以使認證資訊被竊取或未經授權的資料存取成為可能。選項 B 為本機存取新增了一層內容， 但不會在獲得許可的情況下停止惡意應用存取公司資料。如果一個裝置被物理上竊取，選項 C 會有所幫助，但它並不能防止在使用者上下文下已經執行的惡意應用程式。選項 D 保護休息資料，然而，惡意應用程式一旦解密並被使用者工作階段存取，仍然可以解密資料。因此，權限審查是最直接缺失的 BYOD 準則。"},{"n":401,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"short","q":"What is the most plausible attack vector an APT group would use to compromise an IoT-based environmental control system?","o":["Exploiting zero-day firmware vulnerabilities","Using stolen user credentials","Encrypted MitM attack","DDoS attack"],"a":[0],"e":"根據 CEH v13 Mobile，IoT，和 OT Hacking，高階持久性威脅(APT)群體優先關注隱蔽，持久性，以及長期控制。 在 IoT環境中，最有吸引力和最有效的入門點是韌體級零時差易發性。 IoT 裝置經常:執行已過時或專有的韌體缺乏定期修補程式機制執行高權限監測最少在韌體中探索出零時差的弱點，可以使攻擊者獲得能活下來並避開傳統安全控制的深層持續存取，這直接符合 APT 的目標。認證資訊被竊(可選取 B)是常見的，但對 IoT 系統而言可靠性較低。 加密的 MitM(可選取 C)複雜而持久性更低。 DDoS(可選取 D)擾亂服務，但不提供控制。 CEH v13 明確確定在 IoT 和 OT 環境中將韌體開發作為主活動 APT 向量，因此，選項 A 是正確的。"},{"n":402,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"At a petrochemical processing facility in Corpus Christi, Texas, a certified ethical hacker performs an authorized reconnaissance assessment within the manufacturing zone. The objective is to identify programmable controllers responsible for automated production processes. The tester initiates a targeted scan against a TCP service commonly used by industrial controllers that support structured function-code exchanges for reading and writing memory areas. Multiple field devices respond to this service, confirming the presence of automation controllers communicating over that port. Based on this reconnaissance pattern, what type of OT device scan is being performed?","o":["Capturing Modbus/TCP traffic using Wireshark","Scanning Siemens SIMATIC S7 PLCs","Scanning Modbus Devices","Scanning Omron PLC Devices"],"a":[2],"e":"正確答案是 C。 Scanning Modbus 裝置。設想題目描述針對工業控制員使用的 TCP 服務進行定向掃描，支援功能碼交換讀取 並寫入記憶體/register 區域。此直接對映到 Modbus/TCP。 通常執行於 TCP 連接埠 502 並使用函式程式碼讀取線圈， 讀取登記冊， 寫出圈子， 並寫下注冊簿。被引用的 OT/ICS 材料識別出 Modbus 是工業控制系統中使用的協定，並顯示 Modbus 掃描例項，如 modscan.py-a <目標 >-p502 和 modpoll-mtcp，包括用於讀取輸入登記冊的 Modbus 函式程式碼。 另一個參考文獻還列出了使用 nmap112 協定,502-sV < target_ip > 的 ICS 偵察，並認定了連接埠:502modbus 作為ICS 環境中常用的 Modbus 伺服器的搜尋模式。選項 A。 使用 Wireshark 的 Modbus/TCP 流量不正確 因為這個情境描述了一個主動的定向掃描， 而不是被動的 封包擷取。選項 B。 Scanning Siemens SIMATICS7 PLCs 是不正確的，因為Siemens S7 通訊通常與 TCP 連接埠 102 相關，而不是本文所描述的 Modbus 函式編碼模式。選項 C。 掃描 Modbus 裝置正確 因為 Modbus/TCP 使用 TCP 連接埠 502 函式程式碼 並撰寫工業資料。選項 D。 掃描 Omron PLC 裝置不正確 因為 Omron PLC 偵察 通常涉及協定 如 FINS， 或 單相 而非描述的 Modbus/TCP 函式碼行為。因此，最好的答案是 C。Scanning Modbus 裝置。","s":"term"},{"n":403,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and loT Hacking","t":"mid","q":"At Apex Financial Services in Houston, Texas, ethical hacker Javier Ruiz evaluates mobile security practices under the company ' s BYOD policy. He demonstrates that employees often install applications that request access to contact lists, cameras, and messaging services, even though these functions are unrelated to the apps ' intended purpose. This behavior allows a malicious program to harvest sensitive corporate information. Which security guideline would most directly prevent this issue?","o":["Use encryption mechanisms to store data","Enforce automatic device locking or implement biometric authentication","Review permissions requested by apps before installing them","Set passwords for apps to restrict others from accessing them"],"a":[2],"e":"所描述的問題是在 BYOD 環境中給予過多或不適當的應用許可。 僱員安裝要求存取敏感裝置資源的應用軟體-- 接觸器、相機、通訊，儘管這些許可對於該應用所宣稱的目的來說並不必要。 如果安裝惡意或過度侵入性應用，則會造成資料採集和公司資訊洩漏的風險。 防止這種行為的最直接準則是在安裝應用程式之前審查應用程式要求的權限。移動作業系統嚴重依賴許可模式來控制敏感資料和裝置能力的取得。當使用者不經審查批准廣泛的許可時，它們就有效地授權應用程式蒐集和傳輸敏感資訊。強制實施檢查許可的文化和政策(和)拒絕或取消請求不必要存取的應用軟體)直接解決了情境中的根本原因:使用者同意允許在應用層面擁有過多的特權。 在公司 BYOD 程式中，這個準則往往與行動裝置安全控制相配，如企業應用商店，允許清單/denylists，MDM/MAM 政策，以及使用者意識培訓，但問題要求最直接的預防指南。為何其他選項不那麼直接:加密 at rest (A) 幫助保護裝置丟失或失密時所儲存的資料，但它並不阻止授權的應用透過所授予的權限存取資料。自動鎖定/biometrics(B)會減少未經授權的物理存取，但並不限制裝置使用期間被允許的 app 能夠存取的內容。 App密碼(D)可以幫助限制一個應用的隨意存取，但是並不能解決一個應用被合法授予入侵許可的問題。因此，最好的答案是 C。在安裝應用程式之前審查應用程式所要求的權限。"},{"n":404,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"As an IT technician in a small software development company, you are responsible for protecting the network against various cyber threats. You learn that attackers often try to bypass firewalls. Which of the following is a common technique used by attackers to evade firewall detection?","o":["Changing the source IP address of packets to make traffic appear to originate from a trusted source","Using encrypted communication channels to evade network monitoring tools","Using social engineering techniques to trick employees into revealing sensitive information","Implementing an open-source operating system to bypass proprietary software restrictions"],"a":[1],"e":"根據 CEH 網路 和周邊安全艙， 其中一個最有效 被廣泛使用的防火牆逃生技術是使用加密通訊通道。 當使用協定加密流量時 諸如 HTTPS， TLS，。 或 VPN 地道， 傳統 防火牆 和封包檢查工具可能無法檢查酬載內裝物，除非 SSL/TLS 檢查明確允許。 CEH 檔案解釋攻擊者通常會加密命令和控制(C2)流量到:與合法加密流量混合附帶內容的檢查基於簽名的撤離偵測因此，選項 B 是正確的。選項 A (IP 欺騙) 對抗狀態防火牆效果較差。選項 C 是以人為中心的攻擊，而不是防火牆逃避。選項 D 與防火牆繞行技術無關。 CEH 突出加密被濫用是周邊防守的主要盲點。"},{"n":405,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"mid","q":"As a Certified Ethical Hacker evaluating a smart city project (traffic lights, public Wi-Fi, and water management), you find anomalous IoT network logs showing high-volume data exchange between a specific traffic light and an external IP address. Further investigation reveals an unexpectedly open port on that traffic light. What should be your subsequent course of action?","o":["Isolate the affected traffic light from the network and perform a detailed firmware investigation","Conduct an exhaustive penetration test across the entire network to uncover hidden vulnerabilities","Analyze and modify IoT firewall rules to block further interaction with the suspicious external IP","Attempt to orchestrate a reverse connection from the traffic light to the external IP to understand the transferred data"],"a":[0],"e":"CEH 對疑似妥協的態度與事件處理心態一致:先是遏制，再是分析和補救。 在 IoT 和 OT 相鄰的環境(智慧城市基礎設施，SCADA-相類似元件，嵌入式控制器)中，CEH 強調可疑的外部通訊和無法解釋的開放埠可能表明妥協，設定錯誤，被曝光的管理服務， 或被植入的 mARWARE/backdoors。 因為 IoT 端點往往有有限的伐木，並且難以安全地再作再生，最安全的下一步是隔離被懷疑的裝置來防止進一步的資料外洩，指令和控制活動，或者橫向移動到其他城市系統。選項 A 最佳匹配 CEH 指導: 隔離裝置並調查其韌體、服務以及設定， 包括檢查未經授權的二進位， 更改韌體影象， 不安全的預設服務， 以及硬碼的 認證資訊。 這也儲存了證據並減少了爆炸半徑。選項 C(封鎖外部的 IP)可以有所幫助，但它是一個區域性的控制:攻擊者可以旋轉基礎設施，裝置仍然可以在內部被損壞。 選項 B(完整的網路筆測試)過於寬泛，當特定的高風險指標已經存在時會被延遲封存。 選項 D(嘗試逆向連線)會被交叉入主動開發行為，在防禦性調查中並不是適當的\"下一步\"；CEH 方法強調授權，可控測試，並優先降低風險，而不是與可疑的外主機互動。因此，CEH 一致的最佳做法是即時隔離和韌體級調查。"},{"n":406,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at a financial services company in Denver, ethical hacker Jason demonstrates how employees could be tricked by a rogue DHCP server. To help the client prevent such attacks in the future, Jason shows the administrators how to configure their Cisco switches to reject DHCP responses from untrusted ports. He explains that this global setting must be activated before more granular controls can be applied. Which switch command should Jason recommend to implement this defense?","o":["Switch(config)# ip dhcp snooping","Switch(config)# ip arp inspection vlan 10","Switch(config)# ip dhcp snooping vlan 10","Switch(config-if)# ip dhcp snooping trust"],"a":[0],"e":"正確答案是 A。 交換器( config)# ip dhcp snooping， 因為問題要求首先啟用必須啟用的全域設定， 然後再應用更具體的(granular) DHCP Snooping 控制。 在 Cisco 切換中， DHCP Snooping 是用於減輕 road DHCP 伺服器 攻擊的主要 第 2層安全特性。一旦啟用， 交換器可以區分信任的埠(其中允許合法的 DHCP 伺服器回覆， 通常向上鍊接到授權的 DHCP伺服器) 和不信任的港口(通常是進入港口取得終端使用者裝置)， 其中 DHCP 伺服器回應(DHCPOFFER/DHCPACK)被過濾來防止一個流氓伺服器向用戶端傳遞惡意網路設定(gateway/DNS))。假設的防禦目標--“拒絕來自不信任的埠的 DHCP回應”--正是 DHCP Snooping 在啟用後執行的，並且指定了埠為信任狀態。啟用 DHCP 全球搜尋( 特性活化)，啟用相關的VLAN(s)，以及將合法的 DHCP-facing 介面標為可信任的，這樣只有這些埠才能傳送 DHCP 伺服器的回覆。選項 C 和 D是後人的一部分， 顆粒級:C 能為特定的 VLAN 提供 DHCPsnooping，這是必要的，但不是問題突出的全球性先決條件。D 在介面下被應用來指定一個連接埠為可信任；再次，這是顆粒式的，只有在 DHCPsnooping 被啟用後才有意義。選項B 是一個不同的特性(Dynamic ARP Provision)，用於緩解 ARP 欺騙/poisoning 而不是 road DHCP。因此，全球指令Jason 應首先推薦為交換器(設定)#ipdhcpsnooping。","s":"term"},{"n":407,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and loT Hacking","t":"mid","q":"At Bayview University in San Francisco, California, ethical hacker Sofia Patel is evaluating security controls on Android 11 tablets used by staff. To simulate an attack, she installs KingoRoot.apk directly on one of the devices. The application leverages system vulnerabilities to elevate privileges without requiring a computer connection. Based on the module, which feature of this rooting approach makes the attack effective?","o":["It uses a tethered jailbreak to restart the device with patched kernel functions","It is an APK that can run directly on the device without a PC","It relies on weak SSL validation to bypass application controls","It exploits Bluetooth pairing flaws to gain device-level privileges"],"a":[1],"e":"此情境描述一種 Android 根法，即攻擊者在裝置上直接安裝一個根法工具作為 APK，並用它來利用弱點來獲得更高的權限。這個問題中說，使這種方法有效的關鍵特徵是它工作時不需要電腦連線。 這直接與選項 B 一致:“是一臺 APK，可以直接執行在裝置上，而無需個人電腦。”在物理存取僅限於裝置本身(或與個人電腦連線不切實際或會引起懷疑)的環境中，作為APK 包裝的打入工具是有效的。 一旦安裝，這種應用程式可以透過利用 OS、驅動器或供應商元件中已知的弱點來嘗試權限提升，從安全評估的角度來看，這說明如果使用者可以安裝不信任的應用程式，裝置沒有完全補齊，或者應用程式控制(企業 MDM 政策、應用程式允許清單、未知源限制)薄弱，移動裝置可能面臨風險。其他選項與所描述的 Android APK-基於 rooting 不一致。 \"Tethered jailbreak\"術語適用於 iOS 的破獄，而不是 Androidroidrooting，情節明確表明不需要電腦連線。 weak SSL 驗證與應用層的運輸安全問題有關，而不是權限提升到 root。 藍芽配對缺陷是不同的攻擊類，在此不註明；所描述的方法是安裝根 APK 所啟動的上接裝置開發鏈。因此，使這種根法在情境中有效的特點為: B:它作為 APK 直接執行在裝置上而不需要 PC。"},{"n":408,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"During a penetration test at Cascade Financial in Seattle, ethical hacker Elena Vasquez probes the input handling of the company's web server. She discovers that a single crafted request is processed as two separate ones, allowing her to inject malicious data into the server's communication. This type of attack falls into the same category of input validation flaws as cross-site scripting (XSS), cross-site request forgery (CSRF), and SQL injection. Which type of web server attack is Elena most likely demonstrating?","o":["HTTP Response Splitting Attack","Password Cracking Attack","Directory Traversal Attack","Web Cache Poisoning Attack"],"a":[0],"e":"正確答案是 A。 HTTP Resign Spliting Attack，因為情境描述了一個被精心設計的請求被解釋為導致伺服器(或一箇中介)將其作為兩個獨立的 HTTP 訊息處理的一個缺陷，使攻擊者能夠將惡意資料注入 HTTP 回應流。 這是一種經典的輸入驗證和頭頭注入問題，通常涉及將歸位與換行（CRLF）(CRLF)字元(\\r\\n)插入使用者控制輸入，後被放入 HTTP 頭(例如，在重定向，Cookie 或自訂標頭)。 透過注入 CRLF 序列，攻擊者可以\"分出\"伺服器's。回應:第一部分完成一個合法的回應標頭分，被注入的內容開始第二個攻擊者控制的回應。這與提示者強調“一個單一的精心擬訂的請求是作為兩個單獨的請求處理的”，這是 HTTP 回應分割的基本運作機制--將一個交易變成多個被解釋的 HTTP 實體。 一旦 HTTP 回應分割成為可能，攻擊者可能會設定或操縱頭頭(如 Set-Cookie)，注入任意內容，進行交叉使用者的去相容，為快取中毒提供方便，或者透過使瀏覽器或代理儲存並服務惡意內容來使使用者端側攻擊能夠更有效地提供。問題還被訊框與 XSS，CSRF，和SQL 注入並列作為\"輸入驗證缺陷\"。 這符合回應拆分的根源:在將它列入 HTTP 頭或回信之前，未充分進行無信任輸入的消毒/validation。為什麼其他選項不正確: 密碼破解與 HTTP 解析和輸入驗證無關。 目錄 traversal 濫用路徑處理存取檔案( 如。/)， 不涉及分拆 HTTP 訊息。 Web 快取 中毒可能是回應分拆的結果， 但被描述的行為-- 將單個請求/response 分解為兩個-- 最直接地將 HTTP 回應分拆為已顯示的攻擊。","s":"term"},{"n":409,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"An enterprise collaboration platform used by a pharmaceutical distributor in Boston, Massachusetts relies on a centralized identity store to validate employee credentials. While reviewing the authentication workflow, a security tester notices that user-provided values are directly embedded into backend lookup expressions responsible for locating account records. When specific logical operators and wildcard characters are introduced into the username field, the application's record-matching behavior changes. Instead of evaluating a single identity entry, the backend process begins matching a broader set of records than intended, altering the outcome of the authentication check. The issue arises from improper handling of input within directory-based search logic. From the following options, identify the injection technique illustrated in this scenario.","o":["LDAP Injection","OS Command Injection","SQL Injection","XPath Injection"],"a":[0],"e":"正確答案是 A。 LDAP 注入。題目描述惡意輸入被插入到基於目錄的搜尋邏輯中，用於驗證身分。 LDAP 通常用於集中目錄認證和帳戶查詢。 當使用者輸入直接嵌入到 LDAP 過濾器中而未進行適當的驗證時，攻擊者可以使用操作員，萬用字元，和特殊的 LDAP 語法來改變過濾邏輯。 符合 CEH 材料稱 LDAP 注入利用了未經驗證的輸入，攻擊者可以透過使用LDAP 濾波器來搜尋目錄資料庫來取得資訊。 另一所 CEH 考試參考文獻解釋說，LDAP 注入利用了基於使用者輸入建構LDAP 語句的應用程式，並將輸入直接透過到 LDAP 查詢中。選項 B。 OS 命令注入是不正確的，因為情境不涉及作業系統命令。選項 C。 SQL 注入 是不正確的，因為後端的搜尋基於目錄，而不是關係資料庫 SQL。選項 D。 XPath 注入是不正確的，因為 XPath 注入目標為 XML 查詢表示式，而不是 LDAP 目錄過濾器。因此，最好的答案是 A。 LDAP 注入。","s":"term"},{"n":410,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During an assessment for a tech company in Seattle, Washington, an ethical hacker seeks to uncover details about the organization's domain ownership to identify potential points of contact. She uses an online service to retrieve publicly available records without direct interaction with the target. Which method is she most likely employing to achieve this?","o":["Email footprinting","Network footprinting","Whois lookup","DNS interrogation"],"a":[2],"e":"正確答案是 C。 Whois 擷取，因為情境描述的是使用線上服務擷取公開的網域名稱登記記錄而不與目標組織的基礎設施直接互動。 在 CEH-aconition 偵察(足跡)技術中，WHOIS 是一種基礎被動資訊採集方法，用於識別與網域名稱相繫結的細節，如註冊人/組織，行政和技術聯絡人，註冊和到期日期，以及與網域名稱相關的權威名稱伺服器。 這些細節通常用於確定所有權背景，繪製本組織外部足跡，並查明行政或安全協調的潛在聯絡點。提示強調道德駭客想要\"關於組織網域名稱的詳情\"和\"接觸點\"，這正是 WHOIS 打算提供的那種資訊，它也明確指出\"沒有直接與目標互動\"，它與 WHOIS 是被動的:查詢是向註冊/registrars 或 WHOIS 彙總服務，而不是對目標伺服器進行偵測。為什麼其他選項不太正確:電子郵件足跡側重於蒐集電子郵件位址、格式、郵件伺服器和可能相關的後設資料，但它不是網域名稱所有權/registrant 聯絡記錄的主要方法。 網路足跡範圍更廣，往往涉及確定 IP 範圍、網路塊、技術和地形--可能包括主動偵測。 DNS 詢問(例如查詢 A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、 A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、 A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、A、 MX，NS，TXT 記錄)可以揭示出技術上的 DNS 資料和基礎設施對映，但一般不會提供網域名稱的註冊人所有權細節和正式的聯絡記錄；該角色由 WHOIS 和登錄資料處理。因此，這裡最可能使用的方法是 WHOIS 查詢，以取得公有領域註冊和聯絡資訊。","s":"term"},{"n":411,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and loT Hacking","t":"long","q":"A retail brand based in San Diego, California, authorized a controlled mobile security exercise to evaluate risks associated with third-party application distribution channels. Testers acquired a version of the company ' s customer rewards application from an unofficial marketplace frequently used by overseas customers. The application ' s visual layout and functionality were indistinguishable from the officially released version available in mainstream app stores. Behavioral monitoring conducted in a sandbox environment revealed that, in addition to its normal operations, the application initiated outbound connections unrelated to its documented features. A binary comparison against the vendor-supplied build confirmed structural differences between the two versions. What mobile-based social engineering technique does this scenario most accurately represent?","o":["Repackaging Legitimate Apps after modifying their internal structure","Publishing Malicious Apps designed to mimic trusted brands","Conducting SMiShing campaigns through fraudulent text messages","Deploying Fake Security Applications disguised as protection tools"],"a":[0],"e":"這種情境最準確地代表了對合法應用的重新包裝。 CEH 移動社交工程覆蓋說明，在重新包裝攻擊中，對手採取真實的應用程式，修改其內部程式碼或結構以包含惡意功能，並透過第三方市場再分配。 這裡的重要線索是，該應用在視覺和功能上與合法版本完全相同，而沙箱卻揭示出額外的出局活動，二進位比較證實了與官方建構的結構差異。 這個模式比僅僅釋出一個外觀相似的惡意應用更強，因為問題表明，基本上相同的應用有兩個版本，非正式副本被修改了。 Smishing 涉及欺詐性 SMS 訊息和假安全應用程式一般會假冒假冒為保護工具，兩者都不符合本案。 CEH 警告說，非官方應用程式商店是被重新包裝的移動應用程式的常見發售點，因為攻擊者可以將間諜軟體，adware，認證資訊被竊碼等惡意邏輯嵌入其他可信賴的軟體。 使用者經常看到一個熟悉的介面，因此假設應用程式是安全的，使得重新包裝是一種高效的基於移動的社交工程方法。"},{"n":412,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"short","q":"Attackers abused Android Debug Bridge (ADB) to issue unauthorized commands. What is the strongest countermeasure?","o":["Enforce VPN usage","Adopt biometric authentication","Disable ADB except in strictly controlled environments","Frequently update MDM systems"],"a":[2],"e":"Android Debug Bridge (ADB)是一個強大的除錯介面，如果設定錯誤，可以讓攻擊者遠端執行命令。 CEH v13 將被曝光的ADB 識別為關鍵的行動裝置安全風險，特別是在企業環境中。最有效的反制措施是完全禁用 ADB，除非是開發或故障排除明確要求，並且只在嚴格控制的環境中使用，這直接去除攻擊向量。 VPN 和生物鑑別技術可以改善安全性，但不能防止 ADB 濫用。 更新 MDM 系統很重要，但如果 ADB 仍然啟用，並不能消除風險。 CEH v13 明確建議嚴格 ADB 控制作為最佳做法，因此，選項 C 是正確答案。"},{"n":413,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and loT Hacking","t":"mid","q":"In Miami, Florida, a luxury resort deploys smart climate control units in guest rooms. During a red team engagement, ethical hacker Sophia Bennett discovers that once a compromised device is restarted, it continues running altered instructions without any integrity check before the operating system loads. This allows tampered firmware to run as if it were legitimate. Which secure development practice would most directly prevent this weakness?","o":["Allow code signing","Secure firmware or software updates","Utilize secure communication protocols","Ensure secure boot"],"a":[3],"e":"描述的弱點是，一個裝置可以重新啟動並仍然執行被篡改的韌體或前啟動程式碼\"在作業系統載入前不進行任何完整性檢查\"，最直接防止這個的安全開發實踐是 Secure Boot。 安全後靴從動力上起建立信任鏈，其中後靴過程的每個階段在被執行前都會驗證下級(bootloader，核心，韌體元件)的完整性和真實性。 如果驗證失敗(因為韌體被修改，沒有簽名，或者簽名不當)，裝置可以停止，倒回已知好影象，或者進入恢復模式--防止惡意的操作前程式碼執行，彷彿它是合法的。這對 IoT裝置來說尤其重要，比如智慧氣候控制單元，攻擊者可能試圖透過修改韌體來堅持，從而使惡意軟體能夠活下來。 沒有啟動前的完整性核查，受損裝置可以不斷裝入攻擊者控制指令，從而難以偵測和補救。為何其他選項不那麼直接:程式碼簽名(A)很重要，但是它本身並不能保證裝置會在啟動時驗證簽名。 安全啟動是執行前驗證已簽名的啟動元件的強制機制。安全的 firmware/software 更新 (B) 減少了惡意更新被安裝的機會(例如，簽名的 OTA 更新，認證的更新通道)，但如果啟動時缺少啟動時已被篡改的韌體的驗證，它們並不一定會阻止執行。安全通訊協定(C)保護中轉中的資料並保護裝置通訊，但不會在啟動過程中處理韌體完整性問題。因此，在作業系統前的這一完整性差距中，最直接的預防做法是 D。 確保安全靴子。"},{"n":414,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"Justin Fletcher is conducting an authorized assessment for EverSafe Technologies in Las Vegas. During the active reconnaissance phase, he interacts directly with the organization ' s infrastructure to retrieve structural details about how its public-facing systems are logically organized. His activity generates entries within the target environment ' s monitoring systems. Which type of active footprinting technique is Justin performing?","o":["Network/port scanning","DNS interrogation","Social engineering","User and service enumeration"],"a":[1],"e":"正確答案是 DNS 詢問。 CEH 偵察指導解釋活足跡涉及與目標環境的直接互動，它可以生成日誌或提醒。 DNS 詢問是一種主動技術，用於查詢名稱伺服器，以取得關於網域名稱，主機名稱，郵件伺服器，子域等資訊，以及揭示公共-造型系統如何邏輯排列的其他記錄。 問題具體說來，賈斯丁正在擷取組織公共宣傳系統的結構細節，他的活動被目標記錄下來，這與主動的 DNS 查詢一致。 Network 或連接埠掃描也活躍，但重點是發現開放的港口和可達到的服務，而不是公共系統的邏輯命名和組織結構。 社交工程是以人為本的， 和使用者及服務列舉通常以帳戶或系統服務為目的，而不是以域結構為目的。 CEH 材料反覆強調 DNS 是一個豐富的偵察源，因為 A，MX，NS，TXT，和 SOA 等記錄可以揭示基礎設施關係並命名公約。 由於目標是瞭解該組織的網際網路系統是如何組織和代表的，所以 DNS 審訊是最合適的。","s":"term"},{"n":415,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester evaluates a company ' s secure web application, which uses HTTPS, secure cookie flags, and strict session management to prevent session hijacking. To bypass these protections and hijack a legitimate user ' s session without detection, which advanced technique should the tester employ?","o":["Utilize a session fixation attack by forcing a known session ID during login","Perform a Cross-Site Scripting (XSS) attack to steal the session token","Exploit a timing side-channel vulnerability to predict session tokens","Implement a Man-in-the-Middle (MitM) attack by compromising a trusted certificate authority"],"a":[3],"e":"CEH 材料解釋，現代的 Web 應用程式部署多層安全--HTTPS，安全 Cookie，HttpOnly 旗，以及嚴格的工作階段再生--以防禦透過 XSS 或固定等手段來防禦像信物被竊等標準的劫持方法。 當這些保護被正確執行時，攻擊者必須去掉使用者端和伺服器之間的基本信任關係，才能成功擷取或操縱工作階段權杖。 CEH 描述的最先進技術之一是損害信任的憑證權威或將偽造的憑證注入到被害者的信任商店。執行透明的 MITM 攻擊， 儘管有 HTTPS 保護。 因為受害者的瀏覽器信任偽造的憑證， 加密流量 - 包括 工作階段 權杖 - 被暴露在攻擊者面前， 沒有生成瀏覽器警告或 IDS 警告。 計時側通道攻擊不被認為是 工作階段劫持 方法； XSS 被安全旗所緩解； 而 工作階段 固定值在 工作階段 重生時無效。 因此，破壞一個可信任的憑證權威，以促成無法被察覺的 MITM 攻擊，是最可行的方法。"},{"n":416,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"You are an ethical hacker at Apex Security Consulting, hired by Riverfront Media, a digital marketing firm in Boston, Massachusetts, to assess the security of their customer relationship management CRM web application. While evaluating the application's search feature, you input a long string of single quote characters into the search bar. The application responds with an error message suggesting that it cannot handle the length or structure of the input in the current SQL context. Based on the observed behavior, which SQL injection vulnerability detection technique are you employing?","o":["Detecting SQL Modification","Fuzz Testing","Function Testing","Error Message Analysis"],"a":[3],"e":"使用的技術是\"錯誤訊息分析\"(Error Message Analysis)，因為測試者是故意提供一個特殊字元酬載，然後解釋應用程式返回的資料庫或 SQL 解析出錯誤來推斷是否有注入點。 在符合 CEH SQL 注入方法中，SQL 注入的最早指標之一是:被設計出輸入器時導致應用程式生成資料庫錯誤，如語法錯誤，未關閉的引號，型別轉換失敗，或顯示輸入器如何被嵌入到查詢中與上下文相關的訊息等。 長串單引出是經典的觸發:如果使用者輸入被調校成 SQL 語句而沒有適當的消毒或參數化，引出者可以打破查詢結構並迫使資料庫引擎或 ORM 層丟擲一個會暴露查詢上下文的錯誤。情境明確宣告該回應是一個錯誤訊息，表明應用程式無法處理\"在當前 SQL 上下文\"中的輸入。 這意味著應用程式透過錯誤回應洩露資訊，CEH 強調這既是測試者偵測機會，也是安全弱點，因為詳細的錯誤可以引導攻擊者成功酬載建構。這主要不是\"偵測 SQL 修改\"，它側重於確認查詢邏輯或結果的變化，經常使用布林技術，不是\"功能測試\"，它驗證了應用功能，而不是在 SQL 層測試輸入處理。雖然輸入類似模糊，但模糊測試範圍較廣，並不具體取決於將 SQL 錯誤訊息解釋為偵測訊號。在這裡，決定性的證據是返回的 SQL-context 錯誤，使錯誤訊息分析成為正確的技術。","s":"term"},{"n":417,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"Which tool dumps Windows hashes?","o":["Mimikatz","John","Hydra","Aircrack-ng"],"a":[0],"e":"正確答案是 A，Mimikatz。在 CEH 的系統入侵與後滲透主題中，Windows 認證資訊攻擊通常鎖定雜湊值、快取認證資訊、Kerberos 票證，以及儲存在記憶體或 Windows 認證資訊存放區中的驗證資料。CEH 相關教材將 Mimikatz 視為從Windows 記憶體擷取認證資訊的事實標準工具，並指出它可從記憶體竊取雜湊值、PIN 碼與 Kerberos 票證，也支援Pass-the-Hash、 Pass-the-Ticket 與 Golden Ticket 攻擊。這與題目中的「傾印 Windows 雜湊值」完全相符。John the Ripper 主要是一款獲得雜湊後使用的密碼-快克工具。 Hydra 主要是網路服務線上登入/密碼攻擊工具。 Aircrack-ng 主要用於無線密碼/key 快克。 因此， 在選擇中， 米米克茲是與傾銷 Windows 認證資訊最具體相關的工具。 系統入侵階段就散開","s":"tool"},{"n":418,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During a red team assessment of a multinational financial firm, you are tasked with identifying key personnel across various departments and correlating their digital footprints to evaluate exposure risk. Your objective includes mapping user aliases across platforms, identifying geotagged media, and pinpointing potential insider threats based on social posting behavior. The team has shortlisted multiple tools for the task. Considering the technical capabilities and limitations described in the approved reconnaissance toolkit, which tool provides cross-platform username correlation by scanning hundreds of social networking sites, but does not natively support geolocation tracking or visualizing identity relationships?","o":["Maltego","Creepy","Sherlock","Social Searcher"],"a":[2],"e":"正確答案是夏洛克(C。夏洛克用於搜尋一個跨越許多社交網路和線上平台的使用者名稱，其主要目的為跨平台使用者名稱關聯性，它不會像 Creepy 一樣在本土提供地理定位追蹤，也不會像 Maltego 那樣提供關係-圖形視覺化。 符合 CEH 偵察材料描述為 Maltego 是蒐集不同來源資訊的工具 並代表關係 透過以圖表為基礎的分析。 另一個參考文獻解釋， OSINT使用者名稱- correlation 工具可以驗證一個 使用者名稱 或設定檔存在於數百個平台中。 夏洛克匹配 使用者名稱- 連線函式。選項 A。 Maltego 是不正確的，因為 Maltego 被用於關係圖繪製和視覺調查。選項 B。 Creepy 是不正確的，因為Creepy 與社交媒體和影象後設資料提供的地理定位智慧有關。選項 D。 Social Searcher 不正確，因為它主要用於搜尋和監測社交媒體內容，而不是在上百個站點中廣泛使用使用者名稱列舉。選項 C。 夏洛克是正確的，因為它專門檢查在許多線上平台上是否存在使用者名稱。因此，最好的答案是 C。 夏洛克。","s":"tool"},{"n":419,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"Targeted, logic-based credential guessing using prior intel best describes which technique?","o":["Strategic pattern-based input using known logic","Exhaustive brute-force testing","Shoulder surfing","Rule-less hybrid attack"],"a":[0],"e":"這描述了基於規則或邏輯的密碼攻擊，CEH v13 將其歸類為智慧，有針對性猜想技術:攻擊者使用已知的模式--例如命名慣例、日期或個人利益--來縮小鍵位並增加成功率。選項 A 準確地反映了這個方法。 選項 B 是蠻力，是隨機而詳盡的。 選項 C 是物理觀察。 選項 D 描述了混合攻擊，沒有結構邏輯。 CEH v13 強調，在攻擊者擁有事先的情報時，基於模式的攻擊是高度有效的，因此，選項 A 是正確的。","s":"term"},{"n":420,"c":"密碼學","ce":"Cryptography","t":"mid","q":"You are Alex, a forensic responder at HarborHealth in Seattle, Washington. During a live incident response you must secure an enterprise Windows server ' s system partition and attached data volumes without rebooting user machines or disrupting domain authentication. The IT team prefers a solution that integrates with Windows platform features (including hardware-backed startup protection and centralized key escrow via Active Directory/management policies) and provides transparent full-disk protection for the OS volume. Which disk-encryption solution should you deploy?","o":["FileVault","BitLocker Drive Encryption","VeraCrypt","Rohos Disk Encryption"],"a":[1],"e":"正確答案是 B。 BitLocker Drive 加密，因為要求描述了本土的 Windows 全磁碟加密，緊密結合了企業 Windows 安全特性和集中管理。 BitLocker 是微軟的內建磁碟加密技術，旨在為作業系統磁碟區提供透明的加密和額外的固定/removable驅動器。 它透過與\"信任平台\"模組(TPM)的整合支援硬體後啟動保護，該模組在解鎖 OS 卷前可以幫助保護加密金鑰並驗證靴子完整性，這符合\"硬體後啟動保護\"的提示要求。設想方案還強調\"透過 Active Directory/management 政策將關鍵代管權集中\"。 在企業部署中，BitLocker 恢復資訊可被備份到 Active Directory 並經由 Group Policy/MDM 控制進行管理，使得伺服器和端點之間能夠實現標準化執行(加密設定，恢復金鑰處理，合規報告)。 這是在保健等受管制環境中的一項核心業務優勢:它能夠迅速作出反應(可收回性)、一致的政策應用以及對加金金鑰的便於審計的控制--而不需要第三方金鑰管理工具來滿足基本的代管需要。此外，迅速要求以相容 Windows 平台行為並儘量減少中斷的方式保護\"系統分割和相接的資料卷\"。 BitLocker 支援加密 OS 卷和資料卷，並且它的設計一旦啟用就具有透明操作性，因此正常的伺服器使用和域認證繼續如所預期的那樣。為什麼其他選項不正確:FileVault 是蘋果公司用於 macOS 的全盤加密，而不是 Windows。VeraCrypt 和 Rohos Disk 加密是第三方解決方案，可以提供磁碟加密，但它們並不匹配所宣稱的深盤 Windows 企業整合的優先選擇，與基於 TPM-的起動保護，和 Active Directory-基於回收鍵透過標準的微軟管理政策代管。因此，這個Windows 企業要求的最佳解決方案是 BitLocker Drive 加密。","s":"tool"},{"n":421,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"A company hires a hacker to test its network security by simulating real-world attacks. The hacker has permission and operates within legal boundaries. What is this type of hacker called?","o":["Script Kiddie","Black Hat Hacker","Grey Hat Hacker","White Hat Hacker"],"a":[3],"e":"CEH v13 將白帽駭客定義為進行授權評估，以識別弱點並強化一個組織的防守的資安專業人員。 白帽活動的決定性特徵是正式許可的存在--通常是透過簽署聘用規則、工作範圍和該組織的明確授權。 CEH 強調白帽遵守法律界限、遵循道德準則和記錄結論以支援補救。 他們可能與惡意駭客使用相同的工具和方法，但意圖和授權區分出他們。 相形之下，黑帽在操作時未經許可，且有惡意意圖。 灰帽在操作時未經授權，但可能沒有惡意動機，因此在正式的滲透測試接戰中不合適。指令碼中的孩子缺乏專業技能，依賴預先製作的工具而不瞭解基本技術。 因此，被描述的駭客是一頂白色帽子 - - 一種道德職業的測試。","s":"term"},{"n":422,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"A penetration tester finds malware that spreads across a network without user interaction, replicating itself from one machine to another. What type of malware is this?","o":["Keylogger","Ransomware","Virus","Worm"],"a":[3],"e":"CEHv13 課程軟體的綜合解釋:CEH v13 描述蠕蟲是獨立的惡意軟體，可以自我複製而不需要使用者幫助。 病毒需要主機檔案，通常由使用者動作所觸發。 蠕蟲透過掃描網路、利用弱點或複製自己來存取而自主傳播。蠕蟲以消耗頻寬、降低系統效能和為攻擊者製造後門而造成迅速而廣泛的破壞而出名。典型的例子如 Conficker、WannaCry 和 SQL Slammer 強化了自動傳播的破壞潛力。 CEH 強調蠕蟲經常使用網路共享、開放埠或無標的弱點來橫向移動。 相比之下，鍵盤管理員收割鍵盤，勒索軟體加密資料和要求付款，病毒需要使用者參與才能傳播。 情境中的行為 - - 整個網路的自動複製 - - 根據CEH 的惡意軟體分類學，是蠕蟲活動的決定性特徵。","s":"term"},{"n":423,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"During an internal red team engagement, an operator discovers that TCP port 389 is open on a target system identified as a domain controller. To assess the extent of LDAP exposure, the operator runs the command ldapsearch -h < Target IP > -x -s base namingcontexts and receives a response revealing the base distinguished name (DN): DC=internal,DC=corp. This naming context indicates the root of the LDAP directory structure. With this discovery, the operator plans the next step to continue LDAP enumeration and expand visibility into users and objects in the domain. What is the most logical next action?","o":["Launch a brute-force attack against user passwords via SMB","Conduct an ARP scan on the local subnet","Attempt an RDP login to the domain controller","Use the base DN in a filter to enumerate directory objects"],"a":[3],"e":"一旦透過 LDAP 命名 Contexts 識別出鹼基 DN，CEH 就教導列舉的下一步是使用此 DN 查詢目錄樹，這樣可以擷取使用者，組，電腦等 AD 物件。 LDAP 基於列舉需要植入鹼基 DN 的有效搜尋過濾器。"},{"n":424,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"You are an ethical hacker at CyberShield Analytics, hired by Coastal Education Services, a tutoring platform in Miami, Florida, to test the security of their student portal. While probing the portal ' s course enrollment page, you input a crafted value into the course ID field, appending a condition that checks if the first character of the database name is a specific value. The application does not display error messages or additional data, but the page takes significantly longer to load when the condition evaluates to true, indicating a deliberate delay. Based on the observed behavior, which SQL injection technique are you employing?","o":["Boolean exploitation","Time-based blind SQL injection","UNION SQL injection","Error-based SQL injection"],"a":[1],"e":"所描述的行為是時間盲 SQL 注入的教科書指標。 在 Web 應用程式入侵的 CEH 方法中，當應用程式不返回資料庫錯誤，查詢結果，或給攻擊者動詞訊息時，會使用盲 SQL 注入。 攻擊者不是透過顯示輸出直接擷取資料，而是透過觀察間接副作用來推斷出真實或虛假的結果。在此， 所設計的輸入附加關於 資料庫 名稱的第一個字元的有條件測試。 當條件屬即時， 頁面回應會變成“ 顯著更長的”， 這意味著被注入的 酬載 觸發了 資料庫 延遲函式或耗時操作。 這種刻意的時間差會成為通訊通道:一個較長的回應表示\"真\"，而一個正常的回應則表示\"假\"。 透過重複這種逐個字元的測試，攻擊者可以列出像資料庫名，表名，有時還認證資訊--儘管應用程式沒有顯示出錯或返回的資料。這與基於 Boolean 的 blind SQL 注入 不同， 其中透過可見的頁面內容更改來推斷( 例如， 當條件出現時， 一個回應頁面看起來不同或包含不同的文字))它也不同於UNION-基於 SQL 注入，它依賴於合併查詢以返回應用程式回覆中的資料，而基於錯誤的 SQL 注入依賴於資料庫錯誤訊息洩露資訊。因為這裡唯一可觀察到的訊號是回應時間，CEH 將其具體歸類為基於時間的盲 SQL 注入。 防禦控制包括參數化的查詢，輸入驗證，最不優惠的資料庫帳戶，和 WAF 規則來偵測延遲函式和異常的查詢模式。","s":"term"},{"n":425,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"Which of the following addresses the secrecy and privacy of information?","o":["Availability","Integrity","Confidentiality","Authentication"],"a":[2],"e":"正確答案是 C.保密，在資訊保安方面，CIA 三合一包括保密、誠信和可用性。 機密性具體涉及資訊的保密和隱私，確保敏感資料僅由經授權的個人、系統或流程取得、檢視或披露。 符合 CEH 的材料解釋說，機密性意味著資訊是保密的，不應是機密的。另一 CEH 考試指南來源指出，保密涉及資訊的保密和隱私，防止向未經授權的個人或實體披露。不正確，因為它確保了系統和資料在需要時可以存取。完整性是不正確的，因為它保護了資料不被未經授權的修改。認證也是不正確的，因為它驗證了身分，但本身並不定義保密或隱私。因此，最好的 CEH 答案是保密。","s":"term"},{"n":426,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"At TechTrend Innovations in Silicon Valley, network administrator Jake Henderson reviews the configuration of their web infrastructure. While inspecting the web server setup, he identifies the directory that stores the publicly accessible website content such as HTML files, images, and client-side scripts. Jake highlights this area as a frequent target for attackers, since improper permissions could expose sensitive files to unauthorized users. Which web server component is Jake analyzing in this scenario?","o":["Application Server","Document Root","HTTP Server (Core)","Virtual Document Tree"],"a":[1],"e":"包含可公開存取的網頁內容的目錄-- 包括 HTML 網頁， 影象， JavaScript， CSS， 以及其他使用者端側資產-- 被稱為檔案根。 這是一個網路伺服器地圖到網站“/”位置的基礎檔案系統路徑。 當使用者請求資源(例如:https://site.com/index.html)，web 伺服器通常會解決所設定的檔案根下的檔案的 URL 路徑，然後為使用者端服務(需服從存取控制和伺服器設定)。劇情細節與這完全吻合:Jake 識別出\"儲存可公開存取的網站內容的目錄\"，並指出由於權限不當的風險，它經常成為攻擊者的目標。檔案根安全至關重要，因為過度放任閱讀或瀏覽存取會暴露從未打算公開的檔案，如備份、設定檔、臨時檔案、原始碼檔案或敏感資料不慎被放入網路可存取路徑。錯誤的設定也可以允許目錄清單，允許攻擊者直接列舉和擷取檔案。 攻擊者常常對常見檔名進行探測(如:舊的.zip 備份，.bak 檔案，被曝光的.env 檔案，或測試頁)，正因為檔案根是此類錯誤可以外部達到的地方。為什麼其他選項不準確:一個應用程式伺服器(A)執行了伺服器-側應用邏輯(例如 Java/.NET 應用容器)，而不是特定的靜態公共網路內容目錄。 HTTP 伺服器(Core)(C)指網路伺服器軟體/service 處理 HTTP 請求，不是內容目錄本身。一個虛擬檔案樹(D)描述了將 URL 對映到資源中的邏輯結構(有時透過別名和虛擬主機)，但問題在於儲存公開可存取內容的目錄--這是檔案根。因此，傑克正在分析 B。 檔案根。"},{"n":427,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"Null sessions are un-authenticated connections (not using a username or password.) to an NT or 2000 system. Which TCP and UDP ports must you filter to check null sessions on your network?","o":["139 and 443","137 and 139","137 and 443","139 and 445"],"a":[3],"e":"正確答案是 D，因為 Windows Null 工作階段被綁入 SMB/CIFS，而 NetBIOS 基於 IPC$ 管理共用的存取。 CEH 列舉內容描述為:Null 工作階段與 WindowsNT/2000/XP 系統使用一無效使用者名稱和密碼的無認證連線，允許攻擊者列舉使用者，組，股份，機器，以及 SID。 同樣的 CEH 材料稱，工作階段無效需要存取 TCP139 和/orTCP445 埠。 TCP139 是NetBIOS 工作階段服務，傳統上用於 SMB 超越 NetBIOS，。 而 TCP445 是直接託管的 SMB 於 TCP。 CEH 列舉表格還列出 TCP139 為 NetBIOS 工作階段 Service， TCP445 為 SMB 於 TCP137 主機通訊。 連接埠 443 是 HTTPS，與無效的工作階段無關。 連接埠 137 支援 NetBIOS 名稱服務，但並非主要的為正 Null 工作階段連線連接埠。 因此，最好的答案是 139 和 445。","s":"term"},{"n":428,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"short","q":"Which attack best demonstrates covert eavesdropping via smartphone sensors?","o":["Malicious APK exploitation","Man-in-the-Disk attack","Spearphone attack","Tap `n Ghost attack"],"a":[2],"e":"Spearphone 攻擊包含在 CEHv13 移動平台駭客中，利用智慧手機加速儀推斷出揚聲器的語音振動--沒有麥克風許可。這次攻擊表明內建感測器如何被濫用來進行隱蔽監視，使得它成為評估隱私風險的理想。其他選擇涉及不同的攻擊向量，與基於感測器的竊聽無關。因此，選項 C 是正確的。","s":"term"},{"n":429,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"During a red team engagement at a retail company in Atlanta, ethical hacker James crafts a session with the company ' s shopping portal and deliberately shares that session ID with an unsuspecting employee by embedding it in a link. When the employee clicks and logs in, their activity is bound to the attacker ' s pre- assigned session. Later, James retrieves the employee ' s input from that same session to demonstrate the flaw to management. Which session hijacking technique is James most likely using?","o":["Session Donation Attack","Session Replay Attack","Session Prediction","Session Fixation Attack"],"a":[3],"e":"這種情境是經典的工作階段固定攻擊。在工作階段固定中，攻擊者在受害者驗證前為受害者設定了已知的工作階段識別碼(工作階段 ID)或\"固定符\"，然後攻擊者說服受害者使用預先確定的工作階段--通常將工作階段識別碼嵌入到 URL，連結，或Cookie 設定機制中。 一旦受害者日誌輸入，應用程式就錯誤地繼續使用相同的工作階段 ID(而不是在認證時釋出新的 ID)，因此，攻擊者可以重新使用已知的工作階段 ID 來存取受害者認證的工作階段上下文。被描述的序列與工作階段定型完全吻合:詹姆斯首先將一款工作階段並獲得工作階段 ID，然後透過連結與被害者共享，被害者點選並被日誌輸入並\"他們的活動與被害者預先指定的工作階段繫結\"。 後來，詹姆斯存取工作階段並取回被害者的輸入--證明認證與被害者控制的工作階段權杖繫結。為何其他選項不合適:工作階段重放(B)涉及捕獲一個有效的工作階段權杖(例如透過嗅探，XSS，或滲出)並重放，但並不要求在被害者日誌入前預先設定權杖。工作階段預測(C) 是指由於隨機性弱而導致的猜測或計算有效的工作階段 ID。 在此攻擊者不猜測；他故意提供他已經控制的工作階段 ID。\"工作階段捐贈(A)\"不是這個有名的網路工作階段-風格分類學中的弱點的標準分類；所描述的行為與固定一致。因此，正確答案是 D。 工作階段\"固定攻擊\"。","s":"term"},{"n":430,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"At a government research lab, cybersecurity officer Nikhil is compiling a vulnerability assessment report after scanning the internal subnet. As part of his documentation, he lists the IP addresses of all scanned hosts and specifies which machines are affected. He includes tables categorizing discovered vulnerabilities by type such as outdated software, default credentials, and open ports. Which section of the vulnerability assessment report is Nikhil working on?","o":["Findings","Risk Assessment","Supporting Information","Assessment Overview"],"a":[0],"e":"在 CEH 對齊的弱點評估報告中，“結果”部分是評估者以清晰、有條理和可操作的方式記錄掃描和驗證過程中發現的東西。這部分報告通常包含具體成果:已查明的資產、受影響的系統、弱點細節以及支援每個問題的證據。 問題指出，Nikhil 列出了被掃描的主機的 IP 位址，識別哪些機器受到影響，幷包括了諸如過時軟體，預設認證資訊和開放埠等弱點分類表。這些是經典的\"結果\"文物，屬於\"發現\"，因為它們傳達了觀察到的安全弱點，並且存在它們的地方。風險評估部分一般以結論為基礎，將風險的嚴重程度、可能性、影響和總體評級，通常將問題與商業後果和優先順序掛鉤。 雖然 Nikhil 以後可能會根據風險程度將預設值認證資訊視為重要或開放的埠，但列舉弱點並將其與特定主機聯絡起來的行為是結論活動，而不是風險評分。輔助資訊通常包含一些附錄，如工具設定、原始掃描輸出、方法參考、假設、範圍界限和詞彙專案等。儘管 IP 清單和表格可能完整地出現在附錄中，但即時描述它們的方式，它們正被用作對已發現弱點的主要分類列報，這與 \"調查結果 \" 一節是一致的。評估概覽一般是對範圍、目標、時間表和辦法的高階別總結，而不是詳細的主機-by-主機弱點表，因此正確的一節是調查結果。","s":"term"},{"n":431,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"During an authorized security assessment for a regional transportation authority in Sacramento, California, an ethical hacker is tasked with evaluating externally exposed web service interfaces used to exchange scheduling data with third-party transit applications. As part of the engagement, the ethical hacker retrieves publicly accessible service description files and systematically analyzes them to understand the operations supported by the service. By reviewing these definitions, the tester identifies undocumented methods, expected input parameters, and response schemas that were not clearly outlined in the public integration documentation. The activity provides a detailed understanding of the service's available capabilities before deeper testing begins. From the options below, identify the web service attack technique demonstrated in this scenario.","o":["SOAP Injection","Application Logic Attacks","XML Injection","WSDL Probing Attacks"],"a":[3],"e":"正確答案是 D。 WSDL 探測攻擊。該情境描述擷取和分析服務描述檔案，以識別網路服務操作，方法，參數，以及回應策略等。 直接匹配 WSDL 偵測。 WSDL，或 Web Services Driference Language，描述一個網路服務所暴露的功能，包括所支援的操作和訊息結構。 符合 CEH 的雲和網路服務材料將 WSDL，SOAP，和 UDDI 識別為在服務劫持和偵察活動期間攻擊者可能捕捉或分析的與網路服務相關的資訊。 符合 CEH 的 Web 應用程式材料也解釋出 SOAP 被用於網路服務中交換結構化資訊，而與 SOAP/web 服務結構的惡意互動可以暴露後端功能。選項 A。 SOAP 注入是不正確的，因為測試者沒有注入惡意的 SOAP 有效酬載。選項 B。 應用邏輯攻擊範圍太廣，涉及濫用商業邏輯，而不是專門審查服務說明。選項 C。 XML 注入是不正確的，因為情況不涉及注入惡意的 XML 內容。選項 D。 WSDL 探測攻擊是正確的，因為測試者正在偵測服務描述檔案，以瞭解被曝光的網路服務能力。因此，最好的答案是 D。 WSDL 探測攻擊。","s":"term"},{"n":432,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A regional e-commerce company in Dallas, Texas operates an Apache-based web server to manage product catalogs and promotional campaigns. During an authorized assessment, a security consultant analyzes how the platform processes a referral parameter embedded in product-sharing links. While reviewing responses through an intercepting proxy, he observes that values supplied in the referral parameter are incorporated into metadata returned to the browser. By introducing carefully crafted delimiter characters into the parameter, he notices that the structure of the server's outbound response changes in an unexpected manner. Further testing shows that the manipulated input causes the server to generate multiple logically distinct response segments within what should have been a single transaction. When the crafted link is accessed through a standard browser, the client interprets the injected portion as a separate directive, resulting in redirection behavior influenced by the attacker-controlled input. Identify the web server attack technique being demonstrated in this scenario.","o":["Web Cache Poisoning Attack","Directory Traversal Attack","HTTP Response-Splitting Attack","Frontjacking Attack"],"a":[2],"e":"正確答案是 HTTP 反應-分拆攻擊。 CEH 網路伺服器覆蓋範圍解釋，HTTPHTTP 回應分割發生在攻擊者控制的輸入被插入到 HTTP 頭或回應後設資料時，這樣可以使伺服器將一個預定的回應分拆為兩個獨立的回應或回應部分。 問題具體描述了修改出入境回應結構的被精心設計的劃界字元，並導致瀏覽器將被注入的內容解釋為一個單獨的指令，包括攻擊者-被影響重定向。這是 HTTP 回應分割的經典行為。目錄 traversal 將涉及未經授權路徑導航到被限制的檔案或目錄。 Web 快取中毒的重點是腐蝕快取回應，因此後期使用者收到惡意或被更改的內容，這在概念上是相關的，而在此所描述的直接機制上不是。 CEH 材料呈現出 HTTP 回應分解作為達到目的的手段，常被用來透過控制第二次回應或標題內容來觸發重定向行為或為二次攻擊提供方便。 由於攻擊者操縱伺服器輸出在一個單項交易內變成多個回應元件，所以 HTTP 反應-分解是最精確的答案。","s":"term"},{"n":433,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"When referring to the domain name service, what is a zone?","o":["A collection of domains","The zone namespace","A collection of alias records","A collection of resource records"],"a":[3],"e":"正確答案是 D，因為在 DNS 中，一個區是包含該部分域樹的 DNS 資源記錄的 DNS 名稱空間的行政部分，這些記錄定義了名稱的解析方式和服務的定位方式。 例子包括:主機至 IP 對映的 A 記錄，郵件伺服器的 MX 記錄，名稱伺服器的 NS 記錄，別名的 CNAME 記錄，倒向取景的 PTR 記錄，以及用於識別該區權威的 DNS 伺服器的 SOA 記錄。 在 CEH 偵察和足跡主題中，DNS 資訊很重要，因為 DNS 區可以揭示出有價值網路細節，如主機名稱，郵件伺服器，名稱伺服器，以及其他基礎設施資訊。 選項 A 過於寬泛，因為一個區不僅僅是一個網域名稱集合。 選項 B 模糊不清，沒有定義區域本身。選項 C 過於狹窄，因為別名記錄只是 CNAME 記錄，是 DNS 資源記錄的一種型別，因此，DNS 區域最好被定義為資源記錄的集合。"},{"n":434,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"During a security rev
