"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"As a Certified Ethical Hacker assessing session management vulnerabilities in a secure web application using MFA, encrypted cookies, and a WAF, which technique would most effectively exploit a session management weakness while bypassing these defenses?","o":["Utilizing Session Fixation to force a victim to use a known session ID","Executing a Cross-Site Request Forgery (CSRF) attack","Exploiting insecure deserialization vulnerabilities for code execution","Conducting Session Sidejacking using captured session tokens"],"a":[0],"e":"CEHWeb 應用程式入侵模組識別出工作階段 Fixation 是一種能繞過高階認證控制，包括 MFA 的強大的工作階段管理攻擊。在工作階段定型中，攻擊者強迫被攻擊者使用攻擊者已經知道的工作階段 ID 進行認證。 認證完成後，攻擊者會劫持有效的工作階段而不需要認證資訊。選項 A 直接瞄準工作階段管理邏輯。選項 B 利用授權邏輯，而不是工作階段處理。選項C 與工作階段管理無關。選項 D 透過加密 Cookie 和 HTTPS 來緩解。 CEH 明確警告，應用程式在認證後必須再生出工作階段 ID。"},{"n":139,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"mid","q":"In the neon-lit sprawl of Las Vegas, Nevada, a luxury hotel's smart room control system suffered a breach, allowing an intruder to manipulate guest room settings. The incident investigation revealed that the IoT devices lacked any mechanism to verify the integrity or authenticity of software prior to execution, allowing tampered instructions to run unchecked. As Emna Ruza, a cybersecurity consultant brought in to assess the breach, you recommend a solution that ensures only authorized, validated code is executed on the devices. Which secure development practice are you advising the hotel to implement?","o":["Allow code signing","Ensure secure boot","Secure firmware or software updates","Utilize secure communication protocols"],"a":[0],"e":"描述的核心弱點是 IoT 裝置\"缺少任何在被執行前驗證軟體完整性或真實性的機制\"，直接將程式碼簽名的需要對映出。 在符合 CEH IoT 安全指引中，程式碼簽名確保了韌體和軟體影象由可信任的當局加密簽名，並在安裝或執行之前在裝置上進行驗證。 此驗證確認了兩個關鍵屬性:完整性，指程式碼沒有被更改或被篡改，真實性，指程式碼真正出自授權的出版商。如果攻擊者試圖引入被修改的二進位或惡意指令，簽名驗證失敗，裝置可以拒絕執行，防止未經授權的程式碼執行。雖然安全後靴是緊密相聯的，但具體來說，它是一種後靴時間的信託鏈機制，在啟動時驗證後靴裝貨機和早期韌體，然而，這個問題強調普遍缺乏\"執行前\"的核查，這比後靴範圍更廣，並且最直接的是透過程式碼簽名作為安全開發和放行做法來解決。 安全韌體或軟體更新也很重要，但安全更新通常依靠程式碼簽名作為基本控制，使更新具有可信賴性。安全通訊協定保護在途資料，但不會阻止裝置上已經被篡改的程式碼被執行。因此，確保僅在裝置上執行經授權、經驗證的程式碼的最適當的安全開發做法是實施帶有強制性簽名核查的程式碼簽名。"},{"n":140,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"A multinational manufacturing company in San Jose, California has deployed a perimeter firewall to protect its internal production networks. During a red team exercise, testers observe that the device monitors active TCP communications and allows traffic to continue only when packets correspond to recognized, previously established connections. The firewall evaluates multiple header attributes across ongoing communications while operating inline at the network boundary. From a firewall architecture perspective, what type of firewall is most likely in use at this perimeter?","o":["Stateful Multilayer Inspection Firewall","Circuit-Level Gateway Firewall","Application-Level Firewall","Packet Filtering Firewall"],"a":[0],"e":"正確答案是 A。 Stateful 多層檢查防火牆。防火牆正在追蹤已建立的 TCP 通訊，並且只有在它們與已知的活動工作階段對應時才允許封包，這是狀態檢查行為。 符合 CEH 防火牆材料表示，狀態多層檢查防火牆儲存了狀態工作階段的狀態，並使用該狀態工作階段過濾出意料的流量。 另一種 符合 CEH 的參考文獻解釋，狀態多層檢查防火牆追蹤連線的整個狀態，而 EC-Council 也稱這些狀態多層檢查防火牆。選項 B。 Circuit-level Gateway 防火牆是不正確的，因為電路級閘道器驗證了工作階段的建立，如 TCP 握手，但不能提供本文所描述的同多層狀態的封包檢查。選項 C。 應用程式級 防火牆是不正確的，因為應用程式防火牆作為代理執行，檢查應用程式層內容。選項 D。 封包 Filtering 防火牆是不正確的，因為基本的封包濾波器對封包頭進行無國籍的評價，不追蹤已建立的連線狀態。因此，最好的答案是 A。 Stateful 多層檢查防火牆。","s":"term"},{"n":141,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"During a forensic log review at a satellite communications provider in Denver, Colorado, cybersecurity analyst Kevin Morales identified subtle timestamp irregularities in archived telemetry records. Although the discrepancies were minor, regulatory reporting standards required confirmation that the system clock was synchronizing correctly with its configured time sources. Kevin needed to interact directly with the host's running time service to review its current associations and operational state. He was not attempting to reset the clock or trace the hierarchy of upstream time authorities, but rather to query the active service for detailed status information from the target machine. Identify the command Kevin should execute to obtain this information.","o":["ntptrace [-n] [-m maxhosts] [servername/IP address]","ntpq [-inp] [-c command] [host] [...]","ntpdc [-ilnps] [-c command] [host] [...]","ntpq -p [host]"],"a":[3],"e":"正確答案是 D。 ntpq -p [主機]。情境需要查詢活動 NTP 服務以審查其當前的關聯和業務狀態。 ntpq 工具旨在查詢並監視NTP 守護程序。 CEH-aconit NTP 列舉材料宣告 ntpq 是一個命令列工具，用於查詢 NTP 伺服器，監視 ntpd 操作，以及確定效能。 並總結其狀態。選項 A。 ntptrace 是不正確的，因為 ntprace 遵循了 NTP 伺服器的鏈條回到了主時間源， 情境中特別指出了 Kevin 不是在追蹤上游等級。選項 B。 ntpq [-inp] [-c 命令] [主機] [.]是 ntpq 的一種通用語法形式，但檢視同級關聯和狀態的最精確指令是 ntpq -p [主機]。選項 C。 ntpdc 是不正確的，因為雖然 ntpdc 可以查詢 ntpd，但它更與查詢守護程序狀態和請求狀態變化有關。 問題要求命令審查當前關聯和執行狀態，最直接匹配 ntpq -p。選項 D。 ntpq -p [主機] 是正確的，因為它直接查詢了 NTP 服務，並列印了對等關聯/狀態資訊。因此，最好的答案是 D。 ntpq -p [主機]。"},{"n":142,"c":"密碼學","ce":"Cryptography","t":"mid","q":"A hacker is analyzing a system that uses two rounds of symmetric encryption with different keys. To speed up key recovery, the attacker encrypts the known plaintext with all possible values of the first key and stores the intermediate ciphertexts. Then, they decrypt the final ciphertext using all possible values of the second key and compare the results to the stored values. Which cryptanalytic method does this approach represent?","o":["Flood memory with brute-forced credentials","Scrape electromagnetic leakage for bits","Use midpoint collision to identify key pair","Reverse permutations to bypass encryption"],"a":[2],"e":"CEH 涵蓋高階密碼分析攻擊，包括 Met-in-the-Middle(MITM)攻擊，這些攻擊對多輪對稱式加密方案特別有效。 當一個演算法兩次使用不同的金鑰加密資料時，天真野蠻的強力方法需要測試兩種金鑰的每一種可能的組合--時間複雜性為 2#×2#。Metle-in-Middle 將問題分成了一半，從而大大降低了這種複雜性。 攻擊者使用第一個鍵的所有潛在值加密 明文並儲存結果。 然後使用第二個鍵的所有可能值解密最終的 密文。 當一箇中間值匹配一個儲存中時， 將識別相應的金鑰對。 CEH強調此值。方法利用兩個加密層之間缺乏金鑰獨立性，從而證明雙倍加密並不總是雙安全。這次攻擊是眾所周知的，它針對的是 2DES，這是 CEH 涵蓋的歷史例子之一。它與側道攻擊、野蠻-武力泛洪或平面反轉無關；它嚴格依賴中點匹配來減少計算工作量。"},{"n":143,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"Prior to a federal audit, a cybersecurity consulting firm conducted an exposure review for a software company in Salt Lake City, Utah. The engagement focused on evaluating infrastructure reachable through the organization's publicly registered domain records. The consultants identified open service ports on several servers, examined their patch levels for outdated components, and reviewed available DNS zone information to understand how systems were presented to remote systems. Based on the activities described, what type of vulnerability scanning is being performed?","o":["Internal Scanning","External Scanning","Manual Scanning","Network-based Scanning"],"a":[1],"e":"正確答案是\"外部掃描\"。 CEH 弱點評估材料解釋，外部掃描評價了組織外的各方所可見的系統，服務和曝光，一般是從網基攻擊者的角度來評價。 在此情況下，顧問們正在審查透過公開註冊的網域名稱記錄可以達到的基礎設施，確定在被暴露的伺服器上的開放埠，檢查過時的部件，並審查遠端系統能夠看到的資訊 DNS，這些活動清楚地表明瞭外部觀點。 基於網路的掃描範圍更廣，既可以進行內部掃描，也可以進行外部掃描，因此，這不是這裡最準確的答案。 內部掃描將評估組織內部的資產，人工掃描將描述這一方法，而不是曝光視角。 CEH 強調，外部掃描用於瞭解公眾攻擊面，包括網際網路上網服務、已曝光的應用程式、開放的埠、 SSL/TLS 姿態以及外部人可獲得的與域有關的資訊。 由於該接戰以可以透過公共記錄和被曝光的主機接觸和從網路外學到的東西為中心，因此掃描最好被歸類為\"外出掃描\"。","s":"term"},{"n":144,"c":"密碼學","ce":"Cryptography","t":"long","q":"You are Maya, a security engineer at HarborPoint Cloud Services in Chicago, Illinois, performing a post- incident hardening review after an internal audit flagged multiple services that rely on legacy public-key algorithms. The engineering team must prioritize actions company-wide to reduce long-term risk from future quantum-capable adversaries while development continues on a large refactor of several services. Which proactive control should Maya recommend as the highest-priority change to embed into the organization ' s development lifecycle to improve future resistance to quantum-based attacks?","o":["Include quantum-resistance checks in SDLC and code review processes","Encrypt stored data with quantum-resistant algorithms","Use quantum-specific firewalls to protect quantum communication channels","Break data into fragments and distribute it across multiple locations"],"a":[0],"e":"最優先的主動控制\"嵌入組織的發展生命週期\"是在 SDLC 和程式碼審查程式中包括量子抵抗檢查，設想方案強調公司範圍廣的長期減少風險戰略，而發展則在主要要素上繼續。 在這方面，最可擴充套件和最持久的控制是治理和工程衛生:確保新的特徵和再構件不會再出現薄弱或遺留的密碼學，並確保各小組始終如一地選擇符合現代指導和未來遷移計劃的演算法和關鍵尺寸。嵌入 SDLC 的檢查意味著制定標準和護欄，例如經批准的密碼庫，被禁演算法清單(例如:遺留的 RSA 金鑰大小，被腐爛的曲線，弱的雜湊)，密碼學設計審查，用於加密使用的自動依賴掃描，以及標出不符合執行的 CI/CD 政策門。 這種方法會減少\"crypto splopl\"，防止新的技術債務，並隨著組織系統現代化而為向後量子或抗量子方法的過渡開闢出一條有條理的道路。為何其他選擇不是最佳\"最優先\"SDLC-被嵌入的控制:用量子耐力演算法(B)加密所儲存的資料可能適合保護長生敏感資料(\"現在收割，稍後再解密\")，但它是一種有針對性的技術控制，在重構過程中可能無法立即跨出許多服務，它本身也不妨礙開發者在其他地方繼續實施遺留的公用金鑰計劃。量子特異性防火牆(C)在典型的企業環境中，對量子後準備狀態不現實或標準控制。不同地點的分解資料(D)在一些設計中可以幫助恢復/confidentiality，但並不解決核心問題:防止持續依賴薄弱公用金鑰密碼學。因此，最好的答案是 A。 在 SDLC 和程式碼審查程式中包括量子-抗力檢查。"},{"n":145,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"During a penetration test at Greenview Credit Union in Chicago, Illinois, ethical hacker Rebecca Hayes simulates an attacker who contacts employees using a voice channel. The number displayed on their devices appears identical to the institution's official line, convincing staff that the request is legitimate. Rebecca then asks for account credentials under the pretense of a mandatory security check. Which mobile attack vector is she demonstrating?","o":["Call Spoofing","OTP Hijacking","Bluebugging","SMiShing"],"a":[0],"e":"正確答案是 A。 Call 欺騙， 因為情境中的定義行為是操縱呼叫者 ID 資訊，從而使受害人的手機顯示一個可信賴的數字--具體來說就是信用社的官方線路。 在 CEH-access 社交工程和移動攻擊討論中，撥打欺騙是一種技術，攻擊者偽造呼叫者ID 資料來冒充一個合法的組織、部門或已知的聯絡人。 這提高了可信度，利用了人類對公認數字的信任，使受害者更有可能滿足敏感的請求，如披露使用者名稱、密碼或一次性程式碼等。攻擊者使用電話和說服力。這裡的成功因素是偽造的號碼所建立的權威和合法性訊號。當工作人員看到似乎屬於官方機構電話號碼時，他們更有可能假定電話是真實的，並繞過正常的核查步驟，特別是在時間壓力下或被設定為安全要求時。為什麼其他選項是不正確的:OTP 劫持指的是偷取或攔截一次性密碼(例如透過 SIM 互換，惡意軟體，或社交工程專門聚焦於 MFA/OTP 程式碼)。 雖然攻擊者可以要求 OTP，但情境的核心機制是偽造的呼叫器 ID，而不是 OTP 擷取。 Bluebugging 是一種基於 Bluetooth 的攻擊，透過 Bluetooth的弱點獲得對裝置的未經授權的控制；它與呼叫者 ID 冒充無關。 SMIShing 透過 SMS/text 訊息進行翻轉，而不是語音呼叫。因此，移動攻擊向量顯示--在認證資訊收割電話中，顯示一個值得信賴的機構號碼來欺騙僱員--即呼叫欺騙。","s":"term"},{"n":146,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"As a cybersecurity analyst conducting passive reconnaissance, you aim to gather information without interacting directly with the target system. Which technique is least likely to assist in this process?","o":["Using a tool like Nmap to scan the organization's public IP range","Inspecting the WHOIS database for domain registration details","Using search engines and public data sources","Monitoring publicly available social media and professional profiles"],"a":[0],"e":"CEH 將被動偵察定義為在不直接接觸目標的情況下蒐集資訊。選項 A 對於被動偵察是不正確的，因為 Nmap 掃描會積極探測系統，產生可被探測到的流量。選項 B，C，和 D 依賴於公開的資訊，是標準的被動技術。 CEH 將 Nmap 掃描歸類為活動足跡。"},{"n":147,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and loT Hacking","t":"mid","q":"At a financial headquarters in Denver, Colorado, ethical hacker Jordan Lee moves beyond cataloging IoT devices and begins testing them for weaknesses. He runs specialized tools against smart lighting and HVAC systems to check for outdated firmware, default passwords, and open service ports. Which step of the IoT hacking methodology is Jordan carrying out?","o":["Vulnerability scanning","Gain remote access","Information gathering","Launch attacks"],"a":[0],"e":"約旦正處於弱點掃描階段，因為他已經移動過身分識別/cataloging(資訊蒐集)，現在正在積極測試 IoT 裝置，以測試已過時的韌體、預設的認證資訊和已暴露的/open 服務埠等弱點。 在 IoT 駭客處理方法中，資訊採集側重於發現裝置，繪製環境圖，識別裝置型別，介面，協定和版本，以及瞭解端點，閘道器，移動應用和雲服務之間的資料流動。 一旦基準清單存在，下一步就是評估裝置及其生態系統元件，以彌補已知和可觀察到的安全弱點。所描述的具體檢查是 IoT 環境中的經典弱點掃描目標:過時的韌體可以表明已知的弱點、缺失的安全修復和未標註的元件。預設密碼是一個常見的 IoT 的弱點，在不更改時可以允許微小的折中。開放服務埠揭示出可被列舉或被利用的被曝光的管理介面或不必要的服務。執行“專門工具”以系統地評估這些要素與弱點掃描是一致的，因為它是旨在尋找可開發條件的結構化評估，但它沒有實際利用或確立持久性。為何其他選項不合適:資訊蒐集(C)將側重於確定裝置和蒐集細節，而不是積極檢查其是否為已過時的固態ware/default 密碼/open 埠。獲得遠端存取(B)意味著利用或獲得未經授權的控制/access，而情況並未表明這一點--他正在檢查和評估。發射攻擊(D)意味著實施開發、破壞或妥協步驟。 問題明確訊框， 即測試弱點，而不是實施攻擊。因此，約旦正在對弱點進行掃描。"},{"n":148,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"At Norwest Freight Services, Simon, a junior analyst, is tasked with running a vulnerability scan on several departmental servers. This time, he is provided with administrator-level credentials to input into the scanner. The scan takes significantly longer than usual but returns detailed results, including weak registry permissions, outdated patches, and insecure configuration files that would not have been visible to an outsider. SIEM logs confirm that successful logins occurred during the scanning process. Which type of vulnerability scan best explains the behavior observed in Simon ' s assessment?","o":["External Scanning","Credentialed Scanning","Internal Scanning","Non-Credentialed Scanning"],"a":[1],"e":"這最好透過認證掃描來解釋，因為掃描器被賦予了管理員級的認證資訊，而 SIEM 確認在掃描過程中成功登入。 認證掃描認證到目標系統(透過 SMB/WMI/WinRM 認證為 Windows，Linu/Unix 認證為 SSH，某些平台的 API)，然後從\"內側\"角度進行更深入的檢查。這使得掃描器能夠列舉一些無法從未經身分驗證的網路偵測中可靠地看到的細節，例如安裝了修補程式級別，本機安全政策設定，登錄權限，設定檔，執行服務及其精確版本，以及需要本機存取驗證的錯位。情境的結果與此非常吻合:掃描需要更長的時間，這很常見，因為經認證的檢查涉及登入和進行許多本機查詢；結果包括:登錄權限薄弱，修補程式過時，以及設定檔不安全，所有這些檔案通常都需要經過認證的存取才能全面評估。 此外，認證掃描可以減少誤判警示，提高準確性，因為它可以直接確認弱點條件，而不是從橫幅或開放的埠推斷出。為什麼其他選項不準確:非可信掃描(D)從外部角度進行，沒有登入；它通常不會擷取詳細的登錄/config 檔案許可結果，而 SIEM 日誌不會顯示由掃描器引起的成功認證事件。外部掃描 (A) 描述掃描的網路位置( 在組織之外) 而不是認證模式。 您可以進行外部認證掃描， 但這裡的界定特徵是認證登入和深主機檢查。內部掃描(C)也指掃描的發源地。 雖然掃描可能是內部的，但問題的關鍵不同點是，admin 認證資訊被用於日誌並蒐集詳細的本機資訊。因此，掃描型別為 B。 Creditived Scanning。","s":"term"},{"n":149,"c":"雲端運算","ce":"Cloud Computing","t":"short","q":"During a routine security audit, administrators discover that cloud storage backups were illegally accessed and modified. Which countermeasure would most directly mitigate such incidents in the future?","o":["Implementing resource auto-scaling","Regularly conducting SQL injection testing","Deploying biometric entry systems","Adopting the 3-2-1 backup model"],"a":[3],"e":"認證道德駭客(CEH)雲端運算和資料保護模組強調有彈性的備份策略對於防止資料被篡改，勒索軟體和未經授權的修改的重要性。 3-2-1 備份模型是被廣泛推薦的最佳做法，在 CEH 材料中被引用。 3 份資料儲存在兩種不同的介質型別上現場外存放了 1 份這種辦法確保即使雲備份被破壞或被改變、清潔和不妥協版本仍然可用。 CEH 檔案強調這個模型是防止雲環境資料完整性攻擊的核心防禦。選項 D 直接減輕了備份被篡改的風險。選項 A、B 和 C 處理無關的安全關切，不保護備份的完整性。","s":"term"},{"n":150,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"In the bustling tech hub of Boston, Massachusetts, ethical hacker Zara Nguyen dives into the digital fortifications of CloudCrafter, a US-based platform hosting web applications for small businesses. Tasked with probing the application's input processing, Zara submits specially crafted inputs to a server administration panel. Her tests uncover a severe vulnerability: the system performs unintended operations at the system level, enabling access to restricted server resources. Further scrutiny reveals the flaw lies in the application's failure to sanitize user input passed to system-level execution, not in altering directory service queries, injecting newline characters, or targeting cloud-specific environments. Dedicated to strengthening the platform, Zara drafts a precise report to guide CloudCrafter's security team toward urgent fixes. Which injection attack type is Zara most likely exploiting in CloudCrafter's web application?","o":["Shell Injection","CRLF Injection","LDAP Injection","Command Injection"],"a":[3],"e":"情境描述使用者輸入被傳遞到系統級執行中並引起\"系統級的無意操作\"，這是 CEHWeb 應用程式入侵覆蓋範圍中指令注入的下定義行為。 指令注入發生在應用程式使用未經衛生，使用者控制的輸入來建構或引用作業系統指令時。 透過插入shell 元描述器或命令分隔器，例如；， & & &， QQ 或 backticks， 攻擊者可以使 伺服器 執行超出開發者預期的額外命令。 其影響通常包括讀取敏感檔案， 列出目錄， 建立使用者， 下載惡意軟體， 支點， 或以其他方式與受限制的 伺服器資源互動， 匹配 expoll's \" 存取受限制的 伺服器 資源\"。這個問題還排除了其他注入家庭。 LDAP 注入目標目錄服務查詢並操縱 LDAP 過濾器，而提示器明確排除了。 CRLF 注入涉及插入歸位與換行（CRLF）字來操縱 HTTP 頭或分解回放；它主要不產生 OS-級執行。 \"殼注入\"有時被非正式地用來描述同一種概念，。 但在 CEH-風格名詞和考試問法模式中，向OS 命令執行注入的標準標籤是 Command Injection，使選項 D 成為最佳和最準確的答案。 符合 CEH 指導中強調的有效緩解措施包括儘可能避免 OS 命令呼叫，使用不援引彈殼的安全 API，嚴格允許輸入和對輸入進行犬科鑑定，必要時為目標解釋員適當出逃，以最少的特權執行服務，以及應用分塊和監測來限制爆炸半徑。\\。","s":"term"},{"n":151,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"You are instructed to perform a TCP NULL scan. In the context of TCP NULL scanning, which response indicates that a port on the target system is closed?","o":["ICMP error message","TCP SYN/ACK packet","No response","TCP RST packet"],"a":[3],"e":"TCPNULL 掃描是一種隱形掃描技術，涵蓋於 CEHv13 偵察和網路掃描。 在 NULL 掃描中，所有 TCP 旗被設定為零。 根據 RFC 793 和 CEH 檔案，關閉的埠必須用 TCP RST(重置)封包回應。如果 連接埠 開啟， 目標通常不回應， 使得此技術對 防火牆 逃逸有用。 因此 :RST 回應 = 已關閉 連接埠無回應 = 開啟或過濾了 連接埠其他選項不適用於 NULL 掃描 : SYN/ACK 與 SYN 掃描相關。 ICMP 出錯可能表示過濾，而不是連接埠狀態。","s":"term"},{"n":152,"c":"雲端運算","ce":"Cloud Computing","t":"long","q":"A multinational healthcare provider headquartered in Boston, Massachusetts relies on federated authentication to allow employees to access multiple cloud-hosted applications using a single sign-on portal. During an authorized red team engagement, a security consultant gains access to the organization ' s identity infrastructure and extracts signing material used in trust relationships between the internal identity provider and external cloud services. Using this material, the consultant generates authentication responses that grant administrative-level access to several cloud applications without interacting with user credentials or triggering multifactor authentication challenges. The access appears legitimate within the cloud service logs. Which cloud attack technique best aligns with this behavior?","o":["Golden SAML Attack","Man-in-the-Cloud (MITC) Attack","Cloud Hopper Attack","Living off the Cloud (LotC) Attack"],"a":[0],"e":"此情境與 Golden SAML 攻擊一致， 因為攻擊者不是在偷取使用者 密碼 或直接繞過 MFA； 相反， 攻擊者會損害身分信任機制本身並偽造有效的認證斷言。 在聯邦雲環境中， 身分提供者會發出簽名的斷言， 即雲服務信任。 一旦獲得簽名材料， 攻擊者可以建立偽造的 SAML 權杖， 而這些權杖在依賴雲應用中看起來是完全合法的。 因此， 日誌 中的存取看起來是正常的， 並且不需要認證資訊 重放或多要素提示。 這就將技術與 Man- in-CEH 雲覆蓋範圍強調雲信任關係、身分基礎設施以及中介進入的機制是關鍵的攻擊面，因為在該層妥協可以提供廣泛的服務，而很少出現明顯的異常。 在實際防禦方面，保護標誌性基礎設施與在雲身分架構中保護特權使用者認證資訊同樣重要。","s":"term"},{"n":153,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A large-scale inventory management platform implements a pattern-based inspection layer to prevent malicious database interactions. During authorized testing, repeated payloads containing recognizable structural sequences are denied before reaching the application logic. While analyzing the inspection behavior, the tester observes that blocked requests share a consistent textual arrangement of components. The tester then alters how those components are presented within the payload while preserving the intended database operation. After this adjustment, the request bypasses the inspection layer and executes successfully, producing results consistent with earlier attempts. Determine the evasion method that best accounts for this behavior.","o":["Transforming literal parameters using alternate character encoding schemes","Introducing inline comment delimiters to fragment instruction sequences","Modifying spacing and delimiter placement to disrupt detection patterns","Constructing the payload dynamically through segmented string operations"],"a":[2],"e":"正確答案是修改間隔和分界器的放置來打亂偵測模式。 CEHWeb 應用程式入侵材料解釋道，基於模式的檢查控制，包括薄弱的輸入過濾器和一些由簽名驅動的防禦，往往依賴於惡意有效酬載中可識別的文字結構。 如果偵測依賴於靜態圖案匹配，攻擊者可能在改變白空間，分隔器，分隔器位置，或符號格式化時保留相同的邏輯資料庫操作，使酬載不再匹配所期望的簽名。 問題正是如此:被封禁的請求共享了一致的文字安排，測試者修改了這些元件的呈現方式，而沒有改變預期的SQL 效果。 替代編碼和動態構造也是已知的逃避想法，但測試者修改了這些元件的表達方式。情境特別強調改變的安排，而不是改變字元集或執行時間字串建構。 內建評論可以分出關鍵詞，然而，最廣泛和最符合 CEH 的答案是修改間隔和分界符以打破偵測模式。 CEH 材料強調，僅聚焦於簽名外觀的過濾器是脆弱的，因為輕微格式化的變異可以繞過它們而同時使攻擊語義完好無損地離開。 因此，選項 C 是最準確的逃避方法。"},{"n":154,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"Which individuals believe that hacking and defacing websites can promote social change?","o":["Gray hat hackers","Hacktivists","Ethical hackers","Black hat hackers"],"a":[1],"e":"正確答案是 B， Hacktivis。 在 CEH 駭客分類概念中，駭客主義者是使用駭客技術支援社會、宗教、意識形態或政治事業的攻擊者。 CEH 的一致材料將駭客主義描述為旨在提出事業或政治議程、影響社會變革或強調所感知的政治不公正的行動。 另一個 CEH 相通的解釋指出，這些人可能會駭客伺服器，破壞網站，製造病毒，並造成干擾，因為他們相信自己的行動會迫使社會變革或引起對某個問題的注意。 灰帽駭客可能擅自暴露出弱點，但其主要動機並不一定是社會變革。 道德駭客，或白帽，在獲得授權和事先同意的情況下，而不是透過非法的誹謗來進行防禦。 黑帽駭客通常為了惡意、個人利益、資料被竊取或服務被打亂而行動。 因此，與駭客和網站破壞特別相關的團體是 Hacktivists。","s":"term"},{"n":155,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"Which of the following program infects the system boot sector and the executable files at the same time?","o":["Stealth virus","Polymorphic virus","Macro virus","Multipartite Virus"],"a":[3],"e":"從 CEHv13 指南中綜合詳細解釋:正確答案是 D。 Multipartite Virus。 多方病毒是一種同時感染電腦系統多部分的精密惡意軟體，最常見的是啟動部門和可執行檔案，因為它攻擊了不止一個目標，因此能夠迅速擴散，而且往往比單向病毒更難移除。 即使被感染的可執行檔案被清理，病毒也可能在啟動期間仍然活躍在啟動區，並重新感染系統。 同樣，只有清理啟動區可能會留下感染的檔案，這些檔案以後可能會重新感染啟動區。選項 A(Stealth Virus)透過操縱作業系統函式並返回假資訊到安全工具來隱藏其存在。 選項 B(Polymorphic Virus)每次感染一個系統來逃避被防毒軟體偵測時都會更改其程式碼或簽名。 選項 C(Macro Virus)主要會感染支援宏語言的檔案和應用，如 Microsoft Office 檔案。從 CEH 惡意軟體分析的角度來看，惡意軟體經常被其感染方法分類，傳播。多部分病毒的特徵在於它同時感染啟動區和可執行檔案的能力，使D 成為正確答案。","s":"term"},{"n":156,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"Which strategy best mitigates session hijacking?","o":["IPsec VPN encryption","Physical security","Network IPS","Security awareness training"],"a":[0],"e":"CEH v13 突出顯示，加密正在過境的工作階段資料是抵禦工作階段劫持的最強防禦之一。 IPsec VPN 加密了整個 IP 封包，使攻擊者無法捕捉可使用的工作階段權杖。 IPS 幫助偵測，但不能預防。 人身安全和意識不能解決技術劫持問題。因此，選項 A 是正確的。","s":"term"},{"n":157,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"At a Los Angeles-based online gaming company, penetration tester John investigates a recent cloud breach that caused downtime and delayed alerts. He finds that the root issue was management ' s lack of defined responsibilities for monitoring, auditing, and securing serverless services, which left critical functions unmanaged. Which cloud computing threat does this scenario best illustrate?","o":["Insufficient logging and monitoring","Loss of governance","Privilege escalation","Side-channel attacks"],"a":[1],"e":"設想方案最能說明治理的喪失，因為核心問題不是具體的技術利用，而是管理監督、問責和雲克/serverless 安全責任控制分配方面的失敗。 問題描述\"缺乏監測，審計，以及確保無伺服器服務等明確責任\"，導致關鍵功能被\"管理不到位\"，導致故障時間和延遲警報。 這是一種治理失敗:本組織沒有建立明確的自主權、政策和業務程式，以確保雲量，特別是沒有伺服器的功能，得到適當的監測、審計和保障。在雲層環境中，治理包括界定作用和責任(共同責任模式理解)、建立安全基線、確保記錄/monitoring 覆蓋、執行設定管理，並保持守法監督。 治理薄弱時，可能會在沒有連貫的安全控制的情況下部署服務，警報可能會被錯設定或被忽略，事件應對可能會被延遲，因為沒有團隊明確問責。 無伺服器會增加這種風險，因為它可以被開發者迅速採用，迅速突起，如果組織的治理框架沒有明確包含的話，傳統基礎設施過程會忽略它。雖然\"伐木與監測不足\"(A)密切相關，但情境訊框作為管理層缺乏明確責任的根源，其範圍比缺失日誌要廣，它涉及的是缺乏能確保 Log/monitoring 得到實施和擁有的治理結構。 權限提升和側道攻擊是描述中未建議的技術攻擊類別。因此，雲層威脅就是 B。 治理的喪失。","s":"term"},{"n":158,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"Your ethical hacking firm has been hired to conduct a penetration test. Which of the following documents limits the scope of your activities?","o":["PCI-DSS","Nondisclosure agreement","Memorandum of understanding","Terms of engagement"],"a":[3],"e":"正確答案是 D，\"業務條款\"。 在 CEH 滲透測試方法中，在評估開始前，只能在與使用者端商定的邊界範圍內進行測試。接戰術語定義了哪些系統，網路，應用程式，IP 範圍，測試方法，時間 windows，攻擊型別，以及操作限制被授權。 符合 CEH 滲透測試指導強調出戰前階段包括商定接戰規則，理解使用者端要求，最終確定測試範圍，以及測試開始前簽署合同等。 它還規定，範圍應當與客戶討論、審查並書面說明，包括測試哪些資產和流程以及如何進行測試。 PCI-DSS 是一種付款卡安全標準，而不是筆試範圍檔案。不披露協定保護在測試中發現的機密資訊。 諒解備忘錄可以描述締約方之間的合作，但並不是限制具體測試活動的最佳答案，因此，協定條款是限制您活動範圍的檔案。","s":"term"},{"n":159,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"During a security assessment, a consultant investigates how the application handles requests from authenticated users. They discover that once a user logs in, the application does not verify the origin of subsequent requests. To exploit this, the consultant creates a web page containing a malicious form that submits a funds transfer request to the application. A logged-in user, believing the page is part of a promotional campaign, fills out the form and submits it. The application processes the request successfully without any reauthentication or user confirmation, completing the transaction under the victim's session. Which session hijacking technique is being used in this scenario?","o":["Hijacking a user session using a session fixation attack","Hijacking a user session using a session replay attack","Hijacking a user session using a cross-site request forgery attack","Hijacking a user session using a cross-site script attack"],"a":[2],"e":"CEH v13 將 Cross-Site Request Forgery(CSRF)描述為一種攻擊，其中被認證使用者的瀏覽器被欺騙，在沒有使用者意圖的情況下將未經授權的行動提交到一個被信任的應用程式。 CSRF 利用瀏覽器在向使用者登入的某個域傳送請求時會自動包含所儲存的工作階段 cookie。 在這種情況下，攻擊者製造出一種惡意的形式來觸發不必要的資金轉移。 由於應用程式不驗證請求來源，執行 CSRF 權杖，或要求二次驗證，它處理攻擊者偽造的請求，彷彿它合法地來自被攻擊者。 CEH 強調 CSRF 與 XSS 不同，因為目標網站上沒有惡意的指令碼執行；相反，攻擊者利用被攻擊者認證的工作階段。 這與工作階段固定(可選 A)，回放攻擊(可選 B)和 XSS(可選 D)不同。 所描述的行為與 CSRF 開發完全吻合。"},{"n":160,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"Which of the following tools can be used for passive OS fingerprinting?","o":["nmap","ping","tcpdump","tracert"],"a":[2],"e":"正確答案是 C， tcpdump。 被動 OS 指紋識別一個目標的作業系統，方法是在不積極向目標系統傳送探測器封包的情況下，透過觀察和分析網路流量。 tcpdump 捕獲封包穿行一個網路等工具，並允許分析人員檢查 TCP 視窗大小，Time-to-Live(TTL)值，TCP 選項等特性，以及可以揭示正在使用的作業系統的行為。 由於目標沒有被直接審問，被動的指紋比較隱蔽，更不可能觸發警報。 Nmap 主要與活動 OS 指紋相關，因為它傳送了特製的封包並分析答案以確定目標作業系統。 Ping 主要用於驗證主機可用性，而 trachert(tracheroute)則識別系統之間的網路路徑和中間跳出。 ping 或trachert 既不執行 OS 指紋。在 CEH 偵察和列舉主題中，被動資訊採集側重於觀測現有通訊而不是生成新的流量，因此，在給定的選項中，tcpdump 是被動 OS 指紋採集的最合適工具，因為它在不直接偵測目標的情況下捕獲並分析網路流量。","s":"tool"},{"n":161,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"A penetration tester identifies malware on a system that hides its presence and gives an attacker access to administrative functions without being detected. What type of malware is this?","o":["Virus","Keylogger","Ransomware","Rootkit"],"a":[3],"e":"CEH 課程軟體描述 rootkits 是專門惡意軟體，旨在隱藏其存在，同時提供持續，未經授權的系統級功能存取。 Rootkits 通常修改作業系統的低等元件--如核心模組，驅動程式，或系統程序--以隱藏檔案，程序，登錄鍵，以及網路連線。它們的首要目的是給予攻擊者行政特權，而不觸發警報，使其極其隱蔽和危險。CEH 強調 rootkits 經常伴隨著其他惡意軟體，在初始入侵後維持長期控制。 相比之下，病毒透過附加到檔案中來複制，按鍵機記錄了按鍵中樞，但不隱藏系統級存取，勒索軟體加密資料而不是隱藏操作。這種情境中的定義特徵--隱形活動，提供管理級別控制，持續不被發現--直接與 CEH 培訓材料所描述的 Rootkit 行為一致。","s":"term"},{"n":162,"c":"密碼學","ce":"Cryptography","t":"short","q":"An attacker uses many plaintextciphertext pairs and applies statistical analysis to XOR combinations of specific bits. Which technique is being used?","o":["Brute-force attack","Differential cryptanalysis","Linear cryptanalysis","Side-channel attack"],"a":[2],"e":"此情境描述 Linear Cryptanalysis，一種在 CEH v13 密碼學中詳細描述的技術。 Linear Cryptanalysis 涉及尋找與明文位元，密文位元，以及使用 XOR 操作的金鑰位元相關的線性近似。 透過分析大量已知的明文-密文對，攻擊者可以識別揭示金鑰資訊的統計偏差。 CEHv13 解釋線性密碼分析在方法上不同於差分密碼分析。 雖然差分密碼分析研究了明文的差別如何影響密文的差別，但線性密碼分析則側重於線性關係和機率分佈。提到 XOR 組合和統計分析明文-密文對直接與線性密碼分析相匹配。布魯特-力量攻擊嘗試了所有沒有分析的金鑰。區別密碼分析側重於輸入差異，而不是線性等式。側道攻擊利用了功率消耗或時間等物理特徵。 AES 等現代塊密碼被設計為能透過確保線性近似發生與隨機相近的機率來抵抗線性密碼分析。 CEH v13 強調線性密碼分析為一種。用於評價密碼強度的基礎攻擊方法。因此，選項 C 是正確的。","s":"term"},{"n":163,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"You are an ethical hacker at Apex Cyber Defense contracted to audit Coastal Healthcare ' s wireless estate in Miami, Florida. During a network sweep, your logs show a previously unknown access point physically connected to the hospital ' s internal switch and issuing IP addresses to devices on the corporate VLAN - it was neither provisioned by IT nor listed in the asset inventory. The device is relaying internal traffic and providing remote connectivity back to an external host. Based on the observed behavior, which wireless threat has the attacker most likely introduced?","o":["Misconfigured AP","Rogue AP","Honeypot AP","Evil Twin AP"],"a":[1],"e":"正確答案是 B。 Rogue AP，因為情境描述的是一個未經授權的存取點已經實際連線到內部有線網路，並且正在提供公司VLAN 的網路存取，而無需經過批准或庫存記錄。 在符合 CEH 的無線安全概念中，無賴存取點是未經授權而安裝在一個組織的網路上的任何 AP，它創造了一個繞過標準安全控制的無管理的切入點，這裡的關鍵指標是:它\"以前未知\"，\"既不由IT 提供，也不在資產庫存中列出\"，它\"與醫院內部的交換器有物理連線\"。裝置正在釋出 IP 位址這一事實表明，它可能執行一個 DHCP 服務或連線到內部網路，這樣可以讓客戶直接進入公司 VLAN。 這可以讓攻擊者從附近的無線範圍獲得內部存取，並且如果它的 DHCP 回應與合法的 DHCP 基礎設施相沖突，也可能造成網路不穩定。 此外，\"將內部流量進行再接再勵，提供遠端連線回外出主機\"的裝置，指攻擊者將它作為隱蔽的地步--實際上是一個未經授權的無線橋通入內部網路，以及一個指揮控制或遠端存取的通道。為何其他選項:一個設定錯誤的 AP 意味著由 IT 部署的合法 AP，但設定不安全(弱加密，預設認證資訊，分割槽差)。 一個蜜罐 AP 通常被故意地(通常由防禦人員)部署，以吸引攻擊者進行偵測和研究，而不是向外部的主機偷回。 邪惡的雙子 AP 是一款以冒用合法 SSID 來引誘受害者的偽造的無線 AP；它並不一定需要被物理上接入內部的交換器，定義的特質是假冒真實的 AP/SSID。 這裡定義的特質是在有線網路上未經授權安裝的，這最直接是無賴的存取點。","s":"term"},{"n":164,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"During a physical penetration test at Sterling Electronics in Cleveland, ethical hacker Priya waits near the employee entrance during a shift change. When a group of staff enters the building using their access cards, Priya closely follows behind without swiping her own badge. None of the employees confront her, assuming she belongs there. Once inside, Priya proceeds to the break area where she documents the success of the exercise. Which social engineering technique is Priya demonstrating?","o":["Shoulder Surfing","Dumpster Diving","Tailgating","Piggybacking"],"a":[2],"e":"這一情境顯示了尾巴，它透過一個進入控制入口追蹤被授權人員，從而獲得對安全地區的未經授權的實際准入。 Priya 沒有出示認證資訊，刷去徽章，或者以其他方式認證；相反，她在繁忙的換班期間利用了正常的人類行為和社會假設。 因為員工假定她屬於那裡而不挑戰她，所以她成功繞過物理的存取控制。在網路流量高、規劃開放文化高、或執行\"不戴徽章，不入門\"規則不力的工作場所中，牽制是司空見慣的。 襲擊者可能利用禮貌、分散注意力或渴望敞開大門。在換班、送貨、或人們攜帶物品和欣賞有人持門時有效。 這裡測試的安全弱點不是徽章技術本身，而是人的因素:缺乏挑戰文化，對準入政策的遵守不一致。牽引與牽引:在許多安全參考文獻中，牽引意味著被授權人故意允許對方進入(比如，在被請求後故意地把門扣住 )。 牽引通常意味著入侵者未經明確許可進入，通常是在群體後方滑入。 在這種情況下，沒有人與她對質，他們“假定她屬於那裡”，表明她是在沒有要求或得到明確許可的情況下追蹤他們的--詳細情況。其他選項無關:肩上衝浪是對敏感輸入的視覺觀察；垃圾桶搜尋是從垃圾堆中取回資訊，因此，正確答案是 C。 Tailgating。","s":"term"},{"n":165,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"During a targeted intrusion against a cloud infrastructure company in Salt Lake City, Utah, an attacker distributes a modified installation package of a legitimate network diagnostic utility widely used by employees. Before distributing the package, the attacker binds a malicious remote-access payload with the original executable so that both components are installed together. When users launch the diagnostic tool, it performs its normal troubleshooting functions, while the hidden payload simultaneously executes in the background and establishes communication with a remote command server. From a malware deployment perspective, what technique best describes this approach?","o":["Wrapper","Downloader","Packer","Dropper"],"a":[0],"e":"正確答案是 A。 斯萊普。包裝器將一個惡意的酬載繫結在一個合法的可執行檔案上，這樣在使用者開啟檔案時兩個都執行。使用者看到預期的合法應用程式，而隱藏的惡意的酬載則在後臺執行。 CEH 木馬程式材料解釋道，一個包裝器將可執行應用程式附加到一個木馬程式可執行檔案上，將兩個程式包成一個檔案，並導致木馬程式在使用者只看到合法應用程式執行時安裝。 另一所 CEH 參考文獻將包裝器定義為一個非惡意檔案，將惡意檔案繫結在上以傳播木馬程式並避免被偵測。選項 B。 下載器是不正確的，因為下載器在執行後從遠端位置取回惡意軟體。選項 C。 Packer 是不正確的，因為一個打包機會壓縮或模糊可執行程式碼，使偵測更難。選項 D。 Dropper 是不正確的，因為一個\"滴\"是設計為將惡意軟體送出或安裝到被害者系統，但這裡的關鍵行為是用一個合法的可執行檔案將一\"惡意\"酬載繫結。因此，最好的答案是 A。Wrapper。","s":"term"},{"n":166,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"In an ethical hacking methodology and framework, which of the following step is known for \"active and passive information gathering\"?","o":["Obfuscation","Exploitation","Reconnaissance","Denial of service"],"a":[2],"e":"正確答案是 C。 偵察。 在 CEH 方法中，偵察是一道德駭客在更深的測試開始前蒐集目標細節的初始資訊蒐集階段。CEH-對齊的材料定義了偵察是使用主動或被動手段蒐集目標資訊，通常包括髮現網路範圍，活主機，開放埠，作業系統細節，服務，和組織資訊。 Active 偵察涉及與目標的直接互動，如傳送探針，掃描，或封包，可以提供準確資訊但可以被偵測出。 被動偵察蒐集資訊而不直接與目標聯絡，經常使用網站，社交媒體，WHOIS，DNS 等公共來源的記錄，以及搜尋引擎。 offuscation 與隱藏活動有關，弱點利用指利用弱點取得存取，阻斷服務則側重於干擾可用性，因此，已知的主動和被動資訊採集步驟為偵察。","s":"term"},{"n":167,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During an authorized security assessment at a municipal power distribution facility in Omaha, Nebraska, a certified ethical hacker performs passive traffic analysis between the control center and several remote substations. The tester observes structured request-response messages used to read coil status and write register values on industrial controllers. All communication occurs over TCP port 502, and the protocol does not provide built- in encryption or authentication. Based on these characteristics, which OT communication protocol is operating within this environment?","o":["IEC 60870-5-104","MODBUS","DNP3","OPC UA"],"a":[1],"e":"正確答案是 B。 MODBUS。定義指標為 TCP 連接埠 502,讀取線圈狀態，並寫入暫存器值，這些是被廣泛使用的工業控制協定的 Modbus/TCP 的經典特徵。 符合 CEHOT/ICS 材料將 Modbus 識別為工業控制系統中使用的協定並顯示 Modbus偵察和使用連接埠 502 的互動功能，還描述了 Modbus 函式編碼操作，如寫出一個單圈並讀取輸入記錄。選項 A.IEC 60870-5-104 是不正確的，因為 IECIEC 通常與 TCP 連接埠 2404 相關，而非連接埠 502。選項 C。 DNP3 是不正確的，因為 DNP3 通常使用 TCP104 連接埠 20000。選項 D。 OPC UA 不正確，因為 OPC UA 沒有被 TCP502 上的 Modbus coil/register 操作識別出。因此，最好的答案是 B。 MODBUS。","s":"term"},{"n":168,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"You are leading an internal red team assessment for a multinational bank with a highly complex and distributed IT infrastructure. Your team is required to simulate attacks across cloud services, servers, and remote endpoints. Due to the sheer scale of the environment, you deploy an AI-based platform that automatically scans the entire network, flags anomalies based on prior breach data, and adjusts its threat detection models as new attack behaviors are encountered. What key benefit of AI-driven ethical hacking is most critical to your success in this scenario?","o":["Predictive analysis","Simulation and testing","Scalability","Enhanced reporting"],"a":[2],"e":"這種情境中最關鍵的效益是可擴充套件性。 CEH 對現代道德駭客化的一致指導強調，大型，分散式企業環境造成了一個根本性的業務挑戰:資產數量，設定，雲服務，和遠端端點都太大了，對於純粹人工評估方法來說，無法在可接受的時間範圍內保持一致的覆蓋。 這個問題透過說明\"高度複雜和分散式\"的基礎設施和\"環境的擴充套件尺度\"來準確地凸顯出這一制約因素。 一個\"自動掃描整個網路\"並不斷標出異常的 AI-驅動平台，主要因為可以同時將評估範圍擴充套件到許多系統，幫助紅隊更高效地評價了攻擊面。雖然預測性分析是一種真正的 AI 能力，但情境的成功要求並不是預測未來的攻擊；而是在企業規模上執行評估活動，並隨著條件的變化而保持速度。 模擬和測試是紅隊所做的，而不管 AI 是什麼，但 AI 在這裡的不同者是能夠連續，大規模地在雲端，伺服器和端點上進行發現和優先排序，而人類的努力卻不按比例地增加。 強化報告有助於交流結果，但它不是描述的主要操作限制器。此外，該提示提到隨著新行為的出現而調整偵測模型。因此，可擴充套件性是這種情境中取得成功的關鍵利益。","s":"term"},{"n":169,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"A cybersecurity consultant suspects attackers are attempting to evade an Intrusion Detection System (IDS). Which technique is most likely being used?","o":["Deploying self-replicating malware","Fragmenting malicious packets into smaller segments","Flooding the IDS with ICMP packets","Sending phishing emails"],"a":[1],"e":"CEHIDS/IPS 外逃模組將封包分解描述為一種常用的逃避技術來繞過以簽名為基礎的偵測。選項 B 是正確的。其他選項代表不同的攻擊類別。 CEH 強調重新組裝正常化是一種反措施。"},{"n":170,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"mid","q":"In Pittsburgh, Pennsylvania, a major steel manufacturer operates a production plant with numerous automated loops that regulate temperature, pressure, and conveyor speed. During an audit, ethical hacker Marcus Reed observes that these loops are coordinated by a centralized supervisory network that links multiple controllers across the facility. Based on this design, which OT system concept is being applied?","o":["Manual loop","Distributed Control System (DCS)","Open loop","Closed loop"],"a":[1],"e":"一個分散式控制系統(DCS)是最佳匹配，因為情境描述了多個自動控制迴路(溫度，壓力，傳送速度)，這些迴路由連線跨設施多個控制器的中央監管網路來協調。 在工業環境中，一個 DCS 架構將控制功能分佈在位於工藝裝置附近的許多控制器之間，而監督控制和操作器介面則協調並監控整個工藝過程。 這使得 DCS 在鋼鐵，化學，石油和天然氣等連續和工藝工業中很常見，製造廠的許多相互依賴的環路必須可靠地一起執行。該情境的\"集中式監督網路\"是一個關鍵的 DCS 標誌:操作員和監督系統(通常包括工程工作站和 HMIs)提供集中監測，定點，警報，以及協調，而實際的迴圈控制則由分散式控制器執行。這與單個孤立控制器或純粹手工操作不同。目的是保持穩定的流程控制並確保不同生產區的協調行為。為何其他選項不合適:手動迴路(A)意味著人操作的控制而不是自動意見回饋迴路。 工廠被描述為有\"數個自動迴路\"，因此手動迴路是不正確的。開放回路(C)控制不使用輸出的意見回饋來調整輸入；在意見回饋至關重要的地方，它並不典型地用於精確地調節溫度和壓力。閉環(D)確實描述了基於意見回饋的調控，並且在許多工業迴環上是真實的；然而，問題卻要求根據總體設施設計應用 OT 系統概念--具體來說是一個協調多個控制器的監督網路--指向架構(DCS)而不是結構(DCS)。迴圈型別。因此，正確答案是 B。 分散式控制系統(DCS)。","s":"term"},{"n":171,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"This type of security test usually takes on an adversarial role and looks to see what an outsider can access and control.","o":["Penetration test","Policy assessment","High-level evaluation","Network evaluation"],"a":[0],"e":"正確答案是 A。 Penetration 測試。 在 CEH 方法中，穿透測試是一種授權的安全評估，它模擬一個真正的攻擊者的行動，方法，以及確定如果一個組織被攻擊可以存取，被利用，或被控制的技術。 符合 CEH 的材料稱滲透測試透過模擬一個真正的攻擊者和評價可被利用的弱點的影響而超越了弱點評估。 這也解釋了外部的滲透測試是用遙控器完成的外部網路和類似真正的駭客試圖透過網際網路取得組織資源。 這與“對抗性角色”和“外人能夠存取和控制的事物”的用語相匹配。 政策評估側重於政策、標準和合規，而不是攻擊者模擬。 高階別評估範圍更廣，技術上的對抗性較低。 網路評價可以檢查網路設計或設定，但不一定利用弱點，因此，最好的 CEH 答案是穿透測試。","s":"term"},{"n":172,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"mid","q":"A city's power management system relies on SCADA infrastructure. Recent anomalies include inconsistent sensor readings and intermittent outages. Security analysts suspect a side-channel attack designed to extract sensitive information covertly from SCADA devices. Which investigative technique would best confirm this type of attack?","o":["Measuring unusual physical or electrical fluctuations during device operation at the hardware level.","Identifying weak cryptographic configurations in device communications.","Assessing SCADA user interfaces for unauthorized access or misuse."],"a":[0],"e":"根據認證的道德駭客(CEH)IoT，OT，和 SCADA 安全模組，側道攻擊利用間接資訊外洩，如能耗，電磁排放，計時變異，或熱輸出等，而不是軟體的弱點。選項 A 是正確的，因為監測硬體水平異常是偵測側-的主要方法。 CEH 材料強調這些攻擊繞過傳統的安全控制。選項 B 涉及密碼學弱點，而不是側通道分析。選項 C 涉及介面的濫用，而不是秘密資料洩漏。CEH 強調，由於遺留的硬體和有限的監測能力，SCADA 系統特別脆弱。"},{"n":173,"c":"密碼學","ce":"Cryptography","t":"mid","q":"During a cryptographic audit of a legacy system, a security analyst observes that an outdated block cipher is leaking key-related information when analyzing large sets of plaintextciphertext pairs. What approach might an attacker exploit here?","o":["Launch a key replay through IV duplication","Use linear approximations to infer secret bits","Modify the padding to obtain plaintext","Attack the hash algorithm for collisions"],"a":[1],"e":"CEH 覆蓋了古典密碼學攻擊，包括線性密碼分析，它使用明文和密文之間的統計相關性來推斷金鑰的位數。 如果一個密碼在很多資料樣本中洩露出結構規律，可以計算出線性近似來打破密碼。"},{"n":174,"c":"密碼學","ce":"Cryptography","t":"mid","q":"A financial services firm detects that outbound corporate emails containing sensitive underwriting data were intercepted while transmitted over unsecured channels. To immediately restore confidentiality and ensure authenticity of executive communications, the security operations team deploys a standardized email encryption framework compatible with the organization's Microsoft Outlook environment. The selected solution must support digital signatures for sender authentication, rely on a public-key infrastructure for secure key exchange, and enable recipients to validate signed messages using certificates issued by trusted authorities. Identify the email encryption standard that best fulfills these requirements.","o":["FlowCrypt","RMail","S/MIME","OpenPGP"],"a":[2],"e":"正確答案是 C。 S/MIME. S/MIME，或稱 Security/Multipurpose Internet Mail Supposes，是用於提供加密和數位簽章MIME-基於電子郵件訊息的電子郵件安全標準。 CEH 密碼學參考文獻將 S/MIME 描述為公用金鑰加密和簽名 MIME 資料的標準。 它也被定義為加密和認證 MIME 資料的標準，主要用於網際網路電子郵件。這直接符合設想情況，因為本組織要求:透過電子郵件加密保密。透過數位簽章認證。 PKI 基於憑證的信任。與微軟 Outlook 環境相相容。選項 A。FlowCrypt 是不正確的，因為它是一個加密工具/service 的電子郵件，主要與基於 OpenPGP 的郵件加密有關，而不是被請求的標準。選項 B。 RMail 是不正確的，因為它是一個安全的電子郵件服務/platform，而不是核心標準化的 PKI 基於電子郵件加密框架。選項 D。 OpenPGP 是不正確的，因為 OpenPGP 支援加密和簽名，但是在要求具體強調基於憑證權威的 PKI 信任和 Outlook 風格的企業憑證驗證時，這並非最佳匹配。因此，最好的答案是 C。 S/MIME.","s":"term"},{"n":175,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"During a large-scale network assessment of a telecom provider in Dallas, Texas, a cybersecurity consultant uses Recon-ng and Nmap to enumerate legacy and infrastructure-level services across multiple nodes. The tools uncover open Telnet ports, FTP directories with anonymous login enabled, active TFTP services, and exposed SMB shares. The consultant also detects a service that responds to VRFY, EXPN, and RCPT commands, allowing the enumeration of user identities and delivery addresses due to weak input validation. IPv6 tunneling protocols are also detected. Concerned about information leakage, the consultant flags these services for immediate remediation. Which classification best describes this set of enumeration activities?","o":["LDAP Enumeration","VoIP Enumeration","SMTP Enumeration","DNS Enumeration"],"a":[2],"e":"SMTP 列舉是正確的分類，因為情境明確引用了 SMTP 命令 VRFY，EXPN 和 RCPT，這些都是在郵件伺服器上發現有效使用者帳戶和電子郵件路由資訊的出名技術。 在符合 CEH 列舉方法中，攻擊者和測試者使用這些命令來確定是否存在特定的使用者名稱或信箱位址。 VRFY 用於驗證一個使用者，EXPN 可以將郵件清單或別名擴充套件為單個收件人，而RCPTTO 在 SMTP 談話中通常測試一個收件人位址是被接受還是被拒絕。 伺服器提供詳細答覆時，可以洩露帳戶有效性和內部位址格式，從而可以針對已知使用者名稱進行定向噴灑、密碼噴灑、並擴充套件社交工程活動。雖然評估還確定了Telnet，FTP 有匿名存取，TFTP，和 SMB 等股份，但這些發現代表了額外的被曝光服務和錯設定，而不是答案選擇中命名為列舉的分類。 LDAP 列舉將專注於對 LDAP 或 Active Directory 等服務的目錄查詢以擷取使用者和組。 VoIP 列舉將涉及 SIP 端點，擴充套件和呼叫基礎設施。 DNS 列舉將集中在區轉移，記錄上。這裡的區別線索是使用 VRFY，EXPN，和 RCPT，它們與 SMTP 的行為和郵件伺服器使用者列舉有獨特的繫結，使得 SMTP 列舉成為最合適的。","s":"term"},{"n":176,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"An internal audit at a pharmaceutical research company in San Diego, California, revealed that a directory server was reachable from a restricted testing subnet. Security analyst Daniel Harper initiated a basic directory query using simple authentication to validate connectivity. The query succeeded, confirming that the server was responding to unauthenticated search requests. To understand the structural layout of the directory before performing deeper queries, Daniel needed to retrieve the base-level naming context entries exposed by the server. His objective was to identify the root domain components and configuration partitions before constructing targeted search filters. Which command should Daniel execute to obtain the directory naming context information?","o":["ldapsearch -x -h < host > -b \" DC=htb,DC=local \" objectclass= \" * \"","ldapsearch -h < host > -x","ldapsearch -h < host > -x -b \" DC=htb,DC=local \"","ldapsearch -h < host > -x -s base namingContexts"],"a":[3],"e":"正確答案是 D。 ldapsearch -h < 主機 > --s 鹼基命名 Contexts。目的是查詢目錄伺服器的根 DSE 用於被曝光的命名上下文。 -x 選項進行簡單的認證，-s 基礎將搜尋範圍限制在基物件上，命名 Contexts 請求列出可用的命名上下文的屬性，如域和設定分割槽。 符合 CEHLDAP 列舉材料解釋道:LDAP 目錄服務提供使用者，系統，網路，服務和組織結構等資訊，而 LDAP 列舉可以揭示對後期瞄準有用的域和目錄細節。選項 A 是不正確的，因為它在發現命名上下文之前假設了已知的基礎 DN。選項 B 不完全，因為它沒有要求命名上下文屬性。選項 C 還假定基準 DNA 已經知道。選項 D 是正確的，因為它在更深的 LDAP 搜尋之前擷取到基位命名上下文資訊。因此，最好的答案是 D。 ldapsearch -h < 主機 > -x -s 鹼基命名Contexts。"},{"n":177,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"During a red team assessment at Apex Technologies in Austin, ethical hacker Ryan tests whether employees can be tricked into disclosing sensitive data over the phone. He poses as a vendor requesting payment details and reaches out to several staff members. To evaluate defenses, the security team emphasizes that beyond general training, there is a practical step employees must apply in every interaction to avoid being deceived by such calls. Which countermeasure should Apex Technologies prioritize to directly prevent this type of social engineering attempt?","o":["Conduct security awareness programs","Employees must verify the identity of individuals requesting information","Establish policies and procedures","Use two-factor authentication"],"a":[1],"e":"這種情境是典型的維興(voice fishing)嘗試:攻擊者給員工打電話，冒充一個供應商，並試圖說服他們披露敏感的支付資訊。員工在每次互動中可以應用的最直接，最實際的對應措施是在共享任何資訊之前驗證請求者的身分。 這意味著使用一種可信的核查方法，例如使用內部目錄/vendor 合同的正式號碼回電，透過已知的經理或採購渠道確認，或遵循既定的核查工作流程，而不是信任打電話者的身分、打電話者的信心或聲稱的從屬關係。選項 B 是最佳答案，因為它直接打破了正在使用的社交工程策略:藉口(假冒賣家)依賴於讓受害者接受身分和緊迫性而不經過驗證。如果員工透過獨立渠道持續核實身分，攻擊者的藉口崩潰，請求被拒絕或升級。 這是人類決策點最直接的控制，即資料披露風險的發生地。為什麼其他選擇不那麼直接:安全意識方案(A)很重要，但問題在於員工必須在每一次互動中應用何種實際步驟。 培訓支援行為；不是具體行動阻止了呼叫成功。政策和程式(C)提供治理和指導，但電話通話時的直接業務控制仍然是身分核查。雙因子認證(D)保護登入過程，但並不妨礙員工在電話中口頭披露支付細節。因此，優先的反措施是 B。 僱員必須核實要求提供資訊的個人的身分。"},{"n":178,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"long","q":"A multinational organization is implementing a security upgrade for its corporate wireless infrastructure. The current WPA2-Personal configuration relies on a shared passphrase, which the IT team finds difficult to rotate and manage securely across hundreds of employee devices. To enhance security and scalability, the organization decides to migrate to WPA2-Enterprise. The new setup must allow for centralized control of user authentication, support certificate-based identity verification, and ensure that each authenticated client is assigned a unique session encryption key to prevent key reuse and limit the blast radius of potential breaches. Which component is essential for enabling this centralized, certificate-based authentication with unique key generation per session in a WPA2-Enterprise environment?","o":["Opportunistic Wireless Encryption (OWE)","Pre-Shared Key (PSK)","Temporal Key Integrity Protocol (TKIP)","RADIUS with Extensible Authentication Protocol (EAP)"],"a":[3],"e":"CEH v13 解釋道:WPA2-企業用依賴 802.1X 框架的集中認證系統來取代 WPA2-個人的靜態，共享的密碼模型。 這個架構的基本組成部分是 RADIUS 與 EAP 整合，它管理使用者認證，裝置身分驗證，以及動態工作階段金鑰生成。 RADIUS 作為後端身分驗證伺服器，而 EAP 則提供靈活的認證框架支援憑證，智慧卡，或認證資訊。 這種組合使得各組織可以執行每個使用者存取控制政策，在不改變網路全域密碼的情況下取消單個使用者，並且為每個認證的工作階段。 CEH 生成獨特的 Pairwise Master Keys(PMKs)，強調 WPA2-Enterprise 的一大優點是它能夠為每個使用者端生成獨特的加密金鑰，防止金鑰再使用，並減少一個裝置受損時的平面移動。基於憑證的 EAP 型別，如 EAP-TLS 引入了相互認證，確保了使用者端和伺服器在允許網路存取之前驗證對方的身分，這大大提升了安全態勢，而 PSK 網路無法安全地對大型企業的部署進行規模化。"},{"n":179,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"In the rainy streets of Portland, Oregon, ethical hacker Ethan Brooks delves into the security layers of ShopSwift, a US-based e-commerce platform reeling from a recent data breach. Tasked with uncovering the method behind unauthorized account takeovers, Ethan examines login patterns across the platform ' s user base. His investigation reveals a surge of automated login activity across multiple accounts, with a suspiciously high success rate. Determined to trace the root cause, Ethan compiles a detailed log to assist ShopSwift ' s security team in restoring trust. Which attack method is Ethan most likely uncovering in ShopSwift's authentication system?","o":["Password Spraying","Brute Force Attack","Credential Stuffing","Phishing Attacks"],"a":[2],"e":"認證資訊 填充是最佳匹配，因為情境突出了在許多帳戶的自動登入嘗試，成功率異常高，發生在突破之後。 在符合 CEH的系統駭客概念中，認證資訊填充是對已知的使用者名稱和密碼對的自動測試--通常是從先前的突破中取得的--針對不同的服務。 由於許多使用者跨站點再使用密碼，攻擊者往往會比以猜測為基礎的攻擊達到高於正常的成功率。 眾多帳戶的\"高成功率\"是一個關鍵指標，表明攻擊者不是隨機猜測，而是使用 bots 或自動化框架在規模上重放有效的認證資訊。密碼噴灑的不同之處在於攻擊者在很多帳戶中嘗試了一小組常見密碼(或一個密碼)來避免被鎖出。 噴灑一般產生較低的成功率，並被猜測所驅動，而不是重放已知的認證資訊對。 野蠻的武力攻擊甚至更令人耳目一新，通常涉及對單一帳戶或小帳戶的反覆猜想；這種攻擊既較慢，也較不可能在短期內在許多使用者中產生高成功率。 竊取攻擊可能導致帳戶被接管，但所述模式將更經常地顯示目標受害者和各種來源，而不是廣泛、自動化、多帳戶認證，同時不斷成功登入。 CEH 防控指導強調分層控制:執行 MFA，監測異常登入速度和認證資訊再利用指標，部署 bot 偵測和速率限制，使用被突破的-密碼檢查，執行適應性認證，並實行調諧鎖定和偵測政策來干擾自動認證資訊重放，而無需允許阻斷服務對合法使用者。","s":"term"},{"n":180,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"At a federal research agency, cybersecurity officer Nikhil is drafting a vulnerability assessment report. In this section, he documents the scanning methodology used, the information about the targets, the type and scope of scans performed, and the tools involved. He does not yet include specific vulnerabilities or affected assets, as this portion of the report is meant to provide context for how the assessment was conducted. Which section of the vulnerability assessment report is Nikhil working on?","o":["Supporting Information","Risk Assessment","Assessment Overview","Findings"],"a":[2],"e":"描述的內容與評估概覽部分相匹配，因為它側重於弱點評估的執行方式，而不是找到什麼。 評估報告通常包括一個部分，解釋掃描的方法和方法，以便利益攸關方能夠了解程序、驗證覆蓋面並正確解釋結果。 在這一情境下，Nikhil 正在記錄掃描方法、目標資訊、掃描型別和範圍以及所使用的工具。 這些要素提供了評估過程、假設和界限的背景和透明度 - - 確切地說，這些要素意味著如何概括。本節還有意不列出具體的弱點或受影響資產，這進一步證實，這不是調查結果一節，而就是報告列舉已發現的弱點、受影響系統、證據、嚴重程度和建議之處。 類似地，它不是風險評估部分，因為該部分一般解釋結論以確定可能性和影響，確定風險的優先順序，並可能將問題與業務影響或合規要求相對映。 由於 Nikhil 只是描述掃描方法和範圍，因此風險分析尚不成熟且不合時宜。為什麼不支援資訊?輔助資訊通常包含補充核心報告的附錄或參考材料--例如原始掃描輸出、詳細設定資料、資產清單、截圖、日誌、工具設定或詞彙/definitions。 雖然工具名稱和技術細節可以出現，但關於方法、目標、範圍的說明， 和掃描型別更適合成為主體概覽的一部分，這樣讀者在對結果進行審查之前就能理解評估的背景。因此，Nikhil 正在研究的一節是 C。 評估概覽，它確定了評估的背景，並在提出調查結果和風險結論之前解釋了掃描方法。","s":"term"},{"n":181,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"You are part of the red team assigned to evaluate the physical and social vulnerabilities of a government contractor ' s office located in a metropolitan business hub. During your pretexting phase, you decide to simulate the role of a third-party IT technician. Upon arrival, the receptionist allows you entry without verifying credentials, assuming you ' re there for scheduled printer maintenance. While moving through the workspace, you casually observe open terminals, unattended printouts, and discarded sticky notes at workstations. You later report several user credentials and partial access details acquired during this visit. Which social engineering technique does this scenario best illustrate?","o":["Shoulder Surfing","Eavesdropping","Impersonation","Dumpster Diving"],"a":[2],"e":"這一情境最能說明情境，這是 CEH 中強調的一種核心社交工程技術，在藉口和人身安全測試下進行。 情境，當攻擊者情境出一個可信的身分時，如 IT 技術員，供應商，維修工或送貨人，以獲得信任並繞過存取控制。 紅隊成員在即時扮演第三方 IT 技術員的角色，並被允許進入，因為接待員認為存取是合法的，並不核實認證資訊。 這是冒充的決定性時刻:利用人類信任和程式弱點獲得未經授權的實際存取。雖然攻擊者後來觀察了開放終端、無人看管的列印出和貼上的筆記，但這些觀察只是機會性的資料採集，只有在成功冒用後才有可能。 肩上衝浪是專門觀察一個使用者進入認證資訊或者站在附近時觀看螢幕，典型的是在積極使用時。 竊聽注重捕捉口語或傳輸的資訊，比如監聽談話或擷取通訊。 垃圾桶搜尋涉及從垃圾箱中取回敏感資訊或垃圾箱中被丟棄的材料，而不只是看到桌子上留下了粘性筆記。 CEH 指南強調，當組織缺乏訪客核查、警徽執法、護送政策以及安全意識培訓時，冒名頂替往往成功。 控制包括驗證工作命令、要求政府簽發身分證、發放訪客徽章、護送訪客、實施清潔辦公桌做法、鎖定工作站以及安全列印以防止被曝光認證資訊和敏感資料。","s":"term"},{"n":182,"c":"雲端運算","ce":"Cloud Computing","t":"short","q":"A serverless application was compromised through an insecure third-party API used by a function. What is the most effective countermeasure?","o":["Deploy a cloud-native security platform","Enforce function-level least privilege permissions","Use a CASB for third-party services","Regularly update serverless functions"],"a":[1],"e":"在 CEH v13 雲端運算中，無伺服器架構引入了獨特的安全挑戰，尤其是圍繞函式-as-a-Service(FaaS)權限。 當一個無伺服器功能透過不安全的第三方 API 被破壞時，損壞主要取決於允許該功能做什麼。實施函式級許可模式並強制實施最小特權原則，確保即使一個函式被利用，其執行惡意動作的能力也受到嚴格限制。 CEH v13 在無伺服器環境中強烈強調顆粒克 IAM 控制。雲內安全平台(備選方案 A)和 CASB(備選方案 C)提供能見度和治理，常規修補程式(備選 D)很重要，但不會減少濫用許可的情況。 CEH v13 將最小特權確定為防止伺服器被濫用的單一最關鍵的控制並權限提升。 因此，選項 B 是正確答案。"},{"n":183,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A city utility billing portal in Raleigh, North Carolina includes a search field used to retrieve customer records. During an authorized penetration test, an assessor submits repeated instances of a character commonly interpreted within SQL statements as part of the input value. The application does not display detailed error messages, yet certain submissions result in irregular response behavior and partial rendering of results. The tester suspects the input may be affecting how the SQL command is internally constructed. Which black-box testing technique is being applied?","o":["Sending special characters to detect SQL modification behavior","Sending arbitrary data to detect truncation issues","Using right square bracket characters to detect identifier handling issues","Sending isolated quotation characters to detect unsanitized input"],"a":[0],"e":"正確答案是 A。 傳送特殊字元來偵測 SQL 修改行為。劇情描述一種黑盒 SQL 注入發現技術。 測試者沒有看到應用程式原始碼或資料庫查詢，因此她提交 SQL-顯著字元，觀察應用程式如何回應。 符合 CEHSQL 注入材料解釋到 SQL 注入涉及將惡意 SQL 注入入已詢問，弱點偵測可能涉及將程式碼注入入輸入欄位並觀察應用程式回覆或錯誤。重要的線索是應用程式即使沒有詳細的出錯訊息也顯示不規則行為，這說明輸入可能正在修改後端 SQL 語句。選項 B 是不正確的，因為擷取測試檢查是否剪去長值或出乎意料的值，而不是 SQL 邏輯是否受到影響。選項 C 對於識別符號或資料庫語法處理來說過於具體，與所描述的通用 SQL 注入探測器不盡相匹配。選項 D 是相通的，但比實際技術更窄。 更寬泛更準確的黑盒技術是傳送特殊的 SQL-顯著字元並觀察行為。因此，最好的答案是 A。 傳送特殊字元來偵測 SQL 修改行為。"},{"n":184,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"What does a NULL scan send?","o":["No flags set","SYN packet","ACK packet","RST packet"],"a":[0],"e":"正確答案是 A， 無旗標。 在 CEH 掃描概念中， NULL 掃描是 TCP 連接埠-掃描技術， 掃描器傳送一個 TCP 段， 沒有啟用的 TCP 旗標。 這意味著 封包 不包含 SYN， ACK， FIN， RST， PSH， 或 URG 旗標。 上傳的 CEH 材料稱， 當沒有設定 TCP 旗標時， 掃描稱為 Null Scanning， 並進一步描述出 NULL 掃描傳送了封包\"沒有設定任何旗標\"。 這與 SYN掃描不同，它傳送 SYN 封包開始半開連線，與 ACK 掃描不同，它傳送封包與 ACK 旗集，幫助識別過濾行為。 RST 不是NULL 掃描傳送的；相反，關閉的連接埠可能以 RST 回應。 為了考試的目的，請記住:NULL 掃描等於空的 TCP 旗場，所以最好的答案是沒有設定旗標。","s":"term"},{"n":185,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"What is the minimum number of network connections in a multihomed firewall?","o":["5","2","3","4"],"a":[1],"e":"正確答案是 B,2。 多主機防火牆是一個透過多主機網路介面連線到多個網路的防火牆系統。 在 CEH 防火牆架構概念中，多主機防火牆被描述為連線了兩個或多個網路，每個介面連線到自己的網路段。 因此， 所需網路連線的最低數量為兩個:一個介面面對一個網路， 外部資源 或無信網； 和另一個面對另一個網路的介面， 內部的 或信任的網路。一個有 3 個介面的防火牆通常與篩選的子網相連線 或 DMZ 設計， 其中一個介面連線到網際網路， 一個給內部網路， 和一到 DMZ。然而，問題要求的是最小，而不是典型的 DMZ 設計。 由於\"多\"意味著一個以上，所以一個多主機防火牆最小的網路有效連線數是兩個。","s":"term"},{"n":186,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"Which of the following tools is used to analyze the files produced by several packet-capture programs such as tcpdump, WinDump, Wireshark, and EtherPeek?","o":["OpenVAS","Nessus","tcptraceroute","tcptrace"],"a":[3],"e":"正確答案為 D。 tcptrace。 Tcptrace 是一個專業的網路分析工具，旨在檢查和分析由封包嗅探和封包擷取等應用程式生成的封包擷取(PCAP)檔案，如 tcpdump，WinDump，Wireshark 和 EtherPeek。 它提供 TCP 連線的詳細資訊，包括輸送量，往返時間，再傳送，封包損失，連線時間，以及通訊統計。在 CEH 網路流量分析與封包嗅探話題中，被捕獲的網路流量常被儲存到 PCAP 檔案中供後期檢查。 tcptrace 等工具幫助安全專業人員，穿透測試者，事件應對者分析網路通訊，故障解答效能問題，識別異常，並調查安全事件。選項 A (OpenVAS)和選項 B (Nessus)是用於識別系統和網路安全弱點的弱點掃描器。 選項 C (tcptraceroute)是一個網路路徑發現工具，它使用 TCP 封包而不是 ICMP 封包來追蹤路徑，也不打算用於分析封包擷取檔案。 CEH 應試提示:tcpdump/Wireshark = 捕獲 網路流量。 tcptrace = 分析被捕獲的流量(PCAP檔案)。 Nessus/OpenVAS = 弱點評估 工具。因此，tcptrace 是分析由多個封包擷取應用程式所建立的封包擷取檔案的正確工具。","s":"tool"},{"n":187,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During testing against a network protected by a signature-based IDS, the tester notices that standard scans are blocked. To evade detection, the tester sends TCP headers split into multiple small IP fragments so the IDS cannot reassemble or interpret them, but the destination host can. What technique is being used?","o":["IP decoying with randomized address positions","SYN scan with spoofed MAC address","Packet crafting with randomized window size","Packet fragmentation to bypass filtering logic"],"a":[3],"e":"CEH v13 的細節，分解攻擊是一種常見的 IDS 逃生策略。 以簽名為基礎的 IDS 系統依賴於重組封包來偵測惡意模式。 當攻擊者將 TCP 頭片分解為更小的片段時，IDS 可能無法重建出原來的封包序列，特別是如果碎片被故意地被分解來混淆再組裝緩衝區。 同時，目標主機通常會將碎片正確再接再勵，使掃描或酬載能夠透過不被發現。 這個技術在 IDS 逃逸方法下特別被討論，因為破碎使得封包檢查無法完整完成。 選項 A 和 B 描述出不相關的逃逸機制，如 IP 欺騙和 MAC 欺騙，而選項 C 並不從根本上影響 IDS 重建。 測試器顯然在使用封包分解來逃避偵測，同時仍然能成功對映開口。","s":"term"},{"n":188,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"You must map open ports and services while remaining stealthy and avoiding IDS detection. Which scanning technique is best?","o":["FIN Scan","TCP Connect Scan","ACK Scan","Stealth Scan (SYN Scan)"],"a":[3],"e":"TCPSYN 掃描又名\"隱形掃描\"，被 CEHv13 網路掃描強調為精度和隱形之間最有效的平衡，它傳送了 SYN 封包並分析回應而未完成 TCP 握手。由於連線從未完全建立，SYN 掃描不太可能被應用程式登入，而 IDS 系統比 TCP 連線掃描更難偵測。 FIN 和 ACK 掃描用於防火牆規則對映和逃取，但是它們不能可靠地點出服務。 TCP Connect 掃描很吵並容易被偵測出。 因此， Steepth (SYN) Scan 是最好的選擇。","s":"term"},{"n":189,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"long","q":"A national e-commerce retailer experiences a sustained distributed attack that saturates its edge connectivity with high-volume traffic originating from thousands of globally dispersed hosts. Internal mitigation attempts such as ACL tuning and rate limiting fail to restore service stability. After escalating the issue, the organization coordinates with its upstream connectivity provider, which begins rerouting inbound traffic through a large-scale filtering infrastructure capable of absorbing and scrubbing malicious traffic before forwarding legitimate requests back to the retailer's network. What defensive approach is being applied in this scenario?","o":["Implementing RFC 3704 Filtering at the Network Edge","Enabling Cisco IPS Source IP Reputation Filtering","Leveraging DDoS Prevention Offerings from an ISP or DDoS Mitigation Service","Deploying Black Hole Filtering at the Routing Layer"],"a":[2],"e":"正確答案是 C.Leveraging DDoS 預防從 ISP 或 DDoS 緩解服務提供。情境描述的大規模 DDoS 攻擊超過了組織的區域性緩解能力。 流量透過上游過濾或洗滌基礎設施進行再接再勵，吸收惡意流量，並將合法流量轉發回組織，這是 ISP-揹負或專業 DDoS 緩解/scrubbing 服務的功能。 符合 CEH DDoS 反制材料指出，對於一個真實的 DDoS 攻擊，實際答案往往是:參與上游 ISP，因為端點級防禦可能無法跟上覆雜的全球殭屍網路攻擊。選項 A。 RFC3704 過濾不正確，因為內侵/egress 過濾有助於減少偽造的的流量，但沒有描述大規模流量擦拭。選項 B。 Cisco IPS Source IP 信譽過濾不正確，因為光是來源聲譽過濾不能匹配上游流量的再接回和刷取。選項 D。 黑洞濾鏡不正確，因為黑洞下降流量，通常包括合法流量，而情境則說清潔流量被傳送回零售商。因此，最好的答案是 C.Leveraging DDoS 預防從 ISP 或 DDoS 緩解服務提供。"},{"n":190,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"Systems are communicating with unknown external entities, raising concerns about exfiltration or malware. Which strategy most directly identifies and mitigates the risk?","o":["Aggressive zero-trust shutdown","Deep forensic analysis","Behavioral analytics profiling normal interactions","Employee awareness training"],"a":[2],"e":"CEH v13 強調行為分析是識別模糊或隱蔽威脅(如資料過濾、指令和控制流量以及內幕濫用)的最有效技術之一。 當互動看起來可疑但並非絕對惡意時，行為特徵分析提供了最直接的能見度。行為分析工具為正常的系統和網路行為設定了基線，包括典型的通訊模式、資料傳輸量、目的地和時間。 偏離了這一基線觸發提醒，讓分析人員能夠偵測出先前未知的威脅而無需依賴簽名。選項 C 最為恰當，因為它既能識別異常，又能支援持續緩解。完全零信任關閉(選項 A)是破壞性的。法醫學(選項 B)是反應性的，在確認入侵後更適合。培訓(選項 D)不涉及系統層面的相互作用。 CEH v13 強調現代攻擊往往會與正常的流量相融合，使得行為分析變得至關重要。 因此，\"選項 C\"是正確答案。"},{"n":191,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"A senior executive receives a personalized email titled \"Annual Performance Review 2024.\" The email includes a malicious PDF that installs a backdoor when opened. The message appears to originate from the CEO and uses official company branding. Which phishing technique does this scenario best illustrate?","o":["Email clone attack with altered attachments","Broad phishing sent to all employees","Pharming using DNS poisoning","Whaling attack targeting high-ranking personnel"],"a":[3],"e":"認證的道德駭客(CEH)社交工程模組將捕鯨定義為一個目標高度明確的網路網路釣魚攻擊，專門針對高管或高官。這個場景展現出所有的捕鯨特徵:個性化，冒充領導者，商業主題內容，以及定製的惡意軟體交付。選項 D 是正確的。選項 A 涉及複製合法的電子郵件，但不一定針對高管。備選方案 B 缺乏針對性。選項 C 與基於電子郵件的攻擊無關。 CEH 強調行政意識培訓，以對抗捕鯨攻擊。","s":"term"},{"n":192,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester alters the \" file \" parameter in a web application (e.g., view?file=report.txt) to ../../../../etc /passwd and successfully accesses restricted system files. What attack method does this scenario illustrate?","o":["Conduct a brute-force attack to obtain administrative credentials","Use directory traversal sequences in URL parameters to retrieve unauthorized system content","Inject malicious scripts into web pages to manipulate content via XSS vulnerabilities","Exploit buffer overflow issues by injecting oversized data in HTTP request headers"],"a":[1],"e":"CEH v13 解釋道，當一個應用程式不適當地處理用於檔案路徑生成的使用者提供的輸入時，會出現目錄 traversal(也叫路徑 traversal)。/攻擊者透過在預定目錄外插入。/等 traversal 序列來利用它， 取得像/etc/passwd， 設定資料， 或原始碼等敏感檔案的存取權。 弱點源於缺少輸入驗證以及未能限制檔案存取安全目錄。 CEH 強調目錄 traversal 在檢視，下載等檔案處理功能中很常見，或者包含操作。 Brute-forcing 認證資訊(可選 A)是無關的。 XSS(可選 C)的目標是將指令碼注入網頁，而不是檔案存取。 緩衝區溢位(可選 D)操縱記憶體，而不是檔案路徑。 因此，這種情境代表了經典目錄的橫向開發。"},{"n":193,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"A financial services firm is experiencing a sophisticated DoS attack on their DNS servers using DNS amplification and on their web servers using HTTP floods. Traditional firewall rules and IDS are failing to mitigate the attack effectively. To protect their infrastructure without impacting legitimate users, which advanced mitigation strategy should the firm implement?","o":["Increase server capacity and implement simple rate limiting","Block all incoming traffic from suspicious IP ranges using access control lists","Deploy a Web Application Firewall (WAF) to filter HTTP traffic","Utilize a cloud-based DDoS protection service with traffic scrubbing capabilities"],"a":[3],"e":"基於雲的 DDoS 緩解服務提供上游流量洗滌，偵測和過濾出 DNS 放大等高容量攻擊和 HTTP 泛洪等流量到達被害者網路前。這些服務使用分散式基礎設施，能夠處理超過傳統地上防火牆和 IDS 容量的多媒介攻擊。 流量洗滌中心將合法流量與惡意流量區分開來，使正常業務得以繼續，而不會中斷服務。"},{"n":194,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"A telecommunications provider in Toronto operates a monitoring platform that analyzes inbound traffic streams during suspected denial-of-service conditions. The system converts traffic measurements into signal components and evaluates their energy across multiple frequency ranges to distinguish abnormal traffic bursts from background network noise. Rather than focusing on traffic baselines or identifying the exact statistical breakpoint where behavior changes, the platform identifies anomalies by decomposing traffic signals into spectral components for analysis. Which DDoS detection technique is being used in this scenario?","o":["Traffic Pattern Analysis","Sequential Change-Point Detection","Activity Profiling","Wavelet-Based Signal Analysis"],"a":[3],"e":"正確答案是 D。 Wavelet-based Signal Analysis。 維基共享資源中相關的原始文獻: 維基語錄連結:名人名言 - 文學作品 -諺語 -諺語 - 諺語 - 諺語 - 諺語情境描述將流量測量轉換成訊號元件，並跨頻率範圍進行分析。這是基於波的訊號分析的界定概念。 符合 CEHDDoS 偵測材料稱以 Wavelet-based Signal Analysis 是分析輸入訊號來偵測 DoS/DDoS 攻擊的自動化過程。 它用於偵測量基異常， 評估流量量， 並把它濾去， 適應性閾值技術用於偵測 DoS 攻擊。選項 A。 流量模式分析過於籠統，沒有具體描述訊號分解。選項 B。 序列變化-點偵測是不正確的，因為該技術識別出行為在統計學上發生變化的點，通常帶有 CUSUM-tyle 邏輯。選項 C。 活動分析是不正確的，因為它將活動與平均流量率或基線行為相比較。選項D。 以\"波\"為基礎的訊號分析是正確的，因為平台將流量分解為訊號/頻率元件來偵測異常。因此，最好的答案是D.Wavelet-based Signal Analysis。","s":"term"},{"n":195,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"In Boston, Massachusetts, network administrator Daniel Carter is monitoring the IT infrastructure of New England Insurance, a prominent firm, after receiving alerts about sluggish system performance. While reviewing traffic patterns, Daniel observes an unusual volume of concurrent requests overwhelming critical servers. To validate his suspicion of a session hijacking attempt, he begins capturing and reviewing live network traffic to identify unauthorized session behaviors before escalating to the security team. What detection method should Daniel use to confirm the session hijacking attack in this scenario?","o":["Use an intrusion detection system (IDS)","Check for predictable session tokens","Monitor for ACK storms","Perform manual packet analysis using packet sniffing tools"],"a":[3],"e":"劇情強調丹尼爾\"開始捕捉並審查活的網路流量\"，以識別未經授權的工作階段行為。 在符合 CEH 網路分析實踐中，當您已經擁有了封包擷取時，最直接確認工作階段劫持的方法是使用封包嗅探工具的手動封包分析。 透過檢查活流量，丹尼爾可以連線到工作階段，驗證多個來源是否在重用相同的工作階段識別碼，識別出異常的 TCP 序列並承認行為，並偵測出重複的 cookis/tokens，重播請求，不一致的使用者端 IP 或使用者代理轉移等模式，或者突然發生。工作階段 跨主機再利用。 這種方法提供了超出警報範圍的證據細節， 並允許在升級前進行驗證。 IDS 可以有所幫助，但它是一個基於簽名或異常生成警報的偵測系統；它本質上不會\"確認\"這個問題，除非它提供明確的支援證據，而特指訊框丹尼爾的行動作為實事求是的流量審查。 檢查可預見工作階段權杖是弱工作階段管理設計的一個預防和診斷步驟，但並不能直接證實從所觀察到的網路行為中發生進展中的劫持事件。 對 ACK 風暴的監測可以表明某些 TCP 級劫持/desynchronization 的條件，但範圍較窄，可能不適用於應用程式層。工作階段劫持，這在企業環境中更為常見，並將透過檢查工作階段識別碼和請求捕獲中的流量來驗證。因此，鑑於所描述的工作流程以及需要確認來自活路流量的未經授權的工作階段活動，CEH 方法與使用嗅探工具的手動封包分析最相匹配。"},{"n":196,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"A technology consulting firm in Charlotte, North Carolina experienced a targeted intrusion after an employee interacted with a carefully crafted phishing email. Security analysts reconstructed the sequence of events and determined that once the email attachment was opened, built-in scripting utilities were invoked to inject malicious instructions into an active system process. No standalone malicious executables were discovered on disk. The injected instructions began running directly inside legitimate processes before any registry modifications or task scheduling changes were observed. At this point in the attack sequence, which operational phase of the fileless attack lifecycle is being demonstrated?","o":["Persistence","Point of Entry","Achieving Objectives","Code Execution"],"a":[3],"e":"正確答案是 D。 程式碼執行。網頁郵件和附件代表初始傳送或輸入點。 然而， 問題在於附件開啟後， 內建的指令碼工具在合法執行過程中注入惡意指令時。 此時， 攻擊者的程式碼正在積極執行記憶體中， 而不在磁碟上單獨執行惡意可執行檔案。這是無檔案攻擊的程式碼執行階段。 無檔案攻擊經常會濫用信任的系統工具、指令碼和合法程式， 直接執行記憶體中的惡意指令。一個相關的特權升級參考文獻將\"Living Off the Land Binaries and Scripts\"描述為由微軟簽名的檔案，指令碼，或庫，可以被 APT 或紅隊操作員用於出乎意料的攻擊者功能。選項 A。 持久性是不正確的，因為持久性將涉及透過登錄金鑰、排程工作、服務、啟動資料夾或類似機制維持存取。選項 B。 輸入點是不正確的， 因為輸入點是 filshing 電子郵件附件。 問題集中在開啟後發生的執行。選項 C。 實現目標是不正確的，因為沒有說明最終目標，如資料被竊取、橫向移動或影響。選項 D。 程式碼執行是正確的，因為惡意指令正在合法程式內執行。因此，最好的答案是 D。 程式碼執行。","s":"term"},{"n":197,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"The establishment of a TCP connection involves a negotiation called three-way handshake. What type of message does the client send to the server in order to begin this negotiation?","o":["RST","ACK","SYN-ACK","SYN"],"a":[3],"e":"從 CEHv13 指南中綜合詳細解釋:正確答案是 D。 SYN。 TCP (傳輸控制協定) 透過一個被稱為\"三向交握\"的過程，在使用者端和伺服器之間建立了可靠的通訊，這個機制確保雙方在資料傳輸開始前準備好溝通和商定序號。這三項步驟是:SYN (Synchronize):使用者端透過將 TCP 封包與所設定的 SYN 旗一起傳送到伺服器來啟動連線。 這個封包包含了使用者端的初始序號(ISN)。 SYN-ACK (Synchronize-Acnowledge):伺服器以包含 SYN 和 ACK 兩種旗標的封包回應，這承認了使用者端的請求並提供了伺服器自己的序號。 ACK (知識):使用者端傳送出一款 ACK 封包回伺服器，確認收到伺服器的序號，此時已建立 TCP 連線並可以開始資料傳輸。選項 A (RST) 用於重置或終止連線。 選項 B (ACK) 用於確認收到的封包但不啟動連線。 選項 C (SYN-ACK) 由伺服器傳送作為握手的第二步，而不是由使用者端啟動。理解 TCP 三向交握在 CEH 網路安全話題中是根本性的，因為很多攻擊，如 SYN 泛洪，都利用了這個連線建立過程。 因此，使用者端開始談判時傳送了 SYN 封包。","s":"term"},{"n":198,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"You are Liam Chen, an ethical hacker at CyberGuard Analytics, hired to test the social engineering defenses of Coastal Trends, a retail chain in Los Angeles, California. During a covert assessment, you craft a deceptive message sent to the employees' company phones, claiming a critical account update is needed and directing them to a link that installs monitoring software. Several employees interact with the link, exposing a vulnerability to a specific mobile attack vector. Based on this approach, which mobile attack type are you simulating?","o":["Bluebugging","SMS Phishing","Call Spoofing","OTP Hijacking"],"a":[1],"e":"SMS Phishing，通稱為 smishing，是正確答案，因為攻擊方法是一種向移動裝置傳送的欺騙性簡訊，會誘使收件人點選惡意連結。在符合 CEH 的社交工程覆蓋中， smishing 是使用 SMS 作為傳送通道的 fhishing 的直接延伸。 攻擊者通常會創造緊急或權威，例如“關鍵帳戶更新所需的”觸發快速合規。然後，資訊會將受害者推向惡意的 URL，可以傳送惡意軟體，提示認證資訊輸入，或者根據平台和權限將裝置輸入監測或管理設定。問題的關鍵指標是公司電話、一個被設計的資訊，以及安裝的連結。監控軟體，這非常適合模仿。 Bluebugging 是一種以 Bluetooth 為主的攻擊，攻擊者利用 Bluetooth的弱點獲得未經授權的對裝置的存取，讀取資料，定位呼叫，或傳送訊息，它不依賴傳送欺騙的 SMS 連結。 撥打欺騙是操縱呼叫者 ID 在語音通話時會冒充一個被信任的號碼，而不是透過文字傳送惡意安裝連結。 OTP 劫持側重於攔截或欺騙使用者洩露一次性密碼，經常透過 SIM 互換，惡意軟體，或即時打字，但情節強調透過連結而不是捕獲一次性程式碼來安裝監控軟體。在道德安全訓練中強調的防禦包括行動裝置安全意識，遮蔽未知的連結，使用移動威脅防禦，限制從不可信來源安裝應用軟體，執行 MDM 控制，並監測 SMS-基於社交工程的指標。","s":"term"},{"n":199,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"An internal review at a financial analytics firm in Minneapolis, Minnesota, uncovered unusual query patterns directed at the company's directory services infrastructure. Security engineer Olivia Grant examined the logs and discovered that a user account had been issuing structured directory queries to retrieve lists of user objects, group memberships, and organizational units. Further inspection revealed that the account was able to access information about privileged groups containing the word \"Admin\" in their titles. The activity did not involve password guessing or authentication bypass, but rather systematic directory lookups to map internal user and group relationships. What type of enumeration is illustrated in this scenario?","o":["VoIP Enumeration","LDAP Enumeration","SMTP Enumeration","DNS Enumeration"],"a":[1],"e":"正確答案是 B。 LDAP 列舉。該情境描述對目錄服務進行系統查詢，以擷取使用者，組，組織單位，和特權組名。這直接對映到 LDAP 列舉。 符合 CEH 列舉材料解釋出 LDAP 用於在分級和邏輯結構下存取和維護分散式目錄資訊服務，它還宣告目錄服務允許共享資訊，如使用者，系統，網路服務，使用者名稱，以及整個網路的密碼。 另一個 CEH 參考文獻解釋，LDAP 可以揭示有效的使用者名稱，網域名稱資訊，位址，電話號碼，系統資料，以及組織結構。選項 A。 VoIP 列舉是不正確的，因為 VoIP 列舉 瞄準 SIP 使用者，擴充套件，電話，和語音基礎設施。選項 C。 SMTP 列舉是不正確的，因為 SMTP 列舉使用命令如 VRFY，EXPN，和 RCPT 來識別有效的電子郵件使用者。選項 D。 DNS 列舉是不正確的，因為 DNS 列舉識別出網域名稱記錄，名稱伺服器，主機，區域，以及相關的 DNS 基礎設施。因此，最好的答案是 B。LDAP 列舉。","s":"term"},{"n":200,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"short","q":"Which WPA vulnerability allowed packet injection and decryption attacks?","o":["Lack of AES encryption","Predictable GTK","Weak Initialization Vectors (IVs)","Weak passwords"],"a":[2],"e":"WPA 與 TKIP 發生自 WEP 所繼承的弱點，特別是使用弱初始化向量(IVs)。 CEH v13 解釋道，這些弱點使攻擊者能夠進行封包注入和部分解密攻擊。雖然 WPA 改進了 WEP，但 TKIP 被設計為一種臨時解決方案，仍然依賴於可預測的 IV 行為，這使得\"選項 C\"正確。缺少 AES(可選 A)解釋了為什麼 WPA 比 WPA2 弱，但並沒有直接描述被利用的機制。 薄弱的密碼(可選 D)影響認證，而不是封包注入。 GTK 可預期性(可選 B)在這裡是相關但並非主要原因。 CEH v13 明確宣告，TKIP 中的 IV 再利用和可預見效能夠實現實際攻擊，因此，選項 C 是正確的。","s":"term"},{"n":201,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"During an authorized wireless security assessment, an ethical hacker captures traffic between client devices and a corporate access point to evaluate the strength of the implemented encryption mechanism. Packet analysis reveals that before protected data exchange begins, the client and access point complete a structured four-message key negotiation process. Subsequent traffic is encrypted using an AES-based counter mode protocol that integrates message authentication for integrity protection. Based on these observations, identify the wireless encryption standard deployed on the network.","o":["WEP","WPA","WPA2","WPA3"],"a":[2],"e":"正確答案是 WPA2。 CEH 無線安全材料解釋道:WPA2 使用以 AES 為基礎的加密，同時提供保密和訊息完整性保護的CCMP。 情境還提及在被保護的流量開始前結構化的四通道金鑰談判過程，它與 WPA 和 WPA2 環境中使用的眾所周知的四通道握手方式相配合。決定因素是加密和完整性組合:AES 與 CCMP 在 CEH 指導中與 WPA2 緊密相聯。 WEP 的實力更弱並基於 RC4,而 WPA 最初依靠 TKIP 作為其標誌性改進，而不是 WEP。 WPA3 引入了更新的保護和不同的考試重點， 但典型的 CEH 用於四向握手+AES/CCMP 的對映是 WPA2.CEH 參考文獻也注意到 WPA2 的設計是為了改善企業級無線安全，而 CCMP 處理完整性問題比解決完整性問題更有效。由於封包擷取顯示以 AES 為基礎的計數器模式加密，在握手順序後進行綜合完整性檢查，因此所觀察到的標準最好被識別為 WPA2。","s":"term"},{"n":202,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"Which encoding often bypasses filters?","o":["ROT13","Base64","Unicode","Hex"],"a":[2],"e":"正確答案是 C，因為 Unicode 編碼通常與繞行弱輸入過濾器，IDS 簽名，和 Web 應用程式過濾控制相接。 在 CEH 風格的網路和周邊逃生話題中，攻擊者可能會編碼出危險的字元，這樣安全過濾器就不會識別出酬載，而目標應用程式或伺服器後來解碼並處理。 CEH 材料特地描述出 Unicode 字元對網路和 IDS 過濾器有效，因為它們能夠替換人可讀字元並混淆以簽名為基礎的偵測。 也解釋 Unicode 允許字元的多表示並可以被惡意地用於繞過只檢查有限或短的 Unicode 格式的過濾器。 ROT13 只是簡單的替代密碼， Base64 是通用編碼，而 Hex 是表示格式。 雖然這些可以支援疏漏，但 CEH 考試上下文最能將過濾繞行與 Unicode 編碼，特別是目錄通路，犬形化，和 IDS/WAF 逃逸的情境相接。","s":"term"},{"n":203,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"A competing technology firm begins releasing products that closely mirror the design, pricing strategy, and feature roadmap of ApexDynamics Inc. An internal review reveals that detailed information about ApexDynamics ' s upcoming initiatives had been gradually collected through publicly available sources and external disclosures before product launch. Which footprinting-related threat does this scenario best represent?","o":["Corporate Espionage","Business Loss","Information Leakage","Social Engineering"],"a":[0],"e":"最好的答案是公司間諜(Company Espionage )。 CEH 偵察的覆蓋範圍解釋道，足跡不僅可用於技術攻擊準備，還可用於針對組織的競爭性情報蒐集。 在這種情境下，一個競爭對手的公司似乎已經從公開的資料和釋出前的外部披露中獲得了關於產品設計、定價及路由圖決定的有意義的戰略資訊。 由此產生的傷害不僅僅是抽象的偶然暴露；而是利用蒐集的情報來獲得比目標組織的商業優勢。 這使得企業間諜行為是最準確的分類。 資訊洩漏無疑是路徑的一部分，因為某些資訊必須暴露於公共來源或從公共來源推斷出來，但所要求的威脅是競爭者的行為所代表的與足跡有關的後果。 商業損失描述了一種影響，而不是威脅類別本身。 社交工程需要與人進行操縱性互動，而這裡沒有說明這一點。 CEH 的材料指出，粗心大意的公開披露、後設資料、職業帖子、夥伴資訊以及戰略公告都能夠支援競爭者或對手的足跡。 如果系統地蒐集這些資料以反映或破壞商業戰略，則最好將這一活動稱為公司間諜。","s":"term"},{"n":204,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"Which of the following is one primary difference between a malicious hacker and an ethical hacker?","o":["Malicious hackers use different tools and techniques than ethical hackers use.","Ethical hackers obtain permission before bringing down servers or stealing credit card databases.","Malicious hackers are more advanced than ethical hackers because they can use any technique to attack a system or network.","Ethical hackers use the same methods but strive to do no harm."],"a":[3],"e":"正確答案是 D。 道德駭客使用同樣的方法，但努力不造成任何傷害。 符合 CEH 的指引強調，被認證的道德駭客理解了弱點和弱點，並使用與惡意駭客相同的知識和工具，但以合法和合法的方式評估目標系統的安全態勢。 關鍵區別不是工具或技術方法；而是授權、目的、範圍和意圖。 道德駭客在操作時得到了客戶的認可，遵循接戰規則、檔案發現，並努力改善安全。 惡意駭客利用類似的技能和工具謀取個人利益、破壞、資料被竊取或活動超出所有者的利益範圍。 選項 A 是不正確的，因為道德和惡意駭客可能使用相同的工具。 選項 B 是誤導性的，因為道德駭客沒有獲得偷取資料的許可或者有意在商定範圍外下架系統。 選項 C 是不正確的，因為惡意駭客本質上不是更先進的，因此，D 是最好的答案。"},{"n":205,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"A Nessus scan reveals a critical SSH vulnerability (CVSS 9.0) allowing potential remote code execution on a Linux server. What action should be immediately prioritized?","o":["Redirect SSH traffic to another server","Treat the finding as a possible false positive","Immediately apply vendor patches and reboot during scheduled downtime","Temporarily isolate the affected server, conduct a forensic audit, and then patch"],"a":[3],"e":"根據 CEH 弱點評估和事件應對模組，CVSS 分數高和有潛在 RCE 的弱點必須作為活動威脅處理。 CEH 最佳做法建議:立即遏制(網路隔離)調查和影響分析修補程式應用程式恢復選項 D 精確地遵循了 CEH 事件回應生命週期。選項 C 沒有限制是不完整的。選項 A 和 B 是不安全的。 CEH 在補救前強調封閉。"},{"n":206,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"In a controlled testing environment in Houston, Sarah, an ethical hacker, is tasked with evaluating the security posture of a financial firm's network using the cyber kill chain methodology. She begins by simulating an attack, starting with gathering publicly available data about the company's employees and infrastructure. Next, she plans to craft a mock phishing email to test employee responses, followed by deploying a harmless payload to assess system vulnerabilities. As part of her authorized penetration test, what phase of the cyber kill chain should Sarah prioritize to simulate the adversary's approach effectively?","o":["Exploitation","Reconnaissance","Weaponization","Delivery"],"a":[1],"e":"偵察是正確階段，因為情境明確規定了莎拉從蒐集公開的員工和基礎設施資訊入手。 在\"網路殺手鍊\"中，偵察是攻擊者蒐集情報以瞭解目標並找出最有效的妥協途徑的第一階段。 在符合 CEH 方法中，這包括了開源情報活動，如發現員工姓名，角色，電子郵件，技術堆疊線索，被曝光的服務，以及幫助製作現實而令人信服的攻擊誘餌的組織模式等。問題提到莎拉計劃製作一個模擬的打字郵件，然後部署一個無害的酬載。 這些行動圖將在未來殺死鏈條階段:送信是把打字郵件或惡意連結傳送到目標時，弱點利用是觸發了執行程式碼或取得存取的弱點。 武器化是攻擊者準備惡意文物的一步，比如用酬載來包裝弱點利用物，或者準備檔案或連結來交付，但關鍵的措辭是莎拉透過蒐集公共資訊\"開始\"，被問到她應該優先選擇哪個階段來有效模擬對手的方法。 這是偵察，因為有效的釣魚和隨後的步驟取決於準確的目標剖面分析、可信的藉口，以及根據情報蒐集過程中學到的知識確定可能的弱點。因此，為了與描述的起步點和殺鏈序列相匹配，優先順序為偵察。","s":"term"},{"n":207,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"A penetration tester identifies malware that monitors the activities of a user and secretly collects personal information, such as login credentials and browsing habits. What type of malware is this?","o":["Worm","Rootkit","Spyware","Ransomware"],"a":[2],"e":"CEH 將間諜軟體定義為惡意軟體，旨在隱蔽地觀察使用者行為，並在受害者不知情的情況下將敏感資訊傳遞給攻擊者。Spyware 通常記錄按鍵，瀏覽器活動，格式提交，應用程式使用等個人可識別資訊。 CEH 強調間諜軟體經常默默操作並可能偽裝成合法軟體，使得偵測變得困難。 與 Rootkits - - 隱藏程序和檔案 - - 或自我複製的蠕蟲不同，間諜軟體只專注於監測和資料過濾。 它經常透過網遊、驅動下載、瀏覽器弱點或惡意安裝器安裝。 Spyware 可以透過為攻擊者提供權限提升，橫向移動，或財務盜竊的認證資訊來作為進一步系統失陷的墊腳石。 CEH 強調需要端點硬化，更新的抗瘧疾引擎，以及行為分析工具來偵測出這樣的隱形監測程式。","s":"term"},{"n":208,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A national retail chain headquartered in Minneapolis, Minnesota operates a customer rewards portal supported by front-end delivery layers designed to improve performance during peak shopping periods. During an authorized security assessment, a tester submits a specially crafted request containing unusual header combinations and a modified query parameter while accessing a promotional page. Shortly afterward, other legitimate users requesting the same promotional page through standard browsers begin receiving altered content that differs from what the application normally generates. When the tester accesses the underlying origin system directly, the response reflects the expected legitimate version. After some time and additional routine traffic, the unexpected content is no longer served. Identify the attack technique that best explains this observed behavior.","o":["DNS Server Hijacking","DNS Rebinding Attack","Web Cache Poisoning Attack","SQL Injection Vulnerability"],"a":[2],"e":"正確答案是 C。 Web 快取 中毒攻擊。關鍵指標是:更改後的內容提供給其他使用者。來源 伺服器 仍然返回合法回應。這個問題在快取過期或替換後消失。被精心設計的請求使用了影響快取輸出的標頭和參數。 符合 CEH 的網路伺服器材料解釋道:當攻擊者向快取傳送了精心製作的請求並儲存了假條目，導致使用者被重新定向或服務惡意內容時，會發生 Web 快取中毒。 另一個符合 CEH 的參考文獻解釋說，一個網頁快取儲存了回覆副本以加速未來請求，如果攻擊者將惡意或被操縱的內容強行輸入快取，後期存取者可以收到。那毒藥反應。選項 A。 DNS 伺服器 劫持是不正確的，因為 DNS 記錄或DNS 伺服器 設定沒有被修改。選項 B。 DNS 重新繫結攻擊是不正確的，因為情境涉及被快取的網頁內容，而不是瀏覽器透過 DNS 重新繫結對私人網路資源的存取。選項 D。 SQL 注入 弱點是不正確的，因為行為與交付層快取有關，而不是資料庫查詢操作。因此，最好的答案是 C。 Web 快取毒藥攻擊。","s":"term"},{"n":209,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"During a red team assessment at Sunshine Credit Union in Miami, ethical hacker Laura demonstrates a weakness in the company ' s session handling process. She shows that once a user logs in, the same authentication token assigned before login continues to be valid without being refreshed. Laura explains that an attacker could exploit this flaw by tricking a victim into authenticating with a value already known to the attacker, gaining access afterward. To mitigate this risk, the IT team agrees to apply a countermeasure focused on proper session lifecycle management. Which countermeasure should the IT team implement?","o":["Implement SSL to encrypt all information in transit via the network","Use restrictive cache directives for all the web traffic through HTTP and HTTPS","Regenerate the session ID after a successful login to prevent session fixation attacks","Do not create sessions for unauthenticated users unless necessary"],"a":[2],"e":"正確答案是 C。 在成功登入後再生成工作階段 ID，以防止工作階段固定攻擊，因為所描述的弱點是工作階段固定的教科書條件。在工作階段定型中，攻擊者在被害者認證前設定或預測被害者的工作階段識別碼(例如，透過傳送包含工作階段ID 的精心設計的連結，透過 URL 參數將已知的指使符強制入被害者瀏覽器，或者為未認證使用者利用建立工作階段的應用行為)。 如果應用程式在認證後未能釋出新的工作階段識別碼，攻擊者可以在受害人日誌進入後重新使用已經知道的工作階段 ID，有效接管被認證的工作階段。劇情明確規定\"登入前指定的同一認證標誌繼續有效而不被重新整理\"，而攻擊者可以\"使被攻擊者用攻擊者已經知道的價值來認證\"，這些宣告精確地描述了工作階段固定:認證是\"約束\"到一個已經存在的工作階段識別碼，而不是新生成的後登入標誌。 最直接和最廣泛的推薦的緩解是將舊的工作階段無效，並在成功認證後立即再生出新鮮的工作階段 ID(以及升格為管理員角色等特權變化之後)，這打破了攻擊者的知識優勢，因為即使他們強制使用前名工作階段 ID，在登入後也變得無用。為什麼其他選擇不正確: A (SSL/TLS) 保護機密性) 過境的廉正 但並不阻止攻擊者透過其他方式來固定一個工作階段 ID。 B(限制性快取指令)有助於防止敏感頁面被儲存在快取中。 但不處理 工作階段 ID 重複使用。 D 可以透過限制先入為主的工作階段來減少接觸，但許多應用都合法地要求它們(購物)推車，CSRF 權杖)，它不像在認證邊界重生出工作階段識別碼那樣直接或完整。因此，正確的對應措施是在登入後再生出工作階段 ID。"},{"n":210,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"A CEH has mirrored a website, identified session hijacking risk, and wants to minimize detection. What is the most appropriate next step?","o":["Attempt SQL Injection","Hijack a session and modify server configuration","Launch brute-force attacks","Perform automated vulnerability scanning"],"a":[1],"e":"根據 CEH v13 System Hacking 和 Web 應用程式入侵，一旦偵察和足跡完成，攻擊者通常在保持隱蔽的同時進入受控開發。 由於 CEH 已經識別出工作階段劫持的弱點，利用這一弱點是最符合邏輯和最隱蔽的進展。工作階段劫持允許攻擊者冒用合法使用者而不觸發認證提醒，使其比暴力破解或掃描活動明顯更難被察覺。 選項 B 與 CEH 方法對接:劫持有效的工作階段提供授權的級別存取，然後可以被濫用來進行謹慎的設定修改。 SQL 注入(可選 A)可能觸發資料庫出錯和 IDS 出錯。 Brute-force 攻擊(可選 C)很吵，容易被記錄。 自動弱點掃描(可選 D)會產生過多流量，典型情況下一旦被開發開始就會被避免。 CEHv13 強調利用已經查明的弱點，並儘可能減少開採過程中的足跡，因此，選項 B 是正確的。"},{"n":211,"c":"密碼學","ce":"Cryptography","t":"mid","q":"A publicly traded blockchain startup conducts a forensic review after irregular transaction reversals are detected on its distributed ledger platform. Network telemetry indicates that a single coordinated entity controlled a dominant share of the computational power participating in block validation during the affected time window. As a result, certain confirmed transactions were replaced with alternate versions, enabling double-spending before the broader network regained balance. No individual node isolation or transaction front-running behavior is observed; rather, the anomaly stems from disproportionate influence over block creation. Identify the blockchain attack most consistent with this incident.","o":["Eclipse Attack","Finney Attack","51% Attack","DeFi Sandwich Attack"],"a":[2],"e":"正確答案是 C。 51%攻擊。 51%的攻擊發生在一個實體或協調組控制區塊鏈網路中的大部分開採、驗證或計算能力時。以多數的控制，攻擊者可以影響區塊的建立、重組最近的區塊、倒置交易和雙重支出。 符合 CEH 的區塊鏈材料解釋道，區塊鏈依賴於分散式驗證，超過半數的參與系統必須在區塊被接受入鏈前達成一致。 設想方案表示，一個單一的協調實體控制了佔優勢的計算功率並使用該影響來用替代版本來取代確認的交易，這是 51%攻擊的核心行為。選項 A。 Eclipse Attack 是不正確的，因為日食攻擊將受害者節點從誠實的網路中隔離出，並控制它所看到的資訊。選項 B。 Finney Attack 是不正確的，因為 Finney 攻擊是一種涉及被事先排除的塊的特定雙衝程技術，通常由礦工進行，但情節強調多數控制驗證功率。選項 D。 DeFi Sandwich Tattack 是不正確的，因為三明治攻擊涉及交易訂購/front-繞行受害者交易，而不是透過多數雜湊電源來阻礙重組。選項 C。 51% 攻擊是正確的，因為對塊建立的過度控制使得交易倒轉和雙重支出成為可能。因此，最好的答案是 C。 51%的攻擊。","s":"term"},{"n":212,"c":"密碼學","ce":"Cryptography","t":"long","q":"The company ABC recently contracts a new accountant. The accountant will be working with the financial statements. Those financial statements need to be approved by the CFO and then they will be sent to the accountant but the CFO is worried because he wants to be sure that the information sent to the accountant was not modified once he approved it. Which of the following options can be useful to ensure the integrity of the data?","o":["The document can be sent to the accountant using an exclusive USB for that document","The CFO can use an excel file with a password","The financial statements can be sent twice, one by email and the other delivered in USB and the accountant can compare both to be sure is the same document","The CFO can use a hash algorithm in the document once he approved the financial statements"],"a":[3],"e":"正確答案是 D。 雜湊演算法用於驗證資料完整性，這意味著確認資訊在批准或傳輸後沒有更改。一旦 CFO 批准財務報表，就可以使用 SHA-256 等演算法為檔案生成雜湊值。以後，會計師可以再次計算雜湊並把它與原雜湊相比較。如果兩者的雜湊值相匹配，則檔案沒有被修改。 如果甚至有一個字元，數字，或位元組變化，產生的雜湊會有所不同。選項 A 只控制送出介質，而不證明檔案沒有變化。 選項 B 提供密碼保護，這更涉及存取控制或保密，而不是強完整性驗證。 選項C 給出了冗餘，但兩種副本仍然可以被更改或處理不當。在 CEH 密碼學概念中，雜湊與完整性驗證特別相關，而加密保護保密並提供數位簽章的完整性，認證，以及不否定。 因此，使用雜湊演算法是最合適的答案。"},{"n":213,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"After a breach, investigators discover attackers used modified legitimate system utilities and a Windows service to persist undetected and harvest credentials. What key step would best protect against similar future attacks?","o":["Disable unused ports and restrict outbound firewall traffic","Perform weekly backups and store them off-site","Ensure antivirus and firewall software are up to date","Monitor file hashes of critical executables for unauthorized changes"],"a":[3],"e":"CEH 材料將這種攻擊模式描述為\"Living-off-the-Land (LotL)\"，攻擊者使用合法工具來逃避被偵測。 由於這些二進位通常都值得信任，傳統的防毒解決方案可能不會標出它們。 CEH 推薦檔案完整性監測(FIM)，它追蹤敏感可執行檔案的密碼雜湊，並在發生未經授權的修改時提醒管理員。選項 D 是正確的。備選方案 A 和 B 支援復原力，但不能偵測篡改。僅靠選項 C 不足以對付 LotL 的攻擊。"},{"n":214,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"mid","q":"You are Sameer Das, an ethical hacker hired by a national utilities provider to assess the resilience of its
