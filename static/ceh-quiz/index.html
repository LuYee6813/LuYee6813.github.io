},{"n":742,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"During a security assessment of a metropolitan public transportation terminal, a penetration tester examines a network-connected IoT surveillance camera system used for 24/7 video monitoring. The camera uses outdated SSLv2 encryption to transmit video data. The tester intercepts and decrypts video streams due to the weak encryption and absence of authentication mechanisms. What IoT vulnerability is most likely being exploited in this scenario?","o":["Insecure data transfer and storage","Jamming attack on RF communication","Credential theft via web application","Replay attack on wireless signals"],"a":[0],"e":"CEH 將不安全的資料傳輸確定為關鍵的 IoT 弱點。 過時的加密協定如 SSLv2 無法保護機密性或完整性。 沒有強大的加密和認證，攻擊者可以攔截，解密，並操縱影片種子。","s":"term"},{"n":743,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a UDP service enumeration scan, the tester sees that some ports respond with ICMP Type 3 Code 3 (Port Unreachable), while most remain silent. No firewall or IDS is interfering. What can the tester conclude about the non-responsive ports?","o":["The ports are likely closed because no ICMP response was received.","The system blocked all probes after rate-limiting was detected.","They may be open or filtered, requiring retransmission.","They may correspond to some services requiring three-way handshakes."],"a":[2],"e":"UDP 掃描只有在返回了 ICMP 連接埠無法到達時才會產生可靠的\"關閉\"結果。 靜態反應表示開放的埠(沒有預期回覆)或過濾的埠(塊滴出封包)。 CEH 強調不回應需要再傳輸或替代的驗證技術。"},{"n":744,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"What is the purpose of banner grabbing?","o":["Sniffing","Cracking","Identification","Exploitation"],"a":[2],"e":"正確答案是 C， 因為抓取橫幅用於偵察， 掃描， 和列舉 期間的識別。 當連線到一個開口的連接埠時， 抓取橫幅會蒐集服務返回的資訊。 這個橫幅可能披露應用程式名稱，服務型別，作業系統，軟體版本，web 伺服器細節，郵件伺服器細節，或 firmware/vendor 資訊。 CEH 掃描方法將橫幅抓取和 OS 指紋與識別作業系統和執行在目標機上的服務聯絡起來。該材料還定義了抓取橫幅的列舉技術，用於提供電腦系統資訊，一般用於作業系統識別或指紋，不是嗅探，因為嗅探捕獲網路流量，不是破解，因為破解試圖破解密碼或保護，也不是被利用，儘管發現的資訊日後可能有助於選擇開發。 因此，搶取旗標的主要目的是識別身分。","s":"term"},{"n":745,"c":"社交工程","ce":"Social Engineering","t":"short","q":"Which social engineering attack involves impersonating a co-worker or authority figure to extract confidential information?","o":["Phishing","Pretexting","Quid pro quo","Baiting"],"a":[1],"e":"在 CEH v13 社交工程中將預發定義為攻擊者編造出一個可信賴的情境並冒充一個被信任的個人來取得敏感資訊的攻擊。這與釣魚(大眾資訊)、誘餌(惡意鼓勵)和對等(交換恩惠)不同。","s":"term"},{"n":746,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"A penetration tester is conducting a security assessment for a client and needs to capture sensitive information transmitted across multiple VLANs without being detected by the organization ' s security monitoring systems. The network employs strict VLAN segmentation and port security measures. Which advanced sniffing technique should the tester use to discreetly intercept and analyze traffic across all VLANs?","o":["Deploy a rogue DHCP server to redirect network traffic","Exploit a VLAN hopping vulnerability to access multiple VLANs","Implement switch port mirroring on all VLANs","Use ARP poisoning to perform a man-in-the-middle attack"],"a":[1],"e":"VLAN 跳躍攻擊是一種在 CEH 材料中描述的高階攻擊技術，它透過利用交換器的錯設定或弱點來繞過 VLAN 的分化。 兩種主要方法-交換器欺騙和雙標記-允許攻擊者從 VLAN 取得流量權限，他們沒有被授權檢視。 這個技術可以捕捉到 VLAN之間的流量，而不需要行政特權或觸發安全工具。 連接埠映象需要行政控制而並非攻擊方法。 Rogue DHCP 伺服器目標為 IP 任務，不是 VLAN 分割槽。 ARP 欺騙僅在一個單個廣播域內有效，不能穿行 VLAN 邊界。 由於目標是儘管強制分出，但仍能默取多個 VLAN，因此 VLAN 跳躍攻擊是 CEH 網路周邊攻擊方法中正確的技術。"},{"n":747,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"During an authorized cloud security assessment for an e-commerce company based in Seattle, Washington, a certified ethical hacker gains temporary programmatic access to the organization's cloud account. The tester focuses on identifying permission boundaries by querying the account to determine which identity entities are associated with attached policies and what level of access those identities possess across cloud resources. The objective is to understand privilege relationships before attempting any further controlled actions. Which cloud reconnaissance activity best aligns with this effort?","o":["Enumerating IAM Roles","Enumerating S3 Buckets","Enumerating EC2 Instances","Enumerating Serverless Resources"],"a":[0],"e":"正確答案是 A。 假設 IAM 角色。該情境描述了一個正在檢查身分實體、相關政策、許可界限和跨雲資源存取水平的測試者。這些都是身分和存取管理的職能。(IAM)。 在 CEH 雲安全背景下，雲安全管理包括治理，風險管理和合規(GRC)，身分和存取管理(IAM)，以及修補程式和設定管理，用於控制對雲資源的安全存取。假設 IAM 角色是最佳匹配， 因為 IAM 角色定義了身分可以做什麼， 附加哪些政策， 以及可以假設或行使哪些特權。 雲評估參考文獻還列出了 IAM 檢查， 例如使用 aws iam 清單使用者和 aws iam 清單函式識別 IAM 使用者和角色， 以及使用 aws iam 取得策略審查權限。選項 B。假設 S3 Buckets 是不正確的， 因為 S3 列舉 專注於儲存桶， 權限在桶上， 公共曝光， 加密 和記錄。 它主要不識別身分- 政策關係。選項 C。 假設 EC2 例項是不正確的， 因為 EC2 列舉 專注於虛擬機器、 例項後設資料、 AMIs、 區域、安全組和執行計算資源。它沒有直接對映到查詢身分實體和附加政策。選項 D。 假設伺服器無源資源是不正確的，因為沒有伺服器的列舉專注於函式，觸發器，事件源，和執行設定。 雖然沒有伺服器的函式可能使用角色，但問題的主要焦點是身分實體及其權限，這使得 IAM 角色列舉成為最準確的答案。因此，最好的答案是 A。 假設 IAM 角色。","s":"term"},{"n":748,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"A fintech startup in Austin, Texas deploys several virtual machines within a public cloud environment. During an authorized cloud security assessment, a tester uploads a small script to one of the instances through a web application vulnerability. After executing the script locally on the instance, the tester retrieves temporary access credentials associated with the instance ' s assigned role. These credentials are then used to enumerate storage resources and access additional cloud services within the same account. Which cloud attack technique best corresponds to this activity?","o":["Cloud Snooper Attack","Wrapping Attack","IMDS Attack","CP DoS Attack"],"a":[2],"e":"正確答案是 IMDS Attack.CEH 雲安全材料解釋雲事件經常從一個通常被稱作 IMDS 的\"例項後設資料服務\"獲得臨時的認證資訊，它為虛擬機器執行的工作量提供身分和角色存取細節。 如果攻擊者透過一個單獨的 Web 應用程式缺陷在例項上獲得程式碼執行，則攻擊者可以在當地查詢後設資料端點，並擷取與例項角色相關的臨時認證資訊。這正是這種情況:測試者在 VM 上執行一個指令碼，擷取臨時角色認證資訊，然後用它們來列舉同一雲帳戶內的儲存和其他服務。 包接攻擊目標為SOAP 訊息操縱，而云斯諾珀和 CPDoS 則與從本機雲後設資料取得認證資訊角色的行為不相匹配。 CEH 強調，過度特權的例項角色和被曝光的後設資料存取可以讓攻擊者從單一的受損工作量中選擇更廣泛的雲服務存取。 由於關鍵步驟是從例項後設資料服務中擷取到臨時的認證資訊，所以最好的匹配是 IMDS Attack。","s":"term"},{"n":749,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"During a strategic security briefing at Meridian Global Analytics in Washington, D.C., executives review a series of coordinated activities targeting national infrastructure. These activities include manipulating digital media to influence public perception, disrupting communication networks, and degrading critical systems to weaken institutional stability without direct conventional military engagement. What form of conflict best describes this type of coordinated activity?","o":["Cyber Espionage","Information Warfare","Hacktivism","Cyberterrorism"],"a":[1],"e":"正確答案是 B。 Information Warfare。該情境描述了資訊、通訊系統、數字影響力的戰略使用，以及關鍵系統被破壞以獲得比對手更有利的條件。 這與資訊戰爭是一致的。 符合 CEH 材料將資訊戰定義為使用資訊和通訊技術它還解釋說，進攻性資訊戰透過影響機密性、完整性和可用性，防止、改變或破壞資訊和基於資訊的程序。選項 A。 網路間諜是不正確的，因為間諜活動主要側重於竊取資訊，而不是廣泛操縱認知和有辱人格的基礎設施。選項 C。 駭客主義是不正確的，因為駭客主義通常是在意識形態上或出於政治動機，使用駭客技術進行活動。選項 D。 網路恐怖主義是不正確的，因為網路恐怖主義是為了製造恐懼、恐慌或暴力，以達到政治或意識形態的目的。 資訊和通訊能力的更廣泛協調使用最好被歸類為資訊戰。因此，最好的答案是 B。 Information Warfare。","s":"term"},{"n":750,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"During a red team exercise at Orion Tech Systems in San Jose, ethical hacker Nadia creates a campaign of fraudulent messages targeting employees. She uses compromised social media accounts to distribute bulk invitations that contain links to a fake cloud collaboration site. Several employees click the links and are prompted to log in with their corporate credentials, which Nadia captures. Although the lure appears to be a professional networking opportunity, the tactic relies on unsolicited deceptive messages delivered at scale. Which social engineering threat is Nadia simulating in this campaign?","o":["Catfishing","Angler Phishing","Spam and Phishing","Involuntary Data Leakage"],"a":[2],"e":"正確答案是 C.Spam 和 Phishing，因為這場運動是基於大量傳送的未經請求的欺騙性資訊，目的是引誘許多接收者點選連結，並在一個假網站上提交認證資訊。 在符合 CEH 社交工程概念中，打網球是一種欺騙技術，用來以冒充一個受信任的實體來欺騙使用者洩露敏感資訊(如公司使用者名稱和密碼等)或提出令人信服的藉口。 當使用大眾通訊-- 通常是透過電子郵件、通訊平台或社交媒體-- 來進行\"規模化的\"釣魚時， 它與垃圾郵件有強烈的相重疊， 指的是向大量目標分發的未經請求的散裝通訊。劇情包含經典的打字流:欺詐性邀請包含一個與假冒\"雲合作\"登入頁面的連結，並促使使用者認證。 認證資訊 captal (\"Nadia captals\")證實目標為認證資訊收割，而不只是意識干擾。 她使用\"妥協的社交媒體帳戶\"的細節與現代的打字操作是一致的，即濫用可信賴的帳戶來提高可信度並繞過最初的懷疑。 這也幫助了攻擊者逃避一些基本的過濾，並鼓勵受害者相信這個訊息，因為這個訊息似乎來自一個合法的外貌。為何其他選擇不太正確:Catfishing 通常涉及建立假人物(Catfishing)，並隨著時間的推移(通常是一對一)保持關係來操縱被害者；它主要不是由批次的無請求訊息來定義。 Angler fishing 特指透過社交媒體渠道進行的 fishing，經常是冒充客戶支援或劫持品牌互動。雖然這裡的平台是社交媒體，但問題最強烈的歧視者是\"規模化地傳送的不主動欺騙性資訊\"，這說明威脅類的垃圾郵件和打網打網，而不是更具體的\"糾纏\"支援-假冒模式。 非自願資料外洩描述了資訊的意外曝光，而不是主動欺騙。因此，娜迪婭的活動最明顯地模擬了垃圾郵件和打網球。","s":"term"},{"n":751,"c":"社交工程","ce":"Social Engineering","t":"short","q":"Kevin and his friends are going through a local IT firm ' s garbage. Which of the following best describes this activity?","o":["Intelligence gathering","Reconnaissance","Dumpster diving","Social engineering"],"a":[2],"e":"正確答案是 C，因為所描述的活動被特地稱為\"垃圾桶搜尋\"。 在 CEH 社交工程和偵察概念中，垃圾桶搜尋是指透過一個組織的被丟棄的材料來搜尋以取得敏感或有用的資訊。 攻擊者可能尋找印刷的檔案，網路圖，員工名單，發票，貼上筆記，密碼提醒，硬體標籤，舊儲存介質，或者顯示目標環境細節的其他物品。 儘管這一活動可以支援情報蒐集和偵察，但這些術語是更廣泛的階段或目標。 社交工程也是一個更廣泛的類別，包括操縱人或利用人類行為，而垃圾桶搜尋通常被作為該領域的一種技術對待。 問題在於，什麼才是透過公司垃圾進行準確活動的最佳方式，因此最精確的選擇是垃圾桶搜尋。各組織透過強制實施安全處置做法來降低這一風險，如粉碎檔案、淨化媒體、鎖住垃圾區以及培訓員工處理資訊。","s":"term"},{"n":752,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"A competing technology firm begins releasing products that closely mirror the design, pricing strategy, and feature roadmap of ApexDynamics Inc. An internal review reveals that detailed information about ApexDynamics' upcoming initiatives had been gradually collected through publicly available sources and external disclosures before product launch. Which footprinting-related threat does this scenario best represent?","o":["Social Engineering","Information Leakage","Business Loss","Corporate Espionage"],"a":[3],"e":"正確答案是 D。 公司間諜這一情境描述了一個競爭者蒐集了有關 ApexDynamics 未來產品、定價策略及路由圖的資訊，然後滲透這些資訊釋放出類似的產品。這與企業間諜活動是吻合的，因為企業敏感資訊是用來蒐集並獲得競爭優勢的。CEH 偵察和足跡材料解釋說，競爭情報涉及蒐集關於競爭對手的產品、客戶和營銷的資訊，而且其中許多資訊可以透過公共渠道隨時取得。 它還指出，各組織可能無意中透過網站等公共資訊來源披露當前和未來的計劃、目錄資訊和技術細節。商業資訊儲存庫選項 A。 社交工程是不正確的，因為該情境沒有描述操縱人來披露資訊。備選辦法 B。 資訊洩漏是相關的，但範圍更廣，指的是敏感資訊的意外暴露，設想方案的關鍵影響是競爭者利用所蒐集的資訊反映業務戰略和產品方向。備選 C。 商業損失是活動可能產生的結果，但並非所述與足跡相關的具體威脅。選項 D。 公司間諜行為是正確的，因為競爭者利用蒐集的商業情報復制或預測 ApexDynamics 的市場策略。因此，最好的答案是 D。 公司間諜。","s":"term"},{"n":753,"c":"密碼學","ce":"Cryptography","t":"mid","q":"A future-focused security audit discusses risks where attackers collect encrypted data today, anticipating they will be able to decrypt it later using quantum computers. What is this threat commonly known as?","o":["Saving data today for future quantum decryption","Breaking RSA using quantum algorithms","Flipping qubit values to corrupt output","Replaying intercepted quantum messages"],"a":[0],"e":"經認證的道德駭客 (CEH)密碼學和量子計算部分引入了被稱作\"Harvest Now， Decrypt Later\"的概念。 這個威脅模型描述對手今天捕獲加密資料，即使他們不能立即解密，但期望未來的量子電腦能夠破解當前安全的公開金鑰演算法，如 RSA和 ECC。選項 A 準確地反映了這一概念。選項 B 描述了一種方法(Shor's 演算法)，但不描述威脅模型本身。選項 C 與密碼學攻擊無關。選項 D 指的是量子通訊攻擊，而不是古典加密的資料採集。 CEH 強調後量子密碼學作為緩解策略。","s":"term"},{"n":754,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"A government agency trains a group of cybersecurity experts to carry out covert cyber missions against foreign threats and gather intelligence without being detected. These experts work exclusively for national interests. What classification best describes them?","o":["Organized hackers","State-sponsored hackers","Hacktivists","Gray hat hackers"],"a":[1],"e":"CEH 課程軟體根據意圖、授權和隸屬關係對駭客進行分類。 國家支援的駭客被定義為代表政府開展網路行動的個人或團隊，以推進國家利益。 這些行動通常包括間諜活動，網路戰，情報蒐集，以及秘密的進攻行動。 不同於有組織的駭客或網路犯罪集團。 CEH 材料解釋說，這些團體在運作時可以使用先進的工具、長期資金和機密情報，從而能夠針對外國政府、公司或關鍵基礎設施實施高度複雜和隱蔽的行動。 駭客們追求政治或社會事業，而灰帽子駭客卻在未經明確許可、但又沒有惡意的情況下行動。 只有國家贊助的駭客們才符合網路專家接受正式培訓、獲得資源和國家政府授權開展仍未被察覺的行動的情境。 因此，正確的分類是國家贊助的駭客。","s":"term"},{"n":755,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"A penetration tester completes a vulnerability scan showing multiple low-risk findings and one high-risk vulnerability tied to outdated server software. What should the tester prioritize as the next step?","o":["Perform a brute-force attack on the server to gain access","Ignore the high-risk vulnerability and proceed with testing other systems","Focus on exploiting the low-risk vulnerabilities first","Verify if the high-risk vulnerability is exploitable by checking for known exploits"],"a":[3],"e":"CEH 方法強調根據風險、可開發性和商業影響確定優先次序。 高度弱點--特別是那些與過時或不支援的伺服器軟體有關的弱點--往往與已知的、公開記錄的弱點利用有關。 CEH 強調，開採嘗試必須是由證據驅動的，而不是任意的，並側重於高風險弱點，使測試者能夠展示有意義的安全影響。 殘酷的強制(備選 A)是不必要的，而且噪音很大。 忽略高風險發現或將高風險發現(備選方案 B 和 C)置於優先位置與 CEH 基於風險的評估原則相矛盾，因此，核實高風險弱點的可開發性是正確的步驟。"},{"n":756,"c":"密碼學","ce":"Cryptography","t":"short","q":"Although FTP traffic is not encrypted by default, which Layer 3 protocol would allow for end-to-end encryption of the connection?","o":["FTPS","SFTP","SSL","IPsec"],"a":[3],"e":"正確答案是 D。 IPsec( Internet 協定 Security)。 這個問題特別要求一個能為 FTP 流量提供端到端加密的地層。 IPsec 在OSI 模型的網路層(Layer 3)執行，並透過提供保密，完整性，認證，和反重放保護來保障 IP 通訊。由於標準 FTP 在明文中傳輸使用者名稱，密碼，和資料，因此很容易被封包嗅探和中間人攻擊。 透過實施 IPsec，無論使用何種應用程式，使用者端和伺服器之間交換的所有 IP 封包都可以被加密。 這意味著 FTP 流量可以在不修改 FTP 應用程式本身的情況下受到保護。選項 A(FTPS)使用 SSL/TLS 來保障 FTP 選項 B (SFTP) 是執行於 SSH 的安全檔案傳輸 協定 並且被認為是一個應用層溶液，而不是一個 第 3 協定層。 選項 C (SSL) 提供了 transport/工作階段-layer 加密 而非 第 3 協定層。 CEH 應試提示:IPsec = 第 3 層(網路層) 加密 SSL/TLS = 較高層加密 SFTP = SSH 基於安全檔案傳輸 FTPS = FTP 超過 SSL/TLS；因此，最好的答案是 D。 IPsec。","s":"term"},{"n":757,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During a red team engagement at a healthcare provider in Miami, ethical hacker Rachel suspects that a compromised workstation is running a sniffer in promiscuous mode. To confirm her suspicion, she sends specially crafted ICMP packets with a mismatched MAC address but a correct IP destination. Minutes later, the suspected machine responds to the probe even though ordinary systems would ignore it. Which detection technique is Rachel most likely using to validate the presence of a sniffer?","o":["Ping Method","ARP Method","DNS Method","Nmap sniffer-detect (NSE)"],"a":[0],"e":"瑞秋正在使用平平方法進行嗅探偵測。在情境中，區分的行為是她傳送了所編織的 ICMP 回聲請求(平分)，因此第 2 層MAC 位址是不正確的；而第/mismatched 號請求則不正確。第 3 層 IP 目的地是正確的。 在正常情況下，主機的網路介面卡(NIC)應該放下不是發到其 MAC 位址的訊框。 然而，當將 NIC 設定為亂髮模式(封包嗅探器通常需要)時，它可以接受訊框，而不管目的地為 MAC，並傳遞到堆疊上。 如果作業系統然後處理封裝的 IP 封包並回復(例如傳送 ICMP 回聲回放)，該回復表明主機正在接受訊框，通常會忽略--一個與多期模式嗅探一致的指標。這種技術被用做一個 heuristic:透過故意違反正常乙太網送貨規則並觀察目標是否仍然回應，你可以推斷介面可能是捕捉到沒有明確針對它的流量。 它不完美--現代驅動，交換器，VLAN 設定，和主機防火牆行為可以影響結果--但情境下的\"密接了 MAC，但正確了 IP\"外加\"疑似機應答\"是以平時為基調的\"雜交-模\"測試的經典簽名。為何其他選項不合適 :ARP 方法(B)通常涉及以 ARP 為基礎的花招(非廣播ARP 請求或被精心設計出 ARP 流量)來測試目標如何回應；情節明確描述 ICMP 行為。 DNS 方法(C)與 DNS 查詢/resolution 行為有關，與 ICMP/MAC 不匹配測試。 Nmap 嗅探-探測(NSE)(D)是一種具體的指令碼方法，但問題詢問了正在使用的基本技術；所描述的動作與平法相匹配。因此，正確答案是 A.平法。","s":"term"},{"n":758,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"A red team operator wants to obtain credentials from a Windows machine without touching LSASS memory due to security controls and Credential Guard. They use SSPI to generate NetNTLM responses in the logged- in user context and collect those responses for offline cracking. Which attack technique is being used?","o":["Internal Monologue attack technique executed through OS authentication protocol manipulations","Replay attack attempt by reusing captured authentication traffic sequences","Hash injection approach using credential hashes for authentication purposes","Pass-the-ticket attack method involving forged tickets for network access"],"a":[0],"e":"CEH v13 討論了各種認證資訊擷取和認證濫用技術，包括由於認證資訊 Guard 等現代保護而避免了 LSASS 記憶體的方法。內部單曲技術是一種專門的認證資訊收割方法，它利用 WindowsSSPI 認證堆來強迫本機系統生成 NetNTLM 挑戰-回應雜湊而不需要直接存取 LSASS。 這使得攻擊者完全在使用者的安全範圍內獲得合法的 NTLM 回應，然後使用 Hashcat 等工具可以解開這些被捕獲的回應。不同於重放攻擊(可選 B)，\"內部單曲\"(Internal Monogue)不是關於重用被捕獲的流量。Hash 注入(可選 C)需要擁有 NT 散曲並修改認證符，這在此不發生。 Pass-the-trops (可選 D) 目標為克貝羅斯，不是NTLM。 因此，正確的技術是\"內部單曲\"攻擊。"},{"n":759,"c":"雲端運算","ce":"Cloud Computing","t":"long","q":"A multinational healthcare provider headquartered in Boston, Massachusetts relies on federated authentication to allow employees to access multiple cloud-hosted applications using a single sign-on portal. During an authorized red team engagement, a security consultant gains access to the organization's identity infrastructure and extracts signing material used in trust relationships between the internal identity provider and external cloud services. Using this material, the consultant generates authentication responses that grant administrative-level access to several cloud applications without interacting with user credentials or triggering multifactor authentication challenges. The access appears legitimate within the cloud service logs. Which cloud attack technique best aligns with this behavior?","o":["Golden SAML Attack","Living off the Cloud (LotC) Attack","Cloud Hopper Attack","Man-in-the-Cloud (MITC) Attack"],"a":[0],"e":"正確答案是 A。 Golden SAML 攻擊。 Golden SAML 攻擊發生在攻擊者獲得身分提供者使用的私人簽名材料後，然後偽造有效的 SAML 認證斷言。由於偽造的斷言是與可信賴的材料簽署的，雲服務供應商可以把它們視為合法的認證回應。該情境明確規定，顧問擷取了內部身分提供者和雲服務之間的信任關係中使用的簽名材料，然後生成認證回覆，允許雲應用存取，沒有密碼或 MFA。 這是 Golden SAML 攻擊的下定義行為。 符合 CEH 的雲安全材料將雲帳戶劫持和不安全的雲認證路徑確定為主要關注事項，特別是在雲服務依賴於認證，授權，以及 API 信任關係的情況下。 Golden SAML 技術特別濫用了聯邦認證信任，而不是盜取一個普通使用者密碼。選項 B。 Living off the Cloud(LotC) Attack 是不正確的，因為LotC 涉及濫用合法的雲原生化服務和工具來進行攻擊者操作，同時混合到正常的雲活中去，它沒有具體描述 frainSAML認證斷言。選項 C。 Cloud Hopper Attack 是不正確的，因為 Cloud Hopper 指的是針對被管理的服務提供商或雲服務供應商的攻擊，以達到下游客戶。選項 D。 Man-in-the-Cloud (MITC) 攻擊是不正確的，因為 MITC 通常會濫用同步符或雲同步機制，而不是身分提供者簽名金鑰。因此，最好的答案是 A。 Golden SAML 攻擊。","s":"term"},{"n":760,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"You are an ethical hacker at RedOak Cyber Solutions, contracted to perform a penetration test for MetroHealth Hospital in Cleveland, Ohio. While assessing the hospital ' s appointment booking portal, you craft and submit multiple malicious inputs into the patient search field. One of your payloads successfully manipulates the backend query, returning additional appointment data that was not intended to be displayed. Based on the observed behavior, which step of the SQL injection methodology are you performing?","o":["Identifying Data Entry Paths","Launching SQL Injection Attacks","Database Enumeration","Information Gathering and Vulnerability Detection"],"a":[1],"e":"正確答案是 B。 發射 SQL 注入攻擊，因為情境描述的不僅僅是定位輸入或偵測出錯誤行為，而是積極傳送注入有效酬載，成功改變查詢邏輯並改變返回的結果。 在典型的符合 CEHSQL 注入工作流程中，測試者首先識別使用者控制的輸入輸入進入應用程式的地方(形式，URL 參數，cookie，標頭)，然後進行基本測試來偵測輸入是否影響後端 SQL 處理。 發現疑似注入點後，下一步是啟動 SQL 注入嘗試，使用設計來操縱查詢並顯示影響。在這種情況下，你\"操作並提交多份惡意輸入\"，一個酬載\"成功操控後端查詢\"，導致應用程式返回\"原本不打算顯示的額外預約資料\"，這一結果清楚地表明瞭弱點利用正在進行:注入不是假設--它正在執行，並且以揭示未經授權的資料的方式改變應用程式的行為。 這是特性是執行SQL 注入 攻擊( 帶內開發)， 例如使用布林邏輯操縱( 如擴充套件結果集的條件) 或其他查詢更改技術。 重點是成功的操縱和未經授權的資料曝光， 這與攻擊執行階段相一致。為什麼其他選項不太正確: 識別資料條目路徑會更早， 當你將患者搜尋域定位為候選參數時。 資訊蒐集和弱點偵測一般是指發現並證實存在弱點(通常透過初始探測，出錯或異常反應)，而不是已經確認的已經返回未經授權資料的酬載。 資料庫列舉通常是在開發確認後的後續步驟，測試者在此擷取後設資料等。資料庫 名稱、 表格、 列、 使用者和版本。 您在此顯示注入能夠取得額外的記錄， 即開發/attack-launch 階段， 尚未完整列舉。因此，正在採取的步驟是發動 SQL 注入攻擊。"},{"n":761,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"Why is using Google Hacking justified during passive footprinting?","o":["Identifying weaknesses in website source code","Locating phishing sites mimicking the organization","Mapping internal network structures","Discovering hidden organizational data indexed by search engines"],"a":[3],"e":"Google Hacking 又名 Google Dorking，是一種被 CEH v13 偵察技術所覆蓋的被動偵察技術，它涉及使用高階搜尋操作員來發現被搜尋引擎無意中索引的敏感資訊。 CEH v13 解釋道，Google Hacking 可以揭示已曝光的檔案，目錄，設定檔，備份，登入入口網站，出錯訊息，以及敏感的檔案等，這些資訊經常停留在\"深網\"上，這意味著它不是透過正常瀏覽而容易取得的，但仍被搜尋引擎索引。選項 D 正確反映了這一能力。 Google Hacking 不直接分析原始碼(選項 A)，地圖內部網路(選項 C)，或主要偵測釣魚站點(選項 B)，儘管它可能間接地幫助完成這些任務。由於 Google Hacking 只依靠公開的資料，並不直接與目標系統互動，它完全適合被動足跡，因此在授權時在法律上和道德上都是適當的。 CEH v13 強調谷歌駭客是識別出意料的資料曝光的有力方法，因此，選項 D 是正確的理由。"},{"n":762,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"short","q":"Which advanced mobile hacking technique is the hardest to detect and mitigate in a healthcare environment?","o":["Zero-day mobile exploits","App spoofing","Bluejacking","Side-channel attacks"],"a":[0],"e":"零時差開發被認為是 CEH v13 移動平台駭客中最危險的移動攻擊向量，這些開發利用了以前未知的弱點，意味著在攻擊時不存在修補程式，簽名，或防禦。在醫療保健環境中，移動裝置存取敏感的 EHR 系統，並在嚴格的合規要求下執行。零時差的開發可以完全繞過移動 OS 安全，沙盒和防毒控制。 App 欺騙和\"藍芽\"透過使用者意識和\"藍芽\"控制更方便地偵測和緩解。 側道攻擊在企業移動環境中是高度專業化和罕見的。 CEH v13 強調，零時差攻擊由於缺乏偵測機制而構成最大風險，使得\"選項 A\"正確。","s":"term"},{"n":763,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"short","q":"A WPA2-PSK wireless network is tested. Which method would allow identification of a key vulnerability?","o":["De-authentication attack to capture the four-way handshake","MITM to steal the PSK directly","Jamming to force PSK disclosure","Rogue AP revealing PSK"],"a":[0],"e":"CEH v13 表示，攻擊 WPA2-PSK 的唯一可行方法是捕捉出四向握手。 De-認證用戶端迫使重新連線，讓握手被捕獲並被後被斷開。 MITM，干擾，和無賴 AP 攻擊並不能直接暴露出 PSK。"},{"n":764,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"What is sandbox evasion?","o":["Malware hiding","Firewall bypass","Encryption","IDS bypass"],"a":[0],"e":"正確答案是 A， Malware 隱藏。 在 CEH 惡意軟體分析概念中，沙箱是一個被控制和孤立的環境，用於執行可疑檔案並安全地觀察其行為。 CEH 相關的材料解釋，動態或行為 惡意軟體分析是透過在沙箱環境中執行惡意軟體來實現的，允許分析員觀察程序，網路連線，檔案更改等惡意行為。沙箱逃逸發生於惡意軟體試圖識別它在分析環境中執行，然後隱藏，延遲，或禁用其惡意行為。 CEH 相關內容指出，高階惡意應用程式可能被設計為繞過沙箱技術，通常使用零散程式碼或睡眠計時器來躲避檢查過程。 這使得惡意軟體在分析過程中顯得無害。防火牆繞行和 IDS 繞行都是網路或偵測控制逃逸技術，而加密只是一種可能的模糊方法。 因此，沙箱逃逸最好被描述為惡意軟體隱藏。","s":"term"},{"n":765,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and loT Hacking","t":"mid","q":"Maya Patel from SecureHorizon Consulting is investigating a breach at Dallas General Hospital in Texas after a nurse misplaced a smartphone containing patient management software. Although the device remained active on the network, administrators had no way to identify its physical whereabouts, delaying incident response and allowing sensitive medical records to be exposed for hours. Which mobile security guideline would have most directly reduced the impact of this incident?","o":["Use anti-virus and data loss prevention (DLP) solutions","Utilize a secure VPN connection while accessing public Wi-Fi networks","Install device tracking software that allows the device to be located remotely","Register devices with a remote locate and wipe facility"],"a":[3],"e":"最直接的準則是 D。 具有遠端定位和擦拭設施的登記裝置，因為事件的核心影響來自兩個因素:裝置失去實際控制，以及裝置仍在活動時繼續暴露敏感記錄。 遠端定位和移動能力(通常透過移動裝置管理(MDM)/企業移動管理(EMM)平台提供)立即解決了這兩個問題:它使管理員能夠識別裝置最後已知位置(或觸發位置報告)，並且關鍵是遠端鎖定或擦拭裝置來防止不斷未經授權地存取患者資料。在處理受管制資料的保健環境中，失竊事件期間的優先權是快速封存。即使裝置追蹤能夠幫助找到電話，它也不能保證敏感。資訊在搜尋過程中停止存取。 遠端擦拭(通常與遠端鎖定對接，被執行的加密，以及基於策略的存取控制)透過允許回應者去除被保護的資料並取消應用程式的存取來減少曝光時間。 這在裝置仍被連線到網路時尤為重要，因為攻擊者(或未經授權的持有者)可以繼續使用被快取的工作階段，被儲存的符號，或者本機可用的記錄，直到存取被切斷。其它選項為何不那麼直接: A(防毒/DLP)可能有助於偵測惡意軟體或控制資料移動，但並不能解決即時的丟失裝置封存要求。 B(公用 Wi-Fi 上的 VPN)無關，因為問題是物理損失和無法控制端點。 C(安裝追蹤軟體)幫助定位裝置，但情境凸顯出敏感記錄被曝光了數小時；當組織透過一個註冊的，集中管理的能力，既可以定位又可以擦去/lock 裝置時，最直接的影響被實現。因此，將裝置裝入遠端定位和擦拭設施將最直接地減少破損影響。"},{"n":766,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at a telecom provider in Denver, Colorado, Maria, a senior ethical hacker, notices that her scans are immediately flagged by intrusion detection systems. She modifies her technique, and as a result, the IDS devices are unable to reassemble the packets correctly, allowing her probes to slip through without detection. Which scanning evasion technique is Maria applying in this case?","o":["Packet Fragmentation","Source Routing","Decoy Scanning","IP Spoofing"],"a":[0],"e":"被描述的逃逸依賴於防止 IDS 正確重組封包，直接指向封包分解。 在以分解為主的逃逸中，攻擊者將探測器酬載分解為多個 IP 分解。有些 IDS 感測器--特別是如果設定不當、超載或使用有限的再組合邏輯--可能無法完全重建出原來的封包流，導致惡意或可疑內容逃避簽名匹配和偵測。同時，目標主機(或下游裝置)可能正確地重新組裝碎片並正常處理探測器。目標最終得到的是逃散的核心概念。劇情明確規定\"IDS 裝置無法正確重新組裝出封包\"，這實質上是作為 IDS 逃生方法而分解的教科書理由。 攻擊者可能會使碎片大小，相重疊的碎片，或者操縱抵消來壓力或混淆重組引擎。 即使現代的 IDS系統支援再組裝，如果感測器面臨資源壓力，或者流量正常化沒有強制實施，碎片化仍然可以用來降低探測可靠性。為何其他選項不匹配 :源路由 (B) 試圖透過網路來影響封包所取路徑；它從本質上不會阻止 IDS 重組。誘餌掃描(C) 淹沒目標/IDS， 並用多個偽造的位址的掃描來遮蔽真正的掃描源。 這是關於歸屬噪音， 而不是封包重灌失敗。 IP 欺騙(D)用於掃描可以偽裝出出出產地，但從本質上說它不會引起 IDS 重組出問題。因此，瑪麗亞正在應用 A.封包分解。","s":"term"},{"n":767,"c":"密碼學","ce":"Cryptography","t":"mid","q":"An attacker examines differences in ciphertext outputs resulting from small changes in the input to deduce key patterns in a symmetric algorithm. What method is being employed?","o":["Differential cryptanalysis on input-output differences","Timing attack to infer key bits based on processing time","Brute-force attack to try every possible key","Chosen-ciphertext attack to decrypt arbitrary ciphertexts"],"a":[0],"e":"這個情境描述了 difficial Cryptanalysis，一種被 CEH v13 密碼學所覆蓋的強大的密碼分析技術。 Difficial Cryptanalysis 側重於分析明文輸入的小變化如何影響所生成的密文輸出，目標是揭示出與金鑰加密相關的規律。 CEH v13 解釋道，對稱演算法依賴於複雜的變換--如替代和通縮--來模糊明文和密文之間的關係。 然而，在一些演算法中，可預見的差異可能會透過加密回合傳播，從而揭示統計偏差。 透過仔細選擇有可控差異的明文輸入的對並比較由此產生的密碼，攻擊者可以推斷出中間狀態的資訊，最終推斷出加密鍵。這種方法並不嘗試每一種可能的金鑰(Brute force)，也不依賴於執行時間或系統效能度量(timing attacks)。 這種方法也不同於所選擇的-密文攻擊，它涉及提交所選擇的解密的密碼文字，而不是觀察加密的行為。分化密碼分析在突破早期塊密碼學方面起到了作用，也是 AES 等現代演算法設計出能抵抗分化攻擊的關鍵原因。 CEH v13 強調，理解這種攻擊對於評價對稱式加密演算法的強度及其內部結構至關重要。因此，選項 A 準確地描述了所採用的技術。"},{"n":768,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"You are an ethical hacker at ShieldPoint Security, hired by Pinecrest Travel Agency in Orlando, Florida, to perform a penetration test on their flight booking portal. During testing, you notice that normal SQL injection attempts are blocked by a security filter. To bypass it, you adjust your input so that key SQL keywords are broken apart with unexpected symbols, allowing the database to interpret them correctly while evading the filter. This manipulation allows you to retrieve hidden booking records despite the filter ' s restrictions. Based on the observed behavior, which SQL injection evasion technique are you employing?","o":["String Concatenation","Hex Encoding","In-line Comment","Null Byte"],"a":[2],"e":"被描述的繞行最符合使用行內註釋技術。 許多簡單 SQL 注入過濾器尋找特定的\"被鎖\"關鍵詞，如 SELECT，UNION，OR，或 DROP 作為相接字串。 如果測試者透過插入權杖將一個關鍵字分開， 資料庫 將忽略-- 最常用的註釋分隔符-- 過濾器可能無法匹配被禁關鍵字， 而 SQL 解析器仍然重建了預定含義。 例如，在關鍵字中插入註釋標記會導致應用程式層過濾器錯過模式，而資料庫仍然可以根據 DBMS 和解析規則處理語句。 這就是為什麼基於註釋的疏解是一種常見的SQLi 逃取方法來對抗弱簽名過濾器。情節中\"用出乎意料的符號分解\"的用詞，地圖上可以很好地評論出/**/等標記(或其他DBMS-特有評論表)。 這些字元看起來\"不預期\"是一個天真過濾器，但是在 SQL 引擎上，它們被當作評論/whitespace 處理，並在解析時被有效忽略，使得攻擊者打算的關鍵詞得到正確的解釋。為何其他選項的對齊性不高 :字串協和(A)是一種模糊的方法，攻擊者使用協和運算子或函式(DBMS-特異性)來建構關鍵字/strings。 方案強呼叫符號分割關鍵字，由 DB 正確解釋為分隔符/ignored 內容，更直接匹配註釋插入。 Hex 編碼( B) 以十六進位制形式編碼了 酬載 (字串， 有時是函式名稱) 的 部分。 這不同於用插入符號分割關鍵字的技術。 Null 位元組(D)在歷史上用於終止某些上下文中的字串(更常見於更古老的檔案/path 處理錯誤)，在現代的 SQL 解析中並不是繞過關鍵字過濾器的主要技術。因此，SQL 注入逃逸技術是 C。in-line Comment。","s":"term"},{"n":769,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"A Windows endpoint generates alerts for credential dumping tools. What asset is targeted?","o":["Network","Logs","Availability","Credentials"],"a":[3],"e":"正確答案是 D，因為認證資訊傾銷工具是專門設計的來蒐集認證材料，如密碼，密碼雜湊，快取的認證資訊，和從失陷的Windows 端點擷取克伯羅斯票證。 在 CEH System Hacking 概念中，攻擊者試圖在獲得存取權後獲得認證資訊，從而可以升級權限，執行 hash/pass-the-ticket 攻擊，或橫向移動。 Windows 儲存了 SAM 資料庫等地點的認證相關資料，並在使用者登入時將有用的認證資訊材料儲存在記憶體中。 符合 CEH 指南指出，Windows 在 SAM 檔案中將認證資訊儲存為密碼雜湊，工具可以從記憶體中竊取雜湊或用 Mimikatz 等工具擷取密碼/hashes/Kerberos 票證。 因此，目標資產不是網路、日誌或服務可用性。 日誌將受到防法、DoS 的可用性和嗅探或掃描的網路攻擊。 認證資訊傾銷的直接目標為認證資訊，使選項 D 成為最佳答案。","s":"term"},{"n":770,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"During a red team engagement at a manufacturing company in Dallas, penetration tester Tyler gains access to a Windows workstation. Later in the exercise, he reviews his exfiltrated logs and finds detailed records of employee logins, email drafts, and sensitive data entered into desktop applications. The collection occurred without requiring browser injection or physical device access, and no kernel drivers were installed. Which type of keylogger did Tyler most likely deploy?","o":["JavaScript Keylogger","Hardware Keylogger","Kernel Keylogger","Application Keylogger"],"a":[3],"e":"正確答案是 D。 application 鍵盤側錄程式，因為情境描述了從一個 Windows 工作站的桌面應用程式上擷取按鍵抓取，而沒有安裝核心驅動程式，也沒有要求物理存取或瀏覽器級指令碼注入。 在符合 CEH 鍵盤側錄程式分類中，一個應用程式(user-mode)鍵盤側錄程式在應用層執行時，使用通通的 WindowsAPI 等使用者-空間技術(例如鍵盤輸入功能和訊息處理常規)來擷取被應用程式處理的按鍵中樞。 這樣可以將認證資訊輸入本機程式、以桌面用戶端撰寫的電子郵件草稿以及輸入商業工具的敏感文字記錄下來--就是看到的結果 Tyler。這個問題提供了兩個強大的消除器。 第一，它宣告沒有安裝核心驅動程式，它排除了核心金鑰 logger 在核心級別上捕獲輸入(通常需要安裝驅動程式和更深的 OS 整合)。 其次，它宣告攻擊不需要瀏覽器注入，它排除了 JavaScript 鍵盤側錄程式(通常透過將指令碼注入網頁/application 來捕獲瀏覽器工作階段內部的窗體輸入)。 它還明確指出沒有物理裝置存取，這排除了一種。硬體 鍵盤側錄程式(一種放在鍵盤和電腦之間或嵌入鍵盤的物理裝置)，需要當面安裝。應用程式金鑰開發器在開發後經常被使用，因為它們可以快速地被部署在標準的使用者級別權限(儘管更高的權限可能擴大覆蓋範圍)，可以針對廣泛的應用程式，並且可以隱蔽地執行。 從防守角度，監測可疑的 API 接鉤行為，異常過程注入，異常輸入-抓取模式，以及偵測認證資訊接取技術的端點控制，都是常見的對策。因此，鑑於桌面應用程式輸入的限制和所觀察到的日誌，最可能的鍵盤側錄程式型別是應用程式鍵盤側錄程式。","s":"term"},{"n":771,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a quarterly security audit at a financial services company in Charlotte, North Carolina, you are tasked with reviewing exposed services on legacy servers inherited from a third-party vendor. While scanning, you discover that TCP port 1434 is open on a database node that is not listed in the company ' s active inventory. The IT team has no records explaining why this service is running, and you are asked to determine whether the exposure of this port could indicate an unnecessary database-related risk. Based on standardized port assignments, which service is most likely running on this port and requires further review?","o":["ms-sql-m","sqlsrv","sql*net","ms-sql-s"],"a":[0],"e":"正確答案是 A。 ms-sql-m，因為 TCP/1434 通常與微軟 SQL 伺服器 Monitor/SQL 伺服器瀏覽器相關服務，這些服務被用於幫助客戶發現 SQL 伺服器例項。在標準化服務命名中， ms-sql-m 對應 Microsoft SQL “監視器” 功能，與例項發現和相關後設資料曝光相接。當此 連接埠從不需要的網路中可到達時，它可以透過披露有助於攻擊者識別 資料庫 例項的資訊來增加攻擊面，瞄準正確的埠，並聚焦開發嘗試。在\"未在公司活動庫存中上市\"的遺產伺服器中，一面開口的 1434 是一面紅旗，因為它暗示一個不必要的或不管理的資料庫發現元件可能正在執行。 攻擊者經常會將被曝光的資料庫相關埠用於偵察(識別例項名稱，版本，並監聽埠)，然後會樞機去驗證攻擊或利用已知的弱點。 即使核心 SQL 服務連接埠被控制，發現服務仍然可以洩露有用的環境細節來降低攻擊的成本。為什麼其他選項不正確 :ms-sql-s 一般指主微軟 SQL 伺服器服務，最常與 TCP 相接。 1433 (預設為 SQL 伺服器連接埠)，不是 1434。 sql*net 與甲骨文 SQL*Net/Net8 流量相關，一般使用甲骨文聽器埠如 1521 等，而非 1434。 sqlsrv 不是 1434 年的標準化任務，因為 ms-sql-m/ms-sql-s 被用於微軟SQL-相關服務。因此，基於標準化的連接埠關聯和這種服務的資料庫發現/monitoring 的作用，接觸最可能表明TCP/1434 上的 ms-sql-m，如果不需要，它值得進一步審查並可能加以限制。","s":"term"},{"n":772,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"long","q":"As a cybersecurity professional at XYZ Corporation, you are tasked with investigating anomalies in system logs that suggest potential unauthorized activity. System administrators have detected repeated failed login attempts on a critical server, followed by a sudden surge in outbound data traffic. These indicators suggest a possible compromise. Given the sensitive nature of the system and the sophistication of the threat, what should be your initial course of action?","o":["Conduct real-time monitoring of the server, analyze logs for abnormal patterns, and identify the nature of the activity to formulate immediate countermeasures.","Conduct a comprehensive audit of all outbound traffic and analyze destination IP addresses to map the attacker's network.","Immediately reset all server credentials and instruct all users to change their passwords.","Immediately disconnect the affected server from the network to prevent further data exfiltration."],"a":[0],"e":"經認證的道德駭客(CEH)事件應對生命週期從識別開始，然後是遏制、消除、恢復和經驗教訓。 CEH 檔案強調，在採取干擾行動之前，瞭解事件的範圍和性質至關重要。選項 A 是正確的初始反應，因為它側重於即時監測和日誌分析，這些在識別階段是不可或缺的。 CEH 材料強調分析日誌，認證失敗，以及流量異常，以確認是否發生了事件，並確定攻擊者的技術，持久性水平，以及影響。選項 B 雖然很有價值，但在初步確定後更為合適。 在不首先了解攻擊向量的情況下進行深入的境外流量審計可能會延誤控制決定。選項 C 是不成熟的。 CEH 警告說，改變認證資訊太早可能會提醒攻擊者，並導致他們升級或破壞證據。備選辦法 D 代表一種遏制戰略，而不是初步反應。 CEH 準則建議不要立即斷開系統，除非有經證實的主動資料過濾無法以其他方式加以控制，因為這可能擾亂業務運作並抹去可變的法證證據。因此，CEH 批准的方法是監測、分析和查明事件，然後才開始遏制和消除。"},{"n":773,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"During an executive-level incident review at HarborTech Industries in Baltimore, Maryland, analysts categorize key elements of a recent intrusion. They identify the organization that orchestrated the attack, document the malicious infrastructure used to reach internal systems, outline the technical approach employed to exploit weaknesses, and specify which internal business unit was affected. Within the Diamond Model of Intrusion Analysis, which element represents the technical approach used to carry out the attack?","o":["Adversary","Infrastructure","Capability","Victim"],"a":[2],"e":"正確答案是 C。 能力。在入侵分析的鑽石模型中，四個核心要素是逆向、基礎設施、能力以及受害者。 能力要素代表對手實施攻擊的工具、技術、惡意軟體、利用、程式和技術方法。選項 A。 逆向性是不正確的，因為它代表了攻擊者，威脅行為者，或對入侵負責的組織。選項 B。 基礎設施是不正確的，因為它代表了用於進行操作的系統、網域名稱、IP 位址、命令和控制伺服器或交付機制。選項 D。 受害者不正確，因為它代表目標實體、受影響系統、使用者或業務單位。因此，最好的答案是 C。 Capability。","s":"term"},{"n":774,"c":"雲端運算","ce":"Cloud Computing","t":"short","q":"Customer data in a cloud environment was exposed due to an unknown vulnerability. What is the most likely cause?","o":["Misconfigured security groups","Brute force attack","DoS attack","Side-channel attack"],"a":[0],"e":"CEH v13 確定錯設定的雲安全組是雲資料曝光的主要原因。 開放的埠，公共儲存桶，以及過於放任的防火牆規則經常會曝光敏感資料。殘酷的武力和 DoS 不直接暴露所儲存的資料，而側道攻擊是罕見和先進的。","s":"term"},{"n":775,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"Attackers persisted by modifying legitimate system utilities and services. What key step helps prevent similar threats?","o":["Weekly off-site backups","Monitor file hashes of sensitive executables","Update antivirus and firewalls","Disable unused ports"],"a":[1],"e":"這個情境描述了 Living-off-the-Land(LotL)惡意軟體技術，攻擊者在其中修改或濫用合法的系統二進位和服務來逃避偵測。CEH v13 將它認定為在高階持久威脅(APTs)中常用的高度隱蔽的持久性機制。最有效的反制措施是檔案完整性監測(FIM)，具體是透過追蹤關鍵系統可執行檔案的密碼雜湊。 CEH v13 強調，監測檔案雜湊可以及早發現對 PowerShell，cmd.exe，或 Windows 服務等二進位的未經授權的修改。備份(可選 A)援助恢復，但不會阻止或發現妥協。 防毒更新(可選 C)經常會以被修改的合法工具為條件而失敗。 防火牆硬化(可選 D)會減少攻擊面，但不會偵測到被信任的二進位被篡改。CEH v13 明確推薦以雜湊為基礎的完整性核查作為防止隱形持久性機制的核心防禦，因此，選項 B 是正確的。"},{"n":776,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at a healthcare facility in Baltimore, Maryland, an ethical hacker demonstrates how attackers are mapping active hosts and open ports using ICMP-based techniques. To reduce the organization's exposure, the security team decides to implement a countermeasure that specifically disrupts ICMP discovery traffic by preventing error messages from being returned. Which action should they take?","o":["Use a custom rule set to lock down the network, block unwanted ports at the firewall, and filter specific ports","Configure firewall and IDS rules to detect and block probes","Block unwanted services running on the ports and update the service versions","Block inbound ICMP message types and all outbound ICMP type 3 (Destination Unreachable) messages"],"a":[3],"e":"正確的選擇是 D，因為問題具體在於透過防止錯誤訊息被返回來破壞以 ICMP 為基礎的發現。 在 ICMP 偵察中，攻擊者經常不僅依靠 ICMP Echo(平)，還依靠 ICMP 錯誤訊息來推斷主機的可用性，過濾行為，和連接埠的可達性。 一個金鑰ICMP 出錯分類是 ICMP Type 3:目標無法到達，其中包括幾個程式碼(例如\"連接埠無法到達\"和\"通訊行政上被禁\")，可以揭示一個主機是否存在，一個防火牆是否過濾了流量，以及特定的埠是否可以到達或被封鎖。 當這些 ICMP Type 3 訊息被允許出網時，它們提供了寶貴的意見回饋，幫助攻擊者準確地對映環境。透過遮蔽輸入的 ICMP 訊息型別(可以減少直接的ICMP 偵測)並遮蔽出入境的 ICMP 型別 3 無法取得的訊息，組織會減少外部掃描器可用於區分活主機，被過濾主機，和已關閉埠的\"資訊訊號\"，這直接符合了快件中的要求:透過防止錯誤訊息被返回來阻止 ICMP 的發現。為什麼其他選擇不太準確:A 和 C 專注於一般的硬化(連接埠/service 還原)，這是好的做法，但並不直接處理 ICMP 錯誤資訊意見回饋。 B(防火牆/IDS 偵測)有幫助， 但及時要求採取一個行動，透過壓制錯誤反應， 具體干擾了 ICMP 發現流量，，透過 ICMP 過濾規則更直接地實現。操作說明:雖然遮蔽 ICMP 第 3 型可以降低偵察的能見度，但各組織應謹慎運用，因為一些 ICMP 對於正常的網路操作和故障排除很重要。"},{"n":777,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A regional insurance claims platform in Sacramento, California is protected by a web application firewall that evaluates inbound requests for suspicious query structures. During an authorized assessment, a tester observes that conventional injection attempts are consistently rejected. The tester then adjusts the format and composition of the request while preserving its intended database behavior. After this modification, the request passes through the filtering mechanism and is processed by the backend system without disruption. Which firewall evasion technique is being demonstrated?","o":["Splitting Payload Components Using HTTP Parameter Fragmentation (HPF)","Transforming Query Structure to Evade Pattern-Based Inspection","Combining Multiple Evasion Methods through an Integration Approach","Using HTTP Parameter Pollution (HPP) to Override Query Parameters"],"a":[1],"e":"正確答案是 B。 將查詢結構轉換為以 Evade 模式為基礎的檢查。情境描述基於模式的安全控制遮蔽常規注入有效酬載。測試者隨後在保留預定的資料庫動作的同時更改請求的格式和組成。 這是一個經典的 SQL 注入/WAF 逃逸概念: 改變查詢的外觀， 使得安全控制不再符合惡意模式， 而後端的資料庫仍然能成功地解釋請求。 符合 CEH SQL 注入材料解釋道，以簽名為基礎的偵測將輸入字串與已知的簽名進行比較，攻擊者可能透過諸如內線評論，字元編碼，字串接接合，模糊程式碼，操縱白空，六相編碼，和精密匹配等技術來逃避這些簽名。選項 A 是不正確的，因為 HTTP 參數分解特地將酬載元件分解出各種參數；情境沒有描述分解。選項 C 是不正確的，因為沒有說明合併或綜合的多方法逃避。備選辦法 D 是不正確的，因為 HTTP 參數汙染涉及重複或相沖突參數；設想方案沒有描述壓倒一切的查詢參數。因此，最好的答案是 B。將查詢結構轉換為以 Evade 模式為基礎的檢查。"},{"n":778,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"You are an ethical hacker at Titan Cyber Defense, hired by BrightWave Publishing in New York City to assess the security of their content management system (CMS). While testing the article search function, you input malformed strings such as multiple single quotes. The application responds with system feedback that unexpectedly reveals the database type and internal query structure, including table and column information. You use these disclosures to better understand how the backend query is built. Which of the following methods to detect SQL injection are you employing?","o":["Function Testing","Testing String","Dynamic Testing","Fuzz Testing"],"a":[1],"e":"正確答案是 B。 Testing String，因為情境描述了一種經典的 SQL 注入偵測方法，即測試者提交特殊字元和畸形的輸入字串--最顯著的是單引號(\")--來觀察應用程式如何處理它們，以及它是否產生資料庫錯誤意見回饋。 在 SQL 注入發現中，如果輸入被調校到查詢中而不經過適當的驗證/escaping 或參數化，則在參數中插入一個單引號(或多引號)，通常會打破預期的 SQL 語法。 當這種情況發生時，後端資料庫經常會返回可能披露出 DBMS 型別等關鍵資訊(如:MySQL，Microsoft SQL 伺服器，Oracle)，查詢片段，有時還引用了平板/column 名稱的錯誤訊息，這正是你觀察到的:\"系統意見回饋出乎意料地揭示出資料庫型別和內部查詢結構\"。這種方法在 CEH-style SQL 注入標識中被特地稱為\"測試字串\":使用引號字元，分隔符，註釋標記，以及其他元字元來檢視應用程式是否是易發性，以及是否發生出錯或異常行為。目標不是立即充分利用注入，而是確認輸入是否被解釋為 SQL 語句的一部分，並蒐集有助於測試者模擬後端查詢的線索，並進行安全，授權的驗證步驟。為什麼其他選項的準確性較低:函式測試是一個更廣泛的網路測試概念，不是所顯示的具體的 SQLi 偵測策略。動態測試一般是指執行以觀察行為時的應用程式測試，但它並沒有命名這個特定的 SQLi 發現技術。 Fuzz 測試包括傳送大量隨機或半隨機出乎意料的輸入來觸發相撞或出錯；雖然多引出可能是模糊的一部分，但被描述的方法是定向的，有名的 SQLi 測試字串方法，用來引出資訊 SQL 出錯。因此，所採用的方法是測試字串。","s":"term"},{"n":779,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"long","q":"During a compliance audit at a logistics company in Columbus, Ohio, the mobile security team discovers that several field-issued Android devices are responding to remote commands from an unknown external system. The affected devices are not connected via USB, and no enterprise mobility policies were recently modified. Network monitoring reveals that the devices have remote debugging enabled and are accepting connections over the wireless network on a specific high-numbered port commonly associated with remote device communication. Investigators determine that the external system was able to capture screenshots, list installed applications, forward ports, and install additional packages without requiring physical access to the devices. Which attack technique most accurately explains this compromise?","o":["Device Administration API Abuse","FRP Bypass","Android Rooting","ADB Exploitation via TCP 5555"],"a":[3],"e":"正確答案是 D.ADB 透過 TCP5555 進行開採。題目描述的是 Android 裝置接受遠端除錯連線在網路上而不使用 USB。 通常與 Android 除錯橋相接的高數字連接埠是 5555。 當 ADB 被曝光於 TCP 以上時，攻擊者可能與裝置進行遠端互動，釋出命令，安裝包，前端埠，抓取截圖，並依裝置狀態和授權控制而列出應用程式。 符合 CEH 的移動測試材料識別出 ADB，即 Android Debug Bridge，作為連線 Android 裝置進行測試和控制操作的機制。 Speason 對無線遠端的描述除錯和命令執行與被曝光的 ADB 相比 TCP。選項 A。 裝置管理 API 濫用是不正確的，因為裝置管理 API 提供政策執行或遠端擦拭等企業式管理控制，而不是在 TCP5555 上開啟遠端除錯。選項 B。 FRP Bypass 是不正確的，因為工廠重置保護繞行涉及重置後繞行 Google 帳戶保護。選項 C。 Android Rooting 是不正確的，因為 rooting 賦予了本機特權控制，但情境特別指向在網路上被曝光的遠端除錯。選項 D.ADB 透過 TCP5555 進行開發是正確的，因為裝置正在接受 ADB-style 對無線網路的遙控。因此，最好的答案是 D.ADB 透過 TCP5555 進行開採。","s":"term"},{"n":780,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"Granite Ridge Technologies in New Jersey is preparing to formalize its information security governance model. Executive leadership requires adoption of an internationally recognized framework that ensures confidentiality, integrity, and availability of information while enabling the organization to systematically identify, assess, and manage information security risks. The framework must also support compliance with regulatory and contractual obligations and demonstrate commitment to stakeholders. Which standard best fulfills these requirements?","o":["ISO/IEC 27001:2022","ISO/IEC 27005:2022","ISO/IEC 27701:2019","ISO/IEC 27002:2022"],"a":[0],"e":"正確答案是 A。 ISO/IEC27001:2022。 ISO/IEC27001 是建立、實施、維持和不斷改進資訊保安管理系統(ISMS)的國際標準。 當一個組織想要管理機密性、完整性、可用性、風險管理、監管義務和利益攸關方保證的治理框架時，它是最好的匹配。 符合 CEH 標準材料將 ISO/IEC27001 確定為確定實施、維護和改進資訊保安管理系統要求的標準，還將標準與資訊保安管理程式、成本效益高的風險管理、安全要求和遵守法律聯絡起來。規定建立、維持和改進組織資訊保安系統的要求，並處理遵守法律以及內部安全要求和目標的問題。選項 B。 ISO/IEC27005:2022 是不正確的，因為 ISO/IEC27005 側重於資訊保安風險管理指導，而不是完整的可認證的 ISMS 框架。選項 C。 ISO/IEC27701:2019 是不正確的，因為它擴充套件了隱私資訊管理，而不是一般的資訊保安治理。選項 D。 ISO/IEC27002:2022 是不正確的，因為它提供了安全控制指導，但 ISO/IEC27001 是用於認證和治理的管理系統標準。因此，最好的答案是 A。 ISO/IEC27001:2022。","s":"term"},{"n":781,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"Which of the following best describes the role of a penetration tester?","o":["A security professional hired to identify and exploit vulnerabilities with permission","A developer who writes malicious code for cyberattacks","A hacker who gains unauthorized access to systems for malicious purposes","A hacker who spreads malware to compromise systems"],"a":[0],"e":"CEH v13 將滲透測試人員定義為授權的資安專業人員，其職責是識別，開發，並報告一個組織的系統，網路，應用程式和流程中的弱點。 與惡意駭客不同的是，滲透測試者嚴格在法律界限內執行，根據有檔案記載的\"接戰規則\"(ROE)，並獲得組織的明確書面許可。 他們的目標不是傷害系統，而是模擬現實世界的網路攻擊來幫助組織加強防禦。 CEH 強調穿透測試者的道德責任，包括保密，避免未經授權的資料曝光，確保最小的操作影響，並提供可操作的建議。 選項 B、C 和 D描述了惡意行為者、惡意軟體作者或未經授權的攻擊者--與道德的滲透測試人員.CEH 相反的作用，對白帽子道德駭客和黑帽子攻擊者作了強烈的區分，滲透測試者堅決屬於道德的、合法的類別。"},{"n":782,"c":"密碼學","ce":"Cryptography","t":"mid","q":"An attacker extracts the initial bytes from an encrypted file container and uses a tool to iterate through numeric combinations. What type of cryptanalytic technique is being utilized?","o":["Seek identical digests across hash outputs","Test every possible password through automation","Force encryption key through quantum solving","Analyze output length to spot anomalies"],"a":[1],"e":"CEH 將野蠻力量密碼分析確定為攻擊者在找到正確金鑰之前系統測試每個可能的金鑰(密碼)或密碼句的方法。 當攻擊者從一個加密容器(通常被稱為所謂的明文)中取得初始位元組時，他們可以使用這種方法驗證嘗試，作為工具透過候選金鑰進行移動。 自動野蠻工具將解密的結果與已知頭圖案、檔案簽名或預期位元組結構進行比較，以確定何時到達正確的鍵。這個過程與 CEH 密碼學模組中描述的野蠻力密碼測試完全一致。量子解析不是 CEH 範圍的一部分，消化比較與相撞攻擊有關，分析輸出長度與粘接甲骨文偵測有關。 正確的分類是自動的野蠻力量密碼分析。"},{"n":783,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"In Portland, Oregon, ethical hacker Olivia Harper is hired by Cascade Biotech to test the security of their research network. During her penetration test, she simulates an attack by sending malicious packets to a server hosting sensitive genetic data. To evade detection, she needs to understand the monitoring system deployed near the network's perimeter firewall, which analyzes incoming and outgoing traffic for suspicious patterns across the entire subnet. Olivia's goal is to bypass this system to highlight vulnerabilities for the security team. Which security system is Olivia attempting to bypass during her penetration test of Cascade Biotech's network?","o":["Network-Based Intrusion Detection System","Host-Based Firewalls","Network-Based Firewalls","Host-Based Intrusion Detection System"],"a":[0],"e":"所描述的系統是一個基於網路的入侵偵測系統，因為它的位置位於相鄰的防火牆附近，檢查流經網路段的流量，而不是在單個端點上的活動。 在符合 CEH 的覆蓋中，在防火牆後等戰略網路點上部署了 NIDS，在核心上部署交換器，或者在SPAN 或 TAP 的連結上部署以監視出入境的封包。 其宗旨是偵測出可疑模式，簽名，協定異常，以及掃描或利用嘗試跨越多個主機和整個子網的指標，問題明確表示它\"分析出進出流量\"，並尋找\"跨出整個子網\"的規律，這與 NIDS 的範圍和位置相匹配。相形之下，一個主機-基於 IDS 執行在單個伺服器或工作站上，並監視諸如系統呼叫，日誌，檔案完整性，登錄更改等本機事件，以及該特定主機的本機網路連線。 這不符合所描述的周邊定位的子網通量分析。 主機基於防火牆也執行於端點，只執行該機的規則，並且不提供從周邊有利點進行集中的子網通量封包檢查。 基於網路的防火牆主要執行允許或否定政策，並可能進行狀態過濾，但主要不描述為偵測工具分析。可疑圖案； IDS 是偵測焦點控制。因此，Olivia 試圖繞過基於網路的入侵偵測系統，以展示惡意流量如何會逃避被置於防火牆附近的監控，並幫助安全小組加強偵測覆蓋和警示。","s":"term"},{"n":784,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"A penetration tester performs a vulnerability scan on a company's web server and identifies several medium- risk vulnerabilities related to misconfigured settings. What should the tester do to verify the vulnerabilities?","o":["Use publicly available tools to exploit the vulnerabilities and confirm their impact","Ignore the vulnerabilities since they are medium-risk","Perform a brute-force attack on the web server ' s login page","Conduct a denial-of-service (DoS) attack to test the server ' s resilience"],"a":[0],"e":"CEH v13 強調，在掃描過程中識別出弱點後，測試者必須驗證結果以確定實際影響並消除誤判警示。 這需要使用Metasploit，Nikto 等經批准的工具，或自訂的概念證明指令碼進行安全，可控的開發。 被貼上中度風險標籤的錯位仍然可能為進一步的攻擊提供權限提升、資料暴露或立足點。 CEH 方法強化了弱點利用應該始終遵循交戰的範圍和規則，並應避免破壞活動，如野蠻強迫攻擊或 DoS 攻擊，除非得到明確授權。 在專業評估中永遠不能接受忽略弱點。 核實這一問題有助於本組織利用循證結果確定補救的優先順序，因此，下一步的正確步驟是透過有控制的開採來核實弱點。"},{"n":785,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"You detect the presence of a kernel-level rootkit embedded deeply within an operating system. Given the critical nature of the infection, which remediation strategy should be followed to effectively remove the rootkit while minimizing long-term risk?","o":["Use specialized rootkit detection tools followed by tailored removal procedures","Deploy high-interaction honeypots to observe attacker behavior","Perform a complete system format and reinstall the operating system from a trusted source","Immediately power down the system and disconnect it from the network"],"a":[2],"e":"CEH Malware 和 Rootkit 分析模組強調核心級 rootkits 會損害到作業系統中最信任的元件。 一旦一個核心被損壞，任何執行在該系統上的工具都無法完全信任。 CEH 明確指出，核心-mode rootkits 的唯一可靠補救是:全系統擦擦從已知的、可信任的來源重新定居恢復經核實的清潔資料選項 C 是正確的，是 CEH 最佳做法。選項 A 可能適用於使用者模式 rootkits，但對核心級感染不可靠。選項 B 是一種研究策略，而不是補救。備選辦法 D 是遏制，而不是根除。"},{"n":786,"c":"系統入侵階段","ce":"System Hacking Phases","t":"long","q":"In sunny San Diego, California, security consultant Maya Ortiz is engaged by PacificGrid, a regional utilities provider, to analyze suspicious access patterns on their employee portal. While reviewing authentication logs, Maya notices many accounts each receive only a few login attempts before the attacker moves on to other targets; the attempts reuse a very small set of likely credentials across a large number of accounts and are spread out over several days and IP ranges to avoid triggering automated lockouts. Several low-privilege accounts were successfully accessed before the pattern was detected. Maya prepares a forensic timeline to help PacificGrid contain the incident. Which attack technique is being used?","o":["Session Hijacking","Password Spraying","Cross-Site Request Forgery (CSRF)","Brute Force Attack"],"a":[1],"e":"正確答案是 B.密碼噴灑，因為所描述的規律是噴灑攻擊的下定義行為:攻擊者嘗試了一小組常見或可能的密碼(例如:季節性。密碼，預設模式，或組織主題猜測)跨越許多不同的使用者帳戶，每個帳戶只使用幾處嘗試來避免帳戶封鎖閾值。 情境明確規定\"許多帳戶每個只收到幾起登入嘗試\"，攻擊者\"重用極小的一組可能認證資訊活動範圍在數天和 IP 範圍內展開，以避免觸發自動停機。 這些正是密碼噴灑與傳統野蠻力的精確操作特徵。在符合 CEH 認證資訊攻擊概念中，蠻力的特徵一般是反覆嘗試針對一個帳戶(或一組小帳戶)，常常會透過許多密碼候選人迴圈，直到找到正確的一個。 這種方法很吵並迅速觸發了停機和偵測。 密碼噴灑翻了策略:它使每個帳戶的嘗試計數不高並廣泛而緩慢地分配嘗試，從而減少了提醒和停機事件。 這就是為什麼攻擊者在模式被注意之前就能夠成功存取\"幾個低特權帳戶\"--在偵測閾值以下的同時，經常用薄弱或被再利用的密碼來破壞帳戶。為什麼其他選項不正確:工作階段劫持涉及在認證後偷取或重放工作階段 sorders/cookies，而不是在帳戶間重複登入嘗試。 CSRF 迫使登入使用者的瀏覽器進行出乎意料的行動；它不會在日誌中產生分散式認證失敗。 Brute force is。與此相關，但透過每個帳戶的最小嚐試和廣泛的目標選擇避免停機，是簽署了密碼噴灑。因此，觀察到的行為最清楚地表明瞭密碼噴灑攻擊。","s":"term"},{"n":787,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"During a penetration test at a shipping company in Miami, ethical hacker Daniel delivers a disguised email attachment containing a hidden payload. Once executed by employees, the compromised workstations begin to silently communicate with a remote server under Daniel's control. Over the following week, he confirms that multiple infected endpoints can receive synchronized commands and perform background tasks simultaneously, including sending bursts of outbound traffic on demand. Which type of malicious component is Daniel most likely simulating in this assessment?","o":["Spyware","Botnet Agents","Scareware","Potentially Unwanted Applications (PUAs)"],"a":[1],"e":"正確答案是 B。 殭屍網路 Agents，因為所描述的行為匹配一個指令與控制(C2)驅動的惡意軟體模型，其中多個已損壞的系統(\"bot\"或\"zombies\")與遠端控制器通訊，並可以釋出協調指令。 在 CEH-acreating 惡意軟體概念中，殭屍網路是整合或分佈控制下的受感染端點集合。 在每個被感染的工作站上安裝的惡意元件通常被稱作 bot/bot 代理，它\"檢查\"到 C2 伺服器，以接收指令並默默地在後臺執行任務。幾個細節強烈地表明瞭殭屍網路代理行為:酬載是透過變相的電子郵件附件(常見的初始感染向量)來傳遞的，失密的機器靜默地向外通訊到遠端的伺服器，並且--最重要的是--丹尼爾確認多個被感染的端點可以同時收到同步指令並進行動作。 “按需中斷出行流量”的例子符合典型的殭屍網路能力，如精心設計的 DDoS 流量生成、大眾掃描、垃圾郵件傳送、認證資訊填充或分配任務執行。 “在接下來的一週內”持續觀察也符合殭屍網路模式，即感染者宿主保持持久性，並定期向 C2 發出信標，以取得更新和指示。為什麼其他選項不合適: Spyware 主要專注於隱蔽地蒐集資訊(按鍵，截圖，瀏覽資料)，而不是在許多機器上執行同步命令。 Scareware 依賴於令人震驚的資訊來欺騙使用者支付或安裝不想要的軟體；它沒有描述沉默的 C2 協調。 PUA 通常是不受歡迎的，但不一定是惡意的，經常透過捆綁安裝，通常缺乏結構化的 C2 來協調遠端命令執行。因此，被模擬的惡意元件最好被識別為在 C2 控制下執行的殭屍網路代理。","s":"term"},{"n":788,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During a red team assessment, an ethical hacker must map a large multinational enterprise's external attack surface. Due to strict rules of engagement, no active scans may be used. The goal is to identify publicly visible subdomains to uncover forgotten or misconfigured services. Which method should the ethical hacker use to passively enumerate the organization's subdomains?","o":["Leverage tools like Netcraft or DNSdumpster to gather subdomain information","Attempt to guess admin credentials and access the company's DNS portal","Conduct a brute-force DNS subdomain enumeration","Request internal DNS records using spoofed credentials"],"a":[0],"e":"CEH 明確區分了主動和被動的偵察。 被動方法涉及蒐集公開資料而不直接與目標基礎設施互動，從而避免被偵測。Netcraft， DNSdumpster， VirusTotal， Certification Community 日誌等工具，以及搜尋引擎索引 CEH 推薦透過公共後設資料，快取了 DNS 記錄，WHOIS 資料，SSL 憑證條目，以及第三方的列舉資料庫來發現子域。這些平台提供對外部可存取資產的洞察力，而不向目標組織傳送封包或查詢。Brute-force 列舉是活躍的，違反了接戰規則。 嘗試認證資訊猜測或請求內部 DNS 資料是未經授權且明顯活躍的偵察活動。 Passive OSINT 基於子網域名稱列舉是一種用於安全和合法地發現隱藏基礎設施的核心 CEH 技術，在以隱形為優先的紅隊操作中尤為關鍵。"},{"n":789,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A digital media company in Seattle, Washington deploys an Nginx-based infrastructure to support its internal analytics dashboard and content publishing portal. During an authorized red team engagement, a tester evaluates the web-based administrative interface used to upload configuration bundles and manage application components. While analyzing a file-upload feature, the tester observes that certain user-supplied parameters submitted with uploaded content are incorporated into backend processing routines with limited validation. By adjusting specific values in the request, he alters how the server-side component interprets those inputs. Subsequent log analysis shows that the modified input affected system-level operations executed under the web service context, despite no direct shell access being obtained. Which Nginx-related vulnerability best describes the weakness identified in this scenario?","o":["NULL Pointer Dereference in HTTP/3","Improper Certificate Validation","Server-Side Request Forgery (SSRF) Vulnerability","OS Command Injection in nginxWebUI"],"a":[3],"e":"正確答案是 nginxWebUI 中的 D.OS 命令注入。設想題目描述使用者控制輸入正在納入後端處理例行程式，並影響網路服務背景下的系統級操作，這是 OS 指令注入的特徵。 符合 CEH 的 Web 應用程式材料解釋道，在沒有適當驗證的情況下處理不可信輸入時會出現注入缺陷，而注入攻擊包括 SQL 注入，LDAP 注入，和 OS 命令注入。 另一個 CEH 源解釋道，當惡意命令被注入應用程式輸入欄位而不是預期值時，命令注入可能發生，允許透過錯誤的輸入驗證將命令傳遞到伺服器。選項 A。 NULL 指標在 HTTP/3 中的引用是不正確的，因為該情境沒有描述由無指標行為造成的 HTTP/3 記憶體處理或服務崩潰。選項 B。 不恰當的憑證驗證不正確，因為問題與 TLS 憑證驗證無關。選項 C。 伺服器-Side 請求偽造(SSRF)是不正確的，因為 SSRF 涉及使伺服器向內部或外部資源提出意想不到的請求。選項 D。 OS Command Injection introduction in nginxWebUI 是正確的，因為修改後的使用者輸入會影響由網路服務執行的系統級命令。因此，最好的答案是 nginxWebUI 中的 D.OS 命令注入。","s":"term"},{"n":790,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"A system allows execution from /tmp directory. What risk exists?","o":["Malware execution","SQLi","XSS","DoS"],"a":[0],"e":"正確答案是 A，因為允許從/tmp 處擷取/tmp 造成攻擊者可以放置的直接風險並執行一個臨時目錄中的惡意二進位、指令碼、滴滴或有效酬載。在 Linux 中，/tmp 通常用於臨時檔案，如果允許執行，則在入侵後成為有吸引力的中轉地點。CEH 惡意軟體概念將惡意軟體定義為惡意軟體，旨在取得目標機器、竊取資訊、傷害系統， 或給予攻擊者控制。 CEH 系統打入的概念也描述存取後惡意應用程式執行，包括安裝惡意軟體，設定後門，密碼快克，和鍵 Loggers。這種風險不是 SQL注入或 XSS，因為這些是 Web 應用程式輸入攻擊。它也並非主要 DoS，儘管惡意軟體以後可能導致阻斷服務。即時和最佳的答案是惡意軟體執行，因為可執行的臨時目錄允許攻擊者從可寫出的位置執行有敵意的程式碼。","s":"term"},{"n":791,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"In an enterprise environment, the network security team detects unusual behavior suggesting advanced sniffing techniques exploiting legacy protocols to intercept sensitive communications. Which of the following sniffing-related techniques presents the greatest challenge to detect and neutralize, potentially compromising confidential enterprise data?","o":["Steganographic payload embedding within SMTP email headers","Encrypted data extraction via HTTP header field overflows","Covert data interception via X2S packet fragmentation","Covert channel establishment through Modbus protocol manipulation"],"a":[3],"e":"根據 CEH 嗅探和 Network 協定攻擊模組，隱蔽通道代表了最精密和最難被發現的資料擷取技術之一。 這些通道隱藏了合法的協定行為中的惡意通訊，使得這些通道對傳統的 IDS/IPS 和封包檢查工具進行識別具有極大的挑戰性。 Modbus 等工業和遺產協定被廣泛用於 OT 和遺留的企業環境，缺乏加密和透過設計認證。 CEH 檔案強調攻擊者可以操縱未使用或認證不完善的 Modbus 欄位，在作為正常控制流量出現的同時，暗中傳輸或擷取資料。選項 D 是正確的，因為信任的遺留協定上的秘密通道與合法流量無縫地相接並繞過許多安全控制。選項 A 不是嗅探技術，而是資料隱藏方法。選項 B 描述的是開採，而不是嗅探。選項 C 是一種理論上的逃避方法，但透過再組裝更容易被察覺。 CEH 強調秘密渠道是最可怕的嗅探挑戰之一。"},{"n":792,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"During a cloud security assessment, it was discovered that a former employee still had access to critical resources months after leaving the organization. Which practice would have most effectively prevented this issue?","o":["Using multi-cloud deployment models","Implementing real-time traffic analysis","Conducting regular penetration tests","Enforcing timely user de-provisioning"],"a":[3],"e":"根據 CEH v13 雲端運算，身分和存取管理不當(IAM)是雲安全事件最常見的原因之一。 前員工保留雲資源存取權時，它會成為雲安全事件的主要原因之一。代表使用者生命週期管理失敗，特別是在解除供應階段。及時的使用者去規定，確保當僱員離開組織或改變角色時，立即取消所有相關的存取權--API 鍵、IAM 角色、認證資訊、權杖和權限。 CEHv13 強調雲環境放大了這種風險，因為存取往往是集中的和遙遠的，意味著前僱員可以從任何地方存取系統。選項 A，B，和 C 是支援性的安全做法，但並不直接解決根源。 多雲模型並不能防止未經授權的存取。 流量分析可能在事後發現濫用，但不能防止。 滲透測試識別出弱點，但不能管理使用者的存取。 CEH v13 明確確定及時解禁為關鍵雲 安全控制，以防止內幕威脅，特權濫用和違反守法行為。 因此，選項 D 是正確答案。"},{"n":793,"c":"密碼學","ce":"Cryptography","t":"mid","q":"A U.S.-based online securities trading firm in New York is reviewing its transaction authentication process. The security team confirms that each transaction is processed by first generating a hash of the transaction data. The hash value is then signed using the sender ' s private key. During verification, the recipient uses the corresponding public key to validate the signature before approving the transaction. The system documentation specifies that the same algorithm supports encryption, digital signatures, and key exchange mechanisms within the organization ' s secure communications infrastructure. Which encryption algorithm is being used in this implementation?","o":["ElGamal","Diffie-Hellman","DSA","RSA"],"a":[3],"e":"正確答案為 RSA.CEH 密碼學覆蓋度描述為 RSA 是一種被廣泛使用的不對稱演算法，支援加密和數位簽章，並通常被部署在公用金鑰基礎設施中。 問題稱交易資料被雜湊，雜湊與傳送方的私密金鑰簽名，接收方用匹配的公開金鑰驗證簽名。這就是 CEH 材料中呈現的經典的 RSA 簽名模型。 附加線索是，據說同一演算法支援加密，數位簽章，以及安全的通訊使用案例。 Diffie-Hellman 主要是一個關鍵交換器制，不用於這裡所描述的數位簽章。 DSA 是用於數位簽章的設計，但並非用於一般的加密。 ElGamal 可以支援加密和簽名，但 CEH 考試框架最有力地將加密和數位簽章驗證與 RSA.CEH 的完全結合起來。CEH 的參考文獻一再強調 RSA 是企業通訊中用於保密、認證、完整性和不否定的標準不對稱加密系統。描述的執行結合了雜湊式，私密金鑰式的簽名，公開金鑰式的核查在一個廣泛的不對稱框架內進行，RSA 是最準確的答案。","s":"term"},{"n":794,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"Which information CANNOT be directly obtained from DNS interrogation?","o":["Usernames and passwords","Server geolocation (via IPs)","Subdomains of the organization","IP addresses of mail servers"],"a":[0],"e":"DNS 審訊是一種核心被動和半活動的偵察技術，在 CEHv13 偵察技術中被描述。 它允許道德駭客蒐集公開的關於目標域基礎設施的資訊。透過 DNS 查詢，測試者可以擷取:子域(透過區域轉移、暴力破解或 DNS 記錄)郵件伺服器 IP 位址(透過MX 記錄)伺服器 IP 位址，然後可以被對映到大致的地理位置然而，DNS 不儲存使用者名稱和密碼等認證資訊，該資訊存在於 Active Directory，LDAP 等認證系統中，或應用程式資料庫中，而非 DNS。因此，選項 A 是唯一無法透過 DNS 詢問獲得的選擇。 CEH v13 明確區分了命名基礎設施資料和以認證資訊為主的資訊，強化了 DNS 列舉不能披露使用者認證資訊的原因。因此，選項 A 是正確的。","s":"term"},{"n":795,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"You've just performed a port scan against an internal device during a routine pen test. Nmap returned the following response: Starting NMAP 7.30 at 2021-10-10 11:06 NMAP scan report for 192.168.123.100 Host is up (1.00s latency). Not shown: 993 closed ports PORT STATE SERVICE 80/tcp open http 161/tcp open snmp 515/tcp open lpd MAC Address: 00:1B:A9:01:3a:21 Based on this scan result, which of the following is most likely correct?","o":["The host is a printer.","The host is most likely a Windows computer.","The host is a Cisco router.","The host is most likely a Linux computer."],"a":[0],"e":"正確答案是 A 因為開啟服務的組合強烈地表示一個網路印表機。在 CEH 掃描中 和列舉概念， Nmap 結果用於識別活主機， 開啟埠， 執行服務， 和可能的裝置型別。 連接埠 80/tcp 表示一個 HTTP 服務， 用於網路管理介面的印表機通常使用。連接埠 161/tcp 或 UDP 與 SNMP 相關， a 經常在網路基礎設施裝置上啟用的協定管理裝置， 包括印表機， 用於監測狀況， 裝置資訊， 和設定細節。最重要的線索是連接埠 515/tcp， 列為 LPD， 哪個代表 Line 印表機守護程序。 LPD 與網路列印服務特別相關。 雖然 Windows， Linux， 和 Cisco 裝置可以曝光 HTTP 或 SNMP，但是 LPD 與 HTTP 和 SNMP一起存在使得印表機最有可能識別。 MAC 位址 還可以幫助供應商指紋， 但僅服務設定就足夠了。因此，基於 CEH-style連接埠/service 分析，主機最有可能是一個印表機。"},{"n":796,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A web application returns generic error messages. The analyst submits AND 1=1 and AND 1=2 and observes different responses. What type of injection is being tested?","o":["UNION-based SQL injection","Error-based SQL injection","Boolean-based blind SQL injection","Time-based blind SQL injection"],"a":[2],"e":"這個技術被稱作\"布林-基於 boolean-Blind SQL 注入\"，定義為 CEH v13 Web 應用程式入侵。 當應用程式壓制資料庫錯誤並返回通用回應時，攻擊者使用有條件的語句來推斷資料庫行為。透過比較對真(1=1)和假(1=2)條件的反應，攻擊者推斷出注入出 SQL 是否被成功執行。 CEH v13 區分了以下內容:基於錯誤的 SQLi( 可見 DB 錯誤)UNION- 基於 SQLi (資料擷取)基於時間的 SQLi( 答覆延遲)基於布林語的盲 SQL 注入完全依賴於內容差異，使得選項 C 正確。","s":"term"},{"n":797,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"In Atlanta, Georgia, ethical hacker James Patel is hired by Southern Retail, a major e-commerce chain, to test the security of their online shopping platform. During his penetration test, James aims to simulate a session hijacking attack by setting up a proxy to intercept HTTP traffic between customers and the platform, log the requests, and perform advanced searches on the captured data to identify session tokens. He needs a lightweight tool specifically designed for security research that can handle these tasks in a controlled environment to demonstrate vulnerabilities to the company ' s security team. Which tool should James use to perform this session hijacking simulation?","o":["Caido","Hetty","Bettercap","Wireshark"],"a":[0],"e":"最佳選擇是 Caido，因為題目描述的是以 Web 為核心的攔截代理工作流程：攔截 HTTP 流量、記錄要求，並透過進階搜尋辨識工作階段權杖。符合 CEH 的 Web 應用程式測試方法中，工作階段劫持模擬通常依靠攔截代理伺服器，觀察及操弄應用層要求與回應、從 Cookie 或標頭擷取工作階段識別碼，並展示薄弱的工作階段管理如何導致帳戶遭入侵。\n\nCaido 是以攔截代理伺服器為核心的現代 Web 資安工具套件。它能擷取瀏覽器與伺服器之間的流量、檢查標頭與 Cookie，並快速搜尋已記錄的流量，以找出工作階段 ID、驗證 Cookie、Bearer 權杖或可預測參數等模式，符合題目對輕量級工具、快速篩選及跨要求搜尋的需求。\n\nWireshark 是強大的封包分析器，但主要在封包層運作，並非針對有組織的要求歷程、權杖搜尋及方便的 HTTP 操弄等Web 應用程式測試流程最佳化。Bettercap 主要是網路中間人及弱點利用框架；雖可攔截流量，卻不是題目所述受控Web 代理測試與詳細 HTTP 要求分析的典型選擇。Hetty 是 const LS='cehseg_v1';
let S = load();
function load(){
  try{const o=JSON.parse(localStorage.getItem(LS)); if(o&&o.ans) return o;}catch(e){}
  return {tier:'short', ans:{}, wrong:{}, shuffle:false, onlywrong:false, idx:{}, theme:null, prevTier:null, reveal:false, hl:true, snap:false, dom:'all'};
}

/* ---- theme ---- */
function applyTheme(){ if(S.theme) document.documentElement.setAttribute('data-theme',S.theme);
  else document.documentElement.removeAttribute('data-theme'); }
applyTheme();
document.getElementById('theme').onclick=()=>{
  const cur=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  S.theme = cur==='dark'?'light':'dark'; applyTheme(); save();
};

/* ---- deck ---- */
function baseDeck(){
  let d = S.tier==='all' ? DATA.slice() : DATA.filter(q=>q.t===S.tier);
  if(S.onlywrong) d = d.filter(q=>S.wrong[q.n]);
  if(S.snap) d = d.filter(q=>q.s);
  if(S.dom&&S.dom!=='all') d = d.filter(q=>DMAP[q.n]===S.dom);
  if(S.shuffle){ d=d.slice(); let seed=hash(S.tier+(S.onlywrong?'w':'')+'s');
    for(let i=d.length-1;i>0;i--){ seed=(seed*1103515245+12345)&0x7fffffff;
      const j=seed%(i+1); [d[i],d[j]]=[d[j],d[i]]; } }
  return d;
}
function hash(s){ let h=2166136261; for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);} return h>>>1; }
let deck=[], pos=0, peek=false;
function key(){ return S.tier+':'+(S.dom||'all')+(S.onlywrong?':w':'')+(S.snap?':q':'')+(S.shuffle?':s':''); }
function rebuild(keepNum){
  deck=baseDeck();
  const want = keepNum ?? S.idx[key()];
  let i = deck.findIndex(q=>q.n===want);
  pos = i>=0 ? i : 0;
  peek=false;
  render();
}

const tierBar=document.getElementById('tiers');
TIERS.forEach(t=>{

  b.dataset.k=t.k; tierBar.appendChild(b);

function syncBar(){

  document.getElementById('reveal').setAttribute('aria-pressed',String(!!S.reveal));
  document.getElementById('hl').setAttribute('aria-pressed',String(S.hl!==false));
  document.getElementById('snap').setAttribute('aria-pressed',String(!!S.snap));
  const ds=document.getElementById('dom');

  document.getElementById('onlywrong').setAttribute('aria-pressed',String(S.onlywrong));
}
document.getElementById('shuffle').onclick=()=>{S.shuffle=!S.shuffle;save();syncBar();rebuild(deck[pos]&&deck[pos].n);};

document.getElementById('hl').onclick=()=>{S.hl=(S.hl===false);save();render();};
(function(){

document.getElementById('onlywrong').onclick=()=>{

};

/* ---- render ---- */
const stage=document.getElementById('stage'), nav=document.getElementById('nav');
const LET='ABCDEFGH';
function render(){
  syncBar();
  if(!deck.length){
    stage.innerHTML=`<div class="card done"><div class="big">0</div>
      <p class="empty" style="font-size:14px;margin-top:12px">${S.onlywrong?'目前沒有錯題。關掉「只練錯題」回到完整題庫。':(S.snap?'這一段沒有秒答題，換一段或關掉「秒答題」。':'這個範圍沒有題目，放寬長度或領域篩選。')}</p></div>`;
    nav.innerHTML=''; stats(); return;
  }
  pos=Math.max(0,Math.min(pos,deck.length-1));
  const q=deck[pos];
  S.idx[key()]=q.n; save();
  const given=S.ans[q.n];
  const answered=given!==undefined;
  const shown=answered||S.reveal||peek;
  const tl=TIERS.find(t=>t.k===q.t);
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`
    <div class="meta">
      <span class="qno">Q${q.n}</span><span class="dot"></span>
      <span class="cat">${esc((DOMS.find(x=>x[0]===DMAP[q.n])||[,q.ce])[1])} · ${esc(q.ce)}</span><span class="dot"></span>
      <span class="gauge ${tl.g}" title="${tl.label}"><i></i><i></i><i></i></span>
      ${q.s?`<span class="snapbadge">${q.s==='tool'?'工具題':'名詞題'}</span>`:''}
      <button class="flag" id="flag" data-on="${S.wrong[q.n]?1:0}">${S.wrong[q.n]?'已標記錯題':'標記錯題'}</button>
    </div>
    <div class="stem">${mark(q.q)}</div>
    ${S.hl===false?'':`<div class="legend">
      <span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>技術線索</span>
      <span><i style="background:var(--warn)"></i>方向詞</span>
      <span><i style="background:var(--sunk);border:1px solid var(--line)"></i>埠號與指令</span>
      <span><i style="background:var(--line)"></i>地名日期</span>
    </div>`}
    <div class="opts" id="opts"></div>
    <div class="exp" id="exp"></div>`;
  stage.innerHTML=''; stage.appendChild(c);
  const box=c.querySelector('#opts');
  q.o.forEach((txt,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button';
    b.innerHTML=`<span class="k">${LET[i]}</span><span class="tx">${esc(txt)}</span>`;
    if(shown){
      b.disabled=true;
      if(q.a.includes(i)) b.classList.add('ok');
      else if(i===given) b.classList.add('no');
      else b.classList.add('dim');
    } else b.onclick=()=>pick(q,i);
    box.appendChild(b);
  });
  c.querySelector('#flag').onclick=()=>{
    if(S.wrong[q.n]) delete S.wrong[q.n]; else S.wrong[q.n]={c:domName(q.n)};
    save(); render();
  };
  if(shown) showExp(q,given);
  drawNav();
  stats();
}
function pick(q,i){
  S.ans[q.n]=i;
  if(!q.a.includes(i)) S.wrong[q.n]={c:domName(q.n)}; else delete S.wrong[q.n];
  save(); render();
  document.getElementById('exp').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function showExp(q,given){
  const el=document.getElementById('exp');
  const sol=q.a.map(x=>LET[x]).join('/');
  let head;
  if(given===undefined){
    head=`<div class="verdict r">未作答<b>正解 ${sol}</b></div>`;
  }else{
    const right=q.a.includes(given);
    head=`<div class="verdict ${right?'y':'n'}">${right?'答對':'答錯'}`
       + `<b>你選 ${LET[given]}${right?'':' · 正解 '+sol}</b></div>`;
  }
  el.innerHTML=head+`<h3>詳解 &middot; 中文</h3><div class="body">${esc(q.e)}</div>`;
  el.classList.add('open');
}
function drawNav(){
  nav.innerHTML='';
  const mk=(t,fn,cls,dis)=>{const b=document.createElement('button');
    b.className='btn'+(cls?' '+cls:'');b.textContent=t;b.disabled=!!dis;b.onclick=fn;nav.appendChild(b);return b;};
  mk('上一題',()=>{pos--;peek=false;render();},'',pos===0);
  mk('下一題',()=>{pos++;peek=false;render();},'pri',pos>=deck.length-1);
  const q=deck[pos];
  if(S.ans[q.n]!==undefined) mk('重做這題',()=>{delete S.ans[q.n];peek=false;save();render();});
  else if(!S.reveal && !peek) mk('看答案',()=>{peek=true;render();
    document.getElementById('exp').scrollIntoView({block:'nearest',behavior:'smooth'});});
  const k=document.createElement('span'); k.className='keys';
  k.innerHTML=`${pos+1} / ${deck.length}<em>A–H 作答　Enter 看答案／下一題　← → 換題</em>`;
  nav.appendChild(k);
  document.getElementById('railfill').style.width=((pos+1)/deck.length*100)+'%';
}
function stats(){
  const scope = S.tier==='all'?DATA:DATA.filter(q=>q.t===S.tier);
  let done=0,ok=0;
  scope.forEach(q=>{const g=S.ans[q.n]; if(g!==undefined){done++; if(q.a.includes(g))ok++;}});
  document.getElementById('sDone').textContent=done;
  document.getElementById('sOk').textContent=ok;
  document.getElementById('sNo').textContent=done-ok;
  document.getElementById('pct').textContent = done? Math.round(ok/done*100)+'%' : '—';
  const ws=Object.keys(S.wrong);
  document.getElementById('wct').textContent=ws.length?ws.length:'';
  const wb=document.getElementById('wrongbox');
  if(!ws.length) wb.innerHTML='<p class="empty">答錯或手動標記的題目會列在這裡，點題號可以直接跳過去。</p>';
  else{
    wb.innerHTML='<div class="wrong"></div>';
    const row=wb.firstChild;
    ws.map(Number).sort((a,b)=>a-b).forEach(n=>{
      const b=document.createElement('button'); b.textContent=n;
      b.onclick=()=>goto(n); row.appendChild(b);
    });
  }
  const cnt={};
  ws.forEach(n=>{const c=S.wrong[n].c; cnt[c]=(cnt[c]||0)+1;});
  const arr=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const wk=document.getElementById('weak');
  if(!arr.length) wk.innerHTML='<p class="empty">答錯的題目會依分類累積在這裡。</p>';
  else{ const max=arr[0][1];
    wk.innerHTML=arr.map(([c,v])=>`<div class="wk"><div class="l"><span>${esc(c)}</span><em>${v}</em></div>
      <div class="t"><i style="width:${v/max*100}%"></i></div></div>`).join(''); }
}
function goto(n){
  const q=DATA.find(x=>x.n===n); if(!q) return;
  if(S.tier!=='all' && q.t!==S.tier){ S.tier=q.t; }
  if(S.onlywrong && !S.wrong[n]) S.onlywrong=false;
  save(); rebuild(n);
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('jgo').onclick=()=>{const v=parseInt(document.getElementById('jin').value,10); if(v)goto(v);};
document.getElementById('jin').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=parseInt(e.target.value,10); if(v)goto(v);}});
document.getElementById('reset').onclick=()=>{
  S={tier:S.tier,ans:{},wrong:{},shuffle:S.shuffle,onlywrong:false,idx:{},theme:S.theme,prevTier:null};
  save(); rebuild();
};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowRight'){ if(pos<deck.length-1){pos++;peek=false;render();} return; }
  if(e.key==='ArrowLeft'){ if(pos>0){pos--;peek=false;render();} return; }
  if(e.key==='Enter'){
    e.preventDefault();
    const cur=deck[pos]; if(!cur) return;
    const seen = S.ans[cur.n]!==undefined || S.reveal || peek;
    if(!seen){ peek=true; render(); }
    else if(pos<deck.length-1){ pos++; peek=false; render(); }
    return;
  }
  if(S.reveal||peek) return;
  const i=LET.indexOf(e.key.toUpperCase());
  if(i>=0 && deck[pos]){ const q=deck[pos];
    if(i<q.o.length && S.ans[q.n]===undefined){ e.preventDefault(); pick(q,i); } }
});

function mark(text){

  while((m=RX.exec(text))!==null){
    if(m[0].length===0){RX.lastIndex++;continue;}
    const w=m[0], lw=w.toLowerCase().trim();
    let cls;
    if(DIRSET.has(lw)) cls="k-dir";

    out+=esc(text.slice(last,m.index))+'<span class="'+cls+'">'+esc(w)+"</span>";
