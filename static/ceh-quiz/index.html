igin of Reconnaissance Activity and Reduce Attribution Risk","To Spoof Packet Source Addresses at the IP Layer"],"a":[2],"e":"正確答案是 C。 隱藏偵察活動的起源並減少分配風險。測試者透過中間外部系統進行偵察流量的通路，從而將日誌顯示的中間作為明顯的源頭進行監控。 首要目標是操作隱蔽:使防禦人員更難將活動歸屬於測試者的真實機器，組織，或位置。符合 CEH 防火牆-外逃材料描述透過外部系統繞行，以及用於使流量看起來來自另一個主機或路徑的相關技術，而不是原始出處。選項 A 是不正確的，因為透過一箇中間體的路由偵察本身並不能在目標網路內建立持久性。選項 B 是不正確的，因為情境沒有描述繞行應用程式認證控制。選項 D 是不正確的，因為 IP 欺騙在封包級別上更改了源 IP 資訊，而情境描述的是透過一個實際轉發流量的中間系統來進行路由。選項 C 是正確的，因為中間系統被用來隱藏偵察活動的真實出處。因此，最好的答案是 C。 隱藏偵察活動的起源並減少分配風險。"},{"n":65,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test, an analyst repeatedly initiates TCP connections to a target host and records the sequence numbers returned in the SYN/ACK responses. By examining predictable or incremental patterns in these values, the analyst attempts to infer characteristics of the underlying operating system. What OS fingerprinting attribute is being analyzed in this scenario?","o":["TCP Timestamp Analysis","TCP Window Size","Initial Sequence Number (ISN)","Time to Live (TTL)"],"a":[2],"e":"正確答案是 C。 初序號 (ISN)。問題具體地說，分析師記錄了 SYN/ACK 回覆中返回的序號，並分析了這些值是可預測的還是遞增的。 這意味著分析師正在檢查目標初始序號生成行為。 CEH 工作階段劫持材料解釋道，在 TCP 三向交握期間，伺服器用包含 ISN 的 SYN/ACK 回應，或稱\"初始序號\"。 它還表示序號對可靠的通訊很重要，在劫持中可能至關重要，因為攻擊者必須成功猜測或預測序號。 另一種符合 CEH 的引用解釋道:ISN 是在握手時被交換的，而序列數行為可以揭示執行特徵。選項 A。 TCP 時間戳分析是不正確的，因為 TCP 時間戳分析檢查時間戳選項值，時鐘行為，或上時估計，而不是 SYN/ACK 序列數生成。選項 B。 TCP 視窗大小不正確， 因為 TCP 視窗大小指的是在需要承認前可以傳送多少資料。這不是問題中描述的序列數屬性。選項 D。 Time to Live (TTL)是不正確的，因為 TTL 是一個 IP 頭欄位，用於限制封包壽命，可以幫助推斷 OS 或 hop 距離，但與 SYN/ACK 序號的可預見性無關。因此，最好的答案是 C。 Institution 序號(ISN)。","s":"term"},{"n":66,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"A penetration tester evaluates the security of an iOS mobile application that handles sensitive user information. The tester discovers that the application is vulnerable to insecure data transmission. What is the most effective method to exploit this vulnerability?","o":["Execute a SQL injection attack to retrieve data from the backend server","Perform a man-in-the-middle attack to intercept unencrypted data transmitted over the network","Conduct a brute-force attack on the app's authentication system","Use a Cross-Site Request Forgery (CSRF) attack to steal user session tokens"],"a":[1],"e":"CEH v13 課程軟體指出，當移動應用程式透過未加密或加密弱的通道傳輸敏感資料，使資訊被擷取時，通訊就會不安全。應用程式使用 plain HTTP 或沒有正確驗證憑證，攻擊者可以使用 中間人 (MitM) 攻擊在 使用者端 和 伺服器 之間放置自己。這樣可以讓他們讀取 工作階段 權杖， 認證資訊， API 鍵， 或個人使用者資料在網路中穿行時。 CEH 材料強調 MitM 攻擊是無保障資料傳輸的主要開發技術，因為它們利用了運輸層安全方面的弱點，而不是後端程式碼或身分驗證機制方面的弱點。 SQL 注入和 CSRF 攻擊的目標是 Web 應用程式邏輯，而不是運輸加密。 殘酷的攻擊目標是驗證機制，與資料傳輸方式無關，因此，最有效的利用方法是透過 MitM 擷取流量來捕捉或操縱未加密的通訊。"},{"n":67,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A subscription-based analytics platform in Portland, Oregon provides enterprise clients with API access to project dashboards. Each dashboard is associated with a unique identifier included in client-side API requests when retrieving project data. While evaluating access controls, a security analyst signs in using a standard user account and captures a legitimate API request used to retrieve a specific project dashboard. By altering only the identifier value within the request and replaying it through the same authenticated session, the analyst receives data belonging to a different client organization. The session remains valid, and no elevated privileges are granted. The behavior indicates that access validation does not adequately verify whether the requesting user is authorized to access the referenced resource. Identify the OWASP API security risk illustrated in this scenario.","o":["Broken Object Level Authorization (BOLA)","Broken Object Property Level Authorization","Broken Function Level Authorization","Broken Authentication"],"a":[0],"e":"正確答案是 A。 Brooken 物件級別授權(BOLA)。情境描述一個在 API 請求中更改物件識別符號並獲得另一個使用者端的儀表板資料的認證使用者，該使用者仍然被認證，但應用程式未能核實該使用者是否被授權存取識別符號所引用的特定物件。這是不安全的直接物件引用的 API 安全等同。 符合 CEH 的 Web 應用程式材料解釋應用程式經常使用物件或 IDs 來區分使用者記錄，如果使用者可以更改一個識別符號，如 id=1 到 id=2,並存取另一個使用者的資料，缺陷就是不安全的直接物件引用。 在 OWASPAPI 安全名詞中，這被歸類為斷裂物件級授權(BOLA)。選項 B。 損壞物件屬性級別授權不正確，因為這涉及未經授權存取特定物件屬性或欄位，而不是身分識別的全部物件。選項 C。 斷開函式級別授權不正確， 因為使用者沒有存取一個未經授權的函式或行政端點； 他們正在透過同一函式存取另一個物件。選項 D。 損壞的認證是不正確的， 因為 工作階段 仍然有效， 並且認證不被繞過。 失敗是物件級別的授權。因此，最好的答案是 A。 Breaken 物件級授權(BOLA)。","s":"term"},{"n":68,"c":"社交工程","ce":"Social Engineering","t":"long","q":"A technology consulting firm in Denver, Colorado, recently experienced a wave of suspicious account compromise incidents. Several employees reported receiving an email that appeared identical to a legitimate cloud storage notification they had received earlier that week. The message reused the original branding, formatting, sender display name, and subject line. However, it informed recipients that the previously shared document had been \"updated due to synchronization errors\" and instructed them to reauthenticate using the embedded link. The link directed users to a convincing replica of the organization's authentication portal. Investigation revealed that the attacker had reused content from a genuine prior communication and modified only the embedded hyperlink. Which type of social engineering attack does this scenario most accurately represent?","o":["Clone Phishing","Consent Phishing","Search Engine Phishing","Tabnabbing"],"a":[0],"e":"正確答案是 Clone Phishing.CEH 社交工程材料解釋，當攻擊者收到受害者先前收到的合法資訊，重複其外觀和內容，並修改諸如連結或附件等惡意元素時，就會發生克隆釣魚事件。這與這個情境完全吻合:攻擊者重用真品牌、原始格式、傳送者顯示樣式和主題線，然後修改了嵌入式超連結，這樣使用者就可以在假的入口網站上重新認證。 同意費興是一種不同的雲聚焦技術，涉及惡意的 OAuth 授權請求。 搜尋引擎費興依賴於操縱搜尋結果，所以受害者可以自願地瀏覽到假網站。Tabnabing 涉及將不活動瀏覽器標籤的內容更改為 filshing 頁面。 沒有任何一個與 Clone filshing 相似。 CEH 指南強調Clone filshing 具有高度說服力， 因為資訊是基於受害者可能記得和信任的真正的先前通訊。 由於攻擊者幾乎從一個合法的資訊中保留了一切，並且只改變了可操作的惡意連結，所以這個情境是克洛內·菲興(Clone Phishing)的教科書例子。","s":"term"},{"n":69,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"A penetration tester is tasked with mapping an organization ' s network while avoiding detection by sophisticated intrusion detection systems (IDS). The organization employs advanced IDS capable of recognizing common scanning patterns. Which scanning technique should the tester use to effectively discover live hosts and open ports without triggering the IDS?","o":["Execute a FIN scan by sending TCP packets with the FIN flag set","Use an Idle scan leveraging a third-party zombie host","Conduct a TCP Connect scan using randomized port sequences","Perform an ICMP Echo scan to ping all network devices"],"a":[1],"e":"CEH v13 強調 Idle Scan 是最隱蔽的偵察方法之一，專門設計以避免被 IDS 和安全監測工具偵測。 Idle scan spower a \" zombie 主機\"--一個具有可預見 IPID 序列的系統--將所有探測器封包透過它，因為沒有封包直接源於攻擊者的 IP， IDS 系統無法將連接埠掃描歸屬於攻擊者。 CEH 強調這種技術在攻擊者與目標之間產生零直接流量， 使其極易被高監控的網路所避免和理想。 FIN 掃描(可選 A)有些隱蔽，但仍由攻擊者出自並可被探測。 TCP Connect 掃描(可選 C)是最可探測的，因為它們完成全連線。 ICMP Echo 掃描(可選 D)容易被 IDS 記錄並被標記。 idle 掃描在仍然識別開放埠和活主機的同時，特別適合繞過高階偵測系統。"},{"n":70,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a red team engagement at a technology startup in Austin, ethical hacker Priya simulates an internal attacker by connecting a laptop to the corporate LAN. Within minutes, nearby workstations begin receiving incorrect network settings such as altered gateways and DNS servers. Employees trying to access the intranet are redirected to fake login portals hosted on Priya's machine. Security tools record temporary IP conflicts, but no alerts are triggered against the altered traffic paths. Which attack technique did Priya most likely use?","o":["DHCP Starvation Attack","DNS Cache Poisoning","Rogue DHCP Server Attack","Packet Sniffing"],"a":[2],"e":"正確答案是 C。 Rogue DHCP 伺服器 攻擊，因為觀察到的衝擊是 LAN 上的使用者端機器開始接收不正確的網路設定參數--具體修改了預設閘道器和 DNS 伺服器位址--在 Priya 連線了她的膝上型電腦後不久。 在符合 CEH LAN 攻擊概念中，如果攻擊者引入了回應 DHCP 發現的未經授權的 DHCP 服務，比合法 DHCP 伺服器更快的請求，則會發生 rroad DHCP 攻擊。 結果，端點接受攻擊者提供的租賃選項，透過攻擊者控制的基礎設施可以改變流量方向。重定向到“ Priya 機器上的假登入入口網站” 符合惡意 DHCP 選項濫用。 透過提供 road109 伺服器( 或更改 DNS 相關選項)， 攻擊者可以解決攻擊者IP 的內部主機名稱( 如 Internet URL)， 透過 偽造的 入口網站實現 認證資訊 收割。 透過提供 road 預設閘道器， 攻擊者可以定位為受害者流量的網路路徑， 允許 中間人 樣式擷取、 流量操縱和 工作階段劫持。 提及\"臨時 IP 衝突\"進一步支援了 road DHCP 行為，因為攻擊者 DHCP 伺服器可以發出與合法範圍相重疊的位址或引起重複的任務，產生衝突和不穩定。為什麼其他選項不準確:DHCP 飢餓涉及用偽造的 MAC 位址請求來將合法的 DHCP 池耗盡，常常是當時站起流氓 DHCP伺服器的前身。 方案強調客戶正在積極接收惡意設定(gateway/DNS)， 以無賴為標誌的伺服器級，而不是單飢餓。 DNS快取中毒目標 DNS 解凍器/caches 並且本身並不導致用戶端突然獲得新的閘道器/DNS 設定。 封包嗅探是被動的，而不解釋用戶端正在重新設定 或被重新定向。因此，普裡亞最有可能執行一次無賴 DHCP 伺服器攻擊來重新設定端點並引導使用者去釣魚入口網站。","s":"term"},{"n":71,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at Pacific Shipping Co. in Seattle, ethical hacker Mia Chen evaluates the defenses protecting the company ' s web-facing servers. She observes that the security system is not only checking basic packet headers but also validating session state and performing some application-level analysis. This multilayer approach makes it more difficult for Mia to bypass the firewall using simple fragmentation or tunneling attacks. Which type of firewall is Mia most likely facing?","o":["Packet Filtering Firewall","Stateful Multilayer Inspection Firewall","Application-Level Firewall","Circuit-Level Gateway Firewall"],"a":[1],"e":"所描述的防火牆所做的不僅僅是簡單的頭檢查:它正在驗證工作階段狀態，並且還進行一些應用級分析。這種組合是國有多層檢查防火牆的特徵。 這種防火牆型擴充套件出傳統的封包過濾，透過追蹤網路連線狀態(如 TCP 握手進取，已建立工作階段，預期旗標和序列行為)，並跨多個 OSI 層進行檢查。 因為它理解流量是否屬於合法，已建立工作階段，因此可以遮蔽許多可能透過無國籍過濾的偽造的或出文封包。提到更難以分解或地道攻擊來繞道這一點進一步支援了這一點。 無國籍的封包-過濾防火牆主要依靠源/destinationIP 連接埠和協定欄位。 攻擊者可能試圖將地道分割出跨越封包的有效酬載並逃避簡單化檢查，或者利用地道來封裝流量來隱藏被禁內容。 一個狀態多層的防火牆，透過保持連線表，並重新組裝或與工作階段上下文相連線的流量，更能偵測出不符合有效工作階段行為的異常，並應用更深的檢查政策。為什麼其他選擇不太合適:一個封包過濾防火牆(A)側重於基本頭欄位，一般是無國籍的，與米婭觀察到的相反。應用級防火牆(C)(代用防火牆)可以進行深度應用檢查，但情境強調一種將狀態追蹤與應用級檢查相結合的多層次方法--比純應用代理模型更符合狀態多層次檢查。一個 Circuit-level Gateway 防火牆 (D) 驗證了工作階段建立(例如 TCP 握手)並建立了虛擬電路，但一般不會對內容進行有意義的應用級分析。因此，最好的匹配是 B。 Stateful 多層檢查防火牆。","s":"term"},{"n":72,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"Which of the following is the primary goal of ethical hacking?","o":["To disrupt services by launching denial-of-service attacks","To identify and fix security vulnerabilities in a system","To steal sensitive information from a company ' s network","To spread malware to compromise multiple systems"],"a":[1],"e":"CEH 課程軟體中定義的道德駭客，是識別資訊系統中的弱點、弱點和錯位的經授權的合法過程。 首要目標是在惡意行為者能夠利用這些弱點、弱點和錯位之前，透過發現問題來加強安全。 道德駭客遵循嚴格的法律準則，獲得書面許可，並在規定的範圍內運作，以確保他們的活動對組織的安全態勢作出積極貢獻。 與惡意駭客行為不同，目的不是要偷取資料、造成傷害或破壞行動。 道德駭客使用相同的工具、技術，而且 CEH 強調，道德駭客透過使各組織加強環境並主動減輕威脅，支援深入防禦戰略。 因此，識別和確定弱點是道德駭客的核心任務。"},{"n":73,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"You are performing a security audit for a regional hospital in Dallas, Texas. While monitoring the network, you discover that an unknown actor has been silently capturing clear-text credentials and analyzing unencrypted traffic flowing across the internal Wi-Fi network. No modifications have been made to the data, and the attack remained undetected until your assessment. Based on this activity, what type of attack is most likely being conducted?","o":["Passive attack","Distribution attack","Close-in attack","Insider attack"],"a":[0],"e":"正確答案是 A.被動攻擊，因為所述活動涉及監測和捕獲在符合 CEH 的資訊保安概念中，被動攻擊由攻擊者竊聽的目標--觀察流量以蒐集使用者名稱/passwords、工作階段識別碼、網路模式或敏感內容等情報--來定義。 劇情明確規定演員\"靜默地捕捉出清晰的正文認證資訊\"並\"分析出未加密的流量\"，\"資料沒有修改\"，這些都是封包嗅探等被動攻擊的簽名指標和流量分析。在內部的 Wi-Fi 網路上，當加密弱或缺失時，或者當使用者存取以明文傳輸認證資訊的服務時，被動攻擊特別有效。 攻擊者可以捕獲封包並重建敏感資訊，特別是在存在遺留協定或錯誤設定的情況下。 Because。被動攻擊者不需要注入或修改封包，他們往往會避免產生異常，如再傳送，偽造的回應，或出乎意料的路由變化--幫助他們保持不被發現，與快取一致。為什麼其他選項不合適: 分散式攻擊不是這種行為的標準分類，也沒有具體描述對流量的靜默觀察。 近距離攻擊指取決於物理相近性的攻擊(例如肩上衝浪，物理相接，靠近目標的地方擷取等)。 雖然 Wi-Fi 嗅探可以要求相近，但問題中的定義特徵是沒有資料修改的非侵入性觀察--即被動攻擊。 內幕攻擊與攻擊者的身分/role(一個可信賴的內部人)有關，此處沒有確立；情節只描述行為，而不是演員是誰。因此，所描述的認證資訊捕獲和流量分析不加修改，最清楚地表明瞭被動攻擊。","s":"term"},{"n":74,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"long","q":"Maya Patel from SecureHorizon Consulting is called to investigate a security breach at Dallas General Hospital in Dallas, Texas, where a lost employee smartphone was used to access sensitive patient records. During her analysis, Maya finds that the hospital ' s mobile security policy failed to include a contingency to remotely secure compromised devices, allowing continued access to confidential data even after the device was lost. Based on this gap, which mobile security guideline should Maya recommend preventing similar incidents?","o":["Utilize a secure VPN connection while accessing public Wi-Fi networks","Install device tracking software that allows the device to be located remotely","Register devices with a remote locate and wipe facility","Use anti-virus and data loss prevention DLP solutions"],"a":[2],"e":"情境中的核心故障是丟失的智慧手機仍然能夠存取敏感資料，這意味著組織缺乏有效的丟失裝置回應控制。 在符合 CEH行動裝置安全引導中，對丟失或被竊裝置最重要的保護之一是透過鎖定並擦除公司資料來遠端保護端點的能力。 通常透過移動裝置管理工具和企業機動性控制來執行。 遠端定位和擦拭設施的登記裝置可確保安全小組在發現裝置丟失後立即採取行動，從而減少視窗中，攻擊者可以使用儲存的工作階段，快取的認證資訊，被儲存的符號，或者應用程式存取以達到患者記錄等受保護資源。選項 C 是最佳答案，因為它既滿足了事件隱含的關鍵需求:定位能力幫助恢復和遠端擦拭，以便在恢復不確定的情況下消除資料暴露。在保健環境中，受保護的衛生資訊高度敏感，CEH 檔案強調在裝置失去實際控制時保護保密的補償控制。 遠端擦拭透過防止進一步存取和限制資料披露支援事件遏制。選項 B 只提供追蹤，在裝置無法被快速找回的情況下不保證資料保護。 選項 A 有助於保護在無人信任的網路上過境的資料，但無法解決已經認證到內部系統的被竊裝置的風險。 選項 D 可以幫助整體衛生，但防毒和 DLP 並不能可靠地阻止對合法認證的被丟失裝置的濫用。 遠端定位和擦拭是最直接的緩解這一確切缺口的方法。"},{"n":75,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"In Miami, Florida, cybersecurity analyst Laura Bennett is responding to a series of unauthorized access attempts targeting Sunshine Credit Union's online banking platform. She observes unusual network activity that suggests attackers may be intercepting session IDs transmitted over unsecured connections to hijack active user sessions. To prevent further compromise, Laura works with the network team to apply a control that secures session-related communications throughout the entire portal, ensuring sensitive tokens are no longer exposed to interception during user interactions. What countermeasure should Laura implement to prevent session hijacking in this scenario?","o":["Regenerate the session ID after a successful login","Implement SSL to encrypt all information in transit via the network","Use restrictive cache directives such as Cache-Control no-cache","Do not create sessions for unauthenticated users"],"a":[1],"e":"情境清楚顯示擷取工作階段 ID 在無安全連線上造成的工作階段劫持風險。 在符合 CEH 的網路安全中，當工作階段的符號在沒有強運加密被傳送時，一個位於同個網路路徑上的攻擊者可以嗅出流量並捕捉到 cookie 或以 URL-為基礎的工作階段 ID，再被再用來冒充被害者。 直接處理整個入口網站過境攔截問題的最有效控制是對所有工作階段相關通訊執行SSL/TLS， 意思是每一頁， 並且可以攜帶認證狀態的請求由 HTTPS 保護。這可以防止被動竊聽 並顯著地降低了中間人在正常使用者互動時捕獲工作階段識別碼的可行性。選項 A，登入後再生成工作階段 ID，是防止工作階段固定的重要防禦手段，但如果攻擊者後來透過明文 HTTP 傳輸，它不會阻止偷取新的工作階段權杖。 選項 C，快取控制指令，有助於防止敏感頁面被儲存在共享快取或瀏覽器中。歷史，但並不能保護工作階段 ID 的網路被嗅探。 選項 D 為未經身分驗證的使用者避免了工作階段，可以減少一些追蹤曝光，然而這裡的核心問題是被認證為被加密的工作階段的運輸被劫持。因此，在整個入口網站實施 SSL/TLS， 通常與安全的 Cookie 旗結合 嚴格 HTTPS 執法， 是對所描述的以擷取為主的工作階段劫持的正確反措施。"},{"n":76,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"Which advanced session hijacking technique is hardest to detect and mitigate in a remote-access environment?","o":["Session sidejacking over public Wi-Fi","ARP spoofing on local networks","Brute-force session guessing","Cookie poisoning"],"a":[1],"e":"ARP 欺騙 - 基於工作階段劫持在 CEH v13Web 應用程式和網路攻擊中被確定為最隱蔽和最難發現的工作階段折中技術之一，尤其是在內部或 VPN 連線的網路中。在 ARP 欺騙中，攻擊者會毒死 ARP 快取，以定位為中間人(MitM)。 一旦到位，他們可以默默地擷取，修改或重放工作階段資料--即使在使用加密時--透過。在端點之間透明地調整流量方向。選項 A(側式劫機)被減輕 HTTPS。 選項 C(工作階段猜測)是吵鬧而可被察覺的。 選項 D(cookie 中毒)依賴於薄弱的驗證，透過完整性檢查更容易被偵測出。 CEHv13 強調 ARP 欺騙特別危險，因為:它利用了可信賴的本機網路行為不需要直接斷開加密使用者和應用程式往往看不見因此，選項 B 是發現和減輕挑戰的最有挑戰性的，也是正確答案。","s":"term"},{"n":77,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"short","q":"An IoT traffic light shows anomalous traffic to an external IP and has an open port. What should be your next step?","o":["Attempt reverse connections","Isolate the device and investigate firmware","Modify firewall rules only","Conduct full network penetration testing"],"a":[1],"e":"CEH v13 強調 IoT 和智慧城市環境高度敏感和安全關鍵。 當一個 IoT 裝置顯示異常出行和未經授權的開放埠時，這強烈表明裝置妥協。正確的即時反應是隔離被影響的裝置來防止平相移動並保護公共安全。 CEH v13 進一步強調了韌體分析的重要性，因為 IoT 惡意軟體經常停留在韌體級別來保持持久性。嘗試反向連線(備選 A)是危險的，可能違反操作安全。防火牆的改變(備選 C)本身並不涉及已經損壞的裝置。 全面穿入測試(備選 D)在以後是適當的，但並不是立即的封接步驟。因此，選項 B 與 CEH v13 事件處理最佳做法一致，適用於 IoT 和 OT 環境。"},{"n":78,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"In your role as a cybersecurity analyst at a large e-commerce company, you have been tasked with reinforcing the firm's defenses against potential Denial-of-Service (DoS) attacks. During a recent review, you noticed several IP addresses generating excessive traffic, causing an unusually high server load. Inspection of packets revealed that the TCP three-way handshake was never completed, leaving multiple connections in a SYN_RECEIVED state. The intent appears to be saturating server resources without completing connections. Which type of DoS attack is most likely being executed?","o":["SYN Flood","Smurf Attack","Ping of Death","UDP Flood"],"a":[0],"e":"此情境明確顯示有 SYN 泛洪攻擊，是 CEHv13 網路與邊界入侵中討論的經典阻斷服務技術。 在正常的 TCP 三向交握中，有使用者端傳送了 SYN，伺服器與 SYN-ACK 反應，使用者端完成與 ACK 的接通。 在 SYN 泛洪中，襲擊者傳送了大量的 SYN 封包但從未完成接手。如 CEH v13 所描述，伺服器為每次半開通的連線分配記憶體和資源，將其放入SYN_RECEIVED 狀態。 當這些連線沒有最終確定時，伺服器的連線表會變得飽和，使合法使用者無法建立新的工作階段。其他選項不正確 :精靈攻擊依賴於 ICMP 放大，而不是 TCP 握手。平定死因使用不規範的 ICMP 封包。 UDP 泛洪會使用UDP 來覆蓋港口，而不是 TCP 工作階段州。 CEH v13 強調 SYN 泛洪是最常見的地層 4 DoS 攻擊之一，因為其簡單而有效。","s":"term"},{"n":79,"c":"社交工程","ce":"Social Engineering","t":"short","q":"Which scenario best represents a social engineering attack?","o":["Fake IT call requesting credentials","Packet sniffing by an IT executive","Malware introduced during OS update","Unlocked workstation accessed by stranger"],"a":[0],"e":"根據 CEH v13 社交工程，社交工程攻擊操縱了人類信任而不是技術弱點。 選項 A 描述了一種典型的藉口攻擊，攻擊者冒充 IT 工作人員並編造假問題來誘騙受害者透露認證資訊。此情境與 CEH 定義完全一致，因為:攻擊者依靠權威冒充受害人是社會操縱的無需進行技術開發選項 B 是一項合法的安全活動。 C 選項是意外惡意軟體引入，而不是社交工程。選項 D是物理過失開發，不是直接社交工程互動。 CEHv13 強調，藉口攻擊對不熟悉程式的新僱員極為有效，因此，選項 A 是正確的。","s":"term"},{"n":80,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"A web server is overwhelmed by many slow, incomplete HTTP connections. What attack is occurring?","o":["Slowloris attack","ICMP flood","UDP flood","Fragmentation attack"],"a":[0],"e":"這個情境描述了 Slowloris 攻擊，這是 CEHv13 網路與邊界入侵所覆蓋的經典應用層 DoS 攻擊。 Slowloris 透過開啟多條HTTP 連線並非常緩慢地傳送資料來工作，使伺服器無法關閉連線。由於連線看起來合法，伺服器保持了開通狀態，最終使連線池耗盡。 這導致合法使用者體驗超時和無法使用服務，如上所描述的那樣。 ICMP 和 UDP 泛洪消耗了頻寬，這被排除了。 分解攻擊目標為封包處理，而不是應用層工作階段。 CEH v13 強調 Sydloris 特別危險，因為它需要最小的頻寬並繞過許多傳統的 DoS 防禦。 因此，選項 A 是正確的。","s":"term"},{"n":81,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"In the hushed offices of Pinecrest Solutions in Denver, network security analyst Lisa Nguyen began a covert review of a recent spike in network access issues reported by the sales team. The trouble surfaced during a low-traffic period when agents couldn ' t reach their CRM system, prompting Lisa to examine the subnet logs. She spotted irregular IP assignment attempts linked to an unfamiliar device. Acting quickly, Lisa entered a series of commands on the Cisco switches and later confirmed that connectivity issues had ceased without any new devices appearing in the logs. Which command did Lisa most likely use to address the issue?","o":["Switch(config)# ip dhcp snooping vlan 10","Switch(config)# ip arp inspection vlan 10","Switch(config)# ip dhcp snooping","Switch(config-if)# switchport port-security"],"a":[0],"e":"症狀指向了無賴的 DHCP 情境，CEH 材料通常描述為攻擊者用來破壞網路或進行中間人攻擊的方法。 如果一個未經授權的裝置開始回答 DHCP 的請求比合法 DHCP 伺服器更快，端點可能會收到錯誤的 IP 設定。例如假的預設閘道器或 DNS伺服器。 這導致像 CRM 系統這樣的內部應用程式失去連線，並且可以透過攻擊者控制的主機默默地引導流量。 這個問題明確提到\"非正常的 IP 任務嘗試\"綁在一個不熟悉的裝置上，它與無賴的 DHCP 行為，而不是 ARP 只被操縱或簡單的MAC 限制違反行為緊密相聯。 DHCP snooping 是思科交換器上的一個第 2 層安全特性，可以過濾未信任的 DHCP 訊息並只允許在可信任的埠上授權的 DHCP 伺服器。 當為受影響的 VLAN 啟用時，交換器將放棄 DHCP 的出價並承認在未信任的接入埠上到達，阻止了無賴裝置的租賃位址。 選項 A，ipdhcpsnooping vlan10,是應用 DHCPsnooping 保護來體驗這個問題的特定 VLAN 的指令，它與所描述的\"subnet 日誌\"和區域性影響相匹配。選項 B，動態 ARP 檢查，主要減輕 ARP欺騙 並依靠 DHCP snooping 繫結，但不能直接阻止無賴 DHCP 租賃。 選項 D，連接埠 安全性，可以限制 MAC 位址，但不能具體地阻擋 DHCP 伺服器 行為。 選項 C 使特性在全球範圍得以實現，但不能阻止。目標為 VLAN； A 中的VLAN 特定啟用最符合情況， 並立即恢復正確的位址和連線。","s":"term"},{"n":82,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"While testing a web application that relies on JavaScript-based client-side security controls, which method is most effective for bypassing these controls without triggering server-side alerts?","o":["Reverse-engineering the proprietary encryption algorithm","Disabling JavaScript in the browser and submitting invalid data","Injecting malicious JavaScript into the login page","Using a proxy tool to intercept and modify client-side requests"],"a":[1],"e":"認證的道德駭客 (CEH)Web 應用安全模組強調，使用者端-側控無法被信任。禁用 JavaScript 允許攻擊者繞行:密碼 複雜執法 CAPTCHA 驗證輸入驗證邏輯選項 B 是最簡單和最有效的 CEH 批准的方法。選項 A 是不必要的，而且很吵鬧。備選 C 風險偵測。備選辦法 D 是有效的，但更為複雜和可探測。 CEH 明確教測試者禁用 JavaScript 來評價伺服器-側執行。"},{"n":83,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"Which technique is most likely used to evade detection by an Intrusion Detection System (IDS)?","o":["Fragmenting malicious packets into smaller segments","Using self-replicating malware","Sending phishing emails","Flooding the IDS with ping requests"],"a":[0],"e":"CEHv13 解釋道:封包破碎是一種經典而有效的 IDS 逃生技術。 透過將惡意有效酬載分解為更小的碎片，攻擊者試圖阻止IDS 正確重建完整的封包流，從而避免了簽名偵測。許多 IDS 系統依靠封包重灌和圖案相匹配。 Flagmented 封包可以混淆或超載重灌過程，特別是如果 IDS 設定不完善。 CEH v13 特別列出破碎，相重疊的碎片，和出門的封包作為繞過網路防禦的逃逸技術。選項 B 描述惡意軟體的傳播，而不是 IDS 逃逸。 選項 C 是一個 社交工程 攻擊，與 IDS 偵測無關。 選項 D 是一個 阻斷服務 嘗試，而不是一種隱形逃逸方法。 CEHv13 強調，防止以分裂為基礎的逃逸需要適當的正常化 並重新組合到 IDS/IPS 系統中。因此， 選項 A 是正確答案。"},{"n":84,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"In the crisp mountain air of Denver, Colorado, ethical hacker Lila Chen investigates the security framework of MedVault, a US-based healthcare platform used by regional clinics to manage patient data. During her assessment, Lila manipulates session parameters while navigating the patient portal's dashboard. Her tests reveal a critical flaw: the system allows users to access sensitive medical records not associated with their own account, enabling unauthorized changes to private health data. Upon deeper inspection, Lila determines that the issue stems from the application allowing users to perform actions beyond their assigned roles rather than failures in encryption, unsafe object handling, or server configuration. Which OWASP Top 10 2021 vulnerability is Lila most likely exploiting in MedVault's web application?","o":["Security Misconfiguration","Insecure Deserialization","Cryptographic Failures","Broken Access Control"],"a":[3],"e":"斷開存取控制是正確選擇，因為情境描述使用者能夠存取和修改資源，而這些資源應當限制在其它使用者或角色。 在符合CEH 的網路測試中，在應用程式未能在伺服器側一致執行授權檢查時會出現存取控制缺陷。 操縱工作階段參數後再取回\"與自己帳戶無關的敏感病歷\"是授權繞行的經典指標，常被視作不安全的直接物件參考，參數篡改，或水平和垂直權限提升。當一個使用者在同一特權級別存取另一個使用者的資料時，水平升級是當一個使用者執行保留給更高特權角色的動作時，垂直升級是當一個使用者執行指定角色以外的動作時，即提示使用者可以執行指定角色以外的動作，這就是對被突破的授權執行的定義。其他選項與描述的根因不相符合。 Cryptographic 失敗側重於弱或缺失的加密， 並且沒有解釋認證使用者為何可以到達未經授權的記錄。 不安全的反序列化涉及不安全的反序列化導致遠端程式碼執行或透過序列化物件來篡改資料，這裡沒有註明。 安全設定錯誤範圍更寬並可以促進曝光，但情境強調角色和資源許可繞行，而不是錯誤地設定出伺服器頭，預設帳戶，或被曝光的管理員介面。 CEH 最佳做法中的緩解包括:對每一份請求執行伺服器-側授權，使用逐一預設的拒絕政策，驗證認證使用者被允許存取特定記錄識別符號，執行以角色為基礎的強力存取控制，登入存取拒絕，並增加自動測試以防止 IDOR 和權限提升迴歸。","s":"term"},{"n":85,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at a manufacturing company in Detroit, Amanda, a senior security consultant, scans several legacy Linux servers. On one host, she discovers an open port used for file transfer that allows anonymous login. Once connected, she is able to view the directory structure and check available files, which helps her identify potential sensitive information exposure. She also notices background traffic on a UDP service related to NetBIOS name lookups, but she continues probing the file transfer service to confirm user access weaknesses. Which ports and services should Amanda prioritize for this enumeration activity?","o":["TCP 23 and UDP 137, 138","TCP 21 and UDP 137","TCP 25 and UDP 138","TCP 139 and UDP 137, 138"],"a":[1],"e":"Amanda 的主要列舉焦點是允許匿名登入和目錄上市的\"檔案傳輸\"服務，這明確顯示 FTP，執行於 TCP 連接埠 21 (控制通道)。 匿名 FTP 設定錯誤是一個眾所周知的曝光風險，因為它可以允許未經身分驗證的使用者瀏覽或下載檔案，有時甚至根據權限上傳內容。 假設 FTP 通常包括驗證匿名存取，列出目錄，檢查可讀檔案內容，識別可寫資料夾，並核實伺服器是否漏出橫幅，系統型別，或使用者/account 提示。該情境還提及了與 NetBIOS 名稱外觀相關的背景 UDP 流量，對應為 UDP 連接埠 137(NetBIOS 名稱服務)。 雖然 NetBIOS 在 Windows 環境中更為常見，但仍能出現在混合系統或遺留相容服務的網路上。 問題在於，鑑於她的列舉活動，包括 FTP 存取的弱點和注意 NetBIOS 名稱的查詢流量，哪些港口和服務將優先排序。選項 B(TCP21 和 UDP137)都匹配:TCP 21=FTP 控制連接埠，直接與匿名登入和目錄列舉繫結。UDP137=NetBIOS 名稱服務，匹配所觀測到的名稱-外觀流量。為何其他選項不合適:TCP 23 為 Telnet (A)，而非所描述的檔案傳輸服務。 TCP25 為 SMTP (C)，與匿名檔案傳輸登入無關。 TCP139 是 NetBIOS 工作階段 Service (D)，在NetBIOS 上更多與 SMB 相關，不特地與 UDP 名稱取景，它省略了 FTP 連接埠是她活動的核心。因此，正確的選擇是 B。TCP 21 和 UDP137。","s":"term"},{"n":86,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"During LDAP-based enumeration, you observe that some critical information cannot be retrieved. What is the most likely reason?","o":["LDAP directory data is protected by Access Control Lists (ACLs)","LDAP is running on a non-standard port","Hosts are in a different subnet","Network congestion is causing dropped requests"],"a":[0],"e":"CEH v13 解釋出:LDAP 列舉經常被存取控制 Lists(ACLs)所限制。 敏感目錄物件和屬性經常受到保護來防止未經授權的披露。即使在 LDAP 可以存取時，ACLs 也能限制使用者，組和設定資料的能見度。"},{"n":87,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"At Pinnacle Financial Services in Chicago, Illinois, ethical hacker Sarah Thompson is conducting a penetration test to evaluate the security of the company ' s online banking portal. During her assessment, Sarah positions herself on the internal network and uses a sniffer to capture traffic between a user's browser and the banking server. She quietly collects session data, including user IDs and authentication tokens, without interfering with the ongoing communication. Later, she plans to use this information to impersonate a legitimate user in a controlled test environment to demonstrate potential risk to the bank's IT team. What type of session hijacking is Sarah performing during this phase of her penetration test?","o":["Session Fixation Attack","Active Session Hijacking","Man-in-the-browser Attack","Passive Session Hijacking"],"a":[3],"e":"被描述的活動是被動的工作階段劫持，因為 Sarah 只觀察並捕獲工作階段相關的資訊，而不改變，注入，或擾亂活的使用者端伺服器通訊。 在 CEH 覆蓋工作階段劫持中，關鍵區別在於攻擊者是否只是竊聽以取得工作階段識別碼，或者是否積極即時控制工作階段。 被動劫持側重於嗅探流量，蒐集認證材料，如工作階段 ID，Cookie，無記名符號，或者其他認證資訊以明文傳送或透過弱的運輸保護被曝光。 Expot 明確稱她\"靜靜地蒐集\"。工作階段資料\"，這樣做\"不受干擾\"，這是被動劫持的標誌。當應用程式使用未加密的 HTTP，弱的 TLS 設定時，或者當權杖以能夠被網路捕獲的方式被曝光時，這通常都是可行的。 被取得後，攻擊者可以重放或再用被竊取的活物來假冒被害者，這與莎拉日後計劃使用被俘的活物來證明在受控環境中的風險相匹配。 CEH 強調工作階段活物在認證後有效成為了使用者的身分；如果一個活物可以偷取，它們往往可以完全繞過登入。選項 B，活動工作階段劫持，將涉及操縱連線，注入封包，去同步使用者端，或接管工作階段活動。 選項 A，工作階段固定，將涉及強制 a。受害人使用攻擊者選擇的工作階段 ID，而不是嗅探。 選項 C，即瀏覽器中的人，需要瀏覽器內部的惡意軟體來擷取或修改交易，但並沒有對此進行描述。 因此，被動工作階段劫持是正確的。","s":"term"},{"n":88,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"During a red team test, a web application dynamically builds SQL queries using a numeric URL parameter. The tester sends the following request: http://vulnerableapp.local/view.php?id=1; DROP TABLE users; The application throws errors and the users table is deleted. Which SQL injection technique was used?","o":["UNION-based SQL injection","Stacked (Piggybacked) queries","Boolean-based SQL injection","Error-based SQL injection"],"a":[1],"e":"CEHSQL 注入模組定義了堆疊的(piggybacked)查詢，指攻擊者使用分號等語句分隔器附加一個額外的 SQL 語句來進行攻擊。在這種情境下，攻擊者在原查詢後執行了第二個查詢(DROPTABLE 使用者)，導致破壞性行為。選項 B 是正確的。選項 A 擷取資料， 不執行破壞性命令。選項 C 推斷邏輯結果。選項 D 依賴於錯誤訊息來擷取資料。 CEH 將堆放的查詢歸類為高影響 SQL 注入攻擊。","s":"term"},{"n":89,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"In the bustling digital marketplace of Miami ' s tech corridor, ethical hacker Sofia Alvarez probes the virtual defenses of RetailRush, a US-based online retailer hosting thousands of daily transactions. Tasked with exposing weaknesses in the web server ' s URL processing, Sofia submits crafted requests to manipulate resource paths. Her tests uncover a severe flaw: the server grants access to restricted system files, exposing sensitive configuration data. Further scrutiny reveals the issue stems from the server ' s failure to validate input paths, not from header manipulation, cached content tampering, or credential compromise. Committed to hardening the platform, Sofia drafts a precise report to direct the security team toward immediate fixes. Which web server attack type is Sofia most likely exploiting in RetailRush ' s web server?","o":["Directory Traversal Attack","Web Cache Poisoning Attack","HTTP Response Splitting Attack","Password Cracking Attack"],"a":[0],"e":"一個目錄 traversal 攻擊，也叫路徑 traversal，利用了 web 伺服器或 web 應用程式如何透過 URL 或參數處理使用者提供的檔案和目錄路徑的弱點。 在符合 CEH 名詞中，攻擊者工匠要求使用\"點-點-斜\"圖案等倒行序或編碼等同物來逃避被預定的網路根或被允許的目錄併到達基礎檔案系統中的敏感位置。 問題稱索菲亞\"管理資源路徑\"併成功存取\"限制性系統檔案\"，揭示出\"敏感的設定資料\"，這是目錄 traversal 的決定性結果:未經授權存取那些不應該透過網路介面直接擷取的檔案，包括應用程式設定檔，伺服器設定，環境檔案，或其他 OS-級別資源。提示符還用描述問題所在來消除其他選項。 它不是標頭操縱， 它更符合 HTTP 回應分解或標頭注入行為。 它不是快取的內容篡改， 它指向了網路 快取中毒。 它不是認證資訊妥協， 它表示密碼破解。 相反地，根由是明確\"無法驗證輸入路徑\"，匹配了 CEH 強調輸入驗證不充分，以及檔案存取前路徑正常化或犬形化不當。 防禦性指導一般側重於嚴格允許列出可取得資源，使路徑具有條理並強制執行固定的基目錄，遮蔽轉錄符及其編碼形式，使用間接引用而不是原始檔案路徑，如果嘗試轉錄，則應用最小優先權限來減少影響。","s":"term"},{"n":90,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"You are an ethical hacker at SecureNet Solutions, conducting a penetration test for BlueRidge Manufacturing in Denver, Colorado. While auditing their wireless network, you observe that the access point uses a security protocol that employs the RC4 algorithm with a 24-bit initialization vector IV to encrypt data between network clients. Based on the observed encryption characteristics, which wireless encryption protocol is the access point using?","o":["WPA","WPA2","WEP","WPA3"],"a":[2],"e":"WEP 是唯一匹配 RC4 和 24 位初始化向量的選項。 在 CEH 材料中，WEP 被描述為早期的 Wi-Fi 安全標準，它使用RC4 流密碼並加上一個用共享金鑰相接而成的短 24 位 IV 來組成每-封包 RC4 金鑰流。 關鍵弱點是 24 位 IV 對於繁忙的網路來說太小了。 由於可能 IV 值僅有約 1670 萬，IV 再利用很快發生，尤其是在高流量下。 當 IVs 重複時，同樣的RC4 金鑰流可以被再用，允許攻擊者對所捕獲的封包進行統計攻擊並取回 WEP 金鑰。 CEH 強調，問題不僅在於 IV 再用，而且在於 WEP 使用 RC4 與 IVs 的弱點，一旦蒐集到足夠多的封包後，就可以使用隨時可用的工具進行實用金鑰回收。WPA 和 WPA2 在 WEP 上改進了採用更強的金鑰管理和完整性保護。 WPA 使用 TKIP，在許多部署中仍然依賴於 RC4,但並不以與 WEP 相同的弱化方式使用簡單的 24 位 IV，並且包括了每克-封包金鑰相混合和額外的完整性檢查。 WPA2和 WPA3 完全從 RC4 移走，使用 AES 基於保護，如 WPA2 和更現代化的 CCMP。 WPA3 中的增強。 因此，被觀測到的 RC4 帶有 24 位 IV 精確地識別出 WEP。","s":"term"},{"n":91,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester is evaluating a secure web application that uses HTTPS, secure cookie flags, and regenerates session IDs only during specific user actions. To hijack a legitimate user ' s session without triggering security alerts, which advanced session hijacking technique should the tester employ?","o":["Perform a man-in-the-middle attack by exploiting certificate vulnerabilities","Use a session fixation attack by setting a known session ID before the user logs in","Conduct a session token prediction attack by analyzing session ID patterns","Implement a Cross-Site Scripting (XSS) attack to steal session tokens"],"a":[2],"e":"CEH v13 強調安全性強的應用程式使用 HTTPS，安全 Cookie，並用工作階段再生來防禦常見的工作階段劫持技術。 在這種硬化的環境中，傳統的攻擊如工作階段固定或簡單的 XSS 基於符號的盜取經常會失敗，因為工作階段 ID 在登入時的改變和安全旗會防止暴露。 剩下的可行方法是工作階段權杖預測，這是分析統計規律， en 素弱點，或工作階段 ID 生成演算法中的計時問題的高階攻擊。 CEH 討論到弱偽隨機數生成器(PRNGs)或可預見序列可以允許攻擊者。在不攔截流量的情況下計算一個有效的工作階段 ID。這種方法繞過 cookie 安全性，不依賴操縱使用者輸入，使其適合有強防禦的環境。MITM 攻擊(選項 A)需要憑證折中，這是不切實際的。工作階段 固定(選項 B) 失敗是因為應用程式重生符。 XSS(可選 D)當安全旗防止 JavaScript 存取 cookie 時無效。 因此， 符號預測是正確答案。"},{"n":92,"c":"社交工程","ce":"Social Engineering","t":"long","q":"A regional healthcare provider in Portland, Oregon, recently migrated its patient scheduling portal to a new cloud platform. Within days, multiple patients reported that when searching online for the clinic ' s appointment system, they were directed to a website that looked identical to the official portal. The fraudulent page appeared prominently in search engine results and prompted users to log in using their patient credentials. The URL closely resembled the legitimate domain name, and no internal DNS servers had been altered within the organization ' s infrastructure. Security analysts later determined that the attacker had created a convincing replica of the portal and manipulated search visibility so that unsuspecting users would voluntarily navigate to the malicious site. Which type of social engineering technique best explains this attack?","o":["Whaling","Pharming","Spear Phishing","Search Engine Phishing"],"a":[3],"e":"正確答案是\"搜尋引擎 Phishing\"。 CEH 社交工程材料解釋道，搜尋引擎的釣魚涉及建立欺詐網站並操縱搜尋能見度，這樣受害者透過搜尋結果而不是透過直接的電子郵件或資訊誘導來發現並存取惡意網站。 在這種情況下，尋找診所預約系統的病人會發現一個與官方的入口網站非常相像的假入口，在搜尋引擎結果中處於顯著位置。 這就是搜尋引擎釣魚的決定性模式。 傷害將涉及透過 DNS 或主機解析度操縱，靜靜地將使用者轉向欺詐網站。 但問題中特別指出，內部的 DNS 伺服器沒有被更改，使用者透過搜尋結果自願在伺服器上導航。 魚叉式網路釣魚需要直接傳送給受害者的定向通訊，而捕鯨則針對高知名度高的主管。 CEH 指南強調搜尋引擎釣魚可以特別有效，因為使用者相信他們正在獨立地找到合法服務。 由於攻擊者依賴於一個被克隆的出入口並被操縱的搜尋能見度，而不是直接傳送訊息或被 DNS 篡改，因此搜尋引擎Phishing 是最好的答案。","s":"term"},{"n":93,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"A web server experienced a DDoS attack that specifically targeted the application layer. Which type of DDoS attack was most likely used?","o":["HTTP flood attack","ICMP flood attack","UDP flood attack","SYN flood attack"],"a":[0],"e":"HTTP 泛洪攻擊是應用層(Layer 7)DDoS 攻擊，定義為 CEHv13。 在這次攻擊中，對手發出大量看來合法的 HTTPGET 或POST 請求來耗盡伺服器資源，如 CPU，記憶體，和應用執行緒等。 CEH v13 強調 HTTP 泛洪很難被探測，因為它們模仿了正常的使用者行為並經常繞過傳統的網路層防禦。其他攻擊活動在下層進行:ICMP，UDP，和 SYN 泛洪目標網路和運輸層。","s":"term"},{"n":94,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"mid","q":"A multinational company plans to deploy an IoT-based environmental control system across global manufacturing units. The security team must identify the most likely attack vector an Advanced Persistent Threat (APT) group would use to compromise the system. What is the most plausible method?","o":["Launching a DDoS attack to overload IoT devices","Compromising the system using stolen user credentials","Exploiting zero-day vulnerabilities in IoT device firmware","Performing an encryption-based Man-in-the-Middle attack"],"a":[2],"e":"CEHIoT 和 APT 威脅模組將 APT 組描述為高技能的對手，傾向於隱蔽，持久性，和先進的開發技術。 IoT 環境特別有吸引力，原因是:有限監測不經常更新韌體安全機制薄弱或專有 CEH 強調，APT 的演員經常在韌體中利用零時差的弱點來獲得長期，隱蔽的 IoT 系統的存取。 韌體級的開發可以讓攻擊者在逃避時保持持久性。傳統安全控制。選項 C 是正確的。選項 A 是吵鬧和短期的。選項 B 對於 APT 來說是常見的，但不太精密。與韌體開採相比，備選方案 D 是可能的，但次要的。 CEH 強調韌體安全是 IoT 部署中的一個關鍵關切。"},{"n":95,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"During security awareness training, which scenario best describes a tailgating social engineering attack?","o":["An attacker impersonates a customer to recover account credentials","An attacker leaves a malicious USB labeled \"Employee Bonus List\"","A person gains access to a secure building by following an authorized employee through a locked door","An email urges employees to enter credentials for an urgent system update"],"a":[2],"e":"經認證的道德駭客 (CEH)社交工程模組定義了尾翼是一個物理社會。工程攻擊，未經授權的人追蹤被授權的個人進入禁區。選項 C 精確匹配 CEH 的定義。選項 A 是藉口。選項 B 是誘餌。選項 D 是釣魚。 CEH 強調人身安全意識與網路防禦一樣重要。"},{"n":96,"c":"雲端運算","ce":"Cloud Computing","t":"short","q":"An attacker exploits a misconfigured S3 bucket containing application backups with database credentials. What cloud security failure category does this fall under?","o":["Misconfiguration","Insider threat","Zero-day vulnerability","Malware infection"],"a":[0],"e":"正確答案是 A， 設定錯誤。 當權限， 存取政策， 日誌， 加密， 或公共曝光設定設定不正確時， 亞馬遜 S3 等雲端儲存貯體變得脆弱。 在這種情境中，攻擊者並沒有利用新發現的軟體缺陷或使用惡意軟體；相反，他們正在利用設定不當的雲資源，暴露出敏感的備份資料和資料庫認證資訊.CEH 雲端計算安全話題，強調雲安全需要控制政策，硬化，身分和存取管理，以及設定管理來控制安全存取。。這些材料還識別出雲威脅，如資料丟失/breach、不安全的介面/APIs、權限提升和未經授權存取認證資訊。S3 儲存貯體的設定錯誤是專門與檢查一個桶是否可公開存取、是否啟用了日誌以及是否啟用了伺服器-側加密有關的。 因此，故障類別是設定錯誤，其潛在後果包括認證資訊暴露，資料被破壞，以及帳戶遭入侵。","s":"term"},{"n":97,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"You are Ethan Brooks, an ethical hacker at Vanguard Security Solutions, hired to perform a wireless penetration test for Pacific Logistics, a shipping company in Seattle, Washington. Your task is to identify all Wi-Fi networks in range without alerting the network administrators. Using a laptop with a Wi-Fi card, you monitor radio channels to detect access points and their BSSIDs without sending any probe requests or injecting data packets. Based on the described method, which Wi-Fi discovery technique are you employing?","o":["Network Discovery Software","Passive Footprinting","Wash Command","Active Footprinting"],"a":[1],"e":"劇情描述一種無線發現方法，即測試者只聽出氣波，不傳送探針請求或注入訊框。 在 CEH 術語中，這是被動的偵察，通稱無線上下文中的被動足跡。 被動地足跡依賴於捕捉和分析現有的 802.11 管理流量，如信標訊框(定期由出入口廣播)和寄給其他客戶的探測回覆，使測試者能夠識別 SSID，BSSID(出入口 MAC 位址)，通道號，所支援的資料率，有時還有安全能力， 並且不會產生可以提醒管理員或觸發無線入侵探測系統的流量。相比之下，主動的足跡則涉及傳送訊框-最顯著的探測請求-以徵求出入口的探測答覆，從而增加可探測性。 問題明確表明，伊森不會傳送探測器。探針請求並不會注入資料封包，它排除了主動方法。 \"網路發現軟體\"太通俗了；工具既可用於被動發現，也可以主動發現，但使用中的技術是由無線介質上的行為定義的，而不是軟體的存在。 \"Wash\"是一個與點數 WPS-啟用的無線基地台相關的特定工具/command；雖然可以在偵察期間使用， 問題在於測試更廣泛的技術，而不是具體的效用，這裡的決定性特徵是靜默地聆聽。 CEH 防守指導指出，被動發現更隱蔽，因為它能利用正常的信標行為。 組織透過使用無線監測，無賴 AP 偵測，強克加密設定，在可行的情況下使不必要的廣播癱瘓，並保持連續的無線安全評估來緩解偵察。","s":"term"},{"n":98,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester is testing a web application ' s product search feature, which takes user input and queries the database. The tester suspects inadequate input sanitization. What is the best approach to confirm the presence of SQL injection?","o":["Inject a script to test for Cross-Site Scripting (XSS)","Input DROP TABLE products; -- to see if the table is deleted","Enter 1 ' OR ' 1 ' = ' 1 to check if all products are returned","Use directory traversal syntax to access restricted files on the server"],"a":[2],"e":"以\"Tautology\"為主的 SQL 注入測試，如使用\"OR\"\"1\"=\"1\"，是驗證 SQL 查詢是否被使用者輸入所操縱的安全而有效的方法。 CEH 強調避免破壞性查詢，並使用邏輯表示式，如果注入成功，則會返回所有行。"},{"n":99,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"A cloud service provider in Singapore is refining its defensive monitoring strategy to identify large-scale denial-of-service attempts against hosted applications. The security engineering team wants a detection mechanism that continuously evaluates incoming traffic streams and statistically determines the exact moment when normal behavior shifts into anomalous activity. Rather than relying solely on static baselines or historical comparisons, the team prefers an approach that detects abrupt deviations in real time by identifying structural breaks in traffic metrics as they occur. Which DDoS detection technique best fits this requirement?","o":["Sequential Change-Point Detection","Wavelet-Based Signal Analysis","Traffic Pattern Analysis","Activity Profiling"],"a":[0],"e":"正確答案是 A。 序列變化點偵測。方案要求有一種技術來偵測流量行為從正常到異常的準確點。 這直接匹配序列變化點偵測。 CEHDoS/DDoS 偵測材料解釋用變點偵測來偵測 DoS 攻擊。，並使用非參數 CUSUM 演算法來偵測流量模式。它也注意到這種方法的計算間接費用較低。 和高準確度。選項 B。 以\"波\"為主的訊號分析是不正確的，因為\"波\"分析側重於訊號分解和以體積為主的異常探測，而不是專門識別準確的統計變化點。備選 C。 流量模式分析過於籠統，沒有具體描述結構性斷裂探測。備選 D。 活動分析將行為與平均流量率或基線進行比較，而問題要求突然即時發現變化點。因此，最好的答案是 A.序列變化點偵測。","s":"term"},{"n":100,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and loT Hacking","t":"mid","q":"At Horizon Legal Services in Boston, Massachusetts, ethical hacker Daniel Price is tasked with assessing the security of the firm ' s mobile case-tracking app. During testing, he finds that confidential case notes and client records are kept locally on the device without encryption. By browsing the file system with a standard explorer tool, he can open sensitive information without any authentication. Which OWASP Top 10 Mobile Risk is most clearly present in the app?","o":["Insecure Communication","Improper Credential Usage","Insecure Data Storage","Inadequate Privacy Controls"],"a":[2],"e":"正確答案是 C。 不安全的資料儲存，因為所描述的弱點是以不加密的方式在移動裝置上區域性儲存敏感資訊，並且只需瀏覽檔案系統即可存取。 在移動應用程式安全中，這是一個經典的風險類別:當一個應用程式儲存機密資料時(案例註釋，使用者端記錄，權杖，檔案，快取回覆，資料庫，日誌，日誌，日誌，日誌)， 或匯出檔案)，在清晰的文字中或不安全的位置，獲得裝置存取權的攻擊者--或使用備份擷取器，檔案探索器，ground/jailbroken 存取權，或持有儲存權限的惡意軟體--可以擷取該資料而無需對應用程式進行認證。劇情使得弱點不可混淆:丹尼爾可以使用\"標準探險者工具\"來開啟敏感記錄\"無需任何認證\"，這說明該應用程式在休息時沒有應用加密，安全金鑰處理，適當的檔案權限，以及安全的儲存機制等適當的保護。 在安全的移動設計中，敏感記錄應當使用平台支援的保護(例如，對金鑰使用 OS keystores/keychains，加密資料庫/files，並儘量減少本機保留)進行加密。 此外，app 應該避免儲存高度敏感受監管的資料，除非必需，並且應當執行安全的工作階段。控制和資料生命週期管理(快取控制，到期後，在企業設定中遠端擦拭支援)。為什麼其他的選項不是最合適的: 不可靠的通訊涉及在網路傳輸時的資料曝光(例如缺少 TLS，弱 TLS，MITM 易被感染性)，而這裡的問題純粹是區域性儲存。 Improper 認證資訊的用法涉及錯誤處理密碼，權杖，或認證機密(硬碼認證資訊，弱儲存認證資訊)，但即時關注儲存的記錄本身。 隱私控制不當的範圍較廣，通常涉及過度蒐集、不當披露或使用者隱私設定薄弱，而不是直接的明文儲存曝光。因此，目前最明顯的 OWASP 前十大移動風險是資料儲存不安全。","s":"term"},{"n":101,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"An energy infrastructure company in Tulsa, Oklahoma initiated a controlled phishing simulation targeting multiple operational departments. The test email claimed to originate from the corporate compliance office and instructed employees to \"complete a mandatory regulatory update within the next 30 minutes to avoid account suspension.\" The message used a broad salutation instead of employee names and lacked the standard corporate signature footer normally appended to official communications. Additionally, security analysts observed that the embedded hyperlink displayed the organization's domain in the message body; however, when examined more closely, the actual destination resolved to a shortened external URL redirecting to an unrelated host. From a defensive analysis standpoint, which indicator provides the strongest technical validation that the message is malicious?","o":["Presence of Aggressive Urgency Language","Identification of Hover-Mismatch URLs in the Embedded Link","Absence of a Formal Corporate Signature","Use of Generic Greetings Rather than Individualized Addressing"],"a":[1],"e":"正確答案：識別嵌入連結中滑鼠懸停顯示與實際目的地不符的 URL。最有力的技術指標，是可見的連結文字顯示組織網域，但實際目的地卻指向縮短的外部 URL，之後又重新導向至無關主機。這直接證明呈現給使用者的連結與真正目的地不一致。\n\n符合 CEH 的社交工程教材指出，網路釣魚郵件經常偽裝成合法郵件，誘使使用者點擊連結，再將其重新導向假網站或惡意目的地。滑鼠懸停所顯示的 URL 與實際目的地不符，是直接的技術欺騙證據。\n\nA 的急迫性語句雖然可疑，但屬於行為或社交線索；C 的簽名缺失也可能只是格式或範本問題；D 的通用問候語是常見網路釣魚指標，但在技術上的決定性不如 URL 不相符。因此，最佳答案是 B。"},{"n":102,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"Your company was hired by a small healthcare provider to perform a technical assessment on the network. What is the best approach for discovering vulnerabilities on a Windows-based computer?","o":["Check MITRE.org for the latest list of CVE findings","Use a scan tool like Nessus","Create a disk image of a clean Windows installation","Use the built-in Windows Update tool"],"a":[1],"e":"正確答案是 B。 使用類似 Nessus 的掃描工具。 在 CEH 弱點評估和 偵察的概念中，弱點掃描器用於發現系統，應用程式，服務和網路裝置的安全弱點。 Nessus 是一個廣為人知的弱點評估工具，可以掃描以 Windows 為基礎的系統，用於缺失的修補程式，弱設定，開放的埠，不安全的服務，過時的軟體，以及已知的弱點。選項 A 不是最佳答案，因為MITRECVE 提供了弱點資訊，但是它沒有直接評估某個特定的 Windows 電腦是否脆弱。 選項 C 與系統成像或法證準備有關，而不是弱點發現。 選項 D，Windows 更新幫助安裝修補程式，但是它沒有進行完整的弱點評估或偵測出錯設定和被曝光的服務。對醫療保健提供者來說，弱點掃描尤為重要，因為系統可能處理敏感的病人或商業資料。 Nessus 等掃描器能提供結構化結果，可以優先處理和補救。因此，最好的方法是使用像 Nessus 這樣的掃描工具。"},{"n":103,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A Java app uses outdated libraries with known CVEs. What risk does this create?","o":["CSRF","DoS","Supply chain risk","XSS"],"a":[2],"e":"正確答案是 C， 供應鏈風險。 Java 應用程式通常依賴於第三方庫， 框架， 軟體包和模組。 當這些依賴性過時並且已經知道 CVES 時， 應用程式繼承了弱點， 即使組織本身的自訂程式碼是安全的。 CEH Web 應用程式安全材料形容這是使用已知弱點的元件: 第三方元件本身可能很脆弱，如果使用脆弱元件，新的應用程式就會變得脆弱。 符合 CEH OWASP的覆蓋範圍還說明，圖書館，框架和軟體模組經常執行，具有很高的特權，對脆弱元件的利用可能導致資料丟失，伺服器被收購等嚴重影響。 或破壞應用程式防禦。 CSRF 認證使用者提交不想要的請求的技巧， XSS 注入惡意指令碼， 和DoS 目標可用性。 這裡的關鍵風險是透過軟體供應鏈的依賴性曝光。","s":"term"},{"n":104,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"In Dallas, Texas, ethical hacker Ethan Brooks is hired by Lone Star Credit Union to assess the security of their online banking portal, which processes customer transactions. During his penetration test, Ethan probes the web server hosting the portal, experimenting with crafted URL requests. He notices that by altering the URL parameters in a specific way, the server returns data from areas of the system that should be restricted, revealing configuration files not intended for public access. Suspecting this behavior indicates a vulnerability, Ethan documents the issue to help the security team strengthen their defenses against potential unauthorized access. Which technique is Ethan most likely using to uncover the vulnerability in Lone Star Credit Union's web server?","o":["Password Cracking","Web Cache Poisoning","HTTP Response Splitting","Directory Traversal"],"a":[3],"e":"Directory Traversal，也叫路徑 traversal，是一種網路攻擊，攻擊者操縱檔案路徑輸入，因此伺服器存取檔案在預定的網頁目錄之外。 在 CEHWeb 應用程式攻擊指南中，通常發生於應用程式從使用者控制的輸入中建構檔案路徑，如表示檔名，資料夾，語言包，範本，或下載資源的 URL 參數。 如果伺服器無法正確驗證和規範所提供路徑，攻擊者可以注入\"點-點-斜\"圖案等向外序列或編碼等同物來移動目錄並取回敏感檔案。情境描述伊森正在改變 URL 參數並接收\"來自系統應被限制區域的資料\"，具體來說是\"設定檔並非用於公眾存取\"，這是目錄 traversal 的標誌性結果:未經授權讀取應用程式設定，環境等檔案。設定、 金鑰或 伺服器 設定， 日後可以實現更深的折中。 這不是 密碼破解， 因為沒有涉及 認證資訊 猜測或認證攻擊。 這不是網路 快取 中毒， 而是針對共享的快取基礎設施， 以服務於其他使用者的有毒內容。 不是HTTPHTTP 回應分割，而是依靠注入 CRLF 字元來操縱回應頭並可能造成緩衝或 XSS 副作用。 符合 CEH 的補救側重於嚴格允許將允許的檔案資源清單，在存取前對路徑進行可讀化，拒絕 traversal sords 及其被編碼的形式，使用間接物件引用而不是原始檔案路徑，並且執行如此敏感的設定檔的最小優先權限即使發生了驗證錯誤，也不能存取網路。","s":"term"},{"n":105,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"At a Chicago-based healthcare provider, security engineer Emily reviews the migration of critical applications to a cloud service. During her evaluation, she notes that administrators can provision new servers, increase storage, and expand compute power instantly through a web dashboard without any manual involvement from the cloud provider. Which NIST-defined characteristic of cloud computing best explains this capability?","o":["On-demand self-service","Measured service","Resource pooling","Broad network access"],"a":[0],"e":"所描述的能力--管理人員立即透過一個入口網站提供伺服器、儲存和計算，而不需要供應商進行人工干預--是 NIST 雲特性，需要按需自助服務。 在 NIST 的雲端運算模型中，點播自用是指消費者可以根據需要自動單方面提供計算能力(如伺服器時間和網路儲存)，而不需要與每個服務提供商進行人際互動。劇情明確強調，管理員可以透過儀表板\"即時\"來縮放資源，而且\"雲端提供者沒有手工參與\"，這正是點播自助服務捕獲的:由客戶透過自動管絃樂和 APIS/portals.驅動的快速提供。為什麼其他選項不是最佳匹配 :廣泛的網路接入(D)意味著在網路上可以獲得雲能力，並且透過各種平台(移動、膝上型電腦、工作站)的標準機制獲得。 雖然透過網路存取儀表板，但廣泛的接入涉及可達性和標準接入機制，而不是自我提供行為。資源整合(C)是指提供商的多租戶模式，其中 Mital/virtual 資源被集合並動態地分配；它解釋了提供商如何提供彈性，但使用者化的\"自行提供\"方面是點名自用。計量服務(B)指計費/optimization 的計量和監測資源使用情況；它不能解釋即時自給。因此，其特點是 A.按需自助服務。","s":"term"},{"n":106,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"During a network security audit at Jefferson National Bank in Richmond, Virginia, ethical hacker Thomas Reed is tasked with identifying vulnerabilities in employee login processes on VLAN 20, which connects client services workstations to the customer account database server. He sets up a Wireshark instance on a monitoring workstation configured in mirror mode behind a managed switch to capture traffic. His goal is to detect unencrypted authentication credentials transmitted over HTTP during login sessions. Which Wireshark feature should Thomas use to isolate and analyze these credentials in real time, and how does it assist him?","o":["Use the \" Filtering by IP Address \" to set a filter for HTTP traffic before capturing","Use the \" Monitoring the Specific Ports \" to generate a traffic summary and identify HTTP packets","Use the \" Follow TCP Stream \" to reconstruct and read HTTP session data","Use the \" Display Filtering by Protocol \" to isolate HTTP traffic and view packet details"],"a":[2],"e":"正確答案是 Follow TCP Stream。 CEH 封包分析 和 嗅探材料 解釋 Wireshark 可以重建一個來自被捕獲的同屬於 TCP 工作階段的應用程式對話。 在調查 HTTP 登入時，這個特性特別有用，因為它允許分析員以可讀序列檢視重新組裝的請求和回應內容，而不是檢查個人的封包 1。如果 認證資訊在 HTTP 上以明文傳輸， 遵循 TCP Stream 可以直接在重建的 工作階段 內顯示它們。 透過 IP 位址或 協定 過濾可以縮小可見的流量集， 這樣做很有幫助， 但光靠這些功能並不能重建完整的對話。 監測特定埠對於瞭解實際的酬載含量也不太精確。 CEH 指導強調，一旦識別出可疑或相干流量，溪流重建是分析使用者端和伺服器之間資料交換的有力方法。 由於托馬斯在登入工作階段期間專門試圖隔離並讀取未加密的 HTTP認證交換，Follow TCP Stream 是 Wireshark 的特性，在上下文中最能支援這些認證資訊的能見度和解釋。"},{"n":107,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A tester evaluates a login form that constructs SQL queries using unsanitized user input. By submitting 1 OR ' T ' = ' T ' ; --, the tester gains unauthorized access to the application. What type of SQL injection has occurred?","o":["Tautology-based SQL injection","Error-based SQL injection","Union-based SQL injection","Time-based blind SQL injection"],"a":[0],"e":"這個情境代表了一種以陶道學為基礎的 SQL 注入，一種在 CEH v13 課程中被 Web 應用程式入侵模組所覆蓋的基本 SQL注入技術。這種攻擊的決定性特徵是注入一個總是評價到 TRUE 的條件，從而繞過認證或者。授權控制。在給定的例子中，被注入的輸入 1 OR \" T \" = \" T \"； -- 操縱 SQL 查詢的邏輯條件。一個典型的可登入查詢可能類似於:SELECT *FROM使用者 WHERE 使用者_id=1AND 密碼=\"輸入\"； 3。當攻擊者提交所注入的酬載時，產生的 SQL 語句變為:SELECT * FROM 使用者 WHERE 使用者_id=1 OR ' T ' = 'T '； --； \"T'='T'是一個同義詞，意思是無論上下文，它總是對 TRUE 進行評價，因此，資料庫返回記錄時沒有適當驗證使用者的認證資訊，允許未經授權的存取。根據 EC-Consult CEHv13,基於陶瓷的 SQL 注入被歸類為一種基於布林的注入技術，攻擊者利用不當的輸入驗證來改變 SQL 查詢的邏輯流量。 這種攻擊不依賴於資料庫錯誤訊息(如在\"錯誤-基於 SQL 注入\"中)，不使用 UNION 語句擷取資料(Union-based SQL 注入)，不依賴回應延遲(Time-blind SQL 注入)。 CEH v13 強調，當開發人員未能執行輸入消毒，參數化查詢，或準備好的語句時，這種攻擊對登入形式和身分驗證機制特別有效。 這種攻擊是最常見的，經過考試測試的 SQL 注入型別之一，因為它清楚地表明瞭有缺陷的邏輯在沒有先進技術的情況下會如何損害應用安全。理解基於同義體的 SQL 注入對道德駭客至關重要，因為它構成了識別和減輕更復雜的 SQL 注入變體的基礎。","s":"term"},{"n":108,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A fintech startup in Austin, Texas authorizes a controlled red team engagement to evaluate the resilience of its web-based loan management platform. At the outset of the engagement, the assessment team concentrates on developing a structural understanding of the application. They examine publicly exposed endpoints, observe server responses under different navigation paths, identify accessible directories, and document the relationships between client-side scripts, form parameters, and backend behaviors. Error handling patterns and response variations are cataloged to understand how user interactions are processed across various components of the platform. The collected information is used to guide strategic planning for subsequent phases of the engagement. Within the web application hacking methodology, which phase is most accurately demonstrated in this scenario?","o":["Maintaining Access","Scanning","Gaining Access","Reconnaissance"],"a":[3],"e":"正確答案是 D。 偵察。情境描述早期的資訊蒐集活動。 團隊沒有在開發應用程式、 維護存取權或積極損害帳戶。 相反，他們正在繪製曝光端點、目錄、 參數、 指令碼、 後端行為、 反應差異、 錯誤處理模式以瞭解應用程式， 然後再進行測試。 CEH 方法將偵察描述為準備階段，攻擊者或測試者在啟動後續階段之前儘可能多地蒐集目標資訊。 EC-理事會材料也描述足跡是用方法建構一個組織或目標的藍圖或概況，包括髮現系統，服務，無線基地台，並繪製網路地圖。備選方案A。 維持存取是不正確的，因為沒有持續或持續的未經授權的存取。選項 B。 掃描不準確，因為雖然可能出現一些觀察和端點檢查，但更廣泛的活動是在業務開始時蒐集結構資訊。選項 C。 獲得准入是不正確的，因為團隊沒有利用弱點或控制應用程式。選項 D.偵察是正確的，因為活動的重點是蒐集和組織資訊，以支援以後的測試階段。因此，最好的答案是 D.偵察。","s":"term"},{"n":109,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"Arjun Mehta, a red team specialist at Sentinel Dynamics, is conducting a controlled reconnaissance assessment against the company's perimeter network. During testing, the security operations team observes that the firewall logs display several different originating systems associated with the same scanning activity. Arjun's objective is to ensure that his actual testing machine cannot be easily distinguished from other recorded entries. What technique is Arjun using in this scenario?","o":["Source Routing","IP Address Decoy","Source Port Manipulation","IP Address Spoofing"],"a":[1],"e":"正確答案是 B。 IP 位址 Decoy。題目描述掃描活動似乎來自幾個不同的系統，這樣真正的測試者的主機就隱藏在其他顯出源中。 這就是 IP 位址的 Decoy 掃描的目的。 符合 CEH 的偵察和逃取材料解釋道:IP 位址的\"Decoy\"隱藏了掃描在多個誘餌源位址中的真實來源，使得看起來\"誘餌\"和\"真\"的\"主機\"都在掃描目標，它也給出了\"Nmap\"的例子\" nmap-DRND:10\"X.X.X\"，它生成了誘餌並隨機地將\"真源\"IP\"放在其中。選項 A。 源路由不正確，因為源路由試圖指定封包透過網路所走的路徑。選項 C。 source 連接埠 操縱不正確，因為改變 source 連接埠 並不產生多個明顯的發端系統。選項 D。 IP 位址 欺騙是不正確的， 因為簡單的 欺騙 取代了 來源位址 並且可以防止回覆返回攻擊者。“誘餌”掃描特別將真實來源與多起誘餌相混合。因此，最好的答案是 B.IP 位址\"誘餌\"。","s":"term"},{"n":110,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"A penetration tester targets a company ' s executive assistants by referencing upcoming board meetings in an email requesting access to confidential agendas. What is the most effective social engineering technique to obtain the necessary credentials without raising suspicion?","o":["Create a personalized email referencing specific meetings and request access","Call posing as a trusted IT support to verify credentials","Send a mass phishing email with a fake meeting link","Develop a fake LinkedIn profile to connect and request information"],"a":[0],"e":"CEH v13 將長矛捕捉確定為最有效、目標最明確的社交工程方法之一。 它涉及設計高度個性化的資訊，其中提及真實事件、內部程序或即將到來的活動，以建立可信度並減少懷疑。 在這種情況下，參照董事會會議--一個經常處理的活動--為請求創造了一個可信而緊急的背景。 CEH 強調，個性化大大增加了成功率，因為接收者認為傳送者是能夠合法取得內部資訊的人。 假冒 IT 支援的電話(備選 B)對於擷取議程專用的認證資訊來說不太可信。 Mass fishing(備選 C)缺乏個性化，而且容易被標出。 LinkedIn 社交工程(備選 D)是長期性的，對於取得即時的認證資訊效果也不太好。 因此，定製的spear-fishing mail 是最有效的方法。"},{"n":111,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"What is CVSS used for?","o":["Auditing","Encryption","Severity scoring","Exploitation"],"a":[2],"e":"正確答案是 C， Severity 評分。 CVSS 代表共同弱點分數系統。 在 CEH 弱點分析和弱點管理專題中， CVSS 用於衡量和溝通弱點的嚴重程度。 CEH 材料解釋說， CVSS 捕捉了弱點的主要特徵併產生一個反映其嚴重程度的數字分數。 然後，這一分數可以轉化為質量評級，如低、中、高和關鍵，幫助各組織評估和確定補救活動的優先次序。 CVSS 不是一個加密機制，因為它不保護資料或進行加密操作。它也不是弱點利用，因為它不攻擊或利用。弱點。 審計可以使用 CVSS 結果作為輔助證據， 但 CVSS 本身是一個具體的評分框架。 因此， 在這個問題中， 最佳和最精確的 CEH 對齊答案是Severity 評分。","s":"term"},{"n":112,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"A senior executive receives a personalized email with the subject line \"Annual Performance Review 2024.\" The email contains a downloadable PDF that installs a backdoor when opened. The email appears to come from the CEO and includes company branding. Which phishing method does this best illustrate?","o":["Broad phishing sent to all employees","Pharming using DNS poisoning","Whaling attack aimed at high-ranking personnel","Email clone attack with altered attachments"],"a":[2],"e":"這一情境是捕鯨攻擊的教科書例子，這是 CEH v13 社交工程模組中描述的極具針對性的釣魚技術。 捕鯨特別針對高階主管或高層個人，利用他們的權威、取得特權和決策角色。在給定的情況下，攻擊者會製作個性化的電子郵件，冒用 CEO，並使用合法的公司品牌來建立信任。 惡意的 PDF 附件提供後門，與 CEHv13 描述針對高管使用的高階長矛釣魚技術相配合。 CEH v13 區別了捕鯨和其他捕鯨型別:廣泛釣魚不分青紅皂白地針對大團體。 Pharming 透過 DNS 操控重新引導使用者。電子郵件克隆攻擊複製合法的電子郵件，但通常針對同行，而不是高管。捕鯨攻擊特別危險，因為高管往往繞過安全審查，擁有高水平的系統存取。 CEH v13 強調高管意識培訓是關鍵的緩解策略。因此，正確答案是針對高階人員的捕鯨攻擊。","s":"term"},{"n":113,"c":"密碼學","ce":"Cryptography","t":"long","q":"Noah, a security analyst at a Seattle-based healthcare provider, is responding to a real-time data breach where attackers accessed patient records stored on a compromised server. During incident response, he must quickly secure sensitive files located on the system's primary storage to prevent further exfiltration. The data resides in a mounted partition that needs full-volume encryption, but standard file encryption isn't sufficient. Noah selects a solution that supports encrypted containers, strong key lengths like 256-bit AES, and can conceal secure volumes within standard ones to reduce detection. His goal is to ensure confidentiality while forensic operations continue without disrupting system functionality. Which disk encryption tool should Noah deploy to meet these objectives?","o":["BitLocker Drive Encryption","FileVault","Rohos Disk Encryption","VeraCrypt"],"a":[3],"e":"最好的匹配是 VeraCrypt，因為情境明確要求 CEH 密碼學中通常與之相關的三種能力以及資料保護覆蓋:加密容器，有256 位金鑰的 AES 等強大的現代密碼，以及能將被保護的音量藏入另一個音量以降低可探測性的能力。 VeraCrypt 是TrueCrypt 的後繼者，在道德駭客課程中被廣泛引用為可建立加密檔案容器並加密整個分割槽或驅動器的實用磁碟加密工具。 它支援多個演算法和組合，包括 AES-256,可以將加密容器作為虛擬驅動器上載，這樣應用程式可以在休息時繼續加密時正常存取資料。關鍵區分要求是用隱藏的音量隱藏安全儲存。 VeraCrypt 支援合理的解密性， 允許隱藏的音量存在於外加密音量內。 如果被迫披露出一密碼， 使用者可以披露出外接音量 密碼， 而隱藏音量則無法偵測到， 而不能單獨識別出一認證資訊。 提示詞\"在標準卷內隱蔽安全卷\"的短語直接被對映到這個 VeraCrypt 特性，而不是 BitLocker 或 FileVault的標準能力。 BitLocker 和 FileVault 提供了強烈的全磁碟加密，但它們並不提供隱藏的音量來進行可信的解密。 Rohos可以建立加密的容器，但隱藏的音量風格在 CEH 導向的討論中與 VeraCrypt 最緊密和最常地聯絡在一起。 因此，VeraCrypt 是諾亞所宣稱的目標最合適的工具。","s":"tool"},{"n":114,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"You are a security analyst at Sentinel Cyber Group, monitoring the web portal of Aspen Valley Bank in Salt Lake City, Utah. During log review, you notice repeated attempts by attackers to inject malicious strings into the login fields. However, despite these attempts, the application executes queries safely without altering their logic, since user inputs are kept separate from the SQL statements and bound as fixed values before execution. Based on the observed defense mechanism, which SQL injection countermeasure is the application employing?","o":["Perform user input validation","Restrict database access","Encoding the single quote","Use parameterized queries or prepared statements"],"a":[3],"e":"描述的防禦--將使用者輸入從 SQL 語句中分離出來，並在執行前將其繫結為固定值--是參數化查詢(已準備的語句)的決定性特徵。對 SQL 注入最有效且最被廣泛推薦的反措施之一，因為它阻止了攻擊者輸入被解釋為 SQL 程式碼。在一個脆弱的應用程式中，開發者經常透過調校字串來建構 SQL 語句，例如\"SELECT。 WHERE 使用者=\"+輸入+\"\"，在這種模式中，惡意有效酬載可以改變查詢結構(新增條件，UNION，註釋，或堆疊的查詢)。 SQL 引擎透過準備的語句首先接收查詢結構(範本)，然後分別接收參數值。 資料庫嚴格將參數作為資料，而不是可執行的 SQL。 因此，即使攻擊者提交引文，關鍵詞，或運算子，這些字元仍然屬於參數值的一部分，不能改變查詢的邏輯。假設方案特別說輸入是“作為固定值繫結的”，這是與參數繫結相關的直接語言。這使得選項 D 成為最佳答案。為什麼其他選項不準確:使用者輸入驗證(A)很有幫助，但可以繞過，不如參數化有力；所描述的機制也不是驗證而是繫結分離。收縮資料庫存取(B)是一種能減少衝擊的防禦深度措施(最最短的特權)，但本質上並沒有阻止注入的發生。編碼單引號(C)是一種 legis/insufficient 方法；編碼或出逃可以是出錯易發和 DBMS-特有，它與參數被單獨繫結的描述不相匹配。因此，應用程式使用 D。 使用參數化查詢或準備的語句。"},{"n":115,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"A fintech startup in Austin, Texas deploys several virtual machines within a public cloud environment. During an authorized cloud security assessment, a tester uploads a small script to one of the instances through a web application vulnerability. After executing the script locally on the instance, the tester retrieves temporary access credentials associated with the instance's assigned role. These credentials are then used to enumerate storage resources and access additional cloud services within the same account. Which cloud attack technique best corresponds to this activity?","o":["IMDS Attack","CPDoS Attack","Cloud Snooper Attack","Wrapping Attack"],"a":[0],"e":"正確答案是 A。 IMDS 攻擊。情境描述一個從雲例項內部執行攻擊者程式碼， 並擷取與例項角色相關的臨時認證資訊。這是一個例項後設資料服務( IMDS) 攻擊的特徵。 雲平台將後設資料服務暴露在例項中， 這樣應用程式就可以擷取設定和角色認證資訊。 如果攻擊者在例項中獲得了程式碼執行， 他們可以查詢 IMDS 並偷取臨時認證資訊。一個雲安全引用解釋，當一個 EC2 例項與一個例項設定相關時，透過 Straits 後設資料服務(IMDS)自動向例項提供臨時安全認證資訊。在情境中，測試者在透過脆弱的 Web 應用程式獲得程式碼執行後濫用了這種行為。備選 B。 CPDos 攻擊是不正確的 因為快取被毒殺的阻斷服務瞄準了隱形行為，導致服務被拒絕。選項 C。 Cloud Snooper 攻擊是不正確的，因為 Cloud Snooper 指的是透過雲基礎設施路徑繞過防火牆控制和命令與控制。選項 D。 包接攻擊是不正確的，因為包接攻擊通常針對 SOAP/XML 簽名或請求操縱，而不是雲例項後設資料認證資訊。因此，最好的答案是 A.IMDS 攻擊。","s":"term"},{"n":116,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"Massive outbound HTTPS traffic hides inside normal web traffic. Likely objective?","o":["DoS","Data exfiltration","Scanning","Recon"],"a":[1],"e":"正確答案是 B，因為大規模出行 HTTPS 流量是資料外洩的有力指標，特別是當它被設計成能被分解入正常網路流量時。在 CEH 攻擊生命週期概念中，分解發生在攻擊者取得存取權後，並且能夠悄悄地從環境中擷取被保護的資源或敏感資料。取回的符合 CEH 材料描述出滲出是攻擊者能\"靜靜地取擷取資料\"的階段，並指出出滲出可以默默地發生。 HTTPS 在企業網路中通常被允許出行，因此攻擊者可以將其作為隱蔽或低噪道來移動被竊取的檔案，認證資訊，資料庫垃圾站，或檔案到外部的伺服器。 指南材料也指出，惡意軟體經常使用 SSL 大於連接埠 443 或其他容易隱藏的機制，而不是明顯的可疑埠。 DoS 通常會產生服務中斷，掃描生成偵測模式，而偵察專注於資訊蒐集。 Mass highed outround HTTPS 最有可能表示資料被過濾。","s":"term"},{"n":117,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"During a stealth penetration test for a multinational shipping company, ethical hacker Daniel Reyes gains local access to an engineering workstation and deploys a specialized payload that installs below the operating system. On subsequent reboots, the payload executes before any system-level drivers or services are active, giving Daniel covert control over the machine without triggering antivirus or endpoint detection tools. Weeks later, system administrators report suspicious network activity, but repeated forensic scans fail to locate any malicious processes or user-level traces. Which type of rootkit did Daniel most likely use to maintain this level of stealth and persistence?","o":["Hypervisor Rootkit","Firmware Rootkit","Kernel-mode Rootkit","Bootkit"],"a":[3],"e":"一個 bootkit 是最適合所描述行為的 Rootkit 型別，因為它會損害系統啟動過程，並在作業系統完全載入之前執行，通常在許多安全控制，驅動器，和監測服務啟動之前執行。 CEH 材料將 bootkits 描述為一種高度持久性的惡意軟體類，它針對的是 Master Boot Record，Volume Boot Record，或 bootloader 等元件。 透過在啟動時獲得執行，一個啟動程式可以很早就裝入惡意軟體碼，然後鉤入或篡改 OS 載入常規，核心初始化，或安全機制。這種早期執行正是情境所強調:酬載執行\"在任何系統級驅動程式或服務活動之前\"，允許隱蔽控制，同時逃避傳統的使用者-模式偵測。這也解釋了為什麼管理員會看到可疑的網路活動，但法醫不會輕易找到惡意使用者級的文物。 Bootkits 可以透過操縱 OS 和安全工具在之後可以看到的東西來隱藏。啟動， 包括隱藏檔案、 程序、 登錄 金鑰， 甚至重定向讀取掃描器接收到“ 乾淨” 資料。 由於惡意元件被固定在啟動鏈中， 即使許多 OS- 級指示器被清理， 它仍然可以倖存並存在。一個核心-mode Rootkit 在 OS 核心內執行，但一般在 OS 開始啟動後載入並驅動程式初始化。 一個超多維相器 Rootkit 依賴於虛擬化在執行時間坐落在 OS 下方，但情境特別突出了驅動器和服務前的啟動時間執行。 韌體 rootkits 在 BIOS/UEFI 或裝置韌體中持續存在，這是可能的，但最直接匹配於 CEH 名詞中\"OS 下方的啟動過程折中\"是\"botkit\"。","s":"term"},{"n":118,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"Several months prior to a confirmed compromise, security telemetry at a semiconductor manufacturer in Phoenix, Arizona showed systematic intelligence gathering focused on executive leadership, research engineers, and publicly exposed infrastructure. Subsequent investigation determined that the adversary had assembled customized exploit frameworks, tested malware variants against commercial defensive products in isolated environments, and mapped externally accessible services associated with the organization. These activities were part of a coordinated strategy developed well before any credential abuse or lateral movement was observed. Determine the APT lifecycle stage represented by these actions.","o":["Persistence","Expansion","Preparation","Initial Intrusion"],"a":[2],"e":"正確答案是 C。 準備。上述活動發生在認證資訊濫用、橫向移動、持久性或內部擴張之前。 對手正在蒐集情報、繪製暴露服務圖、準備弱點利用框架和測試。對防禦工具的惡意軟體，這些行動代表了\"先發制人的持續威脅\"的進攻前準備階段。APT 活動的特點是設定目標，長期探測，先進資源，專業技能和方法，以及對於未被察覺的殘餘的高度耐受性。 情境清楚描述這些特徵:攻擊者花幾個月的時間蒐集情報，建立工具，測試惡意軟體，並準備一個協調的攻擊計劃。選項 A。 持久性是不正確的，因為持久性發生在初始接觸之後，當攻擊者確定一種方法來維持接觸受損環境時。選項 B。 擴充套件是不正確的，因為擴充套件涉及更深入地進入環境、不斷升級的特權，或在入侵後橫向擴散。選項 D。 初始入侵是不正確的，因為初始入侵指的是目標環境的第一個成功妥協方案，該設想方案明確指出，這些活動發生在認證資訊被濫用或橫向移動之前。因此，最好的答案是 C.準備。","s":"term"},{"n":119,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"During a stealth penetration test at a defense research facility, ethical hacker Daniel installs a payload that survives even after multiple operating system reinstalls. The implant resides deep inside the system hardware and executes before the OS is loaded, ensuring that forensic scans and antivirus tools at the OS level cannot detect or remove it. Administrators notice unusual activity on network cards and storage devices, but repeated scans show no malware traces within the file system. Which type of rootkit most likely enabled this level of persistence?","o":["Boot-Loader-Level Rootkit","Hypervisor-Level Rootkit","Kernel-Level Rootkit","Hardware/Firmware Rootkit"],"a":[3],"e":"正確答案是 D。 Hardware/Firmware Rootkit，因為情境描述了即使在多次 OS 重置後仍然會存在的持久性，並在作業系統負載前執行，同時迴避了 OS-級的防毒和法醫學掃描。 在符合 CEH 的不良戰列克思/Rootkit 概念中， hardg/firmware rootkits 將惡意軟體碼嵌入到韌體元件中 例如 BIOS/UEFI， 裝置韌體( 例如， ) NIC 韌體， 單相機 儲存控制器韌體，HDD/SSD 韌體， 或其他嵌入式硬體層。 因為韌體是和作業系統的檔案系統分開的， 重排作業系統通常不會移除植入器。線索\"在系統硬體深處\"和\"OS 被裝入前執行\"在字尾鏈中與韌體級執行相配合。 Firmware rootkits 可以在早期起動時執行，初始化惡意鉤子，再以隱藏其存在的方式將控制權交給 OS。 這使得它們極難使用基於常規主機的工具來偵測，因為這些工具在 OS 執行後執行，一般無法輕易檢查或驗證韌體完整性。 提及\"網路介面卡和儲存裝置上的不尋常活動\"也是一個很強的指標:遭入侵的 NIC 或儲存韌體可以操縱流量，過濾資料，或更改讀取的/writes，而保持隱形到基於檔案的掃描。為什麼其他選項的準確性較低:一個後置載入器級的 Rootkit 通常會感染後置載入器於磁碟上；雖然執行較早，但可以透過磁碟再成像或某些再安裝工作流程將其去除。 一個核心級的 Rootkit 居住在 OS 核心內並一般透過再生 OS 來去除。 一個超顯像器級的 Rootkit(虛擬化-基於虛擬)可以被隱形，但是它仍然一般依賴於軟體層，除非與韌體持續相配，否則它們可能無法從重複的 OS 再安裝中倖存。因此，整個再安裝和操作前執行的持久性最清楚地表明瞭一款硬體/firmwareRootkit。","s":"term"},{"n":120,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"An e-commerce platform hosted on a public cloud infrastructure begins to experience significant latency and timeouts. Logs show thousands of HTTP connections sending headers extremely slowly and never completing the full request. What DoS technique is most likely responsible?","o":["Slowloris holding web server connections","Fragmentation flood attack","UDP application-layer flooding","SYN flood with spoofed source IPs"],"a":[0],"e":"CEH v13 將 Sydloris 識別為一種低-頻寬但高度有效的應用層 DoS 技術，它透過非常緩慢地開啟多個 HTTP 連線併傳送標頭來工作，從不完成請求。 由於伺服器必須維護這些半開 HTTP 工作階段，其連線池會變得飽和，使其無法為合法使用者服務。 Slowloris 特別危險，因為它不依賴畸形的封包，高流量，或協定濫用；相反，它模仿合法的 HTTP 行為，使得防火牆或 IDS 系統難以區分惡意流量。 這與描述的情境完全一致，數千個合法-外觀 HTTP 連線正在逐漸消耗伺服器資源。分解攻擊(可選 B) 目標封包重建， UDP 泛洪(可選 C)產生高-頻寬噪音，而 SYN 泛洪(可選 D)會撞擊 TCP 握手層，而不是 HTTP 標頭行為。 Slowloris 獨特的使用慢 HTTP 標頭直接與所描述的症狀相匹配。","s":"term"},{"n":121,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"Which of the following tools performs comprehensive tests against web servers, including dangerous files and CGIs?","o":["John the Ripper","Dsniff","Snort","Nikto"],"a":[3],"e":"從 CEHv13 指南中綜合詳細解釋:正確答案是 D。 Nikto。 Nikto 是 Web 應用程式和網路伺服器安全評估中使用的流行網路伺服器弱點掃描器，它透過識別危險檔案，過時的伺服器軟體，不安全的設定，預設檔案，脆弱的 CGI 指令碼，錯誤的設定，以及已知的安全問題，對網路伺服器進行綜合測試。 Nikto 包含一個大型的資料庫簽名並可以使用。迅速發現成千上萬的潛在弱點 跨越網路伺服器環境。選項 A，開膛手約翰(John the Ripper)是用於審計密碼強度和從雜湊中取回密碼的密碼-cracking 工具。 選項 B，Dsniff，是一個網路審計和密碼-嗅探工具箱，用於捕捉和分析網路流量。 選項 C，Snort，是一個網路入侵探測和預防系統(IDS/IPS)，用於監測網路流量的惡意活動，但不進行全面的網路伺服器弱點評估。在CEHWeb 應用程式入侵方法中，Nikto 在掃描和列舉階段中通常用於在進行更有針對性的弱點測試之前識別網路伺服器中的弱點。 由於它專門檢查了危險的檔案，不安全的 CGI 程式，以及 web 伺服器的弱點，Nikto 是最佳的答案。","s":"tool"},{"n":122,"c":"系統入侵階段","ce":"System Hacking Phases","t":"long","q":"Olivia works as a senior red team specialist at SecureMatrix Labs in Portland, Oregon. During a controlled adversarial simulation, she deployed a stealth persistence mechanism on a test workstation to evaluate advanced defensive detection capabilities. After rebooting the system, the operating system continued to function normally, but subsequent investigation revealed that the OS was executing within an underlying control layer established before full system initialization. This layer intercepted low-level CPU instructions and mediated direct hardware interactions prior to their delivery to the operating system. Which type of rootkit best describes the mechanism deployed in this scenario?","o":["Application-Level / User-Mode Rootkit","Kernel-Level Rootkit","Hypervisor-Level Rootkit","Boot-Loader-Level Rootkit"],"a":[2],"e":"正確答案是 C。 Hypervisor- Level Rootkit。 題目描述的作業系統下的一個控制層，它攔截了 CPU 指令並調解了硬體互動。作業系統繼續正常執行，但是它實際上從下面被主機或控制。 這是一個超 visor-level Rootkit.符合 CEH Rootkit 材料的下定義行為。超 visor-level rootkits 將 AMD-V 或 Intel VT 和主機目標作業系統等硬體輔助虛擬化技術用作虛擬機器。 另一種 CEH 的參考解釋是，超 visor-level rootkits 修改了主機系統的字尾序列來載入虛擬機器作為主機作業系統。 選項 A。應用程式級/使用者- 模式 Rootkit 是不正確的， 因為使用者- 模式 rootkits 執行在應用程式內部或使用者- 空間程序。 選項B。 Kernel- Level Rootkit 是不正確的， 因為核心 rootkits 修改或替換了核心程式碼， 但是該設想題目描述的是 作業系統下的一層。 選項 D。 Boot- Loader-Level Rootkit 是不正確的， 因為 rootloader rootkits 替換或篡改啟動程式碼， 如bootloader 或 MBR。 雖然它們執行較早，但描述的在控制層下託管 OS 的行為更精確地指向了超顯相級的 Rootkit。 因此，最好的答案是 C。 Hypervisor-Level Rootkit。","s":"term"},{"n":123,"c":"密碼學","ce":"Cryptography","t":"short","q":"An organization uses SHA-256 for data integrity verification but still experiences unauthorized data modification. Which cryptographic tool would best resolve this issue?","o":["Asymmetric encryption","Symmetric encryption","SSL/TLS certificates","Digital signatures"],"a":[3],"e":"CEH 解釋道，單是雜湊函式，如 SHA-256,只提供完整性檢查，不驗證真實性或不可校驗。 攻擊者可以修改資料並重算雜湊。數字簽字將雜湊與不對稱的密碼學相結合，確保:誠信認證不駁回選項 D 是正確的。選項 A 和 B 提供機密性，而不是完整性保證。選項 C 確保通訊渠道的安全，而不是獨立的資料完整性。 CEH 明確推薦數位簽章來保護資料完整性，防止被篡改。","s":"term"},{"n":124,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"An organization authorizes a wireless penetration test to evaluate the resilience of its WPA2-protected network. The assigned ethical hacker prepares the wireless adapter for packet capture and begins monitoring traffic from a nearby access point. To accelerate the assessment, the tester transmits crafted 802.11 frames that momentarily interrupt active client connections. Shortly afterward, new authentication exchanges are observed in the capture logs, providing the necessary material for subsequent analysis. The activity described corresponds to which component of the Aircrack-ng suite?","o":["airodump-ng","airmon-ng","aircrack-ng","aireplay-ng"],"a":[3],"e":"正確答案是 D。 Aireplay-ng。劇情描述的是可傳輸被設計出無線訊框來中斷活動使用者端連線，從而使用戶端重新連線併產生新鮮的認證握手。 在 Aircrack-ng 套件中，Aireplay-ng 是用於封包注入和去驗證式攻擊的元件。被引用的無線測試材料顯示，在握手式抓取工作流程中，正使用 Aireplay-ng 來強制進行使用者端解析，而 Airodump-ng 用於抓取流量，Airmon-ng 用於啟用監控模式，而後用於破解被捕獲的握取或金鑰。選項 A。 Airodump-ng 是不正確的，因為它能捕捉和監測無線流量。選項 B。 airmon-ng 是不正確的，因為它將無線介面卡放入了監視器模式。備選 C。 空破解-納克是不正確的，因為它在蒐集了有用的捕獲材料之後進行了破解相。選項 D。 Aireplay-ng 是正確的，因為它注入了訊框，包括去正交訊框來刺激握手捕捉。因此，最好的答案是 D。 aireplay-ng。","s":"tool"},{"n":125,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"Attackers exploit SMBv1 to spread malware across hosts. What attack behavior is this?","o":["Worm-like propagation","Phishing","Credential stuffing","DoS"],"a":[0],"e":"正確答案是 A，類似蠕蟲的傳播。在 CEH 惡意軟體威脅概念中，蠕蟲是惡意軟體，它自我複製並使用電腦網路將複製本身傳送到其他系統，而不需要人動作。CEH 相關教材將蠕蟲描述為能自我複製、利用網路散播到其他系統的惡意軟體，並且在複製時通常會消耗系統資源。情境明確指出，攻擊者利用 SMBv1 在多台主機間傳播惡意軟體；這符合蠕蟲的行為，因為惡意軟體會透過網路服務，從一台存在弱點的電腦橫向移動到另一台。這類行為常見於 WannaCry 等攻擊：攻擊者將SMBv1 弱點武器化，使惡意軟體在感染後可掃描有弱點的系統，並透過 SMB 繼續散播。網路釣魚是透過訊息或網站欺騙使用者；認證資訊填充是使用重複使用的使用者名稱/密碼組合； DoS 則著重於破壞可用性。由於關鍵行為是透過SMBv1 在主機之間自動散播，因此最佳答案是類似蠕蟲的傳播。","s":"term"},{"n":126,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"During a forensic investigation of an attack on a media company in New York, analysts discovered that a non- privileged process loaded a malicious library instead of the intended library because the attacker placed the rogue file in a directory Windows searched before the legitimate location. When the trusted application started, the attacker's code executed with the application's privileges. No registry changes or kernel exploits were involved. Which technique most likely enabled the privilege escalation?","o":["Privilege Escalation by Exploiting Vulnerabilities","Privilege Escalation Using DLL Hijacking","Access Token Manipulation","Privilege Escalation by Bypassing User Account Control"],"a":[1],"e":"這個情境是 DLL 被劫持(也叫 DLL 搜尋命令被劫持)的經典例子。 在 Windows 上，當一個應用程式試圖載入一個需要的DLL 而不使用一個完全合格的路徑時，作業系統在定義的搜尋順序中搜尋該 DLL(在許多情況下，包括應用程式目錄和其他可能被低特權使用者寫出的位置)。 如果攻擊者可以將一個與預期庫同名的惡意 DLL 放入一個在合法的 DLL 的位置之前被搜尋的目錄，Windows 將首先將攻擊者的 DLL 載入。 被信任的應用程式啟動後，惡意 DLL 被載入入程序，導致攻擊者的程式碼在該應用程式的上下文和權限中被執行。問題線索與 DLL 劫持緊密一致:一個\"非 privileged process load a m 惡意的庫而不是預期的庫\"表示一個庫預載入/search-order 問題，而不是利用核心錯誤。攻擊者\"將無賴檔案放入一個目錄Windows 在合法位置之前被搜尋\"，直接描述了搜尋命令的操縱。\"當所信任的應用程式啟動時，攻擊者以應用程式的特權執行的程式碼\"反映了 DLL 劫持在目標程序執行時具有更高權限(例如作為管理員或 SYSTEM)時如何導致權限提升。\"沒有登錄被參與\"幫助排除了某些 COM 劫機或以登錄為基礎的持久性等技術，也指向了經常依賴登錄鍵或自動自動行為的UAC 繞行方法。為何其他選項不合適:利用弱點(A)過於籠統，通常會提到軟體缺陷(緩衝區溢位，核心利用等)。存取權杖操縱 (C) 涉及偷取/impersonating 權杖，而非 DLL 搜尋令行為。繞行 UAC (D) 瞄準了高升提示和自動起跑機制，而不是DLL 載入優先。因此，技術是 B.權限提升使用 DLL 劫持。"},{"n":127,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"What is SMB relay attack?","o":["DoS","Spoofing","MITM","Replay"],"a":[2],"e":"正確答案是 C 說得沒錯 因為 SMB 接力攻擊最好歸類為中間人攻擊。 攻擊者的位置是欺詐性 SMB 伺服器 受害人之間或接力使用者端和合法目標伺服器。 當受害者試圖 Windows/SMB 認證時， 攻擊者不會簡單地重放舊遊戲流量；取而代之的是，攻擊者將活的認證交換器轉發到真實目標伺服器，並使用由此而來的認證連線。 EC- Concil 材料將 SMBRelay 描述為可捕捉從所接入的 SMB 伺服器流量中擷取使用者名稱和密碼 hashes 的 SMB，並宣告可以進行人入-。中間攻擊。它也描述了一種情境，受害者認為他們正在連線目標，而 MITM 伺服器擷取了呼叫並傳遞連線到目標伺服器。 Replay 是一個相干的概念，但回放通常意味著捕獲認證資料並稍後再使用。 SMB 接力是特地一種活的 MITM 接力技術，所以選項 C是最準確的。","s":"term"},{"n":128,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"What is RID cycling?","o":["SQLi","DoS","DNS attack","SMB enumeration"],"a":[3],"e":"正確答案是 D， SMB 列舉。 RID 迴圈是一種 Windows116 列舉技術，透過相對識別器，或 RID，在 Windows 安全識別器，或 SID 中透過迴圈來發現有效的使用者和分組帳戶。 在 Windows 中，SID 識別一個使用者，組，或電腦帳戶，而RID 是 SID 中識別出具體帳戶的最後一部分。 CEH 相關材料解釋,500 等 RID 識別管理員帳戶,501 識別來賓帳戶，普通使用者帳戶通常從 1000 左右開始。 在 SMB 或 NetBIOS 列舉期間，攻擊者查詢 SMB 可存取的系統以取回使用者，群組、共用資源，機器和 SID。 RID 迴圈使用這種 SID/RID 結構測試相繼的 RID 值並把它們對映回帳戶名稱，它不是 SQL 注入，阻斷服務，也不是 DNS 攻擊，因此，RID 迴圈屬於 SMB 列舉。","s":"term"},{"n":129,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"Which attack manipulates hidden fields?","o":["SQLi","XSS","Parameter tampering","CSRF"],"a":[2],"e":"正確答案是 C， 參數篡改。 在 Web 應用程式入侵 中， 隱藏欄位是 HTML 形式欄位， 用於將值傳遞迴 伺服器， 但是它們只隱藏在普通瀏覽器顯示中， 而不是來自 CEHWeb 應用程式材料解釋隱藏欄位被嵌入到 HTML 表格中，以維持發回到伺服器的值，而攻擊則透過檢查 HTML 源並更改請求到伺服器之前，對隱藏欄位不能被檢視或修改的假設提出質疑。 這直接匹配了參數篡改，因為攻擊者修改了使用者端側參數，如形式欄位，cookie，查詢字串，或 URL 參數來改變應用行為。 CEH 材料還把參數/form 篡改描述為使用者端-伺服器通訊過程中的操縱參數，包括 URL 值和網頁形式欄位。 SQL注入目標資料庫查詢，XSS 將指令碼注入頁面， 和 CSRF 欺騙認證的使用者來提交不想要的請求。因此，隱藏- 欄位操作是一種參數篡改的形式。","s":"term"},{"n":130,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"In the financial hub of Charlotte, North Carolina, ethical hacker Raj Patel is contracted by TrustBank, a regional U.S. bank, to evaluate their online loan application portal. During testing, Raj submits crafted input into the portal ' s form fields and notices that the server ' s HTTP responses are unexpectedly altered. His payloads cause additional headers to appear and even inject unintended content into the output, creating opportunities for attackers to manipulate web page behavior and deliver malicious data to users. Which type of vulnerability is Raj most likely exploiting in TrustBank ' s online loan application portal?","o":["HTTP Response Splitting","XML Poisoning","XML External Entity (XXE) Injection","Server-Side Request Forgery (SSRF)"],"a":[0],"e":"被描述的行為與 HTTP 回應分拆強烈匹配。 當應用程式在 HTTP 回應頭中包含未衛生化的使用者輸入時， 就會發生這種弱點。 透過注入歸位與換行（CRLF）字(CRLF)， 攻擊者可以\"分解\"伺服器的回應成多部分-- 導致額外的頭出現或注入出意料的身體內容。 劇情明確規定拉傑的有效酬載會導致\"額外標頭出現\"和\"將意外內容注入輸出\"，這是 HTTP 回應分割的經典結果。為什麼這一點很重要: 回應分解可以透過標頭快取中毒，Cookie 操縱，重定向等攻擊，以及跨網站指令碼攻擊類撞擊。 例如，如果攻擊者是攻擊者的話。可以注入 Set-Cookie 標頭，它們可以在被害者的瀏覽器中設定或覆蓋 cookie。如果它們可以注入位置標頭，它們可以強制重定向。如果它們向身體中注入內容，它們可以傳送惡意指令碼或改變頁面行為--特別是當與快取中間體結合時。 弱點一般出現在反映使用者對標頭輸入的特性上，如位置、Set-Cookie、內容處理或自訂標頭等。其他選項與症狀不符:XML 中毒 (B)和 XXE (C) 涉及 XML 解析和實體解析；它們不會直接導致在回覆中新增了 HTTP 頭。 SSRF(D)涉及迫使伺服器向內克/external 資源發出出行請求；它可能暴露出資料，但主要不表現為注入回應頭和改變回應結構。因此，Raj 最有可能利用 A.HTTP 反應分化。","s":"term"},{"n":131,"c":"密碼學","ce":"Cryptography","t":"mid","q":"A future-focused security audit discusses risks where attackers collect encrypted data now, anticipating that they can decrypt it later with quantum computers. What is this threat known as?","o":["Saving data today for future quantum decryption","Replaying intercepted quantum messages","Breaking RSA using quantum algorithms","Flipping qubit values to corrupt the output"],"a":[0],"e":"在 CEH v13 密碼學中，這個威脅被正式稱為\"Harvest Now， Drecrypt Later\"(HNDL)。 它描述了一個長期的密碼學風險，對手今天擷取並儲存加密通訊，儘管他們無法用目前的計算能力來解密它們。 期望未來量子電腦將足夠強大來打破被廣泛使用的公用金鑰加密演算法。 CEH v13 強調，Shor's Algorithm 等量子演算法在理論上可以透過高效地解決整數因子化和離散對數問題來打破 RSA，DSA 和 ECC。然而，這種威脅的決定性特徵並不是破解加密本身的行為，而是提前對加密資料進行戰略蒐集和儲存。選項 C 不完全，因為它只注重密碼機制，而不是威脅模型。 選項 B 和 D 與所描述的情境無關並指量子通訊完整性問題，而不是長期密碼曝光。 CEHv13 強調保密壽命較長的敏感資料--如政府記錄，金融資料、醫療保健資訊和智慧財產權特別容易受到這種威脅。 因此，鼓勵各組織主動採用能耐量子(量子後)加密演算法。因此，選項 A 準確地描述了威脅模型，並與 CEH v13 處理未來密碼風險的方法保持一致。","s":"term"},{"n":132,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a review for DoS threats, several IP addresses generate excessive traffic. Packet inspection shows the TCP three-way handshake is never completed, leaving many connections in a SYN_RECEIVED state and consuming server resources without completing sessions. What type of DoS attack is most likely occurring?","o":["SYN Flood","Ping of Death","UDP Flood","Smurf Attack"],"a":[0],"e":"在 CEH 阻斷服務和網路攻擊覆蓋中，SYN 泛洪是一種經典的 TCP 基於 DoS 的技術，它利用了 TCP 連線建立過程。 在正常的握手中，使用者端傳送 SYN，伺服器回覆 SYN/ACK，使用者端完成 ACK。 ASYN 泛洪故意傳送出高容量的 SYN封包(常為偽造的)，但從未完成最終的 ACK。 正如 CEH 所描述的，這個過程是 CEH 所描述的。離開 伺服器 在SYN_RECEIVED 中持有許多半開放的連線， 消耗記憶體和連線表資源( 後置佇列 )。 當積壓完成時， 合法的用戶端無法建立連線， 從而降低可用性。您設想中的指標與 CEH 的 SYN 洪澇指紋完全一致: 手握不全和半開接的積累。 目標是連線管理層的資源耗盡， 而不是頻寬 飽和。選項 B(死亡之平)涉及不正確的/oversizedICMP 封包，與 SYN_RECEIVED 行為不相匹配。 選項 C(UDP 泛洪)目標為 UDP 服務/ports，併產生不同的症狀(高 UDP 流量，ICMP 無法取得的資訊，服務退化)，沒有半開 TCP 狀態。 選項 D(Smurf)是 ICMP 基於廣播位址的放大-與不完整的 TCP 握手無關。 CEH 也注意到了SYNCookie 等緩解措施，增加了積壓，減少了 SYN-RECEIVED 定時器，限制速率，以及上游過濾--進一步強化了所描述的事件是 SYN 泛洪。","s":"term"},{"n":133,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A regional logistics provider in Charlotte, North Carolina operates its shipment tracking and partner API services on an Apache web platform configured to support a modern multiplexed communication protocol to improve efficiency under concurrent load. During a controlled stress assessment, testers simulate sustained client activity that repeatedly initiates and completes numerous lightweight exchanges over persistent connections. Over time, system monitoring reveals that memory utilization steadily increases despite stable request volume and no proportional rise in active sessions. Even after the simulated clients disconnect normally, resource usage does not return to baseline levels. After several cycles, the service becomes sluggish and must be restarted to restore normal responsiveness. No unusual disk activity or database errors are observed during the test window. The behavior is only present when the multiplexed protocol mode is enabled; reverting to legacy handling eliminates the issue. Which Apache vulnerability best explains this behavior?","o":["DoS in HTTP/2 with Initial Window Size 0","HTTP/2 Stream Memory Not Reclaimed on RST","Insecure Default Configuration","mod_macro Buffer Over-read"],"a":[1],"e":"正確答案是 B。 HTTP/2 Stream Memory 不重取於 RST。情境描述 Apache 網路服務使用多流 xed 協定，這說明HTTP/2.的重要症狀是記憶體消耗持續增加，正常的使用者端斷開，重複流活動，記憶體不回基線。 這強烈表明 HTTP/2與流相關的記憶體在流重置或終止事件後沒有被正常地再生。 符合 CEH web 伺服器材料強調 Apache 網路伺服器與其他網路伺服器一樣，可以包含需要修正和安全設定審查的 bug 和執行弱點。 所描述的行為不是一個通用的設定錯誤；它是一個與 HTTP/2 流處理相關的協定特有記憶體管理問題。 HTTP/2 中的選項 A。 DoS 和初始視窗大小 0 是不正確的，因為該選項的發行中心是濫用流控制視窗行為，而不是在流重排後不恢復記憶體。選項 C。 不可靠的預設設定是不正確的，因為問題僅在 HTTP/2 多軸模式啟用並繫結在流記憶體行為時才會出現。選項 D。 mod_macro Buffer Over-read 是不正確的，因為情境不涉及 mod_macro，緩衝多讀行為，或者從記憶體中披露。因此，最好的答案是 B。 HTTP/2 Stream Memory 不重取於 RST。"},{"n":134,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"Which advanced session-hijacking technique is hardest to detect and mitigate?","o":["Covert XSS attack","Man-in-the-Browser (MitB) attack","Passive sniffing on Wi-Fi","Session fixation"],"a":[1],"e":"CEH v13 將\"萬入瀏覽器\"(MitB)攻擊確定為最危險和最難發現的工作階段劫持技術之一，特別是在線上銀行環境下。 MitB攻擊中，惡意軟體操作在使用者瀏覽器內，即時攔截和操縱交易。與 XSS 或工作階段固定攻擊不同，MitB 完全繞過伺服器-側安全控制。 即使是堅固的加密，多因子認證，以及安全的 cookie，由於攻擊發生在認證後，在被信任的工作階段範圍內，都是無效的。被動嗅探受加密的限制，而工作階段固定依賴於劣質的工作階段管理。 Covert XSS 需要注入點並更容易被減輕。 CEH v13 強調 MitB 攻擊可以在不提高使用者意識的情況下修改交易細節，使得偵測極為困難。 因此，選項B 是正確的。","s":"term"},{"n":135,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"As the cybersecurity lead for an international news agency, you are alerted by your threat intelligence team that confidential communications between journalists and whistleblowers have been posted to an online activist forum. Further forensic analysis reveals that no financial transactions were tampered with and no ransomware was deployed. However, the agency's internal systems were accessed and selectively leaked emails were published alongside a manifesto accusing the organization of biased reporting. The attackers also posted on social media claiming responsibility and justifying their actions as a fight against misinformation. Based on this behavior, what category of hacker are you most likely dealing with?","o":["Script Kiddies","Hacktivists","Black Hat hackers","White Hat hackers"],"a":[1],"e":"駭客是最有可能的類別，因為情境是由意識形態或政治動機驅動的，而不是直接的經濟利益。 襲擊者有選擇地進入內部系統並洩露通訊，然後將洩露與一份指責機構有偏見的報道的宣言相配。 他們還公開聲稱對社交媒體負責，並將入侵行為定性為與錯誤資訊作鬥爭。 在符合 CEH 的術語中，駭客主義通常涉及未經授權的取得、誹謗、塗鴉或資料洩漏，目的是影響公眾輿論、使目標難堪或推動政治或社會議程。 公開的資訊和理由是駭客主義意圖的關鍵指標。其他選項也不相適應。指令碼少年一般使用精密程度有限的現成工具，通常不會產生協調的意識形態資訊或有針對性的，由敘事驅動的洩露。黑帽駭客的定義是惡意的，但最常見的是與以牟取利益為目的的盜竊，勒索，詐騙，或勒索軟體有關。 這一事件明確注意到沒有勒索軟體，也沒有進行金融篡改，降低了利潤成為首要目標的可能性。 白帽駭客以授權和有檔案記載的範圍運作，他們不會洩露敏感的吹哨人通訊或發表宣言。因此，未經授權取得、有選擇地暴露敏感資訊以及公開的意識形態理由與駭客主義者最密切地吻合。","s":"term"},{"n":136,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"A multinational corporation recently survived a severe Distributed Denial-of-Service (DDoS) attack and has implemented enhanced security measures. During an audit, you discover that the organization uses both hardware- and cloud-based solutions to distribute incoming traffic in order to absorb and mitigate DDoS attacks while ensuring legitimate traffic remains available. What type of DDoS mitigation strategy is the company utilizing?","o":["Black Hole Routing","Load Balancing","Rate Limiting","Sinkholing"],"a":[1],"e":"此情境明確描述 Load Balance 是 DDoS 緩解策略，由 CEH v13 網路與邊界入侵模組所覆蓋。 Lload balance 分佈多個伺服器或資源接入的網路或應用程式流量，以防止任何單一系統被壓倒。根據 CEHv13,現代 DDoS 緩解架構往往將硬體負荷平衡器與基於雲的洗滌中心或內容傳輸網路(CDN)相結合，這些系統吸收了高流量，透過將請求分散到多個節點來確保可用性，這種方法與組織吸收和分配流量而不是直接阻斷流量的戰略完全一致。其他選項不正確 :黑洞出行路線使包括合法出行在內的全部出行流量下降。限制費率限制流量，而不是分配流量。 Sinkholing 將流量重新定向進行分析，而不是裝入分佈。","s":"term"},{"n":137,"c":"密碼學","ce":"Cryptography","t":"mid","q":"You are Michael, an ethical hacker at a New Yorkbased e-commerce company performing a security review of their payment-signing service. While observing the signing process (without access to private keys), you note the service generates a fresh random value for each signature operation, the signature algorithm uses modular arithmetic in a subgroup defined by public domain parameters, and signatures are verified with a public verification key rather than by decrypting the message. Which asymmetric algorithm best matches the signing mechanism you observed?","o":["DSA","RSA","Diffie-Hellman","ElGamal"],"a":[0],"e":"觀測到的行為最接近於數位簽章演算法(DSA)。 最強的指標有: (1)每次簽名操作產生一個新的隨機值， (2)數學在公有領域參數定義的子群中使用模組算術進行執行， (3)簽名使用公共驗證金鑰進行驗證，而不是透過\"解密\"訊息。 DSA 是一種僅由離散對數原理所衍生的簽名不對稱演算法，它使用公有領域參數，通常代表為(p， q， g)，其中 p 為大質，q 為 p# 1 的質分演算法，而 g 為命令 q 的子組生成器。 對於每個簽名，DSA 需要一個獨特的每個訊息的金鑰金鑰隨機數字 k。 這個ephemeral k 是關鍵: 重用它(或可預測生成它)可以曝光私密金鑰。 情境強調\"每次簽名操作的新鮮隨機值\"直接與這個核心DSA 要求相符合。相比之下， RSA 簽名可以不同方式執行(通常涉及模組化的加貼) 並且本質上不需要像 DSA's k(雖然一些修補程式方案可能涉及隨機性)這樣的新的隨機的每個簽名金鑰。 Diffie-Hellman 主要是一個關鍵交換演算法， 不是一個簽名演算法。 ElGamal 可以用於簽名，也使用隨機性，但提及\"由公有領域參數定義的子組\"和經典的每個簽名隨機值要求與許多安全課程和評估中使用的 DSA 的標準描述最為一致。因此，根據所描述的簽名過程特徵，最好的匹配是 A。DSA。","s":"term"},{"n":138,"c":
