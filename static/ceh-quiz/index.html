power grid infrastructure. During your red team operation, you conduct a phishing campaign targeting field engineers and successfully gain access to the internal OT network. From there, you identify unsecured access to the substation's programmable controllers and replace one of the system's firmware components with a custom payload. This payload silently processes your commands while maintaining access across reboots. Based on this action, which type of IoT OT threat are you simulating?","o":["Forged malicious device","Firmware update attack","Remote access using backdoor","Exploit kits"],"a":[1],"e":"描述的活動最直接匹配了韌體更新攻擊。 在 CEH 覆蓋 IoT 和 OT 威脅中，韌體代表了在嵌入式裝置和工業控制器上執行的低等碼，並損害它是最有衝擊力的持久性方法之一，因為它能活下來再發並經常透過正常的設定重排而持續。 該設想方案稱，Sameer\"取代了系統韌體元件之一併帶有自訂的酬載\"，而酬載\"維持了對 reboots 的存取\"，這些是韌體級妥協的簽名特徵，通常透過不安全韌體更新機制，簽名或核查控制薄弱，被曝光的更新介面，或者管理埠的准入控制不足來實現。當裝置接受未簽名的韌體，使用弱完整性檢查，允許被降級為易被攻擊的版本，或者在沒有強烈認證的情況下暴露更新服務時，會發生韌體更新攻擊。 惡意韌體安裝後，可以隱蔽地執行命令，操縱裝置行為，隱藏其存在而不受更高階別的監測， 並建立一個在 OT 環境中難以修補程式和再生的持久立足點。 CEH 強調 OT 裝置如可程式設計控制器和分站自動化裝置特別敏感，因為韌體被篡改會影響可用性和安全性，而不僅僅是機密性。使用後門的遠端存取是一個更寬泛的概念，可能是酬載的功能，但這裡的主要技術是透過修改韌體來實現持久性。 Forged 惡意裝置指的是引入流氓硬體和開發工具箱通常用於終端的自動化開發，而不是控制器韌體的替換。","s":"term"},{"n":215,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"Which technique best exploits session management despite MFA, encrypted cookies, and WAFs?","o":["CSRF","Side jacking","Session fixation","Insecure deserialization"],"a":[3],"e":"CEH v13 強調，不安全的反序列化是最危險的應用弱點之一，因為它可以導致任意的程式碼執行，繞過認證，授權，和工作階段保護完全。即使使用 MFA，加密 Cookie，以及 WAFs，反序列化缺陷也允許攻擊者操縱工作階段處理中使用的序列化物件，在沒有驗證的情況下反序列化時，這些物件可能會執行攻擊者控制的程式碼。 CSRF 依賴於認證的使用者。側夾被減輕了加密。 工作階段的固定如果執行工作階段再生和 MFA 則無效。 但是，不安全的去區域化會攻擊應用程式。邏輯本身，使其成為最有效的選擇。因此，選項 D 是正確的。","s":"term"},{"n":216,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"You are an ethical hacker at Sentinel Cyberworks, engaged to assess the wireless defenses of HarborTrust Bank in Portland, Oregon. During your assessment, the security team shows you a production system that continuously places selected APs into a passive scan mode, aggregates alarms from multiple wireless controllers into a central engine for forensic storage, and can automatically apply countermeasures (for example, time-sliced channel scanning and remote configuration changes) across the campus when it classifies a nearby device as malicious. Based on the described capabilities, which Wi-Fi security solution is this most consistent with?","o":["WatchGuard Wi-Fi Cloud WIPS","RFProtect","Fern WiFi Cracker","Cisco Adaptive Wireless IPS"],"a":[3],"e":"所描述的能力與企業的有線入侵防禦系統(WIPS)緊密結合到 WLAN 基礎設施中:它使用無線基地台作為感測器(將所選的AP 安裝到被動掃描/監視模式)，關聯和聚合來自多個控制器的提醒到一箇中央引擎中進行分析。和法證保留，並且當一個裝置被歸類為惡意時，可以在整個校園推動自動對策(如協調通道掃描和遠端設定執行)。 這與 Cisco Adaptive Wireless IPS 最為一致。 Cisco 的適應性 WIPS 模型使用現有的 Cisco 無線架構(控制器和 AP)提供全校範圍的監控和執法。 \"選項APs 進入被動掃描模式\"這一短語是適應感應器使用的有力指標--AP 可以被專用或被分時間進行掃描，系統可以協調跨頻道的覆蓋。 集中式引擎概念也與企業 WIPS 部署一致，從多控制器蒐集事件和警報，用於關聯性和長期儲存，支援事件調查和合規。為什麼其他選擇不合適:Fern WiFi Cracker(C)是一種攻擊/assessment 工具，不是生產防禦平台，它不提供集中的警報聚合和自動化的企業對策。 RF Protect (B)是一個已知的無線安全/WIPS 溶液家族，但問題的特點設定和措辭(\"可適應\"，APs 用於被動掃描，控制器-綜合對策)與思科的可適應 WIPS 概念最相匹配。 WatchGuard Wi-Fi Cloud WIPS(A)是一種由供應商管理的 WIPS 供貨；雖然它能夠提供監測，但情境強調多控制器整合到中央引擎中，並透過WLAN 基礎設施協調校園對策--這與 Cisco 的控制器/AP 生態系統也最為一致。因此，最好的答案是 D。 Cisco 適應性無線 IPS。","s":"term"},{"n":217,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"In the bustling city of Chicago, Illinois, ethical hacker Sophia Nguyen is contracted by TaskFlow Systems, a U.S.-based project management provider, to review the security of its template upload feature. During testing, Sophia discovers that by modifying the input parameters in an upload request, she can trick the application into retrieving sensitive files from the server ' s local directories. This flaw allows her to view internal configuration files that should never be exposed through the web interface. She records her findings in a report for TaskFlow ' s security team. Which vulnerability is this?","o":["Insecure Deserialization","Cookie Poisoning","File Injection","Local File Inclusion"],"a":[3],"e":"題目描述攻擊者操弄要求參數，使應用程式擷取並揭露伺服器本機目錄中的檔案；這是本機檔案包含（Local File Inclusion, LFI）的典型特徵。當應用程式使用可由使用者控制的輸入建構檔案路徑，例如範本、語言檔案、include 功能或上傳功能，卻未適當驗證或限制該路徑時，就可能發生 LFI。\n\n攻擊者可提供相對路徑遍歷序列等值，迫使應用程式存取非預期的本機資源，造成設定檔、認證資訊、金鑰或環境檔案等敏感資料外洩；視情境而定，還可能造成進一步影響。\n\n本題明確指出 Sophia 修改上傳要求中的輸入參數，誘使應用程式從伺服器本機目錄擷取敏感檔案，並查看內部設定檔。這正是輸入驗證不當及檔案路徑處理不安全所造成的 LFI。\n\n不安全的反序列化（A）是對序列化物件進行不安全處理，常可能導致遠端程式碼執行；Cookie 毒化（B）是竄改 Cookie值，以提升權限或改變應用程式行為；檔案注入（C）是較廣泛的檔案濫用概念。透過參數包含或讀取本機檔案的特定模式，最精確的名稱仍是本機檔案包含。因此，正確答案是 D。","s":"term"},{"n":218,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"An attacker exploits medical imaging protocols to intercept patient data. Which sniffing technique is most challenging?","o":["MRI firmware interception","Ultrasound malware","Covert channel within administrative messages","Embedding data inside CT scan images"],"a":[3],"e":"這個情境描述的是:嗅探，一種高度複雜的技術，涵蓋在 CEH v13 Network 嗅探和 steganography 中。 透過將敏感資料嵌入合法影象檔案內，如 CT 掃描，攻擊者可以在避免被偵測的情況下攔截或過濾病人資訊。選項 D 代表一個以素譜學為基礎的隱蔽通道，極難識別，因為:檔案看起來合法標準加密和 IDS 工具不標出它醫療影象自然含有大量資料選項 A 和 B 涉及惡意軟體，這更容易被察覺。 選項 C 涉及基於文字的隱蔽通道，比二進位影象嵌入更容易分析。 CEH v13 將素描法確定為最難偵測的資料隱藏技術之一，使\"選項 D\"正確。","s":"term"},{"n":219,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"During a penetration testing engagement at First Union Bank in Chicago, ethical hacker Rachel Morgan is assigned to assess the internal network for potential sniffing activity that could compromise sensitive customer data. While inspecting traffic in the loan processing department, Rachel observes that a workstation is receiving packets not addressed to it, raising suspicion of a sniffing tool operating in promiscuous mode. To validate her hypothesis, she prepares to conduct an active verification using a classic detection approach. Which detection technique should Rachel use to confirm the presence of a sniffer in this case?","o":["Sniffer detection using an NSE script to check for promiscuous mode","DNS method by monitoring reverse DNS lookup traffic","ARP method by sending non-broadcast ARP requests","Ping method by sending packets with an incorrect MAC address"],"a":[3],"e":"在 CEH 網路安全概念中，驗證一款主機是否執行嗅探器的常用方法是使用活動刺激來測試多發性-模式行為，然後觀察被懷疑的機器是否對流量作出反應，通常應該放棄。 \"平接法\"是一種經典的方法:測試者傳送 ICMP 回聲請求流量，因此乙太網訊框使用不正確的去向 MAC 位址，而 IP 層仍然瞄準被懷疑的主機的去向 IP。 在正常的 NIC 操作下，訊框帶有去向MAC。與介面不符( 且不是 廣播/多播) 被丟入資料連結層) 永遠不能到達 IP 堆疊， 因此 主機 將不會回應。如果介面處於亂交模式，則 NIC 透過更多的訊框到作業系統進行處理。在某些設定中，這可以讓 IP 堆疊看到並回應 ICMP 請求，儘管訊框的 MAC 目的地是錯誤的。這個出乎意料的回覆被用作一個指標，即主機可能正在擷取流量亂交，與封包嗅探器的存在一致。其他選項與所描述的\"經典活動核查\"不太一致。 逆向 DNS 監測是一種間接的 heuristic，而不是對混雜模式的可靠確認。 NSE 指令碼是工具專用的，而不是問題所強調出經典的基礎技術。 ARP 基於方法存在以封包嗅探器偵測，但所呈現的選項較少直接地與 ICMP 不正確-MAC 材料所描述的知名的 ICMP 確認相接。"},{"n":220,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"You are conducting a security audit at a government agency. During your walkthrough, you observe a temporary contractor sitting in the staff lounge using their smartphone to discretely record employees as they enter passwords into their systems. Upon further investigation, you find discarded documents in a nearby trash bin containing sensitive project information. What type of attack is most likely being performed?","o":["Cisco-in attack","Insider attack","Distribution attack","Passive attack"],"a":[1],"e":"行為描述與內幕攻擊最相匹配，因為演員是一名臨時承包商，其實際接近並隱含進入員工工作和處理敏感資訊的內部區域。在 CEH 指導中，\"內幕\"不限於長期員工；它包括承包商，供應商，實習生，以及任何可以進入設施或進入內部環境的可信賴或半受信任的個人。 攻擊結合了兩種常見的內幕輔助技術:肩窺和垃圾桶搜尋。 記錄員工輸入密碼是一種肩上衝浪形式，透過直接檢視或記錄裝置觀察或捕獲認證條目來取得認證資訊。在垃圾桶中查詢敏感檔案表示垃圾桶搜尋，攻擊者從處置不當的材料中取得機密資訊。這些行動一般是可行的，因為攻擊者已經身在周邊，可以利用薄弱的作業安全做法，如缺乏清潔辦公桌執法、粉碎政策不足等。 CEH 材料強調，內部威脅特別危險，因為它們繞過許多外部周邊控制，可以與正常的工作場所行為相融合。其他選項不合適。 發行攻擊一般是指透過供應鏈或第三方發行渠道引入的妥協，而不是現場觀察和垃圾回收。 被動攻擊過於籠統，無法捕捉授權或信任的存在使妥協得以實現的關鍵要素。 \"Cisco-in attack\"不是此情境的標準 CEH 攻擊類別。 因此，最準確的分類是內幕攻擊。","s":"term"},{"n":221,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"Which defense MOST disrupts ransomware spread?","o":["Backup","IDS","Network segmentation","AV"],"a":[2],"e":"正確答案是 C，因為網路分解最直接地打亂了勒索軟體在整個組織的傳播。 勒索軟體加密或鎖上系統，並要求支付回收；WannaCry 等例子通常被討論，因為它們透過脆弱的系統和網路服務來傳播。 在取回的符合 CEH 材料中，WannaCry 透過 SMB 透過從被感染的電腦掃描到其他脆弱系統，然後用下一臺機器執行來傳播。 網路分解透過將網路分為單獨的區域或 VLAN，並限制不必要的東西向來減少這種風險。部門、伺服器、工作站和關鍵系統之間的通訊。如果一個端點被感染，分割可以阻止惡意軟體到達檔案伺服器、網域控制站、備份和其他端點。 備份對於恢復極為重要，但不會停止擴散。IDS 可能偵測出可疑活動，而 AV 可能遮蔽已知的惡意軟體，但分塊是最直接限制勒索軟體傳播的防禦。","s":"term"},{"n":222,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"A national logistics company in Atlanta, Georgia maintains a segmented research VLAN inside its primary data center to study emerging supply-chain targeting tactics. The environment includes enterprise-grade server platforms hosting web applications, database services populated with curated operational data, and identity services configured to resemble production access structures. During a red team engagement, external adversaries who gained initial access were observed interacting with systems inside this VLAN for several days. They escalated privileges, accessed structured data repositories, moved between internal hosts, and attempted to reach additional internal segments. All activity occurred within the controlled environment and was instrumented to capture attacker techniques in depth. Which honeypot deployment model most accurately describes this research environment?","o":["Low-Interaction Honeypot","High-Interaction Honeypot","Pure Honeypot","Medium-Interaction Honeypot"],"a":[1],"e":"正確答案是 B。 High-Interaction 蜜罐。環境包含現實的系統，真實的服務，身分結構，資料庫，以及內部主機。 攻擊者被允許與環境進行長時間的互動，提升權限，橫向移動，並在記錄所有動作時進行更深的活動。 這是高互動蜜罐的下定義行為。 符合 CEH 蜜罐材料解釋道，高互通性蜂窩由執行各種服務的高度受控網路組成，攻擊者可以在此連線，嘗試更深入的妥協，並將活動記錄下來進行分析。 它還指出，這些環境經常使用真實的應用和服務，使得蜜罐更難被攻擊者發現。選項 A。 低互通蜜罐是不正確的，因為低互通性蜂蜜壺模仿有限的服務，不允許有深刻的妥協。選項 C。 純蜜罐在這裡的準確性較低，因為情境強調為相互作用和儀器化而設計的可控研究 VLAN，而不是作為純蜜罐而被動地監測的正常生產系統。選項 D。 中 Interactive 蜜罐是不正確的，因為攻擊者與現實的內部服務互動，並進行延伸的入侵後活動，超越了中相互作用。因此，最好的答案是 B。 High-Interaction 蜜罐。","s":"term"},{"n":223,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"A security analyst investigates unusual east-west traffic on a corporate network. A rogue device has been physically inserted between a workstation and the switch, enabling unauthorized access while inheriting the workstation's authenticated network state. Which evasion technique is being used?","o":["Exploiting a wireless rogue access point to tunnel through the firewall","NAC bypass using a pre-authenticated device for network bridging","Spoofing ARP responses from a dynamic IP allocation pool","VLAN double tagging to shift between network segments"],"a":[1],"e":"Network 存取控制(NAC) 解決方案往往只認證連線到連接埠.CEH 的第一個裝置。 CEH 解釋攻擊者可以在已經認證的主機後插入一個無賴裝置，繞過 NAC 檢查，這創造了一個透明的橋樑，在注入攻擊者控制的通訊時轉發合法流量。"},{"n":224,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"At a Miami-based cryptocurrency exchange, investigator Jake uncovers that attackers exploited exposed API keys to issue unauthorized cloud commands, leading to resource abuse and lateral movement inside the cloud environment. Which cloud hacking technique is most directly demonstrated in this incident?","o":["Cryptojacking","Enumerating S3 buckets","Wrapping attack","Compromising secrets"],"a":[3],"e":"最直接展示的技術是 D。 妥協秘密，因為攻擊者濫用了被曝光的 API 金鑰去驗證給雲提供方，並執行未經授權的雲指令。在符合 CEH 的雲攻擊路徑中，\"密\"通常包括 API 金鑰，存取權杖，金鑰，密碼，憑證，和服務帳戶認證資訊。 當這些秘密被曝光時(例如，在原始碼中硬碼被洩露出公共暫存器，在端點中不安全地被儲存，或者意外被記錄)，攻擊者可以使用它們來獲得與合法帳戶或服務身分相同的特權。一旦獲得有效的 API 金鑰， 攻擊者通常執行與被損壞的身分權限一致的行動: 旋轉計算， 修改 IAM 政策， 存取儲存， 禁用日誌， 建立新的 認證資訊， 並貫穿服務。 事件描述同時提到資源濫用和橫向移動。 資源被濫用是被竊取的雲認證資訊造成的經常後果，因為攻擊者可以向受害者提供基礎設施(通常用於提供瓶子、中轉或其他活動)。 雲環境內部的平面運動可能發生於被損壞的金鑰允許取得額外服務時，或者攻擊者使用起步點來發現並取得其他角色，例項，或秘密(例如透過查詢後設資料服務，閱讀設定商店，或列舉 IAM 權限)。為什麼其他選項不準確:加密劫持具體指非法加密貨幣開採。使用被劫持資源；雖然\"資源濫用\"可能包括開採，但問題的關鍵區別因素是使用被曝光的 API 金鑰釋出命令，這從根本上是認證資訊/secret 妥協。 假設 S3 儲存貯體是一個偵察活動專注於物件儲存發現和錯設定，而不是這裡的中心機制。 包接攻擊與特定的雲克/identity 符號包接方案有關，沒有被曝光的 API 金鑰所顯示。因此，這一事件最清楚地表明瞭損害機密(暴露出 API 金鑰)。","s":"term"},{"n":225,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"Anthony works as a security consultant for a financial services firm in Chicago, Illinois. During an internal engagement, he reviews traffic logs and observes repeated connection attempts to a service that appears to provide directory-related information beyond a single domain. The responses suggest that the underlying database contains entries representing objects across the entire organization rather than being limited to a single segment. As Anthony continues his assessment, he notices that administrators commonly connect to this service when troubleshooting directory-related issues. The service listens on a dedicated port and allows object searches across multiple domains without requiring prior knowledge of the specific domain name. Which service is Anthony most likely enumerating?","o":["Microsoft RPC Endpoint Mapper (TCP/UDP 135)","Global Catalog Service (TCP/UDP 3268)","Lightweight Directory Access Protocol (TCP/UDP 389)","Session Initiation Protocol (TCP/UDP 5060, 5061)"],"a":[1],"e":"正確答案是 B。 Global Catalog Service(TCP/UDP3268)。關鍵指標是多個領域的目錄相關資訊， 整個組織物件搜尋， 和專用的連接埠 3268。 CEH 列舉的參考文獻清單 LDAP 在 TCP/UDP389 上 和 Global Catalog Service 上的 TCP/UDP 3268 作為列舉期間使用的單獨服務。 Global Catalog 在 Active Directory 環境中用於搜尋整個森林的目錄物件，而不僅僅是在單個域內，這比連接埠 389 上的標準 LDAP 更符合情境。選項 A 是不正確的，因為連接埠 135 地圖上有 Microsoft RPC 端點對映器 RPC 服務，而非森林-寬目錄物件。選項 C 是不正確的，因為連接埠 389 上的 LDAP 是目錄存取，但情境具體描述了跨域的/global 目錄搜尋。選項 D 不正確，因為 SIP 用於語音/video 訊號，而不是 Active Directory 列舉。因此， 最好的答案是 B。 Global Catalog Service(TCP/UDP3268)。"},{"n":226,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"Cyber experts conducting covert missions exclusively for national interests are best classified as:","o":["State-sponsored hackers","Organized hackers","Gray hat hackers","Hacktivists"],"a":[0],"e":"CEH v13 將國家贊助的駭客歸類為高技能的專業人士，他們在政府指導下開展間諜活動、情報蒐集、破壞或網路戰。 這些襲擊者往往針對外國政府、關鍵基礎設施和戰略產業。 2。 界定的特徵是:政府技術支援國家或地緣政治目標高階資源和長期運動選項 B、C 和 D 並不適合。 有組織的駭客通常是出於經濟動機的網路犯罪集團。 灰色帽子未經授權運作，但並非出於國家利益。 駭客獨立追求意識形態或政治事業。 CEHv13 明確將秘密情報行動與國家贊助的行為者聯絡起來，使\"選項 A\"正確。","s":"term"},{"n":227,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"A regional law firm authorizes a wireless resilience evaluation after employees report intermittent connectivity disruptions in conference rooms. An ethical hacker assigned to the assessment analyses client behaviour while transmitting carefully crafted 802.11 management frames toward the organization ' s primary access point. Each transmission immediately causes several connected laptops to lose association with the network, requiring users to reconnect manually. Connectivity interruptions occur only when the crafted frames are sent. Identify the wireless attack illustrated by this activity.","o":["Eavesdropping Attack","Jamming Attack","Evil Twin Attack","Deauthentication Attack"],"a":[3],"e":"正確答案是 Deauretentication Attack。 CEH 無線安全覆蓋解釋解說攻擊濫用 802.11 管理 訊框強迫無線用戶端與存取點斷開。偽造的解說 訊框傳輸時，使用者端裝置認為他們已經接到指令終止關聯，必須手動或自動重接。 這與情境完全吻合:精心設計的管理訊框被傳送，連線的膝上型電腦立即失去關聯，中斷只發生在那些訊框被傳輸的時候。 干擾是不同的，因為它干擾了無線。透過無線電頻率干擾而不是有效外觀的 802.11 管理資訊進行通訊。 竊聽是被動擷取，而邪惡的雙胞胎涉及一個無賴的存取點冒充一個合法的一對。 CEH 材料將去驗證攻擊描述為常見的無線拒絕和干擾技術，並也注意到它們可能被用於在更廣泛的無線攻擊中強迫重接以握手捕獲。 由於問題集中於由精心設計的管理訊框引起的定向斷開，所以最準確的分類是\"多正性攻擊\"。","s":"term"},{"n":228,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During a reconnaissance engagement at a law firm in Houston, Texas, you are tasked with analyzing the physical movement of employees through their publicly shared media. By examining geotagged images and mapping them to specific locations, you aim to evaluate whether staff are unintentionally disclosing sensitive information about office routines. Which tool from the reconnaissance toolkit would best support this task?","o":["Creepy","Social Searcher","Sherlock","Maltego"],"a":[0],"e":"正確答案是 A。 克莉比 因為任務就是擷取 分析來自公共共享媒體的地理定位資訊(地理塔克) 並繪製資料到現實世界地點，以推斷員工移動模式。 地理定位智慧是足跡的一個共同要素 因為它能揭示敏感的操作細節 諸如辦公地點、 旅行常規、會議地點、家庭位址和存在模式/absence。 為地理定位設計的工具 OSINT 幫助測試人員確定工作人員是否無意中透過社交媒體帖子、上傳的照片或其他公共來源披露地點後設資料。 Creepy 是地理定位偵察的專用設計:它蒐集了與內容相關的位置後設資料，並提供了支援繪圖和時間型別分析的結果，幫助分析家將人、員額和協調聯絡起來。 這直接支援評估員工是否透過釋出帶有地標的影象來披露辦公室常規的敏感資訊的目標。 在經授權的評估中使用這種工具有助於以可衡量的方式表明風險--例如，在某一建築物周圍顯示一組崗哨，在可預見的時間反覆存取，或可支援監視的定期出行路線，瞄準社交工程，或實際入侵規劃。為何其他選項不太合適 : Social Searcher 主要用於透過關鍵詞，使用者名稱，標籤和提及來監測和搜尋社交媒體內容；它對於廣義的 OSINT 集有用，但並不特別側重於地盤擷取和運動對映。 夏洛克設計在許多平台上尋找一個使用者名稱，幫助連結身分，但它並不專門從事地盤定位對映。 Maltego 是一個強大的連結分析平台，可以連線實體(人，域，電子郵件，社會概況)並可以支援 OSINT 調查，但對於從媒體擷取並繪製地標位置資料的狹義要求，Creepy 是最直接和目的性最強的工具。因此，這一地理標記影象運動分析任務的最佳工具是 Creepy。","s":"tool"},{"n":229,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A logistics technology provider in Kansas City, Missouri conducts an internal review after an ethical hacker demonstrates several recurring input-handling weaknesses across different customer-facing web applications. The findings show that validation logic varies between modules, with many controls implemented inconsistently across components developed by separate teams. Although immediate patches are applied to address the identified flaws, similar issues have surfaced in previous platform iterations despite corrective updates. Leadership determines that isolated fixes are insufficient and initiates an effort to standardize how security requirements are defined and incorporated across future development initiatives. Based on the web application attack countermeasures, which category best aligns with this remediation approach?","o":["Insecure Design","Broken Access Control","Security Misconfiguration","Cryptographic Failures / Sensitive Data Exposure"],"a":[0],"e":"正確答案是 A。 不安全的設計。這個問題不僅僅是一個輸入驗證錯誤。 設想題目描述了多個應用程式反覆出現的弱點、各小組之間的控制不一致以及在未來開發工作中實現安全要求標準化的必要性。 這說明存在設計層面的問題，而不僅僅是修補程式或設定問題。 CEH 相接的安全發展材料強調，威脅模型確定和審查威脅、信任邊界、資料流動、弱點以及應用安全設計方面的弱點。 Web 應用程式緩解指南還確定了伺服器-側驗證、輸入字元的白名單或黑名單、消毒、輸出驗證、編碼、準備的報表、參數化查詢、以及作為輸入驗證缺陷的緩解手段繫結變數。選項 B。 斷開存取控制是不正確的，因為情境側重於不一致的輸入處理和驗證設計，而不是未經授權的對函式或物件的存取。選項 C。 Security 設定錯誤是不正確的，因為根問題不是設定不正確的伺服器或框架設定。備選辦法 D。 加密故障/敏感資料曝光是不正確的，因為問題不是關於加密的薄弱或透過加密故障暴露受保護資料。因此，最好的答案是 A.不安全的設計。","s":"term"},{"n":230,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During a red team assessment of a multinational financial firm, you ' re tasked with identifying key personnel across various departments and correlating their digital footprints to evaluate exposure risk. Your objective includes mapping user aliases across platforms, identifying geotagged media, and pinpointing potential insider threats based on social posting behavior. The team has shortlisted multiple tools for the task. Considering the technical capabilities and limitations described in the approved reconnaissance toolkit, which tool provides cross-platform username correlation by scanning hundreds of social networking sites, but does not natively support geolocation tracking or visualizing identity relationships?","o":["Creepy","Social Searcher","Maltego","Sherlock"],"a":[3],"e":"夏洛克是正確選擇，因為它是專門為 OSINT 風格的使用者名稱列舉設計，跨越了非常多的網站。 在符合 CEH 偵察中，一個共同的任務是\"別有用心的關聯\"，測試者透過多個社交網路，論壇，和內容平台來檢查同一使用者名稱是否存在。 夏洛克透過查詢許多支援的站點和報告顯示存在一個給定的使用者名稱的帳戶來自動化這一點。這直接符合問題的要求:“透過掃描數百個社交網站，跨越平台使用者名稱的關聯性”。提示還指定了工具不做的:它\"不原地支援地理定位追蹤或視覺化身分關係\"，這種限制與夏洛克作為焦點使用者名稱發現工具而非分析平台的作用一致。 相較之下，Creepy 與以地緣定位為主的 OSINT 相關，尤其是從社交媒體的帖子和影象中蒐集並關聯位置後設資料，這與所宣稱的限制相反。 Maltego 以關係分析和視覺化連結而出名，使調查人員能夠繪製人物、電子郵件、域和社會實體的圖表--這再次與“不視覺化身分關係”的制約相矛盾。 社會搜尋者更傾向於搜尋和監督公共社交媒體內容，在 CEH 偵察工作流程中，夏洛克適合早期的列舉來擴充套件目標足跡，之後分析師可能會在位置暴露是評估的一部分時，將分泌到馬爾特戈等工具中來進行連結分析或地理定位工具。","s":"tool"},{"n":231,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"A financial startup in Chicago hires an ethical hacker to evaluate its exposure on hidden networks. The client is particularly concerned that confidential administrative documents might be circulating on .onion sites. To remain passive, the hacker relies on advanced search filters to look for files with headers suggesting management-related content. Which of the following queries would best meet this objective?","o":["filetype:docx \" credentials \"","filetype:pdf intitle: \" secure login \" site:onion","filetype:pdf intitle: \" admin access \" site:onion","filetype:docx intitle: \" user accounts \" site:onion"],"a":[2],"e":"目的是在.洋蔥網站對可能暴露的行政檔案進行被動偵察，使用高階搜尋操作器，因此查詢應(1)將結果限制在隱藏網路域空間，(2)側重於可能包含內部材料的檔案格式，(3)使用標題/標題提示來配合管理或管理內容。選項 C 是最好的匹配，因為它結合了:網站:限制結果的.對等資源(受關注的目標環境)，檔案型別:pdf， 以內部檔案(政策、報告、程式、行政出口)的通用格式為重點，以及標題 : 搜尋 page/files 的“ 管理員存取”， 標題/header 後設資料表示行政相關性。 使用標題符合查詢檔案的要求， “ 標題建議管理相關內容 ”， 因為標題是檔案標題和索引後設資料的實際代用。相較之下，A 不包括站點:洋蔥，因此它不被限定為隱藏服務，它針對的是\"認證資訊\"而不是行政檔案。 B 包括站點:洋蔥與檔案型別:pdf，但標題焦點是\"安全登入\"，它更可能找到認證頁或通用安全指導，而不是行政檔案曝光。 D 也是可信的(docx + 使用者帳戶)，但\"使用者帳戶\"傾向於指代帳戶清單或 HR-style docs，而不是更廣泛的行政存取檔案，PDF 經常被用在正式的行政檔案上，可能更常用地被索引。因此，C 最好地滿足了對.洋蔥站點與行政管理有關的檔案的被動、有針對性的偵察要求。"},{"n":232,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"Which method of password cracking takes the most time and effort?","o":["Dictionary attack","Rainbow tables","Shoulder surfing","Brute force"],"a":[3],"e":"正確答案是 D。 Brute force。 A 暴力破解攻擊 是一款密碼-打分法，它系統地嘗試每個可能的字元組合，直到發現正確的密碼。因為它不依賴於被預編成的單詞清單，常用的密碼，或之前生成的雜湊資料庫，因此被認為是最詳盡和最耗時的密碼-打分技術。在 CEH 密碼-攻擊概念中，字典攻擊一般更快，因為它使用一個被預先定義的常用密碼和單詞清單。 彩虹表在很多情況下甚至更快，因為它們依賴於預計算出可以與被捕獲的密碼雜湊相匹配的雜湊值。 肩窺不是技術用密碼-打分法；它涉及直接觀察一個使用者進入認證資訊。暴力破解攻擊的有效性和持續時間取決於密碼的複雜度，長度，字元集，帳戶關閉政策，以及可用的計算功率。小寫字母，數字，以及特殊字元大大增加了可能的組合數量，使暴力破解的攻擊更加困難和費時。 CEH 應試提示:字典攻擊 = 更快，以單詞清單為主。彩虹臺 = 預計算雜湊取景。 Brute Force = Tries 每一個可能性；大多數時間和精力都需要。肩起衝浪=社交工程觀測技術。因此，布魯特力量是正確答案。","s":"term"},{"n":233,"c":"系統入侵階段","ce":"System Hacking Phases","t":"long","q":"Working as an Information Security Analyst at a technology firm, you are designing training material for employees about the dangers of session hijacking. As part of the training, you want to explain how attackers could use sidejacking to compromise user accounts. Which of the following scenarios most accurately describes a sidejacking attack?","o":["An attacker exploits a vulnerability in the company's network firewall to gain unauthorized access to internal systems.","An attacker intercepts network traffic, captures unencrypted session cookies, and uses them to impersonate the user.","An attacker uses social engineering techniques to trick an employee into revealing their password.","An attacker convinces an employee to visit a malicious website that injects a harmful script into their browser."],"a":[1],"e":"根據認證的道德駭客(CEH)系統駭客和工作階段劫持模組，側相劫是一種工作階段劫持的形式，攻擊者被動地擷取了網路流量來捕捉未加密的工作階段 cookie。 這些 cookie 隨後被再用來冒充認證使用者而不需要認證資訊。 CEH 檔案解釋道，側行劫通常發生在未加密的 HTTP 連線上，公共 Wi-Fi 網路上，或者內部網路安全不當。 工作階段 cookie 被竊後，攻擊者可以重放以取得受害者的活動工作階段。選項 B 正確描述了這一機制並直接匹配了 CEH 對側相劫持的定義。備選 A是指周邊開發，而不是工作階段劫持。選項 C 描述了社交工程，這與側式劫機無關。選項 D 是跨網站指令碼攻擊(XSS)，而非側式劫持的例子。 CEH 強調 HTTPS 執行和安全 Cookie 屬性作為關鍵對策。"},{"n":234,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"During a controlled red team engagement at a financial institution in New Jersey, ethical hacker Ryan tests the bank ' s resilience against stealth-based malware. He plants a custom malicious program on an employee workstation. After execution, he observes that the infected files continue to function normally, but his malware conceals its modifications by intercepting operating system calls. Antivirus scans repeatedly return \"no threats detected,\" even though the malicious code remains active and hidden on the system. Which type of virus did Ryan most likely deploy in this assessment?","o":["Cavity Virus","Stealth Virus","Polymorphic Virus","Macro Virus"],"a":[1],"e":"正確答案是 B。 Sefeth Virus，因為描述的特徵是透過擷取作業系統的呼叫和遮掩變化來隱藏惡意存在，這樣一般的工具(包括防毒掃描)就不會觀察到感染。 在 CEH-對齊的惡意軟體概念中，sefeth Virus 被設計為透過隱藏對檔案，靴子記錄或系統區域的修改來逃避偵測。 他們通常透過鉤接系統功能或 API 來做到這一點，這樣當 OS 或一個安全產品請求檔案內容，大小，檢查和和，目錄清單或其他後設資料時，病毒會返回看起來乾淨或原始的資料而不是被感染的/modified 版本。這使得被感染檔案看起來\"正常執行\"，而惡意軟體仍然活躍在記憶體並停留在磁碟上。劇情明確提到\"被感染檔案繼續正常執行\"，惡意軟體\"透過擷取作業系統呼叫來掩蓋其修改\"，這就是隱形技術的經典行為:操縱系統報告的內容，不一定改變應用程式的外向行為。 重複的\"不偵測出威脅\"結果也一致:在惡意軟體控制掃描器讀取目標檔案或系統的介面時，基於簽名或基礎掃描可以被矇蔽結構。為什麼其他選項不太正確:多形態病毒專注於改變感染之間的編碼/signature 來逃避以簽名為基礎的偵測，但這裡的關鍵線索是 OS 呼叫擷取並隱藏修改，而不是程式碼突變。 宏病毒針對宏觀化檔案，並透過宏觀執行在辦公應用程式中傳播；它主要不是由 OS-級別呼叫鉤來定義。 一個腔狀病毒(spacefiller)在不改變檔案大小的情況下，透過插入自己在檔案中未使用的區域來隱藏，但情境的重點在於攔截 OS 呼叫來隱藏變化，這更直接是隱形病毒的行為。因此，瑞安最有可能部署一種隱形病毒。","s":"term"},{"n":235,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a security assessment in San Francisco, an ethical hacker is tasked with evaluating a network ' s resilience against stealthy reconnaissance attempts. The hacker needs to employ a scanning technique that leverages TCP flags to evade detection by intrusion detection systems, relying on the target ' s response behavior to infer port states without completing a full connection. Which approach best aligns with this strategy, ensuring minimal visibility during the assessment?","o":["TCP Connect Scan","Network Scanning","FIN Scan","NULL Scan"],"a":[2],"e":"FIN 掃描是 CEH 網路掃描方法中討論的經典\"stealth\"TCP 掃描技術。 與完成全三向交握並高可見於日誌的 TCP 連線掃描不同，FIN 掃描傳送了 TCP 封包，只將 FIN 旗設定為目標連接埠。 掃描後解釋目標的回應，推斷出連接埠是開口還是閉口，沒有建立正常的 TCP 工作階段。 這個匹配設想方案要求\"在未完成全連線的情況下推斷出連接埠狀態\"，並保持能見度低。邏輯依賴於許多 TCP/IP 堆疊定義的預期 TCP 行為。對於一個已關閉的連接埠， 目標一般用 RST 封包回應， 表示沒有服務監聽。對於一個開放的連接埠， 許多系統對出乎意料的 FIN 封包完全不回應(因為它與已存在的連線不對應)。 \"沒有反應\"的行為會成為測試者用來懷疑連接埠的訊號可能被開啟或被過濾。 CEH 強調，由於 FIN 掃描不進行握手，因此它們可能不太可能觸發某些基於連線的基本記錄，它們產生的明顯連線事件會比 TCP 連線掃描少。選項 D，NULL 掃描也是隱形方法，但它使用一個沒有設定旗標的封包。 這個問題特別突出槓桿 TCP 旗標，通常以 CEH 風格的問題對映為FIN 掃描，作為代表性的\"TCP 旗隱形掃描\"。 選項 B 太通俗了，選項 A 是最可被察覺的。 因此，FIN 掃描與所描述的隱形偵察 策略最為吻合。","s":"term"},{"n":236,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"During an internal red team engagement at a financial services firm, an ethical hacker named Anika tests persistence mechanisms after successfully gaining access to a junior employee's workstation. As part of her assessment, she deploys a lightweight binary into a low-visibility system folder. To maintain long-term access, she configures it to launch automatically on every system reboot without requiring user interaction. Which of the following techniques has most likely been used to ensure the persistence of the attacker's payload?","o":["Installing a keylogger","Creating scheduled tasks","Modifying file attributes","Injecting into the startup folder"],"a":[1],"e":"建立預定任務是最有可能的持久性技術，因為它可以在系統啟動或重啟時自動執行，而不需要使用者在操作中或手動啟動任何裝置。在 CEH 相接的開發後和持久性概念中，攻擊者通常使用作業系統本機一個預定任務非常適合這個目標，因為它可以被命名為合法，被設定在一個特定帳戶下執行，並被系統啟動、使用者登入或定時時間表等事件所觸發。該設想方案明確規定，每一次重啟時，酬載的發射都無需使用者互動，這與啟動的預定任務保持一致。插入啟動資料夾通常會觸發執行， 當使用者 日誌 開啟， 而不是嚴格在系統重開時， 它取決於互動使用者 工作階段。 這與不使用者互動的要求相矛盾。 修改檔案屬性， 如設定隱藏屬性或系統屬性， 改善隱性， 使檔案不那麼明顯， 但本身並不建立自動執行機制。 安裝 鍵盤側錄程式 是一個。能夠捕捉鍵盤，而不是一種持久性方法，而且除非與自動啟動機制配對，否則它不會在重啟後從本質上保證執行。因此，直接確保二進位在每次重啟後以受控和可靠的方式執行的行動正在創造出預定的任務，這是道德駭客工作流程中強調的一種經典持續方法，用於展示現實世界攻擊者的行為並改進防禦探測和硬化。","s":"term"},{"n":237,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During a penetration test at a retail company in Seattle, Washington, an ethical hacker needs to disguise her scans so they appear to originate from a specific hardware vendor. The organization uses MAC-based logging, and by assigning a vendor-associated identifier, she can make her traffic blend in with legitimate devices on the network. Which Nmap command should she use to achieve this?","o":["nmap -sT -Pn --spoof-mac 00:11:22 10.10.1.11","nmap -sT -Pn --spoof-mac Dell 10.10.1.11","nmap -sT -Pn --spoof-mac 0 10.10.1.11","nmap -sT -Pn --spoof-mac 00:01:02:25:56:AE 10.10.1.11"],"a":[1],"e":"正確的選項是 B，因為它使用基於供應商的 MAC 欺騙，這是使流量看起來最直接的方法，它來自由特定，可識別的供應商(在此情況下是\"Dell\")所製造的裝置。 在 MAC 位址中，MAC 位址的第一部分是 OUI(組織上唯一的識別符號)，它識別出供應商/manufacturer。許多安全和資產工具透過將觀測到的 OUI 與已知的銷售商對接來進行輕量級裝置剖面，而 MAC 基於的日誌可以根據它們的 OUI 是否與預期的公司端點相匹配來記錄或標出裝置。 Nmap 支援 MAC 欺騙的方式允許指定一個供應商名稱，因此所產生的 MAC 位址與該供應商相關聯的 OUI 生成出。 這符合情境中的要求:測試者希望掃描流量透過採用與供應商相關的識別符號來\"與合法裝置相通\"，而不是使用隨機或明顯不尋常的 MAC 字首。為什麼其他選擇不合適:A 只提供部分字首等同值(不是完整的 MAC)，它沒有明確對映出一個賣家名，使其與\"特定硬體供應商\"混合體不相適應。C 使用 0(零)，通常與生成隨機 MAC 而不是選擇特定的供應商身分相關；隨機化並不能保證與被選中的供應商足跡探查階段混合。 D 提供了一個完全明確的 MAC 位址；雖然這可以 spoof a MAC，但它並沒有從本質上表達\"作為一個特定的供應商\"的意向，除非你已經知道確切的 MAC 的 OUI 屬於所期望的供應商。 問題強調直接選擇一個與供應商相關的識別符號，這正是選項 B 所要做的。因此，基於供應商的偽裝的最佳匹配是 B。"},{"n":238,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"You perform a FIN scan and observe that many ports do not respond to FIN packets. How should these results be interpreted?","o":["Conclude the ports are closed","Escalate as an active breach","Attribute it to network congestion","Suspect firewall filtering and investigate further"],"a":[3],"e":"根據 CEHv13 網路掃描技術，FIN 掃描是一種只傳送 TCP 封包並帶有 FIN 旗集的隱形掃描方法，它的行為依賴於 RFC 793,它規定關閉的埠必須使用 TCP RST 進行回應，而開放的埠應當靜默地放下封包。不過， 現代 防火牆， IDS/IPS 系統， 和加硬的 TCP/IP 堆疊經常過濾 或默默地放下 FIN 封包，而不論 連接埠狀態。 當 FIN 掃描後，大量埠沒有反應，但它並沒有確切表明港口是開放的。 CEH v13 強調，這種行為通常指由 防火牆 過濾 封包 或安全控制系統。選項 A 是不正確的，因為缺乏回應並不肯定意味著埠被關閉。 選項 B 是一種過度反應；光是隱形掃描異常並不能表示違反。 選項 C不太可能是因為擁堵會影響多個協定，而不是有選擇地壓制 FIN 回應。 CEH v13 建議，當 FIN 掃描產生模稜兩可的結果時，分析人員應當使用額外的掃描型別(如 SYN 掃描)來將結果聯絡起來，並調查防火牆規則和過濾行為。 因此，選項 D是最準確的解釋，並和 CEH 指導對齊。"},{"n":239,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"During a scheduled security review in a high-tech lab in Austin, Texas, penetration tester Lucas Bennett was assessing a state government's new payroll system hosted in a private cloud. One humid afternoon, while fuzz testing the input validation logic of the TaxCalcEngine.dll module, he triggered a buffer overflow by submitting malformed taxpayer ID strings. The crash led to unintended disclosure of payroll data due to unchecked data boundaries. Lucas traced the issue to a coding oversight in a core processing module. Applying a structured analysis approach, which category best describes the vulnerability he discovered?","o":["Application Flaws","Poor Patch Management","Misconfigurations Weak Configurations","Design Flaws"],"a":[0],"e":"應用法勞斯是最佳分類，因為根由是應用程式輸入處理中的編碼錯誤，導致緩衝區溢位。 在符合 CEH 的弱點分類中，應用缺陷包括執行錯誤，如檢查不當，字串處理不安全，以及輸入驗證不充分等。 情境明確表明盧卡斯使用模糊測試來對照輸入驗證邏輯，並觸發了緩衝區溢位使用畸形的納稅人 ID 字串，然後觀察到由於資料邊界不受限制而無意中披露了工資資料。 這些細節表明執行時的程式碼行為存在缺陷，而不是行政或設定問題。 poor 修補程式管理一般指未應用出貨商修補程式或更新，使得已知的弱點可以被利用。 提示沒有表明這個問題是先前已知的，修補程式的缺陷，仍未被標註；相反，它描述了新發現的缺陷，可追溯到一個內部模組和\"編碼監督\"。 錯誤的設定或薄弱的設定涉及到一些不安全的設定，比如過度放任的存取控制，被曝光的服務，預設的認證資訊，或者不安全的雲端儲存政策等。 這裡沒有這些觸發器； 觸發器是錯誤的輸入導致記憶體腐敗。 設計缺陷涉及系統架構或安全模型的弱點， 如缺少授權邏輯、 弱點的信任界限或不安全的工作流程。 雖然設計不良會助長影響， 但所描述的具體弱點機制是執行級記憶體處理失敗。因此，正確的分類是\"應用法\"(Application Flaws)，因為弱點從根本上來說是應用程式程式碼中的輸入-處理和邊框檢查缺陷，導致緩衝區溢位和資料曝光。","s":"term"},{"n":240,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"During a red team engagement at Apex Biotech in Dallas, ethical hacker Rachel calls the company ' s HR desk pretending to be Mark Stevens, a senior finance manager. She pressures the HR staffer by citing his \"upcoming presentation for the CFO\" and insists he urgently needs a copy of the updated employee benefits spreadsheet. The staffer feels compelled to help due to Rachel's convincing manner and authoritative tone. Which social engineering technique is Rachel demonstrating in this exercise?","o":["Quid Pro Quo","Impersonation","Vishing","Reverse Social Engineering"],"a":[1],"e":"正確答案是 B。 Impersonation，因為瑞秋的主要技術是假裝是一個特定的，合法的員工(\"馬克·史蒂文斯，高階財務經理\")來誘導 HR 員工披露或傳遞敏感資訊。 在符合 CEH 社交工程概念中，冒名頂替是冒充他人的身分或角色--往往是權威或有可信的商業需要的人--以獲得信任並說服目標執行他們本來不應採取的行動(例如分享機密檔案、重設認證資訊或繞過核查步驟)。該設想包括了 CEH 中通常強調的多個社交工程影響因素:權威(自稱為高階財務管理並引用 CFO)，緊迫性(\"即將呈現\"和\"緊迫需要\")，以及降低員工遵循標準驗證程式的可能性的壓力。 這些要素強化了冒名頂替，使請求既感到合法又具有時間敏感性，使守約情況日益惡化。 目標的反應 - - 由於 Rachel 權威的語氣而不得不感到 - - 與冒名頂替襲擊的預期心理影響相匹配。為何其他選擇不正確:Vishing (voice fishing) 是一個透過電話進行社交工程的送貨通道。 雖然這種互動發生在電話中，但問題在於所展示的技術。 這裡的定義技術是身分欺騙(假冒)，而不僅僅是介質。 Quid 還原涉及提供一些交換品(例如\"如果你給我你的密碼，我會解決你的問題\")，這個交換品不存在。 反轉社交工程涉及攻擊者製造出問題並定位為幫助者，這樣受害者聯絡他們；這沒有被描述，因為瑞秋發起電話並直接要求檔案。因此，對瑞秋方法最準確的分類是\"冒名頂替\"。","s":"term"},{"n":241,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"In the heart of Silicon Valley, ethical hacker Sophia Nguyen is hired by InnoVate Solutions, a San Francisco- based startup, to secure their cloud-based task management platform. On March 15, 2025, Sophia begins testing a feature that allows users to upload custom workflow templates to streamline project assignments. By carefully crafting a template file, she manipulates the platform's data processing, triggering unexpected behavior that grants her administrative access to restricted project dashboards. The issue arises from the platform's handling of user-supplied data during object reconstruction, not from database queries, client-side code execution, or session manipulation. Sophia documents her findings to help InnoVate's developers strengthen their application. Which web application vulnerability is Sophia most likely exploiting in InnoVate Solutions' task management platform?","o":["Session Hijacking","Local File Inclusion","Verbose Error Messages","Insecure Deserialization"],"a":[3],"e":"不可靠的反序列化是最佳匹配，因為情境明確描述在物件重建過程中正在處理的使用者提供的資料。 在符合 CEH 的Web 應用程式安全概念中，反序列化是取取序列化資料的過程，如 JSON，XML，YAML，或二進位物件，並將其轉換回應用程式可以使用的內元物件。 當一個應用程式接受來自未信任來源的序列化物件，並在沒有強烈驗證，完整性檢查和安全型別限制的情況下重建這些物件時，攻擊者可以篡改序列化內容來改變物件欄位，注入出乎意料的物件型別，或者在重建過程中觸發不安全的行為。關鍵線索是索菲亞上傳了精心設計的範本檔案，並獲得了行政存取和對受限制的儀表板的存取。 通常，當一個被解編的物件包含伺服器信任的角色、權限或帳戶屬性，或者當解編透過裝置鏈或不安全的回撥觸發特權邏輯時，這種結果就會發生。 提示還排除了資料庫查詢，使用者端-側程式碼執行，和工作階段操縱，這消除了常見的替代方案，如 SQL 注入，XSS 和工作階段劫持。 本機檔案包含將強制伺服器使用路徑操作包含本機檔案，此操作在此沒有描述。 Verbose 錯誤訊息可以洩露資訊，但不直接授予管理員存取權。道德駭客指導中強調的緩解包括:在可避免時永遠不取消不信任的資料的序列化，執行嚴格的型別允許清單，對序列化資料應用加密簽名或 HMAC 完整性驗證，使用帶有明確計劃的安全訊框式，重新生成授權決定伺服器-側，而不是信任使用者端提供的物件屬性， 伐木和阻止異常的去區域化企圖。","s":"term"},{"n":242,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"A global fintech company receives extortion emails threatening a severe DDoS attack unless ransom is paid. The attacker briefly launches an HTTP flood to demonstrate capability. The attack uses incomplete POST requests that overload application-layer resources, causing performance degradation. The attacker reinforces their demand with a second threat email. What type of DDoS attack is being carried out?","o":["RDDoS attack combining threat and extortion","DRDoS attack using intermediaries","Recursive GET flood disguised as crawling","Pulse wave attack with burst patterns"],"a":[0],"e":"CEH 材料將 RDDoS (Ransom DDoS) 攻擊描述為威脅驅動的勒索運動，攻擊者要求付款，並透過發動一次壽命短的DDoS 爆破來顯示能力。 目的是恐嚇受害者在更大的持續攻擊開始前支付。 描述的攻擊使用 HTTP 泛洪，且 POST 請求不完整 - - 一個應用程式層的 DDoS 技術，它透過強迫目標持有開啟的連線來消耗伺服器資源。這種演示之後是勒索郵件，精確地與 RDDoS 行為一致。 DRDoS 攻擊涉及透過第三方伺服器的反射/amplification，而這裡沒有發生這種情況。 脈衝波攻擊使用定時出擊，不涉及敲詐勒索，而遞迴 GET 泛洪不匹配不完整的 POST 行為，因此正確的分類是 RDDoS。","s":"term"},{"n":243,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"\"ShadowFlee\" is fileless malware using PowerShell and legitimate tools. Which strategy offers the most focused countermeasure?","o":["Restrict and monitor script and system tool execution","Isolate systems and inspect traffic","Schedule frequent reboots","Clean temporary folders"],"a":[0],"e":"CEH v13 將這個惡意軟體歸類為無檔案惡意軟體，它存在於記憶體中並濫用合法的系統工具(Living-off-the-Land Technology)。 傳統的防毒解決方案往往無效。 CEHv13 建議:指令碼控制 (PowerShell Construction Language Mode) Name 應用程式白名單監測父母-子女過程關係這些措施直接針對惡意軟體的執行方法。 Reboots 和資料夾清理不處理記憶體持久性。"},{"n":244,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"You discover multiple NetBIOS responses during an nbtscan, but only one host returns a < 1B > entry. What does this indicate?","o":["It is the local system","It is a rogue DHCP server","It is the domain master browser / Primary Domain Controller (PDC)","NetBIOS over TCP/IP is disabled"],"a":[2],"e":"在 CEH v13 偵察和列舉中，NetBIOS 名稱字尾用於識別一個 Windows 網路內系統的作用。 < 1B > NetBIOS 字尾特別重要，因為它獨有地識別了域主瀏覽器，在現代 Windows 環境中，它對應了主網域控制站(PDC)。當 nbtscan 被執行時，多個系統可能會用 NetBIOS 名稱回應，但每個系統只有一個系統域將註冊 < 1B > 字尾。這是因為 PDC 負責維護主瀏覽清單，並協調整個域的認證服務。選項 C 是正確的，因為在 CEH 檔案中明確定義了屬於網域控制站的 < 1B > 條目。選項 A 是不正確的，因為當地系統沒有釋出 \" 1B \" 廣告。選項 B 不正確，因為 DHCP 伺服器使用不同的識別符號，不註冊< 1B >。選項 D 是不正確的，因為必須啟用 NetBIOS 使 < 1B > 出現。 CEH v13 突出顯示在列舉期間將 < 1B > 識別為高值發現，因為網域控制站在權限提升和平相移動相中是首要目標。"},{"n":245,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During a security review for a healthcare provider in Denver, Colorado, Ava examines the header of a suspicious message to map the sender ' s outbound email infrastructure. Her goal is to identify which specific system on the sender ' s side processed the message so the team can understand where the transmission originated within that environment. Which detail from the email header should she examine to determine this?","o":["Date and time of message sent","Sender ' s mail server","Sender ' s IP address","Authentication system used by sender ' s mail server"],"a":[1],"e":"為了確定傳送方處理訊息的哪個特定系統，最相關的電子郵件-標頭細節是傳送方的郵件伺服器，通常在\"接收:標頭\"的鏈條中被披露。 每個處理訊息的郵件傳輸代理(MTA)都增加了一個\"接收\"行，表示信件沿途傳遞的系統和接收訊息的系統。 透過從下到上審查這些標頭(最早期的跳出)，分析人員可以確定傳送者使用的原發出基礎設施--如初始提交伺服器，出出中繼，或者首先接受電子郵件送出的閘道器。方案的目標是\"繪製傳送者外出電子郵件的基礎設施\"並識別\"傳送者一邊處理訊息的哪個特定系統\"，這個地圖更直接地用於識別所涉及的郵件伺服器主機名稱(即 MTA)，因為這些是轉發電子郵件的處理系統。 雖然一個 IP 位址可以幫助找到一個主機，但問題強調負責處理的\"特定系統\"，這通常表現為郵件伺服器的身分(hostname/domain)顯示於標頭痕跡中)。 在實踐中，調查人員將傳送者郵件伺服器資訊與 IPs，TLS 細節，以及認證結果聯絡起來，但處理系統的主要頭線索是 Endependent 行所識別的伺服器。為何其他選項不合適 :日期和時間(A)有助於時間分析，而不是確定處理系統。寄件者的 IP 位址(C)可以表示一個源網路，但訊息可能穿越 NAT，中繼，或雲電子郵件服務；它並不總是給處理系統取名。所使用的驗證系統(D)(如 SPF/DKIM/DMARC 結果)表示驗證結果，而不是哪個伺服器處理訊息。因此，正確的選擇是 B。 Senders 的郵件伺服器。"},{"n":246,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"long","q":"During a physical penetration test simulating a social engineering attack, a threat actor walks into the lobby of a target organization dressed as a field technician from a known external vendor. Carrying a fake ID badge and referencing a known company name, the attacker confidently claims they've been dispatched to perform a routine server room upgrade. Using internal-sounding terminology and referencing real employee names gathered via OSINT, the individual conveys urgency. The receptionist, recognizing the vendor name and the convincing language, allows access without verifying the credentials.","o":["Perceived authority and reliance on third-party familiarity","Leaked credentials on public networks and forums","Trust in physical security logs used by security teams","Misconfigured network segmentation allowing unauthorized access"],"a":[0],"e":"CEH 的社交工程原理強調權威，緊迫性，信任弱點利用等心理操縱技術，並有假冒。 在這種情境下，攻擊者利用“有遠見的權威”這一強大的影響戰術，即社交工程攻擊者作為擁有合法權力或獲得許可的准入者--例如技術員、審計員或供應商代表--而提出的。 CEH 強調，使用技術術語引用真實的僱員姓名，並冒充受信任的第三方夥伴，會提高可信度並減少核查阻力。 接待員接受攻擊者的存在在不驗證認證資訊與古典權威的開發相匹配的情況下進行。 leaked 認證資訊，物理安全日誌，和網路分割問題與人層的社交工程無關。 情況明確反映了 CEH 心理攻擊向量中描述的對信任和權威的操縱。"},{"n":247,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"A Linux server has world-writable cron directories. What can attackers achieve?","o":["DoS","SQLi","XSS","Persistence"],"a":[3],"e":"正確答案是 D，因為可被世界寫入的克龍目錄允許未經授權的使用者或攻擊者新增或修改已排定的任務。 在 Linux 中，克龍用於在被定義的時間自動執行命令或指令碼，而符合 CEH 的材料將 crontab 確定為列出已排定的工作表的機制/tasks。如果克龍目錄被每個人寫出，攻擊者可以放置一個在入侵後，登入後，或重啟後反覆執行的惡意指令碼或克龍條目。 這支援了維持存取的 CEH 系統-hacking 階段，也稱持久性。 上傳的紅隊參考文獻特地將 Linux\"永久存取\"關聯到以克龍為主的預定執行。 Linux 權限是基於讀取，寫取，執行權限，過度放任的設定，如所有使用者完全存取，都造成了嚴重的控制弱點。 這不是 SQL 注入或 XSS，因為沒有 Web 應用程式輸入。它主要不是 DoS。最好的 CEH 答案是持久性。","s":"term"},{"n":248,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"During a quarterly vulnerability management cycle at a multinational logistics firm, Priya ' s team has already applied patches and fixes to address confirmed vulnerabilities. Now, she directs the analysts to run follow-up scans and review the attack surface to confirm that the applied remedies have effectively eliminated the risks. Only after this step will she prepare a compliance report for the executive board. Which phase of the Vulnerability-Management Life Cycle is Priya executing?","o":["Monitoring","Verification","Risk Assessment","Remediation"],"a":[1],"e":"Priya 正在進行核查，因為小組已經完成了補救工作(檢查和修復)，目前正在進行後續掃描和攻擊地表審查，以確認所應用的變化實際上解決已查明的弱點。 在標準的弱點管理生命週期中，補救是透過修補程式、設定更硬化、補償控制或取消弱勢服務等行動解決弱點的階段。 在補救之後立即進行核查，以確保補救有效，沒有遺漏任何東西，也沒有提出新的問題。該情境的排序是最強的線索:\"已經應用的修補程式和修補\"意味著補救完成；\"執行後續掃描.以確認\"表示補救結果的驗證；\"只有在這一步驟之後她才會準備遵守報告\"反映，組織通常需要證據表明補救在向領導或審計員報告狀況之前是有效的。核查通常包括重新掃描受影響的資產、檢查設定基線、驗證脆弱版本不再存在、確保服務按預期執行以及確認無法複製原始調查結果。為什麼其他選項不匹配 :補救(D)是修補程式/fixing 活動本身，已經發生。風險評估(C)是優先順序和影響評價階段，通常在補救之前進行，以便決定首先應如何解決以及如何緊急解決。監測(A)是持續的觀測和持續評估(追蹤暴露，趨勢，新的弱點)，但普裡亞的具體任務是後定號確認步驟，即核查。因此，正確的階段是 B。 核查。","s":"term"},{"n":249,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During a penetration test, you perform extensive DNS interrogation to gather intelligence about a target organization. Considering the inherent limitations of DNS-based reconnaissance, which of the following pieces of information cannot be directly obtained through DNS interrogation?","o":["The specific usernames and passwords used by the organization's employees.","The estimated geographical location of the organization's servers derived from IP addresses.","The subdomains associated with the organization's primary internet domain.","The IP addresses associated with the organization's mail servers."],"a":[0],"e":"CEH 足跡和偵察模組將 DNS 審訊描述為一種寶貴的技術來擷取公開的基礎設施資訊，如 A 記錄，MX 記錄，NS 記錄，和子域。 DNS 可以顯示:子域(透過區域轉移、野蠻強迫或列舉)郵件 伺服器 IP 位址( MX 記錄)伺服器 從 IP 地理位置推斷出的位置然而，DNS 並不儲存認證資訊。 使用者名稱和密碼在認證系統和目錄中受到保護，而不是 DNS 記錄。因此，選項 A 是正確的。 CEH 明確指出，DNS 偵察僅限於基礎設施後設資料，而不是敏感的使用者認證資訊。"},{"n":250,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"Natalie Brooks is leading an authorized red team exercise for Sentinel Networks in Seattle. While briefing her team on different attacker profiles, she describes an individual who is new to cybersecurity, actively learning techniques through online communities, and experimenting with basic tools on low-risk targets to build practical skills without causing significant damage. Which hacker class best matches this profile?","o":["Blue Hat Hacker","Green Hat Hacker","Gray Hat Hacker","Red Hat Hacker"],"a":[1],"e":"正確答案是 B。 Green Hat Hacker。 黑克。綠色帽子駭客是一個正在學習駭客技術並建設實用技能的初學者或新來者。情境中的簡介描述了網路安全的新人，積極向線上社群學習，並實驗基本工具。 符合 CEH 的駭客分類材料描述一種被也稱為 n00b， newbie，或 Green Hat Hacker 的 Neophite，是新人駭客或發作，對技術和駭客的知會或經驗很少或根本沒有。選項 A。 Blue Hat Hacker 是不正確的，因為藍帽駭客通常在系統啟動前與外部 bug 測試有關。選項 C。 Gray Hat Hacker 是不正確的，因為灰色帽子可能違反規則或權限，而不一定有惡意。選項 D。 Red Hat Hacker 是不正確的，因為紅帽一般與針對惡意駭客或高價值目標的攻擊行動有關。因此，最好的答案是 B。 Green Hat Hacker。 黑克。 黑克， 黑克。","s":"term"},{"n":251,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"A penetration tester needs to identify open ports and services on a target network without triggering the organization ' s intrusion detection systems, which are configured to detect high-volume traffic and common scanning techniques. To achieve stealth, the tester decides to use a method that spreads out the scan over an extended period. Which scanning technique should the tester employ to minimize the risk of detection?","o":["Use a stealth scan by adjusting the scan timing options to be slow and random","Perform a TCP SYN scan using a fast scan rate","Execute a UDP scan targeting all ports simultaneously","Conduct a TCP Xmas scan sending packets with all flags set"],"a":[0],"e":"CEH v13 內容解釋道: 隱形掃描涉及修改掃描時間參數來減少封包頻率，隨機分出間隔，並避免識別出典型由入侵探測系統所標出的模式。 慢點 隨機計時--通常用 Nmap 的 T0 實現 或 T1 計時範本--防止流量暴增 並且允許掃描能混入正常的網路噪聲。 IDS/IPS 為高容量事件而調製的系統可能無法偵測出這種漸進的偵察。 Fast SYN 掃描生成安全監測工具容易識別出的獨特模式。 UDP 掃描，特別是跨越所有港口， 生產高 Xmas 掃描雖然有時用於對無國籍過濾器進行隱形，但在需要時仍然可以識別和不合適。因此，應用慢隨機的計時選項與 CEH 批准的偵察技術 匹配，用於在列舉開放埠時逃避偵測。"},{"n":252,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"You are a cybersecurity analyst at a global banking corporation and suspect a backdoor attack due to abnormal outbound traffic during non-working hours, unexplained reboots, and modified system files. Which combination of measures would be most effective to accurately identify and neutralize the backdoor while ensuring system integrity?","o":["Review firewall logs, analyze traffic, and immediately reboot systems","Monitor system and file activity, apply anomaly detection, and use advanced anti-malware tools","Enforce strong passwords, MFA, and regular vulnerability assessments","Apply ACLs, patch systems, and audit user privileges"],"a":[1],"e":"根據 CEH v13 安全營運與事件回應，後門是允許攻擊者持續進入的隱形機制。 未經解釋的出行流量，未經授權的檔案修改，以及不規則的回放等指標強烈暗示了入侵後的持續機制。 CEH v13 推薦一個行為和以主機為基礎的偵測方法用於後門識別。 持續的系統和檔案活動監測有助於偵測未經授權的二進位，登錄變化，以及預定的任務。 異常偵測識別出與正常系統行為的偏差，這對於發現逃避簽名偵測的隱藏後門至關重要。此外，具有熱能和記憶體分析能力的先進抗瘧疾工具對於識別傳統防毒可能錯過的尖端後門至關重要。 這些工具可以偵測 rootkits、無檔案持久性和隱蔽通訊渠道。其他選擇是預防性的，但不是調查性的。 立即反彈可能會破壞可變的證據，而密碼政策和 ACL 不會發現現有的妥協。 因此，選項B 提供了最有效的和符合 CEH 的反應。"},{"n":253,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, loT, and OT Hacking","t":"mid","q":"At a power distribution facility in Phoenix, Arizona, ethical hacker Sameer Das is performing an OT security assessment. He demonstrates that a programmable controller accepts modifications delivered over the network without checking the origin or cryptographic validity of the package. By uploading altered instructions, he changes how the controller processes commands during operations. Which IoT/OT threat best represents this technique?","o":["Firmware update attack","Forged malicious device","Remote access using backdoor","Exploit kits"],"a":[0],"e":"正確答案是 A。 堅固軟體更新攻擊 因為劇情描述的是攻擊者 提供未經身分驗證的， 未經電腦驗證的更新/package 至控制器 併成功改變其操作邏輯。在 IoT/OT 環境中， 控制器(PLCs， RTUs，(美國) 計票人， 和嵌入式工業裝置)經常支援更新韌體 或邏輯在網路上維護。 如果裝置不驗證更新包的來源，完整性和真實性--通常透過簽名的韌體，憑證，以及安全的更新通道--攻擊者可以用惡意修改的版本來取代合法程式碼。 Sameer 的演示地圖直接到 firmware/logic 更新折中:他上傳了\"更改了的指令\"，並改變了控制器在操作過程中如何處理指令。 這恰恰是 OT 安全中強調的風險型別:未經授權修改控制器邏輯會導致不安全狀態，破壞生產，損壞裝置，或者產生難以被偵測到的隱形操縱。 明確提及\"不檢查來源或密碼有效性\"，說明數位簽章，雜湊核查，可信更新機制等缺失控制，這些是韌體更新安全的核心。為什麼其他選項的準確度較低: 偽造的惡意裝置通常是指引入一個無賴或被克隆的裝置進入環境來冒充合法裝置。 使用後門的遠端存取意味著現有的隱藏存取機制，而不是濫用更新機制本身。 弱點利用包一般是用於折中系統的弱點利用物的集合，通常在端點/web 上下文中討論更多；它們沒有具體描述由於缺少驗證，控制者接受被改變的固態 ware/logic 包的行為。因此，該技術最好被歸類為韌體更新攻擊，利用虛弱或缺失的真實性/integrity 檢查更新包來修改 OT 控制器行為。","s":"term"},{"n":254,"c":"社交工程","ce":"Social Engineering","t":"long","q":"During a social engineering simulation at BrightPath Consulting in Denver, ethical hacker Liam emails employees a message that appears to come from the company's security team. The email urgently warns that \"all systems will shut down within 24 hours\" unless staff download a patch from a provided link. The message is deliberately false and contains no actual malware, but it causes confusion and prompts several employees to call IT for clarification. Which social engineering technique is Liam demonstrating?","o":["Hoax","Baiting","Pretexting","Spam"],"a":[0],"e":"最好的答案是 A。 Hoax，因為情境是圍繞一個虛假的警報資訊建構的，該資訊旨在激起恐懼、緊迫和反應行為，而不是發出真正的酬載。 in 符合 CEH 社交工程概念，一種惡作劇一般涉及散發被捏造的警告(例如，聲稱即將系統失效，病毒在內部傳播，帳戶被刪除，或災難性的斷絕)來操縱使用者採取不必要的行動或進一步傳播訊息。 關鍵特徵是內容有意不真實，旨在利用人類心理學--特別是緊迫性和恐懼--來破壞正常的操作或觸發不安全的決定。 這裡，利亞姆冒充安全團隊，並聲稱\"所有系統將在 24 小時內關閉\"，除非員工採取行動。儘管電子郵件中並沒有惡意軟體，但它仍然實現了一個常見的騙局結果:混亂、生產力損失和員工接觸 IT 時服務檯負載增加。 在現實世界的攻擊中，騙局可以被用作更有害的步驟(例如將受害者推向不安全的連結，說服他們安裝假\"胸罩\"，或者製造干擾防禦人員的噪音)的前奏。 但定義特徵仍然是虛假的安全警告和它導致的行為操控。 為什麼其他選項不太正確: Bating 依賴於用某種吸引性的東西(自由軟體，獎品，\"獨家\"內容)來誘導受害者讓他們點選或插入媒體；這種情境是 fear/urgency，而不是誘惑。 預告是建立可信賴的可編造的身分/story以取得資訊或行動；在冒充存在的同時，問題標誌是故意與惡作劇一致的假警報。垃圾郵件指的是未經請求的批次資訊，不是透過欺騙來定義即將到來的關閉或安全危機。 因此，Liam 正在展示一種社交工程的騙局技術。","s":"term"},{"n":255,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"You are Noah Kim, an ethical hacker at Quantum Cyber Solutions, hired to test the mobile device security of TechTrend Innovations, a tech firm in Austin, Texas. During a covert assessment, your objective is to simulate an attacker attempting to gain privileged access to an iPhone 12 running iOS 14.5 used for proprietary app development. You apply a jailbreaking technique that allows the device to fully restart without requiring a computer, maintaining a patched kernel and enabling access to sensitive app data in the file system. Based on this method, which iOS jailbreaking technique are you using?","o":["Semi-tethered jailbreaking","Untethered jailbreaking","Semi-untethered jailbreaking","Tethered jailbreaking"],"a":[1],"e":"唯一符合所有描述的關鍵特性的選項是:裝置可以重啟通常不需要電腦，在重啟後，在核心級修改仍然有效的情況下，越獄依然活躍。在符合 CEH 的行動裝置安全概念中，越獄型別的主要區別是重啟後發生的事情。斷開繫緊的隔閡需要電腦啟動裝置。 如果電話重新啟動而不與電腦連線， 則無法完成啟動程序。 這與情境相反， 情況明確表明裝置可以完全重啟而不需要電腦。 半導體越獄可以讓手機在沒有電腦的情況下重啟，但它會進入非斷裂狀態，意味著權限和核心得到提升修補程式在透過工具重新啟用之前不會活動。 半未啟用的越獄類似， 因為它可以正常地在沒有電腦的情況下啟動， 但是越獄不會自動持續； 通常需要每次重啟後重新啟用越獄才能重新獲得核心修補程式和特權存取。方案說明重啟同時“ 維持一個被修補程式的核心”， 並繼續存取受保護的檔案系統資料， 這表明在重啟過程中的持久性。 這種持久性是未脫節的越獄的決定性特徵。 從防禦和評估角度來說，這被認為是更高的風險，因為它提供了連續的重啟後特權存取，增加了資料存取視窗，篡改，以及與重啟重設越獄狀態相比的持久性機制。","s":"term"},{"n":256,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"During an ethical hacking exercise, a security analyst is testing a web application that manages confidential information and suspects it may be vulnerable to SQL injection. Which payload would most likely reveal whether the application is vulnerable to time-based blind SQL injection?","o":["UNION SELECT NULL, NULL, NULL--","' OR ' 1 ' = ' 1 ' --","' OR IF(1=1,SLEEP(5),0)--","AND UNION ALL SELECT ' admin ' , ' admin ' --"],"a":[2],"e":"CEH 的 SQL 注入覆蓋度區分了經典(error-based)，工會(collean-blink)，和時間(blink)相接 SQL 注入。 應用時不將資料庫錯誤或查詢結果還給攻擊者(沒有可見輸出)，但攻擊者可以透過測量回應延遲來推斷執行行為。基於時間的酬載故意觸發了資料庫延遲函式(例如:SLEEP ()，WAITFORDELAY，pg_sleep ()取決於 DBMS)。 如果注入成功，頁面回應時間可以預測地增加，確認正在執行攻擊者控制的 SQL。選項 C 是正確的基於時間的盲探，因為它使用條件邏輯(IF(1=1,SLEEP(5),0))只有在被注入的條件評價為真時才會造成可測量的延遲。 CEH 教導這種技術對抑制出錯並消化出輸出的硬化應用特別有效，因為時機成為確認的側道。選項 A 和選項 D 是 UNION-基於酬載的圖案，意在透過返回的結果集擷取資料，基於時間的盲景通常不提供。 選項 B 是一種經典的認證-bypass/boolean 測試；它可以表示注入，但在輸出無法被觀察到時，它並不具體驗證基於時間的盲行為。 CEH 緩解引導包括參數化查詢，嚴格輸入驗證，最小優先度 DB 帳戶，WAF 除錯，以及集中記錄以偵測異常查詢時間模式。"},{"n":257,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"A red team member uses an access token obtained from an Azure function to authenticate with Azure PowerShell and retrieve storage account keys. What kind of abuse does this scenario demonstrate?","o":["Gathering NSG rule information","Exploiting managed identities for unauthorized access","Lateral movement via Stormspotter","Enumeration of user groups with AzureGraph"],"a":[1],"e":"CEH 雲安全模組強調， Azure 管理身分讓函式、 VMs 和自動化任務等工作量可以認證到 Azure 資源而不儲存秘密。如果攻擊者獲得與管理身分相關的標誌，他們可以冒用該身分並存取任何 Azure。在此情況下，所捕獲的存取符用於透過Azure PowerShell 認證並取回儲存帳戶金鑰，透過劫持管理下的身分來顯示未經授權的特權使用。 這直接與管理下的身分濫用相匹配， 攻擊者利用身分標誌而不是使用者認證資訊。 NSG 規則蒐集以及 AzureGraph 列舉是偵察的活動，Stormspotter 用於視覺化攻擊路徑，而不是濫用身分。 因此，這個情境清楚地說明了對管理下的身分的利用。"},{"n":258,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"During a red team exercise at Horizon Financial Services in Chicago, ethical hacker Clara crafts an email designed to trick the company's CEO. The message, disguised as an urgent memo from the legal department, warns of a pending lawsuit and includes a link to a fake internal portal requesting the executive's credentials. Unlike generic phishing, this attack is tailored specifically toward a high-ranking individual with decision- making authority.","o":["Whaling","Spear Phishing","Clone Phishing","Consent Phishing"],"a":[0],"e":"捕鯨是正確答案，因為情境描述了一種針對\"大魚\"的高度針對性的釣魚嘗試--一位高階執行官(CEO)。 在 CEH 術語中，捕鯨是一種專門的釣魚形式，即:這些目標往往可以取得敏感的資料、財務批准、特權制度和戰略通訊，使其認證資訊的價值大大高於典型員工。攻擊者(Clara)使用 CEH 訓練中強調的經典社交工程驅動器:權威(冒充法律部門)，緊急/fear(\"待訴\")，以及對內部流程的信任(一個與一個假定的內部入口網站的連結)。 這種組合旨在短路正常的驗證行為並迅速遵守。 列入一個認證資訊收割連結符合共同的釣魚目標:捕獲使用者名稱/passwords，允許帳戶接管，並可能促進更廣泛的妥協(例如，商業電子郵件妥協的電子郵件存取、橫向移動或特權升級)。為什麼其他選項的準確性不高:魚叉式網路釣魚也是目標，但它是一個更廣泛的類別，針對任何級別的特定個人或團體。這裡的定義線索是執行級目標，它將其提升為捕鯨。 克隆釣涉及複製先前收到的合法電子郵件並交換惡意連結或附件，這一細節並不存在。同意釣魚通常濫用合法的 OAuth。/應用同意流而不是一個假的入口網站請求認證資訊。","s":"term"},{"n":259,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"A Windows machine shows disabled Windows Defender without admin approval. What phase is this?","o":["Delivery","Persistence","Recon","Defense evasion"],"a":[3],"e":"正確答案是 D， Defense sweaty。 Windows Defender 是 端點 的保護和防瘧軟體控制。如果未經管理員批准而禁用，可能的攻擊者的目標是避免偵測，防止惡意軟體掃描，並減少惡意處理、有效酬載或工具被遮蔽的可能性。 CEH 惡意軟體和系統入侵概念描述了攻擊者試圖避免安全控制的若干方式， 諸如從防毒簽名中隱藏惡意軟體，使用打包機或加密器使惡意軟體更難被偵測，以及使用 rootkits 或覆蓋追蹤技術來掩蓋妥協，這不是交付，因為問題沒有描述傳送惡意軟體或將惡意軟體放入受害人系統。它不是持久性的，因為沒有描述維持長期存取的機制。它不是偵察，因為沒有資訊 - -由於攻擊者正在削弱監測和保護控制，因此致殘的 Windows 防禦人員最適於躲避防衛。","s":"term"},{"n":260,"c":"惡意軟體威脅","ce":"Malware Threats","t":"long","q":"Ethical hacker Ryan Brooks, a skilled penetration tester from Austin, Texas, was hired by Skyline Aeronautics, a leading aerospace firm in Denver, to conduct a security assessment. One stormy morning, Ryan noticed an unexpected lag in the routine system update process while running his tests, sparking his curiosity. During a late-night session, he observed a junior analyst, Chris Miller, cautiously modifying a legacy server's configuration, including a scheduled task set to a specific date. The lead developer, Jessica Hayes, casually mentioned receiving an odd email from an unfamiliar source, which she ignored as clutter. As Ryan probed deeper, he detected a faint increase in network activity only after the scheduled date passed, and a systems admin, Mark Thompson, quickly pointed out some unusual code traces on a dormant workstation. Which type of threat best characterizes this attack?","o":["Logic Bomb","Fileless Malware","Advanced Persistent Threat APT","Ransomware"],"a":[0],"e":"邏輯炸彈是惡意軟體或惡意軟體碼，在系統內被故意放置，並在滿足特定條件時設定執行，如特定日期和時間，使用者動作，或檔案是否存在等。 CEH 材料將邏輯炸彈描述為基於條件的可以長時間保持休眠的觸發器，產生最小的指標直到觸發發生。 本場景中最決定性的線索是\"被設定為特定日期的任務\"，隨後是僅在該日期過後出現的異常行為，這是用於啟用惡意行為並避免被早期發現的教科書觸發機制。“ 來自不熟悉來源的拼接郵件” 提示了初始傳送或社交工程向量， 但核心行為是延遲啟用。 後期的“ 僅在預定日期過後網路活動才會增加 ” 與一個執行 酬載 的邏輯炸彈相匹配， 如信標、 資料過濾或允許遠端存取。 \"不尋常的程式碼追蹤到休眠工作站\"進一步支援了被植入的程式碼直到被觸發才被活化的想法。無檔案惡意軟體在記憶體中強調使用 PowerShell 或 WMI 等合法工具執行，其定義多取自於其生活外出技術，而非以日期為基準的觸發。 APT 描述一種更廣泛的運動風格，涉及長期，多階段的入侵，而不是一個定義性的觸發文物。 勒索軟體的特徵是加密和敲詐行為，沒有描述。 因此，這種威脅最好被定性為邏輯炸彈。","s":"term"},{"n":261,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"Why is NTP responding with internal IP addresses and hostnames?","o":["TCP fallback abuse","DNS poisoning","Honeypot redirection","Misconfigured NTP daemon allowing external queries"],"a":[3],"e":"CEH v13 解釋道:NTP(UDP 連接埠 123)如果設定不當，可以洩露敏感網路資訊。 當一個 NTP 守護程序允許不受限制的外部查詢(如 monist 或 ntpq 命令)時，攻擊者可以列舉內部的 IP 位址和主機名稱。這種曝光是已知的偵察弱點，在資訊披露和放大攻擊中都曾被利用。 CEH v13 強烈建議使用存取控制清單限制 NTP 查詢存取。 DNS 毒化和蜂蜜壺不能解釋 NTP列舉的合法反應，因此，選項 D 是正確的。"},{"n":262,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"During an internal assessment, a penetration tester gains access to a hash dump containing NTLM password hashes from a compromised Windows system. To crack the passwords efficiently, the tester uses a high- performance CPU setup with Hashcat, attempting millions of password combinations per second. Which technique is being optimized in this scenario?","o":["Spoof NetBIOS to impersonate a file server","Leverage hardware acceleration for cracking speed","Dump SAM contents for offline password retrieval","Exploit dictionary rules with appended symbols"],"a":[1],"e":"密碼破解是系統駭客相中的核心成分。 CEH 材料強調，一旦得到密碼雜湊，攻擊者經常進行離線破解來避免偵測和繞行帳戶鎖出政策。 Hashcat 等工具使用硬體加速--具體來說是 GPU 或多核心。 CPU 計算 - 要顯著地增加快克輸送量。 硬體加速可以使系統同時進行上千到上百萬個雜湊計算，與傳統的 CPU-捆綁方法相比，大大提高了快克效率。 傾銷 SAM內容是認證資訊擷取的一部分，但並不是情境中描述的最佳化。 詞典規則影響快克策略而不會影響生動速度。 NetBIOS欺騙與密碼破解無關。 這裡的強調是將計算功率最大化以加速雜湊-斷裂過程，直接與 CEH 對硬體加速下線破解技術的解釋相配合。"},{"n":263,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"At RedCore Motors, the IT security lead, Priya, is tasked with selecting a vulnerability management solution for their expanding hybrid infrastructure. During the evaluation, she prioritizes tools that support agent-based detection across endpoints, offer constant monitoring and alerting capabilities, and provide comprehensive visibility into both on-premises and cloud-based systems. After thorough testing, she selects a platform that promises to scan for vulnerabilities everywhere accurately and efficiently, aligning with her organization's need for centralized visibility and real-time risk assessment. Which vulnerability assessment tool did Priya MOST LIKELY select?","o":["Nessus","Nikto","Qualys VM","OpenVAS"],"a":[2],"e":"Qualys VM 是最佳匹配，因為情境強調企業弱點管理，以混合環境為基礎，以代理為主的端點覆蓋，持續監測，提醒，以及跨地上和雲層系統的集中能見度。 在符合 CEH 的安全業務概念中，弱點管理不僅涉及進行定期掃描，而且涉及保持準確、不斷更新的資產風險檢視，確定風險的優先次序併產生可操作的補救工作流程。 為混合基礎設施設計的平台通常包括端點的輕量級劑、雲聯結器、統一的儀表板、持續評估、以及支援即時風險決定的通知或提醒功能。 Qualys VM 因透過一個集中式雲平台提供弱點管理而被廣泛認可，該平台具有廣泛的資產能見度，並支援與大規模分佈環境相適應的連續評估模式。其他選項與全部要求集不相適應。 Nikto 是一個有重點的網路伺服器和 Web 應用程式掃描器，並不代表一個針對端點和混合資產的全企業範圍的弱點管理平台。 OpenVAS 是一個有能力的開源弱點掃描器，。 但它通常作為掃描解決方案而不是一個完整的混合弱點管理平台來執行，其綜合代理的端點覆蓋度，集中雲能見度，以及所描述的操作警示度等同。 Nessus 是一個強大的弱點掃描器，在一些部署中可以支援代理，但情境強調廣泛的混合基礎設施能見度和集中， *持續監測，併發出最強烈的警報，與 Qualys VM 作為弱點管理平台保持一致。","s":"tool"},{"n":264,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"Which of the following hacking frameworks describes adversary tactics, techniques, and procedures (TTPs) used in cyberattacks?","o":["NIST CSF 2.0","ISSF","MITRE ATT & CK","ISC 28901"],"a":[2],"e":"正確答案是 C。 MITRE ATT & CK。 在 CEH v13-相通的安全操作和威脅情報概念中， MITRE ATT & CK 用於理解和對映網路攻擊中的對手行為。 ATT & CK 代表了反常戰術，技術和共同知識。 它將攻擊者的行動組織成戰術，技術，以及分技術，幫助安全小組瞭解攻擊者想要達到什麼以及攻擊者如何執行每一步。 戰術代表攻擊者的目標，如初始進入，執行，堅持，權限提升，防禦逃逸，認證資訊存取，發現，橫向移動，命令與控制，分出，和撞擊等。 Technology 描述用於實現這些目標的具體方法。 NIST CSF 2.0 是一個網路安全風險管理框架，而不是詳細的對手 TTP 框架。 ISSF 不是對手行為對映的標準 CEH 答案，而 ISC 28901 不用於對網路攻擊 TTP 進行分類，因此 MITRE ATT & CK 是最好的答案。","s":"term"},{"n":265,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a red team operation for XYZ Financial Services, security analyst Lily Jensen is assigned to scan a critical subnet that is protected by an IDS. Her initial scan attempt is immediately flagged and blocked. To evade detection while continuing reconnaissance, she adjusts the scanning configuration to include multiple spoofed IP addresses alongside her own. This makes it difficult for network defenses to isolate her real scanning activity, while still allowing her to receive accurate results. Which scanning technique is Lily using?","o":["SYN FIN Scanning","Source Routing","IP Spoofing","Decoy Scanning"],"a":[3],"e":"所描述的技術是誘餌掃描。 在 CEH 網路掃描方法中，誘餌掃描用於使 IDS 和日誌系統將掃描流量歸屬於多個表面來源，而不是攻擊者的真實的 IP 位址。 攻擊者設定了掃描器來生成額外的探測器封包，這些探測器似乎來源於幾個偽造的誘餌IP 位址，與真正的攻擊者的探測器混合。 這給防禦人員造成了模糊性，因為 IDS 警報和防火牆日誌顯示許多潛在的\"掃描\"，使問題複雜化。歸屬和回應行動，例如遮蔽單一源。提示中的關鍵細節是莉莉\"包括了多個偽造的 IP 與她自己的位址並列\"，並且仍然\"收到準確的結果\"，這與誘餌掃描在 Nmap 等工具中的工作方式相匹配:攻擊者真正的 IP 必須留在混音中，使目標的答覆返回攻擊者，從而能夠準確解釋連接埠狀態。 誘餌主要透過汙染日誌小道來混淆監測和事件反應小組。選項C，IP 欺騙，過於籠統，本身通常會因為迴路流量會去到偽造的位址而使攻擊者無法收到迴路回應。 Decoy 掃描是將欺騙與真實出處相組合來儲存結果的一種具體，有條理的使用。 選項 A 指隱形旗掃描，它降低了握手能見度，但不涉及多個偽造的出處。 選項 B， 源路由， 試圖控制 封包 路徑， 而不是描述的行為。 因此， 正確答案是 Decoy 掃描。","s":"term"},{"n":266,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"During a penetration test at Pinnacle Bank in Chicago, ethical hacker Sarah injects crafted TCP packets into an active communication between a customer ' s browser and the online banking server. The victim ' s connection becomes unstable, allowing Sarah ' s system to maintain communication with the server in place of the legitimate client. She later demonstrates to the IT team how attackers could forcibly take control of live sessions through this approach. Which type of session hijacking is Sarah performing in this scenario?","o":["Passive Session Hijacking","Blind Hijacking","Man-in-the-Browser Attack","Active Session Hijacking"],"a":[1],"e":"正確答案是 B。 Blind Highbacking，因為情節描述為將所製作的 TCP 封包注入到活動的使用者端-伺服器工作階段來擾亂合法的使用者端並接管連線，而不需要攻擊者看到(或完全依賴看到)伺服器的回應。 在 CEH-對齊工作階段劫持分類法中， 盲劫是攻擊者偽造封包(經常與預測)的 TCP/工作階段層的主動接管技術。 或推斷出 TCP 序號)將資料插入到現有的工作階段中 並有可能使合法端點脫同步。例如，觸發再傳送，重發，或序列/ack 不匹配，攻擊者可以有效地將被害者從同步或從工作階段上推出，同時繼續與伺服器通訊，彷彿是使用者端。關鍵線索是莎拉\"將 TCP 封包設計成\"活動通訊\"，而後\"受害人的連線變得不穩定\"，之後莎拉的系統\"維持了與伺服器的通訊，以取代合法的使用者端\"。 這與盲目劫持概念一致，因為攻擊者並非簡單地說。觀察(被動)但積極操控 TCP 流以奪取控制。 攻擊者的目標是強制接管活的工作階段，這往往涉及序列預測和封包注入，成為有效的參與者而真正的使用者端經歷中斷。為什麼其他選項不正確:被動工作階段劫持是竊聽/monitoring 流量，在不改變工作階段的情況下捕獲工作階段標識；它不涉及注入封包或破壞連線。Man-in-the-Browser 是一種使用者端側攻擊(通常透過瀏覽器中的惡意軟體)，在瀏覽器上下文中操縱交易；它不是一個TCP 封包注入技術。 活動工作階段劫持是一個廣義的類別，在高層次上是真實的，但問題在於型別--以及描述的具體技術(TCP 注入導致收購)地圖在 CEH 風格名詞中最直接地被盲目的劫持。因此，莎拉正在展示盲工作階段劫持。","s":"term"},{"n":267,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"In the heart of Silicon Valley, California, network administrator Jake Henderson oversees the web infrastructure for TechTrend Innovations, a startup specializing in cloud solutions. During a routine architecture review, Jake evaluates the setup of their web server, which handles high-traffic API requests. He notes that the server's primary module processes incoming requests and works with additional modules to manage encryption, URL rewriting, and authentication. Curious about the server's design, Jake consults the documentation to ensure optimal performance and security. Which web server component is Jake analyzing as part of TechTrend Innovations' architecture?","o":["Virtual Document Tree","Application Server","Document Root","HTTP Server Core"],"a":[3],"e":"正確答案是 HTTP 伺服器 Core，因為情境描述了一個網路伺服器的主要模組，該模組處理收到的請求並配有負責加密，URL 重寫，以及認證的附加模組。 在符合 CEH 的 web 伺服器架構概念中，核心 HTTP 引擎負責處理使用者端請求，管理連線，解析 HTTP 頭，並將請求傳遞給相宜模組以進行進一步處理。 Apache HTTP 伺服器或 Nginx 等現代網路伺服器使用模組架構執行。 核心元件管理基本的 HTTP 協定操作，而可選或可載入的模組擴充套件了功能。 例如，SSL 或 TLS模組處理加密，重寫模組管理 URL 操作，認證模組執行存取控制。 問題中的描述顯然與這種架構相配合，其中中央處理單位與輔助模組一起工作。其他選項不合適。 檔案根只指服務網頁內容的目錄位置。 虛擬檔案樹涉及 URL 如何邏輯對映到檔案路徑。 應用程式伺服器是一個單獨的伺服器元件，處理業務邏輯，經常與後端系統互動，而不是直接管理 HTTP請求在核心層面解析。因此，Jake 正在分析 HTTP 伺服器 Core，負責處理收到的請求，並整合網路伺服器環境中的模組安全和效能特徵。"},{"n":268,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"A company's online service is under a multi-vector DoS attack using SYN floods and HTTP GET floods. Firewalls and IDS cannot stop the outage. What advanced defense should the company implement?","o":["Configure the firewall to block all incoming SYN packets from external IPs","Use DDoS mitigation services that offer multi-layer protection","Deploy a Web Application Firewall (WAF) with anomaly detection","Increase server bandwidth and apply basic rate limiting"],"a":[1],"e":"CEH v13 強調多向量 DDoS 攻擊需要多層次的 DDoS 緩解服務，往往以云為主，能夠分析，過濾，並洗刷跨網路，運輸，應用層的流量。 這些供應商維持了巨大的頻寬容量，全球洗滌中心，以及區分正統工作階段與惡意泛洪的行為分析引擎。SYN 泛洪和 HTTPGET 泛洪需要不同的同時緩解技術，典型的防火牆或 WAF 在不降低正統流量的情況下無法處理。 遮蔽 SYN 封包(可選 A)會打亂正常使用者。 WAF(可選 C)只處理第 7 層流量，不會減輕網路層的體積攻擊。 增加頻寬(可選D)對大型的殭屍網路攻擊無效。 因此，部署多層雲 DDoS 保護服務是彈性，即時緩解的最有效解決方案。"},{"n":269,"c":"密碼學","ce":"Cryptography","t":"short","q":"An organization uses SHA-256 for data integrity checks but still experiences unauthorized data modification. Which cryptographic tool can help resolve this issue?","o":["Asymmetric encryption","SSL/TLS certificates","Symmetric encryption","Digital signatures"],"a":[3],"e":"SHA-256 是密碼學上的一個雜湊函式，而 CEH v13 則明確指出了僅雜湊函式提供資料完整性，但不能提供真實性或非否定性。 如果攻擊者可以修改資料並重算雜湊，完整性檢查仍將透過。出現這一問題是因為 SHA-256 不能證明是誰建立或修改了資料。為了解決這一弱點，CEHv13 建議使用數位簽章，將雜湊與不對稱密碼學相結合。A 數位簽章確保:完整性(資料沒有改變)認證( 資料由已知實體簽名)不否定(簽字人不能否認該行動)數位簽章透過散開資料並用傳送者的私密金鑰加密雜湊來工作，對資料的任何修改都會使簽名無效。單是加密(選項 A) 和 C)保護機密性， 並非忠誠 SSL/TLS(選項 B)為過境資料提供安全保障 但不保護儲存的資料不被篡改。 CEHv13 明確將數位簽章確定為在光是完整性機制不足時正確的加密控制。 因此，選項 D 是正確的。","s":"term"},{"n":270,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"Using nbtstat -A < IP > , NetBIOS names including < 20 > and < 03 > are retrieved, but shared folders cannot be listed. Why?","o":["File and printer sharing is disabled","NetBIOS runs on a non-standard port","nbtstat cannot enumerate shared folders","The host is not in an AD domain"],"a":[2],"e":"CEH v13 澄清 nbtstat 僅用於 NetBIOS 名稱表 列舉，而非用於列出共享資源。 < 20 > 等標記表示檔案 伺服器服務，但share 列舉需要網景或 SMB 列舉 公用設施等工具。因此，無法列出股票的原因是工具限制，而不是服務設定。 選項 C 是正確的。"},{"n":271,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"short","q":"An Android device has an unpatched permission-handling flaw and updated antivirus. What is the most effective undetected exploitation approach?","o":["SMS phishing","Rootkit installation","Custom exploit with obfuscation","Metasploit payload"],"a":[2],"e":"CEH v13 解釋道，移動式的防毒解決方案嚴重依賴簽名和已知的利用模式。 使用模糊的自訂利用更可能逃避偵測。Metasploit 有效酬載和 rootkits 通常被標記，而 SMS 的釣魚依賴於使用者互動，因此，自訂被混淆的開發程式碼是最隱蔽和最有效的方法。","s":"term"},{"n":272,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a red team assessment at a university in Chicago, Jake, a penetration tester, scans a group of older Windows workstations in the administration department. On several hosts, he notices traffic on UDP ports 137 and 138 as well as an open TCP port 139. Curious, he uses a utility to query the name table and session services. Within moments, he collects information including machine names, logged-in usernames, and available shared folders without authentication. Which enumeration method is being demonstrated in this scenario?","o":["NFS Enumeration","NetBIOS Enumeration","SMB Enumeration","SNMP Enumeration"],"a":[1],"e":"正確答案是 B。NetBIOS 列舉 因為埠 和直接描述到 NetBIOS 的地圖，超過 TCP/IP(NBT) 和 NetBIOS 名稱表的查詢一致和工作階段服務。在 Windows 網路(特別是更舊的系統)中， NetBIOS 提供命名 和可顯示有價值主機的工作階段層服務和使用者資訊。具體來說，UDP137 用於 NetBIOS 名稱服務(NBNS)，UDP138 用於 NetBIOS Datagram 服務，TCP139用於 NetBIOS 工作階段服務。at UDP137/138 的觀測活動以及一個開口的 TCP139 強烈表明 NetBIOS 服務是可達到的，可以被詢問。情節說明 Jake\"使用一種工具來查詢名稱表和工作階段服務\"，這是 NetBIOS 列舉的標誌。NetBIOS 名稱表查詢可以披露機器名稱，網域名稱/workgroup 名，有時還可以登入-登入使用者名稱(取決於設定和註冊名稱)。工作階段/service 列舉可以披露關於活動工作階段和可動用資源的資訊。傑克得到機器名稱的事實 使用者名稱， 和未經身分驗證的共享資料夾與設定薄弱的遺留 Windows 網路一致，其中 NetBIOS/SMB 資訊披露可以透過無效/未認證的查詢。為何其他選項不: NFS 列舉 目標 UNIX/Linux 檔案共享 和與港口無關的 137-139 SNMP 列舉使用 UDP161/162 並依賴 SNMP 社群，而不是 NetBIOS 命名/工作階段 查詢。SMB 列舉 關係密切 並且經常在業務上重疊， 但問題強調\"要清點名字表\" 和工作階段服務”並明確引用了經典的 NetBIOS 連接埠集(137/138-139)。使 NetBIOS 列舉成為這種行為最精確的分類。\n\n在實踐中，防禦人員透過在不必要的情況下使 NetBIOS 喪失能力來緩解這種暴露，在網路邊界限制這些埠，執行 SMB 加固，限制匿名/null 工作階段資訊披露。","s":"term"},{"n":273,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"You are Olivia Chen, an ethical hacker at CyberGuardians Inc., hired to test the wireless network of Skyline Media, a broadcasting company in Chicago, Illinois. Your mission is to breach their WPA2-protected Wi-Fi during a late-night penetration test. Using a laptop in monitor mode, you execute a command to transmit packets that force client devices to disconnect and reconnect, enabling you to capture a four-way handshake for cracking. Based on the described action, which tool are you using?","o":["Aircrack-ng","Airbase-ng","Aireplay-ng","Airodump-ng"],"a":[2],"e":"在 CEH 無線駭客覆蓋範圍內被引用的 Aircrack-ng 套件中，Aireplay-ng 是將訊框注入無線網路的工具，問題的關鍵短語是\"將封包強迫使用者端裝置斷開並重聯\"，這描述了去驗證攻擊，測試者將 802.11 deauth 訊框傳送到使用者端或存取點，導致使用者端放棄其關聯，再重聯。 當一個 WPA2 使用者端重聯時，再次進行 WPA2 四向握手。 透過強制進行這種重聯，一個道德駭客可以捕捉握手並隨後嘗試在離線過程中進行密碼恢復。氣泵-ng 主要是被動捕捉 和監測工具，用於列出出入點 和客戶， 跳過頻道 並捕獲 封包 握手， 空氣裂縫是試圖從抓取的握手方式中取回 WPA/WPA2 預共享的金鑰的裂縫元件。使用單詞清單或其他離線技術； 並不是將用戶端從網路中踢出的工具。 Airbase-ng 用於建立 road 存取點或進行邪惡的雙子風格攻擊，這不同於傳輸去驗證訊框來觸發握手。因此，與描述的主動傳送訊框強制斷開並重聯的動作相匹配的工具是 Aireplay-ng。","s":"tool"},{"n":274,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"Your company performs PCI-DSS audits and penetration testing for third-party clients. During an approved pen test you have discovered a folder on an employee ' s computer that appears to have hundreds of credit card numbers and other forms of personally identifiable information (PII). Which of the following is the best course of action?","o":["Make a copy of the data and store it on your local machine.","Stop the pen test immediately and contact management.","Continue the pen test and include this information in your report.","Contact the employee and ask why they have the data."],"a":[1],"e":"正確答案是 B。 在 CEH 道德駭客和穿透測試指南中，測試者必須嚴格在授權範圍、協定和報告程式範圍內操作。 當意外發現信用卡號碼和 PII 等敏感資料時，測試者不應複製、移動和進一步檢查， 符合 CEH 的指南特別警告，遇到非法或高度敏感材料時，不應將其複製到測試者自己的裝置上，測試者必須遵循團隊指導，並留在接觸協定內。繼續測試可能會增加接觸，擾亂證據，或違反 PCI-DSS 和隱私處理要求。 製作本機副本特別錯誤，因為它為受監管資料創造了另一個未經授權的地點。 直接與僱員聯絡也是不適當的，因為升級應該經過經批准的使用者端聯絡點或管理點。 因此，最好的行動方針是立即停止測試和聯絡管理。"},{"n":275,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"short","q":"A BLE attack captured LL_ENC_REQ and LL_ENC_RSP packets but not the LTK. What is the next step?","o":["Decrypt pcap using -o option","Attack cannot continue without LTK","Use hcitool inq","Use Btlejacking"],"a":[3],"e":"在 CEH v13 Mobile，IoT，和 OT Hacking 中，藍芽低能(BLE)攻擊往往涉及捕獲對接交換。 如果長期金鑰(LTK)沒有被捕獲，解密不可能立即被捕獲。 CEH v13 解釋，在這種情況下，攻擊者可能試圖劫取 Btlejacking，它劫持了已存在的 BLE連線，而不是解密它，這允許命令注入和資料操作，而不需要 LTK。選項 A 和 B 是不正確的，因為解密不是唯一的攻擊路徑。 hcitool 是用於發現的，不是因此，選項 D 是正確的。"},{"n":276,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"While conducting a red team exercise at a corporate office in San Diego, California, you observe employees working in an open-plan area. By discreetly watching their screens and hand movements as they log into internal systems, you are able to capture several usernames and partial passwords without touching any devices or interacting with the staff. Which social engineering technique does this scenario best illustrate?","o":["Shoulder Surfing","Dumpster Diving","Impersonation","Tailgating"],"a":[0],"e":"這種情境最清楚地說明肩上衝浪，一種社交工程技術，即攻擊者透過觀察受害者的螢幕、鍵盤或筆記--往往來自附近的位置--而不與受害者或其裝置直接互動而獲得敏感資訊。 關鍵指標是，測試者在登入時會\"仔細地觀看他們的螢幕和手動\"，並且能夠捕捉出\"使用者名稱和部分密碼\"而不觸碰任何東西。 這就是肩部的定型模式。衝浪:被動觀察以收割認證資訊或其他機密資訊。肩上衝浪在開放式的辦公室，共享的工作空間，機場，咖啡館，或者任何人們可以觀察到進入認證資訊的環境上特別有效。 攻擊者可以直接觀看，使用反射(如玻璃表面)，或者定位自己去檢視鍵盤和螢幕。 即使是部分的密碼俘獲在與其他資訊(使用者名稱，密碼圖案，重置問題，或後期觀察)結合時也可以有價值，它可以幫助攻擊者手動更令人信服的後續社交工程嘗試。為何其他選項不合適:Dumpster Diving (B) 涉及從垃圾堆(列印檔案，媒體，徽章，筆記)中擷取敏感資訊，不即時觀察登入。假冒(C)要求積極假扮為受信任的人(資訊科技工作人員、供應商、僱員)來說服某人披露資訊或允許接觸；這種情境明確避免了與工作人員的互動。牽引(D)是在身體上透過安全門追蹤某人以獲得未經授權的入門；它涉及繞過實際進入控制，而不是捕獲認證資訊。由於該技術依賴於對螢幕和鍵盤的視覺觀察來得到登入細節，正確答案是 A。Shoulder Surfing。","s":"term"},{"n":277,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"Why explore the Deep Web during reconnaissance?","o":["Insider threats","Physical attacker locations","Learning hacking techniques","Non-indexed company data exposure"],"a":[3],"e":"CEH v13 解釋道，\"深網\"包含的內容沒有被搜尋引擎索引，包括被曝光的資料庫，被錯設定的出入口，被洩露出認證資訊，以及內部檔案。這使得評估出乎意料的資料暴露是一個關鍵領域。 Deep Web 主要不是用於攻擊者剖析或內幕探測。因此，選項 D 是正確的。","s":"term"},{"n":278,"c":"密碼學","ce":"Cryptography","t":"short","q":"What is a \"Collision attack\" in cryptography?","o":["Collision attacks try to find two inputs producing the same hash","Collision attacks try to get the public key","Collision attacks try to break the hash into three parts to get the plaintext value","Collision attacks try to break the hash into two parts, with the same bytes in each part to get the private key"],"a":[0],"e":"正確答案是 A。 碰撞攻擊目標為雜湊函式，嘗試找到兩個不同的輸入，產生相同的雜湊輸出。 在 CEH 密碼學主題中，雜湊是單向數學函式，主要用於驗證完整性，而不是加密資料。 一個好雜湊應該為每個不同的輸入產生一個獨特的固定長的文摘，而即使是原始資料的微小變化也應該產生一個非常不同的雜湊值。 CEH 材料指出，在雜湊演算法中，當兩個或兩個以上不同的輸入產生相同的輸出時，會發生相撞。 也解釋碰撞攻擊是對雜湊演算法的攻擊，兩個或兩個以上檔案生成相同的輸出，通常不應該發生。選項 B 是不正確的，因為公開金鑰涉及不對稱的密碼學，而不是雜湊相撞。 選項 C 和 D 是不正確的，因為相撞攻擊不會分出雜湊來取回明文或私密金鑰。"},{"n":279,"c":"密碼學","ce":"Cryptography","t":"short","q":"User A is writing a sensitive email message to user B outside the local network. User A has chosen to use PKI to secure his message and ensure only user B can read the sensitive email. At what layer of the OSI layer does the encryption and decryption of the message take place?","o":["Transport","Presentation","Application","Session"],"a":[1],"e":"正確答案是 B，因為加密，解密，翻譯，壓縮，和訊框式化是 OSI 演示層的核心職能，即第 6 層。 CEH 網路材料指出，應用層的演示層格式資料，將資料轉換為通用格式，資料壓縮和加密發生在這一層。 情境中，PKI 用於保護敏感的電子郵件，這樣只有使用者 B 才能讀取。 CEH 密碼學概念解釋非對稱式加密使用單獨的金鑰:接收者的公開金鑰用於加密資料，接收者的私密金鑰用於解密資料。 儘管電子郵件本身是一個應用程式層服務，但 OSI 的功能是編碼，加密，並解密訊息資料對映層。 運算處理端到端的傳送，工作階段管理對口，應用程式提供使用者的發報網路服務，因此，最好的答案是演示。","s":"term"},{"n":280,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"During a red team engagement, an ethical hacker discovers that a thermostat accepts older firmware versions without verifying their authenticity. By loading a deprecated version containing known vulnerabilities, the tester gains unauthorized access to the broader network. Which IoT security issue is most accurately demonstrated in this scenario?","o":["Lack of secure update mechanisms","Denial-of-service through physical tampering","Insecure network service exposure","Use of insecure third-party components"],"a":[0],"e":"CEH v13 強調 IoT 裝置必須實施安全韌體更新機制，強制實施真實性，完整性和版本控制。 當裝置允許回滾到更古老的韌體版本或接受更新而無需加密驗證時，發生臨界故障。 這為\"公司軟體降級攻擊\"開啟了大門，攻擊者故意安裝過時但脆弱的公司軟體來再引入可被利用的弱點。 CEH 將這確定為不安全更新設計的一部分，這是最危險的 IoT 弱點之一，因為公司軟體規範裝置行為，網路通訊，以及信任邊界。 不進行簽名驗證，完整性檢查，以及反回滾執行，攻擊者可以載入惡意或被貶值的韌體來將權限升級或向網路更深地推導。 選項 B 和 C 代表了不同類別的 IoT 弱點，而 D 則指供應鏈問題，這些都與所描述的回滾開發沒有匹配。 因此，所顯示的弱點是缺乏可靠的更新機制。"},{"n":281,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"A DNS server responds with different IP addresses rapidly for the same domain, pointing to constantly changing hosts. What technique is being used?","o":["DNS tunneling","DNS poisoning","Fast flux","Zone transfer"],"a":[2],"e":"正確答案是 C，快通通量。快通量是一種基於 DNS 的逃逸技術，通常與機器人網、惡意軟體託管、釣魚基礎設施和指令與控制復原力相關聯。在快通量中，一個網域名稱被對映到許多快速變化的 IP 位址上，往往有非常短的 DNSTTL 值。使用戶端解決同一個域，隨著時間的推移接收不同的目的地主機，使擷取，阻斷，歸屬更難。 CEHDNS 基本原理解釋DNS 將人可讀名稱翻譯為 IP 位址，而 DNS 回覆可能包含根據時間到活值快取的位址對映。 描述的行為 - 快速旋轉 IP 位址用於同一域 - 匹配快通量， 不是 DNS 通量， 它隱藏在 DNS 查詢中的資料； 不是 DNS 毒化， 插入虛假的 DNS 記錄； 和 不分割槽傳輸， 複製 DNS 伺服器之間的區域記錄。 因此， 所使用的技術是快通量。","s":"term"},{"n":282,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"In a tense red team exercise at a mid-sized university in Austin, Texas, an ethical hacker named Jake targeted a legacy Linux server in the engineering department. Late one afternoon, he discovered TCP port 2049 was open during his first sweep, suggesting hidden file-sharing capabilities. Intrigued, Jake used a standard utility to request a list of remote file systems shared across the network, aiming to map accessible resources. Meanwhile, he idly checked for Telnet access and probed a time-sync service out of routine, but both proved fruitless on this host. Which enumeration method is actively demonstrated in this scenario?","o":["NFS Enumeration","SNMP Enumeration","NetBIOS Enumeration","NTP Enumeration"],"a":[0],"e":"NFS 列舉是正確選擇，因為情境以 TCP 連接埠 2049 為中心，並且使用標準工具來列出匯出遠端檔案系統。 在符合CEH 偵察和列舉中，連接埠 2049 是網路檔案系統連接埠的主要服務。 當測試者在 Linux 或 UNIX-like 主機 上識別出2049 開啟時， 一個常見的下一步是列出 NFS 輸出， 以瞭解哪些目錄是共享的， 哪些存取規則是適用的。 描述的“ 標準效用” 與 showmount 等工具一致， 顯示器詢問目標以取得輸出的檔案系統清單， 在某些情況下， 用戶端允許上載它們。這直接支援了\"要求一個網路共享的遠端檔案系統清單\"來對映可存取資源這一既定目標。假設中提及的分心器檢查加強了為什麼答案是 NFS。 Telnet 列舉會與 TCP 23 和互動式的明文終端接入有關，而不是檔案共享匯出。 NTP 列舉對接到UDP 123,並專注於時間同步資訊和伺服器行為，而不是共享目錄。 SNMP 列舉通常涉及 UDP 161,並透過社群字串和管理資訊庫擷取裝置和系統細節。 NetBIOS 列舉與 Windows 網路服務相關聯，如 UDP137 和 TCP139,它們與 2049 年的NFS 無關。因此，透過 TCP 連接埠 2049 上市出口，顯示活動列舉方法為 NFS 列舉。","s":"term"},{"n":283,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"In Raleigh, North Carolina, ethical hacker Ethan Brooks is conducting a penetration test for Triangle FinTech, a rising financial startup. During his assessment, Ethan aims to bypass the company's network security to access a restricted internal server. He crafts network packets to disguise his traffic as legitimate, forcing some TCP header information into subsequent packets to evade the firewall's checks. His aim is to demonstrate how an attacker could slip past the security perimeter undetected, alerting the IT team to potential weaknesses. Which technique is Ethan employing to bypass Triangle FinTech's firewall during his penetration test?","o":["Source Routing","Tiny Fragments","HTTP Tunneling","IP Address Spoofing"],"a":[1],"e":"Tiny Flagments 是描述的技術，因為它依靠 IP 破碎來逃避防火牆或封包-濾波檢查，方法是將關鍵頭和酬載資訊分拆出多個碎片。在 CEH 對齊的網路逃取概念中，一些安全裝置透過檢查封包的第一個碎片中的特定欄位和模式或者進行有限的再組裝來允許或拒絕決定。 如果攻擊者故意將異常小的碎片做成手工業，那麼第一個碎片可能包含的 TCP 頭或更高層的資料不足以為防火牆根據它的規則和簽名對封包進行適當的評價。 剩餘的 TCP 頭位元組或有意義的酬載圖案可以被推入後續的片段，這些片段可能透過，因為裝置無法正確連線，或者在檢查前沒有完全重新組裝流量。問題的關鍵線索是，伊森正在\"將一些 TCP 頭資訊強制輸入後期的封包\"來繞行檢查。 該措辭直接匹配了以分解為基礎的逃逸，而不是身分欺騙或地道。 IP 位址欺騙將表面源 IP 更改為外觀，但並沒有將 TCP 頭的細節具體移動到後期碎片。 源路由是一種用 IP 選項來影響封包路徑的老技術，在現代環境中一般被阻塞；它也並不描述分出 TCP 頭內容。 HTTP 地道通通封裝於 HTTP 內部的非 HTTP 流量來透過代理或防火牆，這是與分化不同的機制。因此，這個情境中正確的防火牆繞行技術是\"小碎片\" (Tiny Flagments)。","s":"term"},{"n":284,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"While analyzing suspicious network activity, you observe a slow, stealthy scanning technique that is difficult to trace back to the attacker. Which scenario best describes the scanning technique being used?","o":["The attacker sends FIN packets to infer port states based on responses","The attacker uses a \"zombie\" machine to perform scans, hiding their true identity","The attacker performs full TCP connect scans on all ports","The attacker sends packets with all TCP flags set"],"a":[1],"e":"根據 CEH 網路掃描模組，Idle 掃描 (Zombie Scanning)是最隱蔽的偵察技術之一。 在這個方法中，攻擊者使用閒置的第三方主機(Zombie host)來進行探測。間接地 目標。由於所有掃描封包似乎都源於殭屍系統，所以真正的攻擊者仍然被隱藏。 CEH 強調閒置掃描:極度隱秘由攻擊者產生最小流量讓歸屬變得非常困難選項 B 是正確的。選項 A(FIN 掃描)是隱形的，但仍可追蹤。選項 C 很吵，很容易被偵測到。選項 D 描述了 Xmas 掃描，這是可探測的。 CEH 將閒置掃描歸類為最難追蹤的掃描技術之一。"},{"n":285,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"Who are \"script kiddies\" in the context of ethical hacking?","o":["Highly skilled hackers who write custom scripts","Novices who use scripts developed by others","Ethical hackers using scripts for penetration testing","Hackers specializing in scripting languages"],"a":[1],"e":"在 CEH v13 資訊安全與道德駭客概論中，指令碼小子被定義為技術知識有限的個人，他們依靠由他人創造的預寫工具，指令碼，以及利用他人制造來進行攻擊。 他們通常缺乏對基礎利用如何工作的深刻理解。 CEH v13 根據技能水平和意圖對攻擊者進行分類。 Script kiddies 坐在技能譜的下端，他們經常下載開發工具包，自動掃描器，或攻擊框架，並按最小的定製操作它們。雖然他們的攻擊可能不夠精細，但由於有強大的工具，仍然可以造成破壞。選項 B 準確地反映了這個定義。 選項 A 和 D 描述了技術熟練的攻擊者或程式設計師，這與 CEH 的分類相矛盾。 選項 C 是不正確的，因為道德駭客負責地使用授權工具，並且對安全原則有強烈的理解。 CEHv13 強調，雖然指令碼孩子技能較低，但是由於自動化允許，他們構成了一種風險。因此各組織必須迅速補齊系統並執行基線安全控制。因此，選項 B 是正確答案。"},{"n":286,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"During a security assessment of a cloud-hosted application using SOAP-based web services, a red team operator intercepts a valid SOAP request, duplicates the signed message body, inserts it into the same envelope, and forwards it. Due to improper validation, the server accepts the duplicated body and executes unauthorized code. What type of attack does this represent?","o":["Cloud snooper attack","Cryptanalysis attack","Wrapping attack","IMDS abuse"],"a":[2],"e":"CEHv13 課程軟體的綜合解釋:CEH v13 識別出 XML Constitution Crapping (XSW) 攻擊，又稱\"Srapping\"攻擊，是對SOAP-基於網路服務的主要威脅。 這些攻擊利用了弱 XML 解析和簽名訊息元件的驗證不足。 SOAP 訊息往往包括了數位簽章的段落，但是如果伺服器在確認簽名元素的正確位置或結構的情況下驗證簽名，攻擊者可以複製，移動，或者將簽名內容封包在被修改的 XML 信封內。 這允許攻擊者在仍然呈現有效簽名的同時注入惡意有效酬載。 CEH 詳細介紹了這如何能夠導致在 SOAP API 中未經授權執行，權限提升，或者繞過認證控制。 Cloud snoop， C 密碼分析，和 IMDS 濫用不涉及訊息重複或簽名錯誤放置。 情境完全匹配了 CEH 在 SOAP/XML 安全中對 Srapping 攻擊的定義。","s":"term"},{"n":287,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"Michael, an ethical hacker at a San Francisco-based fintech startup, is conducting a security assessment of the company ' s cloud-based payment processing platform, which uses Kubernetes, an open-source system for automating the deployment, scaling, and management of containerized applications. During his review, Michael identified a feature that automatically replaces and reschedules containers from failed nodes to ensure high availability of services a critical requirement for uninterrupted payment operations. Based on his study of cloud container technology principles, which Kubernetes feature should Michael highlight as responsible for this capability?","o":["Container vulnerabilities","Kube-controller-manager","Container orchestration","Self-healing"],"a":[3],"e":"所描述的能力是 Kubernetes 自愈，在討論集裝箱化環境中的復原能力、可用性和容錯性時，CEH 雲和容器安全覆蓋中強調的核心行為。 自愈意味著 Kubernetes 持續地監測預期的工作量狀況，並在當前狀態因故障而偏離時自動行動。 如果一個節點崩潰，一個容器出乎意料地退出，或者一個吊艙變得不健康，庫伯內特斯會透過重啟容器，重新建立吊艙，以及重新安排工作重排到健康節點來維持服務連續性來回應。 這直接符合集裝箱從故障節點“自動更換和重新安排”以保持高水平的支付服務。雖然幾個庫伯涅特元件參與實現這一結果，但與所描述的行為最相符合的特徵名稱是自愈。 庫伯涅特斯使用控制器和排程器來實施:部署和複製套件確保有正確的數量可複製；活潑和準備狀態探測器偵測出不健康的容器；當節點變為不準備時，被驅出艙並重造出別處。 這正是 Kubernetes 支援支付處理平台等關鍵應用程式不間斷操作的方式。選項 B，kube-controller-manager，是一個可執行多控制器的控制平面元件，它有助於強制要求狀態，但問題卻問到特效能力，而不是提供特性的具體內部過程。 選項 C， 容器的管絃樂， 範圍更廣， 包括部署、 縮放和管理， 但對於失敗後的自動替換和重新安排的具體行為來說， 其準確性不如自我康復。 選項 A 與可用性行為無關。","s":"term"},{"n":288,"c":"密碼學","ce":"Cryptography","t":"long","q":"Olivia, a cybersecurity architect at a Boston-based fintech company, is tasked with upgrading the organization ' s cryptographic infrastructure in preparation for future quantum computing threats. A recent internal audit flagged that sensitive customer data stored in the company ' s cloud environment could be vulnerable if quantum decryption methods become practically viable. To strengthen their post-quantum defense, Olivia must recommend a proactive cryptographic control that ensures long-term confidentiality of stored data, even against advanced quantum attackers. Which cryptographic defense should Olivia prioritize to mitigate the risk of future quantum-based decryption?","o":["Break data into fragments and distribute it across multiple locations","Encrypt stored data with quantum-resistant algorithms","Use quantum-specific firewalls to protect quantum communication channels","Include quantum-resistance checks in SDLC and code review processes"],"a":[1],"e":"最好的選擇是用耐量子演算法加密所儲存的資料，因為情境的核心風險是在未來大規模量子計算可能打破被廣泛使用的公用金鑰計劃的情況下，在雲環境休息時對資料的長期保密。 在 CEH 密碼學覆蓋中，最直接的保密方式是使用堅固的加密，保持對預期攻擊者能力的安全性。 \"Harvest now， decrypt later\"是一個實際問題:對手今天可以複製加密資料並等新能力使解密可行後再進行，因此，控制必須採用密碼學和耐未來，而不僅僅是程式或建築設計。選項 B 透過將加密和金鑰建立機制轉向抗量原始物來配合量子後準備狀態。 這對保護長期儲存的儲存記錄尤為重要。 即使 AES 等對稱式加密相比於經典公開金鑰演算法一般更能抵禦量子攻擊，組織仍必須確保合適的金鑰尺寸，強力的金鑰管理，以及可抗量子的方法，其中公開金鑰密碼學用於金鑰交換，金鑰包接，或支援儲存加密工作流程的數位簽章。方案 A， 分佈碎片， 在一些違約情況下可以改善可用性和限制接觸， 但是它不會取代加密， 也不會保證獲得碎片時的機密性。 方案 C 不適用， 因為問題是儲存雲資料，而不是量子通訊。 方案 D 是一種良好的治理做法，但它本身並不是確保保密的密碼控制。優先順序 每符合 CEH 密碼防禦原理， 是耐量子的加密 和關鍵管理 資料休息。"},{"n":289,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"Which attack abuses business logic?","o":["XSS","Logic flaw","CSRF","SQLi"],"a":[1],"e":"正確答案是 B，因為濫用一個應用程式的預定工作流程，規則，或假設的攻擊被歸類為邏輯缺陷或業務邏輯缺陷。 在Web 應用程式入侵中，業務邏輯定義了應用程式應當如何操作，如定價規則，交易順序，授權決定，優惠券使用，資金轉移限制，或批准工作流程等。 當這些規則不完整、執行不力或可能被攻擊者所操縱時，就會出現商業邏輯缺陷。CEHWeb 應用程式材料解釋，當應用程式的核心規則不簡單且可以被利用來損害應用程式時，業務邏輯缺陷存在；這些缺陷往往需要仔細審查架構和設計，因為自動化掃描器可能無法可靠地偵測出。 XSS 濫用不
