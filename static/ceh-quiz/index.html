當的輸出/input 處理在瀏覽器中執行指令碼。 CSRF 濫用使用者認證的工作階段。 SQLi 濫用 資料庫 查詢建構。 直接匹配濫用商業邏輯的選項是邏輯缺陷。","s":"term"},{"n":290,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"An attacker is analyzing traffic from a mobile app and finds that sensitive data like session tokens are being transmitted over HTTP instead of HTTPS. The attacker plans to intercept and manipulate the data during transmission. Which vulnerability is the attacker exploiting?","o":["Security Misconfiguration","Improper SSL Pinning","Insecure Communication","Insufficient Input Validation"],"a":[2],"e":"在 CEH 的移動和 IoT 安全模組中，不可靠的通訊被定義為在裝置與伺服器之間傳輸的敏感資料的加密失敗。 當應用程式使用平原 HTTP 而不是 HTTPS 時，所有流量--包括認證符，使用者識別符，和工作階段資料--都可以由攻擊者透過網路嗅探或中間人攻擊來監測和改變。 CEH 強調不安全的運輸通道是移動生態系統中最常見和最關鍵的弱點之一，允許攻擊者收割認證資訊或注入惡意命令。 security 設定錯誤指的是不適當的伺服器設定，而 SSL pinning 問題涉及憑證驗證繞行。輸入驗證不足涉及應用程式側資料驗證。這些校正都未直接如不安全的通訊，這準確地描述了未加密的資料曝光。","s":"term"},{"n":291,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"A penetration tester is tasked with uncovering historical content from a company's website, including previously exposed login portals or sensitive internal pages. Direct interaction with the live site is prohibited due to strict monitoring policies. To stay undetected, the tester decides to explore previously indexed snapshots of the organization's web content saved by external sources. Which approach would most effectively support this passive information-gathering objective?","o":["Search with intext: \" login \" site:target.com to retrieve login data","Use the link: operator to find backlinks to login portals","Apply the cache: operator to view Google ' s stored versions of target pages","Use the intitle:login operator to list current login pages"],"a":[2],"e":"CEH 通篇強調被動偵察是蒐集情報而無需提醒監控系統的基本方法。 當測試者不能與現場互動時，他們必須完全依賴第三方檔案或搜尋引擎或網際網路檔案服務所儲存的快取內容。 Google 的快取功能提供之前儲存的網頁版本，完全是為了這個目的。 CEH 解釋說，攻擊者經常使用快取內容來擷取過時的登入入口網站，行政網頁，被曝光的目錄，或者其他可能不再出現在活網伺服器的敏感元素。 與查詢活版索引後設資料的 intext 或 intitle 等操作員不同，快取操作員在不存取目標網站的情況下擷取了歷史快照。 連結操作員識別回行鏈路，但不提供歷史頁面內容。 只有快取操作員直接支援被動地檢視以前的網頁版本，完全符合避免被偵測的要求，同時蒐集遺留的網頁內容的情報。"},{"n":292,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at Pacific Trust Bank in Seattle, ethical hacker Mia Chen suspects that a server hosting customer transaction data may be a honeypot. To investigate, she repeatedly sends crafted queries and observes how quickly the system responds. She notices that responses are consistently faster and more uniform than those of other production servers, raising her suspicion that the environment is designed to lure attackers. Which technique is Mia most likely using to determine if the server is a honeypot?","o":["Analyzing MAC Address","Analyzing Response Time","Fingerprinting the Running Service","Analyzing System Configuration and Metadata"],"a":[1],"e":"正確答案是 B.Analysis Response Time，因為情境明確描述米婭的方法是反覆傳送精心設計的詢問，並與其他生產伺服器比較回覆的速度和一致性。 在符合 CEH 蜜罐和欺騙偵測概念中，懷疑誘餌環境的一個實用方法是衡量它在相互作用下的行為方式以及這種行為是否與真實生產系統不同。 Honeypots 常常是用來監視攻擊者活動的儀器，並可能執行簡化的堆疊，被隔離的資源，或者模擬的服務。這可以產生明顯的反應特性。不同的答覆--例如反應速度太快、過於一致或異常一致，即使在不同的查詢條件下也是如此--因為系統可能返回預先產生或模仿的產出，而不是處理實際工作量。真正的生產伺服器通常會顯示回應時間的自然差異，原因是合理的流量負荷，資料庫 I/O，緩衝效應，速率限制，以及資源相爭。當一個目標一致地回應時，只要最小的焦急和異常穩定的延遲，就可以表示一個為觀測而非正常業務執行而設計的受控或模擬的環境。 透過對多個主機的回應時間進行基準和比較，米婭正以計時行為作為區分訊號來評估伺服器是否像真正的出產系統或被監控的誘餌一樣行為。為什麼其他選項不正確: Analysis MAC 位址一般是一種區域性網路技術，不是驗證蜜罐行為進行外部 face 伺服器交易的主要方法；它也不符合所描述的重複查詢時間。 Fingerprinting the running service 可以幫助識別服務型別/version，但問題中心是一致性和速度，而不是識別簽名。 分析系統設定和後設資料將涉及檢查標頭、橫幅、OS/service 後設資料或環境文物；有用，但米婭在這裡所做的並不有用。因此，米婭最有可能利用回應時間分析來評估伺服器的行為是否像蜜罐。","s":"term"},{"n":293,"c":"密碼學","ce":"Cryptography","t":"long","q":"A cloud storage provider discovers that an unauthorized party obtained a complete backup of encrypted database files containing archived client communications. The attacker did not compromise the encryption keys, nor is there evidence that any original plaintext records were exposed. A forensic cryptography specialist reviewing the breach considers the possibility that the adversary is attempting to analyze the encrypted data in isolation, searching for statistical irregularities or structural repetition within the encrypted output to infer meaningful information. To properly assess the organization ' s exposure, the specialist must determine which cryptanalytic approach best matches an attack conducted using only the intercepted encrypted data.","o":["Ciphertext-only attack","Known-plaintext attack","Chosen-plaintext attack","Chosen-ciphertext attack"],"a":[0],"e":"正確答案是密文-只攻擊。 CEH 密碼學的覆蓋將這次攻擊定義為攻擊者只能存取加密資料而不能存取相應的明文的情況。攻擊者試圖取得有用的資訊，恢復明文模式，或者最終透過分析密文字身來推斷出金鑰。 問題正是如此:對手獲得了加密的資料庫備份，但沒有獲得金鑰，也沒有獲得明文原始記錄，專家正在考慮攻擊者是否在孤立地檢查加密輸出，以取得結構線索或重複。 Known-明文攻擊需要同時存取明文和匹配密文。 Chosen-明文攻擊涉及攻擊者選擇要加密的輸入，而所選擇的-密文攻擊則涉及為解密嘗試選擇密文。 無一符合情境。 CEH 材料強調密文只分析是最基本的密碼分析模型，因為它假設除了加密材料本身之外攻擊者的知識最少。 由於這裡的接觸僅限於被截獲的密文，沒有確認獲得明文或解密能力，因此最好的匹配是隻進行密文的攻擊。","s":"term"},{"n":294,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"In Denver, Colorado, ethical hacker Sophia Nguyen is hired by Rocky Mountain Insurance to assess the effectiveness of their network security controls. During her penetration test, she attempts to evade the company ' s firewall by fragmenting malicious packets to avoid detection. The IT team, aware of such techniques, has implemented a security measure to analyze packet contents beyond standard headers. Sophia ' s efforts are thwarted as the system identifies and blocks her fragmented packets. Which security measure is the IT team most likely using to counter Sophia ' s firewall evasion attempt?","o":["Deep Packet Inspection","Anomaly-Based Detection","Signature-Based Detection","Stateful Packet Inspection"],"a":[3],"e":"分解是被 CEH 材料所覆蓋的一種出名的防火牆和 IDS 逃生技術。 攻擊者將一款惡意的封包分解為更小的 IP 碎片，使簡單的過濾裝置，特別是那些主要依靠基本頭檢查或無國籍規則的過濾裝置，可能無法重建出原來的酬載，從而錯過了惡意內容。 為了對付這一點，防禦人員必須追蹤封包狀態，並對分散的流量進行再組裝或驗證，使安全控制能夠評價完整的通訊流而不是被孤立的碎片。 Stateful 封包 檢查是最符合此要求的控制。 狀態檢查 防火牆 維持一個狀態表， 將活動連線並監視流量， 作為正在進行中的 工作階段 的一部分。 由於它追蹤了 工作階段 上下文， 它可以透過將碎片與原始流量相接來更有效地處理被打碎的 封包，並在重建或使流量正常化後應用政策。 在符合 CEH 描述中，這直接降低了以分解為主的逃避的有效性，與消除模糊攻擊者試圖利用的流量正常化概念相重疊。深封包檢查檢查超出標頭範圍檢查了酬載，但阻止破碎逃逸的關鍵成功因素是狀態追蹤和再組裝，這是狀態檢查和狀態感知安全裝置的特徵。 基於簽名和基於異常的偵測可以幫助偵測出惡意模式或異常行為，但如果不可靠地重新組裝和工作階段上下文，零散的有效酬載可能無法匹配簽名，並且可能在孤立狀態下看起來是良性的。 因此，在此情境中，用於識別並阻斷零碎的封包最可能的措施是國有的封包檢查。","s":"term"},{"n":295,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"An ethical hacker conducts testing with full knowledge and permission. What type of hacking is this?","o":["Blue Hat","Grey Hat","White Hat","Black Hat"],"a":[2],"e":"白帽駭客在 CEHv13 被定義為在明確授權下進行識別和補救弱點的道德駭客。 白帽駭客在法律框架和合同協定中運作。灰帽行為雖然沒有授權，但無惡意。 黑帽進行非法攻擊。 藍帽是邀請外部測試者在產品放出前找到 bug。因此，選項 C是正確的。","s":"term"},{"n":296,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"A penetration tester is attempting to gain access to a wireless network that is secured with WPA2 encryption. The tester successfully captures the WPA2 handshake but now needs to crack the pre-shared key. What is the most effective method to proceed?","o":["Perform a brute-force attack using common passwords against the captured handshake","Use a dictionary attack against the captured WPA2 handshake to crack the key","Execute a SQL injection attack on the router ' s login page","Conduct a de-authentication attack to disconnect all clients from the network"],"a":[1],"e":"WPA2-PSK 網路使用從密碼句中衍生出來的預共享金鑰認證使用者。 CEH 在捕捉到 4 向握手後，教導恢復金鑰的標準和最有效的方法是執行離線的字典攻擊，其中字清單條目被散開並和被捕獲的握手值進行比較。 離線破解避免被偵測，並明顯快於蠻力嘗試。"},{"n":297,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"A penetration tester is assessing a company's vulnerability to advanced social engineering attacks targeting its legal department. Using detailed knowledge of mergers and legal proceedings, the tester crafts a highly credible pretext to deceive legal employees into sharing confidential case documents. What is the most effective technique?","o":["Send a spear-phishing email referencing specific merger details and requesting document access","Create a fake LinkedIn profile to connect with legal employees and request document sharing","Visit the office in person posing as a new legal intern to request document access","Conduct a mass phishing campaign with generic legal templates attached"],"a":[0],"e":"CEH 將長矛釣魚確定為一種針對特定個人或部門，內容豐富並適合具體情況的社交工程方法，透過納入準確的內幕細節，攻擊者大大提高了信任度和披露的可能性。"},{"n":298,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"A penetration tester is conducting an external assessment of a corporate web server. They start by accessing https://www.targetcorp.com/robots.txt and observe multiple Disallow entries that reference directories such as /admin-panel/, /backup/, and /confidentialdocs/. When the tester directly visits these paths via a browser, they find that access is not restricted by authentication and gain access to sensitive files, including server configuration and unprotected credentials. Which stage of the web server attack methodology is demonstrated in this scenario?","o":["Injecting malicious SQL queries to access sensitive database records","Performing a cross-site request forgery (CSRF) attack to manipulate user actions","Gathering information through exposed indexing instructions","Leveraging the directory traversal flaw to access critical server files"],"a":[2],"e":"CEH 網路伺服器攻擊方法將偵察描述為關鍵階段，測試者在嘗試開發前蒐集公開的資訊。 robots.txt 通常被管理員用來指示哪些目錄不應被索引。 CEH 強調攻擊者定期審查 robots.txt，因為它經常無意地暴露出敏感的目錄，提供有關內部結構，設定路徑，行政頁面，以及潛在薄弱點的寶貴情報。 在這種情境下，測試者觀察\"Disallow\"條目，然後發現目錄不透過認證來保護，允許直接存取敏感檔案。 這屬於透過被曝光的索引指令蒐集資訊，而不是目錄 traversal，它涉及路徑操縱的開發。 測試者不會修改檔案路徑或插入倒轉序列； 相反， 他們正在審查公開的索引指令並發現錯誤的設定存取控制。 這與 CEH 方法的偵察階段完全一致， 攻擊者使用被動或最小侵入技術學習伺服器架構。"},{"n":299,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"You are working as a threat intelligence analyst for a fintech startup that recently discovered a spike in credential stuffing attempts against its admin panel. The security team believes this may be due to leaked internal files circulating on underground forums. You are tasked with investigating potential exposure on the dark web without directly interacting with any service or forum. You decide to use advanced search filters to identify documents hosted on hidden services that may contain sensitive access details. The team suspects these documents might include account-related keywords in their titles. Which of the following search queries would best support this investigation?","o":["filetype:pdf intitle: \" admin access \" site:onion","filetype:docx intitle: \" login credentials \"","filetype:pdf intitle: \" secure login \" site:onion","filetype:docx intitle: \" user accounts \" site:onion"],"a":[0],"e":"這個任務描述的是被動偵察使用高階搜尋操作器，這個在 CEH 中包含的技術作為搜尋引擎偵察或 Google Donrking。 目的是在隱藏服務上找到潛在被曝光的檔案，同時避免與論壇或服務直接互動。 查詢中最重要的要素是將結果限制在使用站點: 蔥操作器的隱藏服務域上。 任何不包括站點:洋蔥的選項都不太合適，因為它會從公共網站而不是從.洋蔥資源返回。選項 A 最合適，因為它結合了三個高值過濾器:檔案型別:pdf 專注於通常洩露或共享的檔案文物，標題:建議優先存取或行政資訊的目標標題的 \" 管理員存取 \"，以及網站:洋蔥 限制隱藏服務的範圍。 在 CEH 報告和威脅情報工作流程中，針對高訊號關鍵字，如 admin 存取，認證資訊，密碼清單，或檔案後設資料中的 vpn 存取，是找出可能未主動接觸而洩露源的實用方法。選項 B 缺少站點:洋蔥，因此無法滿足隱藏服務要求。 選項 C 包括站點:洋蔥，但安全登入的短語比較通俗，可能還原出許多良性頁面，降低精度。 選項 D 包括站點:洋蔥和檔案型別的瞄準，但使用者帳戶比管理員存取要寬泛，較少顯示即時存取資料。 因此，A 最好支援高效被動地發現與被隱藏服務的認證資訊曝光相關的高風險檔案。"},{"n":300,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"In Seattle, Washington, ethical hacker Mia Chen is hired by Pacific Trust Bank to test the security of their corporate network, which stores sensitive customer financial data. During her penetration test, Mia conducts a thorough reconnaissance, targeting a server that appears to host a critical database of transaction records. As she interacts with the server, she notices it responds promptly to her queries but occasionally returns error messages that seem inconsistent with a production system's behavior, such as unexpected protocol responses. Suspicious that this server might be a decoy designed to monitor her actions, Mia applies a technique to detect inconsistencies that may reveal the system as a honeypot. Which technique is Mia most likely using to determine if the server at Pacific Trust Bank is a honeypot?","o":["Analyzing Response Time","Analyzing MAC Address","Fingerprinting the Running Service","Analyzing System Configuration and Metadata"],"a":[2],"e":"指紋辨識執行服務是最合適的技術，因為情境中最強的指標是不符合合法生產資料庫服務的協定行為和錯誤反應。在CEH 偵察引導中，蜂蜜壺和誘餌系統經常會模仿共同事務，但可能只執行部分協定堆疊或簡化回應。這會導致異常。例如不正確的橫幅字串，不正確或通用的錯誤訊息，不支援的命令處理，不尋常的協定談判，或與聲稱的軟體版本不相符合的回應。Mia 透過指紋將觀察到的行為與真實服務的預期行為進行比較，包括特定版本的突觸，命令集，回應程式碼，以及特定請求的時間模式等。在實踐中，服務指紋處理涉及使用合法和邊緣個案請求與服務進行互動，驗證橫幅和標頭，並將結果與實際執行中已知的簽名相掛鉤。如果伺服器聲稱是特定的資料庫或應用服務，但反應方式實際部署不會，則它暗示了為日誌攻擊者活動而設計的蜂蜜壺的典型的模擬，儀器，或欺騙。分析反應時間可以有所幫助，因為一些蜂窩的反應太快或時間一致，但單是時間的確定性不如協定不一致。MAC 位址分析對於識別蜂窩並不可靠，而且往往無法在區域性部分以外看到。分析系統設定和後設資料通常需要比偵察更深的存取，線上索為協定-級別不匹配時不是主要的方法。因此，對執行服務進行指紋檢查最符合所觀察到的症狀。QUBB ESTION NO: 25 [行動平台與 IoT 入侵]。來自 CyberFortress Solutions 的 Javier Ruiz 負責審計德克薩斯州休斯敦的一家金融公司 Apex Financial Services 的行動裝置安全做法，在一次秘密滲透測試中，Javier 針對員工個人智慧手機，用於進入公司金融系統。他利用弱點，安裝了一個繞過存取控制的惡意應用程式，允許他擅自進入敏感金融資料，因為裝置缺乏限制應用存取的特定安全措施。基於這種弱點，Apex 金融服務政策中最有可能缺少的 BYOD 安全準則是什麼？\n\nA. 安裝前審查應用程式請求的權限 B. 設定應用程式的密碼以限制他人存取 C. 強制自動裝置鎖定或實施生物特徵驗證 D.使用 加密 機制儲存資料答案: A 最可能缺失的 BYOD 指南是在安裝前審查應用程式權限。在 CEH 行動裝置安全指引中，BYOD 環境中的一個主要風險是引入了不可信或惡意的應用程式來濫用移動許可模式存取公司資料，擷取認證信使，讀取儲存，透過可存取性服務捕獲鍵盤中程，或者對外通訊。當使用者在不仔細檢查請求權限的情況下安裝應用程式時，他們可能不知不覺地給予過多的權限，使得資料被竊取或存取控制繞行成為可能，特別是當該應用程式利用 OS 弱點或設定錯誤時。劇情說明 Javier\"安裝了繞過存取控制的惡意應用程式\"並獲得了敏感財務資料的存取權，因為裝置\"缺少限制應用存取的特定安全措施\"，這直接對映到控制與驗證應用及其許可請求的政策弱點。CEH 強調各組織應該透過限制應用權限來減少攻擊面， 避免從不可信來源進行側載，並透過使用者意識和企業控制，如 MDM 應用程式，執行最小特權允許列名和許可治理。審查權限是使用者-造型指南，它阻止員工給予危險的存取權(例如:SMS，儲存，聯絡人，可存取性，裝置管理員，或 VPN 設定權限)，可以使認證資訊被竊取或未經授權的資料存取成為可能。選項 B 為本機存取新增了一層， 但不會阻止一個獲得授權的惡意應用程式存取公司資料。選項 C 幫助一個裝置被物理上竊取，但是它不會阻止在使用者上下文下已經執行的惡意應用程式。選項 D 保護休息時的資料， 然而惡意應用程式一旦被解密並被使用者工作階段存取，仍然可以解密出資料。因此，許可審查是最直接相關的缺失 BYOD 準則。","s":"term"},{"n":301,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"Which method best bypasses client-side controls without triggering server-side alarms?","o":["Disable JavaScript in the browser","Intercept and modify requests using a proxy tool","Inject malicious JavaScript into the login form","Reverse-engineer the encryption algorithm"],"a":[1],"e":"使用者端-側控，如 JavaScript 驗證和 CAPTCHA 執行，在 CEH v13 中被明確描述為本質上不可信，因為它們執行在使用者的裝置上。繞過它們的最有效方法是在使用者端-側驗證後但在伺服器-側處理前攔截並修改 HTTP 請求。使用代理工具(例如 Burp Suite)可以讓測試者隱蔽地操縱參數，而不會使 JavaScript 或可起出警報的注入程式碼失效。 這使得選項 B成為最隱蔽和最有效的方法。禁用 JavaScript( 選項 A) 聲音響亮 注入 JavaScript(備選 C) 可能會觸發 使用者端- 側保護。反向工程 加密(備選 D) 複雜 也沒有必要 CEH v13 強調以代理操作為首選技術來繞過使用者端-側安全機制。 因此，選項B 是正確的。"},{"n":302,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"During a quarterly vulnerability management review at RedCore Motors, Priya finalizes the deployment of Nessus Essentials across the company ' s IT infrastructure. The solution is selected for its ability to support diverse technologies including operating systems, databases, web servers, and virtual environments. While preparing a training session for junior analysts, Priya asks them to identify a capability that Nessus Essentials is specifically designed to provide as part of its scanning process.","o":["Patch management for operating systems and third-party applications","Checks for outdated versions of over 1,250 servers","Agent-based detection","High-speed asset discovery"],"a":[1],"e":"正確答案是檢查超過 1,250 個伺服器的過時版本。 CEH 弱點評估覆蓋範圍中，Nessus 基本原理被提出為一種弱點掃描解決方案，可以評估多種技術，包括作業系統，網路伺服器，資料庫，網路裝置，以及虛擬化環境等。 其核心作用是找出各種弱點、缺失的修補程式、不安全的設定以及所有支援的平台的曝光條件。 檢查伺服器技術的過時版本的選項最能反映面向掃描器的能力。 修補程式管理不是 Nessus 基本原理的主要功能，因為它能識別出弱點而不是直接管理修補程式。在一些安全產品中可能使用基於物劑的偵測，但這並不是這個 CEH 型框架所突出的界定能力。 高速資產發現是一個與專業發現平台更緊密相聯的特徵，而 Nessus 則以弱點為中心列舉並進行評估。 CEH 研究材料強調理解通用安全工具的目的，而 Nessus 一般被歸類為探測過時軟體版本和已知弱點的掃描器，從而可以在整個環境中優先進行補救。 因此，選項 B 是最準確的。"},{"n":303,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"A penetration tester is tasked with scanning a network protected by an IDS and firewall that actively blocks connection attempts on non-standard ports. The tester needs to gather information on the target system without triggering alarms. Which technique should the tester use to evade detection?","o":["Use a low-and-slow scan to reduce detection by the IDS","Conduct a full TCP Connect scan to confirm open ports","Perform a SYN flood attack to overwhelm the firewall","Execute a TCP ACK scan to map firewall rules and bypass the IDS"],"a":[0],"e":"一種低而慢的掃描技術將探測嘗試分散在很長的間隔內，減少了觸發依賴於探測快取或高容量掃描的 IDS 簽名的機會。CEH 強調基於時間的逃取是偵察對有嚴格周邊控制的網路的有效方法。"},{"n":304,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A financial institution in Chicago deploys an internal HTTPS-based customer portal that uses response compression to optimize bandwidth. During an authorized security assessment, a tester gains a vantage point along the communication path between internal clients and the gateway device. By repeatedly initiating controlled requests and analyzing subtle differences in encrypted response sizes, the tester correlates variations in compressed output with specific input patterns. Over time, this analysis enables extraction of portions of a protected authentication value transmitted within the secure channel. Which session hijacking technique best describes this activity?","o":["Forbidden Attack","CRIME Attack","Man-in-the-Browser (MITB) Attack","Man-in-the-Middle (MITM) Attack"],"a":[1],"e":"正確答案是 B。 CRIME 攻擊。情境描述基於壓縮的側通道攻擊加密的 HTTPS 流量。 攻擊者觀察到壓縮回應大小的差異，並使用這些差異來推斷受保護的認證值，如 cookie 或工作階段權杖等。 CRIME， 或壓縮比 Info- leak Made Easy， 濫用 TLS/SPDY-level 壓縮行為。 當攻擊者控制的輸入與秘密值一起壓縮時， 回應大小差異可以顯示。有關該秘密的資訊。CEH 密碼學/工作階段-hijacking 上下文討論攻擊 SSL/TLS 並保障通訊安全， 包括中間人定位 和加密缺陷 影響加密通道。選項 A。 被禁攻擊是不正確的，因為它不是所描述的公認的壓縮側道攻擊。選項 C。 Man-in-the-Browser (MITB) 攻擊是不正確的，因為 MITB 需要瀏覽器內部的惡意軟體來攔截或修改瀏覽器交易。選項 D。 中間人 (MITM) 攻擊描述了攻擊者的位置，但並未描述具體的以壓縮為基礎的技術。選項 B。 CRIME 攻擊是正確的，因為攻擊透過分析壓縮的加密回應大小來擷取秘密。因此，最好的答案是 B.CRIME 攻擊。","s":"term"},{"n":305,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"A university ' s online registration system is disrupted by a combined DNS reflection and HTTP Slowloris DDoS attack. Standard firewalls cannot mitigate the attack without blocking legitimate users. What is the best mitigation strategy?","o":["Increase server bandwidth and implement basic rate limiting","Deploy an Intrusion Prevention System (IPS) with deep packet inspection","Configure the firewall to block all incoming DNS and HTTP requests","Utilize a hybrid DDoS mitigation service that offers both on-premises and cloud-based protection"],"a":[3],"e":"CEH v13 解釋道:多向量 DDoS 攻擊，尤其是將體積反射(DNS 放大)與應用層耗竭(Slowloris)相結合的攻擊，需要多層次的緩解。防火牆和 IPS 裝置不能處理大規模分散式攻擊而不會給合法流量造成附帶損害。 CEH 強調混合 DDoS 保護的必要性，將即時區域性過濾的地上裝置與能吸收大規模體積洪災的以云為基礎的洗滌中心相結合。 雲洗能消除上游的惡意流量 正在預設的裝置可以減輕應用程式層異常。 增加頻寬( 選項 A) 無法有效抵禦反射攻擊。 IPS( 選項 B) 無法在規模上處理 Slowloris 風格的部分請求。 封鎖所有外部的 DNS/HTTP( 選項 C) 將拒絕為合法使用者提供服務。 正確的 CEH 相通解決方案是混合的 DDoS 減緩服務。"},{"n":306,"c":"社交工程","ce":"Social Engineering","t":"short","q":"Which scenario best describes a tailgating attack?","o":["Following an employee through a secured door","Phishing email requesting credentials","Phone-based impersonation","Leaving a malicious USB device"],"a":[0],"e":"CEH v13 社交工程中定義的牽引，是指未經授權的個人透過跟隨被授權人進入禁區而獲得進入權限的物理克社交工程攻擊。攻擊者利用人類禮節而不是技術弱點。 選項 B、C 和 D 分別描述了釣魚、打藉口和誘餌。因此，選項 A 是尾礦的正確表述。","s":"term"},{"n":307,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"Following reports of inconsistent IP-to-MAC mappings on an internal access switch at a manufacturing company in Detroit, Michigan, the network security team enabled additional validation controls. Soon afterward, the switch began automatically discarding certain ARP replies that did not match previously recorded IP address assignments. Log entries indicated that packets were being denied due to validation failures tied to existing address-to-port mappings learned earlier from legitimate host configuration traffic. Which switch-level security feature is most likely responsible for enforcing this ARP validation behavior?","o":["Activating Dynamic ARP Inspection to validate ARP packets","Displaying the DHCP Snooping binding table for verification","Enabling DHCP Snooping to track address assignments","Configuring BPDU Guard to protect spanning-tree topology"],"a":[0],"e":"正確答案是 A。 A 活化動態 ARP 檢查以驗證 ARP 封包。題目描述一個交換器丟棄的 ARP 回覆與已知的 IP-MAC 和位址-連接埠繫結不相匹配，這是 Dynamic ARP 檢查(DAI)的功能。 符合 CEH 嗅探和 ARP 防禦材料稱，用 DHCP 進行動態ARP 檢查。偷窺， 用於 DAI 驗證的 MAC--IP 繫結器。同樣的材料列出了設定命令 iparp 檢查 vlan < vlan 號碼 >。 和核查指揮顯示 iparp 檢查。選項 B 是不正確的，因為顯示 DHCP snooping 表只驗證了繫結；它不執行 ARP 驗證。選項 C是不正確的，因為 DHCP Snooping 建構了可信賴的繫結資料庫，但 DAI 是驗證並放下無效 ARP 封包的特性。選項 D 不正確， 因為 BPDU Guard 保護橫跨樹邊埠免受出乎意料的 BPDU 的傷害。 它不驗證 ARP 封包。因此，最好的答案是 A。啟用動態 ARP 檢查以驗證 ARP 封包。"},{"n":308,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During a covert red team engagement, a penetration tester is tasked with identifying live hosts in a target organization's internal subnet (10.0.0.0/24) without triggering intrusion detection systems (IDS). To remain undetected, the tester opts to use the command nmap -sn -PE 10.0.0.0/24, which results in several \" Host is up \" responses, even though the organization's IDS is tuned to detect high-volume scans. After the engagement, the client reviews the logs and is surprised that the scan was not flagged. What allowed the scan to complete without triggering alerts?","o":["It used TCP ACK packets that were allowed through.","It used UDP packets that bypassed ICMP inspection.","It scanned only the ports open in the firewall whitelist.","It performed an ICMP Echo ping sweep without port probing."],"a":[3],"e":"CEH v13 解釋道:IDS 系統經常被調製來偵測活動掃描行為， 特別是連接埠掃描 和 TCP/UDP 偵測生成可識別簽名。命令nmap-sn-PE 執行純 ICMP Echo Request ping slew 而不傳送任何 TCPSYN， UDP 探測器， 或通常與連接埠列舉相關的其他 封包。由於此模式完全禁用連接埠掃描，它產生的流量極小，類似於合法的網路行為。 CEH 強調許多網路允許ICMP 回聲內部流量用於診斷，因此除非超過速率閾值，否則此類 ping 可能不會被視作可疑。 由於測試者避免了 SYN 封包，ACK 探測器，以及 UDP 掃描，因此 IDS 沒有看到惡意模式或連線嘗試。 這種技術的功效在被動和隱形偵察下的CEH 中被突出顯示，其中使用最小的相互作用來避免被偵測。 因此，掃描之所以成功，是因為它完全依賴於 ICMP 主機發現，而不是連接埠掃描。"},{"n":309,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"As part of a controlled red-team engagement, an ethical hacker evaluates the resilience of a corporate campus against radio-frequency disruption. The tester activates a portable multi-antenna signal suppression device from a nearby building. The interference affects wireless communication across several departments within an estimated coverage radius of approximately 120 meters. The disruption persists for slightly over an hour before the device requires recharge. Analysis confirms that multiple frequency bands, including Wi-Fi and cellular standards, were simultaneously impacted. Based on the operational characteristics observed, identify the jamming device most consistent with this activity.","o":["PCB-1016 Jammer","CPB-2612H-5G Jammer","CPB-2920 Jammer","PCB-4510 Jammer"],"a":[3],"e":"正確答案是 D.PCB-4510 賈默。這個情境描述了一個可中斷數個無線的行動式高能多波段干擾器。包括 Wi-Fi 和蜂窩通訊在內的各種技術，在大約 120 米範圍內飛行，時間略多一個小時。 CEH 無線安全材料將無線干擾描述為阻斷服務條件，攻擊者使用干擾裝置來阻斷受影響地區內的無線通訊。 無線裝置在將足夠的相競 RF 能量引入到空中波後容易被幹擾或干擾。 另一無線參考文獻解釋 Wi-Fi 訊號干擾會用特殊的硬體來阻斷通訊，並阻止使用者連線到干擾器附近的無線網路。選項 A.PCB-1016 賈默爾是不正確的，因為它不最佳地匹配所描述的更高覆蓋半徑和多波段撞擊。選項 B。CPB-2612H-5G 賈默爾是不正確的，因為情境的範圍和執行時間與 PCB-4510 更接近。 C。 CPB-2920 Jamer 選項不正確，因為所描述的 120 米的校園干擾更能與 PCB-4510 特性相匹配。選項 D.PCB-4510 賈默爾是正確的，因為它最符合所描述的高功率，多波段，約 120 米的干擾行為。因此，最好的答案是 D.PCB-4510 賈默。","s":"term"},{"n":310,"c":"密碼學","ce":"Cryptography","t":"mid","q":"You are Jordan, a cryptographic assessor at Cascade Data in Portland, Oregon, reviewing the protection applied to telemetry logs. Your review finds an algorithm that operates on 128-bit blocks, accepts keys up to 256 bits, and the documentation notes it was one of the finalists in the AES selection process that aimed to replace legacy DES. Which symmetric encryption algorithm should you identify as being used?","o":["RC4","AES","Blowfish","Twofish"],"a":[3],"e":"正確答案是 D。 Twofish，因為問題明確描述了一個對稱的密碼: (1)工作在 128 位塊上， (2)支援鍵可達 256 位； (3)是AES 選取過程中的入圍者，旨在取代 DES。 Twofish 符合所有這些特性。 它是由布魯斯·施奈爾和同事設計的對稱區塊密碼，它是 5 個 AES 決賽選手之一(與 Rijndael，Serpent，RC6 和 MARS 一起)。 二魚使用 128 位區塊大小並允許鍵大小為 128,192,或 256 位，精確地與\"可達 256 位鍵\"線索相配合。為什麼其他選擇不合適:RC4 是一個流碼，不是 128 位塊碼碼，它也不是 AES 決賽選手。 AES 本身(Rijndael)是最終贏得 AES 比賽的演算法；提示說演算法是一個決賽選手，不一定是勝出者，描述的本意是將一個決賽選手與 AES 本身區分開來。 Blowfish 支援可變鍵長可達 448 位元，但使用 64 位元的區塊大小，而不是 128 位元的區塊，它不是 AES 的決賽選手(Twofish 被設計為 Blowfish 的後繼者，其區塊大小較大，以滿足現代要求)。在實踐中，塊大小和鍵大小特性對安全和效能很重要:128 位塊是現代對稱式加密的標準，而 256 位鍵為安全效能提供了高差。長期保護敏感的日誌。 提到 AES 定稿也表示這種演算法屬於同代現代塊密碼，設計時具有強烈的阻力來進行密碼分析並高效地執行軟體/hardware。因此，根據所宣告的屬性及其 AES 的終極狀態，對稱式加密演算法是 Twofish。","s":"term"},{"n":311,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"A manufacturing company in Columbus, Ohio, reported a surge in internal support tickets after employees received an alarming email appearing to originate from an independent cybersecurity researcher. The message claimed that a newly discovered malware strain was actively targeting corporate email systems and stated that several Fortune 500 organizations had already been compromised. It encouraged recipients to immediately circulate the message within their departments \"to minimize exposure,\" warning that failure to act quickly could result in data loss. The email did not request credentials, payment, or direct downloads. However, it relied heavily on dramatic language and cited unverifiable statistics to increase urgency and credibility. From a social engineering classification standpoint, how should this technique be categorized?","o":["Scareware Designed to Trick Users into Installing Rogue Software","Spam Email Used for Mass Unsolicited Distribution","Chain Letters that Incentivize Forwarding Messages","Hoax Letters that Spread False Security Warnings"],"a":[3],"e":"正確答案是 D。 Hoax 信件傳播虛假的安全警告。該訊息旨在透過惡意軟體突發的虛假或無法核實的訴求來製造恐懼和緊迫感，它不包含惡意附著，不要求認證資訊，也不直接要求支付，其目的是傳播虛假的警告並引起干擾或不必要的關切。符合 CEH 社交工程材料將 Hoax 字母，Chain 字母，和 Spam 列為電腦形式-。基於社交工程透過電子郵件和信件渠道傳送。選項 A。 注意軟體是不正確的，因為驚嚇軟體通常會使使用者玩弄安裝無賴軟體或支付假保護費。選項 B.垃圾郵件過於寬泛；垃圾郵件是指未經請求的散裝郵件，而這裡的內容則具體是一個虛假的警告。選項 C。 Chain Letters 是接近的，因為訊息鼓勵轉發，但更強的分類是誘騙信件，因為它傳播了虛假的安全警告。選項 D。 Hoax Letters 是正確的，因為資訊依賴於捏造的安全訴求來引發恐懼和轉發行為。因此，最好的答案是傳播虛假安全警告的 D。 Hoax 字母。"},{"n":312,"c":"密碼學","ce":"Cryptography","t":"short","q":"Encrypted session tokens vary in length, indicating inconsistent encryption strength. What is the best mitigation?","o":["Rotate keys frequently","Enforce MFA for privileged users","Implement uniform encryption strength","Centralized logging"],"a":[2],"e":"CEH v13 解釋道，加密一致性對於安全的工作階段管理至關重要。 可變的符號長度可以洩露出加密方法，金鑰大小，或使用者特權級別等資訊，使工作階段容易被加密分析或有針對性地攻擊。最有效的緩解是在所有角色中實施統一的加密強度，確保一致的金鑰大小、演算法和符號格式。 儘管 MFA 改進了認證和金鑰旋轉，改善了生命週期管理，但兩者都無法直接解決密碼不一致的問題。 CEHv13 強調加密應該角色不可知並標準化，因此，選項 C 是正確的。"},{"n":313,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"At HarborGrid Utilities in Oregon, a security assessment team is reviewing how the organization's network monitoring platform evaluates inbound traffic targeting its SCADA management interface. During testing, the red team introduces carefully crafted packets that adhere to known protocol standards but contain payload sequences previously identified in documented exploit repositories. The monitoring system immediately flags the activity because it matches patterns stored in its internal threat database. However, when the team slightly modifies the exploit sequence while preserving its overall malicious intent, the alerts are no longer triggered. Based on this behavior, which intrusion detection method is most likely deployed in this environment?","o":["Protocol Anomaly Detection","Anomaly Detection","Stateful Protocol Analysis","Signature Recognition"],"a":[3],"e":"正確答案是 D。 簽名確認。監控系統正在偵測流量，因為它與儲存在威脅資料庫的已知攻擊模式相匹配。 當酬載序列稍有改變時，警報就不再觸發了，這是基於簽名的偵測的經典行為。 符合 CEH IDS 材料解釋道，簽名識別意味著，對於每個已知的駭客技術，工程師將一個偵測模式編碼入系統，它描述為簡單的模式匹配，比如檢查封包是否為已知的惡意模式。選項 A。 協定異常偵測是不正確的，因為協定異常偵測識別出與預期的協定行為的偏差，而不僅僅是已知的弱點利用字串。選項 B。 異常偵測是不正確的，因為異常偵測將行為與正常活動的基線相比較，該情境描述了已知攻擊有效酬載的相匹配情況。選項 C。 stateful 協定 分析不正確，因為 stateful 協定 分析評價了 協定 狀態和預期 協定 跨越 工作階段 的行為。選項 D。 簽名識別是正確的，因為偵測依賴於匹配已知模式，對開發序列的微小改變可以逃避偵測。因此，最好的答案是D.簽名確認。","s":"term"},{"n":314,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"At a biomedical analytics firm in Raleigh, North Carolina, security consultant Marcus Ellison was reviewing exposed services on a legacy Linux host located in a screened subnet. While mapping available services, he observed that the machine was responding to time synchronization queries from multiple internal systems. Curious whether the service might reveal additional intelligence, Marcus issued targeted queries against the time service and received responses that exposed internal client addresses and system identifiers interacting with it. The information provided unexpected visibility into internal network structure without requiring authentication. From the available options, what enumeration technique is illustrated in this scenario?","o":["NFS Enumeration","NetBIOS Enumeration","SNMP Enumeration","NTP Enumeration"],"a":[3],"e":"正確答案是 D。 NTP 列舉。題目描述查詢時間同步服務，並接收關於內部使用者端系統的資訊，這直接對映到網路時間協定(NTP)列舉。 符合 CEH 列舉材料解釋出 NTP 執行於 UDP 連接埠 123 上，用於同步跨網路的時間。 查詢一個 NTP伺服器可能披露一個連線系統的清單，包括系統名，IP 位址，以及當 NTP 伺服器被放入 DMZ 或被篩選子網時的內部網路資訊。 另一種 CEH 參考稱:NTP 列舉可以透露主機與 NTP 伺服器，使用者端 IP 位址相連線的資訊，機器名稱，作業系統資訊，以及內部 IP 資訊，依具體情況而定。部署。選項 A。 NFS 列舉是不正確的，因為 NFS 列舉專注於網路檔案共享和匯出目錄。選項 B。 NetBIOS 列舉是不正確的，因為 NetBIOS 列舉的目標名稱，股份，工作階段，和 Windows網路資訊。選項 C。 SNMP 列舉是不正確的，因為 SNMP 列舉使用 MIB/OID 資料查詢裝置管理資訊。選項 D。 NTP 列舉是正確的，因為被詢問的服務是一種時間同步服務，暴露出使用者端和內部網路資訊。因此，最好的答案是 D.NTP 列舉。","s":"term"},{"n":315,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"What is the proper response for a NULL scan if the port is closed?","o":["No response","FIN","RST","SYN","ACK","PSH"],"a":[2],"e":"NULL 掃描是一種 TCP 連接埠掃描技術；攻擊者傳送未設定任何 TCP 旗標的封包。它常用於網路偵察與連接埠掃描階段，以辨識開放或關閉的連接埠，並試圖規避部分安全控制及日誌記錄機制。\n\n依 RFC 793 所定義的 TCP/IP 行為，以及 CEH 的網路掃描概念，NULL 封包傳送至關閉的連接埠時，目標系統應回覆TCP RST（Reset）封包。RST 表示該連接埠沒有服務接聽，連線嘗試應立即終止。\n\n若連接埠開放，多數 UNIX/Linux 系統通常不會回應 NULL 掃描封包。因此，Nmap 等掃描器會把「沒有回應」解讀為open|filtered，把 RST 解讀為 closed。\n\nA 的無回應通常對應開放或遭篩選的連接埠，而不是關閉的連接埠。FIN、SYN、ACK 與 PSH 也都不是關閉連接埠對NULL 掃描的預期回應。因此，正確答案是 C：RST。","s":"term"},{"n":316,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"During a security penetration test at ABC Financial Services in Miami, Florida, on July 9, 2025, ethical hacker Javier Morales targets the company's online banking portal to assess its resilience. Over several hours, the portal's web server begins to falter, with legitimate users reporting inability to log in or complete transactions. The IT team notices the server is struggling to accept new connections, as its maximum connection limit is nearly reached, despite no significant spike in overall network traffic. Javier's controlled test, run from a secure system, logs interactions to simulate a real attack, aiming to evaluate the IT team's ability to identify the threat. What DoS or DDoS attack technique is Javier's exercise primarily simulating?","o":["Slowloris Attack","UDP Flood Attack","Peer-to-Peer Attack","SYN Flood Attack"],"a":[0],"e":"症狀直接指向了 Slowloris 攻擊，CEH 的材料將它歸類為應用層阻斷服務技術，透過耗盡網路伺服器可用的併發連線插槽來瞄準網路伺服器。而不是飽和 頻寬。 在 Slowloris 攻擊中， 攻擊者開啟許多 HTTP 或 HTTPS 連線到 伺服器， 然後透過傳送部分的，不完整的 HTTP 請求或非常緩慢的報頭傳送來儘可能地保持它們的生命。 由於請求從未完全完成， 伺服器 保持連線開啟，等待請求的剩餘部分。 隨著時間的推移，伺服器的最大連線限被消耗，合法的使用者無法建立新的工作階段，儘管總體網路流量可能保持相對低。這個確切的規律在情境中被描述:伺服器是\"為接受新接通而作的絆腳石\"，\"最大接通限已接近\"，\"總體網路流量沒有顯著的突起\"，這是低而低的 DoS 行為的一個經典指標，由於它不類似於高容量的泛洪，因此可能更難被偵測出。 SYN\"泛洪\"攻擊也可以耗盡連線資源，但一般會產生大量半開 TCP 連線，通常在網路層遙測和 SYN\"積壓行為\"中更為明顯。 AUDP\"泛洪\"一般會導致明顯的流量突起。 \"Peer-to-Peer Atttack\"描述出一個殭屍網路架構。樣式，而不是這裡使用的具體技術。因此，模擬攻擊是 Slowloris。","s":"term"},{"n":317,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"You are Michael Rivera, a cybersecurity consultant at FortiSec Solutions, hired to strengthen the wireless network of DesertTech Innovations, a startup in Phoenix, Arizona. After a recent penetration test revealed vulnerabilities, the IT manager, Lisa Nguyen, asks you to recommend a defense mechanism to prevent unauthorized devices from connecting to the corporate Wi-Fi. You suggest a method that requires each connecting device to authenticate through a centralized server using a unique username and password. Based on the described approach, which wireless security countermeasure should DesertTech implement?","o":["Use 802.1X Authentication","Disable TKIP","MAC Address Filtering","Upgrade to WPA3"],"a":[0],"e":"要求每個裝置透過一個使用獨特使用者名稱和密碼的集中式伺服器進行認證，直接與 802.1X 認證對接，CEH 材料將其描述為企業有線和無線環境中使用的連接埠基於網路的存取控制。 Wi-Fi 中,802.1X 一般是。由 WPA2-Enterprise 或WPA3-Enterprise 執行，並依賴後端為 EAP 的方法來進行 AAA 伺服器，最常見的是 RADIUS。 存取點充當認證者，將使用者端的認證交換器轉發到 RADIUS 伺服器，該交換器驗證使用者或裝置的身分，並連同工作階段金鑰和政策屬性一起返回一個接受或拒絕的決定。 這提供了強有力的控制和審計，因為存取可以與個人身分掛鉤，支援帳戶的去功能化，並且可以強制實施不同的存取級別。其他選項與\"集中的伺服器與獨有的認證資訊\"描述不相匹配。 禁用 TKIP 透過去除已過時的加密協定來改進安全性，但它不提供每個使用者認證。 MAC 位址過濾很弱，因為 MAC 位址容易發現並偽造的，它不使用集中身分驗證。 升級到 WPA3 可以提高加密強度，而 WPA3-企業可以與 802.1X 一起工作，但僅 WPA3 本身並不保證集中的使用者名稱和密碼認證，除非具體部署有 802.1X 的企業模式。因此，符合所描述設計的正確對應措施是使用802.1X 認證，並採用集中身分驗證伺服器，使存取控制強大，問責，並改進了對未經授權的裝置連線的阻力。"},{"n":318,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"While performing a SYN (half-open) scan using Nmap, you send a SYN packet to a target IP address and receive a SYN/ACK response. How should this result be interpreted?","o":["The scanned port is open and ready to establish a connection","The target IP is unreachable","The port is filtered by a firewall","The port is closed but acknowledged"],"a":[0],"e":"根據 CEH 網路掃描模組，一款 SYN 掃描透過分析 TCP 握手反應而工作。 SYN# SYN/ACK=連接埠 OPEN 網際網路檔案館的存檔，存檔日期 2013-12-02。 SYN# RST = 連接埠 CLOSED 網際網路檔案館的存檔，存檔日期 2013-09-02。無回應=FILTERED 選項 A 是正確的。 CEH 強調 SYN 掃描為隱形，因為握手從未完成。"},{"n":319,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"Attackers exfiltrate data using steganography embedded in images. What is the best countermeasure?","o":["Block all outbound traffic","Deploy IPS","Monitor outbound traffic for anomalies","Use steganalysis tools"],"a":[3],"e":"CEH v13 解釋道，以素描為主的分解會將資料隱藏在良性外觀檔案內，使得僅透過防火牆或 IPS 就極難被偵測出。 遮蔽出行的所有流量是不切實際的，而 IPS 系統並不是為了深入分析檔案內容來取得隱藏的資料而設計的。最有效的反制措施是 steganalysis，它涉及檢查檔案以發現統計異常，改變畫素分佈，或隱藏的酬載圖案。 CEH v13 將 steganalysis 工具確定為唯一可靠的偵測和解碼隱藏資料的方法。流量監測(備選 C)有助於查明可疑的轉移，但不能證實其結構特徵，因此，備選 D 是正確的。"},{"n":320,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"Sarah, a cybersecurity analyst at a US-based e-commerce company in New York, is tasked with evaluating the company ' s transition to a cloud-based infrastructure to support its growing online platform. The company aims to optimize resource allocation to handle fluctuating customer demand during peak shopping seasons, such as Black Friday. Sarah must recommend a key characteristic of cloud computing that ensures resources are efficiently shared across multiple users while maintaining scalability. Which cloud computing characteristic should Sarah recommend ensuring efficient resource sharing and scalability for the e-commerce platform?","o":["Measured service","Broad network access","Resource pooling","On-demand self-service"],"a":[2],"e":"在認證道德駭客雲端運算覆蓋中，雲服務的基本特徵與被廣泛採用的 NIST 雲模型一致。 本設想方案的要求有兩重:多個使用者之間高效共享資源，以及有能力規模化滿足黑星期五流量等需求高峰。 雲的特徵直接解決高效共享的特徵是資源整合。資源集聚是指雲提供方將計算、儲存、記憶體和網路資源彙總到一個共享的池中，使用多租戶模式為多個客戶服務。 資源被動態分配和根據消費者需求重新分配，這樣可以快速縮放，而無需組織為每次激增購買和安裝新的有形基礎設施。這符合設想方案對最佳化資源分配和確保可擴充套件性的強調。 透過資源集中，當需求增加時，平台可以利用共享基礎設施能力，當需求減少時，平台可以釋放，提高效率和成本效益。 從 CEH 的角度來看，這也影響安全。諸如租戶隔離、超衛士安全、和存取控制等考慮，因為多個客戶可能依賴相同的基本物理硬體，而同時又保持邏輯上的分離。其他選項並非\"在多個使用者之間高效共享\"的最佳匹配。 被測量服務側重於計量和現收現付計費。 廣域網存取描述網路和標準使用者端平台的可用性。 點播自助服務指消費者在沒有提供者的人機互動的情況下自動提供資源的能力。 這些都是重要的雲特性，但具體促成共享基礎設施和彈性分配的特徵是資源集中。","s":"term"},{"n":321,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"What is lateral movement?","o":["Data exfiltration","Pivoting","Privilege escalation","Network traversal"],"a":[3],"e":"正確答案是 D， Network traversal。 在 CEH 系統駭客化和開發後的概念中，平面運動是指攻擊者從一個主機，帳戶或資源轉移到另一個已受損的環境。 在獲得初始存取後，攻擊者可以列舉系統，收割認證資訊，濫用信任關係，存取共享資源，或使用遠端管理協定到達額外的機器。 上傳的駭客方法材料將\"接管\"階段描述為將控制從一個單個主機擴充套件至網路中的其他主機，直接與平相移動相配合。 樞軸是緊密相聯的，但它更準確地是用來透過一個被破壞的系統來引導流量以達到原本無法存取的網路的技術。權限提升意味著一個系統中的權限增加，而資料外洩意味著從環境中偷取或傳輸資料。 由於問題問到橫向移動是什麼，最精確的答案是網路的轉錄。","s":"term"},{"n":322,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"Malware infecting multiple systems remains dormant until triggered and changes its code or encryption with each infection to evade detection. Which malware type best fits this description, and what is the most effective mitigation?","o":["Rootkit use anti-rootkit tools and patch systems","Adware deploy anti-adware tools and train users","Worm isolate infected systems and scan the network","Polymorphic malware use behavior-based detection and ensure systems are patched"],"a":[3],"e":"CEH 惡意軟體威脅模組將多型惡意軟體定義為每次傳播其外觀變異(程式碼，加密，包裝)的惡意軟體碼，使得以簽名為基礎的偵測無效。 Dormancy 和以觸發為活化也是常見的特徵。 CEH 強調以行為為基礎的偵測，沙箱和 heuristic 分析是針對多型性威脅的最有效對策。選項 D 是正確的。選項 A、B 和 C 不涉及多形態逃逸技術。"},{"n":323,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A sophisticated injection attack bypassed validation using obfuscation. What is the best future defense?","o":["Continuous code review and penetration testing","Deploy WAF with evasion detection","SIEM monitoring","Enforce 2FA"],"a":[1],"e":"CEHv13 強調高階注入攻擊往往透過編碼和模糊來逃避輸入驗證。 有逃避偵測的 Web 應用程式防火牆(WAF)可以分析請求模式，酬載行為，以及即時的異常。程式碼審查很重要，但具有反應性。 SIEM 與攻擊後日誌相關。 2FA 不阻止注入。因此，選項 B 提供了最有效的即時保護。"},{"n":324,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"During a red team exercise at a technology consulting firm in San Francisco, analyst Evelyn deploys a malicious payload disguised within a software update installer. When the target runs the installer, the main application functions normally, but behind the scenes, additional malware components are silently placed on the system without the user ' s knowledge. These hidden components later activate to establish remote access for the red team. Which technique was most likely used to deliver the hidden malware?","o":["Downloader","Wrapper","Injector","Dropper"],"a":[3],"e":"情境描述一個看起來合法的程式(一個“正常功能”的軟體更新安裝器)，同時將額外的惡意元件秘密地放入系統，而系統隨後執行以建立遠端存取。這就是滴水人的定義行為。 滴滴者的主要作用是將(倒放)惡意軟體有效酬載送入主機-寫入檔案，將嵌入的元件解開或拆開，但往往偽裝成良性應用。 然後，惡意元件可能立即被執行或準備在以後啟動，以減少懷疑並增加持久性。這與下載器不同，一般包含最小的酬載並專注於在初始執行後聯絡遠端的伺服器來取取惡意軟體，在這種情況下，描述強調\"額外惡意軟體元件被靜默地放入系統\"，意味著酬載正在由初始程式在當地安裝/deposited，而不是主要下載。注入器注重向另一個執行過程(程序注入)注入程式碼來逃避偵測或執行到另一個程序上下文；它不從本質上描述將額外元件作為單獨的隱藏檔案而放置的行為。 包裝器是一種將惡意軟體捆綁或用合法程式\"被封包\"從而同時執行的技術；而同時包裝可以用於 trojanized 安裝器中，問題強調後幕後放置附加元件以進行後活化，這是典型的滴入行為。關鍵指標是:(1)使用者執行一個顯示正常的安裝器，(2) 隱藏的惡意軟體元件在使用者不知情的情況下被放入，(3) 這些元件隨後被啟用用於遠端存取。該鏈條符合滴入器的目的:隱形惡意軟體的傳送和中轉。因此，正確答案是 D。 Dropper。","s":"term"},{"n":325,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"A network administrator reviews logs and observes that an attacker sends packets requesting the target system' s internal clock value. The response includes timing information that can be used to calculate round-trip delay and analyze host characteristics. What host discovery technique is being used in this scenario?","o":["UDP Ping Scan","ICMP Echo Ping Sweep","IP Protocol Scan","ICMP Timestamp Ping Scan"],"a":[3],"e":"正確答案是 D。 ICMP Timerstamp Ping Scan。 ICMP Timerstamp Ping Scan 使用 ICMP timetamp 請求信件查詢目標系統的時鐘值，如果目標回應，返回的時間 amp 資訊可以確認主機是活的，還可以幫助推斷出來回延遲等計時特性。 CEH掃描材料解釋道，ICMP 掃描透過傳送 ICMP 請求和觀察答覆來識別活主機。 ICMP 回波回波答覆驗證一個主機是活的，而以 ICMP 為基礎的發現也可以幫助確定網路行為和主機特性。選項 A。 UDP 平平掃描是不正確的，因為 UDP 掃描使用UDP 探測器，而不是 ICMP 時間戳請求。選項 B。 ICMP Echo Ping Sweep 是不正確的， 因為 Echo Ping 掃描使用ICMP Echo 請求和 Echo Response， 而不是時間戳 rest/reply。選項 C。 IP 協定 掃描不正確，因為 IP 協定 掃描測試支援 IP 協定，而不是查詢時鐘值。選項 D。 ICMP Timestamp Ping Scan 是正確的，因為封包請求目標的內部時鐘值。因此，最好的答案是 D。 ICMP Timerstamp Ping Scan。","s":"term"},{"n":326,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During an external security review of a manufacturing firm in Detroit, Michigan, you ' re asked to prioritize patch baselines for internet-facing servers without logging in or establishing full sessions. To achieve this, you analyze network-level responses and capture application output in order to determine the underlying system and its software release. Which technique best fits this objective?","o":["Service Version Discovery","Port Scanning","OS Discovery","Vulnerability Scanning"],"a":[0],"e":"正確答案是 A。 Service Version Discovery，因為目標是透過分析網路回應和應用程式輸出--不包含--來識別在網際網路服務上執行的軟體釋出/版本。認證或建立完整的工作階段。 在符合 CEH 偵察方法中， service/version 的發現(常被稱作版本偵測或搶取標語)側重於確定正在執行的服務(如 HTTP 伺服器，SSH 守護程序，SMTP 伺服器)以及它是什麼版本/build(如 Apache/Nginx 版本，OpenSSH 版本，應用程式框架釋出)。 這種資訊直接支援\"優先處理修補程式基線\"，因為修補程式的迫切性在很大程度上取決於準確的產品版本:知道該版本有助於對映出已知弱點並識別過時的建築。即時提示的\"分析網路級別回應並抓取應用程式輸出\"與抓取橫幅，協定談判，以及回覆指紋等技術一致。 許多服務在標頭，問候，錯誤頁，TLS 憑證，或協定握手時披露識別字串。 即使旗子被最小化，在回應上的細微差異仍然可以表示版本或者至少縮小出產品家族。 這通常在外部進行，不需要認證資訊，匹配約束\"不登入或建立完整的工作階段\"。為什麼其他選項不準確:連接埠掃描可以識別哪些埠是開啟的，哪些服務可以是存在，但它不一定決定精確的軟體釋出。 OS 發現(OS flashing)旨在從作業系統，有時還有從封包特性推斷出核心家族； 很有幫助，但任務強調\"軟體釋出\"和\"應用程式輸出\"，這與服務版本偵測比 OS 偵測更相配合。 弱點掃描透過測試已知的弱點和錯位而更進一步；雖然它可能包括版本偵測，但問題要求採用最符合所述目標的技術--確定網路/application 回應中的基本服務/software 釋放量--使服務版本發現是最直接的匹配。因此，技術是服務版本發現。","s":"term"},{"n":327,"c":"密碼學","ce":"Cryptography","t":"mid","q":"Alice, a software developer, digitally signs an email contract and sends it to Bob. Later, a dispute arises and Alice claims she never sent the agreement. However, Bob produces the email with Alice ' s unique digital signature, which unequivocally links the message to her. In information security terms, what principle is illustrated by Bob ' s ability to prove Alice ' s authorship of the email?","o":["Confidentiality","Integrity","Non-Repudiation","Availability"],"a":[2],"e":"不否定是安全原則，它阻止傳送者否認實施了特定行動，例如傳送了電文或批准了一項交易。 在符合 CEH 密碼學中，不否定最常用的是使用由公開金鑰密碼學支援的數位簽章實現，在許多現實世界部署中，使用數位憑證和可信賴的憑證權威支援。 當愛麗絲在數字上籤署電子郵件合同時，她用她的私密金鑰來建立一個在數學上與她的身分和信件的準確內容都聯絡在一起的簽名。 Bob 然後可以使用愛麗絲相應的公開金鑰來驗證。簽名。如果驗證成功，它提供了強有力的證據，證明該訊息來自愛麗絲的私密金鑰的持有者，而且自簽署以來內容沒有被更改。這與保密不同，保密涉及透過加密防止未經授權的電文內容被披露，它也與完整性本身不同:完整性確保電文沒有被修改，而不否定則透過將行動約束於特定的簽字人的方式，以能夠向第三方證明的方式來增加問責。 這裡的可提供性無關緊要，因為它涉及確保在需要時可取得系統和資料。CEH 材料強調不撤銷取決於恰當的金鑰管理和信任基礎設施。 如果愛麗絲的私密金鑰被破壞，則證據價值被削弱。 因此，用安全的儲存，存取控制和撤銷機制保護私人金鑰對於保持不撤銷至關重要。","s":"term"},{"n":328,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"During a red team exercise, a Certified Ethical Hacker (CEH) is attempting to exploit a potential vulnerability in a target organization's web server. The CEH has completed the information gathering and footprinting phases and has mirrored the website for offline analysis. It has also been discovered that the server is vulnerable to session hijacking. Which of the following steps is most likely to be part of a successful attack methodology while minimizing the possibility of detection?","o":["Hijack an active session and immediately modify server configuration files.","Attempt SQL injection to extract sensitive database information.","Perform vulnerability scanning using automated tools to identify additional weaknesses.","Launch a direct brute-force attack to crack the server's administrative password."],"a":[1],"e":"根據認證的道德駭客 (CEH)攻擊方法，一旦偵察，足跡和網站映象完成，攻擊者在保持隱形性的同時謹慎地進行開發。CEH 檔案強調，低噪聲，應用層攻擊在目標是將探測最小化時更可取。選項 B，嘗試 SQL 注入，直接與 CEH 的 Web 應用程式入侵模組對接。 SQL 注入是一種伺服器側攻擊，經常透過外觀正常的 HTTP 請求執行，使其不太可能觸發入侵探測系統(IDS)或安全警報。 CEH 材料突出出 SQL。注入是一種常見而有效的技術，用於擷取敏感資料，如使用者名稱，密碼，以及業務關鍵資訊而不會干擾伺服器操作。選項 A 是不正確的，因為工作階段劫持後立即修改伺服器設定檔會大大增加被偵測的風險。 CEH 準則會強調開發後的限制，特別是在紅隊執行期間。選項 C 在現階段並不理想，因為自動弱點掃描器產生大量的流量，而且非常可探測。 CEH 明確指出，弱點掃描很吵並經常被記錄下來。選項 D 是最不隱蔽的選擇。暴力破解攻擊會產生無數失敗的認證嘗試，觸發安全警報和帳戶關閉。 CEH 將暴力破解攻擊歸類為高風險和容易被察覺的攻擊。因此，SQL 注入代表著按照 CEH 的結構化攻擊生命週期最有效並最隱蔽的下一步。"},{"n":329,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester suspects that a web application ' s login form is vulnerable to SQL injection due to improper sanitization of user input. What is the most appropriate approach to test for SQL injection in the login form?","o":["Inject JavaScript into the input fields to test for Cross-Site Scripting (XSS)","Enter ' OR ' 1 ' = ' 1 in the username and password fields to bypass authentication","Perform a directory traversal attack to access sensitive files","Use a brute-force attack on the login page to guess valid credentials"],"a":[1],"e":"CEH v13 解釋說，SQL 注入通常發生在使用者輸入被調校成 SQL 查詢時，沒有進行適當的驗證或參數化。 登入形式是最常見的注入目標之一，測試者使用專門設計的測試有效酬載來操縱認證查詢。 一個經典的測試字串，如\"OR\"\"1\"等，會利用條件邏輯，強迫 SQL 語句進行真實評價，如果應用程式脆弱，則有效繞過認證。 CEH 指出，這一技術是標準的初步測試，因為它風險低，易被偵測到，並且直接確認 XSS 的不適當的消毒。 JavaScript 注入(備選 A)測試，而不是 SQLi。 目錄 traversal (選項 C) 目標為檔案路徑弱點，而不是 SQL 查詢。 Brute-force attacks (選項 D) 依賴於猜測認證資訊，而不測試輸入靜態化。 因此，使用邏輯 SQL 注入酬載是最合適的和 CEH 對齊的方法。"},{"n":330,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"During an authorized security assessment of a smart home product manufacturer in San Jose, California, a certified ethical hacker evaluates the web-based management interface used to configure connected IoT cameras and lighting controllers. The tester discovers that when an internal user visits a specially crafted external website, the browser automatically initiates requests to a locally hosted device management interface within the user's private network. Which attack technique best explains this behavior?","o":["Forged Malicious Device Attack","SDR-Based Attack","DNS Rebinding Attack","Distributed Denial-of-Service (DDoS) Attack"],"a":[2],"e":"正確答案是 C。 DNS 重新繫結攻擊。關鍵行為是外部網站會讓被害者瀏覽器將請求傳送到內部，本機主機的 IoT 管理介面，這是 DNS 重新繫結的特徵，攻擊者濫用瀏覽器信任和 DNS 解析行為，這樣一來惡意網頁就可以與私人網路資源互動。符合 CEH IoT 材料將不安全的網路介面和不充分的認證/Authorization 確定為 IoT 的重要弱點，特別是因為許多裝置介面只打算在內部網路上被曝光，但仍能被內部使用者或基於瀏覽器的互動路徑所威脅。 DNS 透過將被害者的瀏覽器用作進入私人網路的橋樑來重新繫結這個條件。 DNS 重新繫結特別地濫用了這個條件。選項 A。 偽造惡意裝置攻擊是不正確的，因為沒有引入 rogue IoT 裝置。選項 B。 SDR- 基於攻擊是不正確的，因為軟體定義的無線電攻擊目標為無線/radio 通訊，而不是基於瀏覽器存取本機網路介面。選項 D。 分散式阻斷服務(DDoS) 攻擊是不正確的，因為情況不約為泛洪或服務耗盡。因此，最好的答案是 C.DNS 再裝訂攻擊。","s":"term"},{"n":331,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"During a penetration test at an e-commerce company in Boston, ethical hacker Sophia launches an HTTP flood against the checkout page of the site. The simulated traffic consists of repeated GET and POST requests designed to overload application-layer resources. In response, the IT team activates a security tool that inspects and filters malicious HTTP traffic while allowing legitimate customer requests to pass, ensuring service continuity during the exercise. Which DoS/DDoS protection tool is most likely being used in this scenario?","o":["Load Balancer","Web Application Firewall","Intrusion Prevention System","Firewall"],"a":[1],"e":"HTTP 泛洪是一種應用層(Layer 7)DoS/DDoS 技術，透過傳送大量看來有效的 HTTPGET/POST 請求，瞄準了 Web 應用程式資源。 因為流量在協定級別上可以看起來\"合法\"， 主要側重於網路/transport 特性(如基本防火牆)的控制往往不夠充分。 情境中描述的工具是明確檢查並過濾惡意的 HTTP 流量，同時允許合法的客戶請求--行為最直接地與 Web 應用程式防火牆(WAF)相匹配。 WAF 的設計是為了透過分析 HTTP/S 請求和回應來保護 Web 應用程式，應用安全規則來偵測並遮蔽異常或惡意模式。 在 HTTP 泛洪情境下，WAF 可以強制限制速率，偵測請求異常(例如，重複請求資源密集型端點如擷取)，識別類似 bot 的行為，並應用簽名/behavioral 政策來減輕攻擊，同時繼續允許有效使用者使用。 關鍵線索是專注於HTTP 級檢查和過濾，以保持服務連續性--這是第 7 層攻擊期間經典的 WAF 使用案例。為何其他選項不合適 :負載平衡器(A)透過在伺服器間分配流量來改善可用性，但它不從本質上檢查並過濾惡意的 HTTP 請求，它能幫助吸收負載，然而它並不是主要的安全檢查/過濾控制。入侵防禦系統(C)可以阻斷惡意活動，但許多 IPS 部署在網路/transport-layer 模式下更為強大，可能無法提供與目標網路端點的 WAF 相同的應用-認知 HTTP 政策執行深度。由 IP/連接埠/協定 過濾器組成的傳統 防火牆( D) 無法可靠地區分惡意和合法的 HTTP GET/POST 泛洪 當它們使用允許的埠時(80/443).)","s":"term"},{"n":332,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"You are Sofia Patel, an ethical hacker at Nexus Security Labs, hired to test the mobile device security of Bayview University in San Francisco, California. During your assessment, you are given an Android 11-based Samsung Galaxy Tab S6 with USB debugging disabled and OEM unlock restrictions in place. To simulate an attacker attempting to gain privileged access, you install a mobile application that exploits a system vulnerability to gain root access directly on the device without requiring a PC. This allows you to bypass OS restrictions and retrieve sensitive research data. Based on this method, which Android rooting tool are you using?","o":["Magisk Manager","One Click Root","KingoRoot","RootMaster"],"a":[2],"e":"題目描述一種基於 AP 的 rooting 方法，它不依賴 PC 連線， USB 除錯， 或啟動裝入器解鎖工作流程。 在 CEH 移動平台覆蓋中， 此方法與“ 單擊” rooting 工具對齊， 將權限從使用者空間直接提升到裝置上。 這些工具通常針對 Android OS 中已知的弱點，供應商核心，或系統服務以獲得根權限，再安裝管理元件以保持高調存取。 KingoRoot 在道德駭客培訓背景中被通俗地引用為一擊打根解決方案，可以作為 Android 應用程式執行，並嘗試在沒有電腦的情況下根取一個裝置，這取決於裝置模型，Android 版本，和修補程式級別。 這直接匹配了提示符:Sofia 安裝了移動應用程式，它\"開發了一種系統弱點\"，它實現了根\"不需要 PC\"。 給定的制約，USB 除錯已禁用和 OEM 解鎖限制，使得 PC-所輔助的 ADB 工作流程或以靴子為主的 rootloader 根更不可行，這進一步支援了被開發驅動的，在 device 上根工具。 Magisk 管理器主要是根管理和無系統修改框架，通常假定裝置已經根植，或者使用者可以補上後靴影象並閃出，經常需要 OEM 限制會阻斷的後靴解鎖步驟。 \"一擊根\"是一個通用標籤而不是一個許多 CEH 風格的問題庫中的特定工具。 RootMaster 是另一個一擊工具，但KingoRoot 是在此上下文中最被廣泛認可並經常被引用的以直接 APK-為基礎的根。","s":"term"},{"n":333,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A senior attacker uses OAuth tokens stolen from browser storage to access APIs. What attack does this represent?","o":["SQL Injection","CSRF","XSS","Token replay"],"a":[3],"e":"正確答案是 D， Token 重放。 在這種情境中，攻擊者已經擁有了從瀏覽器儲存中被竊取的有效 OAuth 權杖，並重新使用它們來存取受保護的 API。 OAuth 存取權杖通常作為 Bearer 權杖， 意思是，除非執行額外的保護，否則擁有該權杖即可足以提出授權的 API 請求。 CEH 工作階段劫持概念描述為: 重放工作階段作為攻擊者，捕取一個用於伺服器的認證權杖並重放請求，以獲得未經授權的存取。 CEHWeb 應用程式方法還列出了工作階段管理攻擊下的工作階段重放，其中認證是。繞過以假扮合法授權的使用者。 SQL 注入目標資料庫查詢， CSRF tricks an 已認證的受害者瀏覽器傳送意外請求， 並且XSS 注入惡意指令碼；XSS 可能是一種用於盜取權杖的方法， 但是對 APIs 重新使用被竊取的 OAuth 權杖是權杖重放。因此， 最好的答案是 Token 重放。","s":"term"},{"n":334,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A digital publishing firm in Charlotte, North Carolina, noticed suspicious probing activity against its public website. To proactively assess exposure, the security team initiated a focused scan of the company's HTTP servers. The chosen tool examined server headers, identified installed web server software through file signatures and favicon analysis, checked for outdated components, and searched for potentially dangerous files and misconfigurations. The scan also supported SSL connections and generated exportable reports in multiple formats for documentation. Which vulnerability assessment tool most closely aligns with the capabilities described?","o":["Nessus","OpenVAS","Qualys VM","Nikto"],"a":[3],"e":"正確答案是 D。 Nikto。 Nikto 是一個開源網路伺服器弱點掃描器。 它專門設計用於掃描網路伺服器，用於危險檔案，過時的伺服器版本，版本特定問題，設定問題，以及已知的網路伺服器弱點。 符合 CEH 的網路 伺服器駭客材料稱，Nikto掃描潛在危險的檔案和程式，檢查過時的伺服器版本，並識別不同伺服器的版本特有問題。 另一所 CEH 考試參考文獻稱Nikto 是一個網路-伺服器聚焦的弱點掃描器，用於檢查檔案問題，指令碼錯誤，和伺服器設定錯誤。選項 A。 Nessus 不正確， 因為 Nessus 是寬 弱點掃描器， 不是最具體的匹配所描述的 Web-伺服器重點檢查。選項 B。 OpenVAS 是不正確的，因為 OpenVAS 也是一個通用的弱點評估平台。選項 C。 Qualys VM 是不正確的，因為 Qualys VM 是一個企業弱點管理平台，而不是所描述的具體網路伺服器掃描器。選項 D。 Nikto 是正確的，因為所描述的能力直接匹配 Nikto。因此，最好的答案是 D。 Nikto。","s":"tool"},{"n":335,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"long","q":"On July 9, 2025, during a security penetration test at MedSecure Health in Phoenix, Arizona, the ethical hacking team evaluates the resilience of the company ' s patient portal system. Ethical hacker Aisha Khan initiates a controlled test that generates sustained traffic pressure against the web application servers. As system responsiveness declines, the IT operations team reallocates backend resources, suspending lower- priority modules such as system alerts and notification services, allowing high-priority functions like prescription refills and patient check-ins to remain accessible. Aisha's controlled simulation is designed to assess the IT team's ability to maintain critical functionality under partial resource exhaustion. What DoS DDoS countermeasure strategies is Aisha's exercise primarily simulating?","o":["Degrading Services","Shutting Down Services","Absorbing the Attack","Rate Limiting"],"a":[0],"e":"所述行為與 CEH-對齊 DoS 復原力規劃中通常提及的對應措施戰略一致，認為是服務退化或優雅退化，在持續的流量壓力下，目標並不一定是保留所有可用的特徵，而是透過故意減少非必要工作量來維護對任務至關重要的功能。 在情境中，操作團隊\"重新分配後端資源\"，\"暫停低優先順序模組\"，如提醒和通知，這樣處方再填充和病人入住等基本保健工作流程仍然可以執行。 這就是有辱人格服務的定義:有選擇地限制功能，以便在部分資源耗盡期間保持最重要的業務流程。 這與關閉服務不同，這意味著將應用程式或主要部件下線以阻止損害或恢復穩定性，通常會完全或更廣泛地減少可用性。 它與吸收攻擊也不同，它側重於縮放、負載平衡、擦除，或利用 CDN 和 DDoS 保護來處理並稀釋所運入的體積，同時儘可能保持正常功能。 而不是拖動請求率.CEH 最佳做法強調優雅的退化需要-defined 服務級，依賴意識，和執行本，這樣團隊就可以安全地解除安裝而無需突破核心認證，資料完整性，或關鍵的使用者行程。","s":"term"},{"n":336,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at Lone Star Healthcare in Austin, ethical hacker Liam evaluates the hospital ' s perimeter defenses by generating controlled traffic flows through the firewall. He uses a tool that can create and replay diverse traffic patterns to test how well the firewall enforces its rules against both legitimate and malicious traffic types. This allows him to demonstrate whether the device properly identifies evasion attempts under simulated attack conditions. Which tool is Liam most likely using in this test?","o":["Nmap","Traffic IQ Professional","Colasoft Packet Builder","Metasploit"],"a":[1],"e":"情境最符合流量 IQ 專業，因為它描述了一個工具，透過防火牆來驗證模擬攻擊條件下的規則執行和偵測來生成並重放不同的流量模式。 這裡的關鍵功能是流量生成，重放，以及建立合法和惡意流量模型的能力，以測試防火牆是否正確處理逃逸嘗試和政策執行。 流量生成/replay 平台用於安全驗證和防火牆測試，以在規模上模仿現實世界網路行為，並評估裝置如何回應被設計出或重播的流量概況。為什麼其他工具不太合適:Nmap(A)主要是用於主機發現，連接埠掃描，和服務列舉的掃描器，並帶有一些指令碼能力。 它主要不是用於進行有多種受控流量的防火牆的流量生成/replay 系統。 Colasoft 封包 Builder (C) 可以在封包級別上進行手動活化，並建構自訂流量，這對建立具體的測試封包很有用。 然而，該情境強調更廣泛的\"多元流量模式\"，並以通常與流量模型/validation 套房而不是單-封包構造相聯的方式回放流量。 Metasploit(D)是一個弱點利用框架，用於開發和實施開發並有效酬載，雖然它能夠產生一定流量，但其主要目的不是全面生成流量並重放，以驗證許多流量型別下的防火牆政策。流量智商最合適，因為它與防火牆測試計劃相配合，側重於模擬合法和惡意的流量概況，包括逃逸式模式，並展示周邊裝置在被控制條件下的表現方式。 這種方法常被用來評價防火牆是否能夠一致地執行安全政策，發現異常，並抵制逃逸技術而不會過度阻塞合法流量。因此，最可能的工具是 B。 Traffic IQ 專業。","s":"term"},{"n":337,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester is evaluating a web application that does not properly validate the authenticity of HTTP requests. The tester suspects the application is vulnerable to Cross-Site Request Forgery (CSRF). Which approach should the tester use to exploit this vulnerability?","o":["Execute a directory traversal attack to access restricted server files","Create a malicious website that sends a crafted request on behalf of the user when visited","Perform a brute-force attack on the application's login page to guess weak credentials","Inject a SQL query into the input fields to perform SQL injection"],"a":[1],"e":"CSRF 發生在一個弱勢應用程式處理未經授權的狀態變化請求時，因為它沒有核實請求是否是經認證的使用者有意發起的。CEH v13 解釋說，弱點利用涉及欺騙登入使用者不知不覺地執行一個已設計的 HTTP 請求--通常是透過惡意網頁、隱藏格式提交、嵌入式影象標記或 JavaScript 觸發器。 當被害者存取攻擊者控制頁面時，瀏覽器會自動包括使用者的活動工作階段 cookie，允許伺服器將被偽造的請求視為合法。 這一技術是 CSRF 攻擊的核心，被 CEH 課程強調為正確的開發路徑。目錄 traversal， SQL 注入， 和暴力破解攻擊針對不同的弱點， 並且不利用缺失的請求真實性驗證。 CSRF 開發的關鍵要求是使用者透過惡意外部資源進行互動， 使選項 B 成為正確的 符合 CEH 方法。"},{"n":338,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a stealth assessment, an attacker exploits intermittent delays in ARP responses from a target system. By injecting fake ARP replies before legitimate ones, the attacker temporarily redirects traffic to their own device, allowing intermittent packet capture. What type of sniffing attack is occurring?","o":["Passive sniffing on a switched network","Duplicate IP conflict resolution attack","Switch port stealing via timing-based ARP spoofing","ARP poisoning for MiTM interception"],"a":[2],"e":"CEH 教導說，以 ARP 為基礎的攻擊在複雜度上有所不同，從基本中毒到更專業的技術，如交換器連接埠偷竊。 在 ARP欺騙防禦或檢查工具限制傳統攻擊的環境中， 攻擊者可能利用 ARP 回覆行為中的計時弱點。 交換器連接埠透過在正確時刻--在目標主機的合法 ARP 回覆之前--準確傳送偽造的 ARP 回覆來竊取作品，導致交換器的 CAM 表臨時更新並連線目標sIP 位址與攻擊者的 MAC 位址。 CEH 強調交換器信任最新的 ARP 更新， 因此，即使是短暫的計時 windows 允許部分的封包擷取。這與完全持續的 ARP 欺騙(持續覆蓋 ARP 表格)和被動的嗅探(無法捕捉)不同。單播在切換網路上的流量。當 ARP 欺騙依靠機會性計時而非全桌中毒來緩解時，這種攻擊特別有用。 被擷取的封包與 CEH 對交換器連接埠偷竊行為的描述相匹配的間歇性質。"},{"n":339,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"Packet fragmentation is used as an evasion technique. Which IDS configuration best counters this?","o":["Recognizing regular fragmented packet intervals","Anomaly-based IDS detecting irregular traffic patterns","Rejecting all fragmented packets","Signature-based IDS detecting fragmented packet signatures"],"a":[1],"e":"封包破碎是 CEHv13 網路與邊界入侵中一種記錄齊全的 IDS 逃生技術。 攻擊者碎片封包透過壓倒性或混淆性的入侵探測系統來逃避探測，特別是那些依賴於簡單圖案匹配的系統。 CEH v13 解釋道，以異常為主的 IDS 系統對封包分解等逃逸技術特別有效，因為它們分析偏離了正常的網路行為，而不是依賴靜態的簽名。 Flagmented 封包經常產生異常的流量模式，異常的封包大小，或者不規則的再組裝行為，而以異常為主的系統是用來偵測的。基於簽名的 IDS 解決不成體系問題因為攻擊者可以將惡意有效酬載分出多個 封包， 繞過預定義的簽名。 拒絕所有被打碎的 封包(選項 C) 不切實際。 並且可能破壞合法網路通訊， 由於分解是 TCP/IP 網路的正常部分。確認定期間隔(可選 A)是不可靠的，因為攻擊者可以隨機地將封包計時。 CEH v13 明確建議基於異常的偵測來對抗先進的逃逸技術。因此，選項 B 是最有效的和 CEH-對齊的IDS 設定。"},{"n":340,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"As part of a quarterly security review at EvoTrans Logistics, a global freight optimization firm, you have been brought in as a senior cybersecurity analyst to audit perimeter firewall configurations across cloud-hosted application clusters. During your investigation, you notice that TCP port 1433 is open on a virtual machine tagged as svc-node-east-14, which was provisioned by a now-defunct third-party vendor. The node is not referenced in any current infrastructure diagrams, yet live traffic logs suggest it is still handling requests during peak hours. No documentation exists regarding its service role, but you are tasked with flagging misconfigurations that may violate policy or expose critical services unnecessarily. Based on your understanding of standard port assignments, you must determine what service this port likely represents and whether its exposure warrants escalation. Which of the following services is most likely running on this port and requires immediate review?","o":["sqlsrv","SqlNet","ms-sql-s","ms-sql-m"],"a":[2],"e":"TCP 連接埠 1433 是 Microsoft SQL 伺服器的知名預設連接埠，正式註冊為 ms-sql-s。 在 CEH 網路和周邊安全覆蓋中，透過預設連接埠任務識別服務是一種關鍵的偵察和防禦技能。 在審查防火牆規則和被曝光服務時，分析師將開放埠與其相關協定聯絡起來以確定風險暴露。 連接埠 1433 被廣泛認為是 Microsoft SQL 伺服器被設定為預設設定的主聽連接埠。由於資料庫服務經常儲存敏感的業務或客戶資料，所以在連接埠 1433 上存在一個處理流量的無證虛擬機器尤其令人關切。如果不必要地暴露，SQL 伺服器可以針對暴力破解認證攻擊、SQL 注入弱點利用、設定錯誤虐待、或利用未標的弱點。CEH 材料強調，除非絕對有必要，資料庫服務不應直接被網路所暴露，必須受到嚴格的接入控制、分化、加密和監測的保護。選項 B，SqlNet，一般指 Oracle 資料庫通訊於連接埠 1521。 選項 D，ms-sql-m，與 SQL 伺服器瀏覽器服務於UDP1434,而非 TCP1433。 選項 A，sqlsrv，不是連接埠 1433 的正式 IANA-註冊服務名稱。 由於 ms-sql-s 是 TCP 連接埠 1433 上的 Microsoft SQL 伺服器的標準稱謂，並鑑於暴露資料庫服務的風險，這一發現值得立即升級和審查。","s":"term"},{"n":341,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"A corporation migrates to a public cloud service, and the security team identifies a critical vulnerability in the cloud provider's API. What is the most likely threat arising from this flaw?","o":["Distributed Denial-of-Service (DDoS) attacks on cloud servers","Unauthorized access to cloud resources","Physical security compromise of data centers","Compromise of encrypted data at rest"],"a":[1],"e":"CEH 雲端運算模組將雲 API 確定為公共雲環境中最關鍵的攻擊表面之一。 APIs 控制提供，設定，認證，並管理雲資源。雲 API 中的弱點可以使攻擊者:副證認證升級權限存取或修改雲資源建立或刪除服務因此，選項 B 是正確的。選項 A 涉及可用性，而不是 API 缺陷。選項 C 由提供者管理，與 API 無關。選項 D 需要關鍵的妥協，而不僅僅是 API 的弱點。CEH 大力強調 API 安全性為上層雲層風險。"},{"n":342,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"short","q":"An attacker, using a rogue wireless AP, performed an MITM attack and injected an HTML code to embed a malicious applet in all HTTP connections. When users accessed any page, the applet ran and exploited many machines. Which one of the following tools the hacker probably used to inject HTML code?","o":["Wireshark","Aircrack-ng","Ettercap","Tcpdump"],"a":[2],"e":"正確答案是 C。 Ettercap。 Ettercap 是一個被 CEH 無線和網路攻擊概念所頻繁覆蓋的有名的中間人(MITM)攻擊框架，它支援 ARP 欺騙，流量擷取，封包操縱，內容過濾，和 HTTP 注入，使其能夠修改過境的網路流量。在情境中，攻擊者建立了無賴無線存取點並攔截了使用者的 HTTP 流量。 透過將自己定位在被害者和目的地網站之間，攻擊者可以修改HTTP 回應並注入含有 Java 小程式或指令碼的惡意 HTML 程式碼。 Ettercap 包括過濾能力，允許攻擊者在到達被害者之前更改網頁，使其成為這次攻擊的最合適的工具。其他選項不太合適。 Wireshark 和 Tcpdump 是 封包擷取， 並具有以下特性: 和主要用於監測網路流量的分析工具， 非用於修改空中流量保障中心(Aircrack-ng)側重於無線安全評估任務。 諸如封包擷取， 無線 偵察， 並破解出 WEP/WPA 鍵， 但是它的設計不是用於 HTTP 內容注入。 CEH 應試提示:Ettercap = MITM + ARP 欺騙 + 流量操縱 + HTTP/HTML 注入。","s":"tool"},{"n":343,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"During a targeted phishing campaign, a malicious HTML attachment reconstructs malware locally using obfuscated JavaScript without making external network calls, bypassing firewalls and IDS inspection. Which evasion technique is being employed?","o":["HTML smuggling","Port forwarding","Cross-site scripting","HTTP header spoofing"],"a":[0],"e":"CEH v13 強調 HTML 走私是一種現代技術，透過利用瀏覽器-側執行來繞過周邊防禦。 與其直接下載惡意軟體檔案-- 它可以被防火牆和 IDS 偵測到-- 一個攻擊者在附件內嵌入了被矇蔽的 JavaScript 或 HTML。 被害者開啟檔案後，瀏覽器會使用 Blob 或 URL 等 API 在當地重建酬載。 create ObjectURL。 這種方法避免了酬載建立階段的外接網路傳輸，使其能繞過內容過濾器，沙箱和內接檢查工具。 CEH 強調 HTML 走私特別危險，因為它在瀏覽器環境中執行，安全電器暗中信任。連接埠轉發 (可選 B) 與地道流量有關， XSS(可選 C) 需要將指令碼注入網頁，不傳送惡意軟體。 HTTP header 欺騙(可選 D) 操縱請求後設資料，而不是 酬載 構造。 因此， HTML 走私完全匹配所描述的行為。","s":"term"},{"n":344,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"Which action would most effectively increase the security of a virtual-hosted web server?","o":["Implement LAMP architecture","Change IP addresses regularly","Regularly update and patch server software","Move document root to another disk"],"a":[2],"e":"根據 CEH v13Web 應用程式和伺服器安全，定期修補程式和更新是減少伺服器攻擊表面的最有效方式。 網路伺服器中的脆弱度，代理性和輔助性服務如果修補程式被延遲，經常被利用。雖然建築選擇和目錄設定影響組織，但並不能減輕已知的弱點。 改變 IP 位址並不能防止被利用，而移動目錄並不能解決基本的軟體缺陷。 CEH v13 始終強調修補程式管理為主要防禦控制，因此，選項 C 是正確的。"},{"n":345,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During an external assessment, a security analyst configures Nmap so that the hardware address recorded in firewall logs differs from the original interface address of the scanning system. Repeated executions of the scan show that the recorded hardware address changes automatically each time. What Nmap option enables this behavior?","o":["--spoof-mac 0","--spoof-mac Dell","--spoof-mac 00:01:02:25:56:AE","--spoof-mac Dell 10.10.1.11"],"a":[0],"e":"正確答案是 A。 --spoof-mac0。 Nmap 支援 MAC 位址欺騙作為防火牆-外向的外向 和掃描-模糊選項。可用的參考材料列出了 Nmap 防火牆逃逸選項 並識別出--spoof-macmac，作為用於 spoop MAC 位址 的選項。 0 值告訴 Nmap 生成一個隨機的 MAC 位址。 因為問題表明錄入的硬體位址每次都會自動改變，所以隨機的 MAC 選項是正確的匹配。選項 B。--spoof-mac Dell 不正確 因為這選擇一個與特定銷售商字首相聯的 MAC 位址， 不是描述的完全隨機的行為。選項 C。--spoof-mac 00:01:02:25:56:AE 不正確 因為它使用固定的 MAC 位址。 重複掃描會顯示相同的偽造的位址， 一次不是新來的 D。 --spoof-mac Dell 10.10.1.11 選項不正確 因為它不是此行為的正確 Nmap 選項格式。因此， 最好的答案是 A。--spoof-mac 0。 answer。","s":"tool"},{"n":346,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"As part of an internal security assessment at First Union Bank in Chicago, Rachel Morgan is evaluating whether unauthorized packet capture tools are operating within the loan processing segment of the network. During traffic observation, she notices behavior suggesting that a particular host may be processing frames beyond its intended destination scope. To verify whether the network interface is accepting traffic not explicitly addressed to it, Rachel decides to transmit specially crafted packets designed to provoke an abnormal response from a system operating in promiscuous mode. Which detection technique should Rachel use to confirm the presence of a sniffer?","o":["DNS method by monitoring reverse DNS lookup traffic","Sniffer detection using an NSE script to check for promiscuous mode","Ping method by sending packets with an incorrect MAC address","ARP method by sending non-broadcast ARP requests"],"a":[2],"e":"正確答案是 C 平法，即用不正確的 MAC 位址.x 傳送封包。題目描述測試網路介面卡是否正在處理 封包， 並非它打算處理的。 這正是套期模式所做的。 在套期模式中， NIC 接受訊框， 即使它們沒有被傳送到自己的 MAC 位址。 CEH 嗅探材料解釋道，平正法透過向犯罪嫌疑人 IP 位址傳送 ping 請求來探測封包嗅探器，並帶有偽造的 MAC 位址選項 A。 DNS方法不正確，因為該情境沒有描述反向 DNS 的取景行為。選項 B。 NSE 指令碼在某些情況下可用於多端-模具偵測，但問題具體描述了用於測試接受沒有傳送到主機的流量的所設計的封包。選項 D。 ARP 方法是另一種嗅探偵測方法，但它依賴於非廣播 106 快取行為。 情境的用詞最直接地匹配了 ping 方法的不正確或偽造的 MAC 位址。因此，最好的答案是C 平法，即用不正確的 MAC 位址傳送封包。"},{"n":347,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"While reviewing exposed infrastructure for a logistics company in Denver, Joe, a security analyst, identifies that one host is synchronizing time using UDP port 123. Probing further, he issues queries to extract details about peers, offsets, and delays. This allows him to gather internal hostnames and client IP addresses connected to the time server. Such information leakage could provide insight into the company ' s internal network structure. Which technique was most likely used to obtain this information?","o":["DNS Zone Transfer Enumeration","NTP Enumeration","VoIP Enumeration","NetBIOS Enumeration"],"a":[1],"e":"正確答案是 B。 NTP 列舉，因為通常執行在 UDP 連接埠的網路時間服務(Network Time 協定 (NTP))中的指標和獲得的資料匹配了列舉，在符合 CEH 偵察和列舉概念中，攻擊者經常列舉可幫助後續攻擊的已曝光服務來學習設定和內部細節。當 NTP 從不信任的網路可以被接通，並且被錯設定(或支援某些查詢模式)時，它可以洩露伺服器的同位素，同步狀態，以及抵消和延遲等操作度量標準的資訊--準確的說就是情境中描述的屬性。提示還註明了 Joe 可以蒐集與時間伺服器相連線的內部主機名稱和使用者端 IP 位址，這與 NTP 如何揭示關聯的系統和關係是相一致的:時間伺服器往往有多個內部用戶端，上游同行，或設定的關聯。 暴露 per/association 資訊的查詢可以無意中披露內部命名慣例，IP 位址範圍，以及網路結構 - - 對進行繪圖和目標選擇的攻擊者來說是有價值的情報。 此外，時間基礎設施常常是集中的，因此，列舉它可以提供集線器類似環境的視角。為何其他選項不正確:DNS 區轉移列舉與 DNSAXFR 相關，一般會輸出子域和 M/CNAME 條目等DNS 記錄-不是 NTP 同齡人/offsets/delays 123。 VoIP 列舉針對不同埠的電話協定和服務(如 SIP)，不會以時間同步度量衡為中心。 NetBIOS 列舉涉及埠 137-139 並返回 NetBIOS 名稱和工作階段資訊，而不是 NTP 運算元據。因此，用於從UDP/123 時間伺服器取得對等，抵消，延後，並連線到使用者端細節的技術是 NTP 列舉。","s":"term"},{"n":348,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"Clark is a talented coder and as such has found a vulnerability in a well-known application. Unconcerned about the ethics of the situation, he has developed an exploit that can leverage this unknown vulnerability. Based on this information, which of the following is most correct?","o":["Clark has violated U.S. Code Section 1027.","Clark has developed a zero-day.","Clark is a suicide hacker.","Clark is a white hat hacker."],"a":[1],"e":"正確答案是 B，因為情境描述了在眾所周知的應用中未知的弱點，以及為了槓桿作用而創造的利用。 在 CEH 術語中，當一個缺陷尚未被公之於眾或尚未開發出修補程式/fix 時，就存在零時差弱點/exploit；這種弱點特別危險，因為受影響的系統一直暴露在外，直到有修補程式或補償控制可用。 指南還將弱點利用定義為利用弱點的一種方法，可能允許未經授權的存取。 克拉克沒有被正確歸類為白帽駭客，因為道德駭客需要防禦意圖和事先授權；白帽使用技能進行防禦目的，而道德駭客則得到法律/書面許可並報告調查結果。 他也不被最好地描述為自殺式駭客，因為這個詞指攻擊者的目標是在不擔心懲罰的情況下摧毀關鍵基礎設施。 因此最精確的 CEH 答案是克拉克開發出零時差的弱點利用。"},{"n":349,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"Under the neon glow of Seattle ' s skyline, ethical hacker Elena Vasquez slips into her role as a cybersecurity consultant for Cascade Financial ' s online banking platform. Tasked with probing the web server ' s defenses, Elena simulates a series of rapid login attempts to the admin portal. She notes that the system allows unlimited tries without locking the account, exposing a gap that could invite relentless password-guessing attacks. Determined to safeguard the bank ' s assets, Elena drafts a recommendation to fortify the server ' s authentication process against such threats. What countermeasure should Elena recommend to strengthen Cascade Financial ' s web server against the vulnerability identified?","o":["Implement 2FA or MFA","Force users to periodically change passwords","Use CAPTCHA challenges on login and registration pages","Use strong, one-way hashing algorithms such as bcrypt, scrypt, or Argon2"],"a":[2],"e":"所描述的弱點是一個經典的線上密碼-猜疑條件:應用程式允許無限認證嘗試，而無需任何節奏，鎖定，或挑戰機制。 在CEH 引導中，這種曝光可以使野蠻力量攻擊和自動的認證資訊充入，攻擊者可以快速測試許多密碼或再用認證資訊對直到成功。 Web 應用程式層上一個實用和常被推薦的控制正在為登入工作流程增加 CAPTCHA 的挑戰，特別是在少數嘗試失敗或發現異常行為後。 CAPTCHA 透過強迫人間互動來增加自動化成本，直接打亂了針對管理員入口網站的高速指令碼猜測。雖然執行 MFA 是一項出色的額外保障，並大力鼓勵享有特權的准入，但問題要求採取最佳的反措施，以解決無限制的快速嘗試這一具體問題。 CAPTCHA 是對自動登入濫用的直接緩解，而 CEH 通常將其與速率限制，漸進延遲，以及帳戶關閉等政策相配。 週期密碼的改變並不妨礙攻擊者猜測今天的密碼，而 CEH 的材料指出，如果驅動可預見密碼模式，強制旋轉甚至可以降低安全性。 強烈的密碼雜湊，如 bcrypt， scrypt， 或 Argon2,對於保護所儲存的密碼至關重要， 如果一個資料庫被損壞， 但它不會停止線上對登入形式本身的猜測。 因此， 識別出的弱點的最合適的對應措施是在登入和註冊頁面上使用 CAPTCHA 挑戰， 最好與節奏和鎖定相結合，以加強深度防禦。"},{"n":350,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"A penetration tester has gained access to a target system using default credentials. What is the most effective next step to escalate privileges on the system?","o":["Perform a denial-of-service (DoS) attack to crash the system","Use a known local privilege escalation vulnerability to gain admin access","Execute a Cross-Site Scripting (XSS) attack on the system ' s login page","Use a dictionary attack to brute-force the root password"],"a":[1],"e":"初始存取一旦獲得--特別是透過弱或預設的認證資訊--CEH 系統黑入方法引導測試者繼續使用權限提升。 目的是提升使用者級存取行政或系統級權限，使攻擊者能夠進行安裝等不受限制的行動。工具，修改設定，存取被保護檔案，並橫向地嚮導。 CEH 材料強調使用權限提升的弱點，如設定錯誤的服務，核心開發，未被標註的本機權限提升缺陷，檔案權限薄弱，以及象徵性的冒用。 阻斷服務攻擊是適得其反的，不支援開發後的目標。 XSS 是一個 Web 應用程式攻擊向量，與作業系統特權操縱無關。 因此，利用已知的本機權限提升弱點是合適的 CEH 對齊下一步。"},{"n":351,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During a penetration test for a U.S.-based retail company, John gains access to a secondary server that responds unusually to structured queries. By sending a specially crafted request, he receives a full list of subdomains, MX records, and aliases belonging to the target organization. The response exposes sensitive internal mappings that could be leveraged for further attacks. Which tool was MOST likely used to perform this enumeration?","o":["smtp-user-enum.pl -u user -t host","ldapsearch -h -x","nbtstat -A","dig @server axfr"],"a":[3],"e":"最可能的工具/command 是 dig@伺服器 axfr，它試圖從指定的 DNS 伺服器進行 DNS 區傳輸(AXFR)。 在 CEH-aced 偵察和列舉方法中，DNS 是一個高值的目標，因為它揭示了一個組織的名稱對映到系統的方式。 成功的區劃可以暴露出整個 DNS 區資料庫，經常包括主機名稱(subdomain)，郵件交換器(MX)記錄，犬名(CNAME)別名等，如果區劃錯，有時還會有內出場的條目。 情境的結果--接收\"子域完整清單，MX 記錄和別名\"--精確的匹配 AXFR 區轉移在 DNS 伺服器設定不當允許向未經授權的主機轉移時能夠披露的。關於\"二級伺服器\"的線索也意義重大。 在 DNS 架構中，組織經常部署一級(主)和二級(奴隸)DNS 伺服器。 二級伺服器合法地請求主機進行分割槽傳輸以保持同步。 如果二級伺服器的設定有誤(例如允許 AXFR)。攻擊者可以利用這個方法並擷取區域檔案。這導致在組織的命名計劃和基礎設施佈局中能有詳細的能見度，這些資訊可用於識別高值目標(郵件伺服器、VPN 入口網站、管理員主機)、定位中轉站點以及規劃後續攻擊，如認證資訊收割、定向開發或社交工程等。為什麼其他選項不合適: smtp-user-enum.pl 用於在 SMTP 伺服器上列出有效的使用者，而不是 DNS 記錄。 ldapsearch 將目錄資訊從 LDAP 服務中列出，而不是 DNS 區域。 nbtstat -A 查詢 NetBIOS 名稱表用於 Windows 主機，這些使用者可能顯示本機名稱和共享，但不顯示 DNS-。寬子域和 M/CNAME 記錄。因此，所描述的列舉 與使用 AXFR 的挖掘的 DNS 區傳輸最相符合。","s":"tool"},{"n":352,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"A DevOps engineer at a Toronto-based SaaS provider deploys a multi-tenant application within a shared orchestration environment. During a security assessment, a penetration tester discovers that a compromised workload is able to access host-level system resources and interact with adjacent workloads beyond its intended isolation controls. Further investigation reveals that the workload was launched with elevated privileges and insufficient runtime restrictions, allowing the attacker to cross the intended isolation boundary and gain unauthorized access to the underlying infrastructure. Which cloud attack technique best describes this security weakness?","o":["Man-in-the-Cloud Attack","Side-Channel Attack","Container Escape","Golden SAML Attack"],"a":[2],"e":"正確答案是 C。 集裝箱出逃。設想題目描述的是，集裝箱內的工作量從預定的隔離界限中突破，進入了主機級資源或相鄰的工作量，這是集裝箱出逃的決定性行為。 符合 CEH 雲和虛擬化材料解釋道，集裝箱化可能受集裝箱破解/leaks 的影響，攻擊者可能在同一主機上擅自進入其他容器，導致權限提升和資料洩漏。備選 A。 Man-in-the-Cloud 攻擊是不正確的，因為攻擊濫用雲同步訊號或雲帳戶存取機制，而不是容器隔離界限。選項 B。 側通道攻擊是不正確的，因為側通道攻擊間接推斷出敏感資料透過共享資源行為，計時，快取，或其他間接訊號。選項 D。 Golden SAML 攻擊是不正確的，因為Golden SAML 涉及使用被竊的身分提供者簽名材料來偽造 SAML 認證斷言。因此，最好的答案是 C.集裝箱出逃。","s":"term"},{"n":353,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"A web server was compromised through DNS hijacking. What would most effectively prevent this in the future?","o":["Changing IP addresses","Regular patching","Implementing DNSSEC","Using LAMP architecture"],"a":[2],"e":"DNS 劫持發生在攻擊者操縱 DNS 回應將流量重定向到惡意伺服器時。 CEH v13 明確識別出 DNSSEC(網域名稱系統安全擴充套件)作為防範此類攻擊的首要防禦。 DNSSEC 在 DNS 記錄中新增加密簽名，使用戶端能夠驗證真實性和完整性。DNS 回應中。沒有 DNSSEC，即使伺服器已完全補齊，攻擊者也可以對 DNS 回應作假。更改 IP 位址並使用 LAMP 不處理 DNS 信任。 修補程式是必需的， 但不能阻止 DNS 欺騙。 CEH v13 明確建議 DNSSEC 用於防止快取中毒和 DNS 劫持攻擊，使選項 C 成為正確答案。"},{"n":354,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"Steve, an attacker, created a fake profile on a social media website and sent a request to Stella. Stella was enthralled by Steve ' s profile picture and the description given for his profile, and she initiated a conversation with him soon after accepting the request. After a few days, Steve started asking about her company details and eventually gathered all the essential information regarding her company. What is the social engineering technique Steve employed in the above scenario?","o":["Honey trap","Diversion theft","Piggybacking","Baiting"],"a":[0],"e":"正確答案是 A。 Honey 陷阱。 在 CEH 社交工程概念中，蜂蜜陷阱是一種技術，攻擊者在社交媒體或約會平台上創造出一個有吸引力的假身分，與目標建立情感上的信任。 攻擊者然後滲透這種信任來擷取敏感的個人，公司，或安全相關資訊。在這種情境下，史蒂夫創造了一個假的社交媒體簡介，並用一個有吸引力的簡介圖片和描述來吸引斯黛拉，一旦斯黛拉接受了請求並開始與他溝通，斯黛拉就逐漸問起她公司的問題並蒐集了重要的組織資訊。 這與蜂蜜陷阱方法相匹配，因為攻擊者使用取景，信任和操縱來取得機密資訊。選項 B， 轉移性盜竊， 涉及將交貨或資訊重定向到錯誤的地點。 選項 C，抓回， 是指透過追蹤被授權的人獲得物理存取。 選項 D， 誘餌， 使用誘餌物件或提議， 如被感染的 USB 介質來引誘受害者。 因此， 最好的答案是\"蜂蜜陷阱\"。","s":"term"},{"n":355,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"long","q":"During an internal investigation at a healthcare billing firm in Denver, Colorado, the security team analyzes suspicious activity involving a senior accountant's corporate smartphone. The user reports that the device behaved normally and that no links were clicked or applications installed during the timeframe in question. Telecom monitoring reveals that the device received several binary-formatted SMS messages shortly before the incident. These messages were not visible in the messaging application. Within minutes of receiving them, the phone began transmitting cellular location identifiers and device-related data to an unfamiliar external system. The transmissions occurred automatically and did not require any user interaction. Which mobile attack technique most accurately explains this behavior?","o":["Call Spoofing","OTP Hijacking","SMiShing","SIMjacker"],"a":[3],"e":"正確答案是 D。 SIMjacker.。 SIMjacker 是一種移動攻擊技術，使用專門設計的以 SIM-card 功能為目標的二進位 SMS 訊息，歷史上與 S@T 瀏覽器環境相關。攻擊可以觸發裝置動作而無需可見的使用者互動，包括蒐集位置或裝置資訊併傳送到攻擊者控制的目的地。設想方案稱裝置收到二進位格式的 SMS 訊息， 使用者看不到這些信件， 和電話自動傳送的蜂窩位置識別符 和裝置相關資料。這些是 SIMjacker 的最強指標。 符合 CEH 的行動裝置安全材料將基於 SMS-的攻擊和移動惡意軟體確定為常見的移動攻擊向量，並指出移動威脅可以從裝置中竊取個人和敏感資料。選項 A。 呼叫欺騙是不正確的，因為攻擊不涉及偽造呼叫者 ID。選項 B。 OTP 劫持是不正確的，因為情節不涉及偷取一次性密碼。選項 C。SMIShing 是不正確的， 因為 SMIShing 需要一個欺詐性的文字資訊， 旨在欺騙使用者點選或回應。 在此， 沒有發生使用者互動。選項 D。 SIMjacker 是正確的，因為隱形二進位 SMS 訊息觸發了自動裝置資料傳輸。因此，最好的答案是 D。SIMjacker。","s":"term"},{"n":356,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a security audit, a penetration tester observes abnormal redirection of all traffic for a financial institution's primary domain. Users are being redirected to a phishing clone of the website. Investigation shows the authoritative DNS server was compromised and its zone records modified to point to the attacker's server. This demonstrates total manipulation of domain-level resolution, not cache poisoning or client-side attacks. Which technique is being used in this scenario?","o":["Establish covert communication using DNS tunneling over standard DNS queries","Perform DNS rebinding to manipulate browser-origin interactions","Carry out DNS server hijacking by tampering with the legitimate name-resolution infrastructure","Initiate a DNS amplification attack using recursive servers"],"a":[2],"e":"CEH v13 宣告，在攻擊者妥協權威的 DNS 時發生 DNS 伺服器劫持事件。基礎設施並更改 DNS 區域記錄， 將所有合法查詢重定向到惡意目的地。 與暫時影響特定解析器的 DNS 快取 中毒不同， 伺服器劫持操縱了控制域的核心 DNS 權威。CEH 強調，這種攻擊可能導致大規模認證資訊盜竊、釣魚、財務欺詐和工作階段妥協，因為攻擊者呈現一個相同的克隆站點，同時保留對 DNS 路由的充分控制。 DNS 隧道用於暗中資料過濾，不改變流量方向。 DNS 重新約束目標瀏覽器政策， 不是全域的 DNS 重定向。 DNS 放大是和分割槽操縱無關的卷式 DDoS 技術。 情境完全匹配 DNS 伺服器劫持。"},{"n":357,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A municipal services portal in Lexington, Kentucky includes a search parameter that retrieves citizen service requests. During an authorized security review, an analyst alters the parameter value by introducing single quotation marks, logical expressions such as AND 1=1, and variations like AND 1=2, observing how the application responds to each modification. By comparing differences in the application's output and behavior after each structured input change, the analyst evaluates whether the parameter affects the underlying query processing. Which SQL injection detection method is being applied?","o":["Static Testing","Dynamic Testing","Function Testing","Fuzz Testing"],"a":[1],"e":"正確答案是 B。 動態測試。分析師正在與執行中的應用程式進行互動，傳送結構化的測試輸入，並觀察活動回應差異。這是動態測試。有效酬載不是隨機的；而是旨在確定使用者控制的輸入是否影響後端 SQL 邏輯的故意 SQL 注入探測器。 符合 CEHSQL 注入材料解釋道，測試者可以透過提交單引號等輸入來識別 SQL 注入，並觀察錯誤或行為差異是否出現。它還引用了 ' OR 1=1-- 等測試輸入，以確定應用是否脆弱。 CEH 材料進一步解釋道: SQL 注入 弱點偵測包括將程式碼注入輸入欄位和觀察回應，錯誤資訊， GET/POST 值， cookie， 和字串值。選項 A。 靜態測試是不正確的，因為靜態測試不執行應用程式就審查原始碼或設定。選項 C。 函式測試不正確，因為目的不是普通特性驗證；而是查詢行為的安全測試。選項 D。 模糊測試是不正確的，因為模糊通常涉及傳送大量隨機或出乎意料的輸入。 情境使用有針對性的 SQL 邏輯測試。因此，最好的答案是 B.動態測試。","s":"term"},{"n":358,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"A system administrator observes that several machines in the network are repeatedly sending out traffic to unknown IP addresses. Upon inspection, these machines were part of a coordinated spam campaign. What is the most probable cause?","o":["Keyloggers were harvesting user credentials","Devices were enslaved into a botnet network","Browsers were redirected to adware-injected sites","Worms exploited zero-day vulnerabilities"],"a":[1],"e":"CEH 將 botnet 定義為被遠端控制的受損害機器網路，以進行 DDoS 攻擊，垃圾郵件運動等協調活動，並進行認證資訊盜竊。 顯示出行連線未知的 IPs 並參與大規模垃圾郵件傳播的系統是殭屍網路感染的特徵指標。"},{"n":359,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"In the sunlit tech oasis of Phoenix, Arizona, ethical hacker Nadia Patel explores the security posture of LearnSphere, a U.S.-based e-learning platform serving thousands of students. During her testing, Nadia intentionally submits invalid inputs to the platform ' s content delivery system. Instead of returning a generic failure notice, the application responds with detailed system information, including database query strings and directory paths. Such responses provide attackers with valuable insights into the application ' s internal workings, which could be used to craft more precise and damaging attacks. Which issue is being demonstrated?","o":["Improper Error Handling","Directory Traversal","Verbose Error Messages","CORS Misconfiguration"],"a":[2],"e":"描述的問題是動詞錯誤訊息，一個應用程式在處理無效輸入時會顯示過多的技術細節。 情境宣告，平台返回\"詳細系統資訊，包括資料庫查詢字串和目錄路徑\"，而不是通用錯誤。 Exponing internal paths and complotion 字串是動詞處理出錯的一種常見症狀:當例外處理設定錯誤或在生產中啟用除錯設定時，堆疊痕跡，SQL 語句，檔案系統位置，框架版本，以及設定提示等都可以在回應中出現。這些細節對攻擊者很有價值，因為它們減少了猜測工作。 目錄路徑可以揭示作業系統，部署佈局，以及敏感的檔案位置；資料庫查詢字串可以揭示表格/列名和查詢結構，從而可以更有效地提供 SQL 注入有效酬載或定向資料擷取。 Verbose 錯誤還可以洩露使用者名稱，內部主機名稱，API 端點，甚至如果處理不當，也會洩露秘密。 即使初始無效請求不影響系統，被洩露的資訊也能大大提高攻擊者以更精確的方式來設計後續攻擊的能力。為什麼其他選項不準確:不當錯誤處理(A)是一個更寬泛的類別，可能包括動詞錯誤，但問題的最佳匹配是具體症狀:詳細的內部資訊披露。 Directory traversal (B) 涉及操縱路徑輸入以存取未經授權的檔案；在這裡，應用程式是因出錯而揭示路徑，而不是被強迫去讀取任意檔案。 CORS 設定錯誤 (D) 涉及跨源瀏覽器存取控制，與漏出堆疊痕跡或資料庫查詢無關。因此，正確答案是 C。 Verbose Error Messages。","s":"term"},{"n":360,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"You have been asked to perform a penetration test for a local company. You have had several meetings with the client and are now almost ready to begin the assessment. Which of the following is the document that would contain verbiage which describes what type of testing is allowed and when you will perform testing and limits your liabilities as a penetration tester?","o":["Project scope","Nondisclosure agreement","Service-level agreement","Rules of engagement"],"a":[3],"e":"正確答案是 D，\"接戰規則\"。 在 CEH\"接戰前\"概念中，接戰規則檔案在任何測試開始前就定義了穿入測試的授權邊界。 它規定了允許何種測試技術，哪些系統或網路可以測試，何時可能發生測試，禁止何種行動，在緊急情況下與誰接觸，以及如何處理服務中斷等事件，它還有助於保護滲透測試人員，將使用者端的批准記錄下來，並在測試者在商定的界限內行事時限制責任。 專案範圍可以列出目標，IP 範圍，應用程式，或包含在測試中的企事業單位，但並不完全涵蓋操作權限和不披露協定本身保護在業務約定過程中發現的機密資訊，服務級協定界定了服務預期，如上下班時間、回應時間或支援義務，因此，最符合允許測試、時間安排和測試者賠償責任限額的檔案是業務約定規則。","s":"term"},{"n":361,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"Which technique is least useful during passive reconnaissance?","o":["WHOIS lookup","Search engines","Social media monitoring","Nmap scanning"],"a":[3],"e":"被動偵察涉及不直接與目標互動而蒐集資訊。 WHOIS，搜尋引擎，社交媒體都是被強調在 CEHv13 偵察中的被動技術。但是，Nmap 掃描會積極探測目標系統併產生可被記錄和偵測的流量，這使得它成為一種活動的偵察技術。因此，選項 D在被動階段最無用。","s":"tool"},{"n":362,"c":"密碼學","ce":"Cryptography","t":"short","q":"A cybersecurity company wants to prevent attackers from gaining information about its encrypted traffic patterns. Which of the following cryptographic algorithms should they utilize?","o":["HMAC","RSA","DES","AES"],"a":[3],"e":"根據 CEH 密碼學模組，強大的對稱式加密演算法對於保護資料保密和模糊流量內容至關重要。 AES (Advanced 加密Standard)是被 NIST 批准並被 CEH 推薦用於加密中轉和休息時的資料的行業標準對稱式加密演算法。 AES 對密碼分析提供了強烈的阻力並阻止了攻擊者從加密流量中取得有意義的資訊。選項 D 是正確的，因為 AES 是高效的，安全的，並且得到廣泛實施。選項 A(HMAC)提供完整性和認證，而不是加密。選項 B (RSA)在計算上費用昂貴，不適於批次流量加密。選項 C(DES)因鍵長弱而貶值。 CEH 材料明確推薦 AES 凌駕於遺產演算法之上。","s":"term"},{"n":363,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"short","q":"Which attack targets WPA WPS PIN?","o":["Wireshark","Reaver","Aircrack","Kismet"],"a":[1],"e":"正確答案是 B，， Reaver。 Reaver 是著名的無線攻擊工具，用於瞄準 Wi-Fi 被保護的設定， 特別是 WPSPIN 機制，在無線駭客中， WPSPIN 攻擊試圖恢復 或驗證 路由器的 WPS PIN，然後取得 WPA/WPA2 預共享金鑰的存取權。 這和普通的 WPA119 裂縫不同 攻擊者通常抓取認證握手 詞典 或暴力破解攻擊密碼。 CEH 無線打壓材料指出，WPA/WPA2 破解通常涉及捕獲 WPA/WPA2 認證流量。 使用工具 比如空心機 用於斷線 Kismet 主要用於無線發現/嗅探，。 和Wireshark 是一個封包分析器， 空氣裂縫與 WEP/WPA/WPA2 裂縫有關， 但不是特別 WPSPIN 攻擊。 專門瞄準WPA/WPSPIN 弱點的工具是 Reaver。","s":"tool"},{"n":364,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"During a penetration test at Cascade Financial in Seattle, ethical hacker Elena Vasquez probes the input handling of the company ' s web server. She discovers that a single crafted request is processed as two separate ones, allowing her to inject malicious data into the server ' s communicatio
