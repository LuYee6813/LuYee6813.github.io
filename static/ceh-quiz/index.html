<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CEH v13 練習題庫：英文原題與中文詳解，可依考試九大領域與題目長度篩選。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v9c0 7.5 5.1 12.6 12 14 6.9-1.4 12-6.5 12-14V7z' fill='%2312586E'/%3E%3Cpath d='M16 5.2 7 8.9v7.1c0 6 4 10.2 9 11.5 5-1.3 9-5.5 9-11.5V8.9z' fill='%23EBEFF3'/%3E%3Cpath d='M11 16.2l3.4 3.4L21 13' fill='none' stroke='%2312586E' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>CEH v13 分段題庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap">
<style>
:root{color-scheme:light dark;
  
  --bg:#EBEFF3; --surface:#FFFFFF; --surface-2:#F4F7F9; --sunk:#E1E7ED;
  --ink:#141E28; --ink-2:#3C4C5C; --muted:#68798A; --line:#CFD9E1; --line-2:#E3EAEF;
  --accent:#12586E; --accent-soft:#D9E9EE; --accent-ink:#0C3F50;
  --ok:#1F6F52; --ok-soft:#DCEEE4; --bad:#9E2F2A; --bad-soft:#F6E1DF;
  --warn:#7E5410; --warn-soft:#F2DFB8;
  --t1:#8FB6C8; --t2:#3E7F9B; --t3:#173F55;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 8px 24px -12px rgba(20,30,40,.18);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0D141B; --surface:#151F29; --surface-2:#1B2731; --sunk:#101922;
    --ink:#E6EDF3; --ink-2:#BAC8D4; --muted:#8798A8; --line:#2A3843; --line-2:#22303A;
    --accent:#5FA9C4; --accent-soft:#17323E; --accent-ink:#9CCBDC;
    --ok:#5FBE95; --ok-soft:#13301F; --bad:#E38B84; --bad-soft:#331817;
    --warn:#E2B368; --warn-soft:#3E2D12;
    --t1:#3D5D6C; --t2:#4E8FAB; --t3:#9BC7DA;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0D141B; --surface:#151F29; --surface-2:#1B2731; --sunk:#101922;
  --ink:#E6EDF3; --ink-2:#BAC8D4; --muted:#8798A8; --line:#2A3843; --line-2:#22303A;
  --accent:#5FA9C4; --accent-soft:#17323E; --accent-ink:#9CCBDC;
  --ok:#5FBE95; --ok-soft:#13301F; --bad:#E38B84; --bad-soft:#331817;
  --warn:#E2B368; --warn-soft:#3E2D12;
  --t1:#3D5D6C; --t2:#4E8FAB; --t3:#9BC7DA;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);}
.bar-in{max-width:1080px;margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:auto}
.brand b{font-size:15px;font-weight:700;letter-spacing:.02em}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.seg{display:flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:6px;
  font-size:13px;font-weight:500;color:var(--ink-2);transition:background .13s,color .13s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .ct{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.gauge{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.gauge i{width:3px;background:var(--line);border-radius:1px;display:block}
.gauge i:nth-child(1){height:5px}.gauge i:nth-child(2){height:8.5px}.gauge i:nth-child(3){height:12px}
.g1 i:nth-child(1){background:var(--t1)}
.g2 i:nth-child(1),.g2 i:nth-child(2){background:var(--t2)}
.g3 i{background:var(--t3)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lnk-classic{text-decoration:none;display:inline-flex;align-items:center}
.sel{background:var(--surface);color:var(--ink-2);max-width:190px;cursor:pointer}
.sel:hover{background:var(--surface-2);border-color:var(--muted)}
.sel.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.ic{padding:6px 11px;border:1px solid var(--line);border-radius:7px;font-size:13px;
  color:var(--ink-2);transition:background .13s,border-color .13s}
.ic:hover{background:var(--surface-2);border-color:var(--muted)}
.ic[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

/* ---------- progress rail ---------- */
.rail{height:3px;background:var(--sunk);position:sticky;top:57px;z-index:19}
.rail div{height:100%;background:var(--accent);width:0;transition:width .25s ease}

/* ---------- layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 90px;
  display:grid;grid-template-columns:minmax(0,1fr) 232px;gap:28px;align-items:start}
@media (max-width:880px){.wrap{grid-template-columns:1fr;padding-bottom:110px}}

/* ---------- question card ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);overflow:hidden}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:13px 22px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.qno{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--accent-ink)}
.cat{font-size:12px;color:var(--muted)}
.dot{width:3px;height:3px;border-radius:50%;background:var(--line);flex:none}
.snapbadge{font-size:11px;letter-spacing:.04em;color:var(--warn);
  background:var(--warn-soft);border-radius:20px;padding:2px 9px}
.flag{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:20px}
.flag[data-on="1"]{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.stem{padding:24px 22px 6px;font-family:var(--sans);font-weight:400;font-size:16.5px;
  line-height:1.82;color:var(--ink);max-width:66ch;white-space:pre-wrap;text-wrap:pretty}
.stem .k-sig{background:var(--accent-soft);color:var(--accent-ink);font-weight:500;
  border-radius:3px;padding:.05em .22em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.stem .k-dir{color:var(--warn);font-weight:700;border-bottom:2px solid var(--warn-soft)}
.stem .k-num{font-family:var(--mono);font-size:.9em;background:var(--sunk);color:var(--ink);
  border-radius:3px;padding:.1em .32em}
.stem .k-noise{opacity:.42}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:2px 22px 14px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:block;flex:none}
.opts{padding:16px 16px 18px;display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);
  transition:border-color .12s,background .12s;line-height:1.7}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--surface-2)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);font-size:12px;font-weight:600;flex:none;
  width:22px;height:22px;border-radius:5px;background:var(--sunk);color:var(--ink-2);
  display:grid;place-items:center;margin-top:2px}
.opt .tx{flex:1;min-width:0}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .k{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}

/* ---------- explanation ---------- */
.exp{border-top:1px solid var(--line-2);background:var(--surface-2);padding:0 22px;
  max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease}
.exp.open{max-height:none;padding:20px 22px 24px}
.exp h3{margin:0 0 10px;font-size:12px;font-family:var(--mono);font-weight:600;
  letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.exp .body{border-left:2px solid var(--accent);padding-left:16px;font-family:var(--serif);
  color:var(--ink-2);font-size:15.5px;line-height:2;white-space:pre-wrap;text-wrap:pretty}
.verdict{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;
  padding:5px 12px;border-radius:20px;margin-bottom:14px}
.verdict.y{background:var(--ok-soft);color:var(--ok)}
.verdict.n{background:var(--bad-soft);color:var(--bad)}
.verdict.r{background:var(--accent-soft);color:var(--accent-ink)}
.verdict b{font-family:var(--mono);font-weight:600}

/* ---------- nav ---------- */
.nav{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{padding:10px 18px;border:1px solid var(--line);border-radius:8px;font-size:14px;
  font-weight:500;background:var(--surface);transition:background .13s,border-color .13s}
.btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.keys{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);
  letter-spacing:.03em;font-variant-numeric:tabular-nums}
.keys em{font-style:normal;opacity:.72;margin-left:14px}
@media (max-width:640px){.keys em{display:none}}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:82px}
@media (max-width:880px){.side{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:15px 16px}
.panel h4{margin:0 0 12px;font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:13px}
.stat span{color:var(--muted)}
.stat b{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.big{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.jump{display:flex;gap:6px}
.jump input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:7px;
  background:var(--sunk);color:var(--ink);font-family:var(--mono);font-size:13px}
.wrong{display:flex;flex-wrap:wrap;gap:4px;max-height:150px;overflow-y:auto}
.wrong button{font-family:var(--mono);font-size:11px;padding:3px 7px;border-radius:5px;
  background:var(--bad-soft);color:var(--bad);border:1px solid transparent}
.wrong button:hover{border-color:var(--bad)}
.empty{font-size:12.5px;color:var(--muted);line-height:1.7}
.bars{display:flex;flex-direction:column;gap:9px}
.wk{font-size:12px}
.wk .l{display:flex;justify-content:space-between;margin-bottom:4px;color:var(--ink-2)}
.wk .l em{font-family:var(--mono);font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.wk .t{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.wk .t i{display:block;height:100%;background:var(--bad);border-radius:2px}
.lnk{font-size:12.5px;color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.lnk:hover{border-bottom-color:var(--accent)}
.done{text-align:center;padding:60px 24px}
.done .big{font-size:44px;color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<body>
<div class="bar">
  <div class="bar-in">
    <div class="brand"><b>CEH v13 分段題庫</b><span id="srcline">312-50v13 &middot; 797 題</span></div>
    <div class="seg" id="tiers"></div>
    <div class="tools">
      <select class="ic sel" id="dom" title="依考試九大領域篩選"></select>
      <button class="ic" id="snap" aria-pressed="false" title="只留下答案是工具名或技術名稱的題目，看懂情境就能秒選">秒答題</button>
      <button class="ic" id="hl" aria-pressed="true" title="標出技術線索與方向詞，淡化地名日期">重點標記</button>
      <button class="ic" id="reveal" aria-pressed="false" title="直接顯示正解與詳解，不計入作答成績">直接看答案</button>
      <button class="ic" id="shuffle" aria-pressed="false">隨機</button>
      <button class="ic" id="onlywrong" aria-pressed="false">只練錯題</button>
      <button class="ic" id="theme">主題</button>
      <a class="ic lnk-classic" href="classic/" title="6 個題庫共 1461 題，含多帳號錯題複習">舊版題庫</a>
    </div>
  </div>
</div>
<div class="rail"><div id="railfill"></div></div>

<div class="wrap">
  <main>
    <div id="stage"></div>
    <div class="nav" id="nav"></div>
  </main>
  <aside class="side">
    <div class="panel">
      <h4>本次作答</h4>
      <div class="big" id="pct">—</div>
      <div class="stat"><span>已答</span><b id="sDone">0</b></div>
      <div class="stat"><span>答對</span><b id="sOk">0</b></div>
      <div class="stat"><span>答錯</span><b id="sNo">0</b></div>
    </div>
    <div class="panel">
      <h4>跳題</h4>
      <div class="jump">
        <input id="jin" type="text" inputmode="numeric" placeholder="題號 1-797" aria-label="輸入題號">
        <button class="btn" id="jgo" style="padding:7px 12px">前往</button>
      </div>
    </div>
    <div class="panel">
      <h4>錯題 <span id="wct" style="font-family:var(--mono);color:var(--muted)"></span></h4>
      <div id="wrongbox"></div>
    </div>
    <div class="panel">
      <h4>弱點分類</h4>
      <div class="bars" id="weak"><p class="empty">答錯的題目會依分類累積在這裡。</p></div>
    </div>
    <div class="panel">
      <h4>紀錄</h4>
      <p class="empty" style="margin:0 0 10px">作答進度存在這個瀏覽器裡，換裝置不會同步。</p>
      <button class="lnk" id="reset" style="background:none;padding:0">清除所有紀錄</button>
    </div>
  </aside>
</div>

<script>
const DATA = [{"n":1,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a red team engagement at a law firm in Dallas, ethical hacker Sarah connects a compromised workstation to a core switch. Within minutes, the switch begins experiencing instability, and multiple VLANs report traffic leakage across isolated departments. Sarah observes that her machine is now receiving packets not originally destined for it, giving her visibility into multiple active sessions. Logs show the switch ' s CAM table was overwhelmed during the attack. Which sniffing technique did Sarah most likely use?","o":["DNS Poisoning","VLAN Hopping","ARP Poisoning","MAC Flooding"],"a":[3],"e":"關鍵指標是交換器的 CAM 位址表被塞滿，而且攻擊者的電腦開始收到原本並非傳送給它的流量；這正是 MAC 位址泛洪的典型特徵。交換器會維護 CAM（Content Addressable Memory，可內容定址記憶體）位址表，用來記錄 MAC 位址與交換器連接埠之間的對應關係。在正常情況下，交換器可依此只將訊框轉送至正確的目的連接埠，也就是單播交換。發動MAC 位址泛洪攻擊時，攻擊者會傳送大量訊框，並在其中使用許多偽造的來源 MAC 位址，迅速填滿 CAM 位址表。位址表滿載後，交換器可能會將未知單播訊框泛洪至多個連接埠，行為類似集線器。這會造成非預期的封包暴露，使攻擊者得以擷取其他主機的流量並嗅探多個工作階段。\n\n題目明確提到交換器不穩定、流量外洩、收到不是傳送給攻擊者的封包，以及 CAM 位址表耗盡；這些現象均與 MAC 位址泛洪的運作方式直接相符。\n\n其他選項不如 D 符合的原因如下：\n\nARP 欺騙（C）屬於中間人攻擊技術，透過操弄 ARP 快取將流量重新導向攻擊者。它通常不會塞滿交換器的 CAM 位址表；其主要徵兆是流量遭重新導向，而不是 CAM 位址表耗盡。\n\nVLAN 跳躍攻擊（B）用來繞過 VLAN 分段，例如交換器偽裝或雙重標記；重點在跨越 VLAN 邊界，而非造成 CAM 位址表溢位及交換器全面泛洪。多個 VLAN 發生外洩可能是泛洪或設定錯誤的後續結果，但決定性的線索仍是 CAM 位址表被塞滿。\n\nDNS 毒化（A）以名稱解析為攻擊目標，不會造成 CAM 位址表耗盡或交換器不穩定。\n\n因此，Sarah 最可能使用的是 D：MAC 位址泛洪。","s":"term"},{"n":2,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During enumeration, a tool sends requests to UDP port 161 and retrieves a large list of installed software due to a publicly known community string. What enabled this technique to work so effectively?","o":["Unencrypted FTP services storing software data","The SNMP agent allowed anonymous bulk data queries due to default settings","Remote access to encrypted Windows registry keys","SNMP trap messages logged in plain text"],"a":[1],"e":"本情境描述的是 SNMP 列舉，屬於 CEH v13 偵察與列舉範疇。簡易網路管理協定（SNMP）使用 UDP 連接埠 161，廣泛用於監控及管理網路裝置。若組織未變更預設或公開已知的社群字串，例如 public（唯讀）或 private（讀寫），就會形成常見且嚴重的弱點。\n\nCEH v13 指出，SNMP 代理程式若仍使用預設社群字串，便可能允許未經身分驗證或僅經弱式驗證的查詢，讓攻擊者取得大量系統資訊，包括已安裝軟體、執行中程序、系統說明、網路介面及路由表。SNMP GET 與 WALK 命令能大量查詢資料，因此列舉可以快速且有效地進行。\n\n選項 B 正確指出根本原因：SNMP 代理程式設定不當，允許匿名或使用預設值存取。其他選項並不正確，因為 SNMP 列舉不依賴 FTP、Windows 登錄存取或 Trap 日誌。Trap（選項 D）是由代理程式主動傳送給管理端的通知，並非用來查詢系統詳細資訊。\n\nCEH v13 建議：不需要 SNMP 時應將其停用、變更預設社群字串、透過 ACL 限制 SNMP 存取，並採用支援身分驗證與加密的 SNMPv3。因此，B 是符合 CEH 觀點的正確答案。"},{"n":3,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"By using a smart card and pin, you are using a two-factor authentication that satisfies","o":["Something you know and something you are","Something you have and something you know","Something you have and something you are","Something you are and something you remember"],"a":[1],"e":"智慧卡屬於「你持有的物品」（something you have），因為它是驗證時使用的實體物件。PIN 碼則屬於「你知道的資訊」（something you know），因為它是使用者記住的秘密資訊。兩者結合了不同類別的驗證因素，因此構成雙因素驗證。指紋、視網膜掃描或臉部辨識才屬於「你的生物特徵」（something you are），但本題並未使用這些因素。因此，正確答案為 B。","s":"term"},{"n":4,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"A media streaming company in Los Angeles, California engages a certified ethical hacker to evaluate the resilience of its cloud-hosted infrastructure. After initial access is obtained through an exposed credential in a development repository, the tester systematically modifies logging configurations, establishes alternate access keys for persistence, and documents privilege relationships between services within the tenant. The tester's actions are focused on maintaining continued access and mapping the internal structure of the environment after initial compromise has occurred. Within the cloud attack lifecycle, which phase best represents this stage of activity?","o":["Exploitation","Information Gathering","Vulnerability Assessment","Post-Exploitation"],"a":[3],"e":"正確答案：後滲透。\n\n題目清楚說明測試人員已經取得初始存取權。此時不再只是探索資產、辨識弱點或利用第一個弱點，而是在修改日誌設定、建立替代存取金鑰、維持持久性，並描繪雲端租用戶內部的權限關係。\n\n這些行為符合後滲透階段：測試人員評估成功入侵後還能執行哪些行動，包括維持存取、列舉權限、理解內部信任關係，以及記錄入侵造成的影響。\n\n符合 CEH 的方法會區分前期的資訊蒐集與弱點掃描，以及後期的取得存取權與維持存取。資訊蒐集著重於 IP 位址、協定、開放連接埠、裝置類型及廠商資訊等內容；較後面的階段則包括取得存取權、權限提升、安裝後門、維持存取、清除日誌及掩蓋蹤跡。\n\nA：弱點利用不正確，因為弱點利用是主動使用初始弱點以取得存取權的階段；本情境中，暴露的認證資訊已經被使用。\n\nB：資訊蒐集不正確，因為測試人員並非只蒐集外部或入侵前資訊，而是在入侵後進入雲端租用戶內活動。\n\nC：弱點評估不正確，因為弱點評估著重於辨識及驗證弱點，不包含建立持久性、建立存取金鑰或描繪內部權限。\n\nD：後滲透正確，因為測試人員正在入侵後維持存取並評估內部影響。\n\n因此，最佳答案是 D：後滲透。","s":"term"},{"n":5,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"During an IDS audit, you notice numerous alerts triggered by legitimate user activity. What is the most likely cause?","o":["Regular users are unintentionally triggering security protocols","The firewall is failing to block malicious traffic","The IDS is outdated and unpatched","The IDS is configured with overly sensitive thresholds"],"a":[3],"e":"依據 CEH 的 IDS/IPS 模組，合法活動被錯誤判定為惡意活動時，就會產生誤判警示（false positive）。最常見的原因是IDS 規則或觸發門檻設定得過於敏感。選項 D 正確指出了這項問題。選項 A 描述的是表面現象，而不是根本原因。選項 B 與 IDS 的警示行為無直接關係。選項 C 比較可能造成漏判，而非警示過多。CEH 建議適當調校 IDS，並建立正常活動的基準輪廓。"},{"n":6,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During a black-box penetration test, an attacker runs the following command: nmap -p25 --script smtp-enum-users --script-args EXPN,RCPT < target IP > The script successfully returns multiple valid usernames. Which server misconfiguration is being exploited?","o":["The SMTP server allows authentication without credentials","The SMTP server has disabled STARTTLS, allowing plaintext enumeration","SMTP user verification commands are exposed without restrictions","DNS MX records point to an internal mail relay"],"a":[2],"e":"CEH 的列舉模組說明，SMTP 支援 VRFY、EXPN 及 RCPT TO 等命令；若未適當限制，攻擊者便可濫用這些命令來列舉有效的電子郵件使用者。本情境中，Nmap 的 smtp-enum-users 指令碼成功使用 EXPN 與 RCPT，表示伺服器針對有效及無效使用者名稱提供了不同的回應。選項 C 正確，因為未受限制的 SMTP 使用者驗證功能，會讓攻擊者蒐集可供後續網路釣魚或暴力破解使用的帳號名稱。選項 A 涉及身分驗證，而不是使用者列舉。選項 B 影響通訊機密性，而不是使用者探索。選項 D 與 SMTP 使用者列舉無關。CEH 強烈建議停用或限制這些 SMTP 命令。"},{"n":7,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A payroll management portal used by a manufacturing firm in Toledo, Ohio allows administrators to configure customizable notification templates that are later incorporated into automated reporting functions. During an authorized assessment, an ethical hacker submits specially structured input into a template field while creating a test notification. The application accepts and stores the value without any noticeable disruption to the interface. Days later, when a scheduled reporting task executes, the resulting dataset includes records beyond the expected scope defined by the report criteria. Further review reveals that the reporting engine dynamically constructs database queries using previously stored template values during execution. Determine the SQL injection variant illustrated in this scenario.","o":["Stored Procedure Injection","Second-Order SQL Injection","Error-Based SQL Injection","Piggybacked Query Injection"],"a":[1],"e":"正確答案：二階 SQL 注入。\n\n二階 SQL 注入是指惡意輸入先被應用程式儲存，之後又在資料庫查詢中以不安全的方式被使用。攻擊不一定在提交輸入時立即執行，而可能等到另一項功能、背景工作、報表產生器或業務流程取出該值，並將它併入動態 SQL 陳述式時才觸發。\n\n題目精確描述了這種模式：範本值先被接受並儲存，當下沒有異常；直到數日後，排程報表程序才使用該儲存值動態建構查詢。結果資料集包含超出預期範圍的記錄，顯示 SQL 注入是在後續查詢執行時發生。\n\nCEH 的 Web 應用程式教材說明，SQL 注入是將惡意程式碼或指令插入既有 SQL 查詢，以揭露或操弄資料庫資料。教材也依注入的執行方式及結果的觀察方式，區分同通道、錯誤型、推論型與頻外 SQL 注入。本題的決定性特徵不是錯誤訊息或立即附加查詢，而是已儲存輸入延後執行，因此屬於二階 SQL 注入。\n\nA：儲存程序注入不正確，因為它是針對資料庫儲存程序或濫用其執行方式；本題描述的是使用者輸入被儲存後，再被動態報表查詢使用，而不是直接濫用儲存程序。\n\nC：錯誤型 SQL 注入不正確，因為它需要依賴資料庫錯誤訊息來洩露資訊，而題目未描述任何資料庫錯誤訊息。\n\nD：附加查詢注入不正確，因為它是把另一個惡意查詢附加至合法查詢，並在同一個即時執行情境中執行；本題強調的是儲存輸入的延後執行。\n\n因此，最佳答案是 B：二階 SQL 注入。","s":"term"},{"n":8,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"An attacker exploits legacy protocols to perform advanced sniffing. Which technique is the most difficult to detect and neutralize?","o":["HTTP header overflow extraction","SMTP steganographic payloads","Covert channel via Modbus protocol manipulation","X.25 packet fragmentation"],"a":[2],"e":"CEH v13 將舊式工業協定中的隱蔽通道，列為最難偵測的嗅探技術之一。Modbus 廣泛用於 OT 與 ICS 環境，但本身缺乏身分驗證與加密，因此很適合被濫用來進行隱蔽通訊。\n\n攻擊者可以操弄功能碼及酬載的傳送時序，在不觸發傳統 IDS 特徵碼的情況下外洩資料。CEH v13 強調，OT 協定經常無法被深度檢測工具完整檢查，因此其中的隱蔽通道具有高度隱密性。\n\n其他選項在現代企業環境中較不實際，或較難長期維持。","s":"term"},{"n":9,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"long","q":"A retail brand based in San Diego, California, authorized a controlled mobile security exercise to evaluate risks associated with third-party application distribution channels. Testers acquired a version of the company's customer rewards application from an unofficial marketplace frequently used by overseas customers. The application's visual layout and functionality were indistinguishable from the officially released version available in mainstream app stores. Behavioral monitoring conducted in a sandbox environment revealed that, in addition to its normal operations, the application initiated outbound connections unrelated to its documented features. A binary comparison against the vendor-supplied build confirmed structural differences between the two versions. What mobile-based social engineering technique does this scenario most accurately represent?","o":["Conducting SMiShing campaigns through fraudulent text messages","Repackaging Legitimate Apps after modifying their internal structure","Deploying Fake Security Applications disguised as protection tools","Publishing Malicious Apps designed to mimic trusted brands"],"a":[1],"e":"正確答案：修改合法應用程式後重新封裝。\n\n題目指出，該應用程式的外觀與行為看似合法的獎勵 App，但二進位比對顯示其結構不同，沙箱監控也發現未經授權的對外連線。這表示原始合法應用程式遭修改後，被重新發布至非官方市集。\n\nCEH 的行動裝置社交工程教材將「重新封裝合法應用程式」定義為：攻擊者下載合法應用程式、修改程式以植入惡意軟體，再把重新封裝的版本上傳至第三方應用程式商店供使用者下載。重新封裝的應用程式還可能把認證資訊或其他資料傳送至攻擊者控制的伺服器。\n\nA：簡訊網路釣魚不正確，因為題目沒有涉及詐騙簡訊。\n\nC：假冒安全應用程式不正確，因為該 App 並未偽裝成安全工具。\n\nD：發布惡意應用程式雖然接近，但通常是指另外建立一個仿冒受信任品牌的惡意 App。題目的二進位比對已證實它是合法 App 的修改版本，因此「重新封裝」更為準確。\n\n因此，最佳答案是 B：修改合法應用程式後重新封裝。"},{"n":10,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"You are a cybersecurity consultant at FortiSec, advising DesertTech Innovations in Phoenix, Arizona. The company wants to modernize its Wi-Fi so that even if an attacker obtains a captured handshake or a weak passphrase, they cannot perform offline dictionary attacks or recover session keys; management also wants stronger, per-session encryption and protection for IoT devices without relying on a single shared password. Which wireless security measure should DesertTech implement to meet these goals?","o":["MAC Address Filtering","Use 802.1X Authentication","Upgrade to WPA3","Disable TKIP"],"a":[2],"e":"這些需求最直接對應到 WPA3，因為 WPA3-Personal 以 SAE（Simultaneous Authentication of Equals，對等實體同時驗證）取代舊式 WPA2-PSK 交握。SAE 的設計可抵抗離線字典攻擊：攻擊者即使擷取交握資料，也無法像針對WPA2-PSK 交握那樣，將資料帶到離線環境高速測試密碼猜測。這正面回應了管理階層的顧慮：擷取到的交握資料加上弱通關密語，不應讓攻擊者得以離線破解並最終還原工作階段金鑰。\n\nWPA3 也透過改善金鑰建立方式及支援較強的預設密碼機制，強化每一工作階段的保護。在企業環境中，WPA3 可搭配更強的身分驗證與加密套件；對 IoT 情境而言，相較於舊式 WPA2/TKIP 設定，它也支援較現代化的裝置加入方式並提升整體安全性。「每工作階段加密」及「更強的保護」均符合 WPA3 的現代化設計重點。\n\n其他選項較不適合的原因如下：\n\nMAC 位址過濾（A）並非防範認證資訊擷取或離線攻擊的安全控制；MAC 位址容易遭偽造，也不提供密碼學保護。\n\n802.1X 身分驗證（B，WPA2/WPA3-Enterprise）本身非常強，可使用每位使用者或每部裝置的認證資訊及動態金鑰，避免依賴單一共用 PSK。然而，本題特別要求即使交握資料遭擷取，也要防止離線字典攻擊；這項要求最直接對應WPA3-Personal 的 SAE 改良。實務上，搭配 802.1X 的 WPA3-Enterprise 同樣是良好方案，但在既定選項中，「升級至WPA3」最符合題目對離線字典攻擊的描述。\n\n停用 TKIP（D）是正確的基本安全措施，並應優先使用 AES/CCMP；但只要仍使用 WPA2-PSK，就不能阻止攻擊者擷取交握資料並對 PSK 進行離線破解。\n\n因此，最能符合既定現代化目標的措施是 C：升級至 WPA3。"},{"n":11,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"Which of the following protocols is used when an attacker attempts to launch a man-in-the-middle attack by manipulating sequence and acknowledgment numbers?","o":["ICMP","TCP","UDP","IP"],"a":[1],"e":"正確答案：TCP。序號與確認號碼是傳輸控制協定（TCP）的關鍵特徵。在 CEH 的網路與工作階段劫持概念中，TCP 是連線導向協定，透過 SYN、SYN/ACK 與 ACK 三向交握建立通訊。TCP 使用序號追蹤位元組次序，並使用確認號碼確認資料已收到。\n\n符合 CEH 的資料說明，TCP 工作階段劫持仰賴追蹤工作階段流量、預測序號、使連線失去同步，並注入目標系統會視為有效的封包。因此，涉及操弄序號與確認值的攻擊，對應的就是 TCP。\n\nICMP 主要傳遞控制及診斷資訊，例如 ping 與錯誤回報；UDP 是非連線導向協定，不維護 TCP 式的序號與確認號碼；IP提供位址指定及路由功能，但不管理可靠工作階段或確認機制。因此，最佳答案是 B：TCP。","s":"term"},{"n":12,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"A university authorizes a wireless protocol resilience assessment on its WPA2-secured network. An ethical hacker positions a testing device within range of an access point and observes the key negotiation exchange between the client and the access point. By selectively retransmitting a previously captured handshake message at a precise moment in the exchange, the tester causes the client device to reinstall an already negotiated encryption key. Subsequent traffic patterns reveal that certain protections expected from unique session parameters are no longer consistently enforced. What kind of wireless attack technique is being illustrated in this scenario?","o":["Key Reinstallation Attack (KRACK)","Replay Attack","Man-in-the-Middle Attack","WPA2 PSK Offline Cracking"],"a":[0],"e":"正確答案是 A。 Key Reinstallation Attack(KRACK)。題目描述的是重傳送一個被捕獲的 WPA2 握手訊息，這樣使用者端就可以重新安裝一個已經談判好的金鑰。這是 KRACK 的下定義行為，或 Key Reinstallation attack。 CEH 無線材料解釋出 KRACK 是對 WPA2 的重放式攻擊，濫用了\"四相握手\"。 透過反覆重放\"第三次握手\"資訊，攻擊者可以使被害者重新安裝同為加密的金鑰，這可能導致密碼值被再用並削弱流量保護。選項 B。 Replay Attack 太籠統了。 KRACK 使用回放行為，但具體的無線技術是鍵重置。 C.中間人選項攻擊也過於寬泛，因為核心弱點不僅僅是攔截，而是強制金鑰再安裝。選項 D。 WPA2 PSK 離線斷裂是不正確的，因為情境沒有描述抓取握手並解開離線前共享的金鑰。因此，最好的答案是 A。Key Reinstallation Attack(KRACK)。","s":"term"},{"n":13,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"What does AXFR allow?","o":["Zone transfer","Encryption","DNS tunneling","Resolution"],"a":[0],"e":"正確答案是 A，因為 AXFR 是用於全區傳輸的 DNS 操作。 在 DNS 中，一區將 DNS 區的資料從一區一號傳輸到一區一號，通常從一號主權威的伺服器到一號副區一號的伺服器，用於複製和冗餘。 CEH113 列舉專題強調，區轉移在偵察期間是有價值的，因為它們可以揭示 DNS 的記錄，主機名稱，郵件伺服器，名稱伺服器，IP 位址等基礎設施細節。 被引用的CEH 材料將區間轉移識別為 DNS 的轉移，其中所有 SOA 記錄被傳輸給請求者，並宣告全區轉移選項使用 opcode AXFR，而增量轉移則使用 IXFR。 它還顯示了請求區間傳輸的實用指令模式 dig < domain.com > axfr。 AXFR 不是加密，DNS 隧道通路，或普通的 DNS 解析度；它特別允許全 DNS 區間傳輸。","s":"term"},{"n":14,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"A penetration tester is attacking a wireless network running WPA3 encryption. Since WPA3 handshake protections prevent offline brute-force cracking, what is the most effective approach?","o":["Downgrade the connection to WPA2 and capture the handshake to crack the key","Execute a dictionary attack on the WPA3 handshake using common passwords","Perform a brute-force attack directly on the WPA3 handshake","Perform a SQL injection attack on the router ' s login page"],"a":[0],"e":"CEH v13 解釋說，WPA3 引入了 SAE(同時驗證等同)，透過去除可裂開的握手材料來抵抗傳統的下線詞典和暴力破解攻擊。由於 WPA3 阻止攻擊者捕捉可重複使用的握手方式，最實用的進攻方法是強迫降級攻擊，用 WPA2 來欺騙客戶，而不是用 WPA3 來進行聯想。 一旦被害者在 WPA2-PSK 下重新連線，攻擊者會抓住標準的 4 道握手，然後使用詞典或 GPU-被解開，當混雜模式設定被啟用或當無線基地台不能強制嚴格 WPA3-xxxxxxx 操作時，可以將降級攻擊作為顯著的現實世界威脅來討論。 選項 B 和 C 無效，因為 WPA3 握手材料不能被野蠻地強制下線。 選項 D 與 Wi-Fi 加密無關。 降級到WPA2 是最有效並被廣泛記錄的攻擊路徑。"},{"n":15,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"long","q":"A healthcare technology company deploys internet-connected cardiac monitoring devices across several hospitals in Minneapolis, Minnesota. During a controlled security review, an analyst discovers that administrative configuration features can be accessed remotely through components that interact with external management platforms. Further analysis reveals that these externally reachable components process user-supplied data without sufficient validation checks. Additionally, authentication controls protecting remote configuration features rely solely on basic credential verification without additional safeguards against automated misuse. According to the OWASP Top 10 IoT Vulnerabilities, how should this weakness be classified?","o":["Insecure Ecosystem Interfaces","Insecure Default Settings","Insecure Network Services","Lack of Device Management"],"a":[0],"e":"正確答案是 A。 不安全的生態系統介面。弱點涉及外部可達到的元件，這些元件與管理平台互動並暴露出行政設定功能。這些元件還受到不充分的輸入驗證和薄弱的認證控制。這與不安全的生態系統介面相配合，它覆蓋不安全的網路、雲、移動、API 和構成 IoT 裝置生態系統一部分的後端介面。 符合 CEH IoT 材料將脆弱介面確定為主要的 IoT 挑戰，並列出OWASPIoT 類別，包括不安全的網路，雲和移動介面，認證/authorization 不充分，以及不安全的網路服務。 它還解釋，不安全的雲和移動介面與薄弱的認證資訊，帳戶列舉，以及不良的介面保護有關。 在較新的 OWASPIoT 措辭中，這些類別是相關的。介面弱點通常歸在不安全的生態系統介面下。選項 B。 不安全預設設定是不正確的，因為情境並不注重預設密碼，預設設定，不必要的啟用服務，或不安全的工廠設定。選項 C。 不安全網路服務是不正確的，因為這一類別側重於裝置暴露的脆弱網路服務，如易受到緩衝區溢位或阻斷服務條件影響的服務。 設想方案強調外部生態系統組成部分和管理介面。選項 D。 裝置管理缺失是不正確的，因為情境沒有描述缺失的庫存，缺失的更新管理，缺失的退役，或者無法監測裝置的生命週期。因此，最好的答案是 A。 生態系統不安全的介面。","s":"term"},{"n":16,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"An ethical hacker needs to enumerate user accounts and shared resources within a company ' s internal network without raising any security alerts. The network consists of Windows servers running default configurations. Which method should the hacker use to gather this information covertly?","o":["Deploy a packet sniffer to capture and analyze network traffic","Perform a DNS zone transfer to obtain internal domain details","Exploit null sessions to connect anonymously to the IPC$ share","Utilize SNMP queries to extract user information from network devices"],"a":[2],"e":"CEH v13 解釋說，執行更古老或預設設定的 Windows 系統經常允許匿名或無效的工作階段連線到 IPC$的股票，使攻擊者能夠不認證地點出使用者，群組、共用資源等系統細節。 Null 工作階段 列舉被強調為一種經典而有效的技術，因為它產生最小可探測活動，不需要認證資訊，使得它成為理想的。 CEH 強調，在遺留或硬化不良的環境中，SMB Null 工作階段經常被忽略， 特別是當預設權限保持不變時。 封包嗅探(可選取 A)可能提供一些資料但需要流量能見度，並且可能透過監測工具被偵測出。 DNS 區轉移(可選取 B)需要錯設定，通常不會披露使用者清單細節。 SNMP 查詢(可選取 D)需要社群字串，並經常產生提醒。 因此，利用無效的工作階段是在預設設定下將 Windows 系統計數的最隱蔽而有效的方法。"},{"n":17,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester evaluates a secure web application using HTTPS, secure cookies, and multi-factor authentication. To hijack a legitimate user's session without triggering alerts, which technique should be used?","o":["Exploit a browser zero-day vulnerability to inject malicious scripts","Implement a man-in-the-middle attack by compromising a trusted network device","Perform a Cross-Site Request Forgery (CSRF) attack to manipulate session tokens","Utilize a session token replay attack by capturing encrypted tokens"],"a":[2],"e":"CEH v13 描述 Cross-Site Request Forgery (CSRF) 是一種技術，迫使認證的使用者無意地在 Web 應用程式內不知不覺地執行動作。與需要偷取或重放工作階段 cookie 的工作階段劫持方法不同，CSRF 利用了伺服器與使用者瀏覽器之間的信任關係。 即使使用 HTTPS，安全 cookie，和 MFA，一旦一個使用者被認證，瀏覽器會自動傳送工作階段 cookie 與每個請求。 如果攻擊者說服受害者載入惡意製作的網頁或 URL，瀏覽器會向目標應用傳送一個偽造的請求，執行使用者認證的工作階段.CEH 下的行動，安全 Cookie 和 MFA 不會因為沒有被盜取認證資訊而停止 CSRF--只發生強制行動。 這一技術是複雜的，因為它留下了最小的痕跡，避免了直接的 Cookie 操縱，繞過強大的身分驗證機制，並利用設計上的弱點而不是技術上的錯位。 保護通常需要反 CSRF 的活體和適當的原始碼驗證。"},{"n":18,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at a financial services firm in Boston, ethical hacker Daniel simulates a DDoS against the customer portal. To handle the surge, the IT team sets a rule that caps the number of requests a single user can make per second; aggressive connections are delayed or dropped while most legitimate customers continue to use the service. Which countermeasure strategy is the IT team primarily using?","o":["Rate Limiting","Shutting Down Services","Absorb the Attack","Degrading Services"],"a":[0],"e":"資訊科技團隊的行動--摸清一個使用者每秒能提出多少請求，然後推遲或減少主動連線--是限制費率的決定性行為。在DDoS 條件下，特別是在入口網站處於自動或濫用流量激增的情況下，限制費率執行限制一個源的請求頻率的政策(例如IP 位址、工作階段、API 金鑰或使用者識別符號)。(c) 透過防止任何一臺使用者端(或少數客戶)消耗過多的應用和基礎設施資源來保持可用性。情境中的關鍵措辭是\"在大多數合法客戶繼續使用服務的同時，侵犯性連線被延遲或下降\"。 利率限制正是為這個結果而設計的:它引入了濫用流量模式的摩擦，同時允許典型的使用者行為透過。 根據執行的不同，控制元件可以在超過限制時以延遲(throttling)，臨時塊，連線重排，或 HTTP 錯誤回應(例如\"太多的請求\")來回應。 這通常在邊緣應用(反向代用/CDN)，負載平衡器，WAF，或應用程式閘道器來降低後端服務的壓力。為什麼其他選項不是最佳匹配 :關閉服務(B)是一項極端措施，它犧牲了可用性來阻止攻擊；這種情境明確表明，服務在很大程度上仍在繼續。 Absorb the Attack(C)指縮放容量或使用擦洗中心/CDNs 處理體積，而不一定限制個別請求者的行為；所描述的控制是特指每個使用者的請求蓋。降解服務(D)一般指故意降低功能或質量(如使非基本功能喪失能力)來保持核心服務的生命力；在這裡，主要技術是強制執行請求率閾值。因此，正在採用的反措施戰略是 A.限制利率。","s":"term"},{"n":19,"c":"密碼學","ce":"Cryptography","t":"short","q":"Which algorithm best protects encrypted traffic patterns?","o":["PSA","AES","DES","HMAC"],"a":[1],"e":"AES 是 CEH v13 所認可的行業標準對稱式加密演算法，它提供了很強的機密性，並在使用適當模式(如 CBC，GCM)時能抵抗流量分析。 DES 已經過時了，HMAC 確保了完整性而不是加密，PSA 不是標準的加密演算法。因此，選項 B 是正確的。","s":"term"},{"n":20,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"A penetration tester is running a vulnerability scan on a company's network. The scan identifies an open port with a high-severity vulnerability linked to outdated software. What is the most appropriate next step for the tester?","o":["Execute a denial-of-service (DoS) attack on the open port","Perform a brute-force attack on the service running on the open port","Research the vulnerability and determine if it has a publicly available exploit","Ignore the vulnerability and focus on finding more vulnerabilities"],"a":[2],"e":"CEH v13 概述了對弱點評估和開採的一種結構化方法，在查明瞭高度嚴重的弱點後，下一個關鍵步驟是核查和研究，而不是即時開採。 這確保了準確性，減少了誤判警示，並避免了不必要的風險。 CEH 強調測試者必須驗證弱點細節，確認版本的適用性，評估開發的可用性(如 Metasploit，Expolit-DB)並評價潛在影響。 嘗試 DoS 攻擊(可選 A)被禁止，除非明確範圍，且與負責任的測試不相符合。 暴力破解攻擊(備選 B)與軟體版本的弱點無關。忽略問題(備選 D)違反了 CEH 方法。正確的過程是研究和核實--確保弱點利用是安全的、相關的和授權的。這與 CEH 的一致。弱點管理生命週期:發現#核查#優先開發#開發(當允許時)#報告。"},{"n":21,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"long","q":"A penetration tester evaluates a company ' s susceptibility to advanced social engineering attacks targeting its executive team. Using detailed knowledge of recent financial audits and ongoing projects, the tester crafts a highly credible pretext to deceive executives into revealing their network credentials. What is the most effective social engineering technique the tester should employ to obtain the necessary credentials without raising suspicion?","o":["Send a mass phishing email with a link to a fake financial report","Create a convincing fake email from the CFO asking for immediate credential verification","Conduct a phone call posing as an external auditor requesting access to financial systems","Develop a spear-phishing email that references specific financial audit details and requests login confirmation"],"a":[3],"e":"Spear-phising 是一種有針對性的釣魚形式，使用個性化和內容豐富的資訊來提高可信度。 CEH 強調，引用具體的內部專案，財務資料，或者組織事件，在攻擊高價值目標如高管時會大大提高成功率。 這種量身定製的做法避免了猜疑，比廣泛或一般的釣魚企圖更有效地利用了信任。"},{"n":22,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"The tools which receive event logs from servers, network equipment, and applications, and perform analysis and correlation on those logs, and can generate alarms for security relevant issues, are known as what?","o":["Intrusion Prevention Server","Security Incident and Event Monitoring","Network Sniffer","Vulnerability Scanner"],"a":[1],"e":"正確答案是 B，安全事件與事件監測(通常稱為 SIEM - - 安全資訊與事件管理 )。 SIEM 解決方案從伺服器、防火牆、路由器、交換器、端點、安全裝置和應用等多個來源蒐集事件日誌。 然後，它們會實現正常化、關聯、分析和儲存這些日誌，以識別可疑活動和安全事件。 SIEM 技術的一個主要功能是在偵測出預先定義的規則，行為異常，或威脅指標時產生警報。在 CEH v13 安全營運與事件回應專題中，SIEM 系統在集中的日誌管理，事件關聯，威脅偵測，合規報告，和出事中發揮著關鍵作用。 SIEM 工具透過跨多個系統的關聯事件，可以識別在單獨檢查個人日誌時可能無法識別出的攻擊。 例子包括髮現野蠻人攻擊，權限提升嘗試，惡意軟體感染，橫向移動，以及資料外洩活動等。其它選項是不正確的，因為一個入侵防禦系統專注於阻斷攻擊，一個 Network Sniffer 捕捉到封包，一個弱點掃描器識別出弱點而不是將安全關聯到日誌。 因此，最好的答案是安全事件與事件監測(SIEM)。","s":"term"},{"n":23,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"During an internal security review at a transportation authority in Columbus, Ohio, a red team analyst positioned himself on the same local network segment as several domain-joined administrative workstations. Over several hours, he recorded authentication exchanges as legitimate users performed their routine logon activities across the network. He later analyzed the captured traffic to recover valid credentials associated with privileged accounts. Based on the attacker's actions, how should this password attack be classified?","o":["Passive Online Attack","Non-Electronic Attack","Active Online Attack","Offline Attack"],"a":[0],"e":"正確答案是 A.被動線上攻擊。分析師不是直接猜測密碼，強迫認證，也不是偷取一個密碼資料庫用於後期破解，而是在網路和嗅探認證交換臺上定位，而合法使用者通常進行認證。 符合 CEH 密碼攻擊材料將被動線上攻擊定義為嗅探網路流量，希望截獲明文密碼，捕捉認證材料，重放認證，或進行中間人活動。 另一 CEH 參考文獻稱，被動線上密碼駭客可以由嗅探封包進行並捕獲明文密碼或雜湊，供後期分析。選項 B。 非電子攻擊是不正確的，因為非電子攻擊包括肩上衝浪，垃圾桶搜尋等方法，以及社交工程。備選 C。 主動線上攻擊是不正確的，因為主動線上攻擊涉及直接與受害人系統溝通，如密碼猜測或暴力破解企圖。選項 D。 離線攻擊是不正確的，因為離線攻擊涉及偷取密碼雜湊或檔案，並單獨破解。選項A.被動線上攻擊是正確的，因為分析師透過監測網路來捕捉認證流量。因此，最好的答案是 A.被動線上攻擊。","s":"term"},{"n":24,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"A penetration tester extracts NTLM hashes but does not crack them, instead reuses them to authenticate. What attack is this?","o":["Kerberoasting","Pass-the-hash","Brute force","Replay attack"],"a":[1],"e":"正確答案是 B，因為情境完全描述了\"Pass-the-Hash\"攻擊。 在 Windows 環境中，NTLM 認證使用密碼雜湊作為身分驗證流程的一部分。 在\"Pass-the-Hash\"攻擊中，攻擊者或授權的滲透測試人員不需要取回明文密碼。 相反，他們擷擷取NTLM 雜湊並再利用，直接將雜湊認證到另一個系統或服務。 符合 CEH 的系統駭客材料解釋出，Windows 儲存了密碼雜湊值，攻擊者可以偷取雜湊併傳送出雜湊來而不是破解密碼。 這與野蠻力不同，在發現正確密碼之前，許多來源於密碼猜測的嘗試。 這與 Kerberoasting 也不同，後者針對克貝羅斯服務票證進行離線破解。 \"回放攻擊\"是一個更寬泛的術語，但這裡描述的精確 Windows/NTLM 技術是\"Pass-the-Hash\"，因此，選項 B 是最好的答案。","s":"term"},{"n":25,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"During a post-exploitation phase on a compromised finance department workstation, ethical hacker Anika uses her Meterpreter session to extract sensitive credential data. After running a command, she receives a long list of alphanumeric strings representing LM and NTLM values. These outputs are later transferred to a cracking rig for offline password recovery, allowing the red team to simulate credential theft across multiple systems. Which Meterpreter command most likely produced these results?","o":["keyscan_start","hashdump","getsystem","screenshot"],"a":[1],"e":"正確答案是 B。 hashdump， 因為輸出描述的-- “ 代表 LM 和 NTLM 值的長長的字母字串清單 ” -- 與 Windows 密碼 雜湊格式相匹配。本機安全帳戶管理器 (SAM) 資料庫(帶有 SYSTEM 蜂巢的支援資料)。 在 CEH 對齊的後滲透和認證資訊存取概念中，攻擊者經常瞄準 LM/NTLM 雜湊而不是明文密碼。Hashes 可以被下線用於密碼回收嘗試(例如:字典/brute-力和基於規則的破解)，這符合將值轉移到開關鑽機的情境。在 Meterpret 語境中， hashdump 通常與從已損壞的 Windows 主機 中傾倒本機帳戶 密碼 hashes 相關的命令。 幹流對於模擬 認證資訊 折中一個環境是有用的，因為回收的密碼可能在其他系統被再使用，即使沒有恢復，幹流有時也可以在認證濫用情境中被利用，這取決於是否有控制。為什麼其他選項不正確 :keycan_ start 在 Meterpreter 中啟動按鍵記錄； 它不會輸出 LM/NTLM 雜湊字串。 getsystem trys 權限提升 to SYSTEM- level (或等同的)。 雖然在成功傾銷雜湊之前可能需要更高的權限， 但它本身並不產生雜湊清單； 它改變/嘗試改變特權上下文。截圖能捕捉到使用者的螢幕，與認證資訊雜湊擷取沒有關係。\"後滲透階段\"細節很重要:認證資訊傾銷是獲得立足地後的一種經典活動，用於擴大准入(vivoting/lateral 運動)並評估劣質密碼衛生的影響，從防禦角度講，這凸顯出需要最少特權，認證資訊保護控制，限制本機管理，強密碼政策，以及監控可疑的認證資訊-准入行為。","s":"term"},{"n":26,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"Bob is doing a password assessment for one of his clients. Bob suspects that security policies are not in place. He also suspects that weak passwords are probably the norm throughout the company he is evaluating. Bob is familiar with password weaknesses and key loggers. Which of the following options best represents the means that Bob can adopt to retrieve passwords from his clients hosts and servers?","o":["Software only, they are the most effective.","Hardware and Software Keyloggers.","Passwords are always best obtained using Hardware key loggers.","Hardware, Software, and Sniffing."],"a":[3],"e":"正確答案是 D， 硬體， 軟體， 和 嗅探。 在 CEH 系統駭客化和 密碼 攻擊概念中， 密碼 在授權評估期間的擷取可能涉及多個類別， 而不僅僅是一種方法。 keylogb 可能透過捕獲使用者按鍵的硬體裝置或軟體應用來進行， CEH 材料專門識別出按鍵 logb 使用硬體或軟體來捕獲使用者型別。 CEH 材料也將鍵盤機描述為硬體或軟體，並解釋它們監測鍵盤活動和相關使用者動作。 嗅探是另一種密碼擷取方法，因為在 LAN 上捕獲到的封包可能暴露出敏感資訊和認證資訊，如 Telnet，FTP，SMTP 等或 rlogin 密碼。 因此，僅軟體不完全，僅硬體過於狹窄，而硬體/software 金鑰 loggers 排除了網路嗅探。最廣泛和最準確的答案是硬體，軟體和嗅探。"},{"n":27,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"Which advanced session hijacking technique is the most difficult to detect and mitigate?","o":["Credential stuffing","Clickjacking","CSRF","Session replay attack"],"a":[3],"e":"工作階段回放攻擊在 CEH v13 Web 應用程式入侵中被強調為最精密和最難被發現的工作階段劫持技術之一。 在這次攻擊中，對手捕獲有效的工作階段權杖或加密的工作階段識別碼並重放以假冒合法使用者。與認證資訊填充依賴於登入嘗試並可以透過認證異常被偵測出不同，工作階段在認證後會進行回放，使用合法的工作階段文物。 Clicktjacking 和 CSRF 操縱使用者互動，但不會直接劫持工作階段權杖。 CEH v13 解釋道，工作階段重放攻擊在工作階段權杖可預見，壽命長，或者不適當地繫結於使用者端屬性，如 IP 位址或裝置指紋的環境中特別危險。 由於攻擊者重複使用有效的工作階段資料，傳統的偵測機制往往會失敗。重放的工作階段在伺服器看來是合法的，因此如果沒有先進的行為分析，欺詐的發現極其困難。 這使得工作階段重放攻擊在交易頻繁並具有時間敏感性的線上零售環境中特別有效。因此，選項 D 正確地確定了最具挑戰性的攻擊。","s":"term"},{"n":28,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"Malware uses Background Intelligent Transfer Service (BITS) to evade detection. Why is BITS attractive to attackers?","o":["It uses IP fragmentation","It encrypts DNS packets","It looks like normal Windows Update traffic","It works only through HTTP tunneling"],"a":[2],"e":"在 CEH v13 惡意軟體威脅中，BITS 被強調為合法 Windows 服務，經常被攻擊者濫用來進行隱形的指令與控制(C2)通訊和資料外洩。 BITS 被設計為使用閒置的頻寬傳輸背景檔案，主要用於 Windows 更新和微軟服務。攻擊者利用 BITS，因為其流量與合法的 Windows 更新流量相近，幾乎總是透過防火牆，代理，和端點安全控制允許的。 這使得惡意流量無縫地混合到正常的網路活動中來，大大降低了被偵測的可能性。選項 C 正確捕捉到這種行為。 BITS 不依賴 IP 分解(可選 A)，DNS 加密(可選 B)，或獨家使用 HTTP 地道(可選 D)取而代之的是，它利用了可信任的系統行為和簽名的二進位，允許惡意軟體\"從地上活出\"。 CEH v13 強調，濫用 BITS 等可信賴的服務是高階持續威脅(APT)和無檔案惡意軟體的標誌。 偵測此類濫用通常需要行為監測而不是以簽名為基礎的偵測。因此，選項 C 是正確的。"},{"n":29,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"A penetration tester gains access to a target system through a vulnerability in a third-party software application. What is the most effective next step to take to gain full control over the system?","o":["Conduct a denial-of-service (DoS) attack to disrupt the system's services","Execute a Cross-Site Request Forgery (CSRF) attack to steal session data","Perform a brute-force attack on the system ' s root password","Use a privilege escalation exploit to gain administrative privileges on the system"],"a":[3],"e":"根據 CEH 攻擊方法，一旦攻擊者透過開發、設定錯誤或認證資訊妥協獲得初步進入，下一個關鍵階段是權限提升。 獲得系統級別或行政控制對於維持持久性、進入受保護地區至關重要。權限提升利用目標核心缺陷，錯設定服務，權限設定不當，或弱勢驅動程式。 CEH 強調，執行 DoS 攻擊會干擾業務約定，不提供戰略優勢。類似地，CSRF 針對的是 Web 應用程式而不是作業系統，而 braman-force 密碼嘗試效率低下，噪音高，一旦本機存取已經建立起來，往往無效。 透過使用權限提升技術，測試器將有限的使用者存取轉換為全系統控制，使得與 CEH 系統駭客程式一致的開發後綜合活動得以進行。"},{"n":30,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"During a high-stakes engagement, a penetration tester abuses MS-EFSRPC to force a domain controller to authenticate to an attacker-controlled server. The tester captures the NTLM hash and relays it to AD CS to obtain a certificate granting domain admin privileges. Which network-level hijacking technique is illustrated?","o":["Hijacking sessions using a PetitPotam relay attack","Exploiting vulnerabilities in TLS compression via a CRIME attack","Stealing session tokens using browser-based exploits","Employing a session donation method to transfer tokens"],"a":[0],"e":"CEH v13 描述接力攻擊為認證資訊轉發技術，攻擊者欺騙系統認證惡意伺服器，捕獲雜湊並轉發給特權服務。 所描述的情境與 PetitPotam 攻擊完全吻合， 一種已知的 MS-EFSRPC 濫用方法，迫使 Windows 網域控制站執行 NTLM 認證到攻擊者控制的主機。 CEH 討論繼電器攻擊與 Active Directory 憑證服務(AD CS)的錯設定如何可以允許攻擊者請求特權憑證， 有效獲得域管理員權限，而無需解開雜湊或存取 LSASS。 CRIME(可選 B)目標 TLS 壓縮，且無關。 瀏覽器權杖盜竊(可選 C)適用於 web 工作階段，而非網域控制站。工作階段捐贈(可選 D)不是 Windows 認證劫持的一部分。 因此，該情境顯然代表了 PetitPotam NTLM 中繼攻擊。"},{"n":31,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"While conducting a compliance-driven security assessment at a public healthcare data center in Maryland, Jason, a senior penetration tester, was asked to reconcile outdated asset documentation for several legacy network appliances still active within the environment. Internal records lacked accurate device identifiers, administrative contact entries, and interface-level statistics needed for regulatory reporting. Preliminary testing revealed that the devices were still exposing management information through long- standing read-only credentials configured years earlier. Rather than logging into each device manually or passively observing traffic, Jason decided to use a command-line approach that would systematically traverse the exposed management object tree of each system and redirect the complete output into a file for automated processing. Determine which tool aligns with this requirement.","o":["SoftPerfect Network Scanner","Wireshark","Nmap","SnmpWalk"],"a":[3],"e":"正確答案是 D。 SnmpWalk。題目描述為 SNMP 列舉.SNMP 使用一個管理資訊庫(MIB)，使用物件識別符將資訊儲存在分級結構中，或 OID.符合 CEH 材料解釋為 SNMP 代理透過從 MIB 擷取資料回應請求，而 MIB 條目可以識別裝置，作業系統，以及使用統計。 另一個參考文獻將 MIB 描述為透過 SNMP 存取並由 OIDs 處理的分級排列的虛擬資料庫。SnmpWalk 是一個正確的工具，因為它走過 SNMP MIB 樹並返回裝置識別符號，聯絡資訊，介面，計數器等被曝光的管理資料，以及其他基於 OID- 的值。 Red Team 參考也顯示用於列舉 SNMP 曝光資訊的實用 snmpwalk 用途， 如服務，開放埠， 已安裝軟體， 使用者， 以及共享檔案。選項 A。 SoftPerfect Network Scanner 是不正確的，因為它是一個一般的網路掃描工具，而不是所描述的特定命令列 SNMPMIB traversal 工具。選項 B。 Wireshark 是不正確的，因為Wireshark 主要用於封包擷取和流量分析。 問題具體表示傑森不想被動地觀察流量。選項 C。 Nmap 是不正確的，因為Nmap 可以進行掃描和一些 SNMP 相關的 NSE 檢查，但要求是系統穿越 SNMP 管理物件樹並重定向完整的輸出。選項D。 SnmpWalk 是正確的，因為它的設計是走 SNMPMIB 分級，並蒐集已曝光的 SNMP 資料以供審查或自動處理。因此，最好的答案是 D。 SnmpWalk。","s":"tool"},{"n":32,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A Certified Ethical Hacker (CEH) is auditing a company's web server that employs virtual hosting. The server hosts multiple domains and uses a web proxy to maintain anonymity and prevent IP blocking. The CEH discovers that the server's document directory (containing critical HTML files) is named \"certrcx\" and stored in /admin/web. The server root (containing configuration, error, executable, and log files) is also identified. The CEH also notes that the server uses a virtual document tree for additional storage. Which action would most likely increase the security of the web server?","o":["Moving the document root directory to a different disk","Regularly updating and patching the server software","Changing the server's IP address regularly","Implementing an open-source web server architecture such as LAMP"],"a":[1],"e":"CEH 網路指南 伺服器 硬化的控制元件會減少最廣泛威脅的可開發條件。在模糊路徑時(例如“ certrcx” 等不尋常的目錄名稱或儲存)\"/admin/web\") \" 下的內容可能略為減緩偶然發現的速度，CEH 強調透過模糊來保證安全不是一個可靠的控制。如果攻擊者能夠識別出伺服器根，檔案根，以及虛擬目錄結構(透過錯誤的設定，目錄清單，出錯洩漏，備份曝光，或已知-path 列舉)，那麼真正的風險就會在網路伺服器，模組，庫，和下層 OS 中變成無標的弱點。定期更新並補上伺服器軟體是最直接，影響最大的對策，因為它會經常地關閉已知的弱點攻擊者(RCE，權限提升，auth 繞行，路徑穿行，請求走私等)。 CEH 材料還強調虛擬託管擴充套件了攻擊面(多站點，共享服務，共享錯設定)， 使系統的修補程式和設定管理更加重要。選項 A(將檔案根移到不同的磁碟)可能有助於組織，在某些情況下，還有助於恢復規劃，但不會從本質上降低弱點。選項 C(改變 IPs)不是一個安全控制；它可能會使封存清單複雜化，但不會解決潛在的弱點。 選項 D(使用 LAMP)是一個建築選擇，而不是一個安全措施本身--如果設定不當或沒有標註，開源堆疊仍然不安全。因此，CEH 對接的最佳做法是定期修補程式和更新。"},{"n":33,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"You are part of the red team assigned to evaluate the physical and social vulnerabilities of a government contractor's office located in a metropolitan business hub. During your pretexting phase, you decide to simulate the role of a third-party IT technician. Upon arrival, the receptionist allows you entry without verification, assuming you are there for scheduled printer maintenance. While moving through the workspace, you casually observe open terminals, unattended printouts, and discarded sticky notes at workstations. You later report several user credentials and partial access details acquired during this visit. Which social engineering technique does this scenario best illustrate?","o":["Shoulder Surfing","Eavesdropping","Impersonation","Dumpster Diving"],"a":[2],"e":"正確答案是 C。 Impersonation。 維基語錄連結:名人名言 - 文學作品 - 諺語 - 諺語 - 諺語 - 諺語 - 諺語情節的核心行動是評估者假扮第三方 IT 技術員以獲得信任和物理存取。 符合 CEH 社交工程材料將冒充定義為社交工程攻擊者假裝某人或他/她不是的東西的一種技術，如員工，有效使用者，修理工，執行人員，服務檯人員，或 IT 安全專家等。 這可導致實際進入受禁區並披露敏感資訊，包括認證資訊。選項 A。 肩膀衝浪是不正確的，因為肩上衝浪具體涉及瀏覽使用者的肩部以觀察認證資訊或敏感活動。 雖然評估者觀察環境，但取得進入的主要技術是假冒。選項 B。 竊聽是不正確的，因為竊聽涉及隱蔽地傾聽談話或通訊。選項 D。 Dumpster Diving 是不正確的，因為 Dumpster Diving 需要透過垃圾或被丟棄的材料搜尋有用的資訊。 上面提到了粘性筆記和列印，但定義技術是假定的資訊科技技術員身分。因此，最好的答案是 C。Imperation。","s":"term"},{"n":34,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"In downtown Chicago, Illinois, security analyst Mia Torres investigates a breach at Windy City Enterprises, a logistics firm running an Apache HTTP Server. The attacker exploited a known vulnerability in an outdated version, gaining unauthorized access to customer shipment data. Mia ' s analysis reveals the server lacked recent security updates, leaving it susceptible to remote code execution. Determined to prevent future incidents, Mia recommends a strategy to the IT team to address this exposure. Which approach should Mia recommend to secure Windy City Enterprises ' Apache HTTP Server against such vulnerabilities?","o":["Conduct an extensive risk assessment to determine which segments of the network are most vulnerable or at high risk that need to be patched first","Use a dedicated machine as a web server","Block all unnecessary ports, ICMP traffic, and unnecessary protocols such as NetBIOS and SMB","Eliminate unnecessary files within the jar files"],"a":[2],"e":"最好的答案是遮蔽所有不必要的埠，ICMP 流量，以及 NetBIOS 和 SMB.CEH 網頁伺服器硬化指導等不必要的協定強調透過對網路操作不需要的不必要的服務和協定的去功能化或過濾來減少網際網路化伺服器的攻擊面。 在情境中，Apache 透過過時的弱點被破壞，但答案選項要求列出的選擇中採用最優的硬化策略。 選項 C 透過將被曝光的網路服務降到最低，並遮蔽在網路上不相關或有風險的協定來體現標準伺服器-硬化的做法。 專用機可以支援角色的分離，但不能直接解決服務曝光問題。 風險評估對於確定優先順序是有用的，而不是作為即時控制本身。 消除罐子檔案中不必要的檔案並不是一個標準的 Apache 特定硬化措施。 CEH 材料一致建議透過關閉不必要的埠，取消多餘的協定，限制可達到的服務，以及除修補程式外減少總體的攻擊面來硬化網路伺服器。 在現有的備選辦法中，最適當的安全建議是堵塞不必要的埠和協定。"},{"n":35,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"John, a penetration tester at a Los Angeles-based online gaming company, is analyzing the company ' s cloud infrastructure after a recent security breach caused unexpected downtime and delayed alerts. His investigation reveals that the attackers remained undetected, due to the absence of mechanisms that track function-level activity and capture anomalous events. The backend architecture for matchmaking and in-game purchases is serverless, increasing the importance of robust security measures. So, which cloud computing threat should John prioritize to prevent similar breaches?","o":["Insufficient logging and monitoring","Privilege escalation","Loss of governance","Side-channel attacks"],"a":[0],"e":"記錄和監測不足是最直接的威脅。 在符合 CEH 的雲安全概念中，能見度是基礎性的:沒有適當的遙測，安全小組無法及時發現、調查或應對惡意活動。 這個問題明確指出攻擊者\"仍然被察覺\"，因為組織缺乏追蹤函式級活動和捕捉異常事件的機制。 在無伺服器架構中，這種能見度差距可能特別有害，因為沒有傳統的伺服器可供防禦人員使用到日誌輸入，許多安全訊號必須從雲源蒐集。來源，如函式引用日誌，API 閘道器日誌，身分事件，以及集中監測管道等。雖然權限提升是一個常見的雲層威脅，但問題的根源並沒有被描述為過度的許可或角色濫用；而是缺乏偵測能力。 治理的喪失指政策薄弱，帳戶管理不當，對雲層資源缺乏控制，這可能間接造成但並非所描述的直接失敗。 側道攻擊是專門性的，與沒有發出警報和沒有操作遙測的證據不相匹配。 CEH 指導強調實施集中記錄，持續監測，提醒，異常偵測作為核心控制。 對於沒有伺服器，這包括捕獲詳細的函式執行日誌，追蹤，身分和存取事件，並將其納入 SIEM/SOAR 工作流程。 有效的監測能夠迅速發現異常的援引模式、可疑的 API 電話、不尋常的資料存取以及持續的嘗試--減少停留時間並防止小的妥協成為主要中斷。","s":"term"},{"n":36,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"Multiple internal workstations and IoT devices are compromised and transmitting large volumes of traffic to numerous external targets under botnet control. Which type of denial-of-service attack best describes this situation?","o":["An attack where compromised internal devices participate in a botnet and flood external targets","An attack relying on spoofed IP addresses to trick external servers","A direct botnet flood without spoofing intermediary services","An internal amplification attack using spoofed DNS responses"],"a":[0],"e":"這種情境代表了 CEH v13 網路攻擊中描述的以殭屍網路為基礎的分散式阻斷服務(DDoS)攻擊。 入侵後的內部裝置成為了殭屍網路的一部分並被用於向外目標發動攻擊。 CEHv13 指出，botnet 經常包括 IoT 裝置和員工工作站，使內源 DDoS活動成為嚴重關切。"},{"n":37,"c":"雲端運算","ce":"Cloud Computing","t":"short","q":"A company's customer data in a cloud environment has been exposed due to an unknown vulnerability. Which type of issue most likely led to the incident?","o":["Side-channel attack on the hypervisor","Denial-of-Service (DoS) attack on cloud servers","Brute-force attack on user passwords","Exploitation of misconfigured security groups"],"a":[3],"e":"在 CEH 的雲端運算模組中，雲資料曝光最常見的現實世界原因之一是設定錯誤，尤其是過於寬鬆的網路存取控制。Cloud 平台通常使用安全組/防火牆規則/網路 ACLs 等構造來定義出入境存取。 CEH 強調，將敏感服務(資料庫，儲存端點，管理員面板)曝光到公共網際網路上--是否透過\"0.0.0.0/0\"規則， 港口過於寬廣，或者行政存擷取乎意料--往往導致未經授權的進入和資料洩漏，即使沒有尖端的開採鏈。因此，選項 D 最有可能，因為設定錯誤的安全小組可以直接暴露客戶資料儲存或管理介面，從而透過正常的連通性，而不是利用一個罕見的超視星等缺陷來使資料被竊取。選項 A(副監督員側道攻擊)是先進而不太常見的；它通常需要高攻擊能力和這裡沒有暗示的條件。 選項 B(DoS)影響可用性，而不是機密性，因此它不能最好地解釋資料暴露。 選項 C(Brute force points)是可能的，但問題強調。雲層環境中的\"未知弱點\"--CEH 教學在雲層事件中常被設定錯誤或無控制的曝光，而不是單獨認證猜想。 CEH 的對策包括最低優先安全組規則，分塊，持續設定監測，雲安全態勢管理，以及審計被公開曝光的資源。","s":"term"},{"n":38,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"This type of security test might seek to target the CEO ' s laptop or the organization ' s backup tapes to extract critical information, usernames, and passwords.","o":["Stolen equipment","Insider attack","Physical entry","Outsider attack"],"a":[0],"e":"正確答案是 A.被竊裝置。 在 CEH 道德駭客方法中，\"被竊裝置\"是一種道德駭客模式，它模擬了重要組織使用者擁有的膝上型電腦等重要資訊資源的被竊取，然後將該資產提供給道德駭客評估。這些是敏感資產的經典例子，這些資產可能包含被快取的認證資訊、機密檔案、密碼雜湊、VPN 簡介、電子郵件檔案或製作資料的備份。 本測試評價了全盤加密，強認證，安全備份處理等保護，以及儲存資料控制是否有效。 \"物理入門\"側重於進入和損害組織的設施或 ICT 基礎設施，而\"內線攻擊\"模擬一個信任的內部使用者濫用存取。 \"外線攻擊\"通常代表外部威脅。 由於焦點是被竊取的膝上型電腦和備份媒體，因此最好的 CEH 回答是被竊取的裝置。","s":"term"},{"n":39,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"A technology consulting firm in Portland, Oregon began experiencing repeated topology recalculations across its switching infrastructure. Shortly after a newly connected device came online in a conference room, spanning-tree convergence events were triggered across multiple distribution switches. Engineers determined that the access-layer interface connected to that device was influencing path-selection decisions, introducing a more favorable bridge priority value into the environment and affecting the established hierarchy. To preserve the intended switching structure and prevent unauthorized devices from altering root selection decisions, which control should be employed?","o":["Configuring Loop Guard on non-designated ports","Enabling BPDU Guard on edge ports","Applying Root Guard on designated interfaces","Activating UDLD on uplinks"],"a":[2],"e":"正確答案是 C。 在指定的介面上應用根守護。該情境描述一個未經授權或無意傳送上等橫跨樹木資訊從而影響根橋選擇的裝置。 Root Guard 是專門設計來防止一連接埠接受上等的 BPDU，這可能導致一未經授權的一交換器成為根橋或改變預定的地層 2 地貌。一個相關的切換引用稱: root Guard on group 交換器下行鏈路可以確保存取交換器不能傳送優異的BPDU 來挑戰 group 交換器的根狀態，從而保持了可預期的 STP 根位置。選項 A。 迴圈後衛是不正確的，因為迴圈後衛保護不漏 BPDU 和迴圈條件，而不是未經授權的上等 BPDU 試圖影響根選。選項 B。 BPDU Guard 對 PortFast/edge 埠有用，因為它在收到任何 BPDU 時會禁用一連接埠。 然而，問題特別側重於儲存根選擇並阻止上級橋優先順序資訊改變STP 分級，這是根 Guard 的目的。選項 D。 UDLD 是不正確的，因為 UDLD 偵測出單向連結故障，而不是惡意或意外的STP 根操縱。因此，最好的答案是 C。 在指定的介面上應用根守護。","s":"term"},{"n":40,"c":"社交工程","ce":"Social Engineering","t":"long","q":"During a social engineering simulation at BrightPath Consulting in Denver, ethical hacker Liam emails employees a message that appears to come from the company's security team. The email urgently warns that \"all systems will shut down within 24 hours\" unless staff download a patch from a provided link. The message is deliberately false and contains no actual malware, but it causes confusion and prompts several employees to call IT for clarification. Which social engineering technique is Liam demonstrating?","o":["Spam","Baiting","Hoax","Pretexting"],"a":[2],"e":"正確答案：惡作劇（Hoax）。CEH 的社交工程教材指出，Hoax 是虛假警告或捏造訊息，目的在欺騙使用者相信有緊急威脅或異常狀況。即使訊息未包含真正的惡意軟體或可運作的弱點利用，攻擊者仍可能藉此製造混亂、影響行為或引發不必要的反應。\n\n本題中，Liam 發出虛假資安警示，聲稱員工若不下載修補程式，所有系統就會關閉。訊息刻意欺騙、製造恐慌，並使員工聯絡 IT，完全符合 Hoax。Spam 只是未經要求的大量訊息；Baiting 仰賴具吸引力的提議或物品；Pretexting 則以虛構情境取得資訊或存取權。由於本題是刻意捏造的營運警告，最佳分類為 Hoax。","s":"term"},{"n":41,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"An ethical hacker conducting an authorized assessment of a multinational advisory firm begins collecting intelligence exclusively from publicly accessible online platforms where employees share professional background details and engage in industry-related discussions. By correlating individual role descriptions, publicly endorsed technical competencies, collaborative conversations referencing internal initiatives, and recurring terminology used to describe projects and departments, the tester develops a structured view of reporting relationships, identifies commonly deployed technologies, and infers internal naming conventions. From a reconnaissance methodology perspective, which technique is being applied?","o":["Footprinting through Social Networking Sites","Footprinting through Internet Research Services","Footprinting through Social Engineering","Footprinting through Search Engines"],"a":[0],"e":"正確答案是 A。 透過社交網路網站進行足跡。設想題目描述了從平台蒐集情報的情況，在這些平台中，員工發表了專業簡介、技術能力、工作場所關係、專案參考書和組織術語。這是透過社交網站足跡的典型例子。 CEH 偵察 材料透過社交網路網站識別出足跡是一種具體的足跡方法。 它還解釋社交網路平台可以提供個人細節，工作細節，技術相關資訊，員工名單，活動，興趣，以及業務性質等資訊。 這直接與情境對僱員簡介、技能、談話和術語的使用相匹配，從而推斷出內部結構和技術。選項 B。 透過網際網路研究服務進行足跡是不正確的，因為這通常是指使用線上查詢服務，商業情報網站，公共目錄，或者專門的研究平台，而不是員工社交網路活動。選項 C。 透過社交工程進行足跡是不正確的，因為情境不涉及操縱或欺騙人們透露資訊，資訊被動地從公開的簡介和討論中蒐集。選項 D。 透過搜尋引擎進行足跡是不正確的，因為情境並不主要描述 Google/Bing 搜尋操作員或快取搜尋結果，它側重於社交網路平台。因此，最好的答案是透過社會網路網站進行足跡。","s":"term"},{"n":42,"c":"密碼學","ce":"Cryptography","t":"mid","q":"A penetration tester submits altered ciphertexts to a web server and pays close attention to how the server responds. When the server produces different error messages for certain inputs, the tester starts to infer which inputs result in valid internal processing. Which cryptanalytic method is being used in this scenario?","o":["Exploit padding error feedback to recover data","Compare traffic timing to deduce the key","Flip bits randomly to scramble the decryption","Inspect randomness across multiple sessions"],"a":[0],"e":"pading oracle 攻擊利用在錯誤地加法密文提交時揭示出錯誤反應差異的系統。 CEH 解釋道，這些變相使得攻擊者可以反覆地確定有效的地墊位元組並最終在不知曉金鑰的情況下解密或修改加密資料。","s":"term"},{"n":43,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"You perform a network scan using ICMP Echo Requests and observe that certain IP addresses do not return Echo Replies, while other network services remain functional. How should this situation be interpreted?","o":["The scanned IPs are unused and available for expansion","The lack of replies indicates a major breach","A firewall or security control is blocking ICMP Echo Requests","The non-responsive IPs indicate severe congestion"],"a":[2],"e":"根據 CEH v13 網路掃描和列舉，ICMP 回聲請求(平)通常被防火牆和入侵預防系統過濾來減少網路偵察的曝光。 當 ICMP回聲回應沒有返回但其他服務仍然執行時，最可能的解釋是 ICMP 過濾，而不是主機的無法取得或妥協。 CEH v13 明確規定，許多組織設定了防火牆來阻斷 ICMP 回聲請求，同時允許其他 ICMP 型別或更高層的協定。 這種做法有助於防止攻擊者在偵察階段輕鬆地對映活的宿主。其他選項不正確，因為:未使用 IPs 不一定有主動服務。違反規定通常會造成額外的症狀。網路擁堵會影響多個協定，而不僅僅是 ICMP。因此，被阻的 ICMP 是正確的解釋。"},{"n":44,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A state benefits processing platform in Sacramento, California, implemented a multi-step identity verification process before granting access to sensitive citizen records. During a controlled assessment, security analyst Daniel Kim observed that by altering specific request parameters within the transaction sequence, it was possible to bypass an intermediate verification stage and retrieve restricted account data. Further analysis revealed that the authentication workflow advanced through sequential client-driven interactions, but the server did not enforce strict validation of completion for each required stage before granting access. Based on the scenario, which vulnerability classification best describes the issue identified?","o":["Poor Patch Management","Design Flaws","Application Flaws","Misconfigurations / Weak Configurations"],"a":[1],"e":"正確答案是 B。 Design Flaws。這個問題是由應用程式的工作流程邏輯的缺陷所引發的。 平台依賴於多步驟身分驗證序列， 但是伺服器沒有適當強制完成每個需要的階段。 這不僅僅是一個缺失的修補程式或設定問題； 它是認證工作流程建構過程中的邏輯/design 的弱點。 符合 CEH 的弱點材料將設計缺陷歸類為涉及加密，資料驗證，邏輯缺陷，以及類似的系統缺陷。 CEHWeb 應用程式材料還解釋，在應用程式如何設計功能和如何透過交易被利用方面，可能存在業務邏輯缺陷。篡改或不完整的工作流程行為驗證選項 A。 差的修補程式管理是不正確的，因為這一弱點沒有被描述為一種已知的未標出的弱點。選項 C。 應用法則相關，但更精確的分類是設計或業務邏輯缺陷，因為工作流程本身未能強制實施所需的核查階段。選項 D。 設定錯誤/設定薄弱不正確， 因為問題不是不安全的伺服器設定或預設設定造成的。選項 B。 設計缺陷是正確的，因為根弱點是缺陷的認證工作流程邏輯。因此，最好的答案是 B。 Design Flaws。","s":"term"},{"n":45,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"A penetration tester is tasked with compromising a company's wireless network, which uses WPA2-PSK encryption. The tester wants to capture the WPA2 handshake and crack the pre-shared key. What is the most appropriate approach to achieve this?","o":["Execute a Cross-Site Scripting (XSS) attack on the router ' s admin panel","Use a de-authentication attack to force a client to reconnect, capturing the WPA2 handshake","Perform a brute-force attack directly on the WPA2 encryption","Conduct a Man-in-the-Middle attack by spoofing the router ' s MAC address"],"a":[1],"e":"CEH 訓練概括了攻擊 WPA2-PSK 網路的標準方法:抓取 4 向握手並嘗試對預共享鍵進行離線破解。 強迫握手生成最可靠的方法是使用 Aireplay-ng 等工具進行去驗證攻擊。 這次攻擊瞬間斷開了一條無線使用者端，迫使它與存取點重新連線。在此次再校正期間， AP 和使用者端交換了離線破解所需的 4 道握手封包。 CEH 強調，WPA2 加密本身不能直接被蠻橫地強制；攻擊者必須獲得握手，然後在離線時應用字典或蠻橫地力攻擊。 嘗試 XSS 或路由器欺騙不捕捉握手，與 WPA2金鑰擷取無關。 脫口秀也是經典無線攻擊向量描述的廣泛存在於 CEH 中，因為它是有效的，不需要與 加密 演算法進行互動，並且不管 AP 的密碼句的強度如何都有效。一旦握手， Hashcat 等工具就被用來嘗試金鑰恢復。"},{"n":46,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"A Windows system shows LSASS memory access by unknown processes. What attack is likely?","o":["SQLi","XSS","Credential dumping","DoS"],"a":[2],"e":"正確答案是 C，因為 LSASS，即\"本機安全域分系統服務\"，是一個 Windows 程序，負責認證相關操作。 CEH 系統黑克概念連線了 LSASS 存取，試圖從記憶體中擷取認證資訊，密碼雜湊，快取的登入資料，和克伯羅斯票證。 被引用的符合CEH 指南解釋說， Windows 在一個使用者登入時將密碼雜湊儲存在儲存器中，這些雜湊裝入 LSASS，負責使用者認證。它還指出，Mimikatz 等工具可以擷取明文密碼，雜湊，PINs，和 Kerberos 票。從記憶體中取得資訊。紅隊材料類似地連結了 LSASS 程序傾銷和 Mimikatz 分析，因此，存取 LSASS 記憶體的未知程式強烈表明認證資訊傾銷。 SQLi 和 XSS 是Web 應用程式攻擊，而 DoS 的目標是可用性，而不是認證機密。","s":"term"},{"n":47,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"After responding to an alert involving unauthorized access to payroll data, forensic analyst Jason Miller traces the breach to a Windows workstation previously used by a temporary staff member in Chicago. While analyzing the event timeline, Jason identifies a non-elevated process that launched a signed Microsoft binary -- one of several auto-elevate executables such as fodhelper.exe, eventvwr.exe, or sdclt.exe -- which resulted in execution of unauthorized code without prompting the user. Registry analysis reveals manipulation of shell- related keys under the current user hive, redirecting the trusted binary to invoke a malicious payload. Which technique most likely enabled the privilege escalation?","o":["Kernel Exploitation","Scheduled Task","UAC Bypass","DLL Hijacking"],"a":[2],"e":"證據指向了使用者帳戶控制繞道。 在 CEH 覆蓋到 Windows 權限提升，UAC 是一個旨在防止特權無聲高漲的保護機制，通常在某項行動需要行政權時會提示使用者。 然而，某些 Windows 二進位是\"自動操作\"(通常信任，簽名的微軟可執行檔案)，並且可以在特定條件下以更高的權限執行，而不顯示 UAC 的快取。 攻擊者濫用了這種行為，操縱使用者-writable 登錄位置--通常在目前的使用者蜂巢下--來影響這些被信任的二進位如何發射其他元件。劇情描述的正是這個模式:一個非自帶程序啟動一個自動自帶可執行檔案，如 fodhelper.exe，eventvwr.exe，或 sdclt.exe 等，系統執行未經授權的程式碼而不迅速。 關鍵的法證線索是\"在當前使用者蜂巢下操縱外殼相關金鑰\"，這是被劫持檔案關聯或外殼開啟命令的 UAC 繞行技術的標誌，因此被信任的二進位引用了由攻擊者控制的酬載來代替預定的系統動作。 由於修改發生在 HKCU 中，因此常常可以沒有管理員權限地進行，從而吸引了隱形高地。其他選項也不匹配。 克內爾開發涉及濫用 OS 核心弱點，不會依賴於 shell 登錄 劫持。 排定的任務通常會留下任務文物，並且是一種持久性/執行方法，而不是這種特定的自動- elevate transferation actory。 DLL 劫持側重於為裝入惡意 DLL 的搜尋- 命令濫用，而不是將 shell 金鑰重定向綁在 UAC 自動啟動上。","s":"term"},{"n":48,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"Which approach should an ethical hacker avoid to maintain passive reconnaissance?","o":["Direct interaction with the threat actor","WHOIS and DNS lookups","Anonymous browsing via Tor","Using the Wayback Machine"],"a":[0],"e":"CEH v13 將被動偵察定義為不與目標直接互動或提醒它們而蒐集資訊，目標是在從公開來源蒐集情報時保持不被發現。直接與論壇上的威脅行為者進行互動--即使是假名--構成積極參與。 CEH v13 警告說，這種互動有暴露、歸屬和法律複雜的風險。敵人，讓他們改變行為，甚至報復。 WHOIS 擷取，DNS 查詢，存檔網頁內容，以及匿名瀏覽都是 CEHv13 中認可的被動技術。 這些方法不通知目標，留下最小的痕跡。因此，應避免選項 A，以保持低調。"},{"n":49,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"What is data exfiltration?","o":["Extraction","Deletion","Encryption","Corruption"],"a":[0],"e":"正確答案是 A，因為資料過濾是指未經授權從目標系統，網路，資料庫，雲端儲存，或端點中擷取，轉移，或移除資料。在 CEH 系統駭客和後滲透概念中，在攻擊者獲得存取權並可能升級特權後，攻擊者可能試圖存取受保護資源並悄悄地擷取敏感資料。已取回的指南材料描述被解密為一個階段，一個具有高調或不受限制存取的攻擊者可以存取被保護的資源並\"安靜地擷取資料\"，修改或刪除敏感檔案，或取得設定資訊，因此，最匹配資料解密的關鍵詞是\"被解密\"。 選項 B，刪除，指去除資料。 選項 C，加密，指將可讀資料轉換為密文，常見於勒索軟體。 選項 D，腐敗意味著破壞或改變資料，使其變得不可靠或無法使用。 這些行為可能在攻擊期間發生，但並不界定過濾。","s":"term"},{"n":50,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"Which advanced evasion technique poses the greatest challenge to detect and mitigate?","o":["Covert channel communication using IP header fields","Honeypot spoofing","Polymorphic malware","Packet fragmentation evasion"],"a":[0],"e":"隱蔽通道通訊是 CEH v13 逃逸技術中描述的最複雜的逃逸技術之一。 透過將惡意資料嵌入未使用或很少被檢查的協定欄位(如 IP 頭)，攻擊者可以繞過防火牆，IDS，並完全繞過 IPS 系統。不同於多型惡意軟體(可選 C)，它仍然可以使用行為分析偵測，隱蔽通道將無縫地混合成合法流量。 封包分解(可選 D)是眾所周知的並經常被減輕。 蜜罐欺騙(可選 B)是罕見的並具有防禦性質的。 CEH v13 強調隱蔽通道困難，因為:它們沒有違反協定規格他們逃避基於簽名和狀態的檢查它們是正常流量的探測出隱蔽的通道往往需要深入的協定分析和統計流量檢查，使得這些通道極難被緩解。因此，選項 A 是正確答案。"},{"n":51,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"A penetration tester is tasked with identifying vulnerabilities on a web server running outdated software. The server hosts several web applications and is protected by a basic firewall. Which technique should the tester use to exploit potential server vulnerabilities?","o":["Conduct a SQL injection attack on the web application ' s login form","Perform a brute-force login attack on the admin panel","Execute a buffer overflow attack targeting the web server software","Use directory traversal to access sensitive configuration files"],"a":[2],"e":"過時的伺服器軟體往往含有記憶體腐敗缺陷。 CEH 指出，緩衝區溢位開發是破壞可被害的伺服器二進位的主要方法，允許遠端程式碼執行。 這種方法針對的是基礎服務而不是應用層輸入驗證問題。"},{"n":52,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"A financial clearinghouse in Newark, New Jersey, initiated a structured vulnerability review across its enterprise servers. The scanning platform was configured to collect detailed information about installed updates, local security configurations, and system policy settings on each target machine. The resulting report contained granular host-level findings, including configuration inconsistencies and patch gaps that required direct system-level inspection to obtain. Based on the activity described, what type of vulnerability scanning is being performed?","o":["Automated Scanning","Non-Credentialed Scanning","Application Scanning","Credentialed Scanning"],"a":[3],"e":"正確答案是 Creditiented Scanning。 CEH 弱點評估指導解釋，Creditientied scan 在目標系統上使用授權登入存取，使掃描器能夠從內部檢查機器，精確度和細節水平要高得多。 因此，認證掃描可以識別安裝的更新，本機政策設定，設定不一致，檔案權限，登錄問題，以及從外部網路角度看並不總是可見的修補程式弱點。 這個問題特別提到了需要直接進行系統級檢查的顆粒主機級發現，這是一個強有力的指標，表明在查詢目標系統時使用了有效的認證資訊。 相比之下，非信譽掃描依賴於遠端觀測和網路可見特性，因此一般不能提供同深度的內部主機資訊。 Automatic specking is too a label，。 和應用掃描僅限於應用層目標，而不是主機作業系統姿態。 CEH 材料一致地指出，認證掃描產生更準確的弱點結果並減少誤判警示，因為掃描器可以直接在目標機上驗證軟體版本，修補程式狀態，和安全設定，而不僅僅是從橫幅或被曝光的服務中推斷出。","s":"term"},{"n":53,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"A threat intelligence review at a manufacturing firm in Pittsburgh, Pennsylvania, revealed repeated external queries targeting the organization's public name servers. Although no intrusion occurred, analysts observed that the queries appeared designed to systematically map internal naming conventions and infrastructure patterns. The security team determined that the issue was not excessive traffic volume but rather the exposure of internal namespace details through responses handled by the same server used for both internal and external resolution. To reduce the risk of disclosing sensitive structural information to outside systems, the team redesigned their DNS deployment. Which countermeasure best addresses the risk described in this scenario?","o":["Randomizing DNS Source Ports and Query Identifiers","Implementing a Split DNS Architecture","Implementing Rate Limiting on DNS Servers","Enabling DNS Logging and Anomaly Detection"],"a":[1],"e":"正確答案是 B。 執行 Split DNS Architecture。問題在於同為 DNS 的基礎設施同時用於內部和外部的名稱解析，導致內部名稱空間細節被外部曝光。 Split DNS 將內部和外部的 DNS 檢視分開，以便外部使用者只接收公共記錄，而內部用戶端可以解決私人主機名稱和內部服務記錄。 符合 CEH 偵察材料解釋道，足跡和 DNS 相關資訊的蒐集可以揭示網域名稱，名稱空間，IP 位址，以及可用於策劃攻擊的網路細節。它還描述 DNS 和 WHOIS 查詢是足跡蒐集目標網路的地貌和基礎設施資訊時使用的方法。 分拆出 DNS 直接透過阻止公用 DNS 查詢返回內部命名資料來減少這種曝光。選項 A 不正確 因為源 連接埠 和查詢 ID 隨機化幫助減少 DNS 欺騙/快取-中毒風險， 而不是名稱空間的披露。選項 C 是不正確的，因為速率限制控制查詢量，而問題在於敏感的資訊曝光。選項 D 對偵測和調查很有用，但並不妨礙外部客戶收到內部 DNS 的細節。因此，最好的答案是 B。 執行 Split DNS Architecture。"},{"n":54,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"On 10th of July this year, during a security penetration test at IntelliCore Systems in Raleigh, North Carolina, the ethical hacking team evaluates the stability of the company's file-sharing server. Sofia crafts and transmits a sequence of oversized, malformed packets designed to test how the server handles unexpected input. Shortly after, the system begins crashing intermittently due to processing failures triggered by these anomalous network requests. The security team onsite is tasked with identifying the root cause behind the packet-induced instability and attributing it to a known DoS tactic. Which of the following best explains the technique Sofia used to trigger the server crashes?","o":["ICMP Flood Attack","Ping of Death PoD","Smurf Attack","ACK Flood Attack"],"a":[1],"e":"Ping of Death 是一種經典的阻斷服務技術，攻擊者傳送出超大小或畸形的 IP 封包，重整時超過允許的最大尺寸。 在 IP網路中，最大封包大小為 65,535 位元組。 歷史上，攻擊者透過傳送一系列 IP 碎片來利用破碎，這些碎片被目標重新組裝後，導致封包大於允許的極限或產生無效緩衝條件。 脆弱的系統可能崩潰，重啟，或變得不穩定，因為網路堆疊處理不當重新組裝過程或無法正確驗證封包長度和結構。劇情與這種行為完全吻合:索菲亞傳送\"超大小，畸形的封包\"和伺服器\"由於處理失敗而間歇地傳播\"。 該症狀比純流量更符合畸形-封包處理缺陷。 ICMP 泛洪和 ACK 泛洪是壓過頻寬或接通處理能力的體積或資源耗竭攻擊，一般會降低效能，而不是直接由畸形的封包解析造成相撞。 藍精靈攻擊是一種以放大為主的ICMP 攻擊，使用廣播位址將流量乘以受害者；同樣，它涉及體積，而不是被設計出畸形的封包觸發瞭解析失敗。 CEH指導強調 PoD 風格的攻擊利用了不適當的封包驗證和再組裝邏輯。 現代系統一般被修補程式，但維護不良的裝置，遺留的 OS 堆，一些嵌入式執行在被出讓出畸形分解和再組裝邊緣的情況下仍然會表現出不穩定。","s":"term"},{"n":55,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"A vulnerability has a score of 9.8. What does this rating help explain?","o":["It quantifies impact and exploitability to prioritize remediation","It measures authentication errors","It generates exploit payloads","It classifies attacks qualitatively"],"a":[0],"e":"這指的是 CVSS(共同弱點分紅系統)，CEHv13 確定為確定弱點優先順序的行業標準,9.8 分表明臨界嚴重性，結合了可開發性、影響、所需特權和範圍等衡量標準。 CVSS 幫助各組織客觀地確定補救的優先順序，將資源集中用於商業風險最高的弱點，還使技術小組和管理小組之間能夠保持連貫的溝通。選項 B， C， 和 D 錯報 CVSS 功能。 因此， 選項 A 是正確的。"},{"n":56,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"In a highly secure online banking environment, customers report unauthorized access to their accounts despite robust authentication controls. Investigation reveals attackers are using advanced session hijacking techniques to perform fraudulent transactions. Which advanced session-hijacking attack, resembling a scenario-based attack, presents the greatest challenge to detect and mitigate?","o":["Covert Cross-Site Scripting (XSS) attack injecting malicious scripts into banking pages","Man-in-the-Browser (MitB) attack using malicious browser extensions to intercept sessions","Session fixation attack manipulating HTTP session identifiers","Passive sniffing attack capturing encrypted session tokens over unsecured Wi-Fi"],"a":[1],"e":"根據 CEH 系統駭客和 Web 應用安全模組，Man-in-the-Browser(MitB)攻擊屬於最精密和最難偵測的工作階段劫機技術。在 MitB 攻擊中，惡意軟體在被害者瀏覽器內執行，允許攻擊者在認證後攔截，修改，或注入交易。 CEH 檔案強調 MitB攻擊繞道:多要素認證加密的 Cookie HTTPS/TLS 保護由於惡意活動發生在瀏覽器層面，安全控制將交易視為合法。選項B 是正確的。選項 A(XSS)透過內容安全政策可以偵測出。方案 C 透過再生工作階段 ID 來緩解。選項 D 對加密的工作階段無效。 CEH 強調 MitB 攻擊是對線上銀行系統的嚴重威脅。"},{"n":57,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"A compromised admin account is used to disable logging services. What is the attacker attempting?","o":["Anti-forensics","Exfiltration","Recon","Privilege escalation"],"a":[0],"e":"正確答案是 A， Anti-forensics。 破壞管理員帳戶後破壞記錄服務是試圖隱藏證據，防止被偵測，並使以後的調查更難。在 CEH 系統入侵階段中，這與覆蓋軌道一致，攻擊者在存取後刪除或修改證據。 CEH 材料將覆蓋的軌道描述為擦除證據，去除事件日誌，出錯訊息等指標，因此攻擊不易被發現。 它還將失效審計，清除日誌，並操縱日誌列為攻擊者常用的技術。 CEH 駭客方法還解釋說，清除音軌有助於攻擊者透過覆蓋系統，應用程式和相關日誌不被察覺來避免被懷疑。 這不是過濾，因為沒有描述資料被竊取，不是偵察，因為攻擊者沒有蒐集資訊。 它不是權限提升，因為帳戶已經是行政性的，因此，禁用伐木服務最好歸類為防法或覆蓋道。","s":"term"},{"n":58,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"Joe, a cybersecurity analyst at XYZ-FinTech, has been assigned to perform a quarterly vulnerability assessment across the organization ' s Windows-based servers and employee workstations. His objective is to detect issues such as software configuration errors, incorrect registry or file permissions, native configuration table problems, and other system-level misconfigurations. He is instructed to log into each system using valid credentials to ensure comprehensive data collection. Based on this assignment, which type of vulnerability scanning should Joe perform?","o":["Application Scanning","Host-based Scanning","Network-based Scanning","External Scanning"],"a":[1],"e":"正確答案為主機基於 Scanning。 CEH 弱點評估材料解釋出基於主機的掃描側重於伺服器，桌面，工作站等單個系統，意在發現本機安全弱點，包括檔案權限，登錄權限，修補程式問題，設定錯誤，已安裝軟體問題，以及作業系統級別曝光等。問題明確提到 Windows 伺服器和工作站，每個裝置的有效登入，以及登錄設定和本機檔案權限等檢查目標，這些都是基於主機的掃描的經典指標。基於網路的掃描將更加註重暴露的網路服務，傾聽埠，協定行為，以及遠端可見的弱點。 外部掃描涉及來自組織外的網際網路曝光。 應用程式掃描範圍過窄，因為情境並不侷限於特定的軟體應用，而是涵蓋廣泛的系統級別態勢。 CEH 指導經常指出，基於主機的易感掃描可能經過認證，因此掃描器可以詳細檢查每臺機器的內部設定。由於評估以系統特定錯設定和橫跨端點和伺服器的本機安全設定為中心，以主機為主的掃描是最佳分類。","s":"term"},{"n":59,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"What indicates advanced persistent threat behavior?","o":["Long dwell time","Malware spam","One-time exploit","Brute force"],"a":[0],"e":"正確答案是 A， Long lived time。 在 CEH 安全行動和威脅探測概念中，一個高階持久威脅，或 APT，其特徵是高技術，持久性，隱蔽性，以及長期目標。 CEH 相關材料將 APT 描述為不斷竊取資訊的過程，經常以私人組織或政治動機為主。並解釋，\"持久性\"涉及從目標中取得持續的監測和資料，它還列出了 APT 標準，如及時性，意指在偵測和存取目標上花費的時間，以及風險耐受性，指保持未被偵測的能力等。 長期停留時間意味著攻擊者在被發現前在環境中停留了很長一段時間，經常進行內部的偵察，權限提升，橫向移動，認證資訊被竊取，持久性，以及靜悄悄的資料外洩。 Malware 垃圾郵件通常廣泛而吵鬧，一次性的利用缺乏持久性，而野蠻的武力只是一種技術。 因此，長期停留時間最好表明 APT 的行為。","s":"term"},{"n":60,"c":"雲端運算","ce":"Cloud Computing","t":"short","q":"During a routine security audit, administrators found that cloud storage backups were illegally accessed and modified. What countermeasure would most directly mitigate such incidents in the future?","o":["Deploying biometric entry systems","Implementing resource auto-scaling","Regularly conducting SQL injection testing","Adopting the 3-2-1 backup model"],"a":[3],"e":"根據 CEHv13 雲端運算，備份完整性和韌性是雲安全的關鍵組成部分。 3-2-1 備份模式是被廣泛推薦的最佳做法來緩解未經授權的存取，資料腐敗，和勒索軟體相關事件。 3-2-1 規則規定各組織應保持:3 份重要資料儲存在兩種不同的介質型別上 1 份副本存放在外或線下這種做法確保即使一個備份被損壞、被更改或被刪除--如情境所述--但仍可使用清理和可信賴的資料版本進行恢復。 CEH v13 強調，離線或永久備份可大大減少惡意修改的影響。選項 A 注重實體安全，它不保護雲備份。 選項 B 處理可用性，而非完整性。 選項 C 與 Web 應用程式安全相關，而不涉及備份保護。 CEH v13 明確強調備份隔離和冗餘是針對雲資料妥協的關鍵對策，因此，選項 D 是最直接和最有效的緩解戰略。","s":"term"},{"n":61,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"short","q":"An ethical hacker audits a hospital's wireless network secured with WPA using TKIP and successfully performs packet injection and decryption attacks. Which WPA vulnerability most likely enabled this?","o":["Use of weak Initialization Vectors (IVs)","Dependence on weak passwords","Lack of AES-based encryption","Predictable Group Temporal Key (GTK)"],"a":[2],"e":"CEH 檔案解釋到 WPA-TKIP 是一個過渡性安全協定，不使用 AES 加密，取而代之的是以 RC4-為基礎的機制。缺乏以AES 為主的加密使得 WPA-TKIP 容易被注入和回放攻擊。選項 C 是正確的。選項 A 適用於 WEP。選項 B 影響認證，而不是 TKIP 弱點。選項 D 不是主要 TKIP 缺陷。 CEH 建議用 AES 來進行 WPA2/WPA3。"},{"n":62,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"Joe, a cybersecurity analyst at Norwest Freight Services, has been assigned to run a vulnerability scan across the organization ' s infrastructure. He is specifically tasked with detecting weaknesses such as missing patches, unnecessary services, weak encryption, and authentication flaws across multiple servers. His scan identifies open ports and active services throughout the environment, providing a clear map of potential entry points for attackers. Which type of vulnerability scanning best matches Joe ' s assignment?","o":["Network-based Scanning","External Scanning","Application Scanning","Host-based Scanning"],"a":[0],"e":"Joe 的任務最好被描述為基於網路的弱點掃描，因為掃描是在繪製多個伺服器的開放埠和主動服務圖並識別透過網路曝光而可見的弱點，如不必要的服務，網路服務上薄弱的加密設定，以及認證相關缺陷在網路上可以被達到。 基於網路的掃描側重於透過探測主機和服務發現和評價網路可存取的切入點，列舉版本/設定，並將發現與已知的弱點相掛鉤。設想方案強調掃描“識別整個環境中的開放埠和主動服務”，生成“潛在入站點的清晰地圖”。 這是基於網路的掃描的核心成果:一個檢視外部或內部可達到的服務，每次收聽連接埠代表 a 從那裡，掃描器可以偵測出過時的服務版本(包含缺失的修補程式)，不安全的協定(例如弱 TLS 密碼)，預設認證資訊，以及被曝光的行政介面等問題。為什麼其他選項不準確:外部掃描 (B) 是指從組織外圍外進行的掃描，這個情境說他正在掃描整個組織基礎設施，並專注於多個伺服器；它沒有指定\"從網際網路\"，所以\"外部\"並不是最好的分類。應用程式掃描( C) 目標 Web 應用程式 或特定的應用層邏輯(例如， 史克麗 XSS，。 喬的焦點是更廣泛的基礎設施曝光 和 service/連接埠 繪圖。基於主機的掃描(D)通常涉及對主機(patch 庫存，本機設定檔，登錄)的本機認證檢查，而不是主要繪製出多個系統中的埠/services。 而基於主機的埠。掃描很有價值，描述的輸出是網路入點對映。因此，最符合喬任務的掃描型別是 A。 Network-Scanning。","s":"term"},{"n":63,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"Which technique is MOST effective to bypass signature-based IDS?","o":["Obfuscation","Polymorphism","Encryption","Port scanning"],"a":[1],"e":"正確答案是 B，因為基於簽名的 IDS 偵測依賴於匹配已知的位元組模式，字串，酬載結構，或攻擊簽名。 多型性與這個模型相抗衡非常有效，因為它改變酬載的外觀，同時又保留了同一種功能。 符合 CEH 的材料解釋道:IDS 主要透過比較流量與簽名資料庫來工作，而簽名偵測只識別出其簽名存在於該資料庫中的攻擊。 它還說多型外殼編碼透過修改攻擊酬載來逃避 IDS，因此不再與預設的 IDS 簽名相匹配。 Offuscation is a。更廣義的技術，可能包括編碼或格式化的改變，但多型化更直接地旨在擊敗靜態簽名。 加密可以隱藏流量而不受檢查，但這取決於 IDS 是否可以解密或檢查工作階段。 連接埠掃描是偵察，而不是 IDS 繞行。 因此多型化是最精確的 CEH 答案。","s":"term"},{"n":64,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"During a red team engagement against a multinational financial services organization, an ethical hacker conducts network reconnaissance against externally accessible systems. Instead of sending scan traffic directly from the originating assessment machine, the tester routes all reconnaissance packets through an intermediary external system before they reach the target network. When the organization's security team reviews monitoring data, the activity appears to originate from infrastructure unrelated to the tester's actual geographic or organizational location. From a reconnaissance methodology perspective, what is the primary objective of using this intermediary system?","o":["To Establish Persistent Access within the Target Network","To Bypass Authentication Controls Protecting Internal Applications","To Conceal the Or
