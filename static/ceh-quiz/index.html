綁入的越獄中，該裝置在重啟後會一直處於越獄狀態，而不需要電腦。 半串接式的破獄被描述為裝置可以完成啟動和正常功能的中狀態，但修改需要破獄工具來恢復被修補程式的狀態。 \"不需要外部電腦；執行已安裝的破獄應用\"條件使得最好的現代分類半不串接。選項 A。 未接通的破獄是不正確的，因為破獄在重啟後不會自動保持活動。選項 B。 繫繩式的斷接是不正確的，因為不需要外部電腦，而且電話在啟動時不會卡住。選項 C。 半脫衣解圍是接近的， 但半脫衣解圍通常意味著可能需要電腦或外部工具來恢復被解圍狀態。 問題特別說裝置上安裝的脫衣解圍應用程式是在沒有電腦的情況下手動執行的。選項 D。 半無縫的監獄拆解是正確的，因為裝置通常會穿靴子，但必須在當地透過安裝的應用程式重新啟動監獄拆解。因此，最好的答案是 D。 半無縫監獄破解。","s":"term"},{"n":508,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"At a cybersecurity consultancy firm in Boston, senior analyst Amanda Liu is called in to assess a malware outbreak affecting a regional healthcare provider. Despite using updated antivirus tools, the security team notices inconsistent detection across infected endpoints. Amanda discovers that while the malicious behavior is consistent, system file tampering and suspicious outbound traffic, each malware sample has a slightly different code structure and fails traditional hash-based comparison. Static analysis reveals that the underlying logic remains unchanged, but the code patterns vary unpredictably across infections. What type of virus is most likely responsible for this behavior?","o":["Cavity virus","Macro virus","Polymorphic virus","Stealth virus"],"a":[2],"e":"一種多形態病毒被專門設計來改變其程式碼外觀，同時保持相同的基本功能，這與情境完全一致。 在 CEH 術語中，多形態主義允許惡意軟體在每次傳播或執行時會改變其解密程式、指令命令、登記使用、垃圾程式碼插入等綜合元素。 這導致每個例項在二進位級別上看起來不同，產生不同的雜湊和簽名，儘管惡意的酬載和行為保持不變。 這就是為什麼安全小組看到防毒偵測不一致，以及為什麼\"傳統的雜湊比對\"失敗。 關鍵指標是靜態分析顯示\"基本邏輯不變\"，但\"編碼模式變化不可預測\"，這是多型性的標誌:行為保持相通，簽名變化。其他選項也不適合。 腔道病毒通常透過在合法可執行檔案中插入未使用的空間來隱藏，以避免改變總體檔案大小，但不會在本質上產生不可預測的程式碼變體，每次感染。 宏病毒主要針對宏觀化檔案，並透過檔案範本和使用者動作來傳播，此處不建議這樣做。 隱形病毒注重透過擷取系統呼叫並隱藏其存在來逃避偵測，例如返回\"乾淨\"檔案讀取，但不一定會產生許多結構上不同的二進位來打破雜湊匹配。 因此，描述的爆發最可能的原因是多型性病毒。","s":"term"},{"n":509,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"mid","q":"A penetration tester evaluates an industrial control system (ICS) that manages critical infrastructure. The tester discovers that the system uses weak default passwords for remote access. What is the most effective method to exploit this vulnerability?","o":["Perform a brute-force attack to guess the system ' s default passwords","Execute a Cross-Site Request Forgery (CSRF) attack to manipulate system settings","Conduct a denial-of-service (DoS) attack to disrupt the system temporarily","Use the default passwords to gain unauthorized access to the ICS and control system operations"],"a":[3],"e":"操作技術與 ICS 環境經常會出現錯誤設定，如工廠-預設密碼不變。 CEH 將利用預設認證資訊作為直接有效的方法，因為ICS 裝置經常缺乏強大的認證控制。 使用這些內建的認證資訊允許立即擅自進入監管控制，使對手能夠操縱設定，破壞程序，或使關鍵系統的攻擊升級。"},{"n":510,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"As an Ethical Hacker, you have been asked to test an application's vulnerability to SQL injection. During testing, you discover an entry field that appears susceptible. However, the backend database is unknown, and regular SQL injection techniques have failed to produce useful information. Which advanced SQL injection technique should you apply next?","o":["Content-Based Blind SQL Injection","Time-Based Blind SQL Injection","Union-Based SQL Injection","Error-Based SQL Injection"],"a":[1],"e":"此情境清晰地描述了基於時間的盲 SQL 注入的必要性，這是被 CEH v13 Web 應用程式入侵模組所覆蓋的高階 SQL 注入技術。 盲 SQL 注入在應用程式不返回資料庫錯誤或可見輸出時被使用，使得傳統技術無效。根據 CEHv13,時間取光的SQL 注入在下列情況下特別有用: 時間取光的 SQL 注入。後端 資料庫 型別未知錯誤訊息被壓制 UNION 查詢失敗答覆中沒有直接資料。在這個技術中，攻擊者會使用 SLEEP()，WAITFORDELAY，或 BENCHMARK()等特定的函式，故意引入時間延遲的 SQL 語句來注入。 道德駭客隨後觀察應用程式的回應時間，以確定所注入的條件是否真實。例如:' OR IF( 1=1,SLEEP(5)， 0) -如果應用回應被延遲，它確認所注入的 SQL 語句被成功執行。 CEH v13 將這種方法歸類為基於行為的推論，攻擊者透過分析計時差異一次擷取一點資訊。其他選項不正確，因為:基於內容的 Blind SQL 注入 依賴於答案的明顯差異，問題指出這些差異是沒有的。以聯盟為基礎的 SQL 注入需要了解列數和資料型別。基於錯誤的 SQL 注入取決於正在顯示的資料庫錯誤訊息。 CEHv13 強調以\"時間為本\"SQL 注入作為最後手段，但極有效的技術，當處理抑制輸出的硬化應用程式，使其成為一個頻繁的考試測試概念。","s":"term"},{"n":511,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"A Nessus scan reports a CVSS 9.0 SSH vulnerability allowing remote code execution. What should be immediately prioritized?","o":["Apply the vendor patch and reboot during maintenance","Dismiss it as a false positive if unverified","Reroute SSH traffic to another server","Isolate the server, audit it, and apply patches"],"a":[3],"e":"CEH v13 表示，CVSS 分數# 9.0 的弱點是關鍵，需要立即封存。 當遠端程式碼執行有可能時，系統可能已經被損壞。建議的反應是隔離受影響的系統，防止橫向移動，然後在施放修補程式前進行法證審計。 立即修補程式而不隔離可能會提醒攻擊者或破壞證據。因此，備選方案 D 符合 CEH 事件反應最佳做法。"},{"n":512,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"Which of the following is the most important step for the ethical hacker to perform during the pre-assessment?","o":["Hack the web server.","Gather information about the target.","Obtain verbal permission to hack.","Obtain written permission to hack."],"a":[3],"e":"正確答案是 D。 獲得駭客的書面許可。 在 CEH 方法中，駭客和道德駭客之間的倫理差異是授權。在進行任何測試之前，先進行掃描、開發或開發。資訊蒐集開始，道德駭客必須獲得系統所有人的書面批准。 CEH-對齊的滲透測試生命週期在主動測試開始前將接戰規則，客戶要求，範圍定義，法律協定，合同，以及 NDA 等置於攻擊前或準備階段。 書面許可定義了哪些系統可以測試，哪些技術可以被允許測試，當測試可能發生時，誰必須被通知，以及哪些責任保護適用。 口頭許可是不夠的，因為它難以證明，而且可能沒有明確界定法律界限。 在獲得許可前對網路進行駭客伺服器是未經授權的活動，在批准前蒐集目標資訊也可能違反範圍和法律要求，因此，最重要的評估前行動是獲得書面授權。 CEH 考試指導還強調，道德駭客在測試前總是獲得書面許可。","s":"term"},{"n":513,"c":"雲端運算","ce":"Cloud Computing","t":"long","q":"A health-tech startup in Raleigh, North Carolina operates a Kubernetes cluster supporting patient-facing microservices. During an authorized security assessment, a certified ethical hacker reviews internal cluster activity records available to operations personnel. While analyzing these records, the tester notices that authentication artifacts associated with service accounts are recorded within system-generated output. The tester determines that if an individual obtained access to these records, they could reuse the captured authentication material to interact with cluster resources under the same privileges. Which Kubernetes vulnerability best corresponds to this condition?","o":["No Certificate Revocation","Unauthenticated HTTPS Connections","No Non-repudiation","Exposed Bearer Tokens in Logs"],"a":[3],"e":"正確答案：日誌中暴露的 Bearer Token。情境方案說，與 Kubernetes 服務帳戶相關的認證文物出現在日誌或系統生成的輸出中。 如果這些值可以被再利用來存取叢集資源，它們就作為無記名的認證資訊發揮作用。 無記名符號允許擁有者存取，因此在日誌中暴露它會造成嚴重的特權再使用風險。選項 A。 沒有憑證撤銷是不正確的，因為缺陷並不涉及無法撤銷 TLS 或使用者端憑證。選項 B。 未認證的 HTTPS 連線是不正確的， 因為問題不是 HTTPS 連線缺乏認證。 問題在於正在登入有效的認證符。備選辦法 C。 不否認是不正確的，因為不否認涉及證明誰實施了某項行動。選項 D。 日誌中被曝光的熊熊託肯斯是正確的，因為日誌中記錄的服務帳戶無記名符號可能被任何能夠存取這些日誌的人再用。因此， 最好的答案是 D。 被曝光的熊克托克斯在日誌。","s":"term"},{"n":514,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"As an IT security analyst, you perform network scanning using ICMP Echo Requests. During the scan, several IP addresses do not return Echo Replies, yet other network services remain operational. How should this situation be interpreted?","o":["The non-responsive IP addresses indicate severe network congestion.","A firewall or security control is likely blocking ICMP Echo Requests.","The lack of Echo Replies indicates an active security breach.","The IP addresses are unused and available for reassignment."],"a":[1],"e":"CEH 網路掃描模組解釋出:ICMP 回聲請求經常被防火牆，路由器所過濾或被遮蔽，或以主機為基礎的安全控制作為防禦措施來減少偵察曝光。當系統無法回應 ICMP 回聲請求，而繼續正常執行於其他服務時，CEH 表示，這種行為通常意味著 ICMP 流量被遮蔽，而並非主機是被下線或失密。選項 B 是正確的。選項 A 將影響所有服務。備選辦法 C 缺乏輔助指標。備選辦法 D 是推測性的，不可靠。 CEH 強調 ICMP 過濾在被硬化的網路中很常見。"},{"n":515,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a red team assessment at New England Insurance in Boston, ethical hacker Daniel sends a series of spoofed TCP packets carrying the reset flag to a server hosting client applications. As a result, several active sessions between employees and the server are abruptly terminated, causing temporary disruption of legitimate work. Daniel uses this demonstration to highlight how attackers can forcibly tear down sessions without completing a full hijack. Which type of network-level session hijacking technique is Daniel simulating?","o":["UDP Hijacking","RST Hijacking","Blind Hijacking","TCP/IP Hijacking"],"a":[1],"e":"所描述的技術為 RST 劫持，因為攻擊者會用 RST(重置)旗來傳送偽造的 110 封包來強制終止已建立 TCP 工作階段。 在TCP 中，會使用 RST 封包來立即中止連線。 如果攻擊者可以手動看起來屬於已存在的工作階段的封包(匹配了 4-tuple，並使用了情境的序列/acknowledgment 值)，接收到的端點可以接受重置並拆卸連線，這造成了中斷-工作階段的掉落，使用者被斷接，應用程式發生錯誤--而不需要攻擊者完全接管工作階段或注入有意義的應用資料。情境完全匹配: “ 偽造的TCP 封包 攜帶重置的旗子”， 之後是 “ 主動 工作階段..。 abrupt 終止 ”。 這是 RST- 基於 工作階段 中斷的標誌性結果。它經常被作為證明 工作階段 在攻擊者可以在路徑( 或同一網路段) 內進行流量滲透時， 當防禦控制不能充分驗證或保護 工作階段 時， 是多麼的脆弱。為什麼其他選項不正確 :UDP 劫持 (A) 不適用，因為 UDP 是無連線的，沒有 RST 旗或工作階段拆卸機制，如 TCP。盲劫(C)指沒有看到回應的注入流量(猜想序號)，但這裡所問的具體機制是重置-旗終止；\"盲\"可能是如何完成的屬性，而不是被命名的技術。 TCP/IP 劫持(D)是一個更廣泛的類別，包括多種接管方法 或操縱 TCP 工作階段。 這個問題是專門關於使用 RST 封包來殺死 工作階段， 被最確切地稱為 RST 劫持。因此，正確答案是 B.RST 劫持。","s":"term"},{"n":516,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, loT, and OT Hacking","t":"mid","q":"At a private aerospace research facility in Mesa, Arizona, an executive raises concerns after sensitive discussion points from speakerphone meetings begin surfacing externally. The device shows no indicators of active audio recording, and application permission history does not reflect recent camera or microphone authorization changes. A forensic mobile analysis identifies that an installed application has been continuously reading motion sensor output while the phone ' s loudspeaker is active. The collected sensor data was later transmitted to a remote server, where acoustic characteristics were reconstructed from the recorded measurements. Identify the attack technique responsible for this compromise.","o":["Spearphone Attack","Storm Breaker Abuse","Android Camera Hijack Attack","Camfecting"],"a":[0],"e":"正確答案是 Spearphone Attack。 CEH 移動平台覆蓋將 Spearphone 描述為一種側道攻擊，其中運動感測器，如加速計或陀螺儀被濫用來推斷或重建由手機擴音器所出振動產生的音訊。 這一技術的一個關鍵特徵是它可能不需要直接麥克風存取，這有助於解釋裝置上為何沒有麥克風許可更改或可見的錄音指標出現。這個細節是情境的核心。安裝的應用程式在揚聲器交談時不斷蒐集運動感測器資料，後來對資訊進行了遠端分析，以重建聲學內容。 這種行為與 Spearphone 的教科書相符。Android 相機劫持攻擊涉及相機存取，而不是揚聲器振動分析。 Camfecting 指由網路相機折中，\"暴風\"分解器(Storm Breaker Absociation)並沒有描述這種基於感測器的音訊推論方法。 CEH 材料用這個例子來表明，看似低風險的感測器在與聲音引發的振動等物理效應相關時仍然可以產生嚴重的隱私和間諜威脅。 由於攻擊依賴於揚聲器產生的運動資料，而不是直接錄音，所以先鋒手機是最好回答，你應該知道","s":"term"},{"n":517,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"A global media streaming platform experiences traffic surges every 10 minutes, with spikes over 300 Gbps followed by quiet intervals. Which DDoS attack explains this behavior?","o":["UDP flood sustained attack","Recursive HTTP GET flood","Permanent DoS (PDoS)","Pulse Wave attack"],"a":[3],"e":"這種情境與脈搏波 DDoS 攻擊明顯吻合，這是 CEH v13 網路與邊界入侵中描述的精密的阻斷服務技術。 與依賴持續泛洪的傳統捲曲 DDoS 攻擊不同的是，脈搏波攻擊傳遞出短而極高的流量暴發，接踵而來的是不活動時期。描述的決定性特徵--間歇性突起超過 300Gbps、定期間隔(每 10 分鐘)和臨時恢復--是脈衝波攻擊的標誌性指標。 CEH v13 解釋說，攻擊者使用這種方法來壓倒伺服器資源，觸發自動縮放故障，排出緩解閾值，並躲避依賴持續流量基線的探測系統。選項 A 是不正確的，因為 UDP 泛洪是連續的。 選項 B (HTTPGET 泛洪) 目標是應用層持續的請求。 選項 C (PDoS) 永久地損壞硬體，這不符合反覆出現的模式。脈衝波攻擊特別能有效對付大平台，如流線服務，因為它們:雲基礎設施的利用彈性限制基於沒收率的偵測系統導致服務不斷退化，而攻擊持續時間不長 CEH v13 強調，如果沒有適應性，基於行為的 DDoS 保護，脈衝波攻擊是難以減輕的。 因此，選項 D 是正確和符合 CEH 的答案。","s":"term"},{"n":518,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"A smart building management company in Seattle, Washington deploys wireless door sensors and badge- based access systems throughout its corporate headquarters. During a security assessment, an analyst captures legitimate radio transmissions between employee access badges and the entry control units. Later that evening, without modifying or decrypting the original communication, the analyst retransmits the previously captured signal toward a secured entrance. The access control system accepts the transmission as valid and unlocks the door, even though the legitimate badge is not present. Determine the attack technique demonstrated in this assessment.","o":["BlueBorne Attack","Replay Attack","Rolling Code Attack","Sybil Attack"],"a":[1],"e":"正確答案是 B。 重放攻擊。重放攻擊發生在攻擊者捕捉到有效的通訊，後再轉發，使接收系統接受舊訊息為合法，重要的線索是分析師不解密或修改訊號；被捕獲的傳輸只是被再用。 符合 CEH 材料將回放攻擊描述為被擷取流量被再用以取得存取或再現有效交易。 CEHIoT 相通材料也將回放攻擊列在 IoT 相通攻擊型別中。選項 A。 BlueBorne Attack 是不正確的，因為 BlueBorne 瞄準了 BlueToroth 的弱點。選項 C。 Rolling Code Attack 是不正確的，因為滾動碼攻擊涉及捕獲或干擾更改的程式碼序列，經常在干擾接收器時被幹擾。 情境說明原發傳輸只是被重放。選項 D。 Sybil 攻擊是不正確的，因為 Sybil 攻擊使用多個被偽造的身分來影響一個網路。因此，最好的答案是 B.回放攻擊。","s":"term"},{"n":519,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"During a quarterly vulnerability management review at RedCore Motors, Priya finalizes the deployment of Nessus Essentials across the company ' s IT infrastructure. The solution is selected for its ability to support diverse technologies including operating systems, databases, web servers, and virtual environments. While preparing a training session for junior analysts, Priya asks them to identify a capability that Nessus Essentials is specifically designed to provide as part of its scanning process. Which capability is Nessus Essentials specifically designed to provide?","o":["Patch management for operating systems and third-party applications","High-speed asset discovery","Checks for outdated versions across a wide range of server and service technologies","Agent-based detection"],"a":[2],"e":"正確的選擇是 C，因為 Nessus 基本原理基本上是弱點評估掃描器，其核心目的是透過對照大型脆弱知識庫檢查系統和服務，找出安全弱點，包括偵測過時或脆弱的作業系統版本，伺服器軟體，資料庫，網路伺服器，以及共同網路服務。 在實際掃描中，Nessus 進行遠端檢查，如 Bang/version 識別，設定和修補程式級別評估(如有可能)，並進行弱點外掛檢查，以標出已知不安全或末端的軟體釋出生命。這直接符合情境的強調:支援“多元技術，包括作業系統、資料庫、網路伺服器和虛擬環境”，並要求它提供“作為其掃描過程的一部分”的能力。為什麼其他選項不正確 :A (修補程式管理)不是 Nessus 基本原理設計要做的事。 Nessus 識別出缺失的修補程式和弱點，但它不是作業系統和第三方應用修補程式部署平台。 B (高速資產發現) 是專用資產發現/攻擊面工具的更特徵。 或更廣泛的平台特徵； 而在 Nessus 掃描時可以發現主機， \"高速資產發現\"不是定義， 初級能力正在測試中。 D(基於代理的偵測)指為持續監測而在當地執行的端點劑。 Nessus 基本原理主要用於掃描器驅動的弱點評估；基於代理的功能是一個單獨的取向/tooling 概念，而不是這個問題中針對的主要基本原理掃描能力。因此，最好的答案是 C:Nessus 基本原理設計，用於掃描並識別弱點，包括偵測跨越許多伺服器的過時/vulnerable 版本和服務技術。"},{"n":520,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"During a red team engagement for a client in the financial sector, ethical hacker Tyler Brooks conducts a phishing campaign using a crafted internal web page disguised as a company VPN login. After several users enter their credentials, Tyler confirms that the payload successfully recorded input without triggering antivirus or requiring local installation privileges. The captured keystrokes came exclusively from a web-based form embedded in the fake login page. Based on the technique used, which type of keylogger did Tyler most likely deploy?","o":["Keylogger Keyboard","Hypervisor-based Keylogger","Application Keylogger","JavaScript-based Keylogger"],"a":[3],"e":"情節指以 JavaScript 為基礎的鍵盤側錄程式，因為資料捕捉完全發生在網頁內，不需要在被害者的機器上安裝軟體。 在符合 CEH 社交工程和網路攻擊概念中，捕捉網頁通常包括能即時捕捉到輸入的使用者端-側指令碼。 當使用者將 認證資訊 輸入到假登入表時， JavaScript 事件處理器可以記錄按鍵中鍵或最終欄位值並傳輸到攻擊者控制的 端點 上。這解釋了為什麼泰勒的\"酬載\" 工作沒有本機特權，沒有丟棄可執行檔案，也沒有觸發傳統防毒專注於基於檔案的惡意軟體。 關鍵細節是\"被抓取的鍵盤完全來自嵌入於假登入頁的基於網路的形式\"，這符合基於瀏覽器的抓取而不是 OS 級記錄。其他選項意味著系統存取比快報描述的要更深。 鍵盤鍵盤側錄程式一般透過擷取鍵盤輸入系統在作業系統級別上執行，通常需要執行於主機上的程式碼，更可能被端點保護所偵測出。 一個基於超 visor 的鍵盤側錄程式是一種高度先進的技術，它依賴於虛擬化-層控制，與簡單的 fishing 網頁不一致。 應用程式鍵盤側錄程式通常針對端點上的特定程序(如瀏覽器或電子郵件用戶端)，再次需要執行本機機器。從 CEH 強調的防禦觀點來看，緩解措施包括:對使用者進行識別釣魚頁的提高認識培訓，執行 MFA 以減少被竊取的認證資訊的價值，使用反釣魚防護和 URL 過濾，監測外觀域，以及部署瀏覽器和電子郵件安全控制，以偵測認證資訊收割頁和可疑的表帖目的地。","s":"term"},{"n":521,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"A penetration tester runs a vulnerability scan and identifies an outdated version of a web application running on the company's server. The scan flags this as a medium-risk vulnerability. What is the best next step for the tester?","o":["Ignore the vulnerability since it is only flagged as medium-risk","Brute-force the admin login page to gain unauthorized access","Perform a denial-of-service (DoS) attack to crash the web application","Research the vulnerability to check for any available patches or known exploits"],"a":[3],"e":"CEH 方法強調驗證和研究已查明的弱點，以確定可開發性、修補程式狀況和商業影響。 即使中等風險結論也需要調查，以評估其實際嚴重性。"},{"n":522,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"As part of an insider threat simulation at a multinational insurance firm, lead red teamer John is asked to assess whether internal directory services are exposing sensitive user data. Gaining limited VPN access, he begins probing port 389 on a staging environment connected to the main domain infrastructure. After discovering that anonymous binds are accepted by the directory service, John launches a utility from his Kali machine that allows command-line interaction with directory entries. He structures his query to search for user objects with associated organizational units. Moments later, John reviews the output which includes usernames, group memberships, and departmental hierarchies all retrieved without authentication. Which tool is John MOST likely using to perform this enumeration?","o":["smtp-user-enum","nbtstat -A","dig AXFR","ldapsearch"],"a":[3],"e":"情境描述 LDAP 列舉 大於連接埠 389,允許匿名繫結。 在 CEH 覆蓋中，LDAP 是一個企業目錄服務常用的目錄存取協定，包括 Active Directory 透過 LDAP 介面。 當匿名繫結被啟用或設定錯誤的存取控制允許寬讀權限時，攻擊者可以在沒有有效認證資訊的情況下查詢目錄物件，並擷取有價值偵察的資料，如使用者帳戶，組成員，組織單位，以及目錄結構等。約翰正這樣做:連線到 LDAP，進行使用者物件搜尋，並擷取組織資訊和組關係。符合此行為的卡利工具是 ldapsearch。它是一個標準命令列 LDAP 使用者端，用於繫結一個 LDAP 伺服器，並使用 LDAP 過濾器和一個基礎 DN 執行目錄查詢。有匿名繫結， ldapsearch 可以執行查詢，如搜尋物件 Class=user，以及請求屬性如 cn， sAMAccountName，memberOf，和組織細節等。 CEH 材料強調 LDAP 列舉是一個高值的偵察步驟，因為它有助於繪製域圖，識別特權群體，併為以後的攻擊選擇目標， 特別是當目錄權限過於允許時。其他選項不匹配 LDAP 目錄互動。 smtp-user-enum 目標SMTP 使用者列舉透過郵件伺服器回覆。 nbtstat -A 查詢 NetBIOS 名稱表，通常用於主機和共享相關資訊，而非 LDAP目錄樹。 dig AXFR 嘗試 DNS 區傳輸，為 DNS 偵察，而非目錄服務列舉。 因此， ldapsearch 是連接埠 389 上這個匿名LDAP 列舉的最合適的工具。","s":"tool"},{"n":523,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"Abnormal DNS resolution behavior is detected on an internal network. Users are redirected to altered login pages. DNS replies come from an unauthorized internal IP and are faster than legitimate responses. ARP spoofing alerts are also detected. What sniffing-based attack is most likely occurring?","o":["Internet DNS spoofing","Intranet DNS poisoning via local spoofed responses","Proxy-based DNS redirection","Upstream DNS cache poisoning"],"a":[1],"e":"這是一例教科書上收錄的內聯網 DNS 毒化，經常與 ARP 欺騙結合，如 CEHv13 Network 嗅探和 MITM 攻擊所描述。 攻擊者將自己定位在本機網路內，攔截 DNS 請求，回應速度快於合法的 DNS 伺服器。 ARP 欺騙使攻擊者能夠進行中間人攻擊，允許嗅探並修改 DNS 流量。 CEH v13 注意到更快的無賴反應是當地 DNS 毒化的強烈指標。"},{"n":524,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"After installing a backdoor on a web server, what action best ensures it remains undetected?","o":["Embed it in a frequently updated web file","Increase the backdoor code size","Install it on a non-web file referenced in a URL","Place it in a file type excluded from resource maps"],"a":[3],"e":"在 CEH v13 維持存取，隱形和持久性是入侵後的關鍵目標。 將後門放入被排除在資源地圖(如影象後設資料，設定檔，或不尋常的擴充套件)之外的檔案型別會降低由自動掃描器和完整性檢查發現的可能性。選項 D 是正確的，因為許多安全工具都側重於可執行或常用的網頁檔案。從資源地圖中排除的檔案不太可能被掃描或被監控。選項 A 由於頻繁的更改而增加了偵測風險。 選項 B 提高了簽名能見度。 選項 C 仍然使檔案暴露於存取日誌和監測。 CEH v13 強調攻擊者經常會將後門藏入非明顯位置來躲避被偵測。 因此，選項 D 是正確的。"},{"n":525,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"In Austin, Texas, ethical hacker Liam Carter is hired by Lone Star Healthcare to probe the defenses of their patient data network. During his penetration test, Liam aims to bypass the hospital's firewall protecting a medical records server. To do so, he uses a tool to craft custom network packets, carefully designing their headers to slip past the firewall's filtering rules. His goal is to demonstrate how an attacker could infiltrate the system, exposing vulnerabilities for the security team to address. Which tool is Liam using to bypass Lone Star Healthcare's firewall during his penetration test?","o":["Metasploit","Colasoft Packet Builder","Nmap","Traffic IQ Professional"],"a":[1],"e":"Colasoft 封包 Builder 是專門為建立和編輯自訂封包而設計的，使其成為測試者\"craps 自訂網路封包\"和\"謹慎地設計了他們的頭\"來測試或逃避防火牆過濾的情境的最佳匹配。 在 CEH 方法中，封包 編譯是一種常用的驗證技術。過濾裝置如何應對異常或邊緣流量模式，包括被改變的 TCP 旗、被操縱的分解行為、偽造的欄位和協定邊緣大小寫。 一個封包建構器工具能夠精確控制第 2 層，透過第 4 層欄位，並且在許多情況下也支援建構應用有效酬載。 這有助於測試諸如過於放任的規則、國家處理不一致、重新組裝不當和不適當的正常化等可能使惡意流量得以透過等弱點。 Metasploit 主要是用於在發現目標和弱點後交付有效酬載並執行模組的弱點利用框架。 雖然它能產生流量，但並不是描述的低等，人工頭頭設計最直接的工具。 Nmap 主要用於主機發現，連接埠掃描，服務偵測，和基於指令碼的列舉；它可以操縱一些封包特性，但其核心目的不是互動自訂封包構造。 流量 IQ 專業通常與網路分析和流量監測有關，而不是為探測防火牆規則行為而設計出活塞活塞封包。因此，最符合 CEH-風格自訂封包建立防火牆逃生測試的工具是 Colasoft 封包 Builder。","s":"tool"},{"n":526,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A REST API uses user-provided object IDs without authorization checks. What flaw is this?","o":["Mass assignment","XSS","SQLi","BOLA"],"a":[3],"e":"正確答案是 D， BOLA， 或斷裂物件級別授權。 當 API 接受使用者提供的物件識別符號時， 如帳戶 ID， 命令 ID， 發票ID， 或使用者 ID， 但未能核實認證使用者是否被授權存取該特定物件。 CEH Web 應用程式入侵 材料將這一弱點描述為授權缺陷/insecure 直接物件引用 : 一個應用程式使用 IDs 來區分使用者，一個攻擊者在存取另一個使用者設定的請求中更改了 ID 值。 CEH 材料還解釋，未經授權存取另一個使用者的資源代表了水平權限提升，當應用程式在返回被保護資訊之前不檢查授權時，函式級存取問題就會發生。 質量任務涉及繫結出乎意料的欄位，XSS 涉及指令碼注入，而 SQLi 則涉及惡意的資料庫查詢。 這裡的關鍵問題是缺少物件級的授權，因此 BOLA 是最佳答案。","s":"term"},{"n":527,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"During a penetration test at Cascade Biotech in Portland, Oregon, ethical hacker Olivia Harper installs a monitoring agent on a single test workstation inside the research subnet. The system records local events such as file access, configuration changes, and unauthorized process execution. Olivia explains to the security team that attackers often attempt to disable or evade this type of monitoring to avoid being detected at the host level. Which security system is Olivia most likely demonstrating?","o":["Network-Based Firewall","Host-Based Firewall","Network-Based Intrusion Detection System","Host-Based Intrusion Detection System"],"a":[3],"e":"該情境描述一個安裝在單個工作站上的主機級監測代理，記錄檔案存取，設定變化等本機系統事件，以及未經授權的流程執行，這些都是主機-基於入侵偵測系統(HIDS)功能的經典指標。 HIDS 執行在端點(伺服器或工作站)上，並監視該主機上的活動，包括作業系統日誌，檔案完整性，登錄/config 變化，系統呼叫，應用程式日誌，以及處理行為。 由於它具有直接能見度，可以偵測出僅從網路流量可能不明顯的可疑活動。\"攻擊者往往試圖破壞或逃避這種型別的監測以避免被發現的線索:主機級別\"也與 HIDS 高度一致。 逆行者通常試圖阻止端點劑，篡改日誌，或者透過生活出地技術來逃避偵測，正是因為主機基感測器可以捕獲到像權限提升嘗試，持久性機制，惡意過程發射等動作，或者擅自修改關鍵檔案和設定。為什麼其他選項不是最佳匹配 :基於網路的防火牆(A)是一種根據規則(IPs，埠，協定)過濾流量的周邊或網路控制。 它通常不會在單個工作站上記錄詳細的本機檔案/process/configuration 事件。一個主機-基於防火牆(B)的位於端點上，但主要控制該主機的入行/outbound 網路連線。 雖然它可以日誌連線嘗試，但主要設計不是追蹤檔案存取，設定完整性，或者處理執行。一個基於網路的 IDS(C)分析網路段的流量(透過 taps/SPAN)來識別可疑模式)，不需要在單個工作站安裝代理，也缺乏對本機檔案和處理事件的直接能見度。因此，奧利維亞正在展示的安全系統是 D.主機-基於入侵偵測系統。","s":"term"},{"n":528,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at a healthcare provider in Phoenix, ethical hacker Sofia crafts a stream of IP packets with manipulated offset fields and overlapping payload offsets so that the records server ' s protocol stack repeatedly attempts to reconstruct the original datagrams. The repeated reconstruction attempts consume CPU and memory, causing the system to crash intermittently and disrupt patient portal access, even though overall bandwidth remains normal. Packet analysis shows deliberately malformed offsets that trigger processing errors rather than a simple flood of traffic. Which type of attack is Sofia most likely simulating?","o":["Fragmentation Attack","ICMP Flood","Teardrop Attack","Ping of Death"],"a":[2],"e":"此情境與\"淚滴\"攻擊相匹配，它利用 IP 分解再組裝出有相重疊或相悖相抵消欄位的碎片來進行分解。 在\"淚滴\"攻擊中，攻擊者手工業了 IP 分解，這樣當目標試圖將分解重新組裝入原始資料克時，分解相抵消和大小不正確對齊(常常是相重疊)。脆弱系統在重灌過程中會遇到錯誤，導致 CPU/memory 耗盡，崩潰，或網路堆疊中的不穩定。 問題凸顯出\"被操縱的抵消欄位和被重疊的酬載抵消\"，\"重複重建的嘗試\"和\"故意畸形的抵消引發處理錯誤而不是簡單的泛洪\"，這些都是核心的催淚彈特徵。所描述的撞擊 - 系統崩潰和服務中斷而不出現異常的 頻寬 使用 - - 也是合適的。 這不是一個 opulttric DoS( 如ICMP 泛洪)； 而是針對 協定 堆疊處理的 錯誤的 封包 攻擊。 關鍵是攻擊者正在利用目標處理被打碎的 封包 的方式， 在重新組裝時造成過多的處理和失敗。為什麼其他選項不準確:分解攻擊(A)是一個更寬泛的類別，可能包括許多以分解為基礎的操縱，但\"重疊抵消導致再組失敗\"是典型的滴淚模式。 ICMP 泛洪(B)為頻寬/封包-rate 驅動 並且不涉及 IP 碎片相抵消操縱。 Ping of Death (D) 涉及超大小的 ICMP 封包(通常透過分解)超過最大 IP 大小，導致易碎堆起；而情境則強調重疊抵消和再組邏輯錯誤而不是超大小的封包大小。因此，索菲亞最有可能是模擬 C。 Deardrop attack。","s":"term"},{"n":529,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"An ethical hacker is conducting a penetration test on a company's network with full knowledge and permission from the organization. What is this type of hacking called?","o":["Blue Hat Hacking","Grey Hat Hacking","Black Hat Hacking","White Hat Hacking"],"a":[3],"e":"白帽子駭客經授權進行安全評估。 CEH 將道德駭客定義為對網路防禦進行合法，有條理的測試，目的是改善安全而不是造成傷害。","s":"term"},{"n":530,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"Which vulnerability exploits memory corruption?","o":["XSS","Buffer overflow","CSRF","SQLi"],"a":[1],"e":"正確答案是 B， 緩衝區溢位。 在 CEH 弱點和開發概念中， 當一個程式將更多資料寫入固定大小的記憶體緩衝區時， 會發生緩衝區溢位。過量資料可以覆蓋相鄰記憶體，損壞控制資料，崩潰應用程式，或者允許攻擊者控制的程式碼執行。CEH 相關材料描述為將過多的資料寫入應用程式分配的緩衝區，有可能覆蓋相鄰記憶體，執行程式碼，或者崩潰系統。它還解釋說，緩衝區溢位攻擊依賴於缺乏邊界測試，在堆放的情況下，可能覆蓋返回指標，從而將執行流交換器注入惡意軟體碼。 XSS 將惡意指令碼注入網頁，CSRF 欺騙一個認證的使用者進行不想要的行動，並 SQL 注入操縱資料庫查詢，這些不會主要利用記憶體腐敗。 因此，與記憶腐敗相關的弱點為緩衝區溢位。","s":"term"},{"n":531,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"Bob, a seasoned security analyst at XYZ Aerospace, was investigating a series of misaligned transaction timestamps coming from one of the data archival systems. Suspecting that the server might be syncing with an unstable time source, Bob decided to extract a detailed list of all peer servers associated with the target machine, including metrics such as delay, offset, and jitter, to determine whether the issue stemmed from time synchronization drift. Which of the following commands should Bob use to retrieve this information?","o":["ntptrace [-n] [-m maxhosts] [servername/IP_address]","ntpq -p [host]","ntpdc [-n] [-s] [-c command] [host] [...]","ntpq [-n] [-l] [-c command] [host] [...]"],"a":[1],"e":"最符合 Bob 目標的命令是 ntpq -p。 在 CEH 對接的網路服務覆蓋和操作故障排除中，NTP 被強調為關鍵依賴性，因為不準確的時間會打破認證，扭曲日誌，並導致不正確的交易命令。 在調查疑似時間漂移時，最有用的第一步是檢視活動NTP 關聯及其質量度量。 ntpq 工具查詢一個 NTP 守護程序， 並報告對等狀態和效能資料。 具體而言， ntpq -p 顯示一個包含每個設定或發現的時間源以及延遲、 偏移和 jitter 等欄位的對等表。 這些值有助於確定 伺服器 是否鎖定在穩定源上， 或是否受到一個差或無賴時間 伺服器的影響。 偏移表示本機時鐘與對等點的相差多遠，延遲反映網路延遲到對等點，而 jitter 則顯示計時量的可變性，所有這些都直接被問題所提及。選項 A，ntptrace，用於將 NTP 伺服器的鏈條追溯回參考時鐘，並可用於理解分級，但它沒有以同樣的方式提供詳細的延遲，抵消，並抖動對等度量。 選項 C，ntpdc 是一個更古老的監測工具，可以查詢 NTP，但 CEH 的引用更常用地強調對等統計和關聯的 ntpq。選項 D 是一種通用的 ntpq 引用並帶有互動式命令支援，但-p 選項是用需要的度量符輸出同位素清單的顯式模式。"},{"n":532,"c":"社交工程","ce":"Social Engineering","t":"long","q":"During a cybersecurity awareness drill at Quantum Analytics in San Francisco, California, the ethical hacking team tests the company's defenses against social media-based threats. Nadia creates a fake LinkedIn profile posing as a senior HR manager from Quantum Analytics, using a stolen company logo and publicly available employee details. Nadia sends connection requests to several employees, including data analyst Priya Sharma, inviting them to join a private group called Quantum Analytics Innovation Hub. The group's page prompts members to share their work email and department role for exclusive project updates. What social engineering threat to corporate networks is Nadia's exercise primarily simulating?","o":["Loss of Productivity","Involuntary Data Leakage","Spam and Phishing","Network Vulnerability Exploitation"],"a":[2],"e":"這一情境最接近於透過社交網路平台提供的垃圾郵件和釣魚，在 CEH 社交工程報道中強調的是一種社交媒體釣魚技術，或者魚叉式網路釣魚透過專業網路傳播。 Nadia 冒充了一位值得信賴的內部權威人物，一位資深的 HR 管理者，並使用被竊取的標誌和準確的員工細節等可信賴的品牌元素來建立可信度。 然後她透過連線請求和漏斗目標進行接觸，進入一個控制空間，一個私人團體，她要求獲得敏感資訊。 蒐集工作電子郵件位址和部門角色可能看起來無害，但 CEH 指導指出，攻擊者通常會從建立信心和蒐集資料以達成更深入妥協的小型、可信的請求入手。 工作郵件和角色使目標魚叉式網路釣魚、商業電子郵件折中準備、密碼重設目標，並設計出與受害人職能相一致的令人信服的藉口。核心力學與釣魚:欺騙，冒用，以及旨在擷取資訊的號召行動一致。“專屬專案更新”鉤子是用來增強合規性的經典誘餌。雖然該活動操作可能導致非自願資料洩漏作為下游效應，但主要的模擬威脅是釣魚過程本身，使用社交媒體作為傳送渠道。 因此，Nadia 鑽探最準確的分類就是透過社交媒體進行垃圾郵件和釣魚。","s":"term"},{"n":533,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"A penetration tester is assessing an IoT thermostat used in a smart home system. The device communicates with a cloud server for updates and commands. The tester discovers that communication between the device and the cloud server is not encrypted. What is the most effective way to exploit this vulnerability?","o":["Conduct a Cross-Site Scripting (XSS) attack on the thermostat's web interface","Perform a brute-force attack on the thermostat's local admin login","Execute a SQL injection attack on the cloud server ' s login page","Use a man-in-the-middle (MitM) attack to intercept and manipulate unencrypted communication"],"a":[3],"e":"IoT 裝置在沒有加密的情況下傳輸資料，使所有通訊都暴露於被擷取。 CEH 解釋攻擊者可以在 IoT 裝置與雲服務之間定位來操縱或擷取流量。 MitM 攻擊使得命令被擷取，認證資訊，而由於缺乏 TLS 保護，韌體資料也能夠被擷取。"},{"n":534,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"A penetration tester must enumerate user accounts and network resources in a highly secured Windows environment where SMB null sessions are blocked. Which technique should be used to gather this information discreetly?","o":["Utilize NetBIOS over TCP/IP to list shared resources anonymously","Exploit a misconfigured LDAP service to perform anonymous searches","Leverage Active Directory Web Services for unauthorized queries","Conduct a zone transfer by querying the organization's DNS servers"],"a":[1],"e":"CEH v13 解釋道，當傳統的列舉技術--如 SMB Null 工作階段--被禁用時，攻擊者往往會選擇錯誤設定仍然允許匿名約束的LDAP 服務。 LDAP 匿名繫結在沒有適當限制的情況下，會曝光使用者名稱，組織單位，團體會員等目錄資訊以及其他後設資料。 這直接符合情境，即測試者在仍然蒐集內部資料的同時必須避免觸發提醒。 LDAP 查詢產生的噪音最小，經常會與正常的認證相關流量相混合，使得它們成為隱蔽列舉的理想。 選項 A 和 C 要求認證或違反存取限制，而 DNS 區轉移(備選 D)很少成功，因為現代 DNS 伺服器禁止未經授權的客戶提出的 AXFR 請求。 CEH 一再強調發現和確保 LDAP 匿名繫結的重要性，因為它有可能沉默的資訊洩漏--選項 B 是正確的選擇。"},{"n":535,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"A new wireless client is configured to join a 802.11 network. This client uses the same hardware and software as many of the other clients on the network. The client can see the network, but cannot connect. A wireless packet sniffer shows that the Wireless Access Point (WAP) is not responding to the association requests being sent by the wireless client. What is a possible source of this problem?","o":["The WAP does not recognize the client ' s MAC address","The client cannot see the SSID of the wireless network","The wireless client is not configured to use DHCP","Client is configured for the wrong channel"],"a":[0],"e":"正確答案是 A，因為使用者端已經可以看到無線網路並正在傳送關聯請求，這意味著 SSID 和通道很可能是正確的。 在無線網路中，關聯是一個使用者端連線到存取點。 CEH 無線材料的過程，解釋用戶端在使用網路之前必須連線到 AP，而MAC 過濾是一種控制，只允許列出的無線 NICMAC 位址與 AP 連線。 如果在允許的清單中缺少了使用者端的 MAC 位址，則 WAP 可能忽略或拒絕關聯嘗試。 DHCP 不是最佳答案，因為 DHCP 發生在第 2 層無線關聯之後，此時使用者端已經連線到足夠要求 IP 設定。 使用者端如果能夠看到網路併傳送關聯訊框，也不能在錯誤的通道上。 因此，最可能出現的問題是 MAC 過濾到 WAP 上。"},{"n":536,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"What is the main difference between ethical hacking and malicious hacking?","o":["Ethical hacking is illegal, while malicious hacking is legal","Ethical hackers use different tools than malicious hackers","Ethical hacking is performed with permission, while malicious hacking is unauthorized","Ethical hackers always work alone, while malicious hackers work in teams"],"a":[2],"e":"CEH 將道德駭客定義為授權的，結構化的，基於許可的識別弱點的過程，以加強一個組織的安全姿態。 道德駭客在被簽名的工作範圍下運作，並遵循法律界限。 反之，惡意駭客在未經許可的情況下利用系統，往往帶有有害或犯罪意圖。CEH 強調，道德和惡意駭客都可能使用類似的工具、技術和方法；區別完全在於授權、意圖和合法性。 進行道德駭客是為了改善防禦，而惡意駭客則以弱點利用、盜竊或干擾為目標。 CEH 材料中沒有任何內容表明工具或工作風格區分出這兩個組；許可和合法操作仍然是中心差異。"},{"n":537,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"You perform a SYN (half-open) scan and receive a SYN/ACK packet in response. How should this result be interpreted?","o":["The target IP is not reachable","The scanned port is open","The scanned port is filtered","The scanned port is closed"],"a":[1],"e":"在 CEH v13 網路掃描中，SYN 掃描-也稱為半開掃描-是最常用和最可靠的技術之一，用於識別開通的 TCP 埠。 這種方法涉及將 TCP107 封包傳送到目標連接埠並分析回應而未完成完整的三向交握。當掃描器發出 SYN 封包時:SYN/ACK 回應#連接埠是 OPEN RST 回應 #連接埠為 CLOSED 沒有反應或 ICMP 無法到達 #連接埠是 FILTERED 在這種情境中，接收到一款 SYN/ACK 封包明確表明目標系統願意在該款連接埠上建立一款 TCP 連線。 掃描器一般用一款 RST 封包而不是一款 ACK 來回應來避免完成連線，從而保持隱形。因此，選項 B 是正確的，並且與 CEHv13 定義完全一致。選項 A 不正確， 因為無法存取的主機不會用 SYN/ACK。 回應選項 C 是不正確的，因為被過濾的埠通常不回覆或回回 ICMP 錯誤。選項 D 不正確， 因為關閉的埠回應 RST， 而非 SYN/ACK。 CEH v13 強調 SYN 掃描是一種首選方法，因為它的精度平衡並減少了記錄。 理解 TCP 旗下行為對於正確解釋掃描結果至關重要。"},{"n":538,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"long","q":"During an internal red team simulation at a global insurance provider, Joe, a senior SOC analyst, is assigned to verify a surge in anomalous SYN packets targeting the perimeter firewall. The result of spoofed traffic. The organization has ruled out DNS poisoning and malformed header issues. Joe must now analyze packet behavior in real-time to determine authenticity without relying on host-level authentication. To identify spoofed traffic using techniques aligned with best practices taught in the organization, which approach should Joe take?","o":["TCP Flow Control Method","IP Address Decoy","Direct TTL Probes","IP Identification Number IPID Monitoring"],"a":[3],"e":"DIn 符合 CEH 流量分析，SYN 泛洪經常使用偽造的源 IP 位址來隱藏攻擊者並使得過濾工作複雜化。 當主機級認證或端主機驗證不可用時， 防禦人員依賴於封包行為中難以在尺度上連貫地鑄造的特徵。 IP 確認號碼碼監測是偵測欺騙的一種經典技術，因為許多作業系統以可預測的方式生成 IPID 欄位，通常在每主機或每流中依次遞增或遵循可重複的模式。 如果所觀測到的 SYN 封包真正來源於同一聲稱的來源， IPID 值傾向於顯示一個隨著時間推移的連貫進展。在偽造的流量中，特別是當攻擊者隨機改變源 IPs 或使用多臺發電機時，IPID 值通常顯得不一致，跳出時不規則，或者反映的規律與預期的傳送者不符。 這使得 IPID 監測在即時封包分析中有用來區分合法的流量暴發與被編造的封包，而不需要完成握手或查詢端子主機。 其他選項更弱地適合特定目標。 TCP 流量控制與視窗和輸送量行為有關，而不是源的真實性。 IP 位址誘餌是一個欺騙概念，而不是封包-真實性測試。 直接的 TTL 探測器可以提供跳出距離的提示，但 TTL 值很容易被攻擊者調整，而且可靠性低於將一致的 IPID 序列圖案聯絡起來的值。因此，IPID 監測在這些限制下的最佳匹配 CEH-style 偽造的-traffic system。","s":"term"},{"n":539,"c":"密碼學","ce":"Cryptography","t":"mid","q":"A regional hospital network is conducting incident containment after discovering that an internal file server was accessed by unauthorized actors. While forensic analysis is ongoing, a security engineer must immediately protect sensitive medical records stored on a mounted partition without shutting down the system. The solution must support strong encryption, including 256-bit AES, allow creation of encrypted containers within existing storage volumes, and provide the capability to conceal protected data inside standard-looking volumes to reduce visibility during continued investigation. Select the disk encryption tool that best satisfies these operational and security requirements.","o":["FileVault","Rohos Disk Encryption","VeraCrypt","BitLocker Drive Encryption"],"a":[2],"e":"正確答案是 C。 VeraCrypt。 VeraCrypt 是最佳匹配，因為它支援加密的容器，掛載的加密卷，強大的加密演算法如 AES，以及隱藏的卷。 符合 CEH 密碼學材料將 VeraCrypt 列入用於加密檔案，資料夾和保護儲存服務的工具中。 同一參考物識別出 AES 為塊密碼，支援金鑰長度為 128,192 或 256 位。選項 A。 FileVault 是不正確的，因為 FileVault 是蘋果公司為 macOS 提供的全磁碟加密解決方案，並不最符合加密容器和隱藏容量要求。選項 B。 Rohos Disk 加密 可以建立加密磁碟，但 AES-256 支援的組合，可移植加密容器，以及隱藏容量的能力最能識別 VeraCrypt。選項 D。 BitLocker Drive加密 不正確， 因為 BitLocker 主要是 Windows 全卷 加密 溶液， 它不提供 VeraCrypt 風格的隱藏加密容器。因此，最好的答案是 C。 VeraCrypt。","s":"tool"},{"n":540,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a red team assessment at a retail bank in New York, ethical hacker Aisha launches a flood of TCP connection initiation packets against the bank ' s online portal. The target accepts each initial handshake packet but never receives the final ACK to complete the three-way handshake, exhausting the server ' s backlog of half-open connections and preventing legitimate users from establishing new sessions. Which type of DoS attack is Aisha most likely simulating?","o":["ACK Flood","TCP SACK Panic","APT Attack","SYN Flood Attack"],"a":[3],"e":"這是 SYN 泛洪，因為攻擊用 TCP110 封包(連線啟動)將目標淹沒。 伺服器透過分配資源和傳送 SYN-ACK 回覆來回應，在等待使用者端的最終 ACK 完成三向交握的同時將每個連線移動到半開狀態。 在 SYN 泛洪中，最終的 ACK 從未到來(常常是因為源位址是偽造的或者攻擊者故意不完成握手)，因此，伺服器的積壓排隊等待連線，消耗了記憶體/connection槽並阻止合法使用者建立新的工作階段。情節語言與力學完全吻合:\"flood of TCP 接通啟動封包\"，\"用盡了伺服器積壓的半開接通\"，\"從來沒有收到過最終的 ACK\"，這些是 SYN 泛洪的經典識別符。為什麼其他選項不正確 :ACK 泛洪(A)涉及泛洪並帶有 TCP105 封包；由於 ACK 不是連線-啟動步驟，所以它並不主要產生半開式的握手。 TCP SACK Panic (B) 指與TCP 選擇性認知處理相關的一個特定的可變性/issue，而不是通用握手式積壓耗盡攻擊模式。 APT 攻擊(C)不是 DoS 攻擊型別；它是指先進的持續威脅運動，與:TCP 握手泛洪。因此，艾莎正在模擬 D。 SYN 泛洪攻擊。","s":"term"},{"n":541,"c":"雲端運算","ce":"Cloud Computing","t":"short","q":"During a cloud security assessment, you discover a former employee still has access to critical cloud resources months after leaving. Which practice would most effectively prevent this?","o":["Real-time traffic analysis","Regular penetration testing","Enforcing timely user de-provisioning","Multi-cloud deployment"],"a":[2],"e":"CEH 雲安全模組強調身分和存取管理(IAM)故障是雲違規的主要來源。 確保在員工離開時及時解除使用者帳戶的提供是核心安全控制。選項 C 是正確的。選項 A 和 B 偵測出問題，但不能阻止存取的持久性。選項 D 與存取控制無關。 CEH 壓力 joker- mover-leaver (JML) 程序。","s":"term"},{"n":542,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"You've recently joined an international software firm as part of the cybersecurity governance team. While preparing for an internal compliance review, your supervisor asks you to identify the ISO/IEC standard that serves as a comprehensive framework for managing an organization ' s information security. You examine several standards, including those focusing on risk management, cybersecurity, and control implementation. However, you need to select the one that defines the overarching structure for managing information security programs across the organization. Which of the following standards should you choose?","o":["ISO/IEC 27002:2022","ISO/IEC 27005:2022","ISO/IEC 27001:2022","ISO/IEC 27701:2019"],"a":[2],"e":"ISO/IEC 27001:2022 是正確的選擇，因為它是確定建立，實施，維護和持續改進資訊保安管理系統(ISMS)要求的核心標準。 在 CEH 調整的治理和安全管理概念中，ISMS 是一個總體管理框架，確保透過政策、確定的作用、以風險為驅動的規劃、實施控制、監測、內部審計和持續改進系統處理資訊保安。 ISO/IEC27001 是\"結構\"標準--指它規定一個組織必須做什麼來執行一個資訊保安程式端到端，是組織可以被正式認證的主要標準。其他標準是輔助標準而不是總體框架。ISO/IEC27002:2022 為資訊保安控制提供了指導和最佳做法(\"控制目錄\"和執行指導)，但並沒有定義 ISMS 的要求。ISO/IEC 27005:2022 側重於資訊保安風險管理--如何識別、分析、評價和處理風險--支援 ISMS 所使用的基於風險的方法，但這不是 ISMS 框架本身。 ISO/IEC 27701:2019 擴充套件了 ISO/IEC27001 和 27002 用於隱私資訊管理(PIMS)，幫助組織管理個人可識別的資訊，但它是一個擴充套件，而不是基礎 ISMS 標準。因此，當被問及定義全組織資訊保安管理總體結構的標準時，CEH 治理原則與選擇 ISO/IEC27001:2022 一致。","s":"term"},{"n":543,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"mid","q":"During an authorized penetration test of an organization ' s Operational Technology (OT) environment, the tester has already identified exposed industrial assets and now begins actively probing controllers, services, and interfaces to identify exploitable weaknesses. No exploitation attempts or persistence mechanisms have been performed yet. According to the OT hacking methodology, which phase is currently being carried out?","o":["Gain Remote Access","Information Gathering","Launch Attacks","Vulnerability Scanning"],"a":[3],"e":"在 OT 駭客化方法中，一旦暴露的工業資產被確定，下一個邏輯步驟 - - 在試圖被開發之前 - - 是積極評估這些資產是否存在弱點。假設情況表明，測試者是“積極偵測控制器、服務和介面，以查明可被開發的弱點 ”， 並明確確認沒有發生開發嘗試或持續機制。這種組合最接近於弱點掃描階段。在 OT 背景下的弱點掃描包括仔細地列舉和評估工業成分，如 PLCs，HMIs，歷史學家，工程工作站，以及工業閘道器等。 目的是發現過時的韌體，不安全的服務，薄弱的認證，被曝光的管理介面，錯誤的設定， 和已知影響工業協定或裝置網路控制檯的 CVES。 \"主動偵測\"是一個重要的線索:資訊蒐集可以是被動的(資產目錄，圖表，OSINT，被動網路能見度)，但掃描移動到與主機和服務的積極互動中去識別。弱點--仍沒有受到弱點利用。另一個答案選擇與所描述的邊界不一致。 獲得遠端存取意味著初步妥協或建立存取路徑(例如，利用認證資訊、遠端服務或開發)，一旦發現和選擇了弱點，就是一個後退步驟。 發動攻擊甚至更進一步，因為開發或破壞行動就發生在此地。 當測試者正在以最小的相互作用來識別資產和蒐集細節時，資訊蒐集將更早地適合；然而，情境表明，階段已經過去(\"已經查明暴露的工業資產\")，測試者現在正在探索可被利用的弱點。因此，目前階段是 D。 弱點掃描。"},{"n":544,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"During a red team engagement at a healthcare organization in Chicago, ethical hacker Devon intercepts Kerberos authentication material from a compromised workstation. Instead of cracking the data, he reuses the stolen tickets to authenticate directly to other systems within the domain. This allows him to access shared resources and servers without needing the users ' plaintext credentials. No NTLM hashes or broadcast poisoning were involved. Which attack technique did Devon most likely perform?","o":["LLMNR/NBT-NS Poisoning","Pass-the-Ticket Attack","Kerberoasting","Pass-the-Hash"],"a":[1],"e":"劇情描述被竊取的克貝羅斯票證重新用於認證其他域系統而無需破解任何東西，也不需要使用者的明文密碼。 這種行為直接與 Pass-the-Ticket(PtT)攻擊吻合。 在克貝羅斯基於環境(如 Active Directory 域)中，認證依賴於票證(例如，出票給出票證和服務票證)。如果攻擊者可以從損壞的主機--通常從記憶體，認證資訊快取，或售票店獲得有效的售票材料，只要售票仍然有效並被目標服務接受，他們就可以作為該使用者出示(\"透過\")進入服務的出票。關鍵線索有:(1)德文\"擷取克貝羅斯認證材料\"，(2)\"不解開資料而再用被竊票\"，(3)他認證\"直接到域內其他系統\"存取資源。 這是 PtT 的基本優勢:它透過利用擁有有效票可以足以認證服務(檔案股票，應用程式伺服器，以及其他被克貝羅斯保護的資源)這一事實來繞過密碼猜測或雜湊破解。這個問題也排除了共同的備選辦法:Kerberoasting(C)涉及為 SPN 申請服務票證，然後下線解開加密部分以恢復服務帳戶密碼。 Devon 顯然沒有破解任何東西。 Pass-the-Hash(D)是一種基於 NTLM-的技術，可以再用 NTLM 雜湊來認證。 情境明確宣告\"沒有 NTLM 雜湊\"。 LLMNR/NBT-NS 中毒 (A)是一種在本機網路上捕獲/relay 認證資訊的命名解毒技術，情節說明沒有涉及廣播中毒，而是專注於克貝羅斯的票回用。因此，德文最有可能執行 B。 Pass-the-Ticket Cattack。","s":"term"},{"n":545,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"Upon completing a vulnerability evaluation for a financial services firm in Cincinnati, Ohio, the security team finalized its formal report for executive review. One portion of the document grouped identified weaknesses into severity tiers and highlighted systems with elevated exposure levels across the environment. This part of the report emphasized the relative impact and prioritization of identified weaknesses across affected assets. Which component of the vulnerability assessment report is represented in this scenario?","o":["Recommendations","Risk Assessment","Assessment Overview","Findings"],"a":[1],"e":"正確答案是風險評估。CEH 弱點評估指導區分了識別弱點和評估其業務或業務影響。 調查結果是顯示發現弱點的原始或有組織結果。 風險評估透過界定這些弱點的影響、按嚴重程度排序以及突出哪些資產面臨最大風險，更進一步。 設想方案明確指出，報告將薄弱環節分為嚴重級別，並強調了全系統的相對影響和優先次序。建議將側重於補救步驟，而評估概述則將概述更高層次的參與。 CEH 關於弱點評估生命週期的檔案解釋說，在查明瞭弱點之後，利用風險評估來解釋其對組織的重要性，以便補救工作能夠正確確定優先次序。 因此，高管和決策者依賴於這一節:它把技術弱點轉化為風險水平和反應緊迫性。 由於這裡強調的是影響、優先順序和基於嚴重程度的分組，因此報告部分最好被歸類為風險評估。","s":"term"},{"n":546,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"After the completion of the pen test, you have provided the client with a list of controls to implement to reduce the identified risk. What term best describes the risk that remains after the controls have been implemented?","o":["Inherent risk","Residual risk","Gap analysis","Total risk"],"a":[1],"e":"正確答案是 B，即殘餘風險。 在 CEH 風險管理術語中，殘餘風險是指在適用安全控制、保障措施、應對措施或緩解戰略後仍然存在的風險數量。 滲透測試確定可能使一個組織面臨風險的弱點、威脅和弱點。 在測試者推薦修補程式、存取控制改進、網路分解、監測、硬化或使用者意識培訓等控制後，這些控制降低了開發的可能性或影響。 然而，安全控制很少完全消除所有風險。 剩下的風險被稱為剩餘風險，管理層必須決定是否接受、轉移、避免或進一步減輕風險。 固有風險是任何控制實施之前的原始風險水平。弱點分析是當前安全狀態與預期或需要狀態的比較。 總風險通常是指在核算執行的保障措施之前的總體風險。 因此，控制後剩餘風險的最佳術語是剩餘風險。","s":"term"},{"n":547,"c":"系統入侵階段","ce":"System Hacking Phases","t":"long","q":"During an internal audit at a financial services firm in Mumbai, ethical hacker Meera was tasked with assessing lateral movement risks within the Windows-based domain environment. While monitoring internal network traffic, she noticed a strange broadcast from a workstation trying to resolve a non-existent host. Suspecting protocol-level weakness, she responded swiftly using a pre-configured system. A few minutes later, she captured NTLMv2 hashes from several authenticated sessions across multiple departments. Later, her team successfully cracked one of the hashes offline and used the credentials to gain access to a sensitive internal reporting server. Which type of attack did Meera most likely execute?","o":["Internal Monologue Attack","LLMNR/NBT-NS Poisoning","Kerberoasting","Pass-the-Ticket Attack"],"a":[1],"e":"正確答案是 LLMNR/NBT-NS 毒藥。 CEH 系統駭客覆蓋 解釋道，當一個 Windows 主機不能透過正常的 DNS 解析一個名稱時，它可能會倒回 Link-local 多播 名稱解析或 NetBIOS 名稱服務。 本機網路上的攻擊者可以回答這些廣播，並謊稱是所請求的資源。如果受害者試圖驗證，則可以捕獲到 NTLM 或 NTLMv2 挑戰回應資料，然後將其解開。這正是這個問題所描述的:一個不存在的主機查詢，一個快速的惡意反應，捕獲 NTLMv2 雜湊，以及後來的認證資訊解開。 Kerberoasting目標為 Active Directory 而非廣播名稱解析的服務票證。 Pass-the-Ticket 涉及克伯羅斯票，而\"內部單曲\"濫用是一種不同的認證濫用模式。 CEH 材料專門將 LLMNR/NBT-NS 中毒與 Responder 等工具相連線，並強調這些協定可以被濫用來蒐集雜湊來進行橫向移動或權限提升。 劇情的取名-解析度欺騙後接雜湊捕捉的序列是 LLMNR/NBT-NS 中毒攻擊的定型標誌。","s":"term"},{"n":548,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"You are an ethical hacker at Vanguard Cyber Defense, hired by Sunrise Logistics, a freight management company in Houston, Texas, to evaluate the security of their shipment tracking portal. During your engagement, you analyze how the application handles user-submitted data. You observe the behavior of the shipment search feature and monitor the HTTP GET requests being sent to the server. Your objective is to determine how user input is processed by the backend system and whether those parameters can be used to manipulate SQL queries. Based on this activity, which step of the SQL injection methodology are you performing?","o":["Advanced SQL Injection","Launching SQL Injection Attacks","Database Enumeration","Identifying Data Entry Paths"],"a":[3],"e":"在 CEHSQL 注入方法中，初始階段側重於瞭解使用者控制的輸入在何地以及如何進入應用程式並達到後端元件，如資料庫查詢。所描述的活動為偵察和輸入向量的對映:瑞秋正在觀察運出搜尋功能，監視 HTTPGET 參數，並確定這些參數的處理方式是否可影響 SQL 邏輯。 這直接對應通常被描述為識別資料輸入路徑的階段，即測試者定位所有可能的注入點，如 URL 查詢字串，形式欄位，Cookie，HTTP 頭，和 API 參數。在現階段，道德駭客尚未執行有效酬載來開發資料庫。相反，它們正在剖析請求結構，參數名稱，值，和伺服器回應，以瞭解在提供不同輸入時應用程式的表現。 CEH 指導強調，有效的 SQL 注入測試從列出輸入源開始，並確定其中哪些似乎在伺服器側操作中被反映。 監測 HTTPGET 請求是一種典型的技術，因為查詢字串參數常常會對映到後端搜尋查詢，過濾器，或記錄查詢，如果伺服器-側驗證和查詢構造薄弱，就會使他們成為頻繁的注入物件。其它選擇出現較後。 發射 SQL 注入攻擊涉及主動注入測試字元和有效酬載以確認注入。 資料庫列舉發生於確認弱點後，以擷取計劃資訊和資料。 高階 SQL 注入指更專業的技術，如出帶，有時間的盲，或有 WAF 逃。 由於此處的任務是確定和評估潛在的注入點，正確的步驟是確定資料輸入路徑。","s":"term"},{"n":549,"c":"密碼學","ce":"Cryptography","t":"short","q":"Which encryption method supports secure key distribution?","o":["Disk encryption","Symmetric encryption","Hash functions","Asymmetric encryption"],"a":[3],"e":"非對稱式加密，由 CEH v13 密碼學所定義，使用公用-私密金鑰對，解決了對稱式加密所固有的金鑰分配問題。公用金鑰可以自由共享，可以在沒有事先共享秘密的情況下安全地啟動通訊。 Disk 加密和 hashes 不處理金鑰交換。因此，選項D 是正確的。","s":"term"},{"n":550,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"You are an ethical hacker at Nexus Cybersecurity, contracted to perform a penetration test for BlueRidge Retail, a US-based e-commerce company in Atlanta, Georgia. While testing their online store's product search page, you attempt to inject a malicious query into the URL to extract customer data. The application is protected by a web application firewall WAF that blocks standard SQL injection attempts. To bypass this, you modify your input to split the query into multiple parts, ensuring the malicious instructions are not detected as a single signature. For example, you craft the URL as products.php?id=1+UNION+SE+LECT+1,2, which successfully retrieves unauthorized data. Based on the observed behavior, which SQL injection evasion technique are you employing?","o":["Hex Encoding","String Concatenation","In-line Comment","Null Byte"],"a":[1],"e":"字串接是最佳匹配，因為所描述的技術是將可識別的 SQL 關鍵詞或酬載分解成單獨的塊來使基於簽名的 WAF 規則不會在一個連續的圖案中看到完整的惡意符。 在符合 CEH 的 Web 應用程式測試中，許多 WAF 偵測依賴於匹配已知的字串，如UNIONSELECT，OR1=1 等等。 如果攻擊者可以使資料庫解析器解釋相同的含義而輸入在檢查層出現不同，則 WAF 可能無法與其規則相匹配，而酬載可以到達後端。提示明確表示您\"將查詢分解為多部分\"以避免被偵測為\"單一的簽名\"，這是基於 concatenation 的逃避的核心理念:透過被分解的片段來代表相同的指令，這些片段被 SQL 解析器重新組合或被容忍，這取決於資料庫和應用行為。 這與行內註釋不同，這些註釋通常會在關鍵詞內插入註釋標記來斷開簽名而同時儲存解析，也與六進製表示法取代字元或字串的六進位制編碼不同。 一種無效位元組技術通常與更古老的上下文中的字串終止技巧相接，不與為 WAF 繞行而拆分的 SQL 關鍵詞相接。防守方面，CEH 指導強調僅依靠 WAF 簽名是不夠的。預防需要參數化的查詢，嚴格的伺服器-側輸入驗證，最不偏重的資料庫帳戶，即使沒有明顯的簽名，也要監測異常的查詢模式和出錯行為。","s":"term"},{"n":551,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"You discover an unpatched Android permission-handling vulnerability on a device with fully updated antivirus software. What is the most effective exploitation approach that avoids antivirus detection?","o":["Develop a custom exploit using obfuscation techniques","Use Metasploit to deploy a known payload","Install a rootkit to manipulate the device","Use SMS phishing to trick the user"],"a":[0],"e":"CEH 移動平台安全模組解釋道，移動防毒解決方案嚴重依賴簽名和已知的利用模式。 帶有模糊性的自訂開發更可能繞過偵測。 CEH 明確教導:零時差 或未標註的弱點自訂、模糊的有效酬載儘量減少已知框架的使用用於在受控測試中繞過端點防禦的最為有效。選項 A 是正確的。選項 B 和 C 很容易被偵測出。選項 D 是社交工程，不是技術開發。"},{"n":552,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"mid","q":"In the humid air of Houston, Texas, a chemical plant is preparing to deploy a new production automation module. As part of a red team engagement, you, Ethan Brooks, a cybersecurity specialist are tasked with identifying industrial control devices that communicate with SCADA systems. To proactively uncover devices that may expose critical functions, you launch a focused Nmap sweep targeting TCP port 102, known to be associated with industrial controllers used in critical infrastructure. Your scan detects specific PLC models used in the automation process. What OT reconnaissance step are you performing?","o":["Scanning Omron PLC devices","Scanning Modbus devices","Capturing Modbus TCP traffic using Wireshark","Scanning Siemens SIMATIC S7 PLCs"],"a":[3],"e":"TCP 連接埠偵察與西門子 S7 通訊緊密相聯，通稱 S7comm，被西門子 SIMATICS7PLC 家庭和相關工程及 HMI 元件用於 OT 環境。 在 CEH 覆蓋 ICS 和 SCADA 偵察中，由它們著名的港口識別工業協定是標準的第一步，因為它能迅速縮小裝置型別，供應商生態系統，並有可能是攻擊面。 當伊森目標為 TCP 偵察並掃描揭示出自動化過程中使用的 PLC 模型時，這個模型直接與點出 Siemens SIMATICS7 PLC 相配合，因為 S7comm 在連接埠偵察上通常執行於 ISO-on-TCP 以上。其他選項不匹配所描述的連接埠-協定對等。 Modbus TCP 最常使用 TCP 連接埠 502,因此\"掃描 Modbus 裝置\"與 502 相關，而非 102\"使用 Wireshark 的 Capture Modbus TCP 流量\"是被動的嗅探，並且也會專注於 Modbus 在 502 上的流量模式，而不是 102 上主動的 Nmap 掃地。 Omron PLCs 可能根據模型和設定使用不同的協定和埠，但 TCP 協定是Siemens S7 在為 OT 發現所教授的大多數防禦和進攻性遊戲本中被引用的犬科指標。從防守角度出發，符合 CEH 的最佳做法強調分解 OT 網路，限制進入 102 等工程埠，監控掃描行為，並強制執行 SCADA，HMIs，和 PLC 之間的被允許上市通訊，以降低未經授權的列舉和後續操縱的風險。","s":"term"},{"n":553,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"long","q":"During a quarterly security audit at a multinational logistics firm, network security manager Priya initiates a scheduled vulnerability assessment across the organization's hybrid infrastructure. Her team begins by identifying all active IT assets and assigning them risk scores based on business criticality. The following week, they deploy scanning tools to detect security weaknesses, validate the findings manually, and classify vulnerabilities based on severity and exploitability. After coordinating with the IT operations team, they develop a structured timeline to address the confirmed vulnerabilities, giving priority to high-risk findings affecting mission-critical systems. Finally, after the vulnerabilities are addressed, Priya ensures the affected systems are rescanned to confirm resolution and generates a compliance report for executive review. Based on this workflow, which phase of the Vulnerability-Management Life Cycle is Priya executing?","o":["Remediation","Vulnerability Analysis","Verification","Risk Assessment"],"a":[0],"e":"最佳的答案是補救，因為工作流程的核心是透過有組織的優先計劃，並與業務小組協調糾正行動，來消除已確認的弱點。弱點管理，生命週期通常從資產識別和風險背景，到掃描和驗證，再到分析和確定優先次序，再到實際減少或消除弱點的補救。 Priya 的團隊\"開發出一個結構化的時間表來解決已確認的弱點\"，並優先\"影響任務關鍵系統的高風險發現\"，建立補救計劃，分配所有者，排程修補程式 windows，實施設定硬化，使不必要的服務失效，更新脆弱軟體，以及應用補償控制，都是核心補救活動。儘管最後一步提到重新掃描以確認決議並編制遵守報告，但核查步驟是在補救工作完成後進行的。核查是一個重要的後續階段，但並不是在整個所述工作流程中執行的主要階段。 弱點分析更多地涉及對掃描結果的解釋、驗證誤判警示、繪製弱點圖以示影響以及確定可開發性。 風險評估側重於評估業務影響和確定工作優先次序的可能性。此處，這些階段已經存在，但主要重點是協調校執行解決方案並促使其關閉，即補救。簡言之，Priya 正處於補救階段，隨後進行了核查，以確認補救是有效的。","s":"term"},{"n":554,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"During a security evaluation of a smart agriculture setup, an analyst investigates a cloud-managed irrigation controller. The device is found to transmit operational commands and receive firmware updates over unencrypted HTTP. Additionally, it lacks mechanisms to verify the integrity or authenticity of those updates. This vulnerability could allow an adversary to intercept communications or inject malicious firmware, leading to unauthorized control over the device ' s behavior or denial of essential functionality. Which IoT threat category does this situation best illustrate?","o":["Insecure default settings","Insecure ecosystem interfaces","Insufficient privacy protection","Insecure network services"],"a":[3],"e":"CEHIoT 安全模組形容不安全的網路服務是 IoT 裝置時產生的弱點。在未加密的通道上通訊，使用未經身分驗證的更新機制，或曝光無法驗證資料完整性的服務。當操作命令和韌體更新在沒有加密保障的情況下透過 HTTP 傳輸時，攻擊者可以攔截，重放或修改資料流。韌體完整性驗證是安全裝置生命週期管理的關鍵組成部分。 沒有它，對手可以進行韌體注入，允許它們進行遠端控制、持續妥協或破壞裝置功能。這直接與不安全的網路服務相配合，CEH 將其定義為在 IoT 生態系統內受到不當保護的通訊機制和服務互動。不安全的生態系統介面通常與雲的 API 和網路儀表板有關，不安全的預設設定涉及弱的認證資訊或工廠設定，而隱私保護不足則涉及資料保密而不是指令操縱。描述的情境最明顯地適合不安全的網路服務。","s":"term"},{"n":555,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a red team exercise at a financial institution in New York, penetration tester Bob investigates irregularities in time synchronization across critical servers. While probing one server, he decides to use a diagnostic command that allows him to directly interact with the NTP daemon and query its internal state. This command enables him to perform monitoring and retrieve statistics, but it is primarily focused on controlling and checking the operation of the NTP service rather than listing peers with delay, offset, and jitter values. Which command should Bob use to accomplish this?","o":["ntpq -p [host]","ntptrace [-m maxhosts] [servername/IP_address]","ntpdc [-ilnps] [-c command] [host]","ntpq [-inp] [-c command] [host]..."],"a":[2],"e":"最佳匹配\"直接與 NTP 守護程序互動並查詢其內部狀態\"的命令，允許對統計資料的監控和擷取，是 ntpdc。 選項 C 是正確的，因為 ntpdc 被設計為 NTP 的控/query 工具，它使用控制訊息與 NTP 守護程序通訊。 它可用於請求內部變數，統計，和狀態資訊，並進行與 NTP 守護程序操作相關的某些監測式檢查。情境還給出了強烈的排除線索:鮑勃的目標不是主要列出延遲、抵消和快活值的同伴。 同行清單與 ntpq -p(選項 A)關係最為密切，後者會列印同伴關係和計時度量。 同樣，ntptrace(選項 B)被用於追蹤 NTP 伺服器的鏈條(由誰同步)，這不是鮑勃所尋求的。 選項 D(ntpq with -c command)可以查詢某些執行時間細節，但問題強調一個側重於控制/checking 守護程序操作並擷取內部資料資料的診斷命令--這個描述在許多 NTP 管理和診斷工作流程中與 ntpdc 更加緊密地相配合。在實踐中，評估者可能使用 ntpdc 來查詢系統狀態，時鐘變數，以及守護程序的統計等專案，這可以幫助診斷同步異常，並理解 NTP 服務如何在內部行為。 這與“平息其內部狀態”和“擷取統計”相一致。因此，正確的指令是 C。 ntpdc [-ilnps] [-c 命令] [主機]。","s":"tool"},{"n":556,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"Repeated failed login attempts are followed by a sudden surge in outbound data traffic from a critical server. What should be your initial course of action?","o":["Audit all outbound traffic and analyze destination IPs","Immediately disconnect the server from the network","Perform real-time monitoring and log analysis to understand the activity","Change server credentials and force password resets"],"a":[2],"e":"根據 CEH v13 安全營運與事件回應，事件處理的第一步是識別和分析，而不是立即遏制或補救。 觀察到的序列 - - 失序後出現異常的出入境流量 - - 暗示著潛在的妥協，但確切的性質、範圍和影響仍然不明。選項 C 精確地與 CEH v13 事件回應生命週期一致。即時監測和詳細的 日誌 分析使分析師能夠確定該活動是否代表了 認證資訊 填充、野蠻-武力妥協、基於惡意軟體的過濾或誤判。 這一步驟儲存了證據，確定了時限，並有助於確定妥協指標(IOCs)。立即斷開伺服器(可選 B)可能是以後需要的，但過早這樣做會破壞可變的法證證據，擾亂業務運作，並提醒攻擊者。 僅審計出行流量(可選 A)過於狹窄並跳過了認證日誌，系統日誌和處理活動的適當關聯。 在不理解攻擊向量的情況下強制進行認證資訊更改(可選 D)，可能無法阻止基於惡意軟體的持久性。 CEH v13 強調，遏制行動必須藉助分析，否則各組織將面臨對症狀而不是根源作出反應的風險。 因此，正確的初始行動是觀察、分析和識別，使選項 C 成為正確答案。"},{"n":557,"c":"社交工程","ce":"Social Engineering","t":"short","q":"Attackers compromise a legitimate email account and send convincing internal messages requesting urgent actions. What attack is this?","o":["Spoofing","Phishing","Spear phishing","Business Email Compromise"],"a":[3],"e":"正確答案是 D，因為劇情描述了商業電子郵件折中，通常稱為 BEC。 在 BEC 中，攻擊者妥協或濫用了一個可信賴的商業電子郵件帳戶，並向員工，財務團隊，高管，或合作伙伴傳送可信賴的內部資訊。 關鍵線索是\"妥協一個合法的電子郵件帳戶\"，\"說服內部訊息\"，\"緊急行動\"等。 CEH 社交工程概念解釋，基於電腦的社交工程包括了看起來合法的打字和精心設計的電子郵件，而魚叉式網路釣魚則針對一個組織內的個人或小團體。更具體地說，因為攻擊者使用一個合法的被破壞的帳戶，而不只是一個假的或偽造的電子郵件。 CEH 電子郵件劫持內容還描述了向受害者所認識的人傳送資訊的被破壞的電子郵件帳戶和包含匯款等請求的電子郵件。 因此，欺騙，phishing，和魚叉式網路釣魚是相通的，但 Business Email Compromise 是最準確的答案。","s":"term"},{"n":558,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"Which of the following is a component of a risk assessment?","o":["Administrative safeguards","Logical interface","Physical security","DMZ"],"a":[0],"e":"正確答案是 A。 行政保障，因為風險評估是組織安全管理程式的一個基本組成部分，與透過行政、技術和實物控制查明、評估和管理風險密切相關。 行政保障包括安全政策、程式、風險管理程式、安全意識培訓、人員安全、事件應對規劃和治理機制。威脅，評估弱點，確定風險水平，並實行適當的控制，以將風險降低到可接受的水平。在 CEH 資訊保安概念中，風險評估用於確定威脅組織資產的可能性和影響，行政保障是這一程序的一個關鍵部分，因為它們界定了整個組織如何管理和實施安全。 物理安全是一個安全控制類，而不是風險評估元件本身，而 DMZ 是一個用於隔離公-立系統的一個網路架構元素。 邏輯介面指技術系統元件，不是風險評估框架的一部分。 因此，行政保障是最佳的答案，因為它們直接支援一個組織總體安全方案內的風險識別、評價和管理活動。","s":"term"},{"n":559,"c":"系統入侵階段","ce":"System Hacking Phases","t":"long","q":"During a security assessment, an attacker identifies a flaw in a multi-user file system. The system first verifies access rights to a temporary file created by a user. However, immediately after this verification, and before the file is processed, the attacker manages to swap the original file with a malicious version. This manipulation happens in the brief interval between the system ' s access verification and the moment it handles the file, resulting in the malicious file being treated as legitimate. Which vulnerability is the attacker exploiting?","o":["Time-of-validation/time-of-execution issue in resource management logic.","Improper certificate validation in trusted communication channels.","Integer overflow during arithmetic computations with limited memory bounds.","Null pointer dereference leading to unexpected application behavior."],"a":[0],"e":"CEHv13 課程軟體的綜合解釋:CEH v13 解釋道，TOCTOU(檢查時間)在系統檢查一個條件(如檔案權限)後，然後根據這個假設使用資源時，就會出現弱點。 如果驗證與實際使用之間甚至存在很小的缺口，攻擊者可以在驗證後但在執行前更換或修改資源，從而利用這一競爭條件。 這在涉及臨時檔案，符號連結，或共享目錄的檔案處理操作中很常見。 CEH 強調TOCTOU 攻擊經常導致權限提升，未經授權執行，或篡改資料，因為系統信任更早的驗證步驟。 攻擊者利用賽事視窗，在準確的正確時刻交換檔案。 其他選項 - 認證驗證、整數溢位和無指標去引用 - - 不涉及基於時間的競爭條件。 情境完全符合 CEH 對 TOCTOU 開發的描述， 即攻擊者在驗證和執行之間的間隔中操縱檔案存取。"},{"n":560,"c":"惡意軟體威脅","ce":"Malware Threats","t":"long","q":"On July 25, 2025, during a penetration test at Horizon Financial Services in Chicago, Illinois, cybersecurity specialist Laura Bennett is analyzing an attack simulation targeting the company ' s online banking portal. The system logs reveal a coordinated barrage of traffic from multiple compromised systems, orchestrated through a central command-and-control server, flooding the portal and rendering it unavailable to legitimate users. The attack leverages a network of infected devices, likely recruited via malicious links on social media. What is the structure or concept most likely used to launch this coordinated attack?","o":["Smurf Attack","Distributed Reflection Denial-of-Service DRDoS","Botnet","Central Source Propagation"],"a":[2],"e":"CA 殭屍網路是這次攻擊背後最有可能的結構，因為劇情描述了多個被破壞的機器在中央指揮與控制伺服器的指導下產生協調流量。 在符合 CEH 的術語中，殭屍網路是一個被感染的端點集合，被稱作 bots 或殭屍，接收了由攻擊者控制的 C2基礎設施的指示。這些 bots 一旦被命令，就可以同時將大量的請求或封包傳送到目標，從而形成一個分散式阻斷服務條件，將頻寬，伺服器資源，或應用程式容量覆蓋，並使合法使用者無法取得服務。 Key 線索強烈匹配殭屍網路行為。 流量來源於許多被破壞的系統，而不是一個單相的主機，它\"透過中央的指揮與控制伺服器來被剪接\"，這是機器人網的決定性控制機制。 提及\"透過社交媒體上惡意連結被招募\"的裝置，與 CEH 材料所覆蓋的常見的 bot 招募向量一致，包括驅動器的下載，打網，惡意附著，以及安裝惡意軟體並將該裝置輸入殭屍網路的社交工程。 其他選項不準確相配。 藍精靈攻擊是一種更古老的放大技術，使用 ICMP 回聲請求傳送到廣播位址，並帶有偽造的源 IP，一般不描述為被集中控制的被感染裝置。 DRDoS 依賴於反射和放大，透過第三方伺服器如:DNS 或 NTP，其流量來自反射器而不是直接控制的被感染的端點。 \"Central source Propagation\"不是這個被協調的 DDoS 結構的標準名詞。 因此，正確答案是殭屍網路。","s":"term"},{"n":561,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at a regional bank in Richmond, ethical hacker Thomas is tasked with identifying weaknesses in how employee credentials are transmitted. He sets up Wireshark on a mirrored port and captures HTTP login sessions from the customer services VLAN. To quickly reconstruct entire conversations between browsers and the server, Thomas uses a feature that reassembles packet data into a readable stream, allowing him to view usernames and passwords directly in plain text. Which Wireshark feature is Thomas most likely using in this case?","o":["Filtering by IP Address","Display Filtering by Protocol","Monitoring the Specific Ports","Follow TCP Stream"],"a":[3],"e":"Thomas 最有可能使用 Follow TCP Stream。 這個 Wireshark 特性透過將封包按順序重組為可讀對話檢視，重建了所攜帶的 TCP 連線的雙向應用資料。 當流量未加密為 HTTP 時，重新組裝的流可以顯示完整的請求/回應內容，包括 URL，頭，形式參數，以及--在這種情境中關鍵地--使用者名稱和密碼以清晰的文字傳送(例如，在 POST 正文參數內)。情節語言是直接匹配的:\"將瀏覽器和伺服器之間的全部對話重新建構\"，\"將封包的資料重新組合成可讀流\"，這正是 Follow TCP Stream 所做的:它將屬於同為 TCP 的封包分組，並顯示為相接相接資料，使其更加容易。這在評估和調查期間通常用於瞭解交換了哪些資料，驗證敏感資料是否暴露，以及確認像 TLS 這樣的保護是否得到恰當應用。為何其他選項不正確:透過IP 位址(A)過濾幫助將封包清單縮小到特定主機，但不會重建對話。由協定(B)顯示過濾可以隔離出 HTTP 封包，但仍讓分析師在不完全重新組裝的情況下解釋個人封包。監測特定港口(C)類似地縮小了流量(如 TCP/80 為 HTTP)，但沒有呈現可再組裝的工作階段。由於目標快速可讀地重建出 HTTP 登入工作階段於 TCP，正確答案是 D。 follow TCP Stream。","s":"term"},{"n":562,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"A penetration tester is evaluating the security of a mobile application and discovers that it lacks proper input validation. The tester suspects that the application is vulnerable to a malicious code injection attack. What is the most effective way to confirm and exploit this vulnerability?","o":["Perform a brute-force attack on the application ' s login page to guess weak credentials","Inject a malicious JavaScript code into the input fields and observe the application ' s behavior","Use directory traversal to access sensitive files stored in the application ' s internal storage","Execute a dictionary attack on the mobile app ' s encryption algorithm"],"a":[1],"e":"CEH 教導移動應用程式的輸入驗證不足，可以進行程式碼注入攻擊。 將 JavaScript 或被設計出的有效酬載注入欄位，可以驗證應用程式是否不適當地處理不可信資料。 如果執行，可以確認該應用程式容易受到以注入為基礎的攻擊。"},{"n":563,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester discovers that a web application uses unsanitized user input to dynamically generate file paths. The tester identifies that the application is vulnerable to Remote File Inclusion (RFI). Which action should the tester take to exploit this vulnerability?","o":["Inject a SQL query into the input field to perform SQL injection","Use directory traversal to access sensitive system files on the server","Provide a URL pointing to a remote malicious script to include it in the web application","Upload a malicious shell to the server and execute commands remotely"],"a":[2],"e":"當應用程式允許外部資源從使用者控制的輸入中被載入時發生遠端檔案包含。 CEH 教給攻擊者可以提供遠端的 URL 指向惡意指令碼(例如 PHP shell)。 當脆弱應用程式包括了這個外部檔案時，攻擊者的程式碼會執行到伺服器上。 這可以導致完全系統折中，遠端命令執行，或者橫向移動。"},{"n":564,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"A security researcher reviewing an organization ' s website source code finds references to Amazon S3 file locations. What is the most effective way to identify additional publicly accessible S3 bucket URLs used by the target?","o":["Exploit XSS to force the page to reveal the S3 links","Use Google advanced search operators to enumerate S3 bucket URLs","Use SQL injection to extract internal file paths from the database","Perform packet sniffing to intercept internal S3 bucket names"],"a":[1],"e":"OSINT 基於偵察包括使用搜尋引擎識別被公開曝光的雲資產。 CEH 強調 Google Dorking 是一種被動的方法，透過網站: s3.amazonaws.com 或以關鍵詞為基礎的查詢等模式，揭示搜尋引擎中索引的 S3 儲存貯體。"},{"n":565,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"You suspect a Man-in-the-Middle (MitM) attack inside the network. Which network activity would help confirm this?","o":["Sudden increase in traffic","Multiple login attempts from one IP","IP addresses resolving to multiple MAC addresses","Abnormal DNS request volumes"],"a":[2],"e":"CEH v13 將 ARP 欺騙/poisoning 確定為本機網路中的主要 MitM 技術，在此類攻擊中，單張 IP 位址地圖可被分到多張MAC 位址，表示 ARP 表格被操縱。這種異常使得攻擊者可以攔截被害者和閘道器之間的流量。 流量或 DNS 活動可能會增加，但並不是確定的指標。 因此，IP-至 MAC 不一致是 MitM 活動最可靠的確認。","s":"term"},{"n":566,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"A penetration tester discovers malware on a system that disguises itself as legitimate software but performs malicious actions in the background. What type of malware is this?","o":["Trojan","Spyware","Worm","Rootkit"],"a":[0],"e":"CEH v13 定義了 木馬程式 的惡意軟體，它作為合法，可信賴的軟體應用程式出現，同時在幕後秘密執行惡意行動。Trojans 依賴欺騙而不是複製，通常會偽裝成工具，公用事業，更新，或安裝者。 一旦被執行，他們可以安裝後門，去竊取 認證資訊，去過濾資料，或修改系統設定。 CEH 中強調的定義特徵是合法外觀與隱藏的惡意相配合，這與情境完全吻合。 Spyware(可選 B) 專注於監測和資料蒐集，但不一定偽裝成合法的軟體。 Worms(可選 C) 跨網路自複製，本文沒有描述。 Rootkits(可選 D) 隱藏系統失陷，但不一定是合法軟體。 因此， 描述的惡意軟體是 木馬程式。","s":"term"},{"n":567,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"A cyber adversary wants to enumerate firewall rules while minimizing noise and mimicking normal traffic behavior. Which reconnaissance technique enables mapping of firewall filtering behavior using TTL- manipulated packets?","o":["Sending ICMP Echo requests to the network ' s broadcast address","Passive DNS monitoring to observe domain-to-IP relationships","Conducting full SYN scans on all ports for each discovered IP","Firewalking with manipulated TTL values to analyze ACL responses"],"a":[3],"e":"CEHv13 課程軟體的綜合解釋:CEH v13 將 Firewalking 描述為一種偵察技術，用來判斷防火牆允許哪些第 4 層協定與連接埠。攻擊者傳送經過精確調整 TTL 值的封包，使封包剛好在通過防火牆後逾時。如果下一個躍點產生 ICMP Time Exceeded 回應，攻擊者即可推斷防火牆允許哪些連接埠。此方法模擬正常 TTL 行為，因此比完整 SYN 掃描或高雜訊探測更隱蔽。CEH 明確指出，Firewalking 是一種低調的防火牆 ACL 對映方式，可避免觸發警報。廣播 Ping 雜訊大且易被偵測；被動 DNS 監控無法揭露防火牆規則集；完整 SYN 掃描則很容易被 IDS 標記。Firewalking 利用 TTL 行為並搭配特定協定探測，因此是安靜找出開放連接埠與防火牆過濾規則的正確 CEH 技術。"},{"n":568,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"short","q":"An attacker has partial root access to a mobile application. What control best prevents further exploitation?","o":["Secure coding and automated reviews","Certificate pinning","Regular penetration testing","Mobile Application Management (MAM)"],"a":[3],"e":"當存在部分根存取時，防止進一步濫用特權是當務之急。 CEH v13 解釋說，移動應用程式管理(MAM)執行顆粒式的存取控制，應用程式隔離，以及許可執行--甚至在受損裝置上也是如此。安全編碼(備選 A)和測試(備選 C)是預防措施，但不包含積極妥協。 Certain pinning(備選 B)保護通訊，而不是應用控制。 MAM 解決方案允許管理員取消存取，執行政策，並隔離應用，限制攻擊者在入侵後的能力。 因此，選項 D 是正確的。","s":"term"},{"n":569,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"An attacker performs DNS cache snooping using the dig command with the +norecurse flag against a known DNS server. The server returns NOERROR but provides no answer to the query. What does this most likely suggest?","o":["The record was found in the DNS cache and successfully returned.","The DNS server failed to resolve the request.","No client from the DNS server's network has recently accessed the queried domain.","The queried domain has expired and no longer exists."],"a":[2],"e":"根據認證的道德駭客(CEH)偵察和足跡模組，DNS 快取 snooping 是一種被動的資訊蒐集技術，用於確定伺服器的快取是否存在特定的 DNS 記錄。 攻擊者通常使用\"挖取+諾雷克賽\"選項來阻止 DNS 伺服器查詢其他 DNS 伺服器，從而只披露了快取結果。當一個 DNS 伺服器以 NOERROR 回覆但沒有返回一個答案時，它表示網域名稱本身是有效的，但請求的記錄沒有出現在 DNS 快取.CEH 檔案中解釋，這種情況通常發生在最近沒有內部的使用者端詢問該網域名稱時，因此 DNS伺服器沒有對此進行快取的條目。選項 A 不正確，因為快取記錄將返回一個有效的答案部分。選項 B 是不正確的，因為NOERROR 明確表示 DNS 查詢處理成功。選項 D 是不正確的，因為一個已過期或不存在的域通常會返回 NXDOMAIN，而不是 NOERROR。 CEH 材料強調攻擊者使用 DNS 快取 snooping 推斷使用者的行為，內部瀏覽習慣，以及一個組織內潛在目標系統--選項 C 中的正確結論。"},{"n":570,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"During network analysis, clients are receiving incorrect gateway and DNS settings due to a rogue DHCP server. What security feature should the administrator enable to prevent this in the future?","o":["DHCP snooping on trusted interfaces","ARP inspection across VLANs","Port security on all trunk ports","Static DHCP reservations for clients"],"a":[0],"e":"根據 CEH v13,對無賴 DHCP 伺服器最有效的防禦之一是 DHCPsnooping，一個將交換器連接埠歸類為可信任或不可信任的 第 2 層安全特性。 DHCP 回覆只允許在可信任的埠上，通常是與合法的 DHCP 伺服器相連線的埠上。 任何源於無信任的連接埠的 DHCP 或 ACK 被自動刪除。 road DHCP 伺服器正在傳送未經授權的設定設定，因為交換器正在無限制地從所有埠轉發 DHCP 訊息。 CEH 特別警告說，未經管理或設定不當的交換器允許 road DHCP 伺服器指定惡意的 DNS，閘道器，或 IP 設定，允許流量重新導向，擷取，或中間人攻擊。 ARP 檢查(可選 B)保護免受 ARP 欺騙而非 DHCP 濫用。連接埠安全性(可選 C)防止了 MAC 位址泛洪，而非 DHCP 冒用。 靜態保留(可選 D)沒有規模，也不阻止無賴 DHCP 伺服器。 DHCP snooping 直接緩解了這一威脅。","s":"term"},{"n":571,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"During a strategic security briefing at Meridian Global Analytics in Washington, D.C., executives review a series of coordinated activities targeting national infrastructure. These activities include manipulating digital media to influence public perception, disrupting communication networks, and degrading critical systems to weaken institutional stability without direct conventional military engagement. What form of conflict best describes this type of coordinated activity?","o":["Cyberterrorism","Hacktivism","Cyber espionage","Information warfare"],"a":[3],"e":"正確答案是資訊戰。 CEH 介紹性安全報道解釋說，資訊戰涉及協調使用資訊系統、影響操作、破壞、欺騙和攻擊數字基礎設施，以影響感知、決策和機構穩定。包括操縱數字媒體、破壞通訊和破壞關鍵系統，所有這些都是為了削弱目標，而不是傳統的軍事對抗。 這種廣泛的戰略組合超越了網路間諜活動，後者側重於秘密情報蒐集，而超越了駭客主義，而駭客主義通常是意識形態驅動的數字抗議或干擾。 網路恐怖主義可能涉及恐懼和關鍵的基礎設施攻擊，但這一情境是圍繞協調影響和基礎設施效應，作為更廣泛的衝突模式的一部分而更加全面的。 CEH 材料使用資訊戰來描述透過控制、腐敗、破壞或資訊和資訊系統武器化而發生的衝突。 由於活動針對的是國家規模的認知和行動能力，最準確的分類是\"資訊戰爭\"。","s":"term"},{"n":572,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"You are an ethical hacker at HarborLine Assessments, engaged to audit the Wi-Fi at Portside Freight in Tacoma, Washington. During an overnight reconnaissance, you enable your wireless interface's monitor mode and run a command that silently records beacon frames, probe responses, and authentication frames from nearby APs and clients into a capture file for later offline analysis--you do not transmit any frames from your laptop. Based on the described activity, which Wi-Fi security auditing tool are you most likely using?","o":["Aireplay-ng","Aircrack-ng","Airbase-ng","Airodump-ng"],"a":[3],"e":"所描述的活動是監測模式中的被動無線封包擷取--具體蒐集管理訊框(如信標訊框和探測器回應)和觀察使用者端/AP 的相互作用(包括與認證有關的訊框)，而不注入或傳遞任何東西。在 Aircrack-ng 套件中，專門設計用於這一偵察-和抓取目的的工具是 Airodump-ng。 Airodump-ng 是一旦卡被放入監視器模式後在空中介面上收聽的元件，再捕捉出 802.11 訊框並顯示有用克偵察資料，如 BSSID，通道，加密型別，訊號強度，以及關聯用戶端(站)等。 關鍵是，它可以將捕獲到的流量寫入檔案(如.cap)進行離線分析--這與情境下的\"記錄入到一個被捕獲檔案中供後期離線分析\"相匹配。 這是一個常見的 CEH工作流程:偵察#被捕獲#分析，保持了初始步驟的非侵入性。與此相對照的是:Aireplay-ng (A)主要用於活動攻擊/封包注入(如去正反，重放等)，通常涉及傳送訊框。空架-ng(B)主要用於抓取後鍵裂開(WEP/WPA/WPA2 握手)，， 不是為了被動收藏本身。 Airbase-ng (C) 專注於建立無賴 AP/MITM-風格的設定，這也是主動傳輸的角色。因此，對於靜態監控+捕獲信標/probes/auth 訊框到一個檔案，最好的匹配是 D。 Airodump-ng。","s":"tool"},{"n":573,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"A financial technology firm in Atlanta, Georgia launches an internal investigation after multiple employees report that a popular messaging application on their Android devices has begun displaying excessive advertisements and behaving unpredictably. Security analysts discover that users had installed a utility application from a third-party marketplace weeks earlier. Further examination shows that this application silently replaced certain legitimate apps already present on the device. The compromised applications were then used to generate large volumes of advertisements and collect user data for external transmission. Based on the observed behavior, what malware is most consistent with this incident?","o":["GoldPickaxe","Agent Smith","Pegasus","Mamont"],"a":[1],"e":"正確答案是 B。 Smith 探員。 Agent Smith 是一個 Android 惡意軟體家族，以濫用被感染的應用程式來靜默地用惡意版本來取代合法安裝的應用軟體而出名。 被破壞的應用軟體在被替換後可以顯示欺詐性廣告並蒐集或傳輸與使用者相關的資料。符合 CEH 的行動裝置安全材料解釋，移動惡意軟體針對移動裝置來竊取個人資料，從不信任來源安裝應用程式增加了惡意軟體入侵的風險。 這也解釋了 Android 應用程式由活動，服務，廣播接收器，內容提供者等元件和顯示檔案組成，惡意軟體可以濫用這些元件來執行背景行為並與其他應用程式互動。選項 A。 GoldPickaxe 是不正確的，因為 GoldPickaxe 與移動銀行業務和身分相關盜竊活動有關，而不是所描述的經典應用替換和欺詐行為。選項 C。 Pegasus 是不正確的，因為 Pegasus 是側重於監視和資料擷取的高階間諜軟體，而不是主要取代已安裝的應用來生成廣告。選項 D。 Mamont 是不正確的 因為馬蒙特和 Android Bank/社交工程欺詐活動有關 不是上面描述的軟體替換廣告行為因此，最好的答案是 B。Smith 探員。","s":"term"},{"n":574,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"mid","q":"As part of a penetration test for a financial firm's smart headquarters in Denver, Colorado, ethical hacker Jordan Lee begins evaluating the IoT infrastructure responsible for lighting, HVAC, and badge-controlled access. Jordan documents details such as device models, manufacturer names, firmware versions, and supported protocols like Zigbee and BLE. This information is used to understand the device ecosystem. Which step of the IoT hacking methodology is being carried out in this phase?","o":["Information gathering","Launch attacks","Vulnerability scanning","Gain remote access"],"a":[0],"e":"這個階段是資訊蒐集，是符合 CEH 材料中描述的 IoT 穿透測試方法中的第一個也是最基礎的步驟。這裡的目標是建立IoT 的準確清單。環境並理解裝置如何溝通、硬體和軟體版本以及使用哪些協定和介面。約旦正在蒐集裝置模型、製造商名稱、韌體版本以及 Zigbee 和 BLE 等支援協定。該活動圖直接到列舉，並剖析目標 IoT 生態系統，在任何侵入性測試之前進行。 在 CEH 方法術語中，這一步驟有助於識別攻擊面，包括無線介面，管理埠，雲後端，移動應用，以及連線 IoT網路到企業網路的閘道器。資訊蒐集至關重要，因為 IoT 風險高度依賴於特定裝置型別和韌體建構。知道韌體版本可以揭示已知的 CVES 是否適用，預設認證資訊是否可能適用，或者是否通常啟用不安全的服務。 識別 Zigbee 和 BLE 表示潛在的無線評估途徑，如不可靠的配對，弱的加密或金鑰處理，錯構了存取控制，和協定特有的弱點等。其他選擇則在以後出現。 弱點掃描是測試者用掃描器、列舉探測器或定向驗證來積極檢查識別出的裝置和服務缺陷的步驟。 發動攻擊和獲得遠端存取是規劃和發現後的開發步驟。 由於約旦只是記錄和了解生態系統，正確的步驟是蒐集資訊。"},{"n":575,"c":"系統入侵階段","ce":"System Hacking Phases","t":"long","q":"Ethan works as a penetration tester at CyberGuard Solutions, a cybersecurity consulting firm in Raleigh, North Carolina. During an authorized security assessment of a regional insurance company, Ethan was provided with a set of password hashes to evaluate the strength of employee-generated credentials. To test resistance against word-based password creation patterns, Ethan supplied a single custom wordlist containing common organizational terms and department names into his cracking tool. The tool automatically generated password candidates by linking multiple entries from that same list in varying combinations before attempting to match them against the hashes. This approach proved highly effective against passwords formed by concatenating familiar words. Which of the following password-cracking techniques is Ethan using?","o":["PRINCE Attack","Combinator Attack","Markov-Chain Attack","Fingerprint Attack"],"a":[0],"e":"正確答案是 A。 PRINCE 攻擊。關鍵線索是，伊森使用一個自訂的單詞清單，而解密工具透過將同一清單的多個條目連結起來，自動生成候選者。 這與 PRINCE 攻擊匹配，它透過將單詞從一個輸入清單中連結而建構出密碼候選者，它與透過將熟悉的單詞，例如公司名稱，部門，專案名稱，或常見的內部名詞等來調校而製成的密碼是有效的。 符合 CEH 密碼-cracking 材料解釋攻擊者經常會利用詞典詞和可預見組合等薄弱的密碼習慣，還描述了詞典攻擊，野蠻-武力攻擊，混合攻擊，音節攻擊，規則攻擊，彩虹表，並作為常用的密碼-cracking 方法來分發密碼恢復。選項 B。 組合器攻擊是相近的，但傳統上它從兩個獨立的單詞清單中合併出單詞。 情境中特別指出了伊森提供了單一自訂單詞清單。選項 C。Markov-Chain Attack 是不正確的，因為 Markov 攻擊根據統計字元機率模型生成候選人，而不是透過將一個清單中的整個單詞連起來。選項 D。 指紋攻擊是不正確的，因為指紋攻擊會根據所觀察到的密碼結構或圖案來建立候選人，而不是具體透過從一個單詞清單中調校條目。因此，最好的答案是 A.PRINCE 攻擊。","s":"term"},{"n":576,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"long","q":"At Norwest Freight Services, a rotating audit team is asked to evaluate host exposure across multiple departments following a suspected misconfiguration incident. Simon, a junior analyst working from a trusted subnet, initiates a network-wide scan using the default configuration profile of his assessment tool. The tool completes quickly but returns only partial insights such as open service ports and version banners while deeper registry settings, user policies, and missing patches remain unreported. Midway through the report review, Simon notices that system login prompts were never triggered during scanning, and no credential failures were logged in the SIEM. Which type of vulnerability scan BEST explains the behavior observed in Simon's assessment?","o":["Unauthenticated Scanning","Authenticated Scanning","Internal Scan","Credentialed Scanning"],"a":[0],"e":"描述的行為與未經身分驗證的掃描最相符合。 在符合 CEH 弱點評估方法中，未經身分驗證的掃描從外部或非特權實體的角度評價系統。掃描器通常可以識別網路可存取服務，開放埠，服務橫幅，協定指紋，有時從版本或被曝光的設定中推斷出已知的弱點。 然而，它無法可靠地檢查主機-內部態勢，例如登錄設定，本機安全政策，已安裝的修補程式級別，缺失的熱修補程式，詳細的設定基線，或者使用者和組策略設定，因為這些需要認證直接查詢作業系統和已安裝軟體存貨的查詢權限。該快報明確指出，結果僅限於\"開放服務埠和版本橫幅\"，\"更深的登錄設定，使用者政策和缺失的修補程式仍未被報告\"。 該限制是未經身分驗證掃描的標誌。 附加的線索\"系統登入提示從未被觸發\"和\"未經身分驗證資訊的故障被記錄在SIEM\"進一步證實，掃描器從未試圖透過帳戶，SSH/WinRM/WMI，SMB，或代理基於認證資訊的檢查來認證端點。 如果掃描被認證或認證，您會期待認證嘗試，一些服務的潛在登入提示，並經常審計反映成功或失敗的登入的日誌或 SIEM 事件。選項 C，內部掃描，只描述掃描的發端地，而不是是否使用認證資訊。 選項 B 和 D 意味著認證和主機級的詢問，這與觀察到的認證資訊活動的缺失和缺失的修補程式/policy 能見度相矛盾。 因此，未經身分驗證的掃描最能解釋結果。","s":"term"},{"n":577,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"An attacker performs DNS cache snooping using dig +norecurse. The DNS server returns NOERROR but no answer. What does this indicate?","o":["The domain has expired","The record was cached and returned","The DNS server failed","No recent client from that network accessed the domain"],"a":[3],"e":"在 CEH v13 DNS 列舉中，DNS 快取 snooping 確定一個 DNS 解析器是否有記錄快取。 當使用+norecurse 且回覆為NOERROR 而無答案時，表示伺服器是權威的，但沒有記錄快取。 CEH v13 解釋，這說明最近沒有內部的使用者端詢問過這個域，使得選項 D 正確。"},{"n":578,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"In Miami, Florida, Sarah Thompson, a security analyst at Apex Cyber Defense, is tasked with monitoring the wireless infrastructure at Coastal Healthcare, a busy urban hospital. One morning, nurse Emily Carter reports that her tablet used for accessing patient records is unexpectedly connecting to an access point broadcasting a name and signal similar to the hospital's secure Wi-Fi. Upon investigation, Sarah's log analysis reveals an unauthorized device on the network capturing sensitive traffic from connected systems. Suspecting a breach, she identifies that the attacker has deployed an access point to mimic the hospital's legitimate network. Based on this behavior, which wireless threat is the attacker executing?","o":["Misconfigured AP","Rogue AP","Evil Twin AP","Honeypot AP"],"a":[2],"e":"邪惡雙子存取點是一種惡意的無線存取點，透過複製其 SSID 並經常模仿安全設定和訊號行為等其他可觀察到的特性來冒充合法的 Wi-Fi 網路。 在符合 CEH 的無線攻擊覆蓋中，目標是欺騙使用者連線到攻擊者控制的 AP 而不是真實的。 一旦受害者裝置關聯，攻擊者可以在中途擷取中能出演人，抓取認證資訊，觀察敏感流量，如果受害者無法正確驗證網路，則可能降低保護等級。此情境與\"邪惡雙胞胎\"很吻合，因為平板電腦連線了存取點\"廣播一個類似於醫院安全無線網路(Wi-Fi)的名稱和訊號\"，而莎拉發現一個未經授權的裝置捕獲了連線系統的敏感流量，這個組合表示主動冒用和使用者端欺騙，而不僅僅是意外裝置。 流氓 AP 一般是未經授權的存取點與內部網路相接，通常由員工為方便而部署，可能不會被設計為冒用官員 SSID 來引誘客戶。 錯誤設定的 AP 指一個設定薄弱或安全控制不當的存取點，而不是攻擊者所建立的克隆。 一個蜜罐 AP 是防禦人員為吸引攻擊者而故意設定的誘餌，這與所描述的情況相反。在 CEH 最佳做法中強調的緩解措施包括使用 WPA2 企業或 WPA3 企業驗證憑證，在有支援的地方允許受保護管理訊框，部署無線入侵探測和預防以識別偽造的SSID 和 BSSID 異常，儘可能使自動連線失效，並培訓使用者報告可疑的網路提示或出乎意料的再連線行為。","s":"term"},{"n":579,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"In Austin, Texas, ethical hacker Michael Reyes is conducting a red team exercise for Horizon Tech, a software development firm. During his assessment, Michael crafts a malicious link that appears to lead to the company ' s internal project management portal. When an unsuspecting employee clicks the link, it redirects them to a login session that Michael has already initialized with the server. After the employee logs in, Michael uses that session to access the portal in a controlled test, demonstrating a vulnerability to the IT team. Which session hijacking technique is Michael using in this red team exercise?","o":["Session donation attack","Session replay attack","Session sniffing","Session fixation attack"],"a":[3],"e":"這個情境匹配了工作階段固定攻擊，因為邁克爾先用應用程式設定了有效的工作階段識別碼，然後強迫被害者在使用同樣預先確定的工作階段的同時進行認證。 在 CEH 術語中，工作階段固定是指攻擊者\"固定\"或將已知的工作階段 ID 植入被害者瀏覽器，一般透過被精心設計的 URL 參數，透過子域設定 Cookie，或者透過重定向儲存了工作階段權杖。 如果應用程式在登入後沒有再生成工作階段 ID，則被害者的認證就會被繫結在被害者已知的工作階段。 攻擊者然後可以再用同為工作階段 ID 的 ID 來存取與被害者一樣的應用程式，這與邁克爾在員工日誌進入後\"使用該工作階段進入\"入口網站時所描述的完全相同。其他選項不符合機理。 工作階段嗅探依賴於從網路流量捕獲工作階段權杖，通常在加密缺失或弱出時，但問題集中於連結和被初始化的工作階段而不是攔截流量。 工作階段回放一般是指捕獲並重放認證交換或權杖， 而非在被害者認證前預先設定一工作階段。\"工作階段捐贈\"不是此行為的標準 CEH 標籤，也並非與所描述的流量的最佳匹配。 CEH-推薦的緩解包括認證和特權變更後立即再生成工作階段 ID，拒絕在 URL 中提供的工作階段 ID，設定 Safety 和HttpOncookie 旗，酌情執行 SameSite，執行短閒超時，並增加伺服器-側控來偵測同時使用或異常的工作階段繫結更改。","s":"term"},{"n":580,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"A malware analyst finds JavaScript and /OpenAction keywords in a suspicious PDF using pdfid. What should be the next step to assess the potential impact?","o":["Upload the file to VirusTotal","Extract and analyze stream objects using PDFStreamDumper","Compute file hashes for signature matching"],"a":[1],"e":"CEH 的惡意軟體分析模組概述了一種結構化的方法:確定可疑指標(如 JavaScript、公開行動)擷取和分析嵌入式物件確定行為和利用邏輯 PDFStream Dumper 允許分析師擷擷取 JavaScript 程式碼和嵌入式物件，以供詳細檢查。選項 B 是正確的。選項 A 有用，但不足以進行深入分析。選項 C 只幫助識別，而不是行為理解。"},{"n":581,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"An attacker abuses PowerShell heavily. Which log helps most?","o":["DNS logs","Firewall logs","Syslog","PowerShell script block logs"],"a":[3],"e":"正確答案是 D，因為 PowerShell 指令碼塊日誌為以 PowerShell 為主的攻擊者活動提供了最直接的能見度。 在CEH-style 安全營運與事件回應中，防禦人員必須審查最接近被調查的可疑活動的日誌。 PowerShell 被廣泛用於Windows 自動化，管理和後滲透動作； CEH 相關的材料指出，PowerShell 可以在微軟 Windows 系統上實現任務自動化，並可以在損害到 Windows 目標後被使用。 指令碼塊記錄實際執行的 PowerShell 程式碼塊， 包括可疑命令， 編碼命令， 下載搖籃， 權限提升 指令碼， 和內膜執行嘗試。 DNS 日誌可能顯示域搜尋， 和 防火牆日誌 可能顯示網路連線， 但不顯示 PowerShell 命令本身。 Syslog 是通用的 和更常見於 Uni/Linux 或集中式伐木環境。 由於攻擊者濫用了PowerShell，PowerShell 指令碼塊日誌給調查人員提供了命令內容、執行行為和惡意的最有力證據。 因此，選項 D 是最好的答案。","s":"term"},{"n":582,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"During a red team simulation at a bank in Chicago, Illinois, the SOC team suspects that some of the incoming traffic may be spoofed. To verify this, an analyst begins monitoring the sequence values assigned to packets, looking for irregularities that indicate they were not generated by the legitimate source. Which spoofing detection technique is the analyst using?","o":["Packet Filtering","TCP Flow Control Method","IP Identification Number (IPID) Monitoring","Direct TTL Probes"],"a":[1],"e":"分析員正在使用 TCP 流量控制方法，因為設想方案的重點是監測 TCP 序列值的異常情況，在 TCP 通訊中，序列(和確認)數字對流量控制和可靠性至關重要。 一個合法的 TCP 流遵循了可預測的規則:序列數根據傳輸的資料數量而進步，確認與收到的位元組一致，而下行/ack 值之間的關係與工作階段的每個方向一致。 當流量為偽造的時--特別是如果攻擊者在未充分參與合法 TCP 狀態的情況下注入封包時--那些封包往往含有與已建立連線的預期視窗不相匹配的序號。 這會造成異常，如出窗序列值，錯誤的承認，或由端點所觸發的重回。 By 監測序列相關行為，防禦人員可以發現真端點沒有產生的被偽造或注入的封包的痕跡。 這一技術在處理被懷疑為 TCP 工作階段欺騙或被注入時特別相關。 如果攻擊者試圖透過猜測或偷取序號來插入資料或擾亂工作階段。 為什麼其他選項不匹配\"序列值\"線索:封包過濾(A)是一種預防性控制(被規則所阻斷)，而不是基於分析序列進取的偵測方法。 IPID Movement(C)專注於 IP 識別欄位行為模式來推斷欺騙(通常 OS-特定IPID 增量)， 但情境顯然為 TCP 序列值，而非 IP 頭標識 type。 Direct TTL 探測器(D)檢查 TTL 特性(跳計異常)以推斷欺騙或路徑差異；再次，不是序列數分析。 因此，所描述的欺騙偵測技術是 B。 TCP 流量控制方法。","s":"term"},{"n":583,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"short","q":"Which advanced mobile attack is hardest to detect and mitigate?","o":["Mobile MitM","Jailbreaking/Rooting","Mobile Remote Access Trojan (RAT)","Clickjacking"],"a":[2],"e":"移動遠端存取特洛伊(RATs)在 CEH v13 移動平台 Hacking 中被強調為最危險的威脅之一。 移動 RAT 一旦被安裝，可以提供攻擊者持續，隱蔽地存取裝置，允許螢幕捕捉，按鍵記錄，麥克風活化，以及資料外洩。與 MitM 或點選劫機不同，RAT 執行後折中，常被偽裝為合法應用。 jailbreak 透過完整性檢查可以被偵測出，但 RAT 即使被隱藏在非嵌入式裝置上也能被隱藏。 CEH v13 強調 RAT 繞過傳統防禦，包括防毒和 MDM，使其極難被偵測。 因此，選項 C 是正確的。","s":"term"},{"n":584,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"A defense contractor in Arlington, Virginia, initiated an internal awareness exercise to test employee susceptibility to human-based manipulation. During the assessment, an individual posing as an external recruitment consultant began casually engaging several engineers at a nearby industry networking event. Over multiple conversations, the individual gradually steered discussions toward current research initiatives, development timelines, and internal project code names. No direct requests for credentials or syste
