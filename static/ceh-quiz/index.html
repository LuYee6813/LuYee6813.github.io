ing","t":"mid","q":"A regional healthcare provider in Minneapolis, Minnesota began experiencing intermittent connectivity issues across a newly activated access-layer network segment. Shortly after a contractor connected a diagnostic device to an unused switch port, multiple employee workstations failed to receive valid network configurations. System logs showed repeated address negotiation attempts from affected hosts, while monitoring tools recorded a rapid sequence of configuration requests originating from a single switch interface. Within minutes, additional clients on the segment encountered similar assignment failures. From a sniffing standpoint, which technique most accurately explains this behavior?","o":["IRDP Spoofing","DHCP Starvation","Rogue DHCP Server","MAC Spoofing"],"a":[1],"e":"這種活動最準確地描述了 DHCP 飢餓攻擊。 CEH 網路和嗅探覆蓋說明 DHCP 飢餓是一種阻斷服務技術，攻擊者在其中迅速發出大量 DHCP 請求，通常使用偽造的 MAC 位址來消耗 DHCP 池中所有可用的 IP 位址。 一旦池子用完，合法客戶就再也無法獲得有效的租約，這就產生了問題中描述的症狀:重複的位址談判嘗試，無法接收設定，以及來自單一介面的請求突起。 rogue DHCP 伺服器經常被後期與飢餓相配， 但這裡的關鍵證據是快速耗盡行為，而不是惡意設定的分佈。IRDP 欺騙會操縱閘道器發現，而不是主要消耗 DHCP 租賃， 單是 MAC 欺騙並不能解釋多個主機的廣泛位址分配失敗。CEH 指導將 DHCP 餓死作為網路中斷問題和進一步攔截攻擊的踏腳石，因為拒絕合法的 DHCP 服務可以為流氓 DHCP伺服器提供條件來接管使用者端設定並重新定向流量。","s":"term"},{"n":661,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"What does ATT & CK tactic \"Persistence\" mean?","o":["Initial exploit","Data theft","Cleanup","Long-term access"],"a":[3],"e":"正確答案是 D，長期存取。 在 MITRE ATT & CK 術語中，\"持續\"指對手在初始入侵後使用技術來保持對已受損環境的存取。 這與 CEH 系統打包方法緊密相接， 其對應的階段是\"Mainkeeping Access\"。 CEH 材料描述維持存取是駭客在利用了弱點後試圖保留系統所有權的階段， 經常透過後門確保持續進入， 根基， 鍵盤 特洛伊人， 特洛伊人， 或作木馬程式馬後門。 另一個以 CEH 為主的源解說出，在權限提升之後，攻擊者透過建立允許後回存取的機制來維持存取，這直接符合長期存取的概念。 最初的開發屬於取得存取，資料被竊更多與蒐集或被過濾有關，而清理則與覆蓋軌道有關。 因此，ATT & CK\"Persistence\"意味著取得存取，資料被竊取。保持長期進入目標環境。","s":"term"},{"n":662,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"A system's audit logs are not centralized. Which attack phase is hardest to detect?","o":["Initial access","Lateral movement","Delivery","Recon"],"a":[1],"e":"正確答案是 B，平相運動。 在 CEH 安全營運與事件回應概念中，審計日誌對於追蹤使用者活動，來源 IP 位址，logon/logoff 事件，系統變化等重要安全事件至關重要。 CEH 相關材料稱，審計日誌對追溯事件並找出根源至關重要；當會計或記錄資訊不足時，事件調查變得極其困難。 不集中記錄，橫向移動尤其難以被偵測出，因為攻擊者的活動被分散在多個內部主機中。 探測它需要關聯事件，例如認證嘗試，遠端服務執行，SMB 存取，PowerShell 使用，特權變化，以及端點之間的連線等。 如果每個系統都在當地保持日誌，防禦人員可能會錯過完整的攻擊路徑，特別是如果攻擊者清除或篡改了本機的日誌。 CEH 駭客方法也指出攻擊者可以破壞連線的中間系統，並使用被破壞的系統來向他人發動攻擊。 偵察，交付，和初始存取可能仍然出現在周邊，電子郵件，代理，或防火牆日誌，但平後移動嚴重地依賴於交叉主機的審計相關性。","s":"term"},{"n":663,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"short","q":"SCADA anomalies suggest a side-channel attack. Which investigation best confirms this?","o":["Review user interfaces","Measure hardware-level operational fluctuations","Identify weak crypto settings","Assess network latency"],"a":[1],"e":"如 CEH v13 OT 和 SCADA Security 所解釋的側道攻擊，透過觀察一個系統的物理特徵來擷取敏感資訊，而不是直接利用軟體的缺陷，這些特徵可能包括功率消耗，電磁排放，計時變異，或熱輸出等。在 SCADA 環境中，側道攻擊特別危險，因為它們繞過傳統的網路防禦。 證實這種攻擊的最可靠方法是分析硬體水平的反常現象--比如在正常裝置操作中意外的功率用量突起或不規則的訊號放出等。選項 B 直接與 CEHv13 指導對接。選項 A，C，和 D 聚焦於軟體，密碼學，或網路行為，這些不是側道開發的主要指標。因此，選項 B 是正確的。"},{"n":664,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"Infected systems receive external instructions over HTTP and DNS, with fileless payloads modifying system components. What is the most effective action to detect and disrupt this malware?","o":["Update antivirus signatures regularly","Allow only encrypted traffic via proxies","Block common malware ports","Use behavioral analytics to monitor abnormal outbound behavior"],"a":[3],"e":"此情境描述無檔案惡意軟體使用隱蔽的指令和控制(C2)通道，超過通常允許的協定，如 HTTP 和 DNS，這種技術在 CEH v13 惡意軟體威脅中被大力強調。 這種惡意軟體避免了將檔案寫入磁碟，而是利用記憶體，合法系統工具，以及可信賴的協定來逃避傳統的防禦。基於簽名的防毒更新(可選 A)對沒有備案的惡意軟體無效，因為沒有靜態的文物可以匹配。 遮蔽已知的惡意軟體埠(可選 C)也是無效的，因為惡意軟體有意使用埠 80 和 53,它們必須保持正常業務開放。 限制平原HTTP(可選 B)可能會降低能見度，但不會停止 DNS 通路或加密惡意流量。 CEH v13 將行為分析確定為針對高階惡意軟體的最有效對抗措施。行為解決方案為正常系統和網路活動確定了基線，然後偵測異常情況。作為:異常外出 DNS 查詢模式非正常的 HTTP 信標間隔合法申請行為可疑 PowerShell 或系統工具意外生成網路流量透過監測系統的行為而不是存在的檔案，行為分析可以識別隱形 C2 通訊並及早干擾它們。 因此，選項 D 是最有效的和符合 CEH 的反應。"},{"n":665,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A web app deserializes untrusted data leading to RCE. What flaw exists?","o":["SSTI","Insecure deserialization","SQLi","XSS"],"a":[1],"e":"正確答案是 B，因為問題直接描述了一個 Web 應用程式反序列化無信任資料，這是不安全的反序列化的經典條件。 解序列化是將序列化資料轉換回物件或可使用的程式結構的過程。 當一個應用程式接受來自一個不可信來源的序列化資料，並在沒有適當的驗證，完整性檢查，或型別限制的情況下處理時，攻擊者可能會操縱序列化物件並影回應用程式邏輯。 在嚴重的情況下，這可能導致遠端程式碼執行，權限提升，認證繞行，或應用程式被接管。 CEHWeb 應用程式安全材料將這一問題對映到 OWASP 網路風險，其中不安全的反序列化被確定為可導致遠端程式碼執行攻擊的缺陷，屬於最嚴重的應用影響。 SSTI 涉及伺服器-側範本注入，SQLi 目標為資料庫查詢，而 XSS 在使用者瀏覽器中執行指令碼。 由於這個問題特別提到造成 RCE 的非信任的反序列化資料，因此確切的缺陷是不安全的反序列化。","s":"term"},{"n":666,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"A large mobile telephony and data network operator has a data center that houses network elements. These are essentially large computers running on Linux. The perimeter of the data center is secured with firewalls and IPS systems. What is the best security policy concerning this setup?","o":["There is no need for specific security measures on the network elements as long as firewalls and IPS systems exist.","The operator knows that attacks and down time are inevitable and should have a backup site.","Network elements must be hardened with user ids and strong passwords. Regular security tests and audits should be performed.","As long as the physical access to the network elements is restricted, there is no need for additional measures."],"a":[2],"e":"正確答案是 C。 防火牆 和 IPS 系統保護周邊，但是它們不會取代系統硬化， 存取控制，修補程式，審計，以及內部網路元素本身的定期安全測試。 在 CEH 安全概念中，防禦應分層實施，通常稱為防禦深度。 這意味著即使攻擊者繞過周邊防禦，內部系統仍應被保護。由於這些網路元素是以 Linux 為主的電腦，它們需要強大的使用者帳戶管理，安全認證，最不特權，服務硬化，弱點評估，修補程式管理，強有力的密碼和獨特的使用者 IDs 也支援問責制並減少未經授權進入的風險。選項 A 是不正確的，因為僅依靠防火牆和 IPS 就會產生一個失敗點。 選項 B 提及了災難恢復，但沒有涉及預防安全。 選項 D 也是不完整的，因為僅憑實體安全無法阻止遠端攻擊，惡意軟體，內幕威脅，錯位，或認證資訊濫用。因此，最好的政策是加強系統，並定期進行安全測試和審計。"},{"n":667,"c":"密碼學","ce":"Cryptography","t":"mid","q":"You are Evelyn, an ethical hacker at LoneStar Health in Austin, Texas, engaged to investigate a recent compromise of archived patient records. During the investigation you recover a large set of encrypted records from a compromised backup and, separately, obtain several original template records (standard headers and form fields) that correspond to some entries in the encrypted set. You plan to use these paired examples (the original templates and their encrypted counterparts) to attempt to recover keys or deduce other plaintext values. Which cryptanalytic approach is most appropriate for this situation?","o":["Chosen-ciphertext attack","Known-plaintext attack","Chosen-plaintext attack","Ciphertext-only attack"],"a":[1],"e":"正確答案是 B。 Known-明文 攻擊，因為情境明確為相同的基礎資料提供了明文和密文的對等樣本。 在已知的明文攻擊中，分析師擁有一個或多個已知原始訊息(明文)和相應的加密輸出(密文)也可用的例子。 這些對子可以用來分析密碼的行為，驗證關於 model/parameters 的假說，以及--取決於演算法，執行弱點，和金鑰管理--嘗試回收加密金鑰或解密同一金鑰下加密的其他密碼文字。在這裡，伊夫林有\"原始範本記錄(標準頭和窗體欄位)\"及其被竊備份集中的\"加密對等者\"。Medical record 格式通常包含可預見結構(固定頭，重複欄位名，標準化表)，這增加了準確掌握明文區段的可能性。 足夠已知的明文/密文對， 攻擊者可能識別出由弱加密選擇導致的規律， 重新使用的金鑰， 已再用 IVs/nonces， 不安全模式(例如， ECB 顯示結構)， 或有缺陷的自訂加密。甚至 當他們用有力的演算法的時候， 已知的明文材料仍可用於確認加密計劃 並發現執行錯誤。為什麼其他選項不正確:密文-僅假設攻擊者只有加密資料，沒有明文例--被範本所相沖突。Chosen-明文要求能夠向加密甲骨文提交任意的平白文字並接收密碼文字，而情境沒有說明。 Chosen-密文要求能夠向解密甲骨文提交密碼文字並觀察輸出，同樣沒有說明。因為伊芙琳有真實的，匹配同一套資料集的明文-密文對，所以最合適的密碼分析方法是已知的-明文攻擊。","s":"term"},{"n":668,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"Which of the following is a common framework applied by business management and other personnel to identify potential events that may affect the enterprise, manage the associated risks and opportunities, and provide reasonable assurance that objectives will be achieved?","o":["Risk management framework","Qualitative risk assessment","PC-DSS","NIST SP 800-37"],"a":[0],"e":"正確答案是 A.風險管理框架，問題介紹了管理層和其他人員為確定可能影響業務目標的事件、管理風險和機會併為實現各專案標提供合理保證而採用的企業級風險管理方法。 在符合 CEH 的資訊保安概念中， 風險管理的重點是確定組織資產，對這些資產的威脅， 弱點，包括弱點和弱點 選擇反措施以減少風險 並改進本組織的資安態勢。 風險評估， 風險處理，風險追蹤 風險審查。定性風險評估只是使用低，中，高等描述性評級來評估風險的一種方法；它不是完整的企業框架。PCI-DSS 特別適用於支付卡資料安全，而 NIST SP 800-37 是聯邦資訊系統風險管理的具體出版物。 因此，最好的一般CEH 答案是風險管理框架。","s":"term"},{"n":669,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"An authorized security assessment is performed on a public-sector services portal in Madison, Wisconsin. After authenticating with a controlled test account, the assessor captures the authentication identifier issued by the application. Under controlled lab conditions, she attempts to reuse the captured identifier from a separate machine connected through a different encrypted channel. Although the identifier remains valid and within its lifetime, the application rejects the request when presented from the alternate environment. Analysis indicates that the server evaluates characteristics associated with the original secure exchange before allowing continued use of the issued identifier. Which defensive mechanism most likely explains this behavior?","o":["Encrypting DNS resolution traffic using DNS over HTTPS","Cryptographically binding authentication tokens to the TLS connection context","Applying IPsec protection at the network layer","Enforcing HTTP Strict Transport Security"],"a":[1],"e":"正確答案是 B。 Cryptography 將認證符繫結在 TLS 連線上下文。題目描述一個防禦工作階段權杖重放。 攻擊者/tester 有一個有效的認證識別符號，但應用程式在從不同的機器和不同的加密通道再使用時拒絕它，這說明權杖本身不被接受；它繫結在原來的 TLS-securityd 工作階段上下文上。 符合 CEH 工作階段劫持 材質解釋道: 工作階段 重放時，攻擊者會捕捉到認證符並重放請求，以獲得未經授權的存取。 它還描述了工作階段劫持在認證已經完成後接管了認證的工作階段。TLS 材料解釋道:TLS 提供安全的通訊，對等認證，共享金鑰生成，並在端點之間保障了工作階段的建立。 將符符綁入TLS 上下文，防止被捕獲的符被透過不同的 TLS 連線再用。選項 A。 使用 DNS 對 HTTPS 的 DNS 解析度流量進行加密是不正確的，因為 DNS 對 HTTPS 的保護 DNS 瀏覽，而不是應用工作階段權杖。選項 C。 在網路層應用 IPsec 保護是不正確的，因為 IPsec 保護網路層的流量。 問題具體描述了一個應用釋出的認證識別符號正在被驗證，以對抗原始的安全交換。選項 D。 執行 HTTP 嚴格運輸安全是不正確的，因為 HSTS 迫使瀏覽器使用 HTTPS，但是它並沒有在加密上將一個權杖綁入特定的 TLS 通道。因此，最好的答案是 B。 Cryptography 將認證符繫結在 TLS 連線上下文。"},{"n":670,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"You are a wireless auditor at SeaFront Labs in San Diego, California, engaged to review the radio-layer protections used by a biotech research facility. While capturing traffic in monitor mode, you observe frames that include a CCMP-like header and AES-based encryption, and you note the use of a four-way handshake with a packet number (PN) for replay protection -- features that were introduced to replace older TKIP/RC4 approaches. Based on these observed characteristics, which wireless encryption protocol is the access point most likely using?","o":["WPA2","WPA","WPA3","WEP"],"a":[0],"e":"觀測到的特徵最強烈地指向 WPA2,因為情境明確識別出 CCMP-像頭和 AES 基於加密，同時使用封包號碼(PN)和熟悉的四向握手。 WPA2(以 IEEE802.11i 為基礎)取代了依賴 RC4 和 TKIP 的舊方法， 引入了 AES-CCMP 作為 Wi-Fi 保護網路的標準資料保密和完整性機制。 CCMP 在為無線訊框設計的模式中使用了 AES，幷包括了每封包號碼來防止回放攻擊。提到這些特徵被\"引入來取代更古老的 TKIP/RC4 方法\"，是一個主要線索。 原出 WPA 的設計是相對於 WEP 的過渡升級，並被常用的 TKIP 與 RC4,而 WPA2 則將更強大的 AES-CCMP 機制標準化。 四向握手用於從使用者端到存取點之間擷取並安裝出新鮮的工作階段鍵(pairwise transient key)，而封包的號碼會隨每個加密的訊框增加以提供回放保護並保持加密的正確性。為何其他選擇不合適:WEP (D) 使用有弱 IV 處理功能的 RC4,缺少強硬的金鑰管理和握手屬性說明。 WPA (B)通常以 TKIP/RC4 為中心，而不是以 AES-CCMP 作為定義特徵集，特別是在 CEH-風格區分中。 WPA3(C) 引入改進 例如:SAE(同時驗證等同物)取代了 WPA2-個人的後遺症 PSK 握手方法， 和增強保護(例如， 更強的密碼基於認證。 雖然WPA3 仍能使用基於 AES 的加密， 設想的重點是 CCMP/AES 直接取代 TKIP/RC4-most 的 WPA2 的轉會。因此，存取點最有可能使用 A。 WPA2。","s":"term"},{"n":671,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A web application allows users to upload files and later include them in pages dynamically. Attackers exploit this to execute code. Which vulnerability exists?","o":["LFI","RFI","CSRF","XSS"],"a":[0],"e":"正確答案是 A，因為情境描述的是本機檔案包含(LFI)。 在 LFI 中，一個 Web 應用程式動態地包含一個來自本機伺服器檔案系統的檔案，而沒有適當驗證檔案路徑或檔案內容。 如果攻擊者可以上傳惡意檔案，然後導致應用程式將本機儲存的檔案包含在一個頁面中，伺服器可以解釋並執行嵌入式程式碼。 CEHWeb 應用程式入侵話題討論在應用程式無法檢查上傳檔案惡意內容時，不安全檔案上傳功能如何會變得危險；攻擊者可以對一個檔案進行編譯，上傳，並被執行來利用弱勢系統。 這與 RFI 不同，因為攻擊者使應用程式包含一個來自遠端外部位置的檔案。 CSRF 使一個認證的使用者玩弄了不想要的行動，而 XSS 在被害者的瀏覽器中執行指令碼。 由於惡意檔案被上傳到同一個 Web 應用程式環境幷包含在其中，最好的答案是 LFI。","s":"term"},{"n":672,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"Scenario: Joe turns on his home computer to access personal online banking. When he enters the URL www. bank.com, the website is displayed, but it prompts him to re-enter his credentials as if he has never visited the site before. When he examines the website URL closer, he finds that the site is not secure and the web address appears different. What type of attack is he experiencing?","o":["DNS hijacking","ARP cache poisoning","DHCP spoofing","DoS attack"],"a":[0],"e":"正確答案是 A。 DNS 劫持。 在這次攻擊中，使用者輸入一個合法的網域名稱，但 DNS 解析度被操縱，因此瀏覽器被重定向到一個假的或惡意的網站。 假站點可能看起來像真實的銀行站點，但使用不同的 URL 或缺乏 HTTPS 安全，促使被害者再次進入認證資訊。 ARP 快取中毒事件通常發生在本機網路內，透過攻擊者改變流量，DHCP 欺騙給被害者惡意網路設定，而 DoS 攻擊使得服務無法使用。 在這裡，關鍵線索是從合法的 URL 重定向到可疑的銀行頁面，這與 DNS 劫持事件相匹配。","s":"term"},{"n":673,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"At a private aerospace research facility in Mesa, Arizona, an executive raises concerns after sensitive discussion points from speakerphone meetings begin surfacing externally. The device shows no indicators of active audio recording, and application permission history does not reflect recent camera or microphone authorization changes. A forensic mobile analysis identifies that an installed application has been continuously reading motion sensor output while the phone's loudspeaker is active. The collected sensor data was later transmitted to a remote server, where acoustic characteristics were reconstructed from the recorded measurements. Identify the attack technique responsible for this compromise.","o":["Camfecting","StormBreaker Abuse","Android Camera Hijack Attack","Spearphone Attack"],"a":[3],"e":"正確答案是 D。 Spearphone 攻擊。\"先鋒\"攻擊使用運動感測器資料，如加速計讀取，來推斷或重建透過智慧手機的擴音器所播放的語音。 攻擊之所以引人注目，是因為不需要直接麥克風進入，而是濫用了揚聲器振動和聲波耦合裝置內部產生的感測器讀取。情境說明沒有發生麥克風或相機許可更改，但安裝的應用程式在揚聲器活動時會不斷讀取運動感測器輸出，然後用所蒐集的測量資料來重建聲學特性。這些細節與 Spearphone 完全吻合。 符合 CEH 行動裝置安全材料強調移動裝置可以透過惡意軟體，不安全應用程式，以及應用程式/OS 被濫用來被攻擊，移動惡意軟體通常用於從裝置中竊取個人或敏感資料。選項 A。 攝像頭不正確，因為攝像頭涉及未經授權的相機活化或相機間諜活動。選項 B。 StormBreaker 濫用是不正確的，因為 StormBreaker 與可能捕捉裝置資料的 phishing/social-工程框架有關，但情節具體涉及運動感應器相聲重建。選項 C。 Android 相機劫持攻擊是不正確的，因為沒有描述任何相機被誤用。選項 D。 Spearphone 攻擊是正確的，因為攻擊在揚聲器活動時會從運動感測器讀取重構語音。因此，最好的答案是 D。 Spearphone 攻擊。","s":"term"},{"n":674,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"A malware analyst is tasked with evaluating a suspicious PDF file suspected of launching attacks through embedded JavaScript. Initial scans using pdfid show the presence of /JavaScript and /OpenAction keywords. What should the analyst do next to understand the potential impact?","o":["Upload the file to VirusTotal and rely on engine consensus","Disassemble the PDF using PE Explorer","Extract and analyze stream objects using PDFStreamDumper","Compute file hashes using HashMyFiles for signature matching"],"a":[2],"e":"這個問題與惡意軟體分析有關，具體來說就是 CEH v13 惡意軟體威脅模組所覆蓋的 PDF-基於惡意軟體。 pdfid 識別出/JavaScript 和/OpenAction 關鍵詞的存在強烈表明 PDF 開啟時引發的潛在惡意行為。 CEH v13 建議對 PDF 流體進行靜態分析，作為理解嵌入式惡意邏輯的下一步。 PDFSStream Dumper 等工具允許分析人員從 PDF 檔案中擷取，解壓，並檢查物件流，揭示出被模糊的 JavaScript 程式碼或利用有效酬載。/OpenAction 關鍵詞表示所嵌入的 JavaScript 在檔案開啟時自動執行，這是在以 PDF-為基礎的攻擊中使用的一種常用技術來利用讀者的弱點或下載次級有效酬載。其他選項不足:VirusTotal 提供偵測結果，但不提供行為洞察力。 PE Explorer 無關緊要，因為 PDF 不是可移植可執行檔案。Hashing 只幫助識別已知的惡意軟體，而不是分析行為。 CEH v13 強調人工檢查嵌入式指令碼以確定意圖，使PDFStream Dumper 成為正確的下一步。"},{"n":675,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"During routine network monitoring, the blue team notices several LLMNR and NBT-NS broadcasts originating from a workstation attempting to resolve an internal hostname. They also observe suspicious responses coming from a non-corporate IP address that claims to be the requested host. Upon further inspection, the security team suspects that an attacker is impersonating network resources to capture authentication attempts. What type of password-cracking setup is likely being staged?","o":["Decrypt login tokens from wireless networks","Use CPU resources to guess passphrases quickly","Exploit name resolution to capture password hashes","Match captured credentials with rainbow tables"],"a":[2],"e":"CEH 事件回應材料解釋出 LLMNR 和 NBT-NS 中毒是內部網路中常見的認證資訊-收割技術，這些遺留名稱解析協定透過廣播查詢執行，攻擊者可以收聽這些廣播，並比合法的 DNS/hosts 條目更快地回應，冒充所請求的資源。 一旦受害者系統試圖認證，它就會向攻擊者控制的機器傳送 NTLM 雜湊。 Responder 和 Invigh 等工具將這一過程自動化，使攻擊者能夠蒐集挑戰回應雜湊以進行離線破解。 CEH 強調，這種方法從受害者的角度來說是被動的，除非監測工具監視異常LLMNR/NBT-NS 反應，否則很難偵測出。 選項 A，B，和 D 指的是密碼破解的其他元件，但沒有一個描述透過被毒取的名稱解析捕獲雜湊機的機制。 攻擊者的技術直接配合了利用名稱解析度協定來攔截認證嘗試。"},{"n":676,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"short","q":"What is MAC spoofing used for?","o":["Encryption","IDS","Bypass filters","Logging"],"a":[2],"e":"正確答案是 C， Bypass 過濾器。 在無線網路安全中，無線基地台可能使用 MAC 位址過濾器，只允許其 MAC 位址被列出於存取點的白名單中。 CEH 無線駭客材料解釋，MAC 欺騙可以用於改變一個無線介面卡的 MAC 位址，從而與存取點的白名單中允許的 MAC 位址相匹配，從而繞過 MAC 過濾器。 這不提供加密，因為加密使用加密演算法保護資料機密性。它也不是 IDS，因為入侵偵測系統監視器和對可疑活動的警報。記錄事件和活動，這與更改 MAC 位址無關。MAC 欺騙是一種冒用技術:攻擊者觀察或獲得有效的 MAC 位址並設定自己的 MAC 位址。因此，在 CEH 無線攻擊和存取控制弱點的背景下，MAC 欺騙主要用於繞過以 MAC 為基礎的存取過濾器。","s":"term"},{"n":677,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"A security consultant is conducting an authorized assessment for a healthcare billing provider in Phoenix, Arizona. While monitoring internal traffic, he observes an authenticated employee interacting with a sensitive web-based management portal over TCP. During the session, the consultant carefully crafts and injects packets into the ongoing communication stream. Shortly afterward, the legitimate user experiences irregular responses from the application, and the server begins processing commands originating from the consultant's injected traffic as though they were part of the established session. The technique does not involve credential guessing or forcing the user to reauthenticate. Instead, it targets the communication channel already in progress. From a network-level perspective, what type of session hijacking technique is being demonstrated?","o":["UDP Hijacking","RST Hijacking","Blind Hijacking","TCP/IP Hijacking"],"a":[3],"e":"正確答案是 D。 TCP/IP 劫持。劇情描述一個攻擊者的目標是已經建立的 TCP 工作階段並被注入封包的通訊流。 符合CEH 的材料描述出 TCP/IP 被劫持是對 TCP 工作階段的網路級攻擊，攻擊者在其中預測或使用序號資訊，並注入偽造的封包到工作階段。 也解釋嗅探工具在注入偽造的流量前可能用於捕捉封包並擷取序號資訊。選項 A.UDP 劫持是不正確的，因為情節具體涉及 TCP 通訊，而不是 UDP。選項 B。 RST 劫持是不正確的，因為 RST 劫持涉及傳送 偽造的 重置 封包 以終止或重置 TCP 連線，而不是接管 工作階段 釋出命令。選項 C。 盲劫持是不正確的，因為當攻擊者無法捕捉迴流時，盲劫持就會發生，在這種情況下，顧問正在監測內部流量並注入到所觀察到的工作階段。選項 D。 TCP/IP 劫持是正確的 因為顧問正在操縱一個活躍的 TCP 通訊通道 和注入封包作為已建立工作階段的一部分。因此， 最好的答案是 D。TCP/IP 劫持。","s":"term"},{"n":678,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"While analyzing logs, you observe a large number of TCP SYN packets sent to various ports with no corresponding ACKs. What scanning technique was likely used?","o":["SYN scan (half-open scanning)","XMAS scan","SYN/ACK scan","TCP Connect scan"],"a":[0],"e":"這一活動明確表示出一款 TCPSYN 掃描，又稱半開掃描，是一款常用的隱形掃描技術，在 CEH v13 偵察和網路掃描中被討論。 在 SYN 掃描中，攻擊者會將 TCP SYN 封包傳送到目標埠，並在沒有完成 TCP 三通握手的情況下觀察回應。如果連接埠是開啟的，目標用 SYN/ACK 封包回應。 掃描器然後立即傳送了 RST 封包，而不是最後的 ACK，使連線半開啟。這種行為允許攻擊者識別開放的埠，同時將日誌條目最小化並減少安全監測工具的偵測。日誌中缺少 ACK 封包支援了這一解釋，因為握手從未完成。其他選項不正確，因為:XMAS 掃描傳送封包，並設定多面旗。 SYN/ACK 掃描主要用於防火牆規則發現。 TCP Connect 掃描完成全握手並生成 ACK。 CEH v13 強調，SYN 掃描由於平衡了精度和隱形性而被廣泛使用，使其成為攻擊者首選的偵察方法。","s":"term"},{"n":679,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"An attacker abuses weak password reuse across services using leaked credentials. What attack is this?","o":["Replay","Credential stuffing","Brute force","Dictionary attack"],"a":[1],"e":"正確答案是 B，因為認證資訊填充使用先前被洩露或被竊取的使用者名稱-密碼對其它服務，依賴於多個平台重用密碼的常見使用者行為。 在 CEH 認證和密碼-攻擊概念中，弱密碼做法和被破壞的認證資訊是未經授權存取的主要原因。 符合CEH 材料指出，弱的密碼政策允許攻擊者繞過弱的認證資訊，而透過不安全的渠道暴露出認證資訊會導致妥協。 認證資訊的塞入與蠻力不同，因為攻擊者並不是在儘量嘗試。密碼組合。 也與字典攻擊不同，因為攻擊者不是在測試詞典詞；而是在測試已知被洩露的認證資訊。 重放攻擊被俘獲的再利用認證資料或工作階段權杖，但問題特別提及了使用被洩露的認證資訊在各種服務中弱密碼再利用。 因此，最好和最準確的答案是認證資訊填入。","s":"term"},{"n":680,"c":"系統入侵階段","ce":"System Hacking Phases","t":"long","q":"As part of an authorized security assessment at a maritime logistics firm in Charleston, South Carolina, an ethical hacker evaluated the organization's resilience to coordinated endpoint compromise. Employees received a carefully crafted email attachment disguised as a routine operational update. After execution on several systems, monitoring tools later revealed that the infected machines periodically contacted an external host controlled by the tester. Over time, the compromised systems began receiving commands from a centralized control server and simultaneously generated coordinated network traffic toward designated targets when instructed, without any direct user interaction. From a malware classification standpoint, what component is being simulated in this scenario?","o":["Spyware","Scareware","Potentially Unwanted Applications (PUAs)","Botnet Agents"],"a":[3],"e":"正確答案是 D。 殭屍網路探員。劇情描述多種感染機能定期與中央指令伺服器聯絡，接受指令，並在指令被引導時產生協調流量。 這些被破壞的系統作為殭屍網路代理機執行，也叫 bots 或殭屍。 符合 CEHDoS/DDoS 材料解釋道:殭屍網路通常透過使用木馬程式馬在被害者系統中安裝一個 bot 來建立。 執行後， 受害者系統被感染 並等待指揮控制處理器的指示。處理器然後向受感染系統發出指令，以進行攻擊。 也有人提到， 機器人網路是由駭客在無人知曉的情況下進行遙控，選項 A。 Spyware 是不正確的，因為 Spyware 主要蒐集使用者活動或敏感資料。選項 B。 危險品是不正確的，因為驚嚇品的花招使用者會用假警告來讓他們安裝軟體或支付欺詐服務的費用。選項 C。 潛在的不受歡迎的應用(PUAs)是不正確的，因為 PUAs 可能是不受歡迎的或侵入性的，但不一定作為受遙控的攻擊劑。選項 D。 殭屍網路 代理是正確的，因為被感染的端點收到中央控制器的命令並參與協調的活動。因此，最好的答案是 D。 殭屍網路代理公司。","s":"term"},{"n":681,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"During a red team exercise at Apex Logistics in Denver, ethical hacker Rachel launches controlled packet injection attacks to simulate session hijacking attempts. The client ' s IT team wants a way to automatically detect such abnormal behaviors across the network in real time, instead of relying on manual analysis. They decide to deploy a monitoring system capable of flagging suspicious session activity based on predefined rules and traffic signatures. Which detection method best fits the IT team ' s requirement?","o":["Check for predictable session tokens","Perform manual packet analysis using sniffing tools","Monitor for ACK storms","Use an Intrusion Detection System (IDS)"],"a":[3],"e":"IT 團隊的要求是使用預先定義的規則和流量簽名自動即時偵測異常的工作階段活動。 該描述最直接地與入侵偵測系統(IDS)，特別是監測流量的網路 IDS(NIDS)相匹配，將其與已知模式(簽名)和/or 行為規則相比較， 並且當發現可疑活動時發出警報。 工作階段劫持的嘗試往往會產生可識別的異常現象--不預期的封包序列、可疑旗標、異常注入模式、重置或協定濫用--即 IDS 規則可以設計為在許多主機和分機中發現，而不需要分析員手動檢查每個捕獲。情境明確將這種所期望的能力與\"人工分析\"相去甚遠，而\"人工分析\"則排除了選項 B。封包封包嗅探器等工具對於調查和確認很有價值，但它們本身並不能提供全組織的自動警報。 IDS 被建造用於持續監測和警報生成，使其適合偵測出紅色-團隊模擬的封包注入和工作階段操縱嘗試。為何其他選項不合適 :檢查可預見工作階段權杖(A)是一種應用層防禦性審查(和良好的硬化做法)，但它不會自動地偵測到在網路上即時發生的封包注入行為。對 ACK 風暴(C)的監測可以成為一些 TCP 操縱或去同步情境中的一項具體指標，但範圍太窄，不代表一般的探測系統。 要求範圍更廣:一個使用規則和簽名標記出可疑工作階段活動的監測系統 - - 一種 IDS 符合這一作用的監測系統。手動封包分析(B)是他們明確想要避免的。因此，正確答案是 D.使用入侵偵測系統(IDS)。"},{"n":682,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"During a penetration test at IntelliCore Systems in Raleigh, North Carolina, ethical hacker Javier directs a wave of repetitive web requests against the company ' s portal that overloads backend scripts which process search queries and form submissions. As a result, legitimate customers experience long delays and occasional timeouts while attempting to log in or complete transactions. Which DoS/DDoS technique is Javier most likely demonstrating?","o":["Slowloris","UDP Flood","Peer-to-Peer Attack","HTTP GET/POST Attack"],"a":[3],"e":"情境描述一個圖層 7(應用程式層)阻斷服務模式:Javier 傳送一波重複的網路請求，這些請求專門超載了負責搜尋查詢的後端指令碼並形成提交。 這是 HTTP GET/POST 攻擊的特徵，攻擊者在攻擊中淹沒了一個有大量 HTTP 請求的 Web 應用程式--通常為 GET 請求 page/resources 和 POST 請求觸發伺服器側處理(登入，擷取，搜尋，表單處理器)。 由於這些請求在戰術上可以有效，目標成本高昂的操作，它們可以很快地耗盡 CPU，記憶體，執行緒，資料庫連線，或者應用程式工人集合，導致合法使用者的反應緩慢和超時--這正是客戶在這裡的經歷。為何其他選擇不合適:Slowloris(A)也是一種應用層技術，但效果不同:它透過很慢地傳送部分 HTTP 頭來保持許多連線開啟，旨在耗盡伺服器的併發連線能力。 問題強調重複請求超載後端指令碼，而不是緩慢而不完整的請求會把套接字開啟。 UDP 泛洪 (B) 是一款網路/transport-layer 量子攻擊，它向隨機或目標埠傳送了大塊的 UDP 封包，消耗了頻寬和主機資源，它沒有專門針對處理搜尋/forms.的網頁尾本。同行對 Peer Attack (C) 通常涉及透過分佈的同行來濫用 P2P 網路或反射/amplification；它不被描述為直接重複的網路請求來應用端點。關鍵指標有:(1)網路請求(2)針對搜尋和格式提交等指令碼驅動功能，(3)由於應用程式處理過度而導致使用者出現慢度/timeouts。這些功能最直接地與 D。 HTTP GET/POST Sattack 相配合。","s":"term"},{"n":683,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at Horizon Tech in Austin, ethical hacker Michael sets up a man-in-the-middle attack to intercept traffic between employees and the company ' s internal web applications. He uses a lightweight tool capable of performing ARP spoofing, DNS manipulation, and packet injection while providing an interactive interface for real-time monitoring. This allows him to capture and manipulate session tokens in transit, which he later presents to the security team as proof of risk. Which tool is Michael most likely using in this exercise?","o":["Wireshark","Hetty","Caido","Bettercap"],"a":[3],"e":"描述的工具與 Beetcap 最相符合.Beetcap 是一個輕量級， 用於本機網路上中間人(MITM)操作的控制安全測試中常用的可擴充套件框架，它支援 ARP 欺騙/ARP 欺騙將攻擊者放置在被害者之間。 和門， 能夠攔截流量。 它還支援 DNS 操控/欺騙(例如， 將域搜尋重定向到攻擊者控制的目標) 和封包 的注入能力，用於修改 或插入網路流量。 它提供了一個互動介面，允許即時 工作階段 可見度控制， 哪個匹配情境在攔截內部 Web 應用程式流量時強調互動監測。所描述的目標--在過境時抓取並操縱工作階段權杖--與可觀測 HTTP 流量(或影響流量的 TLS 沒有適當執行或測試包括在實驗室中可信任的憑證)的 MITM 平台一致。 更佳卡普的設計是\"全能\"的區域性網路攻擊與監測工具，使得它成為一個典型的選擇，用於顯示來自網路分化薄弱，不安全的 DNS，缺乏 HTTPS/HSTS，或者端點針對 ARP 欺騙的保護不足等風險。為何其他選項不合適 : Wireshark(A)主要是一款封包分析 r/sniffer；它從本質上講不執行 ARP 欺騙，DNS 操控，或者作為活動 MITM 工具進行注入。 Hetty(B)和 Caido(C)是網路聚焦的擷取/testing 工具(代理式工作流程)，在設定為代理時可以擷取 HTTP/S，但並非本土專門使用 LAN-layer ARP 欺騙和 DNS 操縱來進行透明 MITM，與 Bettercap 相同。因此，最可能的工具是 D。Beticap。","s":"tool"},{"n":684,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"A cybersecurity analyst wants to monitor competitors' web content updates. What key element is missing from the plan?","o":["Hacking competitor databases","Google Alerts for content monitoring","Engaging in blog discussions","Using a VPN"],"a":[1],"e":"在 CEH v13 偵察技術中，被動地監測競爭對手的線上存在是合法而有效的情報蒐集活動，為此最有效的工具之一是Google Alerts。當包含特定關鍵詞的新內容(如公司名稱、產品或高管)線上化時，Google 提醒讓分析員可以收到自動通知。這樣就可以進行連續的、被動的監控，而無需手動存取網站。選項 B 直接涉及分析員有效更新的目標。選項 A 是非法的，不道德的。選項 C 涉及直接互動，可能揭示分析師的存在。備選辦法 D 提供匿名，但不積極監測變化。 CEH v13 在偵察中大力鼓勵自動化來降低噪音，努力，和偵測風險，因此，選項 B 是正確和符合 CEH 的答案。"},{"n":685,"c":"密碼學","ce":"Cryptography","t":"short","q":"An attacker analyzes how small changes in plaintext input affect ciphertext output to deduce encryption key patterns in a symmetric algorithm. What technique is being used?","o":["Differential cryptanalysis","Timing attack","Chosen-ciphertext attack","Brute-force attack"],"a":[0],"e":"CEH Cryptanalysis 模組將差分密碼分析描述為一種研究輸入差異與所產生輸出差異之間的關係來恢復金鑰的攻擊。選項A 與這一定義完全吻合。選項 B 取決於執行時間。 C 選項需要密文操控。選項 D 詳盡地測試了金鑰。 CEH 將差分密碼分析列為基礎理論攻擊。","s":"term"},{"n":686,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A major financial institution is experiencing persistent DoS attacks against online banking, disrupting transactions. Which sophisticated DoS technique poses the greatest challenge to detect and mitigate effectively, potentially jeopardizing service availability?","o":["A synchronized Layer 3 Smurf attack flooding routers with ICMP echo requests","A distributed SQL injection attack against online banking database servers causing resource exhaustion","A zero-day buffer overflow exploit against the web server causing service unavailability via RCE","A coordinated UDP flood targeting authoritative DNS servers to disrupt domain resolution"],"a":[1],"e":"CEH 強調應用程式層 DoS 攻擊往往最難被偵測和緩解，因為它們可以在耗盡後端資源的同時模仿合法的使用者行為。 分散式 SQL 注入-驅動式 DoS(備選 B)可能具有特別挑戰性: 攻擊者傳送在 HTTP 級別上似乎有效的請求， 但注入的藥 或精心設計的參數迫使應用程式/資料庫執行昂貴的查詢(重聯， sleep/delay 函式，； 或費用高昂的業務)。 當流量分佈在許多來源之間時，其流量可以看起來像是正常的顧客使用量--成功的 TCP 握手，有效的 HTTP 請求，以及現實的使用者代理模式--同時仍然造成資料庫連線池耗盡， CPU 突起，鎖接相通，反應時間已退化。選項 A(Smurf)和選項 D(UDP108 泛洪)是更通體的 tritri/network-layer 模式，一般透過上游 DDoS 洗滌來緩解，速度限制和過濾，透過流量異常更容易被偵測出。選項 C(零時差 RCE)很嚴重，但是在 CEH 分類法中它並不是主要的一種\"DoS 技術\"；這是一種開採情境，可能導致服務中斷，而是一種偵測。/緩解路徑中心是弱點利用預防、EDR、修補程式和遏制而不是 DoS 控制。 在 CEH 的術語中，選項 B 最好地與一種複雜、類似情境的 DoS 結合到正常應用活動中。 CEH 用於應用層的緩解方法 DoS 包括 WAF 規則，輸入驗證/parameterization(防止 SQLi)，查詢成本控制，按行為限制率，緩衝，資料庫硬化，以及應用和資料庫級的異常偵測。"},{"n":687,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"What does TTL manipulation help evade?","o":["Encryption","Firewall","IDS","Router"],"a":[2],"e":"正確答案是 C， 因為 TTL 操縱與 IDS/NIDS 逃逸有關。 TTL， 或 Time To Live， 是 IP 標頭值， 在每個 路由器 hop 時會減少 1 個。 當 TTL 達到 0 時， 封包 被丟棄。 在 IDS 逃逸中， 攻擊者可以手動 封包 並帶有低的 TTL 值， 這樣 封包會被人們看到。 IDS 感測器但在到達實際受害人主機之前過期，或被後期的路由器所掉。 這可以造成 IDS 認為發生的事情和目標系統實際收到的事情之間的不匹配。 CEHIDS 逃逸概念形容這是複雜的 IDS 逃逸，其中封包透過到 IDS，然後使用低 TTL 欄位，破碎，源路由等技術在後期放棄。 這就是為什麼 TTL 操控主要不在於逃避加密，路由器，或防火牆.路由器過程 TTL，而被混淆或繞行的安全控制是 IDS。","s":"term"},{"n":688,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"You have gone to an organization's website to gather information, such as employee names, email addresses, and phone numbers. Which step of the hacker's methodology does this correspond to?","o":["Fingerprinting","Reconnaissance","Scanning and enumeration","Gaining access"],"a":[1],"e":"正確答案是 B，偵察。 在 CEH 方法中，偵察是攻擊者或道德駭客在更深入的技術測試或攻擊活動之前儘可能多地蒐集目標資料的第一個資訊採集階段。 擷取到的 CEH 相關材料描述為偵察使用主動或被動手段來蒐集目標資訊，並具體包括蒐集目標系統或組織的初始資訊。 存取一個組織的公共網站蒐集員工姓名，電子郵件位址和電話號碼是被動的資訊蒐集，因為測試者正在使用公開的源頭而不是直接的偵測系統。 Footblinting 是偵察的一部分，它可以包括蒐集員工資訊，電話號碼和電子郵件。 Footbinting 更具體地針對識別系統，服務，或作業系統。 掃描和列舉涉及積極探測主機、埠和服務。當弱點被利用時，取得存取權機會就會發生。因此，這一活動相當於偵察。","s":"term"},{"n":689,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"Bob received this text message on his mobile phone: \"Hello, this is Scott Smelby from the Yahoo Bank. Kindly contact me for a vital transaction on: scottsmelby@yahoo.com\". Which statement below is true?","o":["This is a scam because Bob does not know Scott.","This is probably a legitimate message as it comes from a respectable organization.","Bob should write to scottsmelby@yahoo.com to verify the identity of Scott.","This is a scam as everybody can get a @yahoo address, not the Yahoo customer service employees."],"a":[3],"e":"正確答案是 D。 這個訊息顯示了經典的社交工程和閃爍的指標:它透過移動文字到達，以\"活動交易\"聲稱緊急，冒充一個受信任的組織，並要求鮑勃聯絡一個免費的公共電子郵件位址。 一個合法的銀行或金融機構通常會使用一個官方的公司域，而不是通用的@yahoo.com 信箱。 選項 A 之所以軟弱，是因為不只知道斯科特並不能證明欺詐；更強大的證據是可疑的傳送者身分和非正式的聯絡渠道。 選項 B 是不正確的，因為資訊只聲稱代表一個受人尊敬的組織；攻擊者往往冒充被信任的品牌。 選項 C 不安全，因為回覆提供的位址可以確認 Bob 是一個目標，並可能繼續騙局。 CEH 社交工程指導強調透過驗證請求。信任、獨立的渠道和識別利用緊迫性、權威和使用者信任的費興克/smishing 嘗試。 因此，最好的答案是D。"},{"n":690,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"Lily, a network security analyst at a regional healthcare provider, is preparing defenses ahead of a scheduled external vulnerability assessment. During internal simulation drills, she observes that scanners are successfully identifying open ports and service banners across critical systems. Tasked with reducing exposure to such reconnaissance efforts, Lily is instructed to apply measures that specifically hinder port scanning activity without disrupting legitimate traffic. Which of the following actions should Lily implement?","o":["Block unwanted services running on the ports and update the service versions","Use a custom rule set to lock down the network, block unwanted ports at the firewall, and filter specific ports","Configure firewall and IDS rules to detect and block probes","Block inbound ICMP message types and all outbound ICMP type 3 unreachable messages"],"a":[2],"e":"Cconfigination 防火牆和 IDS 規則來偵測和阻斷探測器，是最直接和符合 CEH 的對抗措施，用於在保持合法流量的同時阻礙連接埠掃描。 連接埠掃描通常會產生可識別的規律，如在短時間視窗內多次嘗試跨越多個埠的連線，重複 SYN 封包，異常 TCP 旗組合，或相繼瞄準主機和埠等。 IDS 或 IPS 可以使用閾值和簽名來偵測這些行為，然後透過避讓，動態的ACL 更新，或自動的防火牆整合，提醒或積極阻斷掃描源。 這種方法注重於停止偵察活動本身，而不只是選項 B 部分有效，因為阻塞防火牆的不想要的埠會減少攻擊面，但主要是硬化和減少暴露。它不一定阻礙掃描行為，過度的過濾如果不仔細進行，可能會無意中阻礙合法服務。 選項 A 透過去除不必要的服務和修補程式來改善安全性，但掃描仍然可以發生，並仍然可以從所需的服務中蒐集橫幅。 選項 D 是不合適的，因為遮蔽 ICMP 第 3 類無法取得的資訊會干擾正常的網路操作，故障排除，以及路徑 MTU 因此，旨在干擾連接埠掃描活動並對合法流量影響最小的最佳行動是除錯防火牆和 IDS控制以探測並阻斷掃描探測器。"},{"n":691,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"As part of a cybersecurity assessment for a healthcare provider in Denver, Colorado, you are asked to recommend a framework that addresses how organizations should identify, assess, and treat information security risks as part of their ISMS. Which international standard best meets this requirement?","o":["ISO/IEC 27701:2019","ISO/IEC 27002:2022","ISO/IEC 27005:2022","ISO/IEC 27001:2022"],"a":[2],"e":"具體要求是建立一個框架，解釋如何在資訊保安管理系統(ISMS)範圍內識別、評估和處理資訊保安風險。 專門用於資訊保安風險管理的 ISO 標準是 ISO/IEC27005。 它為建立與 ISO/IEC27000 家族一致的風險管理程式提供了指導 並描述風險背景，支援 ISMS，風險識別， 風險分析， 風險評估， 風險處理， 風險接受， 風險通報 監測。這種對風險管理的\"如何\"的側重是 ISO/IEC27005 與其他選項的區別。 ISO/IEC27001:2022 是規定建立，實施，維護和不斷改進 ISMS 的要求的標準。 它要求進行風險評估和治療，但主要不是開展這些活動的詳細方法標準。 ISO/IEC 27002:2022 是提供安全控制目錄(可以選擇的\"什麼\"控制)而非風險評估/treatment 方法的實務守則。 ISO/IEC 27701:2019 將 ISO/IEC27001/27002 擴充套件至隱私資訊管理(PIMS)，並注重隱私控制和要求--而不是一般的資訊保安風險管理生命週期。因為問題要求制定標準，將資訊保安風險的識別、評估和處理作為 ISMS 的一部分，所以 ISO/IEC27005 是最佳匹配標準。 它補充了 ISO/IEC。27001,為各組織提供建立和管理 ISO/IEC27001 所要求的風險管理程式的實際指導，確保風險決定是系統、可重複的，並適合治理和持續改進。","s":"term"},{"n":692,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"As a network administrator, you explain to your team that a recent DDoS attack targeted the application layer of your company's web server. Which type of DDoS attack was most likely used?","o":["HTTP flood attack","UDP flood attack","ICMP flood attack","SYN flood attack"],"a":[0],"e":"根據 CEH 阻斷服務(DoS/DDoS))模組， 應用程式層 DDoS 攻擊特別針對目標服務 諸如 HTTP， HTTPS，。 DNS，。或 API 傳送似乎合法的請求 但是，覆蓋了伺服器資源。 HTTP 泛洪攻擊發出大量 HTTPGET 或 POST 請求，消耗 CPU，記憶體，以及應用執行緒。 CEH 強調這些攻擊特別危險，因為它們:模仿普通使用者行為很難與合法流量相區別傳統網路層防禦選項 A 是正確的。選項 B，C，和 D 主要執行在網路或運輸層上，而不是應用層。 CEH 強調 HTTP 泛洪是DDoS 最具有挑戰性的進攻之一，以緩解因其隱蔽性而導致的。","s":"term"},{"n":693,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"A security analyst is investigating a network compromise where malware communicates externally using common protocols such as HTTP and DNS. The malware operates stealthily, modifies system components, and avoids writing payloads to disk. What is the most effective action to detect and disrupt this type of malware communication?","o":["Blocking commonly known malware ports such as 6667 and 12345.","Relying solely on frequent antivirus signature updates.","Using behavioral analytics to monitor abnormal outbound traffic and application behavior.","Blocking all unencrypted HTTP traffic at the proxy level."],"a":[2],"e":"認證道德駭客 (CEH)惡意軟體威脅模組解釋道，現代惡意軟體越來越多地使用無檔案技術和生活-離地策略，透過 HTTP和 DNS 等合法協定進行溝通來逃避偵測。由於這種流量與正常活動相混合，以連接埠為基的阻塞和以簽名為基的防毒往往無效。 CEH 強調行為分析法和網路流量分析是識別異常的最可靠的偵測機制，例如:異常出行 DNS 查詢異常的 HTTP信標模式可疑過程行為選項 C 是正確的，因為它側重於偵測行為異常，CEH 認定其對於打擊先進的惡意軟體和指令與控制(C2)通道至關重要。選項 D 可能會擾亂業務運作，不會解決以 DNS 為主的 C2。選項 A 已過時。選項 B 無法偵測未知或無檔案的惡意軟體。 CEH 強烈建議對高階威脅進行異常偵測和行為監測。"},{"n":694,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"Which of the following is the primary objective of a rootkit?","o":["It provides an undocumented opening in a program","It replaces legitimate programs","It creates a buffer overflow","It opens a port to provide an unauthorized service"],"a":[1],"e":"正確答案是 B，它取代了合法的程式。 ARootkit 是入侵後用於隱藏攻擊者的存在，保持特權存取的惡意軟體。 並避免被偵測。 符合 CEH 的材料描述 rootkits 是模糊系統失陷的工具，透過替換或替換管理員的公用設施來隱藏惡意活動。LinuxRootkit 材料還宣告 rootkits 包含關鍵作業系統元件的替換可執行檔案，用於隱藏證據並提供。後門存取。 因此， 在選項中， 替換合法程式是最好的匹配。 選項 A 描述一個更普遍的概念。 選項 C 描述一個可變性/exploitation 條件， 而不是 Rootkit 的目的。 選項 D 可能描述一個可能的後門行為， 但這不是主要 Rootkit。 Rootkits 通常隱藏檔案、程序、登錄條目、日誌和惡意服務，使偵測和刪除變得困難。"},{"n":695,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"During a security compliance audit at Nexus Tech Solutions in Boston, Massachusetts, the ethical hacking team launches a controlled social engineering exercise to assess help desk vulnerabilities. Ethical hacker Rachel Kim calls the company ' s help desk, posing as a stressed employee named Laura Bennett from the marketing department. Rachel claims her laptop is running slowly and offers to share her login credentials if the help desk can provide a quick fix to meet a tight project deadline. The call is designed to test whether help desk staff follow proper verification protocols or fall for the offer of credentials in exchange for assistance. What social engineering technique is Rachel employing in this exercise?","o":["Shoulder Surfing","Vishing","Impersonation","Quid Pro Quo"],"a":[2],"e":"這一情境最能說明冒名頂替。 在符合 CEH 社交工程概念中，冒名頂替發生在攻擊者冒充員工，承包商，執行者，或供應商等合法人的身分來利用信任並繞過既定程式時。 Rachel 明確\"有壓力的員工名叫 Laura Bennett\"，並使用一個令人難以置信的工作場所藉口，如一個緩慢的膝上型電腦和嚴格的最後期限等。 這是一種典型的壓力與緊迫戰術，用來降低懷疑，並把目標推入突破政策，例如跳過身分驗證或接受不安全的排除故障步驟。雖然互動發生在電話上，但正在測試的定義技術不僅僅是通訊通道，而是身分欺騙。 Vishing 是電話打字，雖然電話在廣義上可以被描述為 vishing，但即時強調假身分和服務檯的驗證控制，這是冒充的標誌。 Quid 還原通常涉及提供利益或服務以換取資訊；在這裡，核心的運作機制是瑞秋的假身分，她試圖讓服務檯接受認證資訊共享作為支援的一部分。 肩上衝浪無關緊要，因為它涉及物理觀察某人的螢幕或鍵盤打出。 CEH 緩解冒名頂替的最佳做法包括嚴格呼叫人核查，對已知號碼的回撥程式，票證驗證，禁止密碼共享，需要透過經批准的工作流程進行多要素認證重回，以及培訓服務檯工作人員識別緊急操縱並提升可疑請求。","s":"term"},{"n":696,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A web app fails to restrict API request frequency. What risk exists?","o":["Data scraping","CSRF","XSS","SQLi"],"a":[0],"e":"正確答案是 A， Data scraping。 當一個 Web 應用程式或 API 不限制請求頻率時，攻擊者可以自動地將大量請求從被暴露的端點蒐集到大量資料。 在 CEH Web 應用程式入侵概念中，API 和網路服務是重要的攻擊表面，而弱的 API 控制可以允許攻擊者繞過預定的政策或濫用應用程式功能。 缺乏速率限制還允許重複的應用程式層請求，這些請求可能看起來是合法的，但以濫用的規模執行。 CEHDoS 材料解釋道，大量請求可以超載 Web 應用程式或服務，應用程式層攻擊往往與正常網站流量相類似。 在選擇中，資料刮取是最合適的，因為無限制的 API 電話允許自動收取使用者記錄，產品資料、定價、訊息或其他曝光資訊。CSRF 需要欺騙一個經認證的使用者傳送請求，XSS 涉及指令碼注入，SQLi 目標為資料庫查詢操作。這裡的關鍵問題是缺少請求節奏，所以風險是資料刮取。","s":"term"},{"n":697,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a black-box internal penetration test, a security analyst identifies an SNMPv2-enabled Linux server using the default community string \"public.\" The analyst wants to enumerate running processes. Which Nmap command retrieves this information?","o":["nmap -sU -p 161 --script snmp-sysdescr","nmap -sU -p 161 --script snmp-win32-services","nmap -sU -p 161 --script snmp-processes","nmap -sU -p 161 --script snmp-interfaces"],"a":[2],"e":"CEH v13 強調，設定在\"公共\"或\"私人\"等預設社群字串的 SNMPv1/v2 環境中，由於允許未經授權的使用者查詢系統資訊，因此存在重大安全風險。 SNMP 列舉可以揭示程序，介面，路由表，使用者，裝置設定等。 snmp-程序 NmapNSE 指令碼專門設計為在執行中的程式上列舉執行中的程式。用於儲存系統流程、CPU 使用量和記憶體消耗的操作資訊。此資訊可以讓攻擊者深入瞭解哪些服務可以被開發或設定不當。CEH 強調 SNMPv2 是特別需要的。由於缺少加密和認證硬化，因此易受影響。透過列舉程序，滲透測試者可以識別潛在的權限提升路徑，過時的服務，或可能有助於橫向移動的無賴應用程式。其他指令碼，如 snmp-sysdescr 或 snmp-介面擷取系統描述或介面資料，但不列出程序。","s":"tool"},{"n":698,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During a security assessment for an e-commerce company in Boston, Massachusetts, your team conducts a reconnaissance phase to identify potential entry points into the organization ' s communication infrastructure. You focus on gathering details about the systems responsible for handling incoming email traffic, avoiding active network probing, and relying on passive DNS data collection. Given this objective, which DNS record type should you query to extract information about the target's mail server configuration?","o":["SOA","TXT","NS","MX"],"a":[3],"e":"正確答案是 MX。 CEH 偵察材料解釋，MX，或稱郵件交換，記錄識別負責接收一個域的電子郵件的郵件伺服器。 當一個測試者想了解一個組織如何處理來信的電子郵件流量時，MX 記錄是最相關的 DNS 資料來源，因為它們揭示了指定的郵件基礎設施，並常常是郵件伺服器的優先順序。 在這種情境中，目標是在不進行主動網路探測的情況下蒐集關於通訊基礎設施的被動情報，因此查詢 DNS 記錄是適當的。 SOA 記錄提供域權限和區管理資訊，TXT 記錄通常包含 SPF 細節等與核查或政策相關的文字，NS 記錄識別權威名稱伺服器。 雖然所有這些可以促進更廣泛的偵察，但是它們並不直接回答哪個系統負責接收郵件。 CEH 強調，MX 記錄通常在足跡時用於識別電子郵件基礎設施，支援打字模擬，分析第三方郵件提供者，或地圖通訊依賴性。 因為問題明確要求顯示郵件伺服器設定的 DNS 記錄型別，所以 MX 是正確的選擇。","s":"term"},{"n":699,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"Which indicator most strongly confirms a MAC flooding attack?","o":["Multiple IPs to one MAC","Multiple MACs to one IP","Numerous MAC addresses on a single switch port","Increased ARP requests"],"a":[2],"e":"MAC 位址泛洪是一款在 CEH v13 網路與邊界入侵中被描述為\"第 2 層\"的攻擊，攻擊者用假 MAC 位址將一台交換器的CAM 表上覆。 一旦表格滿了，交換器就表現得像一款集線器，將流量轉發到所有埠。 MAC 位址泛洪的最確定指標是單個交換器連接埠上學到的眾多 MAC 位址，這是在適當分出網路中的異常行為。 CEHv13 將這一條件確定為 CAM 表耗盡的關鍵法證指標。 ARP 異常可能發生，但它們更常見地與 ARP 欺騙攻擊有關。 IP 至 MAC 不一致表示為 MITM 攻擊，而非 MAC 位址泛洪。因此，選項 C 是最明確的確認。"},{"n":700,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"An ethical hacker needs to gather sensitive information about a company ' s internal network without engaging directly with the organization ' s systems to avoid detection. Which method should be employed to obtain this information discreetly?","o":["Analyze the organization ' s job postings for technical details","Exploit a public vulnerability in the company ' s web server","Perform a WHOIS lookup on the company ' s domain registrar","Use port scanning tools to probe the company ' s firewall"],"a":[0],"e":"CEH v13 強調被動偵察的重要性，當目標是避免與目標系統發生任何互動。 Job address 經常揭示出內部技術，OS 平台，安全工具，IDS 品牌，虛擬化環境，指令碼語言等詳細資訊， CEH 明確指出工作廣告是最豐富的被動情報來源之一，因為組織無意中披露了自己的技術堆，經常提到特定網路元件、資料庫、協定或內部工具所需的經驗。 選項 B 和 D 涉及直接互動，違反了被動偵察要求。 WHOIS 擷取(選項 C)提供 DNS 登記員資訊，但不透露內部網路細節。 職位釋出，社交媒體招募材料，以及 HR 檔案在 CEH 中被討論，作為足跡探查階段用於蒐集可行動情報，同時保持完整隱蔽的關鍵的OSINT 資源。 因此，分析職位分配是正確的方法。"},{"n":701,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"In Miami, Florida, cybersecurity analyst Laura Bennett is investigating unauthorized access incidents affecting Sunshine Credit Union's online banking platform. Audit logs reveal that compromised accounts consistently involve users who accessed the portal through specially crafted links sent via email. The links direct victims to the legitimate website, where they proceed to authenticate successfully. Shortly afterward, unauthorized access to the same accounts is observed without any additional credential guessing or brute-force activity. Further examination shows that a value associated with the user's interaction with the application remains unchanged throughout the authentication process and can be introduced before the user completes sign-in. Which countermeasure should Laura implement to prevent this type of account takeover?","o":["Use restrictive cache directives such as Cache-Control: no-cache","Implement SSL to encrypt all information in transit via the network","Regenerate the session ID after a successful login","Do not create sessions for unauthenticated users"],"a":[2],"e":"正確答案是 C。 在成功登入後再生成工作階段 ID。劇情描述為工作階段定型。 在工作階段定型攻擊中，攻擊者會讓被攻擊者在認證前使用已知的工作階段識別碼。 被攻擊者成功日誌入住後，應用程式繼續使用同名的工作階段 ID，允許被攻擊者再用該固定值。 符合 CEH 工作階段劫持材料解釋道:工作階段固定可以讓攻擊者提供有效的工作階段 ID 並強迫被害者的瀏覽器使用。 在被害者日誌入網後，被害者伺服器繼續使用同為工作階段，攻擊者可以使用已知的工作階段 ID 存取合法的使用者帳戶.CEHWeb 應用程式材料也宣告，如果一個應用程式在登入前後使用相同的工作階段 ID，則可以導致工作階段固定；因此，應用程式必須在登入前後生成新的工作階段 ID，並在終止登入時使舊的 ID 失效。選項 A 是不正確的，因為快取指令會減少敏感回應的快取，但不會阻止固定的工作階段 ID。選項 B 不正確 因為 SSL/TLS 保護過境流量，但並不能阻止攻擊者..。設定 工作階段 識別符號。選項 D 可以降低曝光率，但直接和標準的對應措施是在成功認證後再生成工作階段 ID。因此，最好的答案是 C。 在成功登入後再生成工作階段 ID。"},{"n":702,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"A security analyst is tasked with gathering detailed information about an organization ' s network infrastructure without making any direct contact that could be logged or trigger alarms. Which method should the analyst use to obtain this information covertly?","o":["Examine leaked documents or data dumps related to the organization","Use network mapping tools to scan the organization ' s IP range","Initiate social engineering attacks to elicit information from employees","Perform a DNS brute-force attack to discover subdomains"],"a":[0],"e":"被動偵察專注於蒐集情報而不與目標系統互動。 CEH 材料強調審查公開的資訊，包括被洩露的檔案，破損的資料，報告，或被曝光的後設資料，因為這會產生內部網路結構細節，而不會產生可探測的流量。 這種方法避免了觸發監測系統，並與隱蔽性要求相配合。情報蒐集。"},{"n":703,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"Which of the following best describes an attack that altered the contents of two critical files?","o":["Availability","Authentication","Confidentially","Integrity"],"a":[3],"e":"正確答案是 D。 Guide。 在 CIA 三相中，完整性是指保護資訊不被未經授權的更改，修改，或修訂，無論資料是儲存在休息中還是移動到一個網路上。 符合 CEH 的材料解釋道，完整性確保所收到資料與原先傳送的資料完全相同，任何新增，刪除，或更改意味著完整性已經受到損害。 問題指出，一次攻擊改變了兩個關鍵檔案的內容，直接表明未經授權修改資料，這違反了完整性，因為這些檔案的可靠性、準確性和可靠性不再能得到保障。 可用性不正確，因為可用性涉及系統或資料是否在需要時可以存取。 認證是不正確的，因為它驗證了一個使用者、 裝置或程序。 機密性也是錯誤的， 因為機密性側重於保密和防止未經授權的披露， 而不是檔案修改。 因此， 改變關鍵檔案內容的攻擊最好被描述為完整性攻擊。","s":"term"},{"n":704,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"Which scenario best describes a slow, stealthy scanning technique?","o":["FIN scanning","TCP connect scanning","Xmas scanning","Zombie-based idle scanning"],"a":[3],"e":"CEH v13 識別出\"Idle (Zombie) Scanning\"是最隱蔽的偵察技術之一。 在這個方法中，攻擊者使用第三方系統(殭屍)向目標傳送探測器，模糊了攻擊者的真實身分。由於攻擊者從不直接與目標互動，因此偵測和歸屬變得極其困難。 FIN 和 Xmas掃描是隱形的，但仍然由攻擊者的 IP。 TCP 連線掃描產生，很吵，容易被偵測出。 CEH v13 強調閒置掃描是\"隱形偵察\"的金本位，使選項 D 正確。","s":"term"},{"n":705,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"A penetration tester is mapping a Windows-based internal network. The tester notices that TCP port 139 and UDP port 137 are open on multiple systems. File and printer sharing is enabled. To retrieve hostnames, user details, and domain roles without triggering alerts, which tool and method would be most effective?","o":["Perform LDAP enumeration via anonymous bind","Use pspasswd to change remote passwords","Run nbtstat -A to query the NetBIOS name table","Use psloggedon to retrieve remote login sessions"],"a":[2],"e":"CEH v13 教導 NetBIOS 列舉是一種在 Windows 環境中蒐集資訊而又不引起警報的關鍵技術。 Ports 137 和 139 表示NetBIOS Name Service (NBNS) 和 SMB 服務是活躍的。 工具 nbtstat -A < IP > 擷取有價值的資訊，包括電腦名稱，登入使用者，網域名稱/workgroup 成員，以及系統角色--都是被動和未經身分驗證的。 CEH 強調查詢 NetBIOS 經常被防禦人員忽略併產生最小的噪音，使得它成為 Seftth 列舉。 LDAP 列舉(可選 A)需要目錄存取，並往往會觸發日誌。 記錄 和passwd (選項 B) (d) 涉及積極互動 和認證嘗試， nbtstat 是使用 NetBIOS 在 Windows 網路上為初始偵察推薦的 CEH 工具 和 SMB， 以及 單倍徑 特別是 當需要安靜的 列舉。"},{"n":706,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During an internal security assessment of a medium-sized enterprise network, a security analyst notices an unusual spike in ARP traffic. Closer inspection reveals that one particular MAC address is associated with multiple IP addresses across different subnets. The ARP packets were unsolicited replies rather than requests, and several employees from different departments have reported intermittent connection drops, failed logins, and broken intranet sessions. The analyst suspects an intentional interference on the local network segment. What is the most likely cause of this abnormal behavior?","o":["ARP poisoning causing routing inconsistencies","DHCP snooping improperly configured","Legitimate ARP table refresh on all clients","Port security restricting all outbound MAC responses"],"a":[0],"e":"CEH v13 解釋道:ARP 欺騙(又名 ARP 欺騙)，當攻擊者在整個網路傳送被偽造的 ARP 回覆，將其 MAC 位址與多個 IP 位址相聯時，會欺騙主機透過攻擊者的主機傳送流量。 這導致了路由不一致，間歇連線，登入失敗， ARP 欺騙通常涉及未經請求的 ARP 答覆，這些答覆覆蓋了合法的 ARP 快取條目。 CEH 強調 ARP 基於攻擊在區域網中很常見，因為 ARP 缺乏認證，使得攻擊者可以冒充閘道器或關鍵主機。 DHCP snooping misconfignation (選項 B) 影響 IP 分配，而不是 ARP對映。 合法 ARP 重新整理(可選 C) 是基於請求的，不涉及泛洪 未經請求的答覆。 連接埠 安全限制(可選 D) 塊 MAC 異常， 不建立它們， 因此， ARP 欺騙 是正確的根源。"},{"n":707,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"long","q":"Dr. Evelyn Reed, a cybersecurity expert, was called in to investigate a series of unusual activities at \" Global Innovations Inc. \" The first red flag was a surge in spear-phishing emails targeting senior management, disguised as urgent internal memos. Soon after, the company ' s web server showed unexpected outbound traffic to unfamiliar IP addresses. A network audit revealed that multiple underutilized printers and routers had unauthorized firmware installed. Further review uncovered inconsistencies in file access logs linked to the R & D department, including unusually large data transfers occurring during non-business hours. Dr. Reed also noted the attackers appeared to have intimate knowledge of the organization ' s internal data structure. Which phase of the Advanced Persistent Threat (APT) lifecycle is Global Innovations Inc. most likely experiencing, given the combination of these incidents?","o":["Initial Intrusion","Expansion","Search and Exfiltration","Persistence"],"a":[2],"e":"所描述的指標與 APT 生命週期的搜尋和排出階段最為一致。 在符合 CEH 的 APT 模型中，攻擊者通常從初始進入到建立腳下，透過內部的偵察和橫向移動來擴大進入，然後定位出有價值的資料並進行分出。 雖然\"長矛釣\"是一種常見的初始入侵技術，但情節中明確包含多個訊號，表明攻擊者已經深入環境，並積極處理敏感資訊。關鍵的證據是\"非營業時間非通常大的資料傳輸\"與研發部門捆綁在一起並\"不預期的外出流量會到不熟悉的 IP 位址\"。 這些是中轉和出逃的經典跡象，蒐集的資料會被內部彙總，然後被送往攻擊者控制的基礎設施，有時會選擇減少偵測。 攻擊者\"對組織內部資料結構有內在瞭解\"的觀察進一步證明，他們已經進行了內部發現，現在正在針對特定的高價值暫存器。未經授權的印表機和路由器上的韌體顯示攻擊者可能已經建立了持久的內部蒐集點或隱蔽通道，但該活動支援並使得資料竊取任務成為可能，而不是由事件的全部規律所顯示的主要階段。 因此，有針對性地取得研發資源、異常的出行連線和大量超時傳輸的結合，與 CEHAPT生命週期覆蓋中的搜尋和出行階段最相匹配。","s":"term"},{"n":708,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester identifies that a web application ' s login form is not using secure password hashing mechanisms, allowing attackers to steal passwords if the database is compromised. What is the best approach to exploit this vulnerability?","o":["Perform a dictionary attack using a list of commonly used passwords against the stolen hash values","Input a SQL query to check for SQL injection vulnerabilities in the login form","Conduct a brute-force attack on the login form to guess weak passwords","Capture the login request using a proxy tool and attempt to decrypt the passwords"],"a":[0],"e":"如果一個系統以微弱或可逆格式儲存密碼，攻擊者可以進行離線破解。 CEH 強調字典攻擊是利用微弱雜湊做法的最快和最有效的方法，這可以避免被偵測和利用已知的密碼模式來回收明文認證資訊。"},{"n":709,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"Which address translation scheme would allow a single public IP address to always correspond to a single machine on an internal network, allowing \" server publishing \" ?","o":["Static Network Address Translation","Overloading Port Address Translation","Address Translation","Dynamic Network","Dynamic Port Address Translation"],"a":[0],"e":"正確答案：靜態網路位址轉譯（Static NAT）。靜態 NAT 會在公用 IP 位址與特定私有／內部 IP 位址之間建立固定的一對一對應關係。內部伺服器若必須每次都使用相同的公用位址，供外部網路存取，也就是常稱的伺服器發布或透過防火牆／路由器公開服務，就應採用這種方式。\n\nCEH 的網路教材指出，NAT 用於網路邊界；基本 NAT 提供一對一對應，每個內部私有 IP 位址對應唯一的公用位址，回程流量再轉譯回對應的內部主機。NAT 也能隱藏內部位址，並把送往外部位址的封包重新導向正確的內部系統。\n\n連接埠位址轉譯（PAT）或 NAT Overload 則讓多部內部主機透過連接埠或工作階段 ID，共用同一個公用 IP 位址，因此無法保證一個公用 IP 固定對應一部內部主機。故最佳答案是 A：Static NAT。","s":"term"},{"n":710,"c":"雲端運算","ce":"Cloud Computing","t":"short","q":"An attacker places a malicious VM on the same physical server as a target VM in a multi-tenant cloud environment. The attacker then extracts cryptographic keys using CPU timing analysis. What type of attack was conducted?","o":["Side-channel attack","Cloud cryptojacking","Cache poisoned denial of service (CPDoS)","Metadata spoofing"],"a":[0],"e":"CEH 雲模組解釋道:側道攻擊利用基於硬體特性的間接資訊外洩--如 CPU 計時，功率使用，快取接入模式，或電磁排放。在虛擬化雲環境中，多個租戶共享相同的物理硬體，為攻擊者從相鄰虛擬機器中擷取敏感資料創造了機會。 透過在與被害者相同的主機上放出惡意的 VM，攻擊者可以在加密操作中測量時間的分數差異，讓他們推斷出私人金鑰或敏感的計算結果。 這與 CEH 對側道攻擊的定義完全一致。 加密劫持涉及未經授權的加密貨幣開採，CPDoS 目標為快取層而非金鑰擷取，而後設資料欺騙操縱了雲後設資料端點。只有側道分析符合描述的攻擊行為。","s":"term"},{"n":711,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A Java app allows file download via user-controlled path. What attack is possible?","o":["SQLi","Path traversal","XSS","CSRF"],"a":[1],"e":"正確答案是 B， Path traversal。 一個接受使用者控制路徑的檔案下載功能在應用程式無法正確驗證，正常化，或限制所請求的檔案位置時是脆弱的。/在 CEHWeb 應用程式和 web 伺服器攻擊概念，目錄或路徑 traversal 中，攻擊者可以使用./等序列存取預定網路根以外的受限制目錄。 被編碼的字元，或被被操縱的 URL/path 值。 CEH 材料描述目錄 traversal 是一種攻擊，攻擊者試圖存取限制目錄，並在預定的網頁伺服器目錄之外執行命令，也被稱為\"點-點-斜線\"，目錄爬升， 或回溯。 CEH web 伺服器材料也宣告攻擊者可以使用點和斜線序列來存取根目錄以外的目錄並揭示敏感的系統資訊。SQLi 目標為資料庫查詢，XSS 注入指令碼，和 CSRF 濫用已認證瀏覽器請求。 這裡，脆弱的輸入是一個檔案路徑，所以攻擊是路徑的向上。","s":"term"},{"n":712,"c":"密碼學","ce":"Cryptography","t":"short","q":"A Linux system allows SSH login using deprecated ciphers. What risk exists?","o":["DoS","XSS","Downgrade attacks","SQLi"],"a":[2],"e":"正確答案是 C，因為允許被腐爛的 SSH 密碼會形成一個密碼學的弱點，使系統暴露出下級式的攻擊。 SSH 意在提供TCP 連接埠 22 的安全遠端管理，並依靠密碼學保護來保密和安全的通訊。 CEH 安全通訊專題將 SSH 描述為使用公用金鑰密碼學為加密的 Telnet 的安全替代。 當已過時或弱密碼仍能被啟用時，位於通訊路徑中的攻擊者可能會試圖影響談判，使使用者端和伺服器使用更弱的加密選項而不是更強的選項。 CEH 和密碼學等攻擊例項顯示相同原則:攻擊者濫用回落或弱演算法支援以迫使通訊向更弱的加密。 這並不能直接表示 DoS，XSS，或 SQL 注入。 被貶值的 SSH 密碼的主要風險是加密通訊被削弱並可能降級攻擊。","s":"term"},{"n":713,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"A known vulnerability exists on a production server, but patching is delayed due to operational constraints. What immediate action can reduce risk without disrupting operations?","o":["Conduct a full penetration test","Shut down the server","Monitor traffic continuously","Implement Virtual Patching"],"a":[3],"e":"虛擬修補程式是一種在 CEH v13 安全操作中強調的減輕風險技術，它涉及部署補償性控制--如 WAF 規則、IPS 簽名或防火牆政策--以阻止開發嘗試而不修改脆弱系統。 CEH v13 突出顯示虛擬修補程式在下列情況下特別有用:失眠是無法接受的供應商修補程式被延遲遺留系統正在使用中僅靠監測並不能防止弱點利用，關閉系統往往不切實際。修補程式在保持可用性的同時提供即時保護。"},{"n":714,"c":"密碼學","ce":"Cryptography","t":"short","q":"Which of the following algorithms can be used to guarantee the integrity of messages being sent, in transit, or stored?","o":["hashing algorithms","integrity algorithms","symmetric algorithms","asymmetric algorithms"],"a":[0],"e":"從 CEHv13 指南中綜合詳細解釋:正確答案是 A。 hashing 演算法。 在資訊保安和 密碼學 中， hashing 演算法是專門設計來提供資料完整性的。 雜湊函式擷取一個輸入訊息，檔案，或資料塊併產生一個被稱作雜湊，訊息摘要，或校驗和的固定長值。 如果哪怕只有一分一分原始資料改變，產生的雜湊值也會有顯著變化，使得未經授權的修改容易被偵測出。常見的密碼雜湊演算法包括 SHA-256,SHA-384,和 SHA-512 等。 這些演算法被廣泛用於驗證檔案，軟體下載，數字檔案，電子郵件，以及傳輸的網路資料的完整性。 在驗證過程中，收件人計算所收到資料的雜湊並把它與原始雜湊值相比較，如果數值相匹配，資料一直保持了完整性。選項 B 是不正確的，因為\"完整性演算法\"不是一個標準的加密演算法類別。 選項C(對稱演算法)如 AES 和 DES 主要透過加密提供機密性，而選項 D(對稱演算法)如 RSA 和 ECC 則主要用於加密，金鑰交換，認證，和數位簽章。 雖然數位簽章可以支援完整性驗證，但用於偵測資料變化的基本機制是密碼學雜湊函式。 因此，雜湊演算法是保證訊息完整性的最佳答案。","s":"term"},{"n":715,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"Malware adapts behavior, changes code dynamically, and exfiltrates data stealthily. What is it?","o":["AI-powered malware","Worm","Rootkit","Polymorphic virus"],"a":[0],"e":"CEH v13 將 AI- 驅動的惡意軟體確定為一種新出現的高階威脅，它根據環境提示和使用者行為來調整其執行。 與傳統的多型惡意軟體不同，AI-驅動的惡意軟體可以動態地決定何時和如何執行動作來避免被偵測。描述的特徵--行為適應、閒置時間的過濾、加密通訊--是 AI-輔助惡意軟體的標誌。多型病毒會改變特徵，但不會明智地適應行為。根基專注於隱藏存在。蠕蟲會大肆傳播。因此，選項 A 是正確的。","s":"term"},{"n":716,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"short","q":"Bluetooth devices are suspected of being targeted by a Bluesnarfing attack. What is the most effective countermeasure?","o":["Disable discoverable mode","Update firmware regularly","Increase Bluetooth PIN complexity","Encrypt Bluetooth traffic"],"a":[0],"e":"Bluesnarfing 是 CEH v13 無線網路入侵描述的藍芽攻擊，攻擊者在那裡進行弱點利用。錯誤地設定了藍芽裝置來存取敏感資料，例如聯絡人，訊息，和檔案--通常沒有使用者互動。 Bluesnarfing 最關鍵的促進器之一是 Bluetooth 可發現模式。當裝置可以發現時，攻擊者可以很容易地識別它們，並試圖在 Bluetooth 服務中進行未經授權的連線或利用弱點。失效可發現模式透過防止未經授權的裝置定位藍芽驅動的系統來大幅降低攻擊面。 CEH v13 明確建議在不配對時將藍芽裝置設定為不可發現模式。雖然韌體更新(選項 B)很重要，但並不能立即防止基於可發現性的攻擊。 更強的 PINs(選項 C)幫助對抗對等攻擊，但不能停止未經授權的查詢。 Network-level 加密(選項 D)是藍芽協定所固有的，並不能減輕發現濫用。CEH v13 強調能見度控制是針對 Bluesnarfing 最直接有效的防守。 因此，選項 A 是正確答案。"},{"n":717,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"A penetration tester is assessing the security of a corporate wireless network that uses WPA2-Enterprise encryption with RADIUS authentication. The tester wants to perform a man-in-the-middle attack by tricking wireless clients into connecting to a rogue access point. What is the most effective method to achieve this?","o":["Set up a fake access point with the same SSID and use a de-authentication attack","Use a brute-force attack to crack the WPA2 encryption directly","Perform a dictionary attack on the RADIUS server to retrieve credentials","Execute a Cross-Site Scripting (XSS) attack on the wireless controller ' s login page"],"a":[0],"e":"WPA2-企業網路透過 802.1X 使用 RADIUS 伺服器認證用戶端。 CEH 訓練中描述的一種常見攻擊方法是建立一個與合法使用者端相同的 SSID 廣播的邪惡-twin 存取點。 結合去驗證訊框，用戶端被強制關閉了真正的 AP 並自動地重新連線到更強大的無賴 AP。 這使得攻擊者可以捕捉後期被濫用的認證交換，包括認證資訊收割或 EAP-基於降級的攻擊。"},{"n":718,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at TechTrend Innovations in California, ethical hacker Jake Henderson reviews the company ' s web server exposure to network-based threats. He finds that the server is running with multiple open services and protocols that are not required for its operation, such as NetBIOS and SMB. Jake explains to the IT team that attackers could exploit these unnecessary services to gain unauthorized access to the server. Which hardening measure should the IT team implement to mitigate this risk?","o":["Use a dedicated machine as a web server","Conduct risk assessment for patching","Eliminate unnecessary files","Block all unnecessary ports, ICMP traffic, and protocols"],"a":[3],"e":"所描述的風險因在網路上執行的不必要服務和協定而增加出攻擊面，具體來說是 NetBIOS 和 SMB。 緩解這種情況的最直接的硬化行動是阻斷/disable 不必要的埠和協定，這樣它們不會被網路所暴露，也不能被攻擊者所濫用。 選項 D 抓住了這一原則:透過關閉埠來減少暴露，並限制伺服器角色不需要的協定。一個堅固的網路伺服器只應執行提供其預定網路功能所需的服務(例如: HTTP/HTTPS 車廂內有車廂，車站為車站。 和必要的管理介面在嚴格控制下進行。 TCP 445/139)和NetBIOS(UDP137/138,TCP139)通常不需要公開的網頁託管，也是列舉和開發的頻繁目標。 離開這樣的服務可以讓攻擊者進行認證資訊攻擊，利用遺留的弱點，取得共享資源，或進一步向環境傾斜。 透過在主機防火牆和/or 周邊防火牆阻塞或使這些埠失效，組織會減少可到達的攻擊路徑並限制外部攻擊者可以與哪些人互動。為何其他選項不那麼直接:專用機(A)可以幫助分出職責，但如果不必要的服務仍然執行，攻擊面仍然保留。修補程式(B)的風險評估很重要，但並不能立即去除因不需要的服務而導致的暴露。取消不必要的檔案(C)位址是檔案系統曝光，而不是像 SMB/NetBIOS 那樣開啟網路服務。由於問題明確涉及不必要的開放服務/protocols，因此最好的緩解是 D。 遮蔽所有不必要的埠，ICMP 流量，以及協定(即將被曝光的服務降到最小)。"},{"n":719,"c":"密碼學","ce":"Cryptography","t":"mid","q":"A U.S.-based online securities trading firm in New York is reviewing its transaction authentication process. The security team confirms that each transaction is processed by first generating a hash of the transaction data. The hash value is then signed using the sender's private key. During verification, the recipient uses the corresponding public key to validate the signature before approving the transaction. The system documentation specifies that the same algorithm supports encryption, digital signatures, and key exchange mechanisms within the organization's secure communications infrastructure. Which encryption algorithm is being used in this implementation?","o":["DSA","ElGamal","RSA","Diffie-Hellman"],"a":[2],"e":"正確答案是 C。 RSA。題目描述公用金鑰密碼學使用私密金鑰簽名雜湊和公開金鑰驗證簽名，還宣告演算法支援加密，數位簽章，和金鑰交換器制。 RSA 是最佳匹配。 CEH-aconition 密碼學材料將 RSA 定義為由 Rivest，Shamir，和Adleman 開發的公開金鑰加密系統，並稱 RSA 加密被廣泛用作事實上的加密標準。 另一個 CEH 考試參考文獻解釋到RSA 可用於加密和數位簽章，而 Diffie-Hellman 主要用於金鑰交換，DSA 用於數位簽章，而 ElGamal 支援加密和數位簽章，但並非問題所陳述的全部要求的最佳匹配。選項 A.DSA 是不正確的，因為 DSA 是為數位簽章設計的，而不是通用的加密。選項 B。 ElGamal 是不正確的，因為它可以支援加密和簽名，但是 RSA 是當問題描述加密，數位簽章，以及廣泛的安全通訊支援時更強的 CEH 風格的答案。 D。 Diffie-Hellman 選項不正確，因為 Diffie-Hellman 主要是一個協定的金鑰交換器，並不自行提供數位簽章。選項 C.RSA 是正確的，因為它支援加密和數位簽章，並被廣泛用於公用金鑰加密基礎設施。因此，最好的答案是 C。 RSA。","s":"term"},{"n":720,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"Suppose your company has just passed a security risk assessment exercise. The results display that the risk of the breach in the main company application is 50%. Security staff has taken some measures and implemented the necessary controls. After that, another security risk assessment was performed showing that risk has decreased to 10%. The risk threshold for the application is 20%. Which of the following risk decisions will be the best for the project in terms of its successful continuation with the most business profit?","o":["Introduce more controls to bring risk to 0%","Avoid the risk","Mitigate the risk","Accept the risk"],"a":[3],"e":"正確答案是 D，因為剩餘的或剩餘風險現在為 10%，低於本組織設定的風險閾值 20%。 在 CEH 風險管理概念中，風險評估確定並評價了資產的潛在損害或損失，風險處理決定包括緩解、避免、轉移或接受。 風險接受意味著作出知情決定，接受損害或損失的剩餘可能性。指南還將最低可接受風險描述為一個組織基於機密性、完整性、可用性和資源決定的門檻。50%到 10%，達到 0%的額外控制可能會浪費資源並減少商業利潤。 避免風險可能不必要地阻止專案。 緩解已經成功實施。 因此，與企業相適應的最佳決定是正式接受剩餘風險並繼續開展專案。"},{"n":721,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"During an investigation, an ethical hacker discovers that a web application's API has been compromised, leading to unauthorized access and data manipulation. The attacker is using webhooks and a webshell. To prevent further exploitation, which of the following actions should be taken?","o":["Implement a Web Application Firewall (WAF) with rules to block webshell traffic and increase the logging verbosity of webhooks.","Perform regular code reviews for the webhooks and modify the API to block connections from unknown IP addresses.","Harden the web server security, add multi-factor authentication for API users, and restrict the execution of scripts server-side.","Implement input validation on all API endpoints, review webhook payloads, and schedule regular scanning for webshells."],"a":[3],"e":"這個問題側重於 API 安全、Webhooks 濫用和 Webshell 緩解，所有這些問題都得到了處理。在 CEH v13 Web 應用程式入侵和安全行動模組中。最適當的糾正行動是選項 D，因為它直接解決妥協的根源和持久性機制。根據 CEH v13,攻擊者經常利用 APIs 中的不適當的輸入驗證和不安全的 webhook 執行來注入惡意有效酬載或獲得遠端命令執行。 Webhooks在未適當驗證時，可以接受觸發後端程序的惡意請求，使其成為 API 被濫用的常見向量。在所有 API 端點上的輸入驗證對於防止注入攻擊至關重要，包括命令注入和 SQL 注入.CEHv13 明確強調驗證請求參數，頭，和酬載結構來防止惡意操縱。審查 webhook 有效酬載可確保只有可信賴的來源才能觸發自動動作，防止攻擊者濫用 webhook 功能，包括驗證簽名、強制認證和限制允許的酬載格式。最後，定期掃描網殼至關重要，因為網殼提供持續的後門存取。 CEH v13 將網殼偵測確定為事件應對和開採後遏制期間的關鍵防禦措施。其他選項不全 :單靠一 WAF 無法偵測出所有網殼。 IP 遮蔽對偽造的或以云為主的攻擊無效。 MFA 和伺服器硬化是有價值的，但並不直接解決網路 hook 濫用或已存在的網路貝殼。因此，備選辦法 D 提供了最全面的 CEHv13-相適應的緩解戰略。"},{"n":722,"c":"密碼學","ce":"Cryptography","t":"mid","q":"Emma, an ethical hacker at a Chicago-based healthcare provider, is performing a penetration test on the organization ' s patient record system following a recent data breach. During her investigation, she discovers that attackers gained access to a large volume of encrypted patient records but had no knowledge of the original data or encryption keys. Emma observes that the system uses a block cipher and suspects the attackers may have applied a cryptanalytic method that examines encrypted outputs in bulk to detect structural or statistical patterns in the encrypted data. Which cryptanalysis technique should Emma investigate to assess the system ' s vulnerability in this scenario?","o":["Chosen-plaintext attack","Known-plaintext attack","Chosen-ciphertext attack","Ciphertext-only attack"],"a":[3],"e":"正確答案是 D， 密文-只攻擊，因為攻擊者只擁有加密資料，既沒有加密金鑰，也沒有任何被證實的原明文樣本。 在符合CEH 密碼學概念中，密碼分析攻擊按照攻擊者擁有何種資訊和能力進行分類。 密文-只攻擊是最受限制的模型:攻擊者試圖僅透過分析密文來推斷出明文或金鑰，常常會利用統計屬性，重複，格式化的假設，以及如果加密被濫用時可能洩露資訊的結構模式。情節突出顯示攻擊者\"檢查大量加密輸出\"以偵測\"結構或統計模式\"。 該措辭直接對映到密文-只分析:尋找由執行模式薄弱， IV/nonce 處理不善，確定加密，重複塊(常見於 ECB 模式)，可預見頭，或一致的記錄範本所引發的規律。有了塊密碼器，如果系統使用不安全，大型資料集會增加重複的明文塊產生重複的密文塊的機會。模式或再利用 IV，允許攻擊者關聯記錄，識別欄位，或者有時在與協定或檔案格式知識結合時恢復內容。其他選項需要比快取提供的攻擊者能力更強。 已知-明文攻擊需要一些明文-密文對。 Chosen-明文攻擊需要加密攻擊者選擇輸入的能力。 Chosen-密文攻擊需要解密甲骨文或為解密提交密文的能力。 由於這裡沒有出現這些，艾瑪應該評價密文-只暴露，並具體驗證密碼模式，IV/nonce 獨有性，被補活的行為，以及加密對於所儲存的病人記錄是否具有精密的安全性。是的，請","s":"term"},{"n":723,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"You are an ethical hacker at HorizonSec Consulting, hired by Liberty Insurance in Philadelphia, Pennsylvania, to test the resilience of their online claim submission portal. During testing, you modify the claim ID parameter in the URL with conditions such as AND and AND 1=2. When the first condition is used, the portal displays claim details as normal; when the second condition is used, the page displays no results. You repeat this process to determine how the application responds to true and false conditions without error messages or delays. Based on the observed behavior, which SQL injection technique are you employing?","o":["UNION SQL Injection","Error-based SQL Injection","Time-based Blind SQL Injection","Boolean Exploitation"],"a":[3],"e":"描述的行為符合基於 Boolean 的 blind SQL 注入， 此處代表為 Boolean explain。 在這個技術中， 測試者注入了評價到TRUE 或 FALSE 的條件， 然後透過觀察應用程式回應的不同來推斷後端的查詢行為-- 如返回正常內容與返回空頁-- 而不依賴明確的 資料庫錯誤訊息或時間延遲。設想方案的關鍵指標是:所注入的有效酬載包括條件邏輯，如 AND 1=2,這是經典的常假試驗。當使用真實條件時，入口網站返回預期的索償細節；當使用虛假條件時，返回\"無結果\"。測試者重複了這些real/false 測試，具體地說，\"沒有錯誤訊息或延遲\"，這排除了基於錯誤和基於時間的方法，並證實了\"盲\"的推論方法。為何其他選項不合適:UNIONSQL 注入 (A) 依賴將惡意的 UNIONSELECT 與原始查詢相組合，直接將額外的行/columns 擷取到回應中來。 情境沒有擷取聯合資料；而是從布林條件中觀察回應的差異。基於錯誤的 SQL 注入 (B) 取決於觸發 資料庫 錯誤和讀取錯誤輸出。 情境中明確沒有涉及錯誤訊息。基於時間的 Blind SQL 注入 (C) 透過強制延遲(如 SLEEP ()) 推斷出真理值，而這裡顯然沒有發生。因此，該技術最好被確認為 D。 Boolean 開發(Boolean-blind SQL 注入)。","s":"term"},{"n":724,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"Maria is conducting passive reconnaissance on a competitor without interacting with their systems. Which method would be least appropriate and potentially risky?","o":["Using the Wayback Machine","Running an intensive port scan on public IPs","Reviewing forums and social media","Examining patent databases and public records"],"a":[1],"e":"CEH v13 將被動偵察定義為不與目標系統直接互動而蒐集資訊。 諸如審查存檔網站，社交媒體，論壇，公共記錄等活動都是被動和合法的。進行密集連接埠掃描 不過， 是一種活動偵察技術。根據 CEH v13,連接埠掃描直接與目標系統互動 並且可以觸發 IDS/IPS 警報， 日誌，。 以及如果未經授權，甚至法律後果。因此，選項 B 違反了被動偵察的原則，是風險最大的選擇。"},{"n":725,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"During a penetration test at Windy City Enterprises in Chicago, ethical hacker Mia Torres targets the company ' s public-facing site. By exploiting an unpatched vulnerability in the web server, she manages to alter visible content on the homepage, replacing it with unauthorized messages. Mia explains to the IT team that this kind of attack can damage the company ' s reputation and erode customer trust, even if sensitive data is not directly stolen. Which type of web server attack is Mia most likely demonstrating?","o":["DNS Hijacking","Frontjacking","File Upload Exploits","Website Defacement"],"a":[3],"e":"所描述的攻擊是網站被破壞，當攻擊者獲得修改網站內容的能力時發生這種情況--通常是主頁--顯示未經授權的資訊，宣傳，或破壞行為。 情境明確寫道米婭\"在主頁上修改了可見的內容，取而代之的是未經授權的資訊\"，並強調即使沒有資料被竊取，也會有名譽上的傷害。 這種名聲影響是被貶損的標誌:它會破壞客戶信任，訊號安全薄弱，即使沒有機密資訊被過濾，也可能產生監管/brand 後果。所宣告的切入點--\"在網路伺服器中挖掘出未被標註出的弱點\"--也與去相符合。 攻擊者經常會利用網路伺服器或 Web 應用程式的弱點(錯誤的設定，已知的 CVES，弱的認證資訊，脆弱的外掛，或不安全的檔案權限)來獲得對網路內容或範本的寫入存取。 實現寫入存取後，攻擊者可以替換 HTML 頁面，更改範本，注入惡意指令碼，或者修改資產，使存取者能夠看到攻擊者的資訊。為什麼其他選擇不合適:DNS 劫持(A)透過改變 DNS 解析度來重新引導使用者，使域指向攻擊者控制的伺服器，這可以導致一個假站點，但與修改真實的伺服器主頁內容不同。前劫持(B)通常涉及 UI 欺騙--覆蓋或設定內容來欺騙使用者--而不是對主頁進行伺服器-側修改。檔案上傳開發(C)是一種可以用來取得程式碼執行或將惡意檔案放入伺服器的方法，但問題在於顯示的網頁型別為伺服器攻擊。所描述的可見結果--未經授權的主頁更改--最好被歸類為被破壞。因此，米婭最有可能展示 D。 Website Defacement。","s":"term"},{"n":726,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at Rocky Mountain Insurance in Denver, ethical hacker Sophia Nguyen attempts to evade detection by fragmenting malicious traffic into smaller packets. The IT security team counters her strategy with a system that monitors traffic for deviations from established baselines, flagging behavior that does not match normal network activity. This allows them to stop Sophia's evasion attempts in real time. Which detection technique is the IT team most likely using in this case?","o":["Deep Packet Inspection","Stateful Packet Inspection","Signature-Based Detection","Anomaly-Based Detection"],"a":[3],"e":"正確答案是 D。 Anomaly-Based Detection，因為情境明確規定系統\"用於偏離既定基線的摩尼器流量\"並標出不符合正常網路活動的行為。 在符合 CEHIDS/IPS 概念中， 基於異常的偵測(也叫基於行為偵測)透過建構一個\"正常\"的外觀--如典型的封包率--的剖面圖而起作用， 協定 使用量， (單位:千分之一) 工作階段圖案， 時間， 連線分佈， 以及預期的網路流量--然後查明嚴重偏離這些規範的事件。 這使得它特別有利於打擊逃逸技術和以往所未見的模式，因為它不僅限於匹配已知的簽名。 Sophia 的戰術--封包破碎--是一種典型的逃避做法，目的是繞過簡單化的檢查系統，將惡意的有效酬載或攻擊模式分拆出多塊碎片，使其更難重建或匹配。 一個基線驅動的異常系統仍然可以探測到攻擊，因為與正常的流量剖面相比，破碎本身(或由此而來的流量特徵)可能顯得異常:不尋常的碎片計數，出乎意料的碎片大小，非典型的再組裝行為，不規則的工作階段特徵，或協定違規。由於偵測是基於行為而非固定模式，即使準確的惡意酬載不被識別，也可以觸發警報。為什麼其他選項不太正確:基於簽名的偵測依賴於已知的模式，當攻擊者修改有效酬載或碎片流量以避免匹配時可能會被逃避。State 封包檢查軌跡連線狀態並可以幫助工作階段驗證，但它本質上不是一個基線偏差探測器。 深封包檢查檢查了封包的內容，有時可以根據執行情況重新組裝出碎片，但問題的關鍵線索是\"從既定基線中推匯出\"，這直接指向了以異常為主的偵測。因此，IT 團隊最有可能使用以異常為基礎的偵測。","s":"term"},{"n":727,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"What does an ACK scan mainly identify?","o":["Services","Firewall rules","Closed ports","Open ports"],"a":[1],"e":"正確答案是 B，因為 ACK 掃描主要用於確定防火牆過濾規則，而不是用於識別服務或直接確認開放和關閉的埠。 在CEH 掃描方法中，一款 ACK 掃描傳送 TCP 封包，只有 ACK 旗的設定，並分析目標或中間的防火牆如何回應。 CEH 材料稱 ACK 探測器掃描有助於識別過濾系統:如果返回一個 RST 封包，封包到那個連接埠不會被過濾；如果沒有反應，那麼一個狀態的防火牆很可能過濾出封包。另一種以 CEH 考試為重點的參考類似地指出，ACK 探測器在遠端端檢查過濾；沒有反應表明攻擊者與主機之間有狀態的防火牆，而 RST 反應則表明沒有。透過版本偵測或抓取標語來更好地識別服務，而開放的埠則是通常用 SYN 或 TCP 連線掃描來識別。因此，最好的 CEH 答案是防火牆規則。","s":"term"},{"n":728,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at a logistics company in Atlanta, Georgia, you examine the configuration of network devices and discover that they rely on legacy communication mechanisms lacking encryption and integrity checks. These mechanisms allow neighboring systems to exchange operational data without verification, exposing the infrastructure to potential manipulation. What type of vulnerability is most clearly present?","o":["Firewall vulnerabilities","Lack of password protection","Lack of authentication","Insecure routing protocols"],"a":[3],"e":"最好的答案是 D。 不可靠的路由協定，因為情境描述了遺留的鄰接裝置通訊缺乏加密和完整性驗證，使得操作的路由資料可以不經驗證而被交換。 在符合 CEH 的網路駭客概念中，這是舊有或不當安全的路由協定(和相關的網路控制-平面交換)的一個經典弱點，因為路由器信任並且不從密碼學上驗證路由資訊的真實性和完整性。當路由更新被接受而不經過嚴格的核即時， 攻擊者如果能夠定位在同一段(或對一個信任的鄰居的抱怨)，可注入 或操縱路徑資訊。這可以允許攻擊 諸如路線注入， 路線中毒， 中間人 (MITM) 流量重新導向，。 堵塞流量， 或透過不斷宣傳不良路線造成服務不穩定/denial。 提及\"鄰接系統\"和\"運算元據\"，強烈地將線路圖指向裝置交換可到達性和地貌資訊的接線方式，缺乏完整性檢查使得在轉口時改變路由資訊或偽造資訊成為可能，而沒有加密可能暴露出路線細節，從而進一步幫助偵察和有針對性地操縱。為什麼其他選項不準確:防火牆的弱點與過濾和政策執行有關，但這裡的核心問題是路徑/control 訊息的信任模式和保護，而不是防火牆規則缺陷。缺乏密碼保護過於通俗化，一般指管理權限上的弱/no 認證資訊，不是未經身分驗證的路由交換。缺乏認證在概念上是相聯的，但問題是，鑑於攜帶運算元據的鄰居之間的“遺留通訊機制”，最明顯地存在著何種型別的弱點--這最具體地被以 CEH 術語歸類為不安全的路由協定(即路由更新缺乏認證/integrity，有時是加密)。在實踐中，各組織透過(在得到支援的情況下)通向協定認證、使用加密完整性保護、限制通向附著物、分出或過濾通向/control-來緩解這種情況。飛機只向受信任的同行飛行","s":"term"},{"n":729,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"During an authorized security assessment of a smart thermostat manufacturer in Denver, Colorado, a certified ethical hacker receives a firmware image extracted from a production device for further evaluation. The tester begins by examining the binary file to determine its format and architecture. Basic inspection commands are executed against the image to review embedded human-readable content and observe low-level binary structure before proceeding with deeper analysis. Within the firmware analysis workflow, which stage is the tester performing?","o":["Extract the Filesystem","Obtain Firmware","Analyze Firmware","Emulate Firmware"],"a":[2],"e":"正確答案是 C。 分析 Firmware。韌體影象已經獲得。 測試者正在檢查二進位， 以瞭解其格式、 架構、 可讀字串和低等結構。 這是分析韌體階段的一部分。被引用的韌體分析材料將檔案 < bin >，字串，字串 -n5 < bin >，字串 -tx < bin >，binwalk < bin >， 和 xdump -C < bin >等命令列為用於檢查韌體內容和結構的韌體分析活動。選項 A。 擷取檔案系統是不正確的，因為檔案系統擷取將涉及從韌體影象中擷取嵌入式檔案系統，通常使用 binwalk -e 等工具。選項 B。 取得韌體是不正確的，因為問題表明測試者已經收到韌體影象。選項 D。 模擬公司軟體是不正確的，因為模擬涉及執行或模擬公司軟體環境，而這種情況尚未發生。因此，最好的答案是 C。 分析 Firmware。"},{"n":730,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"An attacker accesses a server using reused NTLM hashes without cracking passwords. What attack is this?","o":["Brute force","Replay","Kerberoasting","Pass-the-hash"],"a":[3],"e":"正確答案是 D， Pass-the-hash。 在\"Pass-the-Hash\"攻擊中，攻擊者不需要破解或知道明文密碼。 相反，攻擊者重新使用被俘或擷取 NTLM 雜湊作為認證資訊存取另一個 Windows 系統或伺服器。 CEH 系統駭客和密碼攻擊材料直接描述了這個概念:攻擊者偷取雜湊併傳送雜湊而不是破解密碼， 允許 Windows 認證將雜湊視為有效的認證資訊。 CEH 密碼攻擊材料也描述了雜湊注入，從 SAM 或記憶體中擷取的登入雜湊被用到日誌上到其他伺服器並再去利用更多的帳戶。 Brute Force 嘗試了許多密碼猜測，Kerberoasting target Kerberos service people，再玩是一個更廣泛的類別，但在這裡並不精確。 因為問題具體提到再利用了 NTLM 雜湊而未破解密碼，所以確切的攻擊是\"Pass-the-Hash\"。","s":"term"},{"n":731,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"On a busy Monday morning at Horizon Financial Services in Chicago, accounts assistant Clara Nguyen receives an email that appears to come from the company ' s IT department. The email, addressed specifically to Clara and mentioning her role in the accounts team, warns of a critical system vulnerability requiring immediate action. It includes a link to a login page resembling the company ' s internal portal, urging her to update her credentials to prevent account suspension. The email ' s sender address looks legitimate, but Clara notices a slight misspelling in the domain name. What social engineering technique is being attempted against Clara?","o":["Spear Phishing","Impersonation","Quid Pro Quo","Vishing"],"a":[0],"e":"描述的攻擊是魚叉式網路釣魚，因為它是利用個人和組織背景為特定個人設計的有目標的釣魚圖謀。 CEH 社交工程的覆蓋範圍中，魚叉式網路釣魚與通用釣魚因其定製而有所不同:攻擊者按受害者的姓名與受害者聯絡，引用受害者的工作功能，並調整資訊以創造可信度和緊迫性。 在此，電子郵件是專門發給克拉拉的，並提到了她在帳戶團隊中的作用，這增加了她信任訊息並遵從的可能性。訊息使用 CEH 材料中強調的經典的釣魚心理觸發器:緊迫和恐懼。 透過聲稱\"關鍵系統脆弱\"和威脅帳戶暫停，攻擊者向克拉拉施壓以迅速行動並忽略核查步驟。 包含一個連結到一個登入頁面，\"重現公司內部入口網站\"表示認證資訊收割，攻擊者的目標是捕捉使用者名稱和密碼或其他認證符。 傳送者域中微妙的誤寫是模仿合法的公司電子郵件位址並繞過隨機檢查的外觀或打字域的常見指標。其他的選項並不匹配。 假冒是一個更廣泛的類別， 但 魚叉式網路釣魚 是使用個人化的電子郵件誘導的特定技術。 Quid 的代用詞包括提供一種好處或服務來換取資訊， 而資訊並不存在。 Vishing 是透過電話而不是電子郵件進行基於語音的打字。 CEH 指導中推薦的防禦包括驗證寄件者域，使用與 IT的出帶確認，使電子郵件安全控制如 SPF，DKIM，和 DMARC，以及強制進行釣魚意識培訓和 MFA 來減少認證資訊被竊的影響。","s":"term"},{"n":732,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"You have successfully compromised a server having an IP address of 10.10.0.5. You would like to enumerate all machines in the same network quickly. What is the best Nmap command you will use?","o":["nmap -T4 -q 10.10.0.0/24","nmap -T4 -O 10.10.0.0/24","nmap -T4 -r 10.10.1.0/24","nmap -T4 -F 10.10.0.0/24"],"a":[3],"e":"從 CEHv13 指南中綜合詳細解釋:正確答案是 D。 nmap -T410710.10.0.0/24。 目標是快速地將屬於 10.10.0.0/24 網路的已損壞的伺服器(10.10.0.5)在同一個子網內列出主機。在 Nmap 中，-F(快掃描)選項掃描僅是最常用的埠，而不是全連接埠範圍，顯著地縮短了掃描時間。 與-T4 結合，透過更激進的計時範本來提高掃描速度，是提供子網快速識別活動系統和服務的選擇中最快的選項。選項 A(-q)不執行主機列舉，也不是標準的 Nmap 主機-發現最佳化。 選項 B(-O)執行 OS 偵測，它產生額外的探測器，並且在目標僅僅是快速識別系統時需要比必要的時間更長。 選項 C(-r)依次掃描埠並瞄準錯誤的子網(10.10.1.0/24)，使其不正確。從 CEH 偵察和網路掃描視角來看，當速度重要時，安全專業人員通常會使用\"快掃描\"等最佳化的 Nmap 掃描和有侵略性的計時範本，在進行更深的列舉活動之前高效地識別活主機。","s":"tool"},{"n":733,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"Multiple failed login attempts using expired tokens are followed by successful access with a valid token. What is the most likely attack scenario?","o":["Capturing a valid token before expiry","Token replay attack using expired tokens","Brute-forcing token generation","Exploiting a race condition in token validation"],"a":[3],"e":"此情境強烈地暗示了 CEH v13 Web 應用程式入侵所描述的應用程式符號驗證邏輯中的競爭條件攻擊。 應用程式同時處理多個請求而未能正確同步驗證檢查時，會出現競爭條件。多次嘗試使用過期的符號失敗，然後在短時間視窗內成功存取，這表明攻擊者利用了計時缺陷。在這個視窗中，系統可能存在不一致的驗證符號過期，允許接受過期的符號。選項 A 不太可能，因為日誌具體引用了過期的符號。選項 B 是不正確的，因為重放過期的符號應失敗，除非存在驗證缺陷。選項 C極不可能，因為符號式 en。 CEH v13 強調競爭條件是高階邏輯缺陷，難以發現，在標準測試中經常被錯過，它們通常被利用在認證，支付處理，和工作階段管理系統中。因此，選項 D 是正確和符合 CEH 的答案。","s":"term"},{"n":734,"c":"密碼學","ce":"Cryptography","t":"short","q":"A system analyst wants to implement an encryption solution that allows secure key distribution between communicating parties. Which encryption method should the analyst consider?","o":["Disk encryption","Symmetric encryption","Hash functions","Asymmetric encryption"],"a":[3],"e":"經認證的道德駭客(CEH)密碼學模組解釋，加密中的主要挑戰之一是安全金鑰分佈。 非對稱式加密，又名公用金鑰密碼學，是專門用來解決這個問題的。在非對稱式加密中，每個實體都擁有公開金鑰和私密金鑰。 公開金鑰可以公開共享，允許任何人安全加密資料，而只有相應的私密金鑰可以解密。 CEH 檔案強調，這個模型消除了透過不安全的通道傳輸金鑰的需要。選項 D 是正確的，因為 非對稱式加密 允許在不事先信任的情況下安全地交換金鑰。選項 B(對稱式加密)需要共享金鑰並面臨關鍵分發挑戰。選項 A 是指在儲存地保護資料，而不是金鑰交換。選項 C 提供完整性核查，而不是加密。CEH 強調非對稱式加密支撐了 TLS 等安全協定和數位憑證。","s":"term"},{"n":735,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"long","q":"A large online retail platform in Seattle, Washington, maintains continuous telemetry of inbound network flows to detect abnormal surges that may indicate a distributed denial-of-service condition. During a recent monitoring exercise, the security engineering team implemented a statistical mechanism that continuously evaluates streaming traffic metrics and mathematically determines the exact point at which normal behavior shifts into an anomalous state. Rather than comparing traffic against static baselines or clustering historical profiles, the system dynamically identifies the precise moment when distribution characteristics deviate beyond an established threshold. This approach is designed to flag sudden structural changes in traffic behavior in near real time, even if the overall traffic volume appears similar to prior peaks. Which detection technique is being applied in this scenario?","o":["Wavelet-Based Signal Analysis","Traffic Pattern Analysis","Activity Profiling","Sequential Change-Point Detection"],"a":[3],"e":"正確答案是 D。 序列變化點偵測。情境描述一種統計方法，它能識別正常流量行為改變為異常流量行為的確切時刻。這直接匹配序列變化-點偵測。 符合 CEHDoS/DDoS 偵測材料解釋: Change-Point 偵測用於偵測阻斷服務攻擊。 並使用非參數累積和， 或 CUSUM， 或 單倍徑演算法以偵測流量變化。它也被描述為計算成本低 和高準確度。選項 A.以波萊為主的訊號分析是不正確的，因為波萊分析透過訊號分析來偵測出量基異常，但問題強調確定準確的統計過渡點。選項 B。 流量模式分析過於籠統，沒有具體描述變點偵測。備選 C。 活動剖析將觀測到的活動與平均流量率或基線進行比較，而假設情況則說，系統不只依賴於靜態基線。因此，最好的答案是 D。 序列變化點偵測。","s":"term"},{"n":736,"c":"惡意軟體威脅","ce":"Malware Threats","t":"long","q":"During a routine software update at Horizon Solutions, a mid-sized IT firm in Raleigh, North Carolina, an employee downloads a file utility from a popular third-party site to streamline document processing. During the installation, the user is prompted to install an optional \"productivity toolbar\" and a \"system optimization tool,\" which are bundled with vague descriptions. Shortly after, the employee notices intermittent pop-up ads, an altered browser homepage, and sluggish PC performance, though network logs also show occasional unexplained data transfers during off-hours. A security scan flags the additional programs as potentially harmful, but a deeper analysis reveals no immediate file encryption or self-replicating code. What type of threat are these unwanted programs most likely classified as?","o":["Potentially Unwanted Applications (PUAs)","Worms","Botnet agents","Logic bombs"],"a":[0],"e":"正確的分類法是\"潛在的不受歡迎的應用程式\"(PUAs)。 在 CEH 惡意軟體分類法中，PUA 指的是在傳統意義上不嚴格惡意但表現出不良行為的軟體，如顯示侵入性廣告，修改瀏覽器設定，蒐集使用者資料，貶低系統效能，或者與其他自由軟體捆綁而不清晰的使用者意識等。 在這種情境下，工具欄和最佳化工具被捆綁在一個合法的公用裝置安裝器上，並呈現出模糊的描述--一種極為常見的 PUA 分配方法，被稱作軟體捆綁。所描述的症狀--流行廣告、主頁修改、效能遲緩和背景資料傳輸--與廣告軟體或瀏覽器劫持者是一致的，這屬於更廣泛的 PUA 分類。問題說明沒有立即提交加密(表明勒索軟體)，也沒有自我複製(表明存在蠕蟲)。 殭屍網路代理通常建立指揮與控制通訊，並且是為協調的惡意活動設計的，如 DDoS 或垃圾郵件運動；而不明原因的流量可能會引起懷疑， 描述的行為與廣告風格貨幣化比結構化的殭屍網路活動更緊密地相配合。邏輯炸彈是由特定條件觸發的休眠程式碼，在此不註明。從防守角度出發，CEH 推薦了安全的軟體取得政策，使用者意識培訓，使不必要的捆綁設施失效，實施端點保護並啟用了 PUA 偵測功能，並強制實施應用程式允許上市以防止未經授權或捆綁的軟體在企業環境中被執行。","s":"term"},{"n":737,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"During a compliance review at a law firm in Chicago, an ethical hacker tests the firm's secure email gateway. She observes that sensitive legal documents are being transmitted in clear text over the Internet, allowing anyone intercepting the traffic to read the contents. The firm is concerned about unauthorized individuals being able to view these communications. Which principle of information security is being violated?","o":["Confidentiality","Integrity","Non-Repudiation","Availability"],"a":[0],"e":"正確答案是 A。 機密性，因為情境描述的是以清晰的文字傳送的敏感資訊，這意味著內容可以被任何能夠攔截流量的未經授權的一方所讀取。 在資訊保安方面，機密性是保證資訊只能被授權的個人，實體或程序取得的原則。 當通訊沒有得到充分保護--如加密攻擊者進行網路攔截(例如透過中間人定位、封包嗅探在已損壞的路由器上、惡意的 Wi-Fi 或上游監測)時，可以直接檢視檔案內容。提示的關鍵短語是\"任何人攔截流量都可以讀取內容\"，這並非描述被更改的資訊或偽造的郵件；而是描述未經授權的披露。 保密通常使用加密在過境(如 TLS 用於 SMTP 提交和伺服器-至伺服器運輸，在可能時，S/MIME，PGP)，安全金鑰管理，以及電子郵件閘道器的政策執行等機制來保護。 在法律環境中，保密特別關鍵，因為使用者端通訊和法律檔案往往載有保密或受管制的資訊。違反規定、名譽損害和潛在法律後果。其他選擇為何不正確: 完整性涉及電文或檔案是否在途中被更改(列印、修改、插入)， 設想方案沒有提及更改-- 僅指未經授權的閱讀。 不否定可確保當事人不能拒絕傳送或接收電文(通常有數位簽章和記錄支援)， 這裡的問題不是來源證明而是曝光。 可用性涉及系統和資料是否在需要時仍然可用(更新時間、恢復能力、DoS)。因此，以明確的案文轉遞敏感法律檔案違反了保密的基本安全原則。","s":"term"},{"n":738,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"short","q":"An attacker plans to compromise IoT devices to pivot into OT systems. What should be the immediate action?","o":["Perform penetration testing","Secure IoTOT communications with encryption and authentication","Deploy ML-based threat prediction","Deploy an IPS"],"a":[1],"e":"CEH v13 強調 IoT-至 OT 整合是關鍵基礎設施環境中最危險的架構之一。 IoT 裝置往往缺乏強大的安全控制併成為橫向移動到 OT 系統控制物理過程的理想入站。當務之急是保證 IoT 和 OT 系統之間的通訊邊界的安全。 執行強加密，認證，和存取控制確保即使一個 IoT 裝置被損壞，也不能作為樞機。 CEH v13 明確推薦網路分接和安全通訊通道作為第一回應封隔措施。滲透測試(備選 A)有價值 卻很費時 ML-基於工具(備選 C)需要培訓時間 IPS 部署(備選 D)有助於偵測攻擊 但不預防認證資訊虐待 IoT 之間或可信任路徑開發 和 OT 層。透過強制實施安全協定，憑證，身分驗證機制，組織減少攻擊。因此，選項 B 是正確的。"},{"n":739,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"A penetration tester is hired to legally assess the security of a company ' s network by identifying vulnerabilities and attempting to exploit them. What type of hacker is this?","o":["Black Hat","Grey Hat","Script Kiddie","White Hat"],"a":[3],"e":"CEH v13 將一頂白帽駭客定義為有明確授權的資安專業人員，在法律和合同範圍內進行滲透測試，弱點評估，以及弱點利用企圖。白帽的目的是加強安全，而不是妥協。 白帽遵循結構化的方法，檔案結論，並提供補救建議。 黑帽(可選 A)行為惡意而未經許可。灰色帽子(可選 B)操作未經授權，但無有害意圖，這不符合公司滲透測試程式。 Script kiddies(可選 C)依靠事先建造的工具而缺乏深知，不受僱於合法的聘用。因此，被描述的個人是一頂白色帽子，在得到組織同意後，根據法律和道德準則運作。","s":"term"},{"n":740,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"While conducting a covert penetration test on a UNIX-based infrastructure, the tester decides to bypass intrusion detection systems by sending specially crafted TCP packets with an unusual set of flags enabled. These packets do not initiate or complete any TCP handshake. During the scan, the tester notices that when certain ports are probed, there is no response from the target, but for others, a TCP RST (reset) packet is received. The tester notes that this behavior consistently aligns with open and closed ports. Based on these observations, which scanning technique is most likely being used?","o":["ACK flag scan to evaluate firewall behavior","TCP Connect scan to complete the three-way handshake","Xmas scan leveraging RFC 793 quirks","FIN scan using stealthy flag combinations"],"a":[3],"e":"CEH 描述為 FIN 掃描為不啟動 TCP 握手而用 FIN 旗傳送封包的隱形掃描。 根據 TCPRFC 行為， 關閉的埠回應 RST 封包 開啟埠時忽略了探測器 生成無回應。這允許 連接埠 的 列舉 狀態，同時迴避通常用於監測 SYN-基於掃描的 IDS 系統。"},{"n":741,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"short","q":"Peter extracts the SIDs list from Windows 2000 Server machine using the hacking tool \"SIDExtractor\". Here is the output of the SIDs: From the above list identify the user account with System Administrator privileges.","o":["Chang","Micah","Sheela","Rebecca","Somia","John","Shawn"],"a":[5],"e":"正確答案是 F，因為 Windows 的 Administrator 帳戶是依 RID 值識別，而不能只看顯示的使用者名稱。在 Windows 列舉中，安全識別碼（Security Identifier, SID）可唯一識別使用者、群組及電腦帳戶；SID 的最後一段是相對識別碼（Relative Identifier, RID）。\n\n符合 CEH 的教材指出，Windows 使用 SID 與 RID 追蹤帳戶權限。RID 500 代表內建 Administrator 帳戶，Guest 帳戶通常使用 RID 501，而一般新建使用者通常從 1000 起依序遞增。因此，即使 Administrator 已重新命名，SID 以 -500 結尾的帳戶仍是系統管理員帳戶。\n\nsid2user 與 user2sid 等列舉工具可用來在使用者名稱與 SID 之間進行對應。本題中，John 對應管理員 RID，因此選項 F正確。","s":"term"
