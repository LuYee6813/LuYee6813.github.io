iew, you have discovered that there are no documented security policies for the area you are assessing. Which of the following would be the most appropriate course of action?","o":["Create policies while testing","Stop the audit","Identify and evaluate current practices","Increase the level of testing"],"a":[2],"e":"正確答案是 C。 識別和評價當前的做法。 在 CEH-相適應的安全評估概念中，使用安全審計/review 來核實安全政策和程式是否已經到位並正在被遵循。 如果不存在有檔案記載的政策，道德駭客或審計員在測試時不應停止審計或制定政策，因為政策的制定是管理/governance 的責任，而不是評估者的作用。 相反，評估員應確定該組織的現行做法、實際控制、非正式程式和業務行為，然後根據公認的標準、基線、法律要求和安全最佳做法加以評價。 CEH 材料還強調，資訊保安政策是安全基礎設施的一個基本組成部分並界定了要求、規則， 因此，最好的做法是確定和評估目前的做法。"},{"n":435,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester suspects that a web application ' s product search feature is vulnerable to SQL injection. The tester needs to confirm this by manipulating the SQL query. What is the best technique to test for SQL injection?","o":["Inject a malicious script into the search field to test for Cross-Site Scripting (XSS)","Use directory traversal syntax in the search field to access server files","Input 1 OR 1=1 in the search field to retrieve all products from the database","Insert admin ' -- in the search field to attempt bypassing authentication"],"a":[2],"e":"SQL 注入測試通常涉及使用以陶瓷為主的有效酬載，如 1 OR 1=1,強制 SQL 查詢以評價為真。 CEH 解釋說，這證實了輸入分泌不當，並暴露了使用者提供欄位是否直接影響資料庫查詢，結果往往會返回所有記錄，表示注入成功。"},{"n":436,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"In a high-stakes cybersecurity exercise in Boston, Emily, an ethical hacker, is tasked with tracing a mock phishing email sent to a healthcare provider's staff. Using the email header, she identifies a series of IP addresses and server details, including multiple timestamps and server names. Her objective is to pinpoint the exact moment the email was processed by the sender's system. As part of her reconnaissance, what specific detail from the email header should Emily examine to determine this information?","o":["Sender's mail server","Date and time of message sent","Authentication system used by sender's mail server","Date and time received by the originator's email servers"],"a":[3],"e":"正確答案是 D。 發端人的電子郵件伺服器收到的日期和時間。電子郵件頭追蹤顯示 hop-by-hop 的路由資訊，包括郵件伺服器，IP 位址，時間戳，以及認證相關細節。 符合 CEH 的電子郵件足跡材料指出，使用頭追蹤郵件可以顯示目的位址，傳送者 IP 位址，傳送者郵件伺服器，時間和日期資訊，以及傳送者郵件伺服器的認證系統資訊。問題要問電子郵件由傳送者系統處理的確切時間。 在電子郵件頭中， 最好檢查傳送者或發端者的郵件基礎設施所新增的最早的相關接收標頭。時間戳顯示發端者的電子郵件伺服器收到或處理信件後再轉發。選項 A。 發信人的郵件伺服器是不正確的，因為它能識別所涉及的系統，但本身並不能提供處理時間。選項 B。 傳送信件的日期和時間不太精確，因為日期:標頭可能由郵件使用者端生成，並且可能不準確或由使用者控制。選項 C。 傳送者郵件伺服器所使用的認證系統是不正確的，因為 SPF，DKIM，DMARC 或類似的認證細節有助於驗證傳送者的真實性，而不是準確的處理時間。選項 D。 發端人電子郵件伺服器收到的日期和時間是正確的，因為它對應了訊息路徑中第一個被信任的伺服器-側時間戳。因此，最好的答案是發端人電子郵件伺服器收到的 D.日期和時間。"},{"n":437,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"long","q":"A private equity firm in Minneapolis, Minnesota allows employees to access internal reporting tools from their personally owned smartphones under its BYOD program. During a routine security assessment, a consultant observes that when an employee leaves their unlocked phone unattended, a colleague can immediately open the firm's financial application and review client investment records without any additional verification step inside the application. The operating system itself requires a passcode to unlock the device, but once unlocked, corporate applications open directly to sensitive dashboards. Identify the BYOD security guideline that would directly mitigate this exposure.","o":["Use Encryption Mechanism to Store Data","Set a Strong Passcode on the Device and Change It Relatively Often","Maintain a Clear Separation between Business and Personal Data","Set Passwords for Apps to Restrict Others from Accessing Them"],"a":[3],"e":"正確答案是 D。 設定 Apps 的密碼以限制其他人存取 Them。該裝置已經有一個作業系統的密碼，但是在手機解鎖後出現弱點。 財務應用程式直接開啟敏感儀表板而不需要額外的應用程式級別認證。 最直接的緩解是需要單獨的密碼，PIN，生物鑑別即時控制，或對敏感的公司應用程式進行再認證。 CEH Mobile/BYOD 材料解釋道:BYOD 引入了安全和控制挑戰，因為個人擁有的智慧手機和平板電腦存取組織資源。 Mobile 裝置管理解決方案通常執行密碼，遠端鎖定，遠端擦拭，root/jailbreak 偵測，應用部署，監測和政策執行等政策。選項 A。 使用加密機制來儲存資料對於在休息時保護資料很重要，特別是裝置丟失時，但在電話已經解鎖後它不會停止存取。選項 B。 在裝置上設定一個強烈的密碼， 並相對修改它 通常已經是部分已執行， 因為作業系統需要密碼。 問題在於 缺乏應用級驗證。選項 C。 保持商業和個人資料之間的明確分離對於 BYOD 治理有用，但並不直接阻止一個解鎖裝置開啟敏感的儀表板。選項 D。 設定 Apps 的密碼以限制他人存取Them 是正確的，因為它直接減輕了裝置解鎖後對公司應用程式的未經授權存取。因此，最好的答案是 D。 設定 Apps 的密碼，以限制其他人存取 Them。"},{"n":438,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"As a newly appointed network security analyst, you are tasked with ensuring that the organization's network can detect and prevent evasion techniques used by attackers. One commonly used evasion technique is packet fragmentation, which is designed to bypass intrusion detection systems (IDS). Which IDS configuration should be implemented to effectively counter this technique?","o":["Implementing an anomaly-based IDS that can detect irregular traffic patterns caused by packet fragmentation.","Adjusting the IDS to recognize regular intervals at which fragmented packets are sent.","Configuring the IDS to reject all fragmented packets to eliminate the risk.","Employing a signature-based IDS that recognizes the specific signature of fragmented packets."],"a":[0],"e":"根據認證的道德駭客(CEH)IDS/IPS 和出行技術模組， 封包分解是一種攻擊者用來將惡意有效酬載分解為更小碎片的技術。從而使得基於簽名的 IDS 感測器無法重新組裝 並檢查完整的封包。 CEH 解釋道，基於異常的 IDS 系統比較能有效對抗破碎的逃逸，因為它們分析行為偏差，而不是僅僅依靠已知的簽名。 斷裂流量在封包的大小，排序，再組裝異常方面經常偏離基線網路行為。選項 A 是正確的，因為基於異常的偵測可以識別出異常分解行為，即使酬載本身不符合已知的簽名。選項 B 是不可靠的，因為攻擊者沒有使用一致的間隔。選項 C 是不切實際的，因為合法流量可能支離破碎。選項 D 效果較差，因為以簽名為基礎的 IDS 系統可以被分解技術所繞過。 CEH 建議封包正常化和以異常為主的探測是有效的對策。"},{"n":439,"c":"社交工程","ce":"Social Engineering","t":"short","q":"An attacker impersonates a technician and gains physical access to restricted areas. What tactic is this?","o":["Help desk impersonation","Dumpster diving","Remote tech support scam","Physical impersonation (Tailgating/Impersonation)"],"a":[3],"e":"此情境可以說明物理假冒，是 CEHv13 社交工程中討論的社交工程戰術。 攻擊者利用外觀和角色假設的信任，穿成網路技師，可以不受質疑地取得存取權。與尾隨(涉及追蹤某人)不同的是，這次襲擊依賴於假定的權威和熟悉度。 CEH v13 將這歸為假冒襲擊，襲擊者將這裡作為僱員，承包商或供應商。其他選項描述不同的 社交工程 向量 :答:電話藉口 B: 垃圾桶搜尋中 國: 振動物理假冒特別危險，因為它完全繞過技術控制。選項 D 最符合情境。"},{"n":440,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"In Denver, Colorado, ethical hacker Rachel Nguyen is conducting a network security assessment for Apex Logistics, a transportation firm with a complex internal network. During her test, Rachel observes a client- server communication and injects specially crafted packets into the exchange, disrupting the client's session. As a result, the server continues interacting with Rachel's system while the legitimate client's connection becomes unresponsive. She uses this setup in a controlled environment to demonstrate vulnerabilities to the company's IT team. What network-level session hijacking technique is Rachel employing in this assessment?","o":["Blind hijacking","UDP hijacking","RST hijacking","TCP/IP hijacking"],"a":[2],"e":"RST 劫持是 CEH 材料中強調的在網路攻擊已建立通訊時的 TCP 工作階段劫持技術。 TCP 中，使用重置旗封包來突然拆解連線。 如果攻擊者能夠觀察工作階段並確定正確的參數，如 IP 位址，埠，以及視窗內序號等，他們可以偽造一個TCP114 封包，看起來來自一個端點。 這可以迫使被害方放棄工作階段，使合法的使用者端突然失去反應能力。劇情中的關鍵線索是瑞秋\"觀察了使用者端-伺服器的通訊\"，然後注入了被精心設計的封包來干擾使用者端，而伺服器則繼續和瑞秋的系統進行通訊。 這種行為符合在示威中實際使用 RST 劫持:終止或去同步被害者端點，同時保持伺服器-側工作階段可用時間足夠長，使攻擊者能夠以有效序列和識別值注入流量。在切換 LAN 中，這經常被與嗅探或流量能見度相配來可靠地將重置封包並隨後注入封包。劫盲是不一樣的 因為攻擊者看不到流量 並且必須猜出序號， 與“觀察者通訊”細節相矛盾。UDP 劫持不適用 因為 UDP 是無連線的，不使用 工作階段狀態 或 RST 旗。 \"TCP/IP 劫持\"是一個廣義的類別， 但問題在於使用何種技術透過所設計的封包來破壞使用者端， 最好確認為 RST 劫持。","s":"term"},{"n":441,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"A financial institution ' s online banking platform is experiencing intermittent downtime caused by a sophisticated DDoS attack that combines SYN floods and HTTP GET floods from a distributed botnet. Standard firewalls and load balancers cannot mitigate the attack without affecting legitimate users. To protect their infrastructure and maintain service availability, which advanced mitigation strategy should the institution implement?","o":["Configure firewalls to block all incoming SYN and HTTP requests from external IPs","Increase server bandwidth and apply basic rate limiting on incoming traffic","Deploy an Intrusion Prevention System (IPS) with deep packet inspection capabilities","Utilize a cloud-based DDoS protection service that offers multi-layer traffic scrubbing and auto-scaling"],"a":[3],"e":"CEHv13 課程軟體的綜合解釋:CEH v13 強調，現代多向量克 DDoS 攻擊--特別是 SYN 泛洪與地層 7HTTP 泛洪相結合--無法被傳統的防火牆有效緩解， IPS 裝置，或本機交透過濾器。 這些系統變得不堪重負，或有阻擋合法客戶的風險。CEH 強調使用基於雲的 DDoS 緩解平台，提供流量洗滌、分散式過濾、定速和自動縮放，以吸收大量惡意流量。 此類服務利用全球智慧、行為分析和多層次保護策略來區分合法和惡意流量。 增加頻寬或阻斷通路類對使用者無效並有害。IPS 無法進行規模化處理量子攻擊。 只有雲洗滌解決方案(如 Cloudflare， Akamai， AWS Shield Advance)滿足了 CEH推薦的高容量分散式攻擊的防禦。 這些服務透過在到達本組織基礎設施之前過濾上游流量，確保持續提供並儘量減少附帶損害。"},{"n":442,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"In the bustling tech hub of Silicon Valley, cybersecurity investigator Elena Martinez found herself deep into a late-night investigation at Horizon Tech Solutions on July 7, 2025. The company had reported sporadic network disruptions affecting their research team ' s access to critical project files. Elena, working under the cover of a maintenance window from midnight to 3 AM PDT, began monitoring the internal network, focusing on a subnet reserved for the R & D department. She noticed a pattern of failed connection attempts logged just before each disruption, with multiple hosts reporting temporary IP address conflicts. Suspecting foul play, Elena deployed a discreet test to simulate an internal threat scenario. Shortly afterward, several workstations began showing unfamiliar gateway settings and redirected users to misleading login portals during routine access attempts. Despite these anomalies, no security alerts were triggered. What type of attack technique did Elena most likely simulate?","o":["DHCP Starvation Attack","Packet Sniffing","MAC Flooding","Rogue DHCP Server Attack"],"a":[3],"e":"一個 Rogue DHCP 伺服器攻擊最適合症狀，因為它直接解釋了出乎意料的閘道器變化，IP 衝突，和流量重新導向到欺騙性入口網站。在 CEH 網路攻擊覆蓋中，DHCP 是一種基礎服務，它自動為用戶端提供 IP 設定，如 IP 位址，子網口，預設閘道器，和 DNS 伺服器等。如果攻擊者在同一廣播域上引入了無賴 DHCP 伺服器，客戶可以接受無賴伺服器的租賃--特別是如果其回應速度快於合法的 DHCP 基礎設施。 一旦發生這種情況，攻擊者可以將惡意預設閘道器或 DNS 伺服器推向這樣可以重新定位流量，中間人定位，以及捕捉式攔截，這與所描述的\"unfamiliar lates setters\"和\"Misleading lign ports\"相匹配。提及\"臨時 IP 解決衝突\"也表示:一個流氓伺服器可以發出與合法分配重疊的位址，引起間歇連線問題並失敗連線嘗試。 雖然 DHCP 飢餓攻擊可以透過耗盡 DHCP 池來製造干擾，但關鍵區別在於結果:飢餓主要阻斷服務直到流氓伺服器接管。 這裡，可觀察到的界定行為不僅僅是停用--它就是設定錯誤和重定向，這說明存在一個流氓 DHCP 伺服器積極發行惡意租賃。封包嗅探本身不會改變閘道器設定，而 MAC 位址泛洪的目的是迫使交換器像中樞一樣行為，而不是釋出IP 設定。 防禦控制包括 DHCPsnooping，連接埠安全，網路分割，以及對未經授權的 DHCP 報價和異常租賃模式的監測。","s":"term"},{"n":443,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A Java app uses Random() for session tokens. What is the risk?","o":["Session fixation","XSS","Predictable tokens","CSRF"],"a":[2],"e":"正確答案是 C，因為用 Java Random()來表示工作階段權杖可以建立可預見符。 工作階段權杖符必須是不可預料的，因為它們能識別經認證的使用者工作階段。 在 CEHWeb 應用程式和工作階段劫持概念中，弱小或簡單的工作階段 ID 允許攻擊者猜測或野蠻-武力有效的 IDs 並獲得對目標應用的未經授權的存取。 CEH 工作階段劫持材料也解釋，攻擊者可以透過觀察當前使用的活符來預測工作階段 ID，識別常數和可變部分，並猜測下個活符。 Java Random () 是通用的偽隨機生成器， 而不是加密安全隨機數生成器， 因此它不應該用於認證符。 安全的方法是生成長而複雜， 隨機的工作階段 ID 並在認證後再生成它們。特權變化。 這不是工作階段固定， 攻擊者強迫受害者使用已知的工作階段 ID； 不是 XSS， 它注入瀏覽器側指令碼； 也不是 CSRF， 它濫用了受害者認證的瀏覽器動作。","s":"term"},{"n":444,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During an external assessment of a healthcare insurance company in Houston, a penetration tester identifies a service running on TCP port 389. When queried, the service accepts anonymous binds and reveals directory data. By structuring his search filter, the tester is able to obtain usernames, departmental details, and organizational units. This information could potentially be used for targeted password attacks or privilege escalation. Which classification best describes this enumeration activity?","o":["SMTP Enumeration","DNS Enumeration","LDAP Enumeration","NTP Enumeration"],"a":[2],"e":"TCP 連接埠 389 是 LDAP(Lightwight Directory Access 協定)的預設連接埠。 測試者的行為--執行匿名繫結和查詢目錄內容，並配有結構化的搜尋過濾器來擷取使用者名稱和組織資訊--是 LDAP 列舉。 LDAP 的確定指標，通常用於集中目錄服務(包括與 Active Directory 透過 LDAP 介面整合的環境)。 如果設定不當，允許匿名繫結或過度放任地搜尋，攻擊者可以取回有價值的身分和結構資料。設想題目描述了獲得使用者名稱、部門細節和組織單位(OU)的情況，這些是典型的 LDAP目錄屬性和容器。 假設它們可以直接支援後續攻擊路徑:建立目標為密碼- spraying 的清單，設計提及準確內部角色的標槍釣魚，識別特權群體，以及繪製組織結構以優先安排高價值目標。 即使沒有直接的認證資訊妥協，目錄披露也會提高攻擊者的有效性。為什麼其他選項不正確 :SMTP 列舉 (A) 專注於電子郵件系統(例如:VRFY/EXPN/RCPT to behaviors)，一般使用 TCP/25 或相關的郵件埠，而不是 389。 DNS 列舉 (B)涉及查詢 DNS 記錄(A/AAAA，MX，NS，TXT，區間轉移)，不涉及目錄繫結或 LDAP 過濾。 NTP 列舉(D)涉及時間服務(UDP/123)並提供了 time/monlist-style 資訊，而不是使用者/OU 目錄屬性)。由於服務在 TCP/389 上，技術涉及繫結和目錄搜尋，因此正確的分類是 C.LDAP 列舉。","s":"term"},{"n":445,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A company ' s security policy states that all Web browsers must automatically delete their HTTP browser cookies upon terminating. What sort of security breach is this policy attempting to mitigate?","o":["Attempts by attackers to access Web sites that trust the Web browser user by stealing the user ' s authentication credentials.","Attempts by attackers to determine the user ' s Web browser usage patterns, including when sites were visited and for how long.","Attempts by attackers to access the user and password information stored in the company ' s SQL database.","Attempts by attackers to access password stored on the user ' s computer without the user ' s knowledge."],"a":[0],"e":"從 CEHv13 指南中綜合詳細解釋:正確答案是 A。 HTTP cookie 經常在使用者 日誌 之後儲存 工作階段 識別符號或認證相關權杖到一個網站。 如果這些 cookie 在瀏覽器關閉後仍留在系統上，一個存取裝置，惡意軟體或被竊取的瀏覽器資料的攻擊者可能會再利用這些 cookie 來冒充認證使用者。這通常與工作階段劫持，Cookie 盜竊有關，或未經授權再使用可信任瀏覽器工作階段。當瀏覽器終止時自動刪除 cookie 降低了攻擊者日後恢復有效工作階段 cookie 的機會。 選項 B 更多涉及隱私追蹤和瀏覽歷史分析，而不是主要認證風險。 選項 C 指 SQL 資料庫 折中方案， cookie 刪除並不直接防止。 選項D 指本機儲存的密碼，這些密碼與 HTTP cookie 相分離。 因此， 這項政策主要旨在減少透過被竊取的認證/工作階段資料擅自存取可信網站的情況。"},{"n":446,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"During a security assessment of an internal network, a penetration tester discovers that UDP port 123 is open, indicating that the NTP service is active. The tester wants to enumerate NTP peers, check synchronization status, offset, and stratum levels. Which command should the tester use?","o":["ntpdc","ntpq","ntptrace","ntpdate"],"a":[1],"e":"ntpq 工具提供了詳細的 NTP 端點資訊，同步狀態，抵消，延遲，和層。 CEH 特別列出 ntpq 作為查詢 NTP 守護程序狀態和列舉端點關係的工具，使得偵察和橫向移動對映至關重要。","s":"tool"},{"n":447,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester is assessing a web application that does not properly sanitize user input in the search field. The tester suspects the application is vulnerable to a SQL injection attack. Which approach should the tester take to confirm the vulnerability?","o":["Use directory traversal in the search field to access sensitive files on the server","Input a SQL query such as 1 OR 1=1 -- into the search field to check for SQL injection","Perform a brute-force attack on the login page to identify weak passwords","Inject JavaScript into the search field to perform a Cross-Site Scripting (XSS) attack"],"a":[1],"e":"SQL 注入是 CEH 培訓中涵蓋的最常見和最危險的弱點之一，它發生在應用程式接受未解密輸入並直接傳遞到後端 SQL查詢時。 要確認 SQL 注入的存在，測試者必須插入一個酬載來改變應用程式所執行的 SQL 查詢的邏輯。 一個經典的測試酬載，如\"1 OR 1=1-\"被廣泛使用，因為它迫使資料庫返回所有行，而不是根據預定的搜尋值過濾出。 這驗證輸入欄位是否被直接縮合為 SQL 命令。 CEH 方法強調從簡單、無損的布林基有效酬載開始，安全地評估弱點，而不會對資料庫造成傷害或影響伺服器的可用性。 由於目錄可逆行、野蠻和強勢的登入嘗試，以及 XSS 攻擊目標完全不同的弱點，它們不適合確認 SQL 注入。 所選選項與適當的 CEH 測試方法相匹配，用於識別不安全的輸入處理和不當的查詢建構。"},{"n":448,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A security consultant is performing an authorized assessment of a regional healthcare provider's patient portal in Portland, Oregon. During testing, he observes that authenticated users are assigned session identifiers embedded within URL parameters after login. To evaluate the robustness of the session management implementation, he initiates multiple authentication requests in rapid succession using controlled test accounts. He then compares the issued identifiers and notices that although parts of the value remain constant, certain segments change in a predictable progression over time. By analyzing the incremental pattern across a controlled batch of issued identifiers generated within the same time window, he is able to anticipate future valid identifiers without capturing traffic from other users. Which token prediction mechanism best explains the weakness identified in this scenario?","o":["Small Token Space","Timestamp-based Tokens","Sequential Tokens","Weak Random Number Generator (PRNG)"],"a":[2],"e":"正確答案是 C。 序列託肯斯。假設情況是， 工作階段 識別符號中包含恆定部分和其他部分，這些部分在可預見的進展中發生變化。測試者可以透過分析增量模式來預測未來有效的識別符號。這是順序符號生成的決定性特徵。 CEHWeb 應用程式材料將工作階段權杖預測確定為工作階段管理攻擊，用於在可以猜出或推匯出可預見工作階段值時冒充合法使用者。選項 A 是不正確的，因為小的符號空間意味著可能的符號值太少了，使得蠻力猜測變得容易。選項 B 是不正確的，因為基於時間戳的符號主要來自時間值。 情境強調遞增序列，而不是直接的時間戳衍生出。選項 D 是不正確的，因為一個弱的 PRNG 可能會產生可以預測的值，但問題具體描述了一個相繼的圖案。因此，最好的答案是 C。 序列託肯斯。","s":"term"},{"n":449,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester suspects that the web application ' s \" Order History \" page is vulnerable to SQL injection because it displays user orders based on an unprotected user ID parameter in the URL. What is the most appropriate approach to test this?","o":["Inject JavaScript into the URL parameter to test for Cross-Site Scripting (XSS)","Modify the URL parameter to userID=1 OR 1=1 and observe if all orders are displayed","Perform a directory traversal attack to access sensitive system files","Use a brute-force attack on the login form to identify valid user credentials"],"a":[1],"e":"CEHv13 將動態 SQL 查詢中使用的 URL 參數確定為常見的注入點。 當使用者控制的值不經驗證直接傳遞到資料庫查詢時，攻擊者可以操縱查詢邏輯。 將 1OR 1=1 等測試酬載注入使用者 ID 參數是一種標準方法，用以確定應用程式是否將輸入到 SQL 語句。 如果頁面顯示所有使用者命令而不是這隻確認了經認證的使用者的命令，這證實了 SQL 注入.CEH 的教誨，有條件的轉寫是探尋 SQL 弱點的最安全而最可靠的方法之一，特別是在 GET 參數中。 JavaScript 注入(可選 A)測試XSS，而不是 SQLi。 Directory traversal(可選 C)針對檔案系統問題，而不是資料庫邏輯。 Brute-forcing user 認證資訊(可選 D)不測試查詢的消毒。 因此，用 SQL 注入酬載修改使用者 ID 參數是正確的 CEH 對接方法。"},{"n":450,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"A penetration tester is assessing a company ' s HR department for vulnerability to social engineering attacks using knowledge of recruitment and onboarding processes. What is the most effective technique to obtain network access credentials without raising suspicion?","o":["Develop a fake social media profile to connect with HR employees and request sensitive information","Create a convincing fake onboarding portal that mimics the company's internal systems","Send a generic phishing email with a link to a fake HR policy document","Conduct a phone call posing as a new employee to request password resets"],"a":[1],"e":"社交工程針對業務流程的攻擊在模仿合法工作流程時特別有效。 CEH 學習材料強調攻擊者經常會利用信任關係和在人力資源業務方面，登入入口網站受到高度信任，而且經常被希望輸入個人資訊、提交檔案並接收初始網路認證資訊的新僱員存取。透過建立一個與組織內部系統非常相近的假上崗入口網站，攻擊者可以蒐集認證資訊，而不會因為所請求的行動看起來正常和預期而引發懷疑。 這種方法利用了程式上的熟悉性、品牌一致性以及 HR 通訊的隱含權威，使其遠比通用的打字郵件或未經請求的社交媒體資訊更有效。 電話雖然有時有用，但涉及即時互動，增加被偵測的機會，但假的入口網站無縫地融入了現有的流程，使其成為取得網路認證資訊的最有效和最不引人注目的方法。"},{"n":451,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A web app does not limit API request rate in code. What attack is enabled?","o":["XSS","Data scraping","SQLi","CSRF"],"a":[1],"e":"正確答案是 B，因為沒有請求率限制的 API 允許自動化用戶端，bots，或指令碼從應用程式端點反覆請求大量資料。 在CEHWeb 應用程式入侵概念中，web 應用程式透過前端和後端處理向客戶暴露服務，API 常被作為應用程式資料的直接介面。 當不存在速率限制，節流，平分控制，配額執行，或異常偵測時，攻擊者可以列舉記錄，收割使用者設定，擷取產品資料，擷取定價資訊，或按規模颳去敏感的商業資料。 這個弱點不是 XSS，因為沒有描述使用者端-側指令碼注入，不是 SQL 注入，因為沒有惡意的資料庫查詢輸入。 它不是 CSRF，因為攻擊者沒有強迫被害者瀏覽器提交經認證的請求。缺失的控制器專門允許重複自動的 API 存取，使資料颳去最好的答案。 速率限制應該強制伺服器-side，而不僅僅是在使用者端程式碼中。","s":"term"},{"n":452,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"What is GINA?","o":["GUI Installed Network Application CLASS","Gateway Interface Network Application","Graphical Identification and Authentication DLL","Global Internet National Authority (G-USA)"],"a":[2],"e":"正確答案是 C，圖形識別和認證 DLL.GINA(Graphical Index and Authority)是一個微軟 Windows 元件，歷史上負責處理互動式登入函式，包括使用者認證，安全關注序列(如 Ctrl+Alt+Del)，密碼更改，以及使用者工作階段管理。 在 CEH 系統駭客化和密碼攻擊話題中，GINA 經常被討論，因為攻擊者可能試圖替換或修改認證相關元件以捕獲使用者認證資訊。 惡意軟體和認證資訊偷取工具歷史上都針對 GINA 機制來攔截在 Windows 登入過程中輸入的使用者名稱和密碼。理解 GINA在道德駭客化中很重要，因為它說明了當攻擊者在系統上獲得足夠的特權時，認證系統如何被濫用。 這種攻擊與認證資訊被竊取，權限提升被竊取，金鑰被盜取，和持久性技術密切相關。 其他選項不是與微軟認證架構相關的有效安全術語。因此，從 CEH 的角度來看，GINA 指的是由更古老的 Windows 作業系統用來管理互動式認證程序的圖形識別和認證動態連結庫。","s":"term"},{"n":453,"c":"密碼學","ce":"Cryptography","t":"long","q":"A cloud storage provider discovers that an unauthorized party obtained a complete backup of encrypted database files containing archived client communications. The attacker did not compromise the encryption keys, nor is there evidence that any original plaintext records were exposed. A forensic cryptography specialist reviewing the breach considers the possibility that the adversary is attempting to analyze the encrypted data in isolation, searching for statistical irregularities or structural repetition within the encrypted output to infer meaningful information. To properly assess the organization's exposure, the specialist must determine which cryptanalytic approach best matches an attack conducted using only the intercepted encrypted data.","o":["Chosen-Ciphertext Attack","Known-Plaintext Attack","Chosen-Plaintext Attack","Ciphertext-Only Attack"],"a":[3],"e":"正確答案是 D。 密文- Only attack。發生只針對密文的攻擊 當攻擊者只能存取加密資料時，沒有相應的 明文 或選擇 明文/密文對的能力。這與情境完全一致 : 攻擊者加密了資料庫備份 但沒有金鑰 並且沒有已知的明文記錄。 符合 CEH 密碼學材料將密文-只攻擊定義為密碼學攻擊，其中密碼分析師可以存取密文但不能存取相應的明文。 攻擊者試圖從加密輸出中單獨取回明文或推斷出金鑰。選項 A。 Chosen-密文 攻擊是不正確的，因為攻擊者需要選擇密碼並觀察被解密的平話。選項B。 已知-明文 攻擊是不正確的，因為攻擊者既需要明文，也需要明文和明文。對應 密文。選項 C。 Chosen-明文 攻擊是不正確的，因為攻擊者需要能夠選擇平白文字並獲得其密碼。選項 D。 密文- Only Sattack 是正確的，因為攻擊者只擁有加密資料。因此，最好的答案是 D.密文-Only Attack。","s":"term"},{"n":454,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"A zero-day vulnerability is actively exploited in a critical web server, but no vendor patch is available. What should be the FIRST step to manage this risk?","o":["Shut down the server","Apply a virtual patch using a WAF","Perform regular backups and prepare IR plans","Monitor for suspicious activity"],"a":[1],"e":"根據 CEHv13 安全營運與事件回應，零時差的弱點構成最高的業務風險之一，因為開採在官方補救之前就存在，當觀察到主動開採且不存在供應商修補程式時，必須立即實施補償控制。第一個也是最有效的行動是實施虛擬修補程式，一般透過Web 應用程式防火牆(WAF)或入侵防禦系統(IPS)。 CEH v13 定義虛擬修補程式是一種安全措施，在不修改脆弱軟體的情況下阻止網路或應用層的開發嘗試。 這種方法允許各組織在減少曝光的同時保持服務可用性。關閉伺服器(備選 A)可以防止被開採，但引入不可接受的業務干擾，不建議作為第一反應。 備份和事件應對規劃(備選 C)至關重要，但不能積極防止被開採。 被動監測(備選 D)允許攻擊者繼續利用弱點而不受控制。 CEH v13 強調虛擬修補程式是零時差威脅首選反應，特別是在該系統對特派團至關重要，可立即降低風險，同時為供應商修補程式的開發和有控制的部署留出時間。"},{"n":455,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"Scenario: Victim opens the attacker ' s website. Attacker sets up a website containing interesting and attractive content such as \"Do you want to make $1000 in a day?\". Victim clicks the attractive content URL. The attacker creates a transparent iframe in front of the URL that the victim attempts to click. The victim believes he/she is clicking the \"Do you want to make $1000 in a day?\" link, but is actually clicking content or a URL hidden inside the transparent iframe controlled by the attacker. What is the name of the attack mentioned in the scenario?","o":["HTTP Parameter Pollution","Clickjacking Attack","HTML Injection","Session Fixation"],"a":[1],"e":"正確答案是 B， 點擊劫持攻擊。點擊劫持是一種 Web 應用程式攻擊， 攻擊者會欺騙受害者點選一個與受害者在螢幕上所看到的不同的隱藏或變相元素。最常見的技術是將一個透明或無形的 iframe 置於合法外觀內容之上。當被害者點選可見的按鈕，影象，或連結時，點選實際上被指向被攻擊者控制的被隱藏的 iframe。在 CEH Web 應用程式入侵主題中，點擊劫持被認為是使用者介面的補救攻擊，因為它操縱了使用者對網頁的感知。攻擊者使用這一技術迫使使用者執行諸如更改帳戶設定，授權交易，允許網路相機，下載惡意軟體，或者在信任的網站授予權限，而同時又不知道正在採取的行動等出乎意料的行動。HTTP 參數汙染涉及操縱應用程式參數，HTML 注入將惡意 HTML 插入網頁，並工作階段\"修復\"迫使一個使用者使用被預先定義的工作階段識別碼，由於該情境具體描述了一個透明的 iframe 誘騙被害者點選隱藏內容，因此攻擊是\"點擊劫持\"。答案: B QUESTION NO: 25 [惡意軟體威脅]。在透過從多個被保護的系統蒐集資料來識別惡意軟體的防毒軟體中使用了何種偵測技術，而不是在當地分析檔案，而是在供應商的環境下製作的？A. 以高血壓為基礎的 B. 蜜罐 基於 C.基於行為 D. 基於雲答案: D 正確答案是 D。Cloud，因為問題描述了一種防毒架構，其中可疑檔案，後設資料，名聲資訊，和威脅情報從多個被保護的端點蒐集出來，並在供應商的雲基礎設施內進行分析，而不是完全在當地機器上。在 CEH惡意軟體防禦概念中，雲基偵測槓桿可以集中分析引擎，名聲服務，機器學習模型，以及從許多端點蒐集的全球威脅智慧。這種方法可以快速識別新出現的惡意軟體和零時差威脅，因為從一個被保護系統學到的智慧可以立即惠及所有其他被保護系統。基於 Heuristic 的偵測側重於識別出可疑的程式碼特徵和類似惡意軟體的模式。\n\n基於行為的偵測監視一個程式在系統上的行為，例如未經授權的登錄改變，過程注入，或異常的網路活動。蜜罐的解決方案使用誘餌系統來吸引並研究攻擊者。這些都沒有具體描述解除安裝分析到防毒提供者的環境。問題的關鍵短語是惡意軟體分析是在提供者的環境下使用從許多被保護系統所蒐集的資訊來完成的，這是基於雲的惡意軟體偵測的決定性特徵。因此，選項 D 是最準確的符合 CEH 的答案。","s":"term"},{"n":456,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"Why would you consider sending an email to an address that you know does not exist within the company you are performing a Penetration Test for?","o":["To illicit a response back that will reveal information about email servers and how they treat undeliverable mail","To create needless SPAM","To determine who is the holder of the root account","To test for virus protection","To perform a DoS"],"a":[0],"e":"正確答案是 A。在經授權的滲透測試中，寄送郵件至不存在的位址，可能觸發退信或未送達報告。這些回應可能揭露郵件伺服器名稱、IP 位址、SMTP 服務橫幅、內部主機名稱、反垃圾郵件閘道、郵件路由行為，以及組織處理未送達郵件的方式。\n\n這項技術支援 CEH 的偵察與足跡探查階段，讓測試人員在進一步測試前蒐集由外部可取得的資訊；目的不是製造垃圾郵件、識別 root 使用者、直接測試防毒軟體或發動阻斷服務攻擊。因此，A 正確。"},{"n":457,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"mid","q":"A large chemical plant uses operational technology (OT) networks to control its industrial processes. Recently, abnormal behavior is observed from PLCs, suggesting a stealthy compromise via malicious firmware. Which action should the team take FIRST to verify and neutralize the issue?","o":["Immediately isolate suspicious devices","Perform detailed inspections of device software for unauthorized modifications","Implement enhanced IDS rules","Restrict remote administrative access"],"a":[1],"e":"在 CEH v13 Mobile，IoT，和 OT Hacking 中，韌體級攻擊可程式設計邏輯控制器(PLCs)被歸類為高影響和隱形威脅，通常是為了躲避傳統。基於網路的防禦。 惡意韌體會損害裝置本身的完整性，允許攻擊者對工業過程進行持續和隱蔽的控制。第一個也是最關鍵的步驟是核查在 PLCs 上執行的韌體和軟體的完整性。 CEH v13 強調，在採取遏制或緩解行動之前，必須準確識別和確認妥協。 韌體檢查使分析人員能夠偵測未經授權的密碼注入、修改邏輯塊、被更改的校驗和、或被篡改的靴子裝載器--如 Stuxnet 式攻擊等 OT 惡意軟體的標記。立即隔離(備選 A)可能以後是必要的，但過早隔離會擾亂工業執行並破壞可變的法證。 IDS 增強(備選 C)專注於流量模式，對韌體-居民惡意軟體無效。 限制遠端存取(備選 D)是預防性的，但不會驗證或去除現有的韌體妥協。 CEH v13 強調 OT 環境需要在裝置層面進行法證驗證，特別是在異常行為出自控制者自身的情況下。 使用供應商批准的工具和雜湊核查的韌體驗證是確認妥協和計劃補救而不危及操作安全是正確的第一步。"},{"n":458,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"An employee finds a USB drive labeled \"Employee Salary Info 2024\" and plugs it into a company computer, causing erratic behavior. What type of social engineering attack is this?","o":["Tempting the victim to engage with a malicious device using curiosity.","Impersonating a senior staff member to extract login credentials.","Using a discarded document to retrieve sensitive information.","Bypassing physical security by following an authorized employee."],"a":[0],"e":"這種情境代表了經典的誘餌攻擊，一種社交工程技術在 CEHv13 社交工程中明確描述。 在誘餌中，攻擊者透過留下惡意的物理裝置--最常見的是 USB 驅動器--來挖掘人類的好奇心或貪婪。 當被害者將裝置插入一個系統時，惡意軟體會被自動執行，從而導致妥協。選項 A 精確地捕捉了這種行為。 標籤\"僱員薪水資訊 2024\"是有意地想誘導被害者與裝置互動。CEH v13 強調 USB 誘餌特別危險，因為它繞過技術控制並完全依賴人類行為。選項 B 描述藉口，這涉及假冒。 選項 C指的是垃圾桶搜尋。 選項 D 描述尾巴，一種物理存取攻擊。 這些都與所描述的 USB-基誘餌沒有匹配。 CEH v13 強調誘餌攻擊在公司環境中非常有效，並推薦強大的安全意識培訓和使 USB 自動執行功能失效作為緩解。"},{"n":459,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"A financial institution in San Francisco suffers a breach where attackers install malware that captures customer account credentials. The stolen data is then sold on underground forums for profit. No political or social statements are made, and the attackers remain anonymous while continuing to target similar organizations for financial gain. Based on this activity, what category of hacker is most likely responsible?","o":["Black Hat hackers","Hacktivists","Script Kiddies","White Hat hackers"],"a":[0],"e":"所描述的攻擊者與黑帽駭客最相符合，因為他們的行為顯然是未經授權的，故意有害的，並且有金錢收益的動機。 他們妥協了金融機構，部署了認證資訊-偷盜惡意軟體，洩露了客戶帳戶資料，然後在地下論壇上出售被竊取的資訊。 這與駭客犯罪行為一致:透過非法市場將取得和被竊資料貨幣化、欺詐和一再以類似受害者為目標。情境明確排除了以意識形態為動機的活動:“沒有發表政治或社會言論 ”。 這使得駭客主義者不太可能參與，因為駭客主義通常涉及政治、社會或意識形態動機，並經常為某種原因(誹謗、洩密、DDoS 抗議)尋求宣傳。 這也排除了道德類別:白帽駭客經授權運作並報告調查結果，以改善安全，而不是偷取和出售認證資訊。 斯克利普特少年一般都是依靠現有工具和指令碼的低技能攻擊者；雖然他們可以造成傷害，但情節凸顯出持續瞄準，認證資訊盜竊，和地下貨幣化--行為與有組織的網路罪犯/black 帽子更緊密地聯絡在一起。黑帽人通常追求的目標有:盜取認證資訊，財務欺詐，勒索軟體部署，以及銷售存取或資料。 他們的行動往往強調匿名性，操作安全，以及在許多類似目標上的重複性 - - 與“繼續以類似組織為目標以取得經濟利益”相一致。因此，最有可能的分類是 A。 Black Hat 駭客。","s":"term"},{"n":460,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"You are a penetration tester hired to evaluate the security posture of a regional manufacturing company's network devices. During your assessment, you discover that one of the core routers allows external administrative access without requiring a password. Additionally, the router communicates with other devices using a protocol that does not provide encryption or validation. Based solely on these observations, which of the following network device vulnerabilities is most clearly present?","o":["Firewall vulnerabilities","Insecure routing protocols","Lack of password protection","Lack of authentication"],"a":[3],"e":"最明顯的弱點是缺乏認證。 在符合 CEH 的網路裝置安全原理中，認證是驗證一個使用者或裝置被允許存取行政功能或參與可信賴的通訊的基本控制。 設想方案說，路由器允許外部行政存取而不需要密碼。 這直接表明沒有為管理存取實施認證，這意味著未經授權的使用者僅透過到達管理介面就有可能獲得行政控制。第二種觀察在不同的上下文中強化了相同的核心弱點:路由器使用既不提供加密又不提供驗證的協定。 在 CEH 的術語中，路由和管理協定中的\"驗證\"通常指認證和完整性檢查，確保更新或通訊。當一個 協定 缺乏驗證時，攻擊者可以根據協定 和地形來注入無賴更新、冒充一個被信任的鄰居、或操縱路由行為。雖然這也可以稱為“不安全的路由協定”，但問題在於，根據兩個觀察結果，最明顯的弱點是什麼。常見的分母是缺乏認證控制:沒有用於管理員存取的密碼，也沒有用於裝置到裝置的協定交換的驗證。\"密碼保護的空白\"只涉及第一個問題，範圍更窄。 \"防火牆弱點\"沒有證據，因此，觀測顯示的最清楚和最全面的弱點是缺乏認證。","s":"term"},{"n":461,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"What is the correct order of the five phases of ethical hacking?","o":["Gaining Access # Maintaining Access # Covering Tracks # Reconnaissance # Scanning","Maintaining Access # Covering Tracks # Reconnaissance # Scanning # Gaining Access","Reconnaissance # Scanning # Gaining Access # Maintaining Access # Covering Tracks","Scanning # Reconnaissance # Gaining Access # Covering Tracks # Maintaining Access"],"a":[2],"e":"CEHv13 定義了道德駭客的五個階段，是一種反映現實世界攻擊進展的結構化方法:偵察 - 資訊蒐集掃描 - 確定現場主機、埠和弱點獲得機會-利用弱點保持准入-確立持久性覆蓋音軌 - 刪除證據選項 C 與這一確切順序相匹配。 CEH v13 強調，理解這一秩序對攻擊者和捍衛者都至關重要，因為它能夠進行系統的測試和有效的緩解戰略。所有其他選項都錯置了階段並和 CEH 方法相矛盾。"},{"n":462,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester suspects that a web application ' s user profile page is vulnerable to SQL injection, as it uses the userID parameter in SQL queries without proper sanitization. Which technique should the tester use to confirm the vulnerability?","o":["Use the userID parameter to perform a brute-force attack on the admin login page","Modify the userID parameter in the URL to ' OR ' 1 ' = ' 1 and check if it returns multiple profiles","Inject HTML code into the userID parameter to test for Cross-Site Scripting (XSS)","Attempt a directory traversal attack using the userID parameter"],"a":[1],"e":"CEH 將 SQL 注入測試描述為 Web 應用程式評估的核心部分。 第一個也是最安全的驗證技術之一，是使用基於同義詞的SQL 注入酬載，如\"OR\" 1\"=\"1。 如果應用程式直接將使用者輸入到 SQL 查詢中，這樣的輸入會導致查詢總是被評價為真實的，往往會返回多個使用者設定等額外記錄。 SQL 注入，但不會造成像丟擲桌子這樣的破壞性效果。 測試 XSS 不驗證SQL 注入，野蠻強制認證資訊是無關的，目錄轉錄攻擊目標檔案路徑操作而非後端查詢。 CEH 強調避免破壞性查詢，並開始非侵入式注入有效酬載顯示輸入消毒不當，使\"OR\"1\"=\"1\"成為確認 URL 參數中 SQL 注入弱點的正確技術。"},{"n":463,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"At a fast-growing startup in Austin, Texas, an ethical hacker is asked to simulate how attackers might gather information to gain initial access. During the assessment, she poses as a recruiter on a professional networking site and convinces several employees to share details about the company's internal software and VPN setup. Which type of threat best represents this adversary's method of information gathering?","o":["System and Network Attacks","Social Engineering","Information Leakage","Corporate Espionage"],"a":[1],"e":"正確答案是 B.社交工程，因為攻擊者的主要方法是操縱人--在符合 CEH 的安全概念中，社交工程的定義是使用欺騙、冒用和心理影響來說服受害者透露敏感資訊、採取行動或繞過正常的安全程式。 這裡，一個專業網路網站上的道德駭客“作為招募者”是典型的冒名頂替/藉口方法。 目的是建立信譽和信任，讓員工自願披露不應對外分享的內部細節。所蒐集的資訊--\"內部軟體和 VPN 設定\"--正是在偵察和攻擊前規劃期間所尋求的情報攻擊者的型別。 VPN 的細節，遠端存取工作流程，認證方法和內部工具可以用來製作非常令人信服的打字資訊，識別薄弱點。在真正的入侵中，這種由社交工程驅動的情報蒐集往往在認證資訊收割、密碼噴灑、MFA 疲勞嘗試或定製的惡意軟體傳送之前進行。為什麼其他選項不太正確: 系統與網路攻擊是指直接的技術開發，如掃描，嗅探，或者攻擊服務和協定； 情境沒有包含任何技術開發。 資訊外洩描述了敏感資料被曝光的條件(例如公共檔案，設定錯誤的暫存器，出錯訊息)，但情節側重於主動人際操縱以擷取資訊。 公司間諜是描述竊取商業秘密的更寬泛的動機/category，經常被競爭者或民族國家行為者所為；而社交工程可以被用於間諜活動，而問題在於蒐集資訊的方法，這顯然是社交工程。因此，所顯示的威脅方法為社交工程(透過招募者個人 a 預寫/impersonation)。","s":"term"},{"n":464,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"A digital media company in Seattle, Washington deploys an Nginx-based infrastructure to support its internal analytics dashboard and content publishing portal. During an authorized red team engagement, a tester evaluates the web-based administrative interface used to upload configuration bundles and manage application components. While analyzing a file-upload feature, the tester observes that certain user-supplied parameters submitted with uploaded content are incorporated into backend processing routines with limited validation. By adjusting specific values in the request, he alters how the server-side component interprets those inputs. Subsequent log analysis shows that the modified input affected system-level operations executed under the web service context, despite no direct shell access being obtained. Which Nginx-related vulnerability best describes the weakness identified in this scenario?","o":["Improper certificate validation","NULL pointer dereference in HTTP/3","OS command injection in nginxWebUI","Server-side request forgery (SSRF) vulnerability"],"a":[2],"e":"正確的選擇是在 nginxWebUI 中 OS 命令注入，因為問題描述了不可信輸入以影響系統級操作的方式傳遞到後端處理。CEH web 應用程式材質將指令注入歸類為在弱勢應用程式允許由攻擊者控制的輸入被作業系統或 shell 環境解釋時發生的注入缺陷。 關鍵線索是測試者操縱了與上傳內容相關的參數，而那些被改變的值會影響在伺服器-side 網路服務上執行的命令。 命令注入的標誌是 SSRF，它涉及伺服器提出意想不到的外出請求，或憑證驗證問題，它們與 TLS 信任決定有關。沒有直接 shell 存取的提法也與命令注入一致，因為如果惡意輸入仍然可以改變的話，攻擊者不需要互動式 shell CEH 指導反覆強調，當使用者控制的值到達後端直譯器而無需嚴格消毒，參數控制，或允許清單驗證時，Web 應用程式中未經驗證的輸入會導致注入攻擊，包括指令注入。","s":"term"},{"n":465,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"While simulating a reconnaissance phase against a cloud-hosted retail application, your team attempts to gather DNS records to map the infrastructure. You avoid brute-forcing subdomains and instead aim to collect specific details such as the domain's mail server, authoritative name servers, and potential administrative information like serial number and refresh interval. Given these goals, which DNS record type should you query to extract both administrative and technical metadata about the target zone?","o":["MX","SOA","TXT","NS"],"a":[1],"e":"正確的選擇是 SOA 記錄，因為它獨有地提供了關於 DNS 區的權威性行政和操作後設資料。 在 CEH 偵察技術中，DNS列舉是一種高值被動和半被動的方法，可以學習一個組織的基礎設施，而不積極攻擊主機。 權威開始記錄定義了該區的核心參數並確定了該域的主要權威名稱伺服器。 最重要的是，SOA 記錄包含直接匹配\"序號和重新整理間隔\"的欄位，這些欄位是經典的 SOA 元素，用於在主伺服器和二級 DNS 伺服器之間進行區複製和同步行為。 SOA 記錄通常包括主名伺服器，負責方欄位通常格式化為區管理員的電子郵件位址，區序號，以及重新整理，重試，過期等計時值和最小值 TTL 等。這些細節可以揭示變化頻率，操作慣例，有時還有行政聯絡線索，這些都與偵察和報告相關。其他記錄型別不符合要求。MX 記錄為域識別郵件交換器，但不包括序列或重新整理參數。 NS 記錄列出權威名稱伺服器，但缺乏行政性。 timing metater。 TXT 記錄儲存任意文字，如 SPF，DKIM，DMARC 等，或校驗字串，對電子郵件安全態勢分析有用，但它們並不提供區域控制欄位的提問引用。由於問題明確撥出序列和重新整理間隔，SOA 記錄是唯一完全匹配的選項。","s":"term"},{"n":466,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"A Linux system allows passwordless sudo for multiple commands. What security principle is violated?","o":["Zero trust","Defense in depth","CIA","Least privilege"],"a":[3],"e":"正確答案是 D， L 最少特權。 在 Linux 中， sudo 暫時授予了 gala/root-level 權限來執行行政命令。 CEH 最小特權的匹配原則要求使用者， 服務和程序只獲得執行授權任務所需的最小權限。 允許多個命令的密碼無 sudo 會削弱這個控制，因為正常使用者可以執行特權動作而無需再校正，增加了意外被濫用，內幕被濫用，認證資訊折中，或權限提升。 CEH 材料強調最小特權作為授權控制，並也注意到 sudo 提供臨時根權限。 零信任範圍更廣，注重持續核查，深度防禦採用分層控制，CIA 指保密，完整性，並可用性。 這裡的 設定錯誤 是過多的特權指派， 所以被違反的安全原則是最不特殊的特權。安全設定應該嚴格限定只給需要的命令和使用者的 sudo 權限， 酌情要求認證， 以及 日誌 特權行動。","s":"term"},{"n":467,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"On July 25, 2025, during a security assessment at Apex Technologies in Boston, Massachusetts, ethical hacker Sophia Patel conducts a penetration test to evaluate the company's defenses against a simulated DDoS attack targeting their e-commerce platform. The simulated attack floods the platform with traffic from multiple sources, attempting to overwhelm server resources. The IT team activates a specific tool that successfully mitigates this attack by distributing traffic across multiple servers and filtering malicious requests. Sophia's test aims to verify the effectiveness of this tool in maintaining service availability. Which DoS DDoS protection tool is most likely being utilized by the IT team in this scenario?","o":["Web Application Firewall WAF","Load Balancer","Intrusion Prevention System IPS","Firewall"],"a":[1],"e":"負載平衡器是最佳匹配器， 因為所描述的關鍵緩解行為是將進入的流量分佈到多個伺服器上， 以防止任何單個系統被覆蓋。 在 CEH 覆蓋中可用性攻擊，最實用的建築防禦手段之一，就是橫向地擴大並給伺服器池放上一個負載平衡層。這樣組織就可以透過將連線和請求分散到多個後端節點，提高復原力並保持執行時間來吸收懸索。情境中也提到了過濾惡意請求。 現代負載平衡器通常提供健康檢查，速率限制，連線限制，以及與存取控制規則的整合，它們常被和 DDoS 擦洗或邊緣保護一起部署。 即使透過綜合安全政策或上游服務來實施過濾邏輯，即時的決定性特徵是多個伺服器之間的流量分佈，這是負載平衡的主要功能，也是常見的 CEH-引用的用於體積攻擊的緩解策略。一個 Web 應用程式防火牆專注於檢查並遮蔽惡意的 HTTP 和應用程式層的有效酬載，如注入，請求異常，以及已知的攻擊模式等，但它並不主要負責在多伺服器間分配流量。 一個 IPS 可以遮蔽可疑模式並利用嘗試，然而。它通常不提供所描述的核心流量分配功能。傳統的防火牆執行網路級別規則，並可能有助於限制費率，但它在本質上並不平衡伺服器農場的流量。因此，這裡最可能使用的工具是負載平衡器。","s":"term"},{"n":468,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"long","q":"MidWest BioAnalytics, a pharmaceutical research firm in Columbus, Ohio, authorizes a controlled adversarial simulation to assess the resilience of its internal web-based inventory management platform. During the exercise, administrators observe that several active client connections briefly lose synchronization, and unexpected command patterns appear within system transaction logs. The irregularities are subtle and become apparent only after reviewing stored network captures. Executive leadership requests a solution that can maintain ongoing visibility into network exchanges and highlight activity that diverges from typical communication behavior across the organization's infrastructure. Which approach best satisfies this requirement?","o":["Perform manual packet inspection using a protocol analyzer","Monitor for abnormal surges of repeated ACK responses","Use an Intrusion Detection System (IDS)","Evaluate authentication token generation patterns"],"a":[2],"e":"正確答案是 C。 使用 入侵偵測系統 (IDS)。 組織需要連續的能見度， 用於網路交換和偵測偏離正常行為的活動。 這就是入侵偵測系統。 符合 CEHIDS 材料的目的， 解釋網路上的 IDS 監視器封包， 並試圖發現攻擊者是否試圖闖入系統或引起阻斷服務攻擊。 另一種 CEH 參考稱，一個 IDS 可以聽並監視網路流量，分析封包，搜尋入侵模式，在發現異常或可疑流量時提醒管理員。 IDS 解決方案可能使用簽名和異常偵測，異常偵測識別出與既定基線不同的行為。 選項 A。 使用協定分析器的手動封包檢查對調查有用，但不能提供可伸縮的持續監測和警報。選項 D。 評估認證符生成模式對工作階段管理測試有用，但不能提供連續的全網路可見度。選項 C。 使用入侵偵測系統(IDS)是正確的，因為它提供了連續的封包監測、可疑行為偵測和提醒。因此，最好的答案是 C。 使用入侵偵測系統(IDS)。"},{"n":469,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"During an authorized engagement at IronClad Financial Services in Charlotte, the red team successfully exploits a weakness and obtains administrative access to a critical server. After achieving this objective, the team installs a backdoor mechanism to ensure continued access even if the original vulnerability is remediated. The team documents this activity as part of demonstrating long-term adversary behavior within the approved scope. Within the CEH ethical hacking framework, which phase does this activity represent?","o":["Reconnaissance","Vulnerability Scanning","Maintaining Access","Clearing Tracks"],"a":[2],"e":"正確答案是 C。 維持存取。紅色小組已經獲得了行政准入。 在最初的弱點得到補救後安裝後門以保持持續准入，代表了維持准入階段。 CEH 方法確定了五個駭客階段:偵察、掃描、取得存取、維持存取和清空追蹤。它解釋說，維持存取是攻擊者試圖保持對已受損系統的所有權和控制的階段，通常使用後門、rootkits 或特洛伊來保留存取。 另一個 EC- Council-access 的參考文獻指出，維持存取是指保留系統的所有權，並確保繼續使用後門、rootkits、特洛伊斯或木馬程式馬後門。選項 A.偵察是不正確的，因為偵察發生在被開採之前，並側重於蒐集資訊。備選辦法 B。 掃描是不正確的，因為掃描發現弱點，但不涉及安裝持久性。選項 D。 清除軌跡是不正確的，因為清除軌跡涉及隱藏證據、更改日誌或避免被探測。選項 C。 保持存取是正確的，因為後門是安裝的，以維護長期存取。因此，最好的答案是 C。 保持存取。","s":"term"},{"n":470,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"As part of a red team campaign against a pharmaceutical company in Boston, ethical hacker Alex begins with a successful spear-phishing attack that delivers an initial payload to a manager ' s laptop. After gaining access, Alex pivots to harvesting cached credentials and using them to move laterally across the internal network. Soon, routers, printers, and several file servers are compromised, expanding the red team ' s control beyond the original host. At this point, Alex has not yet targeted sensitive research data, but the team has built a broader foothold within the environment. Which phase of the Advanced Persistent Threat (APT) lifecycle is Alex simulating?","o":["Initial Intrusion","Persistence","Search & Exfiltration","Expansion"],"a":[3],"e":"正確答案是 D.擴充套件，因為情境強調，在最初立足點之後，攻擊者收穫了認證資訊並橫向移動，以損害額外的系統--路由器、印表機和檔案伺服器--從而擴大對內部環境的控制。 在 CEH-對齊 APT 生命週期描述中， 這個階段通常與內部偵察有關， 特權/認證資訊存取， 橫向移動， 擴大立足點，以提高復原力 攻擊者不再侷限於原先被破壞的端點； 換成是 正在故意向其他網路資產擴散，以建立業務優勢。提示中的序列很重要。 初始入侵(A)已經透過長矛噴射方式將首個酬載送入了管理器的膝上型電腦。 問題在於，在獲得存取權後，攻擊者正在積極透過網路移動，此時正在模擬哪個階段。 持久性(B)是指建立機制來維持存取(例如後門，預定任務，服務，在認證資訊/帳戶中的持久性)，這樣攻擊者就可以活下來回波，密碼變化，或清理嘗試。 雖然攻擊者可能在擴張期間建立持久性，但這裡的界定行動是橫向移動並妥協多個內部系統，這比持久性更直接地擴張。搜尋和過濾(C)將涉及識別和蒐集目標資料(在此情況下是敏感的研究資料)並將其轉移出環境。提示中明確指出，Alex 還沒有針對敏感的研究資料，這就排除了搜尋和/exfiltration 相作為當前模擬的主要活動。因此，APT 生命週期最佳匹配認證資訊收割的相繼相繼相繼的相繼相向移動並折中了多個內部裝置/servers 來建立更廣闊的立足點是\"擴張\"。","s":"term"},{"n":471,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and loT Hacking","t":"mid","q":"At a smart retail outlet in San Diego, California, ethical hacker Sophia Bennett assesses IoT-based inventory sensors that synchronize with a cloud dashboard. She discovers that sensitive business records are sent across the network without encryption and are also stored in a retrievable format on the provider ' s cloud platform. Which IoT attack surface area is most directly demonstrated in this finding?","o":["Insecure ecosystem interfaces","Insecure data transfer and storage","Insecure network services","Insecure default settings"],"a":[1],"e":"發現最直接顯示資料傳輸和儲存不安全。 設想包括兩個明確的問題:(1)敏感的商業記錄被傳送\"跨網路，沒有加密\"，(2)同樣的記錄被雲平台\"以可擷取格式儲存\"，這兩個條件的對映正好與傳輸中的資料和儲存中的資料的弱點相接。 當 IoT 裝置在沒有加密的情況下傳輸敏感資料(如平原 HTTP，無保護的 MQTT，不安全的專有協定)時，獲得網路能見度的攻擊者可以擷取，讀取，並可能修改這些資料。 同樣地，當雲端儲存資料儲存在易於擷取或保護不當的形式(例如存取控制薄弱，休息時缺乏加密，過度放任的儲存桶，被曝光的 API)時，攻擊者可以在傳輸後很長一段時間記憶體取商業記錄。在 IoT 生態系統中，資料通常從感測器流向閘道器，再流向雲儀表板和分析服務。 如果加密和強存取控制不能一致地應用於這些跳動中，那麼機密性和完整性就面臨風險。 這可能導致競爭傷害(暴露在庫存中)，隱私影響(如果包括客戶資料的話)，以及操作中斷(有標記的記錄導致錯誤的決定)。 設想方案不是關於像 Telnet/FTP(網路服務)這樣的 IoT 裝置曝光服務， 也不涉及預設密碼； 具體涉及資料如何傳輸 並儲存起來。為什麼其他選項不準確:不安全的生態系統介面(A)側重於 API，web/mobile 應用和雲介面；雖然雲端儲存存取可能涉及介面，但描述的核心弱點是缺少加密和可擷取儲存，這更直接是資料傳輸/storage 類別。不可靠的網路服務(C)指 IoT 裝置上被曝光的服務/ports，而不是跨管的資料保密。不安全預設設定(D)涉及工廠預設(密碼，開放埠，不安全的設定)，並非具體為未加密的運輸以及儲存保護薄弱。因此，正確答案是 B。 資料傳輸和儲存不安全。","s":"term"},{"n":472,"c":"密碼學","ce":"Cryptography","t":"mid","q":"While evaluating a smart card implementation, a security analyst observes that an attacker is measuring fluctuations in power consumption and timing variations during encryption operations on the chip. The attacker uses this information to infer secret keys used within the device. What type of exploitation is being carried out?","o":["Disrupt control flow to modify instructions","Observe hardware signals to deduce secrets","Crack hashes using statistical collisions","Force session resets through input flooding"],"a":[1],"e":"CEH v13 解釋道，Side-Channel 攻擊利用密碼裝置的物理特性--如功率消耗、計時變化、電磁洩漏或聲學排放--推斷出像加密鍵這樣的機密資料。 這些攻擊並不破壞密碼演算法本身，而是分析計算過程中產生的出乎意料的訊號。 該情境描述了經典的功率分析和計時分析攻擊，攻擊者在智慧卡上監視加密操作期間的波動。 CEH 詳細介紹了區別功率分析(DPA)和簡單功率分析(SPA)如何允許攻擊者透過統計上將測量到的功率追蹤相接來擷擷取金鑰來進行加密操作。 這類攻擊是極其危險的，因為它繞過數學強度並瞄準硬體執行缺陷。 選項 A，C，和 D 並不涉及側道開發。 CEH 特別將這種方法歸類為觀察硬體排放來推斷出秘密，使選項 B 成為最準確的匹配。"},{"n":473,"c":"社交工程","ce":"Social Engineering","t":"long","q":"An energy infrastructure company in Tulsa, Oklahoma initiated a controlled phishing simulation targeting multiple operational departments. The test email claimed to originate from the corporate compliance office and instructed employees to \"complete a mandatory regulatory update within the next 30 minutes to avoid account suspension.\" The message used a broad salutation instead of employee names and lacked the standard corporate signature footer normally appended to official communications. Additionally, security analysts observed that the embedded hyperlink displayed the organization ' s domain in the message body; however, when examined more closely, the actual destination resolved to a shortened external URL redirecting to an unrelated host. From a defensive analysis standpoint, which indicator provides the strongest technical validation that the message is malicious?","o":["Identification of Hover Mismatch URLs in the embedded link","Absence of a formal corporate signature","Use of generic greetings rather than individualized addressing","Presence of aggressive urgency language"],"a":[0],"e":"最強的技術指標是懸浮不匹配的 URL。 CEH 社交工程和電子郵件-filshing 指導將欺騙性連結視為最清晰的驗證點之一，因為向使用者顯示的可見文字可以讓人看起來值得信賴，而實際超連結目標則導致完全不同的地方。 在這個情境下，電子郵件模仿了內部合規通知，並使用了緊急性、通用問候和缺失的企業簽名，所有簽名都是可疑的。 但是，這些訊號仍然是背景和行為性的。技術上最可靠的證據是顯示的組織域與真實目的地不符，透過縮短外部 URL 到不相干的主機.CEH 材料解決，一致地解釋說，打字訊息經常透過變相連結將受害者改用假登入頁面或惡意站點，驗證真實目的地是核心防禦步驟。這比基於風格的線索更具有結論性，因為光是打出烙印錯誤或問候在合法通訊中可能有所不同。 顯示與實際的 URL 之間的不匹配直接顯示出了在資訊建構中的故意欺騙，使其成為資訊惡意的最佳技術驗證。"},{"n":474,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"During a security assessment of a fintech startup in San Francisco, ethical hacker Michael analyzes the company ' s cloud platform. He observes that the system automates deployment, scaling, service discovery, and workload management across multiple nodes, ensuring smooth operation of critical services without requiring manual coordination. Which Kubernetes capability is primarily responsible for these functions?","o":["Kube-controller-manager","Self-healing","Container orchestration","Container vulnerabilities"],"a":[2],"e":"正確答案是集裝箱管絃樂，因為所描述的特徵--自動部署、規模化、服務發現和跨多個節點的工作量管理--是集裝箱管絃樂平台的界定功能，而 Kubernetes 是集裝箱最廣泛使用的管絃樂系統。 在符合 CEH 雲和集裝箱安全討論中，管絃法是指自動協調集裝箱化的工作量，這樣應用程式就可以繼續可用、可擴充套件和可管理，而無需管理員手動放置或維護每個集裝箱例項。在 Kubernetes 中，管絃樂是透過控制平面和一組持續保持所期望的應用狀態的元件來實現的。 例如，根據資源可用性和制約因素，將吊艙放置在節點上；控制器確保正確的複製件數量在執行；服務和 DNS 能夠實現穩定的命名和服務發現；以及自動縮放機制根據需求。這些綜合行為使得平台能夠保持關鍵服務“平穩”執行，即使節點改變、工作量轉移或故障發生。為什麼其他選項不是最佳匹配:自愈是管絃樂的一個特殊好處(Kubernetes 重啟失敗的容器，重新安排吊艙，並替換不健康的情況)，但並不完全包含 Kube-control-manager 是一個特定的 Kubernetes 控制平面元件，它執行控制程式；它有助於內部的管絃，但問題在於負責這套功能的總體能力，即整個容器管絃。 集裝箱的弱點不是庫伯涅斯能力，而是安全風險類別(例如:脆弱影象、錯位、執行時間利用等)。因此，庫貝內茲自動部署、規模化、服務發現和多節點工作量管理的主要負責能力是集裝箱管絃。","s":"term"},{"n":475,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"A penetration tester is assessing an organization ' s cloud infrastructure and discovers misconfigured IAM policies on storage buckets. The IAM settings grant read and write permissions to any authenticated user. What is the most effective way to exploit this misconfiguration?","o":["Use leaked API keys to access the cloud storage buckets and exfiltrate data","Execute a SQL injection attack on the organization ' s website to retrieve sensitive information","Create a personal cloud account to authenticate and access the misconfigured storage buckets","Perform a Cross-Site Scripting (XSS) attack on the cloud management portal to gain access"],"a":[2],"e":"CEH 指出，雲 IAM 錯位可以無意中給予廣泛的存取權。 如果任何經認證的雲帳戶被允許讀取/write 存取，攻擊者可以簡單地用自己的雲身分進行認證，並直接與被錯誤設定的儲存桶進行互動，使資料能夠被過濾或被操縱。"},{"n":476,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"A penetration tester needs to map open ports on a target network without triggering the organization's intrusion detection systems (IDS), which are configured to detect standard scanning patterns and abnormal traffic volumes. To achieve this, the tester decides to use a method that leverages a third-party host to obscure the origin of the scan. Which scanning technique should be employed to accomplish this stealthily?","o":["Conduct a TCP FIN scan with randomized port sequences","Perform a TCP SYN scan using slow-timing options","Execute a UDP scan with packet fragmentation","Use an Idle scan by exploiting a \" zombie \" host"],"a":[3],"e":"CEH v13 將 Idle 掃描器識別為最隱蔽和最先進的偵察技術，因為它能夠避免直接生成攻擊者與目標之間的任何流量。 使用\"zombie 主機\"，具有可預見 IPID 序列，攻擊者會偽造封包，使所有掃描流量看起來都出自殭屍。 IDS 只看到殭屍與目標之間的通訊，而不是攻擊者。 這允許逃避網路監測工具，流量關聯絡統，和入侵偵測簽名。 CEH 強調 Idle Scanning是繞過尖端偵測控制的核心技術，因為它沒有留下攻擊者的直接指紋。 選項 A 和 B 仍然起源於攻擊者的 IP。 選項 C 可以避開一些過濾器，但由於封包的異常而仍然可以被偵測出。 只有 Idle Scanning 提供完全的起源模糊，使其成為 Seftth連接埠列舉最合適的方法。"},{"n":477,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"Amid the vibrant buzz of Miami's digital scene, ethical hacker Sofia Alvarez embarks on a mission to fortify the web server of Sunshine Media's streaming platform. Diving into her security assessment, Sofia sends a meticulously crafted GET / HTTP/1.0 request to the server, scrutinizing its response. The server obligingly returns headers exposing its software version and operating system, a revelation that could empower malicious actors to tailor their attacks. Committed to bolstering the platform's defenses, Sofia documents her findings to urge the security team to address this exposure. What approach is Sofia using to expose the vulnerability in Sunshine Media's web server?","o":["Information Gathering from Robots.txt File","Vulnerability Scanning","Directory Brute Forcing","Web Server Footprinting Banner Grabbing"],"a":[3],"e":"描述的動作是經典的 web 伺服器透過搶取橫幅來進行足跡。 在 CEH 偵察方法中，搶取橫幅用於透過引出和分析標準協定的回應來識別目標服務細節。 當索菲亞發出一個簡單的 HTTP 請求，如 GET/HTTP/1.0 等時，伺服器經常用 HTTP 頭進行回應，可能包括伺服器等欄位，有時還包括 X-Powered-By，可以揭示出網路伺服器產品和版本，偶爾還有暗示基礎作業系統或框架的資訊。 這種披露對攻擊者很有價值，因為它使目標明確的弱點利用成為可能:一旦確切的伺服器和版本被知道，攻擊者就可以將這些資訊與已知的弱點、錯位和被利用的程式碼聯絡起來。這不是從機器人.txt 蒐集資訊，這是一個用於建議爬行者行為並有時揭示隱藏路徑的網路檔案，但本質上並不暴露出伺服器軟體版本。它也不是目錄野蠻的強迫，這涉及系統地猜測目錄和檔案以找到隱藏的端點。弱點掃描範圍更廣，通常涉及自動檢查以發現弱點；同時橫幅資訊可以是掃描的輸入，這裡顯示的技術是透過回應頭識別。 符合 CEH 的緩解包括使伺服器簽名資訊失效或被最小化，去掉不必要的頭，保持伺服器軟體修補程式，並使用安全設定和倒置代用來減少偵察期間的資訊洩漏。","s":"term"},{"n":478,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"In a vertical privilege escalation scenario, the attacker attempts to gain access to a user account with higher privileges than their current level. Which of the following examples describes vertical privilege escalation?","o":["An attacker exploits weak access controls to access and steal sensitive information from another user ' s account with alike privileges.","An attacker leverages a lack of session management controls to switch accounts and access resources assigned to another user with the same permissions.","An attacker uses an unquoted service path vulnerability to gain unauthorized access to another user ' s data with equivalent privileges.","An attacker escalates from a regular user to an administrator by exploiting administrative functions."],"a":[3],"e":"CEH v13 區分了垂直和水平的權限提升。 當攻擊者透過利用弱點、錯誤設定或不安全的特權界限，在特權等級上向上移動時，縱向升級發生--例如從正常使用者向管理員或根移動。 這使得攻擊者可以執行之前限制的任務，比如修改系統設定，存取敏感資料，安裝惡意軟體，或者控制整個環境。 另一方面，水平升級涉及到在同一特權級別上存取另一個使用者的資源，其他選項對此有描述。 利用未引用的服務路徑或薄弱的存取控制可能會助長特權濫用，但除非它們具體導致行政執行，否則它們不會從本質上將使用者提升到更高的特權級別。 完全符合 CEH 定義的垂直權限提升的情境是從常規使用者升級到管理員。"},{"n":479,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A payload drops a database table by injecting ; DROP TABLE users; --. What SQL injection method was used?","o":["Piggybacked queries","UNION-based SQL injection","Boolean-based SQL injection","Error-based SQL injection"],"a":[0],"e":"這次攻擊是小豬背 SQL 注入的經典例子，被覆蓋在 CEH v13 Web 應用程式入侵。 小豬背查詢允許攻擊者將額外的惡意的 SQL 命令附加到使用分號等分號的已存在的查詢中。酬載執行最初的查詢，然後是破壞性命令(DROPTABLE)。UNION-基於注入的擷取資料，基於布林的注入推斷邏輯，基於錯誤的注入依賴於錯誤訊息--而不是破壞性執行。 CEH v13 明確描述豬籠草的查詢能夠被資料銷燬和權限提升，使\"選項 A\"正確。","s":"term"},{"n":480,"c":"行動平台、IoT 與 OT 攻擊","ce":"Mobile Platform, IoT, and OT Hacking","t":"short","q":"Fleet vehicles with smart locking systems were compromised after attackers captured unique signals from key fobs. What should the security team prioritize to confirm and prevent this attack?","o":["Secure firmware updates","Increase physical surveillance","Deploy anti-malware on smartphones","Monitor wireless signals for jamming or interference"],"a":[3],"e":"此情境與基於 RF-的智慧金鑰系統的回放攻擊對齊，覆蓋在 CEH v13 IoT 和 OT Hacking 中。 攻擊者捕捉由金鑰發回的射頻訊號並重放以解鎖車輛。 CEH v13 強調，偵測和防止此類攻擊需要監測無線 RF 訊號，以監測訊號回放，干擾等異常情況，或干擾模式。 RF 分析有助於確認未經授權的訊號捕捉和再傳輸。韌體更新可以減輕未來的弱點，但確認需要 RF監測。 物理監視和智慧手機惡意軟體控制與 RF 重播攻擊無關，因此，選項 D 是正確的。"},{"n":481,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"A technology consulting firm in Portland, Oregon began experiencing repeated topology recalculations across its switching infrastructure. Shortly after a newly connected device came online in a conference room, spanning-tree convergence events were triggered across multiple distribution switches. Engineers determined that the access-layer interface connected to that device was influencing path-selection decisions, introducing a more favorable bridge priority value into the environment and affecting the established hierarchy. To preserve the intended switching structure and prevent unauthorized devices from altering root selection decisions, which control should be employed?","o":["Configuring Loop Guard on non-designated ports","Activating UDLD (Unidirectional Link Detection) on uplinks","Applying Root Guard on designated interfaces","Enabling BPDU Guard on edge ports"],"a":[3],"e":"最好的答案是邊緣埠的 BPDU Guard。 CEH 網路防禦材料解釋道:BPDU Guard 用於期望終端使用者裝置的出入口或邊緣埠，而不是交換器。 如果連線到這樣的連接埠的裝置開始傳送 Bridge 協定資料單位，交換器將它視為異常條件，可以關閉連接埠或將其置於出錯狀態。 這可以防止未經授權或設定錯誤的裝置參與橫跨樹木並影響根橋選舉或地貌決定。 這與情境相符，即新連線的裝置引入了更有利的橋樑優先順序，並觸發了橫跨樹木的重新計算。 Root Guard 也與保護橫跨樹木的等級制度有關，但通常在您想要防止下游的交換器成為根而同時仍然允許 BPDU 在受控條件下參與的情況下被應用。CEH 考試框架通常預計 BPDU Guard，當威脅來自一個端-主機-facing 存取連接埠在會議室或辦公邊緣位置。 由於目標是阻止未經授權的邊緣連線裝置影響橫跨樹木，因此在邊緣埠使 BPDUGuard 成為最適當的控制手段。"},{"n":482,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"A penetration tester observes that traceroutes to various internal devices always show 10.10.10.1 as the second-to-last hop, regardless of the destination subnet. What does this pattern most likely indicate?","o":["DNS poisoning at the local resolver used by the compromised host","Loopback misconfiguration at the destination endpoints","A core router facilitating communication across multiple internal subnets","Presence of a transparent proxy device acting as a forwarder"],"a":[2],"e":"CEH v13 強調內部偵察期間路線追蹤對於識別關鍵基礎設施裝置的重要性，如分佈交換器，防火牆，和核心路由器等。當單個 IP 位址一直作為倒數第二跳出多條網路路徑時，這通常表明該裝置充當了核心路由器，負責跨 VLAN 或子網的路由。 Core 路由器聚合。 CEH 強調識別核心基礎設施，因為損害這些裝置為攻擊者提供了顯著的能見度和對全網路通訊的潛在控制。 DNS 毒化將影響名稱解析，而不是跳動模式。迴圈設定錯誤將影響單一主機，而不是多個分機。 透明代用將只出現在透過應用層檢查而不是所有追蹤路徑測試的流量線路上。 子網之間的一致性強烈地指向一個集中的路由裝置。"},{"n":483,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"A penetration tester targets a WPA2-PSK wireless network. The tester captures the handshake and wants to speed up cracking the pre-shared key. Which approach is most effective?","o":["Conduct a Cross-Site Scripting (XSS) attack on the router ' s login page","Use a brute-force attack to crack the pre-shared key manually","Use a dictionary attack with a large wordlist to crack the WPA2 key","Perform a SQL injection attack to bypass the WPA2 authentication"],"a":[2],"e":"CEH v13 解釋說，WPA2-PSK 安全依賴於預共享金鑰的強度。 4 向握手後，攻擊者必須嘗試離線破解。 CEH 強調字典攻擊是最高效和最常用的破解方法，因為它測試結構化的字詞清單，人源密碼，和雜交相通，與全野蠻力相比，時間被大幅縮短。 Brute force (選項 B)在計算上很重，除非密碼極短。 XSS(選項 A)和 SQL 注入(選項 D)與 WPA2 認證無關，發生在無線協定級別，而不是路由器的網路介面。 字典攻擊在 CEH 中被突出顯示為主要技術，它與空氣裂縫-ng，雜湊克特，和活字等工具相配合，可以使用最最佳化的 GPU 或 CPU 裂縫進行快速金鑰測試。 因此，選項 C 是最有效的和符合CEH 的方法。"},{"n":484,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"long","q":"A cybersecurity team at a regional healthcare provider is conducting an internal red team exercise to assess their exposure to service enumeration attacks. Amanda, a senior penetration tester, is assigned to probe the internal network for services that may reveal usernames, group information, or system details without requiring prior authentication. She decides to target common services running on specific ports that are often misconfigured or loosely monitored. During her reconnaissance, Amanda identifies several open ports across various hosts and must now prioritize which ones to probe first for maximum information gain related to enumeration. Which of the following services should Amanda target as a priority to enumerate usernames and group information without authentication?","o":["TCP 139 and UDP 137, 138","TCP 21 and UDP 137, 138","TCP 23 and UDP 137, 138","TCP 25 and UDP 133"],"a":[0],"e":"TCP139。 和 UDP137 雙倍徑 138 與 Windows 檔案密切相關的 NetBIOS 相對應 TCP/IP 服務 和印表機共享 和遺留的SMB 瀏覽。這些埠是高值的列舉目標 因為 NetBIOS 名稱服務 和資料 gram 服務可以披露主機名稱， 網域名稱 或工作組名稱， 登入使用者， 和共享資源細節， 經常在任何強烈的認證發生之前。 UDP137 用於 NetBIOS 名稱服務，它支援名稱註冊和查詢。 UDP138 支援 NetBIOS 資料 gram Service，通常與瀏覽和公告流量繫結。 TCP139 支援 NetBIOS 工作階段服務，歷史上用於為 SMB 流量建立工作階段，並在設定薄弱時查詢共享和使用者相關資訊。在真實環境中，諸如允許共享設定、遺產協定或匿名和客源存取等設定不當，可以讓攻擊者透過瀏覽資料、共享清單和經常伴有 SMB 的 RPC-相關曝光間接地列出使用者帳戶、群體和政策。 CEH 培訓強調將列舉與 Windows 網路服務進行優先排序，因為所獲得的資訊能夠迅速支援後續攻擊，如密碼噴灑，定向噴網，平向運動，和權限提升規劃等。其他選擇包括 TCP21FTP，TCP23 Telnet，和 TCP25SMTP，它們可能暴露出旗標或者允許特定設定中有限的使用者列舉，但它們不是經典Windows 使用者的主要埠，並且與 group 列舉.UDP133 在此背景中不是標準的列舉目標。 因此，TCP139 與 UDP137 和138 是使用者名稱和與組有關的列舉的最佳優先設定。","s":"term"},{"n":485,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test at Triangle FinTech in Raleigh, North Carolina, ethical hacker Ethan attempts to bypass the company ' s perimeter firewall. Instead of sending obvious malicious payloads, he encapsulates his traffic inside standard web requests on port 80, blending in with normal browsing activity. This method allows his packets to slip past perimeter defenses that are not performing deep application inspection. Which firewall evasion technique is Ethan most likely using?","o":["HTTP Tunneling","Source Routing","Tiny Fragments","DNS Tunneling"],"a":[0],"e":"說明技術是 HTTP 地道 因為伊森正在封裝他連接埠 80 標準網路內 的流量 以配合正常瀏覽活動 並繞行僅能進行基礎連接埠 1/協定過濾的周邊防禦。 HTTP 地道通能帶動許多組織允許出(有時入)HTTP1/HTTPS 透過防火牆進行通車，滿足業務需要。 如果一防火牆沒有進行深度檢查(例如應用層代用，WAF 檢查，或嚴格的出行控制)，封裝的流量可以在 HTTP 結構內攜帶非 HTTP 有效酬載時透過允許的港口。劇情的核心線索有:(1)\"封裝他標準網路請求內的流量\"，(2)使用連接埠80,(3)成功取決於防火牆\"不進行深度應用檢查\"，這些正是 HTTP 地道有效的條件:流量以普通的 HTTP 工作階段出現， 因此，防火牆將其視為允許的網路流量，即使內容正被用作另一個協定或命令通道的載體。為何其他選項不合適:DNS 地道通車(D)也封裝了流量， 但它使用 DNS 查詢/responses(典型的為 UDP/TCP53)， 而不是 HTTP 在連接埠 80 上的請求。細片(C)是一種將封包分解為極小片段來混淆濾取/IDS 再組裝的逃生方法；情節是用網路請求來封裝，而不是分解。源路由 (B)試圖用 IP 選項來影響封包路徑；在此不作描述，在現代網路中通常被遮蔽/ignored。因此，防火牆逃生技術是A.HTTP 隧道。","s":"term"},{"n":486,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester intercepts HTTP requests between a user and a vulnerable web server. The tester observes that the session ID is embedded in the URL, and the web application does not regenerate the session upon login. Which session hijacking technique is most likely to succeed in this scenario?","o":["Injecting JavaScript to steal session cookies via cross-site scripting","DNS cache poisoning to redirect users to fake sites","Session fixation by pre-setting the token in a URL","Cross-site request forgery exploiting user trust in websites"],"a":[2],"e":"這個情境展示了一個經典案例:工作階段\"修復\"(Fixation)，一種被 CEHv13Web 應用程式入侵模組明確涵蓋的工作階段劫持技術。工作階段固定化發生於攻擊者設定或預測有效的工作階段識別碼並迫使受害者使用同一種工作階段 ID 進行認證時。在所述問題上，強調了兩個關鍵的弱點:工作階段 ID 嵌入到 URL 中程式在登入後不會重生 工作階段 ID 根據 CEH v13,安全應用程式必須在成功認證後再生成工作階段識別碼來防止固定攻擊。 如果這種情況沒有發生，攻擊者可以將包含已知的工作階段 ID 的 URL 設計出並欺騙被攻擊者點選。 受害者日誌入室後，攻擊者會再用同一種工作階段 ID 來獲得未經授權的存取。 CEH 檔案稱:工作階段固定在下列情況下特別有效: 1。工作階段 ID 透過 URL 參數傳遞工作階段 在整個認證中持續安全 cookie 屬性沒有強制其他選項不正確，因為:基於 XSS 的 Cookie 盜竊需要使用者端側指令碼注入。DNS 快取中毒與工作階段管理無關。 CSRF 利用使用者信任，但不會直接劫持工作階段。因此，透過在 URL 中預設符來修復工作階段是本案中最有效的攻擊。"},{"n":487,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"short","q":"Which WPA2 vulnerability allows packet interception and replay?","o":["Hole196 vulnerability","KRACK vulnerability","WPS PIN recovery","Weak RNG"],"a":[1],"e":"KRACK (Key Reinstallation Attack) 弱點是 CEH v13 無線網路入侵。 KRACK 中廣泛涵蓋的關鍵 WPA2 缺陷，它利用了四向握手過程中的弱點，使得攻擊者可以強制重置加密鍵。此鍵重置後重置了非子和計數器，使攻擊者能夠解密，重放並偽造封包，甚至在加密的 WPA2 網路上也如此。 CEH v13 強調 KRACK 在數學上不會打破加密而會利用協定邏輯缺陷。霍爾 196 會影響 GTK 的誤用，和 WPSPIN 攻擊目標認證，而不是重放加密流量。 弱 RNG 問題與 WPA2 重放無關。因此，選項 B 是正確的。","s":"term"},{"n":488,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"Self-replicating malware causes redundant traffic, crashes, and spreads autonomously. What malware type is responsible, and how should it be handled?","o":["Worm isolate systems, scan network, update OS","Ransomware disconnect, back up data, decrypt","Trojan scan systems and patch","Rootkit reboot and deploy scanner"],"a":[0],"e":"此情境描述了 CEH v13 惡意軟體威脅中定義的蠕蟲感染。 蠕蟲是自我複製的惡意軟體，在網路中自動擴散，而沒有使用者互動。它們的傳播往往導致網路流量過度，系統崩潰，資源耗盡，這與描述的症狀是一致的。 CEH v13 區分了蠕蟲與其他惡意軟體:勒索軟體 加密資料， 但不會主動自我支援。特洛伊人需要使用者執行。根基注重於隱形和持久性，而不是複製。適當的對策將遏制和根除作為優先事項。更新作業系統可以關閉蠕蟲利用來傳播的弱點。 CEHv13 強調快速隔離和修補程式是控制蠕蟲爆發並恢復網路穩定性的關鍵措施，因此，選項 A 是正確的。","s":"term"},{"n":489,"c":"密碼學","ce":"Cryptography","t":"mid","q":"You are Riley, an incident responder at NovaEx Crypto in San Antonio, Texas, tasked with investigating a recent double-spend reported by a retail merchant that accepts the exchange ' s token. Your telemetry shows that a reseller node used by the merchant received blocks only from a small, fixed set of peers for several hours and accepted a conflicting history that later allowed the attacker to reverse a confirmed payment. The attacker appears to have controlled which peers that node communicated with and supplied it a private chain until they were ready to reveal it. Which blockchain attack does this behavior most closely describe?","o":["Finney Attack","DeFi Sandwich Attack","51% Attack","Eclipse Attack"],"a":[3],"e":"行為描述得與 Eclipse 攻擊最吻合。 在日食攻擊中，對手透過控制其同伴聯絡來孤立受害者節點，從而使節點只能與攻擊者控制(或攻擊者影響)同伴溝通。 攻擊者一旦被隔離，就可以向受害者餵飽被操縱的遮蔽鏈檢視 - - 如扣塊、拖延交易或提供替代鏈條歷史。這可以產生下游的影響，如對依賴節點觀點確認的商人進行雙重支出。設想方案最強的指標是:節點\"只從一組小而固定的同齡人那裡接收了數小時\"，暗示出異常的同齡人多樣性和潛在的隔離。攻擊者\"控制了與節點通訊的同位素\"，這實質上是將節點遮蔽的定義。節點\"接受了相沖突的歷史\"，攻擊者提供了\"一條私人鏈條，直到他們準備好披露它\"，這與向被害者提供一個量身定製的鏈條檢視一致，然後釋放出/realigning 以從倒轉的支付中獲利。為什麼其他選擇不合適:芬尼的攻擊(A)涉及一個礦工在前地開採一個含有一大筆開支的地塊，向一個商人付款，然後放出預先埋設的地塊，使該商人的交易無效--這不屬實。需要隔離特定節點的同位素數小時。 DeFi 三文治攻擊(B)是分散式交換的Mempool/MEV 戰術，涉及前跑後跑，與隔離節點對等連線或餵養一股私人鏈無關。 51%的攻擊(C)涉及控制大多數網路雜湊功率/stake，以重寫網路規模的歷史。 情境強調透過同行控制而不是多數網路控制來孤立某個與商家有關的節點。因此，這次攻擊最好被指為\"D。 Eclipse Attack\"。","s":"term"},{"n":490,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a penetration test for a global e-commerce platform in Dallas, ethical hacker Maria simulates a large- scale DoS campaign. Instead of sending attack traffic directly, she forges requests to multiple open services across the internet. These services unknowingly reply to the victim system, multiplying the amount of traffic hitting the target. Within minutes, the victim ' s server is overwhelmed by a flood of responses, even though Maria ' s own machine generated only a small amount of traffic. Which attack technique is Maria most likely demonstrating?","o":["Smurf Attack","Distributed Reflection Denial-of-Service (DRDoS)","Botnet","NTP Amplification Attack"],"a":[1],"e":"正確答案是 B。 District Reflectionion 阻斷服務(DRDoS)，因為情境描述了 DRDoS 的兩個定義要素:利用第三方系統進行回想和規模放大。 Maria\" forges request\"(即將受害人的 IP 位址作為源頭)來\"跨網際網路多開放服務\"，這些服務隨後向偽造的源發回回覆--受害人--因此受害人收到大量未經請求的回覆。 這是反省:攻擊者不直接攻擊受害人；相反，攻擊者反映其他伺服器的流量。 \"乘以流量\"表示放大:許多議定書/services 回應時，封包比請求大得多，因此攻擊者出行的流量小而導致對目標大得多的入行洪。提到\"多開口服務\"被\"一團回放\"所淹沒，是 DRDoS 的經典行為。 從防禦人員的角度來看，DRDoS 攻擊是困難的，因為流量往往看起來來自合法的伺服器，而被害者正在收到對其從未傳送的請求的答覆。 緩解包括來源位址驗證(BCP38 反欺騙)，限速，過濾/ACLs 被濫用的 UDP 服務，以及上游洗滌/CDN 或 DDoS 保護。為什麼其他選項的準確性不高:藍精靈是使用 ICMP 到廣播位址(現在基本上透過解除定向廣播的功能來緩解)進行特定反射/amplification 攻擊。 殭屍網路描述攻擊者的。基礎設施(許多被損壞的機器)，但不能是反射/amplification 機制；殭屍網路可用於發射多類 DDoS 攻擊。 NTP 放大是使用被錯誤設定的 NTP 伺服器(UDP/123).)的一個特定的 DRDoS 變體。 問題描述了跨\"多開服務\"的更寬技術，而不是具體命名 NTP，所以最好的匹配是普通類別 DRDoS。因此，瑪麗亞正在展示\"分散式反射\"阻斷服務(DRDoS)攻擊。","s":"term"},{"n":491,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"You discover a Web API integrated with webhooks and an existing administrative web shell. Your objective is to compromise the system while leaving minimal traces. Which technique is most effective?","o":["SSRF to perform unauthorized API calls","IDOR exploitation","Upload malicious scripts via the web shell","Manipulate the webhook for unintended data transfer"],"a":[0],"e":"伺服器-Side 請求偽造(SSRF)在 CEH v13 Web 應用程式入侵中被強調為隱形而強大的攻擊。 SSRF 允許攻擊者從被信任的伺服器本身提出請求，繞過防火牆，認證，和日誌控制。與網路殼或網路被濫用相比，SSRF 留下的法證文物較少，並且可以進行內部 API 存取、後設資料曝光和橫向移動。"},{"n":492,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester finds that a web application does not properly validate user input and is vulnerable to reflected Cross-Site Scripting (XSS). What is the most appropriate approach to exploit this vulnerability?","o":["Perform a brute-force attack on the user login form to steal credentials","Embed a malicious script in a URL and trick a user into clicking the link","Inject a SQL query into the search form to attempt SQL injection","Use directory traversal to access sensitive files on the server"],"a":[1],"e":"CEH v13 解釋道，如果攻擊者提供的惡意輸入在 HTTP 回應中立即被回還而無分解，則會發生反射出 XSS。 這種型別的XSS 通常透過一個裝有嵌入的 JavaScript 酬載的被精心設計的 URL 來被利用。 當受害者點選連結時，弱勢的伺服器反映了被注入的指令碼回放到瀏覽器，在使用者的工作階段上下文範圍內執行。 CEH 強調，被反映的 XSS 依賴社交工程傳送酬載，通常透過電子郵件，訊息平台傳送的連結，或被損壞的頁面。 目標可能包括偷取工作階段 cookie，重定向使用者，或操縱頁面內容。 Brute-forcing 認證資訊(備選 A)與 XSS。 SQL 無關注入(可選 C) 目標後端資料庫，而不是使用者端-側指令碼執行。 Director traversal(可選 D) 涉及檔案路徑操作，而不是動態指令碼注入。 因此，將惡意指令碼嵌入到URL 中是利用已反射出 XSS 的正確方法。"},{"n":493,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"short","q":"Which countermeasure best mitigates brute-force attacks on Bluetooth SSP?","o":["Use BLE exclusively","Increase Diffie-Hellman key length","Apply rate-limiting","Device whitelisting"],"a":[2],"e":"在 CEH v13 無線駭客中，針對安全簡單對等(SSP)的暴力破解攻擊利用了反覆的猜測密碼值的嘗試。 最有效的防禦是限制速率，這限制了在特定時間段內可以進行多少對等嘗試。如果允許無限制的嘗試， 增加金鑰長度並不能阻止野蠻的嘗試。BLE 仍然使用配對機制， 並且不能免疫。 白名單控制存取， 但不能防止配對時的密碼攻擊。 CEHv13 明確推薦了限速和配對嘗試閾值作為初級緩解。因此，選項 C 是正確的。"},{"n":494,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"During a security assessment at Apex Technologies in Austin, Texas, the cybersecurity team identifies a high risk of social engineering attacks, including phishing, vishing, and baiting, targeting employees across departments. To strengthen defenses, the team plans to implement a countermeasure to reduce the likelihood of employees disclosing sensitive information. Which of the following countermeasures should Apex Technologies prioritize to mitigate the risk of social engineering attacks?","o":["Conduct security awareness and training programs","Employees must verify the identity of individuals requesting information","Use two-factor authentication","Establish policies and procedures for handling sensitive information"],"a":[0],"e":"安全意識和培訓是針對社交工程的最有效的主要反措施，因為這些攻擊利用了人類的信任，好奇心，緊迫性，以及對欺騙策略不熟悉，而不是純粹的技術弱點。 在 CEH 指導中，在使用者無法識別出意料請求等紅旗，壓力快速行動，可疑連結或附件，呼叫者欺騙，或似乎太好以致無法真實的報價時，打字，活潑和誘餌成功。 結構化的宣傳方案直接減少了教職員如何識別常見藉口，驗證異常請求，並遵循安全報告程式的機會。雖然身分核查(選項 B)是一項重要做法，但員工通常只有在接受過核查步驟，升級路徑，以及在壓力下\"良好核查\"的外觀等方面的培訓後才能正確進行。 雙要素認證(選項 C)有助於保護帳戶，即使認證資訊被竊取，但並不阻止員工共享敏感資訊，如客戶資料，內部檔案，OTP 程式碼，或批准欺詐請求--許多社交工程活動的目的都超出了密碼範圍。 政策和程式(選項 D)是必要的，但單靠政策往往被忽視或誤解。沒有持續的培訓，強化， 和現實世界模擬。 符合 CEH 的最佳做法是一種分層的方法:從提高認識培訓入手，用明確的處理政策強化它，要求對敏感的請求進行核查，進行釣魚模擬，確保員工知道如何立即報告可疑的電子郵件/calls。 這種組合既會減少成功妥協，也會減少嘗試的影響，但培訓是基礎優先事項，因為它直接針對被攻擊的人。"},{"n":495,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"long","q":"A penetration tester is hired by a company to assess its vulnerability to social engineering attacks targeting its IT department. The tester decides to use a sophisticated pretext involving technical jargon and insider information to deceive employees into revealing their network credentials. What is the most effective social engineering technique the tester should employ to maximize the chances of obtaining valid credentials without raising suspicion?","o":["Conduct a phone call posing as a high-level executive requesting urgent password resets","Send a generic phishing email with a malicious attachment to multiple employees","Create a convincing fake IT support portal that mimics the company ' s internal systems","Visit the office in person as a maintenance worker to gain physical access to terminals"],"a":[2],"e":"CEH 培訓強調，高度量身定製的社交工程攻擊--利用對內部工作流程的信任和認為的技術權威的攻擊--比通用或大規模分佈的釣魚企圖要有效得多。 一個反射出內部系統的假的 IT 支援入口網站會利用程式上的熟悉性:IT 部門通常會指示員工到日誌進入支援入口網站進行故障排除，認證資訊驗證，或更新出票。 當攻擊者用內部術語和提及真實的內部系統來強化藉口時，僱員更有可能信任該入口網站並輸入認證資訊.CEH 強調成功的社交工程攻擊模仿合法過程來避免被懷疑。高管經常因為即時互動和檢查而引入風險。 通用的打字缺乏個性化，容易被偵測出。 物理冒用引入了操作風險並可能不會產生認證資訊。 因此，一個與 IT 工作流程相匹配的假的 IT 支援入口網站是最佳方法。"},{"n":496,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"During a scheduled red team engagement at a regional investment firm in Phoenix, Arizona, security consultants were permitted limited after-hours access to employee workstations. As part of the evaluation, a small intermediary device was placed inline between a keyboard and its connected desktop system. Over time, the device began forwarding captured keystroke activity through the company's established wireless environment, allowing the assessment team to collect periodic log data without interacting further with the workstation. What type of keylogger does this scenario describe?","o":["Hardware Keylogger","Acoustic/CAM Keylogger","Wi-Fi Keylogger","Bluetooth Keylogger"],"a":[2],"e":"正確答案是 C。 Wi-Fi 鍵盤側錄程式。該裝置在鍵盤和桌面之間被實際地放入，因此它基於硬體。然而，問題中的定義特徵是，它在組織的無線環境上轉發了捕獲到的鍵盤中繼器，這使得最精確的答案是 Wi-Fi 鍵盤側錄程式。 CEH 系統駭客材料解釋道:鍵行是監視或記錄使用者鍵盤動作的過程，鍵行者可能基於硬體或軟體，它還將 KeyGrabber Nano Wi-Fi 和KeyGrabber Wi-Fi Premium 等無線能硬體裝置在硬體鍵行裝置中列出。選項 A。 硬體鍵盤側錄程式大致真實，但因問題強調無線轉發而不太精確。選項 B。 聲學/CAM 鍵盤側錄程式不正確 因為裝置不能從聲音中推斷出鍵盤 攝像頭拍攝， 或電磁觀測。選項 D。 Bluetooth 鍵盤側錄程式是不正確的，因為情境指定透過公司的 Wi-Fi 環境轉發，而不是藍芽。因此，最好的答案是 C。 Wi-Fi 鍵盤側錄程式。","s":"term"},{"n":497,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A large media-streaming company receives complaints that its web application is timing out or failing to load. Security analysts observe the web server is overwhelmed with a large number of open HTTP connections, transmitting data extremely slowly. These connections remain open indefinitely, exhausting server resources without consuming excessive bandwidth. The team suspects an application-layer DoS attack. Which attack is most likely responsible?","o":["A UDP flooding attack targeting random ports.","An ICMP Echo Request flooding attack.","A Slowloris attack that keeps numerous HTTP connections open to exhaust server resources.","A fragmented packet attack with overlapping offset values."],"a":[2],"e":"認證的 道德駭客 (CEH) Web 應用程式入侵 和 DoS/DDoS 模組識別出 Sydloris 是一種應用層阻斷服務攻擊，透過維持大量半開 HTTP 連線，瞄準了網路伺服器。 Slowloris 透過將部分 HTTP 請求傳送到非常緩慢的， 防止伺服器關閉連線。CEH 檔案強調這次攻擊不依賴高頻寬， 使得難以使用傳統的網路防禦手段進行偵測。選項 C 準確匹配了所描述的症狀和CEH 的定義。選項 A 和 B 是網路層的泛洪攻擊，被明確排除。選項 D 是一種封包分解攻擊，不是應用層的 DoS 技術。CEH 強調調節連線超時，並使用倒置代用來作為緩解。"},{"n":498,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"An organization lacks centralized logs. Which attack phase is hardest to detect?","o":["Lateral movement","Recon","Delivery","Initial access"],"a":[0],"e":"正確答案是 A， 橫向移動。 橫向移動是在初始入侵後發生的， 當攻擊者從一個系統轉移到其他內部主機、 帳戶或資源時。這個階段特別難以偵測， 不集中記錄， 因為證據分散在許多端點、 伺服器、 認證系統， CEH 事件回應和 SOC 概念強調 SIEM 的功能，如識別，監測，記錄，審計，分析安全事件，這些功能嚴重依賴於集中的日誌蒐集和關聯。 CEH 基礎材料也指出，當審計/活動日誌沒有正確設定或維持時，事件調查變得極其困難。 在駭客處理方法中，將控制從一個主機擴充套件至網路中的其他主機被描述為接管，它將控制圖緊密地對映到橫向移動。 偵察，交付，以及初始存取可能在周邊或端點控制中可見，但橫向移動需要跨系統關聯，使得在沒有集中日誌的情況下最難被偵測到的階段。","s":"term"},{"n":499,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A tester evaluates a login form that builds SQL queries using unsanitized input. By submitting a single quote ( ' ), the tester bypasses authentication and logs in. What type of SQL injection occurred?","o":["UNION-based SQL injection","Error-based SQL injection","Time-based blind SQL injection","Tautology-based SQL injection"],"a":[3],"e":"CEHWeb 應用程式攻擊模組將基於 tautology 的 SQL 注入解釋為一種攻擊，其中輸入會更改一個條件語句，以總是被評價為 TRUE(例如\"OR\" 1\"=\"1\")。提交單一引文往往會斷開查詢邏輯，並允許攻擊者操縱認證條件。選項 D 是正確的。選項A 擷取資料。選項 B 依賴於錯誤訊息。選項 C 採用時間上的延遲。 CEH 識別出同義攻擊是最早並最常用的 SQL 注入技術之一。","s":"term"},{"n":500,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"A penetration tester performs a vulnerability scan on a company ' s network and identifies a critical vulnerability related to an outdated version of a database server. What should the tester prioritize as the next step?","o":["Attempt to exploit the vulnerability using publicly available tools or exploits","Conduct a brute-force attack on the database login page","Ignore the vulnerability and move on to testing other systems","Perform a denial-of-service (DoS) attack on the database server"],"a":[0],"e":"CEH v13 詳細介紹了標準滲透測試工作流程，其中確認的關鍵弱點--特別是影響資料庫伺服器等核心系統的弱點--只有在核實後，並在接戰規則明確允許的情況下，才應優先加以利用。 利用經過審查的工具(如 Metasploit，CVE-特定利用)來利用已知的弱點，提供真實世界風險的證據並驗證嚴重程度評級。 殘酷強制登入(備選 B)效率低下，且往往超出範圍。 忽略臨界弱點(備選 C)違反了 CEH 的排次準則。 DoS 攻擊(備選 D)永遠不合適，除非接觸明確授權進行破壞性試驗，這是罕見的。 CEH 強調，應利用高影響弱點來證明商業風險、權限提升潛力、資料暴露或橫向移動可能性--與 CEH 方法完全一致的備選 A。"},{"n":501,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"You are an ethical hacker at SilverRock Security, engaged by BayState Credit Union in Boston, Massachusetts, to evaluate their online loan application portal. While testing the customer dashboard, you inject crafted input into a numeric parameter. Instead of returning only the expected loan details, the response also displays sensitive employee information from another table, merged into the same page results. This behavior indicates that the attacker's input successfully combined multiple datasets into a single output. Based on the observed behavior, which type of SQL injection attack are you exploiting?","o":["Error-Based SQL Injection","Blind SQL Injection","Second-Order SQL Injection","UNION SQL Injection"],"a":[3],"e":"正確答案是 D。 UNION SQL 注入，因為關鍵觀察是應用程式的回應顯示來自另一個表格的資料被合併到同頁結果中，這意味著被注入的酬載成功將兩個結果組合成一個輸出。 在符合 CEH SQL 注入分類學中，UNION-基於 SQL 注入的被攻擊者使用 SQLUNION(或 UNIONALL)運算子將第二次 SELECT 查詢的結果附加到原始查詢的結果後，會發生。 如果應用程式將查詢結果列印到頁面中，UNION 注入特別強大，因為它可以透過正常的網路回應直接將資料庫內容帶入。情境描述在客戶儀表板中輸入一個數字參數(通常在諸如選擇出借細節等查詢中是一個 id 值)，透過操縱這個參數，攻擊者會使後端查詢不僅返回預期出借記錄，而且從不同的表格中返回員工資訊。 這就是 UNIONSQL 注入的標誌:透過設計第二個SELECT，匹配原始查詢的列數和相容資料型別來擷取無關的列/rows，然後將其與合法查詢結合，這樣兩個資料集就能夠一起生成。 攻擊者經常會列出列數(例如有 ORDER)。將敏感資料放置在顯示位置。為什麼其他選項不匹配 : 基於錯誤的SQL 注入依賴資料庫出錯訊息來洩露資訊，而不是將結果乾淨地合併到頁面中。 Blind SQL 注入在回應中不產生直接資料，而是透過布林條件或時間延遲來推斷資訊。 二等相 SQL 注入發生於惡意輸入先被儲存後被執行到不同的上下文中；即時描述資料即時，即時回應的合併。因此，行為最直接地表示出 UNIONSQL 注入。","s":"term"},{"n":502,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"long","q":"In downtown Chicago, Illinois, security analyst Mia Torres investigates a breach at Windy City Enterprises, a logistics firm running an Apache HTTP Server. The attacker exploited a known vulnerability in an outdated version, gaining unauthorized access to customer shipment data. Mia's analysis reveals the server lacked recent security updates, leaving it susceptible to remote code execution. Determined to prevent future incidents, Mia recommends a strategy to the IT team to address this exposure. Which approach should Mia recommend to secure Windy City Enterprises ' Apache HTTP Server against such vulnerabilities?","o":["Eliminate unnecessary files within the jar files","Block all unnecessary ports, ICMP traffic, and unnecessary protocols such as NetBIOS and SMB","Use a dedicated machine as a web server","Conduct an extensive risk assessment to determine which segments of the network are most vulnerable or at high risk that need to be patched first"],"a":[3],"e":"正確答案是 D，因為違背行為的根本原因是 Apache HTTP 伺服器的未被標註，過時後易被遠端程式碼執行所感染。 根據安全營運與事件回應下的 CEH 原則，弱點管理和風險評估是防禦性安全戰略的關鍵組成部分。 一項廣泛的風險評估使本組織能夠查明脆弱資產，根據嚴重程度和業務影響確定修補程式的優先次序，並執行一項結構化的補救計劃。風險評估是弱點管理生命週期的一部分，其中包括資產識別、弱點掃描、風險評估、優先排序、修補程式管理和核查。 透過確定哪些系統最暴露和關鍵，本組織可以系統地應用修補程式和安全更新，減少攻擊面。 由於已知存在弱點，因此違反規定的行為如得到適當的修補程式管理和定期的安全更新，本可防止被利用。選項 A、B 和 C 代表了硬化或分解技術，但沒有直接解決過時軟體弱點的核心問題。 封鎖港口和使用專用機器是良好的安全做法；但是，如果網路伺服器軟體本身沒有被標註的話，它們並不能消除被開發的風險。因此，實施一個全面的風險評估程序，然後是優先的修補程式管理，直接與 CEH 推薦的防止今後發生類似事件的最佳做法保持一致。"},{"n":503,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"In the vibrant startup scene of Austin, Texas, ethical hacker Daniel Ruiz is hired by TechNexus, a U.S.-based logistics software provider, to evaluate their internal administration portal. During testing, Daniel observes that certain input fields forward user-supplied data directly to underlying system functions. By carefully crafting his entries, he is able to trigger execution of unexpected system commands, resulting in unauthorized control over the operating environment. His findings reveal that the flaw stems from poor validation of input processed by system-level functions. Which vulnerability is Daniel most likely demonstrating?","o":["Shell Injection","LDAP Injection","SQL Injection","Cross-Site Scripting (XSS)"],"a":[0],"e":"被描述的行為與殼牌注入(OS Communication Injection)一致。 關鍵線索是應用程式將使用者提供的輸入轉發到系統級功能，而被精心製作的輸入會導致意外的系統命令被執行，導致對基礎操作環境的擅自控制。 這就是命令注入的決定性特徵:應用程式構造或傳遞命令字串到作業系統(直接或間接地)，且輸入驗證/escaping 不充分，使得攻擊者可以改變命令結構並執行任意命令。在內部管理入口網站中，這經常發生在開發者整合\"Ping a 主機\"，\"Look up a file\"，\"執行診斷\"，\" convert/export\"或\"Invoke a backend 指令碼\"等便利功能時，他們也加入到其中。透過使用者輸入到命令直譯器或 shell 呼叫中。 如果輸入沒有嚴格驗證( 刪除清單)， 並且處理得當( 參數化、 安全 API、 逃出)，攻擊者可以附加操作員或元字元來更改執行流程， 允許在應用程式權限下進行系統命令執行。其他選項與\"系統命令\"不相匹配 :LDAP 注入(B)透過操縱LDAP 過濾語法來繞過認證或擷取目錄資料，而不是執行 OS 命令來靶向目錄查詢。 SQL 注入 (C) 操縱資料庫查詢以讀取/modify 資料庫內容；雖然嚴重，但本質上是一個資料庫層的問題，而不是描述的直接 OS 命令執行。 XSS(D)在使用者的瀏覽器上下文中執行指令碼，會撞擊用戶端，工作階段，以及網頁內容--而不是伺服器的操作環境透過系統命令執行。因此，所顯示的弱點是 A.殼噴出物。","s":"term"},{"n":504,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"You are a security analyst conducting a footprinting exercise for a new client to gather information without direct interaction. After using search engines and public databases, you consider using Google Hacking (Google Dorking) techniques to uncover further vulnerabilities. Which option best justifies this decision?","o":["Google Hacking can help locate phishing websites that mimic the client's website.","Google Hacking can help discover hidden organizational data from the Deep Web.","Google Hacking can help identify weaknesses in the client's website code.","Google Hacking can assist in mapping the client's internal network structure."],"a":[2],"e":"認證道德駭客 (CEH) Footprinting 和偵察模組將 Google Hacking(也叫 Google Dorking)定義為使用高階搜尋操作員在公共網際網路上無意中暴露出敏感資訊。 這一技術仍然被動，使其在偵察早期成為理想。 Google Hacking 可以揭示:已曝光設定檔備份檔案(.bak，.old，.zip)錯誤訊息和堆疊追蹤原始碼片段和指令碼錯誤這些發現經常表明一個 Web 應用程式中的編碼缺陷或不安全設定。 CEH 明確強調 Google Dorking 是找出 Web 應用程式缺陷的有效途徑，而無需直接掃描或利用目標。選項 C 是正確的，因為谷歌駭客通常用來識別透過索引檔案暴露的編碼和設定弱點。選項 A 可能是間接可能的，但並不是主要理由。選項 B 是不正確的，因為 Google 沒有索引\"深網\"。選項 D 涉及內部網路發現，Google Hacking 無法直接實現。 CEH 強調 Google Hacking 是一種強大的被動偵察技術來發現被暴露出的弱點。"},{"n":505,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"An AWS security operations team receives an alert regarding abnormal outbound traffic from an EC2 instance. The instance begins transmitting encrypted data packets to an external domain that resolves to a Dropbox account not associated with the organization. Further analysis reveals that a malicious executable silently modified the Dropbox sync configuration to use the attacker ' s access token, allowing automatic synchronization of internal files to the attacker's cloud storage. What type of attack has likely occurred?","o":["Cloud Snooper attack leveraging port masquerading","Man-in-the-Cloud (MITC) attack","Side-channel attack exploiting CPU cache","Cryptojacking using Coin Hive scripts"],"a":[1],"e":"Man-in-the-Cloud (MITC) 攻擊目標雲同步服務，如 Dropbox，Google Drive，和 OneDrive 透過操縱認證符而不是使用者密碼。 CEH 課程軟體解釋雲端儲存用戶端嚴重依賴本機儲存的同步符符，這些符符符授權存取而無需使用者互動。 如果攻擊者替換或注入了惡意訊號，他們可以劫持被害者的雲帳戶或將同步資料重定向到攻擊者控制的位置。在此情況下，EC2 例項繼續執行通常情況下，但它的 Dropbox 使用者端 默默地將資料同步到使用攻擊者指使的外部帳戶中。這繞過了傳統的防禦，如周邊防火牆，認證資訊 監測，或使用者行為分析，因為同步過程看起來合法並被認證。 MITC 攻擊是獨一無二的隱形的，因為一旦同步指使被竊取或被替換，它們不需要進一步妥協。 其他的選擇，如 Cloud Snooper 或 Crypto劫持，與描述的行為不符。因此，這次攻擊顯然與 Man-in-the-Cloud 攻擊一致。"},{"n":506,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"An IDS generates alerts during normal user activity. What is the most likely cause?","o":["Firewall failure","IDS outdated","Excessive IDS sensitivity causing false positives","Users triggering protocols"],"a":[2],"e":"在 CEH v13 中，IDS 的有效性被緊密地與適當的簽名調校和靈敏度閾值相接。 當 IDS 警報被合法使用者行為所觸發時，最常見的原因是設定過於敏感，導致出現假正態。當正常的流量模式匹配入侵簽名時會出現誤判警示。 CEH v13 強調IDS 系統必須被校正到組織的基線流量剖面。 不進行調音，IDS 日誌成為。吵鬧並降低分析效果。防火牆問題(可選 A)和已過時的 IDS 簽名(可選 B)可能導致偵測缺失，而不是過度的提醒。 使用者無意觸發協定(可選 D)不是一個根源，而是一種設定錯誤的症狀。因此，過度的 IDS 靈敏度是正確的解釋。"},{"n":507,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"long","q":"A digital forensics consultant in Portland, Oregon examines an iPhone seized as part of a corporate data leakage investigation. The device contains third-party extensions and system modifications not typically permitted by the operating system vendor. The owner explains that whenever the device is powered off and restarted, it boots normally and remains fully functional for everyday tasks such as calls and messaging. However, the custom extensions and system-level tweaks do not function until a specific jailbreak application installed on the device is manually executed. No external computer is required during this reactivation process. Determine the type of jailbreaking technique implemented on this device.","o":["Untethered Jailbreaking","Tethered Jailbreaking","Semi-Tethered Jailbreaking","Semi-Untethered Jailbreaking"],"a":[3],"e":"正確答案是 D。 半無縫的監獄破解。主要細節如下:裝置靴子通常在重啟後。基本的電話功能繼續發揮作用。越獄修改在重啟後不會自動生效。使用者必須在裝置上手動執行一個破獄應用程式。不需要外部電腦。這種行為最好被歸類為半無縫的越獄。 在半無縫的越獄中，裝置可以重新啟動並正常執行，但越獄狀態必須透過執行裝置本身上安裝的越獄應用程式重新啟用。 符合 CEH 的移動駭客材料解釋道，在被綁入的越獄中，重啟會去掉越獄修補程式，並且需要一臺電腦來啟動或重犯該裝置。 也解釋道，在未
