m access were made. Instead, the information was obtained incrementally through carefully crafted questions embedded within informal dialogue. Which social engineering technique is most accurately demonstrated in this scenario?","o":["Quid Pro Quo","Baiting","Elicitation","Honey Trap"],"a":[2],"e":"所展示的手法是 Eliaction.CEH 社交工程的覆蓋說明透過對話從目標擷取資訊而不提出直接或明顯的可疑請求的藝術誘導。攻擊者仔細引導對話，這樣受害者會自願披露敏感的細節，常常相信討論是正常的、無害的或專業的。 這恰恰就是這裡發生的情況:此人擔任招募顧問，透過多種非正式互動建立關係，並逐漸獲得有關研究、時間表和內部代號的資訊。 沒有要求認證資訊，也沒有公開交易或獎賞，因此這不是交換。 它也並非誘餌，通常依靠誘餌物件或機會，也並非蜂蜜陷阱，通常涉及浪漫或親密的操縱。 CEH 材料強調誘導特別危險，因為受害者往往沒有意識到攻擊者的問題被戰略性地排序以逐塊擷取有價值的情報。 逐漸地，對話地，非對抗地蒐集這種情境中的敏感專案細節是誘導的決定性規律。","s":"term"},{"n":585,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During an external assessment of a regional retail company ' s digital infrastructure, security analyst Joe is assigned to map internal services without active intrusion. While testing the behavior of a publicly exposed resolution system, he discovers that a secondary system responds unusually to structured queries. When he issues a specific request format, the server replies with a full list of internal mappings, including subdomains, mail hosts, and system aliases without requiring credentials or triggering alerts. Which technique was most likely used to obtain this information?","o":["LDAP Enumeration","NTP Enumeration","DNS Zone Transfer Enumeration","NetBIOS Enumeration"],"a":[2],"e":"被描述的行為匹配 DNS 區轉移列舉。 在 CEH 偵察中，DNS 列舉旨在透過查詢 DNS 記錄來發現主機和服務。 區轉移是一種 DNS 的特殊操作，意在權威主機 DNS 伺服器及其二級 DNS 伺服器之間合法複製。 當設定錯誤時，一個 DNS 伺服器可能允許未經授權的請求者執行分割槽傳輸，返回整個 DNS 區資料庫。 這可以揭示出大量內部命名資訊，如子域，主機名稱，郵件交換器，服務記錄等，以及別名，與問題中描述的\"包括子域，郵件主機，和系統化名在內的內部對映的全部清單\"完全相同。 線索\"二級系統異常反應\"特別有說服力，因為二級 DNS 伺服器通常是被設定用於複製的伺服器，可能錯誤地被留待任何主機的傳輸。其他選項不符合輸出。 LDAP 列舉目標目錄服務， 並且不會生成 DNS 風格的對映， 除非您已經擁有目錄存取權 和查詢。 NTP 列舉 涉及時間同步服務 並且可以揭示時間/伺服器的細節， 並非全面的主機/subdomain 清單。 NetBIOS 列舉專注於 Windows 的網路(名稱，股份，工作組)，一般在內部網路上，不會產生 DNS 區的記錄集。 CEH-推薦的緩解措施包括僅限制區間轉移為授權的二級伺服器 IPs，使用 TSIG 金鑰進行認證轉移，將公開曝光的 DNS 資料降到最低，將內外的 DNS(split-horizeon)進行分拆，並持續審計 DNS 設定以防止無意的資訊外洩。","s":"term"},{"n":586,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"Which attack abuses scheduled tasks?","o":["Reconnaissance","Persistence","Sniffing","DoS"],"a":[1],"e":"正確答案是 B， 因為排程工作通常被濫用為持久性。 在系統駭客和開發後階段， 持久性意味著即使在重啟、 登入或臨時的 工作階段 丟失後仍保持對已損壞系統的存取。 攻擊者可能濫用 Windows 任務排程器或 Linux cron 任務， 以在特定間隔、 啟動期間或當使用者時自動執行惡意軟體、 指令碼、 回撥或後門。日誌 英寸。 擷取的指南材料顯示用於經常性執行的排程工作用途 並參考以持久性為重點的模組 諸如郵遞/windows/manage/persistence， 符合 CEH 在入侵後維持存取的概念。偵察是攻擊前蒐集資訊， 嗅探 捕獲 網路流量， 和 DoS 試圖破壞可用性，這些沒有具體描述濫用預定任務。 防守方面，管理員應稽核已排定的工作，監測任務建立事件，限制任務建立權限，並調查未知的起動或重複的任務。","s":"term"},{"n":587,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"During a red team engagement at a biotechnology firm in San Diego, California, the security team observed that a compromised internal workstation was generating an unusually high number of outbound name resolution requests to external servers. Upon deeper inspection, analysts discovered that the query strings contained encoded data segments rather than typical lookup patterns. Further analysis revealed that these outbound requests were being used to transfer sensitive information to an attacker-controlled system outside the corporate network. Which technique was most likely used to covertly transfer the data in this scenario?","o":["TCP Parameter Manipulation","Reverse ICMP Tunnel","DNS Tunneling","Reverse HTTP Shell"],"a":[2],"e":"正確答案是 C。 DNS 通地通。情境描述隱藏在出行 DNS 查詢字串中的被編碼資料並被傳送到攻擊者控制的外部伺服器上。這是 DNS 隧道的界定行為，其中 DNS 流量被濫用為用於命令和控制或資料外洩的秘密通道。 符合 CEH 的隱蔽通道材料解釋道可以將一通協定攜帶到另一通協定上，而隱蔽通道可以將資料隱藏在原本允許的流量內。它還注意到 DNS 的查詢和回回流量可能被用於隧道指令或資料，從而使流量在協定分析器中顯得普通。選項 A。 TCP 參數操縱不正確，因為情境沒有描述在 TCP 頭欄位中隱藏資料。選項 B.倒轉 ICMP 隧道不正確，因為可疑流量為 DNS 名稱解析流量，而非ICMP 回聲流量。選項 D。 倒轉 HTTP shell 不正確 因為活動不是 HTTP/HTTPS-based 命令擷取。因此，最好的答案是C.DNS 隧道通。","s":"term"},{"n":588,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"Emily, a security engineer at a Chicago-based healthcare provider, is auditing the organization ' s new cloud environment after a breach where sensitive patient records were exposed. Her investigation reveals that the root cause was the lack of encryption during data transmission between end-user devices and cloud storage. To mitigate this issue and align with HIPAA compliance requirements, Emily must prioritize addressing the correct cloud computing security risk. Which cloud computing threat should Emily address to mitigate the risk of sensitive data being exposed during transmission?","o":["Multi-Tenancy and Physical Security","Incidence Analysis and Forensic Support","Service and Data Integration","Infrastructure Security"],"a":[2],"e":"在符合 CEH 雲安全討論中，保護整個生命週期的資料是首要要求，a 主要的風險領域是資料如何在用戶端、應用程式和雲服務之間移動。該設想方案表明，由於使用者裝置與雲端儲存之間的傳輸沒有加密，所以發生了曝光。 該地圖直接對映到服務和資料整合風險領域，因為它側重於雲服務與使用者和其他服務交換資料時所採用的安全控制，包括安全通訊渠道、API 保護，以及適當執行過境資料加密。當資料傳輸時，沒有 TLS，或者資料弱或設定不當的 TLS，就很容易被擷取和被操縱，透過中間攻擊，流量嗅探，SSL 脫去，或降級攻擊的人類進行。 在醫療保健等規範環境下，HIPAA 的預期與強烈一致。執行強大的 加密在途中，並確保安全的 工作階段 建立、認證和現代密碼套件。這主要不是一個多租房或人身安全問題，它涉及租戶與提供者資料中心控制之間的隔離。 這主要不是事件分析和法證支援問題，它涉及事件發生後的偵測、記錄、證據蒐集和調查能力。 基礎設施安全範圍更廣，可以包括網路保護，但問題具體在於防止傳輸過程中的暴露，而服務和資料整合控制最準確地解決了這一問題。正確的補救通常包括:用現代的 TLS 執行 HTTPS，使 HSTS，使後繼協定失效並削弱密碼，確保正確的憑證管理，酌情使用相互的 TLS，透過經認證，加密的端點和妥善的 API 確保雲端儲存存取。","s":"term"},{"n":589,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"short","q":"Which wireless attack captures handshake?","o":["Deauth","Jamming","Spoofing","Replay"],"a":[0],"e":"正確答案是 A，因為去驗證攻擊通常用來強迫連線到的無線使用者端與存取點斷開，然後重新連線。 在重新連線的過程中能夠抓取 WPA/WPA2 認證握手 並後用於下線的密碼-打分嘗試。 CEH 無線駭客概念描述透過捕獲 WPA/WPA2 認證握手封包來突破 WPA。並強制連線的 使用者端 斷開 並重新連線，從而可以捕獲封包認證，用於 Pairwise Master Key 分析。這符合去音攻擊的目的。 查謨主要是可提供性或阻斷服務攻擊，會干擾無線通訊，而不是握手-抓取方法。 欺騙表示冒用裝置或 MAC 位址，再玩則表示重用被捕獲的流量或認證資料。 雖然再玩攻擊可以是無線開發的一部分，但用於觸發新握手捕捉的具體攻擊是去名。 因此，選項 A 是最佳的符合 CEH 答案。","s":"term"},{"n":590,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"As a Certified Ethical Hacker, you are assessing a corporation's serverless cloud architecture. The organization experienced an attack where a user manipulated a function-as-a-service (FaaS) component to execute malicious commands. The root cause was traced to an insecure third-party API used within a serverless function. What is the most effective countermeasure to strengthen the security posture?","o":["Regularly updating serverless functions to reduce vulnerabilities.","Using a Cloud Access Security Broker (CASB) to enforce third-party policies.","Deploying a Cloud-Native Security Platform (CNSP) for full cloud protection.","Implementing function-level permissions and enforcing the principle of least privilege."],"a":[3],"e":"認證的道德駭客 (CEH) 雲端運算模組強調，無伺服器環境嚴重依賴顆粒授權模型。 涉及受損的 API 的攻擊往往成功，因為函式被賦予了過多的特權。選項 D 是正確的，因為強制執行函式級別權限和最小特權原則直接限制一個被損害的函式可以執行的內容。 CEH 檔案宣告這是防止伺服器被濫用的首要防禦。選項 A 是有益的，但具有反應性。備選方案 B 的重點是 SaaS 的治理，而不是 FaaS 的執行控制。選項 C 提供可見度，但並不直接防止濫用特權。 CEH 強調身分和存取管理(IAM)在無伺服器安全中至關重要。"},{"n":591,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"A regional law firm authorizes a wireless resilience evaluation after employees report intermittent connectivity disruptions in conference rooms. An ethical hacker assigned to the assessment analyzes client behavior while transmitting carefully crafted 802.11 management frames toward the organization's primary access point. Each transmission immediately causes several connected laptops to lose association with the network, requiring users to reconnect manually. Connectivity interruptions occur only when the crafted frames are sent. Identify the wireless attack illustrated by this activity.","o":["Eavesdropping Attack","Jamming Attack","Deauthentication Attack","Evil Twin Attack"],"a":[2],"e":"正確答案是 C。 Deauthertication 攻擊。解析攻擊用於強制斷開與存取點積極關聯的無線用戶端。 被引用的 CEH 無線材料描述解析攻擊是一種用於強制斷開在目標存取點上積極連線的使用者，並識別為阻斷服務攻擊型別。情境表明,802.11管理訊框被送到了存取點，連線的膝上型電腦立即失去關聯，必須重新連線。 這種行為直接與去驗證攻擊相匹配。選項 A。竊聽攻擊是不正確的，因為竊聽涉及捕獲或監測無線流量，而不是強迫用戶端斷開。選項 B。 干擾攻擊是不正確的，因為干擾透過產生無線電頻率干擾來干擾無線通訊。 情境描述的是精心設計的管理訊框，而不是 RF 干擾。選項 D。 邪惡雙子攻擊是不正確的，因為邪惡雙子攻擊涉及產生一個無賴的存取點來模仿一個合法的存取點來引誘使用者連線。因此，最好的答案是 C。 Deautentication Attack。","s":"term"},{"n":592,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"An ethical hacker needs to gather detailed information about a company ' s internal network without initiating any direct interaction that could be logged or raise suspicion. Which approach should be used to obtain this information covertly?","o":["Analyze the company ' s SSL certificates for internal details","Examine email headers from past communications with the company","Inspect public WHOIS records for hidden network data","Utilize network scanning tools to map the company ' s IP range"],"a":[1],"e":"被動的偵察專注於蒐集資訊而不直接觸碰目標系統或與目標系統相互作用。 CEH 材料強調，任何向目標傳送網路流量的動作--如掃描，偵測，指紋，或列舉--都會產生日誌並增加被偵測的風險。 然而，電子郵件頭被視作一個絕佳的被動智慧來源，因為它們揭示出內部的 IP 結構，路由路徑，郵件伺服器主機名稱，內部網域名稱格式，以及不需要與目標環境互動的技術堆疊。 由於這些頭已經透過合法通訊記錄被道德駭客擁有，檢查它們不會產生流量或觸發監測系統。 SSL 憑證和 WHOIS 資料提供了寶貴的外部資訊，但很少披露內部位址方案。 主動掃描工具，如 Nmap，會立即違反避免被偵測的要求。 因此，分析之前收到的電子郵件頭是在偵察階段擷取內部網路細節的最有效和最隱蔽的方法。"},{"n":593,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"Which protocol is insecure by default?","o":["HTTPS","SFTP","SSH","Telnet"],"a":[3],"e":"正確答案是 D，因為 Telnet 預設是不安全的。 Telnet 是一種更古老的遠端存取協定，提供遠端系統的指令行存取，但並不加密通訊，這意味著使用者名稱，密碼，命令，和按鍵中鍵可以以清晰的文字穿越網路，並且可以透過嗅探或中間人攻擊來捕捉。 符合 CEH 材料中明確宣告，Telnet 傳送使用者名稱， 密碼， 和在網路上按鍵作為清晰的文字， 方便嗅取。HTTPS 是安全的 HTTP 超過 TLS/SSL， SFTP 是保護透過 SSH 的檔案傳輸， 和 SSH 是使用 加密 的 Telnet 的安全替換 並通常執行於 TCP 連接埠 22 上。因此，與 HTTPS，SFTP，和 SSH 相比，Telnet 是預設不安全的協定，因為保密和安全認證保護不在其正常執行中被建構。","s":"term"},{"n":594,"c":"雲端運算","ce":"Cloud Computing","t":"mid","q":"At a New York-based e-commerce company preparing for Black Friday sales, analyst Sarah evaluates cloud billing practices. She notices that the provider tracks compute hours, storage usage, and bandwidth consumption in detail, enabling the company to pay only for what is consumed while also supporting audits. Which cloud computing characteristic best explains this feature?","o":["Measured service","Broad network access","On-demand self-service","Resource pooling"],"a":[0],"e":"正確答案是 A。 測量服務，因為情境描述了一種核心雲特徵，即資源使用被計算、監測、控制和報告，從而能夠按現收現付賬單，支援問責制和可審計性。計量服務指雲提供商自動追蹤和量化 CPU/compute 時間，儲存容量，記憶體，網路頻寬等資源消耗的能力。 這種計量對雲經濟學至關重要:客戶根據實際使用而不是固定的，前期的基礎設施成本支付。在黑色星期五的背景下，需求暴漲而難以預測。 計量服務使得本組織可以在高峰購物時間增加資源，並在之後縮小規模，而計費仍與真正消費的消費掛鉤。 對於電子商務環境的成本控制來說，這一點尤為重要，因為過度提供高峰期的貨量將既昂貴又低效。此外，由於供應商詳細記錄使用情況，該組織可以內部進行收費/showback，核實發票，並儲存審計和合規審查的證據--所有證據都取決於準確的、顆粒的計量。為什麼其他選項不是最好的: 寬網存取描述透過網路的可用性和透過標準機制的存取(不是使用追蹤)。 On-request 自動服務指使用者提供資源整合是指多租戶整合提供方資源，按需求動態分配和重新分配(而不是計費/audit 計量功能)。因此，詳細追蹤計算時數、儲存使用和頻寬消費的特性最好透過計量服務加以解釋。","s":"term"},{"n":595,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"A penetration tester discovers that a system is infected with malware that encrypts all files and demands payment for decryption. What type of malware is this?","o":["Worm","Spyware","Keylogger","Ransomware"],"a":[3],"e":"勒索軟體加密使用者資料並勒索修復費。 CEH 覆蓋了勒索軟體，是系統駭客的主要威脅，凸顯出以加密為基礎的勒索是其定義行為。","s":"term"},{"n":596,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"A kernel-level rootkit is discovered. What is the safest remediation strategy?","o":["Power down immediately","Deploy honeypots","Full system format and reinstall","Use rootkit scanners and tailored removal"],"a":[2],"e":"CEH v13 將核心級 rootkits 確定為最危險的惡意軟體型別之一。由於它們執行在最低的 OS 級別，它們可以隱藏程序、檔案和系統呼叫。 CEH v13 宣告，唯一有保障的補救是從一個可信任的來源重新安裝完整的系統擦拭和清潔的 OS。試圖清除的風險是不完全消除的。單靠下放電並不能去除 Rootkit。 Honeypots 是用於偵測的，而不是補救的。 特製擷取工具可能在核心深度出故障。因此，選項 C 是正確的。"},{"n":597,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"You are part of a red team hired to assess the cybersecurity posture of a large retail chain headquartered in New York. The client wants to know whether their defenses can anticipate future attack patterns before they occur. To meet this objective, your team deploys an AI-enabled platform that analyzes previous breaches and anomaly data to forecast potential attack vectors. Which benefit of AI-driven ethical hacking is most critical in this case?","o":["Scalability","Predictive analysis","Enhanced reporting","Simulation and testing"],"a":[1],"e":"正確答案是 B。 預測性分析，因為使用者端的首要目標是在攻擊模式發生前預測未來攻擊模式，所描述的 AI-被啟用的平台被明確用於根據歷史破壞和異常資料預測潛在的攻擊向量。 在 CEH 對現代安全能力的相通覆蓋中，AI-驅動的方法透過學習大型資料集(日誌，警報，事件，威脅情報，和被觀察到的攻擊者行為)來識別趨勢，偵測弱訊號，並預測對手可能採取的最可能的下一步。 這直接支援主動防禦規劃，而不是純粹被動的反應。在這個假設中，平台攝取\"先前的違反和異常資料\"，併產生前瞻性的洞察力。 這就是預測分析的本質:應用機器學習/analytics 來估計在哪裡。襲擊可能會出現(例如，哪些資產風險最大，哪些戰術正在發展，哪些錯位與妥協相關，或哪些事件序列往往在入侵之前發生 )。 這有助於防禦人員優先控制、修補程式、監控和硬化，以提前打亂預計的攻擊路徑。 這也符合零售商使用者端的渴望，即知道他們的防禦是否能夠\"預見\"攻擊，而不僅僅是事後記錄攻擊。為何其他選項不正確:可擴充套件性是 AI(自動大規模分析)的優點，但它沒有專門處理預測未來攻擊向量。 強化報告可以改善結果的傳播方式，但這並不是描述的關鍵能力。 模擬和測試是指在環境中執行情境或自動測試以測量韌性；這可以被 AI-輔助，但即時關注分析歷史和異常資料來預測可能的攻擊，而這種資料最直接地對映到預測性分析。因此，AI-驅動的道德駭客在本案中最關鍵的優勢是預測性分析。","s":"term"},{"n":598,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"A regional investment firm in Denver, Colorado, recently migrated to a fully switched Ethernet infrastructure. During an authorized security evaluation, a consultant connected a test device to an access-layer switch and initiated a scripted network interaction. Within minutes, administrators observed irregular switching behavior. Frames that were normally delivered directly between specific workstations began appearing across multiple switch ports. Users reported brief connectivity instability, but no configuration changes were made to the switch. After the activity subsided, forwarding operations gradually stabilized. Based on the observed behavior, which sniffing technique was most likely performed?","o":["Switch Port Stealing","ARP Poisoning","MAC Flooding","DNS Poisoning"],"a":[2],"e":"正確答案是 C。 MAC 位址泛洪。該情境描述一個切換的網路開始表現像一個集線器，而訊框出現在多個交換器連接埠之間。 當交換器的 CAM 表被許多假 MAC 位址條目所淹沒時會發生這種情況。 一旦 CAM 表無法可靠地將目的地 MAC 位址對映到埠，交換器泛洪流量會流出多個埠。 CEH 嗅探材料解釋，MAC 位址泛洪隨機傳送 MAC 位址並用隨機 IP 位址對映來溢位 CAM 表。 當 CAM 表滿了時，交換器像一個集線器並廣播封包到所有埠，幫助攻擊者更輕鬆地嗅出封包。 另一個符合 CEH 的考試指南說明。 MAC 位址泛洪向 CAM 表傳送瞭如此多的 MAC 位址，使其無法跟上，有效地將交換器轉換為集線器。選項 A。 交換器連接埠 偷盜是不正確的，因為交換器連接埠 偷盜透過賽跑條件將目標對準了特定的被害者 MAC 至連接埠 對映。選項 B。 ARP 欺騙是不正確的，因為 ARP 欺騙操縱了 ARP 快取來透過攻擊者改變流量。選項D。 DNS 毒化是不正確的，因為 DNS 毒化操控了名稱解析，而不是交換器轉發行為。因此，最好的答案是 C。 MAC 位址泛洪。","s":"term"},{"n":599,"c":"系統入侵階段","ce":"System Hacking Phases","t":"long","q":"During a red team assessment of a mid-sized insurance provider in Denver, Colorado, testers established persistent access on an internal developer workstation after exploiting a misconfigured automation service. To sustain command-and-control without triggering perimeter defenses, they configured a low-bandwidth outbound channel designed to blend into infrastructure traffic that is routinely permitted through egress controls. Security operations later identified periodic outbound communication from the compromised host to a single unfamiliar external endpoint not associated with approved vendors or user activity. The traffic was distributed over time rather than bursty. Although the exchanges resembled legitimate service requests, packet inspection revealed irregular payload sizing and structured encoding patterns inconsistent with typical client behavior across the environment. What covert communication technique was most likely used to sustain the red team's access?","o":["ICMP Tunneling","TCP Sequence Tunneling","HTTP/S Tunneling","DNS Tunneling"],"a":[2],"e":"正確答案是 C。 HTTP/S 隧道通航。該情境描述了與合法服務請求相類似並設計透過正常相機控制的持續出行指令與控制流量。 HTTP 和 HTTPS 的流量通常被允許透過防火牆周邊，使 HTTP/S 地道具有很強的匹配性。 CEH 防火牆-避讓材料描述為透過封裝 HTTP 流量內的攻擊者資料來繞過防火牆限制的一種方法，允許活動透過允許的網路埠，例如:連接埠80.CEH 材料也描述了一個倒轉的 WWW 外殼在。 內部的主機使看起來合法的 HTTP 請求攻擊者控制的網路伺服器， 返回的回應中實際上包含命令，用於執行已損壞的 主機。選項 A。 ICMP 隧道的通路不正確，因為 ICMP 隧道通路使用ICMP 回聲請求/reply 流量，而非網路式服務請求。選項 B。 TCP 序列通透是不正確的，因為情境沒有描述在 TCP 序列欄位中隱藏資料。選項 D。 DNS 通道是不正確的，因為 DNS 通道通常作為不尋常的 DNS 查詢和編碼的子域而出現，而不是像網路服務一樣的 request/response 行為。因此，最好的答案是 C。 HTTP/S 隧道通航。","s":"term"},{"n":600,"c":"社交工程","ce":"Social Engineering","t":"long","q":"During a security penetration test at Sterling Manufacturing in Cleveland, Ohio, the ethical hacking team evaluates the company ' s physical security controls. On a chilly evening in July 2025, ethical hacker Priya Desai, posing as a facilities contractor, accesses the company ' s loading dock area after regular business hours. Behind the employee entrance, she comes across an unsecured maintenance container with discarded packaging, shipping labels, and shredded office material. Among the clutter, Priya retrieves a crumpled document listing temporary access codes for the employee break room, along with a partially shredded memo referencing an upcoming audit. The exercise tests whether sensitive information discarded improperly can be exploited. The next day, Priya uses the recovered access codes to enter the break room undetected during a shift change, logging her entry on a controlled test system to simulate a breach. What social engineering technique is Priya ' s exercise primarily simulating?","o":["Tailgating","Eavesdropping","Dumpster Diving","Shoulder Surfing"],"a":[2],"e":"這種情境主要模擬垃圾桶搜尋，因為關鍵動作是從被丟棄的材料中取回敏感資訊，然後滲透這些資訊取得。 在 CEH 社交工程覆蓋中，垃圾桶搜尋是一種物理資訊蒐集技術，攻擊者可以在此搜尋垃圾、回收箱、無擔保的處置容器或碎屑來尋找可以被利用的檔案和文物。 常見的目標包括存取碼、僱員目錄、列印的電子郵件、運輸標籤、發票、內部備忘錄以及部分被打碎的檔案 - - 即 Priya 在無擔保維護容器中找到的。 問題甚至強調“被丟棄的包裝 ”、 “ 發貨標籤 ”、 “被丟棄的辦公室材料 ”， 以及“列出臨時存取碼的快速檔案 ”， 這些都是典型的垃圾桶搜尋指標。後期使用回收的入室密碼是垃圾箱-潛水相的影響，但測試的主要社交工程技術是不當處置如何導致妥協。 牽引會涉及透過安全門追蹤被授權人員而無需適當認證。Eavesting 指的是監聽對話或通訊以取得敏感資訊。 肩上衝浪涉及在輸入認證資訊或檢視機密資料時對某人的螢幕或鍵盤進行視像觀察，其中沒有一個描述取得存取碼的初始方法。 符合 CEH 合的緩解措施包括:執行清潔辦公桌和安全處置政策，使用鎖入的處置箱，用安全的銷燬程式適當粉碎敏感檔案，培訓工作人員處理印刷資料，限制進入裝卸碼頭和廢物區。對處置做法進行定期審計和實物安全檢查，減少了襲擊者從垃圾中取得可用存取細節的可能性。","s":"term"},{"n":601,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"During which step of the incident response process would you be tasked with building the team, identifying roles, and testing the communication system?","o":["Containment","Notification","Preparation","Recovery"],"a":[2],"e":"正確答案是 C，“準備”。在事件應對生命週期中，準備是實際事件發生前的階段。這一階段的重點是透過制定事件應對計劃、組建事件應對小組、分配角色和責任、確定升級路徑，使組織做好有效應對準備。 CEH 事件管理材料將\"事件應對準備\"列為發現，分級，通報，封存，調查，消除，恢復，事後活動前的首個事件應對過程。 它還強調建立一個事件反應小組，確定入侵期間應聯絡的人，並界定溝通渠道。在發現事件後進行遏制，目的是限制損害。通知涉及通知受影響的使用者或利益攸關方。恢復恢復受影響的系統恢復正常執行。 由於建設團隊和測試溝通發生在事發前，正確的階段是\"準備\"。","s":"term"},{"n":602,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"A multinational corporation deploys a major internal tool built on a PowerShell-based automation framework. Shortly after a scheduled rollout, the IT team notices intermittent system slowdowns and unexplained bandwidth spikes. Despite running updated endpoint protection and restrictive firewall rules, traditional scanning tools report no malicious files on disk. However, internal telemetry flags a trusted process repeatedly executing obfuscated PowerShell commands in memory. The anomalous activity vanishes upon reboot and appears to leave no footprint behind on the system. Which type of malware is most likely responsible for this behavior?","o":["Worm","Trojan","Rootkit","Fileless Malware"],"a":[3],"e":"無檔案惡意軟體是最佳匹配，因為情節凸顯出記憶體-住家執行，沒有惡意檔案被寫入磁碟中，並且活動在重啟後會消失。在 CEH 相通的惡意軟體概念中，無檔案攻擊通常會利用合法系統工具和可信賴的過程，常被叫作\"生活出地\"來執行惡意邏輯而不會丟棄傳統的可執行檔案。 PowerShell 是用於此目的最常被濫用的元件之一，因為它可以在記憶體中直接下載，解碼，並執行指令碼，包括避去簡單的以簽名為基礎的掃描的被矇蔽的命令。 明確提示表示端點掃描器在磁碟上找不到惡意檔案，然而遙測偵測到一個可信任的程序，在記憶體中執行被忽略的 PowerShell 命令。該組合強烈表明沒有檔案的行為。異常點在重啟時消失的事實也符合依賴起伏性記憶文物而非持久以檔案為基礎的植入的無檔案技術。 雖然無檔案攻擊可以透過登錄跑鍵，預定任務，WMI 或其他機制來建立持久性，但問題強調沒有足跡並重新啟動清除活動，這與純粹的記憶起底點或短壽命的處決鏈一致。蠕蟲的特點是自相複製跨越系統，沒有描述。 A 木馬程式通常涉及偽裝成合法軟體的惡意檔案，與\"磁碟上沒有檔案\"的觀察相沖突。一個 Rootkit 透過修改系統內部而專注於隱蔽和隱藏，並可以持續，但情境的定義指標是 PowerShell 內膜執行和缺少磁碟文物，這最直接地與沒有檔案的惡意軟體相配合。","s":"term"},{"n":603,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"During an internal red team engagement at a software company in Boston, ethical hacker Meera gains access to a developer ' s workstation. To ensure long-term persistence, she plants a lightweight binary in a hidden directory and configures it to automatically launch every time the system is restarted. Days later, even after the host was rebooted during patching, the binary executed again without requiring user interaction, giving Meera continued access. Which technique most likely enabled this persistence?","o":["Scheduled Tasks","Creating a new service","Startup Folder","Registry run keys"],"a":[3],"e":"所描述的持久性--\"每次系統重新啟動時自動啟動\"，沒有使用者互動--最常見的是和 Windows 上的登錄 Run 金鑰對接。Run 金鑰是一種經典的持久性機制，攻擊者在其中新增一個值來引用其可執行到諸如HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\R un(per-user)或HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run(全系統)等位置的可執行性。 當 Windows 啟動( 當使用者的 登入時， 視金鑰而定) 時， 作業系統 自動處理這些條目並啟動引用的程式。 這在 reboots 中提供了可靠的持久性， 並且經常使用， 因為它簡單有效， 並與合法的啟動條目相混合。情境顯示 Meera 在隱藏目錄中放置了二進位， 並設定為重啟後自動啟動。 登錄基於自動執行符合該精確模式: 二進位可以停留在任何地方( 包括隱藏的資料夾)， 而 登錄 的切入點。 持久性存活下來， 而不需要攻擊者在場。鑑於措辭，其他選項為何不太可能:啟動資料夾(C)也可以自動啟動程式，但它通常意味著一個快捷鍵或可執行檔案放置在使用者的啟動目錄中，並且一般與使用者的登入行為相繫結。 問題強調\"系統每次重啟\"，並且最常在 CEH 上下文中被測試為登錄自動執行持續。排程工作(A)可以在啟動時或觸發時執行，是有效的持久性技術，但情境中並未提及任務排程，觸發，或任務設定。建立新服務(B)通常意味著安裝 Windows 服務，通常需要更高的權限，並呈現為管理服務；情境訊框是一個輕量級二進位並設定為自動發射的，它更自然地與跑鍵相配合。因此，最可能的持久性技術是 D。 登錄 Run 機碼。","s":"term"},{"n":604,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"A cybersecurity team at a cloud infrastructure provider in San Jose, California, initiated a structured vulnerability evaluation across its production environment. The scanning process began by identifying communication protocols active on each host. Once the protocols were cataloged, the platform analyzed which services were associated with those ports and dynamically selected only the vulnerability tests relevant to those detected services. The scanning logic adjusted automatically based on discoveries made during execution. Which vulnerability assessment approach is illustrated in this scenario?","o":["Inference-Based Assessment","Service-Based Solutions","Product-Based Solutions","Tree-Based Assessment"],"a":[0],"e":"正確答案是基於推論的評估。 CEH 弱點評估材料解釋，一些掃描方法並不是盲目地對主機進行每一項可能的測試。 相反，它們推斷出什麼是檢查。適合的，首先識別協定、埠和服務，然後動態選擇與這些發現相關的測試。該情境準確地描述了這一行為:平台目錄通訊協定，確定哪些服務與所觀測的埠相關，在執行過程中自動調整弱點測試。 這種推論驅動的邏輯可以提高效率並減少不必要的探險，因為掃描器會根據它發現的環境調整檢查。 基於服務和基於產品的用詞可能聽起來是合理的，但問題具體在於掃描邏輯和決定模型，而不是供應商提供的型別。 以樹為基礎的評估並不能最好地描述所呈現的序列。 CEH 指導使用以推論為基礎的評估來描述掃描器，這些掃描器利用在早期掃描階段所學到的資訊來逐漸地細化其動作。 由於測試的選擇取決於所發現的服務特性並隨著掃描的進行而適應，因此以推論為基礎的評估是最準確的答案。","s":"term"},{"n":605,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and loT Hacking","t":"mid","q":"You are Emma Rodriguez, an ethical hacker at SecurePath Solutions, hired to test the mobile application security of Sterling & Associates, a law firm in New York City. During a covert assessment, your objective is to simulate an attacker attempting to exploit vulnerabilities in the firm's client case management app. You discover that the app stores user credentials in plain text on the device, enabling you to extract sensitive client login information using a rooted device. Based on this finding, which OWASP Top 10 Mobile Risk are you identifying in the app?","o":["Insecure Communication","Improper Credential Usage","Inadequate Privacy Controls","Insecure Data Storage"],"a":[3],"e":"發現描述的地圖直接被描述到不安全的資料儲存。 在符合 CEH 的行動裝置安全指南和 OWASP 移動風險討論中，當移動應用程式以攻擊者可以輕易地回收的方式在當地儲存敏感資訊時，特別是從一個可以繞過沙箱保護的根部或斷層裝置上，就會發生不安全的資料儲存。 在純文字中儲存使用者名稱和密碼是一個高強度的例子，因為它允許立即取用帳戶，並允許存取受保護的使用者端記錄，案例筆記等機密材料。移動裝置通常會將應用軟體資料儲存在本機檔案系統、共享首選項、資料庫、日誌或快取內容中。如果敏感資料被儲存而沒有適當的保護，則攻擊者可以實際存取，惡意軟體，備份擷取能力，或 root 存取可以直接讀取。 CEH 材料強調，透過允許存取否則會受到限制的應用目錄和系統區域來根取取攻擊者的能力大幅提高。這正是情境顯示的:認證資訊一旦有 root 存取，就從裝置中恢復。最佳的緩解做法是永遠不要將認證資訊儲存於純文字。 使用安全的，OS-提供的儲存，如 Android Keystore 或 iOS Keychain 等，在可用時使用受硬體後置機制保護的金鑰來應用強的加密，將本機儲存的內容降到最低，並確保機密不會被寫入日誌或除錯文物。不安全的通訊將涉及薄弱的運輸保護，不合適的認證資訊使用可以包括硬碼認證資訊或差的認證處理，但這裡的具體問題是認證資訊的明顯不安全的區域性儲存，因此不安全的資料儲存是正確的選擇。","s":"term"},{"n":606,"c":"密碼學","ce":"Cryptography","t":"long","q":"Sarah, an ethical hacker at a San Francisco-based financial firm, is testing the security of their customer database after a recent data exposure incident. Her analysis reveals that the sensitive client information is safeguarded using a symmetric encryption algorithm. She observes that the algorithm processes data in 64-bit blocks and supports a variable key size from 32 to 448 bits. During her penetration test, Sarah intercepts a ciphertext transmission and notes that the encryption was developed as a replacement for DES, an older algorithm. She aims to determine if the algorithm's flexible key size could be susceptible to brute-force attacks. The algorithm is also noted for its use in secure storage, a critical application for the firm's data protection. Which symmetric encryption algorithm should Sarah identify as the one used by the firm?","o":["RC4","Twofish","AES","Blowfish"],"a":[3],"e":"Blowfish 是唯一符合所描述的所有技術特性的選項。在 CEH 密碼學概念中，對稱演算法通常按其結構(塊密碼與流密碼)，塊大小，以及支援鍵長來區分。問題說明演算法加密資料為 64 位塊，並支援從 32 位到 448 位不等的可變鍵大小，它被引入為替換用於 DES。 Blowfish 精確地說:它是一個對稱的區塊密碼器，有 64 位的區塊大小和從 32 到 448 位可設定的金鑰長度，設計在軟體中速度快，在歷史上定位為 DES 等更古老的密碼器的替代品。其他選擇與這些識別屬性不相匹配。RC4 是一個流碼，不執行於固定大小的塊上，因此不能匹配 64 位的塊要求。 AES 是一個塊碼，但使用 128 位的塊大小，固定鍵大小為 128,192,或 256 位，不是 32 到 448 位。 二魚雖然在歷史上作為後繼時代的設計相關，但也使用 128 位塊大小和固定鍵大小可達 256 位，因此兩者都不相匹配。從 CEH 角度，提及可變鍵大小也暗示了風險評估:任何密碼中鍵短可以蠻橫地強制使用，因此安全部署需要強大的鍵長選擇和恰當的金鑰管理。 此外，Blowfish 的 64 位塊大小由於塊相撞風險，在大容量的加密情境中可能是一個令人關切的問題，這就是現代系統經常偏好 128 位塊密碼來進行新的設計的原因。","s":"term"},{"n":607,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"During a red team simul-ation, an attacker crafts packets with malformed checksums so the IDS accepts them but the target silently discards them. Which evasion technique is being employed?","o":["Insertion attack","Polymorphic shellcode","Session splicing","Fragmentation attack"],"a":[0],"e":"CEH v13 將插入攻擊作為 IDS 逃避方法，攻擊者傳送封包時會刻意地進行設計，使 IDS 處理它們與目標主機不同。 在插入攻擊中， IDS-允許惡意流量與良性檢查結果相混合的封包看起來是合法的；而端主機則因檢查和錯，旗子無效，或協定不一致而拒絕或修改了封包。 因此，IDS 看到一集被重建的資料，而實際的主機處理一個不同的版本或者完全沒有。CEH 強調入侵偵測系統可能不會跟隨完整的 TCP/IP 堆疊驗證，使得它們容易被畸形或邊線相符合的封包所欺騙。 多型外殼碼(可選 B) 更改了酬載簽名，而不是封包結構。 工作階段 splicting(可選 C) 將酬載分出於封包以逃避圖案匹配，但並不依賴於校驗和操縱。 分解攻擊(可選 D) 將流量分為更小的碎片，而不是改變有效性欄位。 所描述的行為精確地適合插入攻擊。","s":"term"},{"n":608,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During an internal assessment, a penetration tester sends specially crafted TCP packets to a target system without initiating a standard three-way handshake. Packet captures show that when these probes reach closed ports, the host responds with a TCP RST segment. However, when the probes reach open ports, the host does not return any response. Further inspection of the probe structure reveals that the packets contain an uncommon combination of TCP control bits rather than a single flag. What scanning technique is being performed?","o":["FIN Scan","UDP Scan","TCP Connect Scan","XMAS Scan"],"a":[3],"e":"正確答案是 D。 XMAS Scan。 XMAS 掃描傳送了 TCP 封包的多面旗，通常為 FIN，URG，和 PSH。 在 RFC 793 風格的行為中，關閉的埠以 RST 回應，而開放的埠則經常不回覆。 CEH 掃描材料描述反向 TCP 旗掃描是用旗子如 FIN，URG 和 PSH 傳送 TCP 探測器。 它將帶有這些旗子的探測器確定為 XMAS 掃描並解釋關閉的連接埠用 RST 封包回應，而開口埠可能忽略或放下異常的封包組合。選項 A。 FIN 掃描是不正確的，因為一個 FIN 掃描只使用 FIN 旗，而情境則指定了多個 TCP 控制位的不尋常的組合。選項 B。 UDP 掃描不正確，因為探測器是 TCP 封包，而不是 UDP 封包。選項C。 TCP 連線掃描是不正確的，因為一個 TCP 連線掃描完成正常的三向交握。選項 D。 XMAS scan 是正確的，因為它使用多面 TCP 旗併產生所描述的 open/closed 行為。因此，最好的答案是 D。 XMAS Scan。","s":"term"},{"n":609,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A Python API allows unlimited file upload size. What attack is possible?","o":["DoS","XSS","SQLi","CSRF"],"a":[0],"e":"正確答案是 A，DoS。 如果一個 PythonAPI 允許無限檔案上傳大小，攻擊者可以上傳極大的檔案，或者反覆上傳許多檔案，直到伺服器資源用完為止。 這可以消耗磁碟空間，記憶體，CPU，應用程式工人執行緒，臨時儲存，或頻寬，導致API 或託管伺服器減速，崩潰，或成為合法使用者無法使用。 CEHWeb 應用程式安全指導強調驗證輸入，並應用內容型別檢查和惡意軟體掃描等檔案上載控制。 也注意到系統資源可能會被耗盡，比如透過填充磁碟空間，導致阻斷服務。 在CEHDoS 概念中，阻斷服務攻擊限制或阻斷了授權使用者存取系統資源；泛洪伺服器或耗盡的資源阻止了真正的請求服務。XSS 涉及指令碼注入，SQLi 目標資料庫查詢，並 CSRF 強制認證使用者執行行動。 這裡的問題是資源耗盡，所以 DoS是最好的答案。","s":"term"},{"n":610,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"An organization is performing a vulnerability assessment for mitigating threats. James, a pen tester, scanned the organization by building an inventory of the protocols found on the organization ' s machines to detect which ports are attached to services such as an email server, a web server or a database server. After identifying the services, he selected the vulnerabilities on each machine and started executing only the relevant tests. What is the type of vulnerability assessment solution that James employed in the above scenario?","o":["Tree-based assessment","Inference-based assessment","Product-based solutions","Service-based solutions"],"a":[1],"e":"正確答案是 B。 推論式評估。 在 CEH 弱點評估概念中，推論式評估從建立目標環境中發現的協定清單入手，然後測試者調查與這些協定相關的埠和服務，只進行與被發現的服務相關的測試。 這與情境完全吻合:詹姆斯識別的協定，對映埠到電子郵件，網路，和資料庫服務等服務，然後選擇適合每臺機器的弱點和測試。基於樹的評估是不同的，因為它對不同的元件或平台遵循不同的評估策略，例如 Windows 系統相對於 Linux 伺服器。 基於產品和服務的解決辦法是指弱點評估工具或服務是如何交付的，而不是協定-和-。這裡描述的由服務驅動的測試邏輯。因此，最好的 CEH 對齊的答案是基於推論的評估。","s":"term"},{"n":611,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"In a recent cybersecurity incident, Google's response team in the United States investigated a severe attack that briefly disrupted services and customer-facing platforms for approximately 23 minutes. Server logs recorded a sudden surge in traffic, peaking at 398 million requests per second, which caused active connections to drop unexpectedly. The attack was traced to numerous compromised devices, likely orchestrated through malicious tools promoted on social media. Based on this information, what type of attack was most likely executed against Google's infrastructure?","o":["SYN Flood Attack","TCP SACK Panic Attack","RST Attack","HTTP GET POST Attack"],"a":[3],"e":"HTTPGETPOST 攻擊是最有可能的答案，因為情境中的關鍵指標是測量單位和行為:每秒 3.98 億次請求。 在 CEH-對接DoS 和 DDoS 覆蓋中，像 SYN 泛洪這樣的量子網路層攻擊通常在封包每秒或位元每秒被討論，它們主要在第 3 層和第 4層被排出連線表或頻寬。相比之下，一款 HTTP 泛洪以第 7 層為目標，並且通常在請求中每秒被測量，因為攻擊者傳送了大量看來有效的網路請求。它覆蓋了網路伺服器，應用程式堆疊，以及逆向代理，負載平衡器，和 API 閘道器等上游元件，導致效能退化並下降工作階段，與\"主動連線意外下降\"時描述的完全相同。提及\"客戶-facing 平台\"和\"數字已損壞的裝置\"同樣符合典型的殭屍網路驅動的應用程式-layer 泛洪，其中許多分佈源生成了巨大的 HTTP 請求率來逃避簡單的 IP 基於阻塞。 一次 TCPSACK 的恐慌攻擊是一個與 TCP 處理相關的被觸發的崩潰狀態，而不是請求率突起的情境。 RST 攻擊涉及傳送 TCP 重置封包以拆卸工作階段，這通常不會在伺服器日誌中作為極端請求-每秒事件出現。因此，證據最有力地支援一個應用層的 DDoS:一個 HTTPGETPOST 泛洪，旨在耗盡伺服器和應用資源並造成間歇性服務中斷。","s":"term"},{"n":612,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester is investigating a web server that allows unrestricted file uploads without validating file types. Which technique should be used to exploit this vulnerability and potentially gain control of the server?","o":["Perform a SQL injection attack to extract sensitive database information","Upload a shell script disguised as an image file to execute commands on the server","Conduct a brute-force attack on the server ' s FTP service to gain access","Use a Cross-Site Scripting (XSS) attack to steal user session cookies"],"a":[1],"e":"CEH)教導說，不受限制的檔案上傳弱點是 Web 應用程式中最危險的，因為它們允許攻擊者繞過擴充套件檢查並上傳惡意可執行檔案。 當伺服器無法驗證 MIME 型別，檔案擴充套件，或執行權限時，攻擊者可以上傳被偽裝成無害檔案的網路外殼，如\"image.php.jpg\"，這可能會透過表面驗證，仍由伺服器的解碼器執行。 一旦執行， shell 向攻擊者提供命令執行能力，允許對系統進行全面控制。 CEH 強調，web shell 可以啟用特權。資料庫 折中， 橫向移動， 或完全的 伺服器 接收。 與 SQL 注入 或 XSS 不同， 檔案上傳開發會直接影響 伺服器 側執行， 使其嚴重得多。 在 CEH 實驗室中， 通常會測試不受限制的上傳缺陷， 如 Burp Suite， 以改變內容型別標頭或繞過 使用者端 側過濾器。這是一種影響大的弱點， 需要嚴格的驗證和沙箱控制。"},{"n":613,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"Which type of security feature stops vehicles from crashing through the doors of a building?","o":["Receptionist","Mantrap","Bollards","Turnstile"],"a":[2],"e":"正確答案是 C， Bollards。 Bollards 是旨在防止車輛進入禁區或撞入建築物、出入口、敏感設施或行人區的實際安全控制。它們通常安裝在政府大樓、資料中心、銀行、機場和其他關鍵基礎設施地點之外，以減輕車輛攜帶的威脅和車輛擅自進入。根據安全要求，柱子可以固定、可移動、可收回或加固以承受高影響相撞時在 CEH 實體安全概念中，組織使用預防性實物控制來保護人員，裝置和設施不被未經授權的進入和人身攻擊。 Bollards 被認為是周邊安全控制，因為它們在車輛和被保護資產之間製造了物理屏障。 一個接待員提供行政存取控制但不能實際阻止車輛。 人馬圈是用來限制和核實人員進入的出入控制室；轉彎控制行人行走並有助於防止尾行；由於問題特別涉及阻止車輛從建築門撞入，因此，彈道板是最適當和最有效的安全特徵。答案: C","s":"term"},{"n":614,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"In ethical hacking, what is black box testing?","o":["Testing using only publicly available information","Testing without any prior knowledge of the system","Testing with full system knowledge","Testing knowing only inputs and outputs"],"a":[1],"e":"根據 CEH v13,黑匣子測試是指道德駭客對系統內部結構，原始碼或設定沒有事先了解的測試方法。攻擊者模擬出一個真實世界的外部攻擊者，完全依靠發現和開發技術。白盒測試 = 完全瞭解灰盒測試=部分知識"},{"n":615,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"While simulating a reconnaissance phase against a cloud-hosted retail application, your team attempts to gather DNS records to map the infrastructure. You avoid brute-forcing subdomains and instead aim to collect specific details such as the domain's mail server, authoritative name servers, and potential administrative information such as serial number and refresh interval. Given these goals, which DNS record type should you query to extract both administrative and technical metadata about the target zone?","o":["TXT","MX","NS","SOA"],"a":[3],"e":"正確答案是 D。 SOA。 SOA，即\"權威起步\"，記錄為 DNS 區識別了主名伺服器，幷包含了該區的重要行政和技術資訊。CEH 偵察參考文獻稱，SOA 記錄為主名伺服器，幷包含負責 DNS 記錄的伺服器主名與域基本屬性。 SOA 記錄還提供了區後設資料，包括:來源 主機聯絡電子郵件序號重新整理時間重試時間過期時間 TTL。這些細節符合問題的要求，即確定行政和技術的 DNS 後設資料，例如序號和重新整理間隔。選項 A。 TXT 是不正確的，因為 TXT 記錄通常儲存任意的文字值，如 SPF，DKIM，DMARC，所有者驗證等政策資料，它們不提供序號或重新整理間隔等區域權威後設資料。選項 B。MX 是不正確的，因為 MX 記錄為某個域識別郵件交換伺服器，但它們沒有提供完整的區域管理細節。選項 C。 NS 是不正確的，因為 NS 記錄識別了權威名稱伺服器，但它們不包括序號，重新整理時間，重試時間，過期時間，或 TTL 值。選項 D。 SOA 是正確的，因為它既提供了權威的 DNS 資訊，也提供了 DNS 偵察期間所需的行政區參數。因此，最好的答案是 D.SOA。","s":"term"},{"n":616,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"You are investigating unauthorized access to a web application using token-based authentication. Tokens expire after 30 minutes. Server logs show multiple failed login attempts using expired tokens within a short window, followed by successful access with a valid token. What is the most likely attack scenario?","o":["The attacker captured a valid token before expiration and reused it","The attacker brute-forced the token generation algorithm","The attacker exploited a race condition allowing expired tokens to be validated","The attacker performed a token replay attack that confused the server"],"a":[2],"e":"CEH Web 應用安全模組解釋，當系統不適當地處理同時請求時會出現競爭條件，導致出乎意料的行為。 在基於符號的認證系統中，權杖過期檢查和驗證邏輯之間的同步性差，可以使攻擊者利用計時弱點。所觀察到的模式是，使用過期的標誌的嘗試失敗，然後是成功的進入，建議攻擊者利用一種競爭條件，即申請的標誌狀態不一致。選項 C 是正確的。選項 A不涉及過期代幣。選項 B 對於安全標誌式的 en 非常不切實際。選項 D 通常在不重複失敗的情況下取得成功。 CEH 強調競爭條件是微妙而危險的邏輯缺陷。"},{"n":617,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"A corporation uses both hardware-based and cloud-based solutions to distribute incoming traffic and absorb DDoS attacks, ensuring legitimate requests remain unaffected. Which DDoS mitigation strategy is being utilized?","o":["Black Hole Routing","Load Balancing","Sinkholing","Rate Limiting"],"a":[1],"e":"CEHDDoS 緩解戰略部分解釋道，負載平衡分配多個伺服器或基礎設施元件的流量，以防止任何單一資源被超載。透過使用硬體負載平衡器和以云為基礎的流量分配，各組織可以:大量攻擊流量維持服務供應確保合法使用者得到服務選項 B 是正確的，直接匹配了 CEH 的定義。選項 A 將減少所有流量，包括合法請求。選項 C 的重點是流量分析，而不是分佈。選項 D 限制流量，而不是分發。 CEH 強烈建議將負載平衡作為 DDoS 韌性的核心機制。","s":"term"},{"n":618,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"A municipal data center in Phoenix, Arizona, deploys a network intrusion detection system to monitor traffic entering its public records portal. During a scheduled red team exercise, authorized testers successfully exploit a vulnerable web service and gain restricted administrative access. Post-exercise review reveals that the IDS generated a high-severity alert precisely at the time the exploit traffic reached the server. Log correlation confirms that the alert corresponded directly to the malicious activity performed during the test window. How should this IDS outcome be classified?","o":["False Negative","True Positive","False Positive","True Negative"],"a":[1],"e":"正確答案是 B。 真實的正數。當安全控制正確識別出惡意或未經授權的活動為惡意活動時，出現真正的正值。 在這種情境中，紅隊的開發在授權測試範圍內是真實的，IDS 生成了警報，日誌相關確認該警報與被開發流量相符。 符合 CEH 的IDS 材料解釋，IDS 對流量發出警告時，如果不是惡意的，則發生誤判；而漏判對 IDS 未能發出警報時，即使入侵未遂，也發生漏判。與此相反，這一案件既不是誤判，也不是漏判，因為警報準確，與實際開採活動相符。選項 A。 漏判是不正確的，因為 IDS 沒有錯過攻擊。 C.誤判選項不正確，因為警報並非由良性流量所觸發。選項 D。 True Native 是不正確的，因為真正的負值意味著沒有發生攻擊，也沒有產生警報。因此，最好的答案是 B。 真實的正反。","s":"term"},{"n":619,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"short","q":"A tester evaluates a login form that constructs SQL queries using unsanitized user input. By submitting ' C ' ll- T; --, the tester gains unauthorized access to the application. What type of SQL injection has occurred?","o":["Tautology-based SQL injection","Error-based SQL injection","Union-based SQL injection","Time-based blind SQL injection"],"a":[0],"e":"這個問題描述了一個經典的例子，即\"陶道學-基於 SQL 注入\"，是 SQL 注入攻擊的一個子類，屬於 CEH 課程中的 Web應用程式入侵。在基於同義詞的 SQL 注入中，攻擊者注入出一個總是評價為真實的 SQL 碎片，從而繞過身分驗證機制。string 'C ' ll-T；-是一個畸形變體，可能意為\"OR ' 1\"=\"1\"；-，這是最基本且被廣泛承認的同義詞類注入有效酬載之一。 當被注入到一個脆弱的 SQL 查詢中時，這種輸入會操縱查詢的 WHERE 條款，這樣無論原始條件如何，它總是會評價為真實。事情是這樣的:若 SQL 查詢為:SELECT *FROM 使用者 WHERE 使用者名稱=\"$使用者名稱\"AND 密碼\"=\"$密碼\"； 2。而攻擊者的投入:\" OR \" 1 \" = \" 1 \"； --查詢內容為:SELECT *FROM 使用者 WHERE 使用者名稱=\"OR\"1\"； --\"AND 密碼=\"；其結果是:SELECT *FROM 使用者 WHERE '1'=\"1\"； 2。它總是評價為真實，從而繞過認證，允許未經授權的存取。這種方法不依賴於錯誤訊息( Error- Based)， 計時延遲( Time- Blind)， 或 UNION 語句( Union- Based)。 它的目標是在查詢結構內部利用布林語的操縱來利用邏輯。根據 EC-Concil's CEH v13 Module: Web 應用程式入侵，理解以同義詞為基礎的注入至關重要，因為它是攻擊者在安全性差的 Web 應用程式上繞過登入表的最常見的方法之一。","s":"term"},{"n":620,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"A compromised endpoint communicates with C2 using DNS queries. What system-level indicator exists?","o":["DNS anomalies","Memory leaks","CPU spikes","Disk usage"],"a":[0],"e":"正確答案是 A， DNS 異常。 當一個遭入侵的端點 使用 DNS 查詢與命令控制伺服器 進行通訊時，最相關的指標是異常DNS 行為。在 CEH 類事件偵測中，分析師將端點 和網路遙測關聯，以識別可疑的通訊模式。 DNS 基於 C2 可能作為重複的發信標，異常長的網域名稱，過度的 TXT 查詢出現。 請求新註冊或可疑域，高查詢量，或不符合正常基線行為的DNS 流量。 CEH 材料討論隱蔽隧道，其中命令可以隱藏在 DNS 名稱查詢/reply 流量內， 使其看起來像普通的協定流量到網路工具。 IDS/monitoring 概念也強調異常偵測，透過將活動與基線進行比較並調查異常行為。 記憶洩漏，CPU 突起，以及磁碟使用在一些惡意軟體案件中可能發生，但它們沒有具體表示以 DNS 為基礎的 C2。 因此，這種情境的最佳指標是 DNS 異常。","s":"term"},{"n":621,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a red team assessment at Alpine Manufacturing Corp., network security consultant Marcus Lee is instructed to evaluate the security of internal communications within their switched LAN environment. Without altering any switch configurations, Marcus manages to intercept credentials being transmitted between a payroll administrator's workstation and the backend authentication server. He subtly reroutes the communication path through his testing machine, though no proxy or VPN was involved. Analysis shows the redirection was achieved by injecting crafted messages that silently altered how the two hosts identified each other on the local network. Which sniffing technique did Marcus most likely use?","o":["DNS Spoofing","Switch Port Stealing","ARP Spoofing","MAC Flooding"],"a":[2],"e":"被描述的行為精確地與 ARP 欺騙，又名 ARP 欺騙，一種被廣泛覆蓋於 CEH 材料中的普通人-中層攻擊技術。 ARP 在OSI 模型的第 2 層執行，負責將 IP 位址對映到一個區域性網路中的 MAC 位址。 由於 ARP 缺乏身分驗證機制，任何主機都可以向 LAN 上的其他裝置傳送被偽造的 ARP 回覆。在此情境下，馬庫斯注入了改變兩個主機如何識別的被設計出的資訊，這強烈表明偽造的 ARP 回覆同時被傳送到發薪工作站和認證的伺服器。 透過告訴每個系統他的機器的 MAC 位址對應對方的 IP 位址，馬庫斯自己在兩個端點之間邏輯地定位。 因此，流量透過他系統的透明路線，不需要更改交換器設定，代理，或 VPN 地道。這種方法可以攔截並潛在地修改正在過境的認證資訊。 DNS 欺騙影響網域名稱名稱解析，而不是直接層 2 主機識別。 MAC 位址泛洪溢位交換器 CAM 表強迫廣播行為，但不具體地操縱兩個目標主機之間的 IP-MAC 對映。 交換器連接埠竊取目標 MAC 表格條目，但並不依賴以 ARP 欺騙同樣的方式改變主機身分對映。因此，ARP 欺騙是本情境中描述的最準確的技術。","s":"term"},{"n":622,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"During a red team exercise at a financial services firm in Phoenix, Arizona, an ethical hacker sends a phishing email with a disguised attachment to employees. The purpose is to transmit the payload into the environment so later attack steps can proceed. In the cyber kill chain model, which phase does this represent?","o":["Reconnaissance","Exploitation","Delivery","Weaponization"],"a":[2],"e":"在\"網路殺人鏈\"中，\"交付\"是攻擊者將武器化的酬載傳送到目標上的相相。 劇情描述紅隊\"以變相附件傳送一款被打爆的郵件\"，具體\"將酬載傳送到環境中，以便後期攻擊步驟可以進行\"，這正是\"交付\"的目的:透過電子郵件附件，連結，驅動下載，USB 下放等選擇的向量將惡意內容提供給被害者，或者透過其他傳輸機制。這與武器化不同， 武器化是 當攻擊者準備了酬載-將開發與惡意戰車/RAT 合併時 或製造惡意檔案/attachment。 一旦武器化， 攻擊者必須送去， 費城的郵件本身就是送去的 附件中是已交付的物件。 下一階段一般包括開發(在使用者開啟附件時觸發開發)、安裝(建立mARWARE/persistence)、命令與控制和關於目標的行動)。為什麼其他選項不匹配 :偵察(A) 正在蒐集目標(人員、基礎設施、技術)的資訊。傳送任何東西。武器化(D)是建立/preparing 的惡意附著和弱點利用，而不是傳送。弱點利用(B)是交付的內容成功觸發弱點或執行程式碼(例如，受害人開啟附著物並進行弱點利用時)的時刻。由於描述的動作是實際透過菲斯海克電子郵件傳輸酬載，因此殺鏈相是 C。 Production。","s":"term"},{"n":623,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester discovers that a web application is vulnerable to Local File Inclusion (LFI) due to improper input validation in a URL parameter. Which approach should the tester take to exploit this vulnerability?","o":["Conduct a brute-force attack on the admin login page to gain access","Inject SQL commands into the URL parameter to test for database vulnerabilities","Perform a Cross-Site Scripting (XSS) attack by injecting malicious scripts into the URL","Use directory traversal to access sensitive files on the server, such as /etc/passwd"],"a":[3],"e":"當一個 Web 應用程式將使用者提供的輸入輸入納入檔案處理功能而未進行適當的消毒時，就會產生本機檔案包含的弱點。CEH 課程軟體強調攻擊者可以利用目錄的轉錄序列(如././)來逃避預定的目錄結構並存取敏感的本機檔案。 LFI 酬載在Linux 上像/etc/passwd 這樣常用的目標系統檔案來取取使用者資訊或使攻擊進一步升級。"},{"n":624,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"An attacker gained escalated privileges on a critical server. What should be done FIRST to contain the threat with minimal disruption?","o":["Engage a forensic team immediately","Power down the server and isolate it","Monitor, analyze, and then isolate the server","Conduct a vulnerability scan on all servers"],"a":[2],"e":"CEH v13 遵循事件反應生命週期，該週期在遏制前優先進行識別和分析，除非有直接的災難性損害風險。 在這種情境下，攻擊者已經提升了特權，但組織仍然需要了解正在採取什麼行動，哪些系統受到影響，以及是否正在發生橫向移動。備選方案 C 與 CEHv13 最佳做法保持一致。即時監測和檔案使分析人員能夠:確定攻擊者的技術和工具儲存多變的證據瞭解範圍和影響實施目標明確的遏制措施立即切斷伺服器(備選方案 B)的動力可能會破壞不穩定的法醫證據，並不必要的干擾服務。 聘請法醫小組(備選方案 A)很重要，但未經初步分析就為時過早。進行弱點掃描(備選 D)不會解決主動威脅。CEHv13 強調，知情封禁比被動關閉更有效，因此，選項 C 是正確的。"},{"n":625,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"During a black-box security assessment of a large enterprise network, the penetration tester scans the internal environment and identifies that TCP port 389 is open on a domain controller. Upon further investigation, the tester runs the ldapsearch utility without providing any authentication credentials and successfully retrieves a list of usernames, email addresses, and departmental affiliations from the LDAP directory. The tester notes that this sensitive information was disclosed without triggering any access control mechanisms or requiring login credentials. Based on this behavior, what type of LDAP access mechanism is most likely being exploited?","o":["LDAP over SSL (LDAPS)","Authenticated LDAP with Kerberos","Anonymous LDAP binding","LDAP via RADIUS relay"],"a":[2],"e":"CEH 偵察和列舉模組解釋，LDAP 服務通常支援匿名繫結，除非明確禁用。 匿名繫結允許未經身分驗證的使用者查詢某些目錄屬性，這可以導致使用者名稱的披露，組織層級，電子郵件位址--用於密碼攻擊，打網打網運動，和權限提升規劃的關鍵資訊。 在所描述的情境中，測試者在未提供任何認證資訊的情況下取得了目錄資料，證明匿名繫結權限是啟用的。LDAPS 需要 TLS 加密和認證，這與所觀察到的存取相矛盾。 Kerberos 認證授權有效認證資訊。 LDAP 透過 RADIUS 用於認證整合，而不是用於資訊披露。由於查詢成功時未經身分驗證，也沒有觸發存取控制，這與 CEH 對匿名 LDAP 繫結的描述完全一致。","s":"term"},{"n":626,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"A digital publishing firm in Charlotte, North Carolina, noticed suspicious probing activity against its public website. To proactively assess exposure, the security team initiated a focused scan of the company ' s HTTP servers. The chosen tool examined server headers, identified installed web server software through file signatures and favicon analysis, checked for outdated components, and searched for potentially dangerous files and misconfigurations. The scan also supported SSL connections and generated exportable reports in multiple formats for documentation. Which vulnerability assessment tool most closely aligns with the capabilities described?","o":["OpenVAS","Nessus","Qualys VM","Nikto"],"a":[3],"e":"正確答案是 Nikto。 CEH 網路伺服器安全覆蓋將 Nikto 識別為專門的開源網路伺服器弱點掃描器，旨在評估 HTTP 和HTTPS 對危險檔案的服務，不可靠的預設內容，過時的伺服器版本，以及版本特有的問題。 設想方案提到檢查伺服器頭，偵測已安裝的網路伺服器軟體，檢查已過時的部件，識別危險檔案和錯位，SSL 支援，以及可出口報告。 這些特徵與Nikto 在 CEH-style 網路伺服器評估中的典型用法緊密相聯。 OpenVAS，Nessus，和 Qualys VM 是廣泛的弱點管理平台，企業覆蓋面要廣得多，但問題描述的是一臺有重點的 HTTP-伺服器掃描器，而不是全光譜基礎設施掃描器。 CEH 經常使用的材料。將 Nikto 放在 web 伺服器 列舉 的背景中，並在測試者確定目標網路平台後發現弱點。它特別有助於快速檢查已知風險檔案、弱設定和過時軟體的網際網路介面伺服器。因為評估以網頁伺服器的特定曝光率為中心，並匹配公認的Nikto 功能集，所以選項 D 是最好的答案。","s":"tool"},{"n":627,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"mid","q":"At Redwood Financial Group in Boston, Massachusetts, the security leadership team is formalizing a continual security strategy composed of four coordinated activities. During implementation planning, one team is assigned responsibility for reviewing operational data across the enterprise environment to recognize irregular patterns that may indicate malicious activity. Within this model, which activity is responsible for this responsibility?","o":["Predict","Protect","Respond","Detect"],"a":[3],"e":"正確答案是 D。 偵測。描述的活動是對企業業務資料進行持續審查，以識別可能顯示惡意活動的不規則模式，這是一種偵測功能。 符合 CEHIDS 材料解釋出入侵偵測系統會監視封包並試圖發現攻擊者是否試圖闖入一個系統或導致阻斷服務條件。 它還將異常偵測描述為測量活動基線，如 CPU 利用率，磁碟活動，使用者登入，以及檔案活動，從而可以識別異常行為。選項 A。 預測是不正確的，因為預測的重點是預測風險和可能的威脅。選項 B。 保護是不正確的，因為保護的重點是減少攻擊的可能性或影響的保障措施和控制措施。選項 C。 反應不正確，因為反應發生在發現某一事件或事件後。選項 D。 偵測是正確的，因為小組正在監測資料，以查明可疑或異常行為。因此，最好的答案是 D。 Detect。","s":"term"},{"n":628,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"You are an ethical hacker at Northpoint Assessments, engaged to map the wireless footprint around Harborview Plaza in San Francisco, California. To enumerate nearby networks and prompt devices to reveal SSIDs and capabilities, you actively send crafted management frames from your laptop and log each AP ' s immediate responses (including probe responses and capability information), rather than only listening for broadcasts. Based on the described activity, which Wi-Fi discovery technique are you performing?","o":["Network Discovery Software","Passive Footprinting","Wash Command","Active Footprinting"],"a":[3],"e":"描述的活動是主動的足跡，因為您不僅僅是在監聽無線廣播；您正在傳輸 802.11 管理訊框以取得回應並蒐集資訊。在Wi-Fi 偵察中，被動方法依賴於監測信標訊框和其他自然發生的流量。 相比之下，主動的方法是故意與環境相互作用--通常是透過發出探測請求或其他管理訊框--以迅速進入點或使用者端裝置，以詳細回應，如 SSID，支援的資料率，安全能力等參數。該情境明確表明您\"主動傳送已設計的管理 訊框\"，然後是日誌\"即時回應(包括探測回應和能力資訊)\"，這就是主動和被動無線足跡的決定性區別。 活足跡可以單獨透過信標揭示出可能看不見的 SSID(例如，在信標中沒有廣播 SSID 的網路仍然在某些條件下可以回應)，它可以透過強迫回應來加快發現速度，而不是等待定期廣播或使用者端活動。為什麼其他選項不準確:被動地足跡(B)與情境相矛盾，因為被動地偵察不涉及從審計員的裝置。 Wash command (C) 指一個特定的工具/command，一般與 WPS 列舉工作流程相接，而不是在此被問起的一般技術分類。網路發現軟體(A)過於通俗；問題在於要求技術(活動與被動性)，所描述的行為明顯是活動。因此，正確答案是 D。 Active Footprinting。","s":"term"},{"n":629,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"While auditing legacy network devices at a public hospital in Miami, Jason, a penetration tester, needs to verify what SNMP traffic is leaking across the internal segment. Instead of running structured queries, he decides to capture live network traffic and manually review the protocol fields. This method allows him to see SNMP requests and responses in transit but requires manual parsing of OIDs, community strings, and variable bindings. Which method should Jason use in this situation?","o":["Nmap","Wireshark","SnmpWalk","SoftPerfect Network Scanner"],"a":[1],"e":"傑森的目標是在電線上捕獲活的 SNMP 流量並手動檢查協定欄位，如社群字串，OID，以及請求和回應中的可變繫結。所描述的方法有封包擷取和協定分解法，這正是 Wireshark 為.Wireshark 設計的方法，可以從一個介面(或從映象/SPAN連接埠)中擷取流量，並解碼 SNMP 在協定級別，在人可讀結構中呈現出 SNMPPDU。 這使評估員能夠檢視SNMPGET/GETNEXT/GETBULK 請求、SET 操作(如果有的話)和答覆，包括傳送的識別符和值，這些識別符和值可用於核實敏感 SNMP 資料是否在過境時被暴露。該情境明確宣告傑森沒有執行結構化查詢，而是想觀察\"SNMP 請求和在中轉中的答覆\"，這排除了積極查詢裝置的工具。 SnmpWalk (C)是一個。活動列舉工具，使用社群字串查詢 SNMP 代理，走MIB 的子樹；與被動流量檢查相反。 Nmap(A)可以掃描埠並執行一些 SNMP 相關的指令碼，但它仍然作為活動偵測工具執行，而不是現場流量捕獲和手動實地審查平台。 SoftPerfect Network Scanner(D)是用於識別主機和服務的一種網路發現工具；它不是一個封包級封包嗅探器，意在解析電線上 SNMP 訊息。此外，\"人工解析\"的提法與封包分析工作流程一致:儘管 Wireshark 解碼為 SNMP，分析師仍需要解釋 OID 和值的含義，將請求與回應聯絡起來，並評估靈敏度(例如SNMPv1/v2c 中的社群字串沒有加密，被捕獲的流量可能揭示出它們)。因此，正確的方法為 B。 Wireshark。","s":"tool"},{"n":630,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester discovers that a web application is using outdated SSL/TLS protocols (TLS 1.0) to secure communication. What is the most effective way to exploit this vulnerability?","o":["Conduct a Cross-Site Scripting (XSS) attack on the application","Use a man-in-the-middle (MitM) attack to intercept and decrypt traffic","Perform a brute-force attack on the SSL/TLS handshake","Execute a SQL injection attack on the application ' s backend"],"a":[1],"e":"過期的 加密 協定 諸如 SSL 3.0 等 和 TLS 1.0 含有許多密碼缺陷， 讓他們容易被降級攻擊， 密碼的精密弱點， CEH 解釋到，弱小的 SSL/TLS 設定使加密流量暴露出中間人攻擊。 因為攻擊者可以利用弱點 諸如 BEAST， POODLE，。 或微弱的密碼來解密 或操縱在途資料。 這些缺陷會損害機密性和完整性，使得攻擊者能夠觀察登入認證資訊，工作階段識別碼，或敏感資訊。 XSS 和 SQL 注入利用與加密強度無關的完全不同的網路弱點。 Brute-forcing SSL 握手在計算上不可行，也不相關。 因此，以過時的協定為目標的 MitM 攻擊是最有效的開發方法。"},{"n":631,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"long","q":"At a digital marketing firm in Atlanta, Georgia, employees began reporting that access to a widely used cloud collaboration portal was intermittently redirecting them to a counterfeit interface hosted on an unfamiliar IP address. Security engineers observed that when multiple users across different departments attempted to access the legitimate domain, they consistently received the same incorrect IP resolution. The anomalous behavior persisted across sessions and affected numerous internal clients until the organization ' s name resolution service was restarted, after which normal resolution resumed. What DNS manipulation technique best explains this scenario?","o":["Performing Intranet DNS Spoofing within the local network","Injecting malicious records through DNS Cache Poisoning","Executing Proxy Server DNS Poisoning to alter resolution paths","Conducting Internet DNS Spoofing from a remote network"],"a":[1],"e":"正確答案是 DNS 快取中毒。 CEH 網路安全材料解釋出:快取中毒發生。 當一個 DNS 伺服器被騙入將欺詐名稱至 IP 的對映儲存在其快取中時。 一旦被下毒的條目被快取， 許多使用者查詢 DNS 服務得到相同的虛假解析度，直到快取被衝出，過期， 或服務重新啟動。 直接對映到情境: 多重內部用戶端得到一個合法域的同樣不正確的 IP 位址，在組織名稱解析服務重啟後，問題就消失了。 內聯網 DNS 欺騙一般涉及在 LAN 上進行區域性擷取並非常快地被偽造迴音，而代理伺服器DNS 毒化更改瀏覽器-側代理行為，而網際網路 DNS 欺騙通常涉及改變主機的 DNS 設定或將其重定向到惡意解析器上。許多使用者的堅持和 DNS 服務重啟後的恢復是最重要的線索，因為它們表明解析器本身有被中毒的快取記錄，而不是孤立地進行端點篡改。 CEH 指導強調 DNS 快取中毒可以默默地將使用者轉向假冒系統，同時看起來可以正常地解決合法的網域名稱。"},{"n":632,"c":"密碼學","ce":"Cryptography","t":"long","q":"A multinational payment processor conducts a long-term risk assessment to evaluate the durability of its encrypted archives against future computational advances. Internal analysts warn that if large-scale quantum computers become operational, currently deployed public-key schemes protecting stored customer data may become vulnerable to rapid key recovery. To maintain long-term confidentiality of archived financial records, the security architecture team must implement a defensive strategy that directly addresses cryptographic resilience rather than relying solely on network segmentation or development policy controls. Determine the most appropriate mitigation to protect stored data against quantum-enabled decryption capabilities.","o":["Use quantum-specific firewalls to protect quantum communication channels","Break data into fragments and distribute it across multiple locations","Encrypt stored data with quantum-resistant algorithms","Include quantum-resistance checks in SDLC and code review processes"],"a":[2],"e":"正確答案是 C。 以抗量子演算法加密所儲存的資料。這個問題要求緩解直接解決儲存資料的加密復原力。 如果未來的量子電腦能夠打破目前部署的公用金鑰計劃，那麼適當的防禦就是將受保護的資料和金鑰建立設計轉移到量子後或耐量子加密演算法。 CEH 密碼學材料解釋道，密碼學攻擊試圖取回加密金鑰，而弱的加密演算法對密碼學攻擊的抵抗力可能不夠強。 在這個假設中，風險不是網路曝光或編碼操作不良；而是密碼學演算法本身的未來強度。選項 A。 使用量子特異性的防火牆是不正確的，因為防火牆不能保護已經加密的檔案不被加密解密金鑰回收。備選辦法 B。 將資料外洩成碎片並分佈於多個地點，可減少濃度風險，但是它並不能解決一個加密演算法的弱點，它容易受到量子密碼分析的影響。選項 D。在 SDLC 中包含量子-抗逆檢查，程式碼審查程式作為一種治理實踐是有用的，但除非密碼學實際被更改，否則它不會直接保護被儲存的檔案。選項 C。 以量子耐力演算法加密所儲存的資料是正確的，因為它直接減輕了未來的解密風險。因此，最好的答案是 C。 以抗量子演算法加密所儲存的資料。"},{"n":633,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"During a covert assessment at a logistics company in Dallas, penetration tester Emily delivers a disguised attachment to test employee awareness. When a staff member opens the file, normal content appears, but behind the scenes the attacker quietly gains full access to the workstation. Over the following week, Emily monitors emails, keystrokes, and local files without alerting the user, confirming long-term stealthy control of the machine. Which type of malware is most likely responsible for this activity?","o":["Remote Access Trojan (RAT)","Botnet","Adware","Spyware"],"a":[0],"e":"描述的活動最符合遠端存取木馬程式(RAT)。 RAT 的設計為攻擊者提供遠端，隱蔽，持續控制被破壞的系統。 情境明確規定，在附件開啟後，攻擊者獲得\"完全進入工作站\"，然後監測器。電子郵件、按鍵中鍵和本機檔案在較長的時間內不提醒使用者。 這種組合 - 遠端控制加長期隱形監控 - 適合 RAT 的典型能力， 通常包括按鍵日誌、 檔案瀏覽/exfiltration、 螢幕捕獲、 命令執行以及維持持久性。雖然間諜軟體也可以監測鍵盤和使用者活動，但間諜軟體通常被描述為專注於監視和資料蒐集，而不是提供廣泛的互動式遠端管理。情境強調\"完全存取\"和持續的控制，這比單是間諜軟體更具有 RAT 的特徵。在許多現實世界中，RAT 中包含間諜軟體等特徵；然而，當被問到哪一種惡意軟體型別最能匹配全遠端控制和隱形監控時，RAT 是最強的匹配。為何其他選項不合適 :殭屍網路(B)是指一個被感染的系統(bots)作為一個組被控制的網路，常用於 DDoS，垃圾郵件，或分散式操作。 情境側重於一個單一的工作站被遠端控制並被監控。 Adware(C)專注於為營銷目的提供廣告和追蹤；它與隱蔽的全程存取和認證資訊監控不相適應。 Spyware(D)在監視上重疊，但從本質上講，這並不意味著全面遠端管理和控制 RAT 的操作方式。因此，最可能的惡意軟體型別是 A。 Relect Access 木馬程式 (RAT)。","s":"term"},{"n":634,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"Which tool is best for sniffing plaintext HTTP traffic?","o":["Nessus","Nmap","Netcat","Wireshark"],"a":[3],"e":"Wireshark 是被覆蓋於 CEHv13 網路嗅探中的主要封包嗅探工具，它捕捉並分析活流量，允許分析員檢視明文 106 封包。Nessus 是一款弱點掃描器，Nmap 用於掃描，Netcat 是網路工具。 無一提供協定-級別檢查，如 Wireshark。因此，選項D 是正確的。","s":"tool"},{"n":635,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"short","q":"Which best describes the role of a penetration tester?","o":["Unauthorized malicious hacker","Malware distributor","Authorized security professional who exploits vulnerabilities","Malicious code developer"],"a":[2],"e":"在 CEH v13 資訊安全與道德駭客概論中，一款滲透測試人員被定義為被聘請來模擬現實世界攻擊的可信賴，授權的資安專業人員，目的是在明確許可下識別並發掘出弱點。滲透測試人員的首要目標是:找出系統、網路和應用方面的弱點表明弱點對現實世界的影響幫助組織改善其安全態勢與惡意駭客(可選 A)或惡意軟體作者(可選 B 和 D)不同的是，穿透測試者在嚴格的法律和道德準則下運作，遵循接觸範圍和負責任地報告調查結果。 CEH v13 強調滲透測試是主動防禦，而不是犯罪。 因此，選項 C 準確定義了角色。"},{"n":636,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a red team operation on a segmented enterprise network, the testers discover that the organization's perimeter devices deeply inspect only connection-initiation packets (such as TCP SYN and HTTP requests). Response packets and ACK packets within established sessions, however, are minimally inspected. The red team needs to covertly transmit payloads to an internal compromised host by blending into normal session traffic. Which approach should they take to bypass these defensive mechanisms?","o":["Port knocking","SYN scanning","ICMP flooding","ACK tunneling"],"a":[3],"e":"CEH)教導說，某些先進的入侵逃逸技術依賴於對防火牆如何區分出新的連線和既定的流量的理解。 大部分周邊防火牆仔細檢查 SYN 封包和初始 HTTP 請求，但允許已建立的工作階段的 ACK 封包透過最小過濾。 ACK 地道透過將惡意有效酬載嵌入 ACK 封包內部來利用這種行為，這似乎是合法，預先確定的工作階段的一部分。 因為 ACK 封包經常被認為是\"安全的\"，它們繞過深檢查引擎，入侵探測系統，以及應用層閘道器。 CEH 在討論繞行狀態的防火牆和使惡意流量看起來合法時，提到了這種逃逸策略。連接埠敲門和 SYN 掃描將啟動新的連線--正是防火牆正在大量檢查的東西。ICMP 泛洪是吵鬧的，很容易被探測出。ACK 隧道是專門為隱蔽設計的，與紅隊貿易工具相配合，以避免封包級檢查機制。","s":"term"},{"n":637,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"In the crisp mountain air of Denver, Colorado, ethical hacker Lila Chen investigates the security framework of MediVault, a U.S.-based healthcare platform used by regional clinics to manage patient data. During her review, Lila discovers that sensitive records are weakly protected, allowing attackers to intercept and manipulate the information in transit. She warns that such weaknesses could be exploited to commit credit- card fraud, identity theft, or similar crimes. Further analysis reveals that MediVault is vulnerable to well- documented flaws such as cookie snooping and downgrade attacks. Which issue is MOST clearly indicated?","o":["Broken Access Control","Cryptographic Failures","Security Misconfiguration","Identification and Authentication Failures"],"a":[1],"e":"最好的答案是 B。 Cryptographic Excellences，因為情境集中在對過境敏感資料的保護薄弱，使攻擊者能夠攔截和操縱資訊。 在 符合 CEH 的網路和應用安全概念(並符合現代網路風險類別)中，當應用程式沒有正確使用密碼學或安全運輸保護以確保敏感資料的機密性和完整性時，會發生加密故障。 如果運輸 加密 缺少、軟弱或設定不正確，攻擊者可以進行中間人 樣式攔截、篡改流量、竊取工作階段 材料並過濾受管制的資料--導致身分盜竊和付款卡欺詐等結果，正如所述。提到Cookie 偷窺和降級攻擊，進一步強化了這一點。 Cookie snooping 通常與工作階段 Cookie 因運輸不安全(例如缺少HTTPS，內容混雜，或 cookie 缺少安全屬性)而暴露於外，允許攻擊者在網路路徑上到達。抓取 工作階段 識別符號和劫持帳戶。當攻擊者強迫連線使用更弱的安全設定(如更古老的 TLS 版本或不安全的密碼套件)或當缺少或錯誤應用像 HSTS這樣的保護時強迫從 HTTPS 回落到 HTTP 時，就會發生降級攻擊。這兩個問題都與不適當的加密設定和運輸層安全缺陷緊密相聯。為什麼其他選項不是最佳匹配 : 中斷的存取控制涉及授權--允許使用者存取的--而不是流量的擷取/manipulation。和認證失敗側重於登入/工作階段身分機制(密碼， MFA，。 工作階段處理)。 但這裡的關鍵失敗是 加密保護的薄弱環節用於傳輸中的資料 安全設定錯誤可以是促成原因(例如:被錯誤地設定為 TLS)，但問題強調由此而來的弱點類別--不充分的密碼/transport 保護--使密碼故障成為最精確的答案。因此，MediVault 暴露在被攔截，被操縱，被 Cookie 偷窺，和被降級攻擊中，最清楚地表明瞭密碼故障。","s":"term"},{"n":638,"c":"系統入侵階段","ce":"System Hacking Phases","t":"short","q":"A penetration tester detects malware on a system that secretly records all keystrokes entered by the user. What type of malware is this?","o":["Rootkit","Ransomware","Keylogger","Worm"],"a":[2],"e":"CEH v13 解釋道:鍵盤側錄程式是一種間諜軟體，旨在秘密地捕捉使用者輸入，經常儲存或傳送所俘獲的資料--如密碼，電子郵件，聊天資訊，以及財務資訊--給攻擊者。 keyloggers 可以作為軟體，韌體，或硬體被執行，它們在背景中默默操作而不影響系統效能，使得它們成為認證資訊被竊取的理想。 CEH 在 System Hacking 相中常用的間諜和監控惡意軟體下，將 keyloggers 歸類為升級權限或一旦收割認證資訊後橫向移動。 與隱藏程序或加密檔案的勒索軟體的 rootkits 不同，鍵盤側錄程式的主要目的為被動監視。 CEH 強調攻擊者如何在入侵後部署金鑰採集器或使用 phishing/社交工程來欺騙被害者安裝它們。 他們的秘密性質和透過偽裝來繞過傳統 AV 解決方案的能力是:合法程式使得在法證和事件應對活動期間識別這些證據至關重要。","s":"term"},{"n":639,"c":"雲端運算","ce":"Cloud Computing","t":"short","q":"One customer's malicious activity impacts other tenants. Which control would best prevent this?","o":["Strong encryption","Secure log management","Multi-tenant isolation","Strong authentication"],"a":[2],"e":"在 CEH v13 雲端運算中，多租房是一個核心的雲特性--但是如果隔離控制薄弱，也是一種重大風險。 當一個租戶的行動影響到其他人時，問題幾乎總是不充分的隔離。在租戶之間多租戶隔離確保計算、儲存、記憶體和網路資源嚴格分離。 沒有適當的隔離，惡意租戶可以:共享資源用盡存取相鄰虛擬機器損害供應商的聲譽加密和認證保護了資料存取，但不會停止跨租戶撞擊。 loging 幫助偵測出事件，但不會防止。 CEH v13 強調強有力的邏輯隔離機制--如超常硬化和租戶分化--是關鍵的雲安全控制。 因此，選項 C 是正確答案。","s":"term"},{"n":640,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester is assessing a web application that uses dynamic SQL queries for searching users in the database. The tester suspects the search input field is vulnerable to SQL injection. What is the best approach to confirm this vulnerability?","o":["Input DROP TABLE users; -- into the search field to test if the database query can be altered","Inject JavaScript into the search field to test for Cross-Site Scripting (XSS)","Use a directory traversal attack to access server configuration files","Perform a brute-force attack on the user login page to guess weak passwords"],"a":[0],"e":"CEH 解釋說，SQL 注入測試應該從控制，故意操控 SQL 語法開始，以確定使用者輸入是否被不適當地調校到後端查詢中去。 雖然在現實世界的道德駭客交易中不建議使用 DROPTABLE 等破壞性查詢，但 CEH 使用此方法。例如，SQLi 如何影響資料庫命令的概念演示。在實踐中，滲透測試人員將更安全地使用“ OR” 1 = “ 1” 等良性同義詞來測試是否返回未經授權的資料。然而，在 CEH 的理論框架範圍內，注入一個明顯惡意的 SQL 命令，表明輸入是否在資料庫級別被執行。 這驗證了不適當的消毒，使用了動態的 SQL 查詢，以及缺少參數化的輸入處理。 CEH 強調 SQLi 是最關鍵的弱點之一，因為它允許攻擊者繞過認證，過濾資料，或操縱資料庫結構。 XSS，野蠻強制，目錄的 transversal 不會測試 SQL 查詢操作，因此不會確認 SQL 注入。"},{"n":641,"c":"資訊安全與道德駭客概論","ce":"Information Security and Ethical Hacking Overview","t":"mid","q":"In a bustling tech firm in Seattle, Michael, an ethical hacker, is conducting a security assessment to identify potential risks. During his evaluation, he notices that sensitive employee details and system configurations have been exposed through public forums, likely due to careless online behavior. His manager suspects this could lead to unauthorized access or data theft. As part of his testing, what type of threat should Michael focus on to simulate the adversary ' s method of gathering this exposed information?","o":["Corporate Espionage","Social Engineering","System and Network Attacks","Information Leakage"],"a":[3],"e":"資訊外洩是最準確的威脅類別，因為情境中心是敏感資料透過意外披露而公開取得。 在 CEH 覆蓋中，資訊外洩是指透過過度共享、設定錯誤、操作安全性差或資訊處理不當向未經授權的當事方披露機密或內部細節。 這裡，資料已經在公共論壇上可見，這意味著攻擊者一開始不需要直接利用一個系統中的弱點；他們可以簡單地蒐集和關聯曝光的細節，如員工姓名，電子郵件格式，內部主機名稱，軟體版本，設定片段，IP 範圍，或截圖等。這與 CEH 中強調的偵察和 OSINT 技術非常吻合:對手經常取得公開的資訊來建構攻擊計劃，識別特權目標，猜取使用者名稱，工藝釣魚誘餌，定位外部曝光的服務，或者利用被披露的版本和設定來裁剪進一步開發。 儘管社交工程可以是一個後續步驟，但描述的核心問題並不是說服人。相反，該組織的風險來自由於不小心的線上行為而已經洩露的資訊。公司間諜活動是一個動機，而不是一個具體的技術類別，系統和網路攻擊描述了在情報蒐集階段之後出現的主動利用和入侵企圖。因此，為了模擬對手蒐集已暴露內容的方法，邁克爾應該專注於資訊洩漏:確定哪些資訊被公開披露，如何加以彙總，以及它能夠透過哪些攻擊路徑，然後建議遏制以及政策和意識控制。","s":"term"},{"n":642,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"A penetration tester is assessing a mobile application and discovers that the app is vulnerable to improper session management. The session tokens are not invalidated upon logout, allowing the tokens to be reused. What is the most effective way to exploit this vulnerability?","o":["Perform a replay attack by using the same session token after the user logs out","Use a Cross-Site Request Forgery (CSRF) attack to steal the session tokens","Use a brute-force attack to guess valid session tokens","Execute a SQL injection attack to retrieve session tokens from the database"],"a":[0],"e":"在 CEH 的 Web 應用程式和行動裝置安全模組中，不當的工作階段管理被定義為未能執行工作階段過期，權杖無效，或安全地執行工作階段生命週期控制。登入後不會使 工作階段 權杖無效， 攻擊者可以透過進行回放攻擊來利用 : 重新使用先前捕獲的工作階段識別碼來冒充使用者 並獲得未經授權的存取。CEH 教人們重放活的代幣是最簡單的 和最直接的開發方法 因為不需要猜測 或偷取新權杖--攻擊者只是重新使用一個有效的應被作廢的權杖。 CSRF 依賴於對使用者活動值工作階段的利用。 不需要， 需要嗎？ 當攻擊者已經擁有了可重複使用的標誌時。 粗糙的工作階段權杖在計算上是昂貴而不必要的。 SQL 注入與工作階段生命週期缺陷無關，除非直接暴露於權杖儲存中。 因此，回放攻擊是正確的開發方法。"},{"n":643,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"mid","q":"A penetration tester is tasked with assessing the security of a smart home IoT device that communicates with a mobile app over an unencrypted connection. The tester wants to intercept the communication and extract sensitive information. What is the most effective approach to exploit this vulnerability?","o":["Perform a brute-force attack on the device ' s Wi-Fi credentials","Use a man-in-the-middle (MitM) attack to intercept and analyze the unencrypted traffic","Execute a SQL injection attack on the IoT device's cloud management portal","Use a dictionary attack to guess the admin login credentials of the device"],"a":[1],"e":"IoT 裝置經常會受弱或缺失的加密協定所影響，為攻擊者創造了攔截敏感資訊的機會。 CEH 課程軟體強調當裝置到應用程式的通訊發生時。明文，一箇中間人攻擊成為最有效的開發方法之一。 透過在裝置與移動應用程式之間定位，攻擊者可以觀察所有傳輸的資料，包括設定更新，認證符，和個人資訊等。 Wireshark， mitmproxy 等工具， 以及專門的 IoT 擷取框架， 使測試者能夠捕捉封包， 解碼協定， 並重建應用邏輯。 CEH 課程強調評價 IoT 裝置通訊通道的重要性， 因為很多都依賴於無擔保的 HTTP 或專有的明文協定。 SQL 注入或字典攻擊並非直接針對裝置 - - 應用通訊路徑，也不會利用這裡存在的基本弱點:缺少加密。 MitM 攻擊直接利用了這一缺陷，並提供了所有傳輸資料的全面可見度，使其成為最有效的和符合 CEH 的開發方法。"},{"n":644,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"As a security analyst, you are testing a company's network for potential vulnerabilities. You suspect an attacker may be using MAC flooding to compromise network switches and sniff traffic. Which of the following indicators would most likely confirm your suspicion?","o":["An increased number of ARP requests in network traffic.","Multiple MAC addresses assigned to a single IP address.","Multiple IP addresses assigned to a single MAC address.","Numerous MAC addresses associated with a single switch port."],"a":[3],"e":"經認證的道德駭客 (CEH)網路與邊界入侵模組描述為以交換器 CAM (內容可定址記憶體)表格為目標的攻擊。 攻擊者將交換器與訊框一起傳送出偽造的 MAC 位址，將交換器強制到廣播的流量像集線器。選項 D 是正確指標，因為 MAC 位址泛洪導致許多不同的 MAC 位址在單個交換器連接埠上被學習到，這是異常行為。 CEH 檔案將這識別為 MAC 位址泛洪攻擊的主要法證標誌。選項 A 與 ARP 欺騙而不是 MAC 位址泛洪關係更密切。選項 B 可能發生在網路設定錯誤中，但並不是主要 MAC 位址泛洪指標。選項 C 在 NAT 環境中很常見，本身並非惡意。 CEH 強調監測 CAM 錶行為和連接埠安全違規，以有效偵測 MAC 位址泛洪攻擊。"},{"n":645,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"long","q":"In the bustling financial hub of Charlotte, North Carolina, ethical hacker Raj Patel is contracted by TrustBank, a regional US bank, to evaluate their online loan application portal. On April 22, 2025, Raj tests a feature allowing customers to upload structured financial documents for loan processing. By submitting a specially crafted document, he triggers a response that exposes internal server file paths and sensitive configuration data, including database connection strings. The issue arises from the portal ' s handling of external references in document parsing, not from response manipulation, authentication weaknesses, or undetected attack attempts. Raj compiles a detailed report to assist TrustBank ' s security team in mitigating the vulnerability. Which type of vulnerability is Raj most likely exploiting in TrustBank ' s online loan application portal?","o":["Identification and Authentication Failures","HTTP Response Splitting","XML External Entity (XXE) Injection","Security Logging and Monitoring Failures"],"a":[2],"e":"描述出的弱點是 XML 外部實體 (XXE) 注入的特徵。 在 CEHWeb 應用程式安全覆蓋中，XXE 發生於應用程式在不適當解除外部實體解析度的情況下剖析出 XML 輸入時。 如果 XML 解析器設定不安全，攻擊者可以定義一個引用本機檔案或內部系統資源的惡意外部實體。 當解析器處理 XML 檔案時，它解決了外部實體，並可能返回伺服器回覆中敏感檔案的內容。情境明確宣告，這個問題出自\"檔案解析中處理外部引用\"，並導致內部檔案路徑和資料庫連線字串被曝光。 這直接與XXE 行為對接，攻擊者利用外部實體宣告來取回本機檔案，如設定檔，環境設定，或系統認證資訊等。 在某些情況下，XXE 還可以透過強迫伺服器發出內部網路請求來使伺服器-側請求被允許。其他選項與描述的行為不符。 識別和認證失敗涉及不適當的存取控制，而不是檔案解析。 HTTP 回應分拆涉及操縱標頭來注入惡意回應。 安全記錄與監控失敗是指偵測弱點，而不是透過解析。 CEH 推薦的緩解策略包括:使 DTD 處理功能失效，以 XML 解析器關閉外部實體解析度，驗證輸入格式，對檔案存取實施最少的特權，以及使用安全解析庫來防止 XXE 被開發。","s":"term"},{"n":646,"c":"行動平台與 IoT 攻擊","ce":"Mobile Platform and IoT Hacking","t":"long","q":"A cybersecurity research team identifies suspicious behavior on a user's Android device. Upon investigation, they discover that a seemingly harmless app, downloaded from a third-party app store, has silently overwritten several legitimate applications such as WhatsApp and SHAREit. These fake replicas maintain the original icon and user interface but serve intrusive advertisements and covertly harvest credentials and personal data in the background. The attackers achieved this by embedding malicious code in utility apps like video editors and photo filters, which users were tricked into installing. The replacement occurred without user consent, and the malicious code communicates with a command-and-control (C & C) server to execute further instructions. What type of attack is being carried out in this scenario?","o":["Simjacker attack","Man-in-the-Disk attack","Agent Smith attack","Camfecting attack"],"a":[2],"e":"CEH v13 描述 Smith 特工式攻擊是惡意的 Android 操作，即一個應用軟體透過利用 Android 應用軟體更新和安裝過程中的弱點而靜悄悄地取代合法應用。 這些攻擊往往在使用者從不信任的第三方市場下載看起來無辜的應用時開始。 惡意應用程式安裝後會將有害程式碼注入到其他應用程式中，在保留其圖示和介面的同時將它們覆蓋，允許攻擊者收割認證資訊，顯示廣告，或者在沒有被偵測的情況下保持持久性。 CEH 解釋道，這種技術利用了 Android 的 APK 結構，側負載弱點，在受損環境中缺乏簽名驗證。 Simjacker(可選 A) 目標為 SIM 工具包弱點，不取代 app。 Man-in-the-Disk(可選 B) 濫用外部儲存操作，但並不覆蓋應用程式。 Camfecting(可選 D) 指的是劫持智慧手機相機。 所描述的惡意替換合法應用完全匹配 Agent Smith 攻擊模式。","s":"term"},{"n":647,"c":"社交工程","ce":"Social Engineering","t":"mid","q":"As part of an annual security awareness program at BrightPath Consulting in Denver, Colorado, the cybersecurity team conducts an ethical hacking experiment to test employee vigilance against physical social engineering threats. During a simulated attack, ethical hacker Liam Carter strategically places a USB drive labeled \"Confidential 2025 Budget Plans\" in the company's parking lot, designed to look like it was accidentally dropped. The USB is programmed to install a harmless tracking script when plugged into a workstation, alerting the security team. Sarah, a project coordinator, finds the USB and considers plugging it into her office laptop to identify its owner. What social engineering technique is being tested in this experiment?","o":["Phishing","Hoax","Pretexting","Baiting"],"a":[3],"e":"劇情清晰地描述了誘餌，即 CEH 中包含的以人為主的攻擊下的一種物理克社交工程技術。 誘餌是指用一些吸引或誘人的東西引誘受害者，如自由軟體、機密檔案或有價值資訊，以欺騙他們損害安全。 在這種情況下，USB 驅動器被刻意貼上\" Confidentive 2025 Badvention Plans\"的標籤，這個計劃旨在引發好奇心和緊迫性。 攻擊者依賴於人類心理學，具體來說是好奇心和所感知到的重要性，以激勵目標將裝置插入公司系統。與一般透過電子郵件或電子通訊來進行打魚不同，打餌往往涉及物理媒體，如在停車場或遊說樓等公共場所留下的 USB 驅動器。 CEH 材料強調攻擊者可以預先將此類裝置裝入在插入時自動執行的惡意軟體，允許進入內部網路。 儘管這一實驗使用了無害的追蹤指令碼，但該方法反射出真實世界的攻擊，惡意的有效酬載可以建立後門，分解出資料，或者部署勒索軟體。 Hoaxes 傳播虛假警告以製造恐慌，但不一定需要與物理裝置進行互動。 Pretition 涉及透過對話或互動來編造一種情境或身分來從目標直接取得資訊。 使用被貼有誘餌資訊標籤的戰略定位 USB 與誘餌定義完全一致。 這一測試加強了禁止使用未知可移動媒體和促進僱員認識培訓的政策的重要性。","s":"term"},{"n":648,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During an internal penetration test within a large corporate environment, the red team gains access to an unrestricted network port in a public-facing meeting room. The tester deploys an automated tool that sends thousands of DHCPDISCOVER requests using randomized spoofed MAC addresses. The DHCP server's lease pool becomes fully depleted, preventing legitimate users from obtaining IP addresses. What type of attack did the penetration tester perform?","o":["DHCP starvation","Rogue DHCP relay injection","DNS cache poisoning","ARP spoofing"],"a":[0],"e":"DHCP 飢餓是一種網路級攻擊，攻擊者發出大量 DHCPDISCOVER 請求，每個請求似乎來自不同的 MAC 位址。 CEH 課程軟體解釋道:DHCP 伺服器根據獨特的 MAC 位址分配 IP 租賃，當租賃池用完後，合法的用戶端無法獲得有效的 IP 設定。這擾亂了網路連線，可以作為部署無賴 DHCP 伺服器的前奏，使得能進一步進行流量重新導向或認證資訊擷取等攻擊。DHCP 飢餓與操縱 MAC-IP 對映的 ARP 欺騙不同，或者 DNS 毒化， 它腐蝕了域解析度。 Rogue DHCP 中繼攻擊涉及轉發 DHCP 封包到未經授權的伺服器，而不是耗盡租賃。 描述的情境--快速 MAC 位址欺騙和耗盡 DHCP 租賃--與 CEH 材料中記載的 DHCP 飢餓的精確定義相匹配。","s":"term"},{"n":649,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"mid","q":"During a red team assessment at a banking client in Chicago, ethical hacker David gains access to the internal LAN. He sets up a test machine and injects crafted messages into the network. Soon, all traffic between a finance workstation and the authentication server is silently routed through his system without changing switch configurations. He observes usernames and passwords passing through his interface, even though no proxy or VPN is in use. Which sniffing technique did David most likely use?","o":["Switch Port Stealing","ARP Spoofing","STP Attack","IRDP Spoofing"],"a":[1],"e":"正確答案是 B。 ARP 欺騙，因為所描述的結果--透過攻擊者的主機在不改變交換器設定的情況下將兩個主機之間的流量輕而易舉地調整在 LAN 上--是 ARP 欺騙(也叫 ARP 欺騙)的經典效果。 在符合 CEH 網路嗅探和中間人(MITM)技術中，ARP 欺騙透過將被偽造的 ARP 回覆傳送到本機網路來工作，使被害者主機將攻擊者的 MAC 位址與合法系統的 IP 位址(通常為預設閘道器或另一個目標主機)聯絡起來。 一旦被害者被毒死後，打算前往真正目的地的訊框被送往攻擊者，攻擊者然後可以將其轉發到合法的主機，在檢查或改變流量時維持連線。劇情中稱大衛\"注入了被設計出的資訊\"，然後\"財務工作站和身分驗證伺服器之間的所有流量都默默地透過他的系統進行通路\"，這一行為強烈地表明瞭 ARP 欺騙雙向執行:毒害工作站以相信攻擊者是身分驗證伺服器(或閘道器)並毒害了伺服器以相信攻擊者是工作站(或閘道器)。 這使得可以觀察到認證資訊的 MITM 位置透明， 特別是協定沒有加密， 或攻擊者可以降級或脫去保護。 “ 沒有代理或 VPN 正在使用”支援在本機端段上 2/Layer3 層進行重定向而不是透過明確的應用級代用的想法。為什麼其他選項的準確性不高:交換器連接埠竊取目標交換器 CAM 表格重定向訊框，但直接描述的卻不如 ARP 快取兩個 IP 端點之間的中毒。 STP 攻擊會操縱橫跨樹成為根橋並會影響路徑，但這是不同的控制平面攻擊，通常會影響更廣闊的地層 2 地貌。 IRDP 欺騙涉及 ICMP 路由器發現協定，以廣告作流氓路由器，但情境符合切換 LAN 上更常見更直接的 MITM 嗅探技術:ARP 欺騙。因此，大衛最有可能使用 ARP 欺騙。","s":"term"},{"n":650,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"During an internal red team engagement at Orion Tech Labs, a leading software firm in Austin, Texas, ethical hacker Emily Carter was tasked with evaluating the resilience of the organization ' s software deployment processes. Knowing that the finance team frequently downloaded utility tools for generating PDFs, she repackaged a trusted PDF converter installer with a secondary payload. When an employee executed the installer, the converter installed and functioned normally, but in the background, a hidden executable silently initiated outbound network communication. The user remained unaware of any suspicious activity. Which technique did Emily most likely use to ensure the malware executed alongside the legitimate application?","o":["Downloader","Packer","Dropper","Wrapper"],"a":[3],"e":"一個包裝器是最準確的選擇，因為它描述了一種技術，即一個合法程式被惡意的酬載捆綁在一起，這樣當使用者發射一個看起來是普通安裝器或應用程式時，真正的軟體和惡意軟體執行。 CEH 材料通常在特洛伊化的背景下解釋包裝: 攻擊者“ wraps” 一個可信任的可執行或安裝器， 並帶有額外的隱藏元件。 這儲存了正常的功能， 以避免懷疑， 同時仍然實現惡意軟體碼的秘密執行。 在情境中，PDF 轉換器按預期安裝和工作，但隱藏的可執行檔靜默地執行並開始出界通訊--這是典型的包裝行為，旨在透過正常的使用者體驗來保持使用者信任並減少偵測。其他選項也不適合。 下載器是惡意軟體，其主要目的是從網路擷取更多的有效酬載；雖然這裡有外出通訊，但設想方案強調與合法安裝器捆綁並同時執行，而不是主要下載。 包機用於壓縮/obfuscate 可執行檔案以逃避以簽名為基礎的偵測；它改變了二進位外觀，但並沒有內在地描述一個合法的安裝器與另一個酬載的結合。 滴出器被設計為將惡意軟體送出並安裝到一個系統中，常常會擷擷取酬載；然而，這裡的標誌性細節是，正當應用程式正常執行，而惡意元件則隱藏在同一個包內，這更精確地與一個包裝器/Trojanized 安裝器對接。防禦性地，CEH 推薦諸如應用程式允許清單，驗證數位簽章和雜湊等控制，使用可信賴的軟體暫存器，端點偵測和回應，以及監控軟體安裝後異常出入境的連線。","s":"term"},{"n":651,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hacking","t":"short","q":"Which technique is commonly used by attackers to evade firewall detection?","o":["Spoofing source IP addresses to appear trusted","Using open-source operating systems","Using encrypted communication channels","Social engineering employees"],"a":[2],"e":"CEH v13 確定加密通訊通道為最常用的通道之一 和有效防火牆逃逸技術。 防火牆 依靠封包檢查的 或基於簽名的過濾往往無法檢查沒有 SSL/TLS 攔截能力的加密有效酬載。透過加密惡意流量--使用 HTTPS，VPN 隧道，或加密的 C2 通道--攻擊者可以繞過檢查封包內容的防火牆規則。 CEH v13 強調，這一技術被廣泛應用於惡意軟體通訊，資料過濾，以及命令與控制操作中。 IP 欺騙(備選 A) 受入侵限制 和 Egrees 過濾 並且對現代防火牆效果較差。 開源作業系統(可選取 B)內在不迴避防火牆.社交工程(可選取 D)針對使用者， 而不是防火牆， 無法使用。因此，選項 C 是正確和符合 CEH 的答案。"},{"n":652,"c":"偵察技術","ce":"Reconnaissance Techniques","t":"mid","q":"A cybersecurity analyst monitors competitors' web content for changes indicating strategic shifts. Which missing component is most crucial for effective passive surveillance?","o":["Participating in competitors' blogs and forums","Setting up Google Alerts for competitor names and keywords","Using a VPN to hide the analyst's IP address","Hiring a third party to hack competitor databases"],"a":[1],"e":"CEH 足跡和偵察模組凸顯出 Google Alerts 是監測網頁內容，新聞，和線上引用變化的一鍵被動偵察工具。選項 B 是正確的。備選辦法 A 是積極參與。備選辦法 C 有助於匿名，但不能進行監測。選項 D 是非法的，不道德的。 CEH 大力促進競爭性智慧的自動警報。"},{"n":653,"c":"惡意軟體威脅","ce":"Malware Threats","t":"mid","q":"A financial technology firm in Atlanta, Georgia launches an internal investigation after multiple employees report that a popular messaging application on their Android devices has begun displaying excessive advertisements and behaving unpredictably. Security analysts discover that users had installed a utility application from a third-party marketplace weeks earlier. Further examination shows that this application silently replaced certain legitimate apps already present on the device. The compromised applications were then used to generate large volumes of advertisements and collect user data for external transmission. Based on the observed behavior, what malware is most consistent with this incident?","o":["Mamo","Pegasus","Agent Smith","GoldPickaxe"],"a":[2],"e":"行為描述得最貼切的是 Android 惡意軟體家族 Smith，該家族以更換或劫持合法應用程式並使用廣告欺詐和資料濫用手段將存取權貨幣化而聞名。 最強的線索是第三方市場的安裝、已經安裝的應用程式的靜態替換，以及在蒐集資訊時使用這些被修改的應用程式來推動過度的廣告。 在 CEH 移動平台討論中，第三方應用生態系統被反覆認定為惡意或 trojanized 軟體的高風險發售路徑，因為應用可能避免與官方市場相關的更嚴格的審查。 Pegasus 一般與先進的間諜軟體能力和隱蔽監視有關，而不是由欺詐驅動來取代流行應用。 GoldPickaxe 與目標更明確的移動認證資訊和身分盜竊運動有關，而Mamo 並不是這裡合適的惡意軟體設定。測試一種知名的 Android 惡意軟體模式的識別:惡意軟體碼嵌入了一種顯然有用的應用程式中，後來濫用了已經手機上的合法應用程式的信任和能見度。 CEH 行動裝置安全原理強調非官方應用程式來源大大增加了這種妥協的風險。","s":"term"},{"n":654,"c":"惡意軟體威脅","ce":"Malware Threats","t":"long","q":"During a late-night shift at IronWave Logistics in Seattle, cybersecurity analyst Marcus Chen notices a pattern of high-port outbound traffic from over a dozen internal machines to a previously unseen external IP. Each system had recently received a disguised shipping report, which, when opened, initiated a process that spread autonomously to other workstations using shared folders and stolen credentials. Upon investigation, Marcus discovers that the machines now contain hidden executables that silently accept remote instructions and occasionally trigger coordinated background tasks. The compromised endpoints are behaving like zombies, and malware analysts confirm that the payload used worm-like propagation to deliver a backdoor component across the network. Which is the most likely objective behind this attack?","o":["To exfiltrate sensitive information and tracking data","To execute a ransomware payload and encrypt all data","To establish a botnet for remote command and control","To deploy a Remote Access Trojan (RAT) for stealthy surveillance"],"a":[2],"e":"這個情境中最強的指標是，多個受損害的主機是\"像殭屍一樣行為\"，在高階端埠向一個陌生的外部 IP 通訊，在執行\"協調的背景任務\"的同時\"悄悄地接受遠端指令\"。 在符合 CEH 的惡意軟體術語中，這些是殭屍網路的標誌性特徵: 受感染端點的集合(bots/zombies)在集中或半集中指揮和控制下)。類似蠕蟲的傳播解釋這種妥協如何在內部網路中迅速擴充套件--使用共享資料夾並被竊取的認證資訊進行橫向傳播，而“後門元件”則在系統被感染後提供持久的遙控功能。 許多宿主間被觀察到的協調強烈地表明攻擊者的目標不僅僅是單個監視一款機器，而是同時對多臺機器進行可伸縮的遙控。選項 A(資料過濾)在許多入侵中是可信的，但問題強調跨越許多端點的管絃和遠端任務，而不是從特定存放地進行有針對性的盜竊。選項B 不一致，因為沒有提及加密、贖金說明或以干擾為重點的行為。 選項 D，一個 RAT，一般描述對主機的遙控，但情境的界定特徵是建立出許多具有協調行為的\"殭屍\"--這更準確地與為命令與控制所建的殭屍網路相匹配，這在後來可用於資料被竊取，DDoS，垃圾郵件，或進一步的入侵操作。 CEH 防守指導包括:監測相向飛行異常，探測 C2 模式，分道揚鑣。網路可以限制蠕蟲傳播，使不必要的股份失效，執行強認證資訊衛生，並使用 EDR 識別後門和相向運動行為。"},{"n":655,"c":"無線網路攻擊","ce":"Wireless Network Hacking","t":"mid","q":"You are Ava Mitchell, an ethical hacker at Sentinel Cyberworks, hired to test the wireless defenses of Horizon Financial, a bank in Boston, Massachusetts. During a covert night-time assessment, your objective is to simulate an attacker attempting to breach the bank ' s WPA-protected Wi-Fi network. You deploy a tool that allows you to capture wireless packets, send de-authentication packets to force client reconnections, and attempt to recover the encryption key, all within a single graphical interface. Based on the described functionality, which Wi-Fi security auditing tool are you using?","o":["Fern WiFi Cracker","RFProtect","Cisco Adaptive Wireless IPS","WatchGuard Wi-Fi Cloud WIPS"],"a":[0],"e":"該工具描述匹配了 Fern WiFi Cracker，因為 CEH 無線評估工作流程通常參考 GUI-基於審計的公用裝置，這些公用裝置結合了封包擷取，無線注入支援，以及一個介面中的關鍵恢復嘗試。 情境具體提到三個核心能力:捕獲無線封包，傳送去驗證訊框以觸發使用者端重聯，並試圖取回加密鍵。 這些步驟與 CEH 學習路徑中討論的典型的 WPA 斷開方法相配合:在使用者端連線時抓取 WPA 握手，透過傳送去驗證訊框來選擇性地強制重接，再用單詞表或野蠻力的方法對被俘握手進行脫線攻擊。 Fern WiFi Cracker 以透過圖形介面呈現這些功能而出名，使其成為\"全能\"Wi-Fi 審計工具的常見例子。其他選擇是防禦性監測和預防平台，而不是用於積極去驗證客戶或嘗試關鍵恢復的進攻性審計工具。 RF Protect， Cisco 適應性有線 IPS，和 WatchGuard Wi-Fi Cloud WIPS 是無線入侵預防與監測解決方案，旨在偵測無線無線基地台，識別出諸如去驗證泛洪等攻擊，執行無線安全政策，併為安全小組生成警報。 它們被用來阻止或應對襲擊，而不是作為評估的一部分進行封包擷取+金鑰回收嘗試。由於問題強調一個單一的圖形介面，能夠擷取流量，注入 deauth 訊框，並嘗試關鍵恢復，因此選擇中的正確匹配是 Fern WiFi Cracker。","s":"tool"},{"n":656,"c":"惡意軟體威脅","ce":"Malware Threats","t":"short","q":"Malware remains dormant until triggered and changes its code with each infection. What malware type is responsible, and how should it be mitigated?","o":["Adware","Polymorphic malware","Worm","Rootkit"],"a":[1],"e":"此情境與多型惡意軟體完全吻合，這是被 CEH v13 惡意軟體威脅描述的一類高階惡意軟體。 多型惡意軟體每次傳播時都會動態地改變其程式碼，加密，或簽名，使其能逃避傳統的基於簽名的防毒偵測。此外，惡意軟體在被觸發前保持休眠的能力表明以邏輯為基礎的活化，這在為避免沙箱偵測而設計的高階威脅中很常見。 CEH v13 強調多型惡意軟體無法使用靜態簽名可靠地被偵測出。 相反，各組織必須依賴基於行為的偵測，heuristic 分析，以及能夠識別出可疑執行時行為的高階威脅保護系統。選項 A、C 和 D 與描述的行為不匹配。 Adware 專注於廣告。 蠕蟲自我宣傳很激烈。 Rootkits 專注於隱形和持久性，而不是程式碼突變。因此，選項 B 是正確答案。","s":"term"},{"n":657,"c":"資安維運與事件回應","ce":"Security Operations and Incident Response","t":"short","q":"Which patch management strategy is most effective?","o":["External-only patches","Automated patch management with monitoring","Manual patching on live servers","Applying all patches regardless of source"],"a":[1],"e":"CEH v13 將自動化的修補程式管理確定為最有保障和可擴充套件的方法。 自動化工具確保及時部署，驗證，回滾能力，以及合規報告。手動修補程式會增加人為錯誤。 應用未知源的修補程式會引入惡意軟體風險。 限制修補程式會與最佳做法相矛盾。因此，選項 B 是正確的。","s":"term"},{"n":658,"c":"Web 應用程式攻擊","ce":"Web Application Hacking","t":"mid","q":"During a code review at a defense technology contractor in Virginia, penetration tester Lucas identifies that a newly deployed payroll application encrypts sensitive employee data using a weak custom algorithm. In addition, its session validation logic allows certain requests to bypass access controls altogether. These oversights are traced back to flawed system logic and poor encryption design decisions made during the development phase. Which vulnerability category BEST describes the issue Lucas discovered?","o":["Design Flaws","Application Flaws","Misconfigurations/Weak Configurations","Poor Patch Management"],"a":[0],"e":"正確答案是 A。 Design Flaws， 因為這些弱點源於應用程式如何設計的基本開發時間決定-- 具體而言， (1) 選擇或建立一個弱自訂加密演算法； (2) 以允許請求繞過存取控制的方式實施工作階段驗證。 在符合 CEH 的弱點分類中，設計缺陷是應用程式設計和邏輯中嵌入的問題，而不僅僅是執行錯誤、伺服器設定中的設定錯誤或缺少的供應商修補程式造成的錯誤。它們往往是系統性的:即使程式碼“按預期運作”，意圖本身也是不安全的。即時宣告這些問題\"追溯到開發階段的有缺陷的系統邏輯和糟糕的加密設計決定\"。 該描述圖直接指向設計缺陷:使用\"出土密碼\"而不是經過稽核的密碼原始和協定是典型的設計錯誤，因為它通常缺乏適當的同行評審，威脅模型，以及經證明的對密碼分析的阻力。同樣， 工作階段驗證允許繞過存取控制，表示應用程式的授權/工作階段模型設計不正確(例如， 信任使用者端側狀態， 未能始終如一地執行伺服器側檢查， 或允許未經身分驗證的終端進入特權業務。為什麼其他選項的準確性較低: 應用程式缺陷是一個可以包含編碼錯誤的寬標籤，但問題在於，鑑於根源是建築決定，而不是一個狹義的編碼錯誤，所以要問的是最好的類別。 錯設定/weak 設定通常指部署中不安全的設定(預設認證資訊，允許頭，弱 TLS 設定)，而不是自訂的加密演算法和被烤入應用中的有缺陷的工作階段邏輯。 poor 修補程式管理擔心無法更新已知的脆弱元件；在這裡，弱點是自訂邏輯，而不是未標註的第三方弱點。因此，這些開發階段最準確的類別加密和工作階段/authorization 缺點是設計缺陷。","s":"term"},{"n":659,"c":"系統入侵階段","ce":"System Hacking Phases","t":"mid","q":"Following a suspected data breach at a pharmaceutical research lab in Cambridge, Massachusetts, forensic examiners identified several research documents that had been removed from normal directory listings on a compromised server. When analysts examined the physical storage sectors previously associated with those files, they found that the sector contents no longer matched the historical allocation records, and no recognizable fragments of the original material could be reconstructed. The disk structure itself remained intact, and the storage medium showed no signs of hardware-level destruction. Which anti-forensics technique best explains the attacker's actions in this scenario?","o":["Data Hiding in File System Structures","Data/File Deletion","Overwriting Data/Metadata","Artifact Wiping"],"a":[2],"e":"正確答案是 C。 覆蓋 Data/Metadata。關鍵線索是檔案內容無法被重建，因為物理區塊不再包含原始材料的可識別碎片。簡單刪除會從目錄結構中刪除檔案引用，但基礎資料在被覆蓋之前可能仍然可以被恢復。 此處，原區塊內容被替換，這表明被覆蓋。選項 A。 檔案系統結構中的資料隱藏是不正確的，因為資料沒有被隱藏在替代檔案系統位置或後設資料結構中。選項 B。 Data/File 刪除是不正確的，因為普通刪除通常會留下可收回的資料殘餘。選項 D。 Artifact Wiping 更寬泛，常指去除出日誌等痕跡，歷史，臨時檔案，或法證文物等。 情境具體描述替換了檔案部門內容。因此，最好的答案是 C。overwrite Data/Metadata。","s":"term"},{"n":660,"c":"網路與邊界攻擊","ce":"Network and Perimeter Hack
