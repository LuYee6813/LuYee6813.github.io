<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEH v13 考古題測驗</title>
  <style>
    :root {
      --bg: #0f1420;
      --card: #1a2233;
      --card2: #212c42;
      --text: #e8ecf4;
      --muted: #93a0b8;
      --accent: #4f8cff;
      --green: #2ecc8f;
      --red: #ff5d6c;
      --orange: #ffb347;
      --border: #2e3a54;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 4px;
    }

    .sub {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }

    .bank-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background .15s;
    }

    .bank-item:hover {
      background: var(--card2);
    }

    .bank-item input {
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
    }

    .bank-title {
      flex: 1;
    }

    .bank-count {
      color: var(--muted);
      font-size: .85rem;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
    }

    label.opt-label {
      color: var(--muted);
      font-size: .9rem;
    }

    select,
    input[type=number] {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: .95rem;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 26px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: filter .15s;
    }

    .btn:hover {
      filter: brightness(1.12);
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn.small {
      padding: 8px 16px;
      font-size: .88rem;
    }

    .mode-group {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .mode-btn {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card2);
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }

    .mode-btn.active {
      border-color: var(--accent);
      background: rgba(79, 140, 255, .14);
    }

    .mode-btn .t {
      font-weight: 700;
    }

    .mode-btn .d {
      font-size: .8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* quiz */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .progress-txt {
      color: var(--muted);
      font-size: .9rem;
    }

    .pbar {
      height: 6px;
      background: var(--card2);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .pbar>div {
      height: 100%;
      background: var(--accent);
      transition: width .25s;
    }

    .qsrc {
      font-size: .78rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .qtext {
      font-size: 1.05rem;
      font-weight: 600;
      white-space: pre-wrap;
      margin-bottom: 6px;
    }

    .qtext-en {
      font-size: .88rem;
      color: var(--muted);
      white-space: pre-wrap;
      margin-bottom: 6px;
    }

    .options {
      margin-top: 16px;
    }

    .opt {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }

    .opt:hover {
      background: var(--card2);
    }

    .opt .tag {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--card2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .82rem;
      font-weight: 700;
      color: var(--muted);
    }

    .opt .body {
      flex: 1;
    }

    .opt .oexpl {
      font-size: .82rem;
      color: var(--muted);
      margin-top: 6px;
      border-top: 1px dashed var(--border);
      padding-top: 6px;
    }

    .opt.selected {
      border-color: var(--accent);
      background: rgba(79, 140, 255, .12);
    }

    .opt.selected .tag {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .opt.correct {
      border-color: var(--green);
      background: rgba(46, 204, 143, .12);
    }

    .opt.correct .tag {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    .opt.wrong {
      border-color: var(--red);
      background: rgba(255, 93, 108, .12);
    }

    .opt.wrong .tag {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }

    .opt.locked {
      cursor: default;
    }

    .opt.locked:hover {
      background: inherit;
    }

    .opt.correct.locked:hover {
      background: rgba(46, 204, 143, .12);
    }

    .opt.wrong.locked:hover {
      background: rgba(255, 93, 108, .12);
    }

    .expl {
      margin-top: 16px;
      padding: 14px 16px;
      border-left: 3px solid var(--orange);
      background: var(--card2);
      border-radius: 0 10px 10px 0;
      font-size: .9rem;
      white-space: pre-wrap;
      color: #cfd8e8;
      max-height: 420px;
      overflow-y: auto;
    }

    .expl b {
      color: var(--orange);
    }

    .verdict {
      font-weight: 700;
      margin-top: 14px;
    }

    .verdict.ok {
      color: var(--green);
    }

    .verdict.no {
      color: var(--red);
    }

    .navrow {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .spacer {
      flex: 1;
    }

    /* result */
    .score-big {
      font-size: 3rem;
      font-weight: 800;
      text-align: center;
    }

    .score-sub {
      text-align: center;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .score-big.pass {
      color: var(--green);
    }

    .score-big.fail {
      color: var(--red);
    }

    .review-q {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      margin-top: 14px;
    }

    .hidden {
      display: none;
    }

    a {
      color: var(--accent);
    }

    .multi-hint {
      color: var(--orange);
      font-size: .82rem;
      margin-top: 4px;
    }

    /* profile + stats */
    .prow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .prow select {
      min-width: 130px;
    }

    .prow .grow {
      flex: 1;
    }

    .statsbox {
      margin-top: 14px;
      font-size: .85rem;
    }

    .stat-title {
      color: var(--muted);
      margin-bottom: 10px;
    }

    .muted {
      color: var(--muted);
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .bar-label {
      flex: 0 0 44%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .8rem;
    }

    .bar-wrap {
      flex: 1;
      height: 8px;
      background: var(--card2);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar {
      display: block;
      height: 100%;
      background: var(--orange);
    }

    .bar-num {
      flex: 0 0 26px;
      text-align: right;
      color: var(--muted);
      font-size: .8rem;
    }

    .wrong-item {
      border-color: var(--orange);
    }

    /* 瀏覽題庫模式 */
    .brow {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    #browseSearch {
      flex: 1;
      min-width: 180px;
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: .95rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: .82rem;
      cursor: pointer;
    }

    .chip:hover {
      border-color: var(--accent);
    }

    .chip.active {
      background: rgba(79, 140, 255, .16);
      border-color: var(--accent);
      color: #fff;
    }

    .chip-n {
      color: var(--muted);
      font-size: .75rem;
    }

    .chip.active .chip-n {
      color: #dbe6ff;
    }

    .qcard {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }

    .qcard-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .cat-chip {
      font-size: .72rem;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      color: var(--muted);
    }

    .qnum {
      font-size: .75rem;
      color: var(--muted);
    }

    .reveal-hint {
      display: none;
      font-size: .75rem;
      color: var(--accent);
      margin-left: auto;
    }

    .qcard-q {
      font-weight: 600;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }

    .qopt {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      margin-bottom: 8px;
    }

    .qopt .tag {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--card2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
      font-weight: 700;
      color: var(--muted);
    }

    .qopt-t {
      flex: 1;
    }

    .qopt.correct {
      border-color: var(--green);
      background: rgba(46, 204, 143, .12);
    }

    .qopt.correct .tag {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    .correct-mark {
      flex-shrink: 0;
      color: var(--green);
      font-weight: 700;
      font-size: .78rem;
    }

    .qcard-expl {
      margin-top: 6px;
    }

    .qcard-expl summary {
      cursor: pointer;
      color: var(--orange);
      font-size: .85rem;
    }

    .expl-body {
      white-space: pre-wrap;
      font-size: .86rem;
      color: #cfd8e8;
      margin-top: 8px;
      padding: 12px 14px;
      background: var(--card2);
      border-left: 3px solid var(--orange);
      border-radius: 0 8px 8px 0;
      max-height: 360px;
      overflow-y: auto;
    }

    /* 關鍵線索標示 */
    mark.kw {
      background: rgba(255, 179, 71, .2);
      color: #ffd9a0;
      border-radius: 4px;
      padding: 0 3px;
      font-weight: 700;
    }

    .kw-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 10px 0 4px;
    }

    .kw-lab {
      font-size: .75rem;
      color: var(--muted);
    }

    .kw-chip {
      font-size: .75rem;
      background: rgba(255, 179, 71, .14);
      border: 1px solid rgba(255, 179, 71, .35);
      color: var(--orange);
      border-radius: 12px;
      padding: 2px 9px;
    }

    /* 遮答案模式 */
    .mask-on .qcard {
      cursor: pointer;
    }

    .mask-on .qcard:not(.revealed) .qopt.correct {
      border-color: var(--border);
      background: transparent;
    }

    .mask-on .qcard:not(.revealed) .qopt.correct .tag {
      background: var(--card2);
      color: var(--muted);
      border-color: var(--border);
    }

    .mask-on .qcard:not(.revealed) .correct-mark {
      display: none;
    }

    .mask-on .qcard:not(.revealed) .qcard-expl {
      display: none;
    }

    .mask-on .qcard:not(.revealed) .reveal-hint {
      display: inline;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>CEH v13 考古題測驗</h1>
    <div class="sub">312-50v13 練習題庫 · 資料來源:考古 PDF</div>

    <!-- ===== 設定畫面 ===== -->
    <div id="setup">
      <div class="card" id="profileCard">
        <div class="prow">
          <b>使用者</b>
          <select id="profileSel"></select>
          <button class="btn ghost small" id="addProfileBtn">新增</button>
          <button class="btn ghost small" id="delProfileBtn">刪除</button>
          <span class="grow"></span>
          <button class="btn ghost small" id="exportBtn">匯出</button>
          <button class="btn ghost small" id="importBtn">匯入</button>
          <input type="file" id="importFile" accept="application/json" class="hidden">
        </div>
        <div class="statsbox" id="statsBox"></div>
      </div>
      <div class="card">
        <b>選擇題庫</b>
        <div id="bankList" style="margin-top:12px;"></div>
        <div class="row">
          <label class="opt-label">題數:
            <select id="numQ">
              <option value="10">10 題</option>
              <option value="25" selected>25 題</option>
              <option value="50">50 題</option>
              <option value="125">125 題(模擬正式考試)</option>
              <option value="0">全部</option>
            </select>
          </label>
          <label class="opt-label"><input type="checkbox" id="shuffleQ" checked> 隨機出題順序</label>
          <label class="opt-label"><input type="checkbox" id="shuffleOpt" checked> 隨機選項順序</label>
        </div>
        <div class="mode-group">
          <div class="mode-btn active" data-mode="practice">
            <div class="t">練習模式</div>
            <div class="d">每題作答後立即顯示答案與解析</div>
          </div>
          <div class="mode-btn" data-mode="exam">
            <div class="t">考試模式</div>
            <div class="d">全部作答完才顯示成績與檢討</div>
          </div>
        </div>
        <div class="row">
          <button class="btn" id="startBtn">開始測驗</button>
          <button class="btn ghost" id="browseBtn">瀏覽題庫(看題對答案)</button>
        </div>
      </div>
    </div>

    <!-- ===== 測驗畫面 ===== -->
    <div id="quiz" class="hidden">
      <div class="topbar">
        <span class="progress-txt" id="progTxt"></span>
        <span class="progress-txt" id="scoreTxt"></span>
        <button class="btn ghost small" id="quitBtn">結束測驗</button>
      </div>
      <div class="pbar">
        <div id="pfill" style="width:0%"></div>
      </div>
      <div class="card">
        <div class="qsrc" id="qsrc"></div>
        <div class="qtext" id="qtext"></div>
        <div class="qtext-en" id="qtextEn"></div>
        <div id="qkw"></div>
        <div class="multi-hint hidden" id="multiHint">※ 此題為複選題,請選擇所有正確答案</div>
        <div class="options" id="opts"></div>
        <div class="verdict hidden" id="verdict"></div>
        <div class="expl hidden" id="expl"></div>
        <div class="navrow">
          <button class="btn ghost" id="prevBtn">上一題</button>
          <div class="spacer"></div>
          <button class="btn" id="submitBtn">送出答案</button>
          <button class="btn" id="nextBtn">下一題</button>
        </div>
      </div>
    </div>

    <!-- ===== 結果畫面 ===== -->
    <div id="result" class="hidden">
      <div class="card">
        <div class="score-big" id="scoreBig"></div>
        <div class="score-sub" id="scoreSub"></div>
        <div class="navrow" style="justify-content:center;">
          <button class="btn" id="retryWrongBtn">重測答錯題目</button>
          <button class="btn ghost" id="backBtn">回到首頁</button>
        </div>
      </div>
      <div class="card" id="reviewCard">
        <b>答錯題目檢討</b>
        <div id="reviewList"></div>
      </div>
    </div>

    <!-- ===== 瀏覽題庫畫面 ===== -->
    <div id="browse" class="hidden">
      <div class="topbar">
        <b>瀏覽題庫 · CEHv13 完整情境題庫</b>
        <button class="btn ghost small" id="browseBackBtn">回到首頁</button>
      </div>
      <div class="card">
        <div class="brow">
          <input type="text" id="browseSearch" placeholder="搜尋題目或選項關鍵字...">
          <label class="opt-label"><input type="checkbox" id="showKw" checked> 標示關鍵線索</label>
          <label class="opt-label"><input type="checkbox" id="hideAns"> 遮住答案(點卡片顯示)</label>
        </div>
        <div id="catChips" class="chips"></div>
      </div>
      <div class="sub" id="browseCount"></div>
      <div id="browseList"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const LETTERS = 'ABCDEFGH';

    /* ---------- 使用者 / 錯題存檔 (localStorage) ---------- */
    const PKEY = 'ceh_profiles', CKEY = 'ceh_current', DKEY = n => 'ceh_data_' + n;

    function jget(k, fallback) {
      try {
        const v = JSON.parse(localStorage.getItem(k));
        return v == null ? fallback : v;
      } catch (e) {
        return fallback;
      }
    }
    const loadProfiles = () => jget(PKEY, []);
    const saveProfiles = p => localStorage.setItem(PKEY, JSON.stringify(p));
    const curProfile = () => localStorage.getItem(CKEY) || '';
    const setCur = n => localStorage.setItem(CKEY, n);
    const loadData = n => jget(DKEY(n), { wrong: {} });
    const saveData = (n, d) => localStorage.setItem(DKEY(n), JSON.stringify(d));

    function ensureProfile() {
      let ps = loadProfiles();
      if (!ps.length) { ps = ['預設']; saveProfiles(ps); }
      let c = curProfile();
      if (!c || !ps.includes(c)) { c = ps[0]; setCur(c); }
      return c;
    }

    // 題目索引:用 bankId#num 找回原題,供錯題複習
    const QIDX = {};
    BANKS.forEach(b => b.questions.forEach(q => {
      QIDX[b.id + '#' + q.num] = { q, bankId: b.id, bankTitle: b.title };
    }));

    const wrongList = () => Object.values(loadData(curProfile()).wrong || {});
    const wrongCount = () => wrongList().length;

    // 每次測驗結束把作答結果寫進目前使用者:答錯累積、答對則移除(視為已掌握)
    function recordResult() {
      const name = curProfile();
      const d = loadData(name);
      d.wrong = d.wrong || {};
      quiz.forEach((q, i) => {
        const st = answered[i];
        if (!st.picked.size) return; // 只記錄實際有作答的題目
        const key = q.bankId + '#' + q.num;
        if (st.correct) {
          if (d.wrong[key]) delete d.wrong[key];
        } else {
          const e = d.wrong[key] || {
            bankId: q.bankId, num: q.num, bankTitle: q.bank,
            category: q.category || '', cnt: 0
          };
          e.cnt++;
          e.ts = Date.now();
          d.wrong[key] = e;
        }
      });
      saveData(name, d);
    }

    // 目前錯題依領域分組(弱項統計)
    function domainStats() {
      const m = {};
      wrongList().forEach(e => {
        const c = e.category || '未分類';
        m[c] = (m[c] || 0) + 1;
      });
      return Object.entries(m).sort((a, b) => b[1] - a[1]);
    }

    function renderProfile() {
      ensureProfile();
      const sel = $('profileSel');
      const ps = loadProfiles(), c = curProfile();
      sel.innerHTML = ps.map(n =>
        `<option value="${escapeHtml(n)}" ${n === c ? 'selected' : ''}>${escapeHtml(n)}</option>`
      ).join('');
      renderStats();
    }

    function renderStats() {
      const wc = wrongCount(), box = $('statsBox');
      if (!wc) {
        box.innerHTML = '<span class="muted">目前沒有錯題紀錄，去測驗後答錯的題目會存在這裡。</span>';
        return;
      }
      const ds = domainStats(), max = ds[0][1];
      box.innerHTML = `<div class="stat-title">目前累積錯題 <b>${wc}</b> 題 · 弱項領域分布(答對即自動移除)</div>` +
        ds.map(([c, n]) =>
          `<div class="bar-row"><span class="bar-label" title="${escapeHtml(c)}">${escapeHtml(c)}</span>` +
          `<span class="bar-wrap"><span class="bar" style="width:${Math.round(n / max * 100)}%"></span></span>` +
          `<span class="bar-num">${n}</span></div>`
        ).join('');
    }

    let mode = 'practice';
    let quiz = []; // [{bank, q, options[{text,isAns}], shuffledIdx...}]
    let cur = 0;
    let answered = []; // per question: {picked:Set, submitted:bool, correct:bool}

    /* ---------- 設定畫面 ---------- */
    function renderSetup() {
      renderProfile();
      const list = $('bankList');
      list.innerHTML = '';
      const total = BANKS.reduce((s, b) => s + b.questions.length, 0);

      // 錯題複習(依目前使用者)
      const wc = wrongCount();
      const wrongDiv = document.createElement('label');
      wrongDiv.className = 'bank-item wrong-item';
      wrongDiv.innerHTML = `<input type="checkbox" id="wrongReview" ${wc ? '' : 'disabled'}>
      <span class="bank-title"><b>我的錯題複習</b></span>
      <span class="bank-count">${wc} 題</span>`;
      list.appendChild(wrongDiv);

      const allDiv = document.createElement('label');
      allDiv.className = 'bank-item';
      allDiv.innerHTML = `<input type="checkbox" id="allBanks">
      <span class="bank-title"><b>總考題(全部題庫、已去重)</b></span>
      <span class="bank-count">${total} 題</span>`;
      list.appendChild(allDiv);
      BANKS.forEach((b, i) => {
        const div = document.createElement('label');
        div.className = 'bank-item';
        div.innerHTML = `<input type="checkbox" data-i="${i}" ${i === BANKS.length - 1 ? 'checked' : ''}>
      <span class="bank-title">${b.title}${b.lang === 'zh' ? '(中文)' : '(英文)'}</span>
      <span class="bank-count">${b.questions.length} 題</span>`;
        list.appendChild(div);
      });
      $('allBanks').onchange = e => {
        document.querySelectorAll('#bankList input[data-i]').forEach(x => {
          x.checked = e.target.checked;
        });
      };
    }
    document.querySelectorAll('.mode-btn').forEach(el => {
      el.onclick = () => {
        document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        mode = el.dataset.mode;
      };
    });

    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    $('startBtn').onclick = () => {
      const wrongOn = $('wrongReview') && $('wrongReview').checked;
      const chosen = $('allBanks').checked
        ? BANKS.map((_, i) => i)
        : [...document.querySelectorAll('#bankList input[data-i]:checked')].map(x => +x.dataset.i);
      if (!chosen.length && !wrongOn) {
        alert('請至少選擇一個題庫或錯題複習');
        return;
      }
      let pool = [];
      const have = new Set();
      chosen.forEach(i => {
        BANKS[i].questions.forEach(q => {
          have.add(BANKS[i].id + '#' + q.num);
          pool.push({ bank: BANKS[i].title, bankId: BANKS[i].id, ...q });
        });
      });
      if (wrongOn) {
        wrongList().forEach(e => {
          const key = e.bankId + '#' + e.num, rec = QIDX[key];
          if (rec && !have.has(key)) {
            have.add(key);
            pool.push({ bank: rec.bankTitle, bankId: rec.bankId, ...rec.q });
          }
        });
      }
      if (!pool.length) {
        alert('沒有可出的題目');
        return;
      }
      if ($('shuffleQ').checked) shuffle(pool);
      const n = +$('numQ').value;
      if (n > 0) pool = pool.slice(0, n);
      const shufOpt = $('shuffleOpt').checked;
      quiz = pool.map(q => {
        let opts = q.options.map((t, i) => ({
          text: t,
          isAns: q.answers.includes(i),
          oi: i
        }));
        if (shufOpt) shuffle(opts);
        return {
          ...q,
          opts
        };
      });
      answered = quiz.map(() => ({
        picked: new Set(),
        submitted: false,
        correct: false
      }));
      cur = 0;
      startQuiz(pool.length);
    };

    function startQuiz() {
      $('setup').classList.add('hidden');
      $('result').classList.add('hidden');
      $('quiz').classList.remove('hidden');
      renderQ();
    }

    /* ---------- 測驗畫面 ---------- */
    function renderQ() {
      const q = quiz[cur],
        st = answered[cur];
      $('progTxt').textContent = `第 ${cur + 1} / ${quiz.length} 題`;
      const done = answered.filter(a => a.submitted || a.picked.size).length;
      const ok = answered.filter(a => a.submitted && a.correct).length;
      const doneSub = answered.filter(a => a.submitted).length;
      $('scoreTxt').textContent = mode === 'practice' && doneSub ? `答對 ${ok} / ${doneSub}` : '';
      $('pfill').style.width = (done / quiz.length * 100) + '%';
      $('qsrc').textContent = `${q.bank} · 原題號 Q${q.num}`;
      // 關鍵線索只在作答後顯示,避免提前洩漏答案
      const revealKw = st.submitted && mode === 'practice';
      $('qtext').innerHTML = revealKw ? highlightKw(q.q, q.kw) : escapeHtml(q.q);
      $('qtextEn').textContent = q.q_en || '';
      $('qkw').innerHTML = revealKw ? kwRow(q.kw) : '';
      $('multiHint').classList.toggle('hidden', q.answers.length <= 1);

      const box = $('opts');
      box.innerHTML = '';
      const locked = st.submitted && mode === 'practice';
      q.opts.forEach((o, i) => {
        const div = document.createElement('div');
        div.className = 'opt' + (locked ? ' locked' : '');
        if (st.picked.has(i)) div.classList.add('selected');
        let oexpl = '';
        if (locked) {
          div.classList.remove('selected');
          if (o.isAns) div.classList.add('correct');
          else if (st.picked.has(i)) div.classList.add('wrong');
          if (q.expl_opts && q.expl_opts[o.oi])
            oexpl = `<div class="oexpl">${escapeHtml(q.expl_opts[o.oi])}</div>`;
        }
        div.innerHTML = `<span class="tag">${LETTERS[i]}</span><span class="body">${escapeHtml(o.text)}${oexpl}</span>`;
        if (!locked) div.onclick = () => togglePick(i);
        box.appendChild(div);
      });

      // verdict + explanation
      const showFb = st.submitted && (mode === 'practice');
      $('verdict').classList.toggle('hidden', !showFb);
      $('expl').classList.toggle('hidden', !(showFb && q.explanation));
      if (showFb) {
        $('verdict').textContent = st.correct ? '答對了!' : '答錯了,正確答案:' +
          q.opts.map((o, i) => o.isAns ? LETTERS[i] : null).filter(Boolean).join('、');
        $('verdict').className = 'verdict ' + (st.correct ? 'ok' : 'no');
        $('expl').textContent = q.explanation || '';
      }

      $('prevBtn').disabled = cur === 0;
      $('submitBtn').classList.toggle('hidden', mode === 'exam' || st.submitted);
      $('submitBtn').disabled = st.picked.size === 0;
      $('nextBtn').textContent = cur === quiz.length - 1 ? '完成測驗' : '下一題';
      $('nextBtn').classList.remove('hidden');
    }

    function togglePick(i) {
      const q = quiz[cur],
        st = answered[cur];
      if (st.submitted && mode === 'practice') return;
      if (q.answers.length > 1) {
        st.picked.has(i) ? st.picked.delete(i) : st.picked.add(i);
      } else {
        st.picked.clear();
        st.picked.add(i);
      }
      renderQ();
    }

    function gradeCur() {
      const q = quiz[cur],
        st = answered[cur];
      st.submitted = true;
      const ansSet = new Set(q.opts.map((o, i) => o.isAns ? i : -1).filter(x => x >= 0));
      st.correct = ansSet.size === st.picked.size && [...st.picked].every(x => ansSet.has(x));
    }

    $('submitBtn').onclick = () => {
      const st = answered[cur];
      if (!st.picked.size) return;
      gradeCur();
      renderQ();
    };

    function goNext() {
      const st = answered[cur];
      // 練習模式:已選答案但未送出時,先判分並顯示解析
      if (mode === 'practice' && !st.submitted && st.picked.size) {
        gradeCur();
        renderQ();
        return;
      }
      if (cur < quiz.length - 1) {
        cur++;
        renderQ();
      } else finish();
    }
    $('nextBtn').onclick = goNext;
    $('prevBtn').onclick = () => {
      if (cur > 0) {
        cur--;
        renderQ();
      }
    };
    $('quitBtn').onclick = () => {
      if (confirm('確定要結束測驗並查看成績?')) finish();
    };

    /* ---------- 結果畫面 ---------- */
    function finish() {
      // 考試模式:結束時統一判分
      answered.forEach((st, i) => {
        if (!st.submitted) {
          st.submitted = true;
          const ansSet = new Set(quiz[i].opts.map((o, j) => o.isAns ? j : -1).filter(x => x >= 0));
          st.correct = st.picked.size > 0 && ansSet.size === st.picked.size && [...st.picked].every(x => ansSet.has(x));
        }
      });
      recordResult();
      const total = quiz.length;
      const ok = answered.filter(a => a.correct).length;
      const pct = Math.round(ok / total * 100);
      $('quiz').classList.add('hidden');
      $('result').classList.remove('hidden');
      $('scoreBig').textContent = pct + '%';
      $('scoreBig').className = 'score-big ' + (pct >= 70 ? 'pass' : 'fail');
      $('scoreSub').textContent = `答對 ${ok} / ${total} 題(CEH 及格線約 60%–85%,常以 70% 為基準)`;

      const wrong = quiz.map((q, i) => ({
        q,
        st: answered[i]
      })).filter(x => !x.st.correct);
      const list = $('reviewList');
      list.innerHTML = '';
      $('reviewCard').classList.toggle('hidden', wrong.length === 0);
      wrong.forEach(({
        q,
        st
      }) => {
        const div = document.createElement('div');
        div.className = 'review-q';
        const ansLetters = q.opts.map((o, i) => o.isAns ? LETTERS[i] : null).filter(Boolean).join('、');
        const pickedLetters = [...st.picked].sort().map(i => LETTERS[i]).join('、') || '未作答';
        let optHtml = q.opts.map((o, i) => {
          const oexpl = q.expl_opts && q.expl_opts[o.oi] ?
            `<div class="oexpl">${escapeHtml(q.expl_opts[o.oi])}</div>` : '';
          return `<div class="opt locked ${o.isAns ? 'correct' : (st.picked.has(i) ? 'wrong' : '')}">
        <span class="tag">${LETTERS[i]}</span><span class="body">${escapeHtml(o.text)}${oexpl}</span></div>`;
        }).join('');
        div.innerHTML = `<div class="qsrc">${q.bank} · 原題號 Q${q.num}</div>
      <div class="qtext">${highlightKw(q.q, q.kw)}</div>
      ${q.q_en ? `<div class="qtext-en">${escapeHtml(q.q_en)}</div>` : ''}
      ${kwRow(q.kw)}
      <div class="options">${optHtml}</div>
      <div class="verdict no">你的答案:${pickedLetters} → 正確答案:${ansLetters}</div>
      ${q.explanation ? `<div class="expl">${escapeHtml(q.explanation)}</div>` : ''}`;
        list.appendChild(div);
      });
      window.__wrongSet = wrong.map(x => x.q);
    }

    $('retryWrongBtn').onclick = () => {
      const wrong = window.__wrongSet || [];
      if (!wrong.length) {
        alert('沒有答錯的題目!');
        return;
      }
      quiz = wrong.map(q => {
        let opts = q.options.map((t, i) => ({
          text: t,
          isAns: q.answers.includes(i),
          oi: i
        }));
        shuffle(opts);
        return {
          ...q,
          opts
        };
      });
      shuffle(quiz);
      answered = quiz.map(() => ({
        picked: new Set(),
        submitted: false,
        correct: false
      }));
      cur = 0;
      startQuiz();
    };
    $('backBtn').onclick = () => {
      $('result').classList.add('hidden');
      $('setup').classList.remove('hidden');
      renderSetup();
    };

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, c =>
        ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        } [c]));
    }

    /* ---------- 關鍵線索標示 ---------- */
    // 在題幹中把關鍵字圈起來(只標第一次出現、不重疊)
    function highlightKw(text, kws) {
      if (!kws || !kws.length) return escapeHtml(text);
      const low = text.toLowerCase(), spans = [];
      kws.forEach(k => {
        if (!k) return;
        const i = low.indexOf(k.toLowerCase());
        if (i < 0) return;
        const s = i, e = i + k.length;
        if (spans.some(([a, b]) => !(e <= a || s >= b))) return;
        spans.push([s, e]);
      });
      spans.sort((a, b) => a[0] - b[0]);
      let out = '', pos = 0;
      spans.forEach(([s, e]) => {
        out += escapeHtml(text.slice(pos, s)) +
          '<mark class="kw">' + escapeHtml(text.slice(s, e)) + '</mark>';
        pos = e;
      });
      return out + escapeHtml(text.slice(pos));
    }

    function kwRow(kws) {
      if (!kws || !kws.length) return '';
      return '<div class="kw-row"><span class="kw-lab">關鍵線索</span>' +
        kws.map(k => `<span class="kw-chip">${escapeHtml(k)}</span>`).join('') + '</div>';
    }

    /* ---------- 使用者管理 ---------- */
    $('profileSel').onchange = e => { setCur(e.target.value); renderSetup(); };

    $('addProfileBtn').onclick = () => {
      const n = (prompt('輸入新使用者名稱:') || '').trim();
      if (!n) return;
      const ps = loadProfiles();
      if (!ps.includes(n)) ps.push(n);
      saveProfiles(ps);
      setCur(n);
      renderSetup();
    };

    $('delProfileBtn').onclick = () => {
      const ps = loadProfiles(), c = curProfile();
      if (ps.length <= 1) { alert('至少要保留一個使用者'); return; }
      if (!confirm(`確定刪除使用者「${c}」及其所有錯題紀錄?`)) return;
      localStorage.removeItem(DKEY(c));
      const rest = ps.filter(x => x !== c);
      saveProfiles(rest);
      setCur(rest[0]);
      renderSetup();
    };

    $('exportBtn').onclick = () => {
      const name = curProfile();
      const payload = { profile: name, data: loadData(name), exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ceh_錯題_' + name + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
    };

    $('importBtn').onclick = () => $('importFile').click();
    $('importFile').onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const obj = JSON.parse(r.result);
          const inc = (obj.data && obj.data.wrong) || obj.wrong || {};
          const name = curProfile();
          const d = loadData(name);
          d.wrong = d.wrong || {};
          let add = 0;
          Object.entries(inc).forEach(([k, v]) => {
            if (!d.wrong[k]) { d.wrong[k] = v; add++; }
            else { d.wrong[k].cnt = Math.max(d.wrong[k].cnt || 1, v.cnt || 1); }
          });
          saveData(name, d);
          renderSetup();
          alert(`匯入完成，新增 ${add} 題錯題到「${name}」`);
        } catch (err) {
          alert('匯入失敗:檔案格式不正確');
        }
      };
      r.readAsText(f);
      e.target.value = '';
    };

    /* ---------- 瀏覽題庫模式(看題對答案) ---------- */
    const CEH797 = BANKS.find(b => b.id === 'CEH_V13_797_Scenario');
    let browseCat = '全部';

    function browseCats() {
      const m = {};
      CEH797.questions.forEach(q => { const c = q.category || '未分類'; m[c] = (m[c] || 0) + 1; });
      return Object.entries(m).sort((a, b) => b[1] - a[1]);
    }

    function renderChips() {
      const items = [['全部', CEH797.questions.length], ...browseCats()];
      $('catChips').innerHTML = items.map(([c, n]) =>
        `<button class="chip ${c === browseCat ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)} <span class="chip-n">${n}</span></button>`
      ).join('');
      $('catChips').querySelectorAll('.chip').forEach(b => b.onclick = () => {
        browseCat = b.dataset.cat;
        renderChips();
        renderBrowseList();
      });
    }

    function renderBrowseList() {
      const kw = ($('browseSearch').value || '').trim().toLowerCase();
      let list = CEH797.questions;
      if (browseCat !== '全部') list = list.filter(q => (q.category || '未分類') === browseCat);
      if (kw) list = list.filter(q =>
        q.q.toLowerCase().includes(kw) || q.options.some(o => o.toLowerCase().includes(kw)));

      $('browseCount').textContent = `共 ${list.length} 題` +
        (browseCat !== '全部' ? ` · ${browseCat}` : '') + (kw ? ` · 關鍵字「${kw}」` : '');

      const box = $('browseList');
      box.className = $('hideAns').checked ? 'mask-on' : '';
      box.innerHTML = list.map(q => {
        const opts = q.options.map((t, i) => {
          const ok = q.answers.includes(i);
          return `<div class="qopt ${ok ? 'correct' : ''}"><span class="tag">${LETTERS[i]}</span>` +
            `<span class="qopt-t">${escapeHtml(t)}</span>${ok ? '<span class="correct-mark">正確答案</span>' : ''}</div>`;
        }).join('');
        const kwOn = $('showKw').checked;
        return `<div class="qcard">
          <div class="qcard-head"><span class="cat-chip">${escapeHtml(q.category || '')}</span>` +
          `<span class="qnum">原題號 Q${q.num}</span><span class="reveal-hint">點擊顯示答案</span></div>
          <div class="qcard-q">${kwOn ? highlightKw(q.q, q.kw) : escapeHtml(q.q)}</div>
          ${kwOn ? kwRow(q.kw) : ''}
          <div class="qcard-opts">${opts}</div>
          <details class="qcard-expl"><summary>解析</summary><div class="expl-body">${escapeHtml(q.explanation || '')}</div></details>
        </div>`;
      }).join('');

      box.querySelectorAll('.qcard').forEach(card => card.onclick = e => {
        if (!$('hideAns').checked) return;
        if (e.target.closest('.qcard-expl')) return; // 讓解析的展開/收合正常運作
        card.classList.toggle('revealed');
      });
    }

    function openBrowse() {
      ['setup', 'quiz', 'result'].forEach(id => $(id).classList.add('hidden'));
      $('browse').classList.remove('hidden');
      renderChips();
      renderBrowseList();
    }

    $('browseBtn').onclick = openBrowse;
    $('browseBackBtn').onclick = () => {
      $('browse').classList.add('hidden');
      $('setup').classList.remove('hidden');
      renderSetup();
    };
    $('browseSearch').oninput = renderBrowseList;
    $('hideAns').onchange = renderBrowseList;
    $('showKw').onchange = renderBrowseList;

    renderSetup();
  </script>
</body>

</html>
